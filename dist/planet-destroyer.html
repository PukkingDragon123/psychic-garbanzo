<title>Planet Destroyer</title>
<meta name="description" content="A 2D pixel-art mining sandbox: drill asteroids to the core, get obscenely rich, take over the galaxy.">
<style>
:root {
  --ink: #05030f;
  --grape: #1d1338;
  --edge: #5b3f96;
  --gold: #ffd34d;
  --pink: #ff5fa8;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--ink);
  color: #f2e9ff;
  font-family: "Courier New", ui-monospace, monospace;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}

#screen {
  display: block;
  width: 100vw;
  height: 100vh;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: crosshair;
  background: var(--ink);
}

/* Subtle scanline + vignette laid over the canvas for that CRT arcade feel. */
#crt {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.14) 0px,
      rgba(0, 0, 0, 0.14) 1px,
      rgba(0, 0, 0, 0) 1px,
      rgba(0, 0, 0, 0) 3px
    ),
    radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
  mix-blend-mode: multiply;
  opacity: 0.85;
  z-index: 5;
}

#boot {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: var(--ink);
  z-index: 10;
  text-align: center;
  padding: 24px;
}

#boot h1 {
  margin: 0;
  font-size: clamp(24px, 6vw, 54px);
  letter-spacing: 4px;
  color: var(--gold);
  text-shadow: 4px 4px 0 #7a2a10;
}

#boot h2 {
  margin: 0;
  font-size: clamp(18px, 4.5vw, 40px);
  letter-spacing: 3px;
  color: var(--pink);
  text-shadow: 4px 4px 0 #3a0c30;
}

#boot p { margin: 0; color: #9c8ec4; max-width: 34em; line-height: 1.5; }

#boot .err {
  color: #ff6b8a;
  border: 1px solid #8a2f4a;
  background: #200a18;
  padding: 10px 14px;
  max-width: 40em;
  text-align: left;
  white-space: pre-wrap;
}

.hidden { display: none !important; }

</style>

<canvas id="screen" width="960" height="540"></canvas>
<div id="crt"></div>
<div id="boot">
  <h1>PLANET</h1>
  <h2>DESTROYER</h2>
  <p>Loading the drill&hellip;</p>
</div>

<script>
/* ===== src/util.js ===== */
/* Planet Destroyer -- small math / helper library.
   Everything hangs off the single global PD namespace so the game can run
   straight off the filesystem (classic scripts, no module loader needed). */
window.PD = window.PD || {};

(function (PD) {
  'use strict';

  const TAU = Math.PI * 2;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function invLerp(a, b, v) { return b === a ? 0 : (v - a) / (b - a); }
  function smoothstep(a, b, v) { const t = clamp(invLerp(a, b, v), 0, 1); return t * t * (3 - 2 * t); }

  /* Frame-rate independent exponential approach: `t` is the fraction covered
     in one second. Used for camera and meter easing. */
  function damp(a, b, t, dt) { return lerp(a, b, 1 - Math.pow(1 - t, dt * 60)); }

  function rand(a, b) {
    if (a === undefined) return Math.random();
    if (b === undefined) return Math.random() * a;
    return a + Math.random() * (b - a);
  }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function chance(p) { return Math.random() < p; }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* table is [[value, weight], ...] */
  function weighted(table) {
    let total = 0;
    for (let i = 0; i < table.length; i++) total += table[i][1];
    let r = Math.random() * total;
    for (let i = 0; i < table.length; i++) {
      r -= table[i][1];
      if (r <= 0) return table[i][0];
    }
    return table[table.length - 1][0];
  }

  /* Deterministic hash noise -- keeps tile speckle stable between frames.
     Math.imul throughout: a plain float multiply here overflows 2^53 and
     silently throws away the low bits, which badly skews the distribution. */
  function hash2(x, y) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Cheap value noise built on hash2 -- plenty for ore veins and cave blobs. */
  function noise2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi), b = hash2(xi + 1, yi);
    const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }

  function fbm(x, y, octaves) {
    let sum = 0, amp = 0.5, norm = 0;
    for (let i = 0; i < (octaves || 3); i++) {
      sum += noise2(x, y) * amp;
      norm += amp;
      amp *= 0.5; x *= 2; y *= 2;
    }
    return sum / norm;
  }

  /* Turn "I want the top f fraction of tiles" into an fbm threshold.
     fbm() is roughly normal (mean ~0.52, sd ~0.15), so we go through a small
     inverse-normal table instead of guessing cutoffs. */
  const QZ = [
    [0.00, 3.2], [0.01, 2.33], [0.02, 2.05], [0.05, 1.645], [0.10, 1.282],
    [0.15, 1.036], [0.20, 0.842], [0.25, 0.674], [0.30, 0.524], [0.40, 0.253],
    [0.50, 0], [0.60, -0.253], [0.70, -0.524], [0.80, -0.842], [0.90, -1.282],
    [1.00, -3.2]
  ];
  function probitTop(f) {
    f = clamp(f, 0, 1);
    for (let i = 1; i < QZ.length; i++) {
      if (f <= QZ[i][0]) {
        const t = (f - QZ[i - 1][0]) / (QZ[i][0] - QZ[i - 1][0]);
        return lerp(QZ[i - 1][1], QZ[i][1], t);
      }
    }
    return -3.2;
  }
  function fbmThreshold(f, mean, sd) {
    return (mean === undefined ? 0.52 : mean) + (sd === undefined ? 0.15 : sd) * probitTop(f);
  }

  function dist(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return Math.sqrt(dx * dx + dy * dy); }
  function dist2(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; }

  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  /* Shortest signed angle from a to b. */
  function angleDelta(a, b) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }

  const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
  function fmt(n) {
    n = Math.floor(n);
    if (Math.abs(n) < 1000) return String(n);
    let tier = 0;
    let v = n;
    while (Math.abs(v) >= 1000 && tier < SUFFIX.length - 1) { v /= 1000; tier++; }
    const s = v < 10 ? v.toFixed(2) : (v < 100 ? v.toFixed(1) : v.toFixed(0));
    return s.replace(/\.0+$/, '') + SUFFIX[tier];
  }

  function fmtKg(kg) {
    return (kg < 10 ? kg.toFixed(1) : Math.round(kg).toString()) + 'kg';
  }

  function roman(n) {
    const map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
    let out = '';
    for (const [v, s] of map) { while (n >= v) { out += s; n -= v; } }
    return out || 'I';
  }

  PD.util = {
    TAU, clamp, lerp, invLerp, smoothstep, damp,
    rand, randInt, chance, pick, shuffle, weighted,
    hash2, mulberry32, noise2, fbm, probitTop, fbmThreshold,
    dist, dist2, aabb, angleDelta,
    fmt, fmtKg, roman
  };
})(window.PD);

/* ===== src/pix.js ===== */
/* A tiny pixel-pushing helper.
   Sprites are painted at their true pixel size with hard-edged primitives, then
   `outline()` traces a dark border around everything -- which is what gives the
   whole game its chunky cartoon look for free. */
(function (PD) {
  'use strict';

  function Pix(w, h) {
    this.w = w; this.h = h;
    this.d = new Array(w * h).fill(null);
  }

  Pix.prototype.idx = function (x, y) { return y * this.w + x; };

  Pix.prototype.set = function (x, y, c) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return this;
    this.d[y * this.w + x] = c;
    return this;
  };

  Pix.prototype.get = function (x, y) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null;
    return this.d[y * this.w + x];
  };

  Pix.prototype.rect = function (x, y, w, h, c) {
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c);
    return this;
  };

  /* A REAL ellipse, rasterised. This used to be an octagon -- the whole game
     was built on a rule that nothing could be round -- and the cost was that
     every planet in it looked like a cut gem rather than a world. It is a
     true ellipse now, drawn a whole pixel at a time, so it is round without
     ever being smooth: no anti-aliasing, no half-lit rim, just a circle made
     of squares the way a circle in a pixel game should be. */
  Pix.prototype.ellipse = function (cx, cy, rx, ry, c) {
    const x0 = Math.floor(cx - rx - 1), x1 = Math.ceil(cx + rx + 1);
    const y0 = Math.floor(cy - ry - 1), y1 = Math.ceil(cy + ry + 1);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
        if (dx * dx + dy * dy > 1) continue;
        this.set(x, y, c);
      }
    }
    return this;
  };

  Pix.prototype.disc = function (cx, cy, r, c) { return this.ellipse(cx, cy, r, r, c); };

  /* Bevelled rectangle: the corner is a straight 45-degree cut, never an arc. */
  Pix.prototype.round = function (x, y, w, h, r, c) {
    for (let j = 0; j < h; j++) {
      for (let i = 0; i < w; i++) {
        const px = i < r ? r - i - 0.5 : (i >= w - r ? i - (w - r) + 0.5 : 0);
        const py = j < r ? r - j - 0.5 : (j >= h - r ? j - (h - r) + 0.5 : 0);
        if (px + py > r) continue;
        this.set(x + i, y + j, c);
      }
    }
    return this;
  };

  Pix.prototype.line = function (x0, y0, x1, y1, c) {
    x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    for (;;) {
      this.set(x0, y0, c);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
    return this;
  };

  /* Isoceles triangle pointing up (dir -1) or down (dir 1). */
  Pix.prototype.spike = function (x, y, w, h, dir, c) {
    for (let j = 0; j < h; j++) {
      const t = j / h;
      const half = Math.max(0, (w / 2) * (1 - t));
      const yy = dir > 0 ? y + j : y + h - 1 - j;
      for (let i = -half; i <= half; i++) this.set(x + i, yy, c);
    }
    return this;
  };

  /* Mirror the left half onto the right half -- keeps faces symmetrical. */
  Pix.prototype.mirrorX = function () {
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w / 2; x++) {
        this.set(this.w - 1 - x, y, this.get(x, y));
      }
    }
    return this;
  };

  Pix.prototype.replace = function (from, to) {
    for (let i = 0; i < this.d.length; i++) if (this.d[i] === from) this.d[i] = to;
    return this;
  };

  /* Trace a border around every filled pixel. */
  Pix.prototype.outline = function (c) {
    const snap = this.d.slice();
    const at = (x, y) => (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : snap[y * this.w + x];
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        if (at(x, y)) continue;
        if (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1)) this.set(x, y, c);
      }
    }
    return this;
  };

  /* Darken the lower-right facing pixels of a colour to fake a light source. */
  Pix.prototype.shade = function (from, to, dx, dy) {
    const snap = this.d.slice();
    const at = (x, y) => (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : snap[y * this.w + x];
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        if (at(x, y) !== from) continue;
        const n = at(x + dx, y + dy);
        if (n === null || n !== from) this.set(x, y, to);
      }
    }
    return this;
  };

  Pix.prototype.toCanvas = function () {
    const cv = document.createElement('canvas');
    cv.width = this.w; cv.height = this.h;
    const ctx = cv.getContext('2d');
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        const c = this.d[y * this.w + x];
        if (!c) continue;
        ctx.fillStyle = c;
        ctx.fillRect(x, y, 1, 1);
      }
    }
    return cv;
  };

  PD.Pix = Pix;
  PD.pix = (w, h) => new Pix(w, h);
})(window.PD);

/* ===== src/glyph.js ===== */
/* The game's icon language. Every glyph is drawn procedurally at 12x12 and
   cached per colour, so the HUD, terminals and tutorial can speak without
   words: a bar plus a glyph plus a number is a sentence. */
(function (PD) {
  'use strict';
  const pix = PD.pix;
  const U = PD.util;

  const INK = '#1a1030';
  const builders = {};
  const cache = {};

  function def(name, fn) { builders[name] = fn; }

  /* Each builder draws in a single "paint" colour c, plus optional accent a. */
  def('coin', (p, c, a) => { p.disc(6, 6, 5, c); p.disc(6, 6, 3.2, a); p.rect(5, 3, 2, 6, c); p.rect(4, 4, 4, 1, c); p.rect(4, 7, 4, 1, c); });
  def('ore', (p, c, a) => { p.round(1, 4, 10, 7, 3, c); p.round(3, 1, 6, 5, 2, c); p.rect(3, 3, 3, 1, a); p.rect(2, 6, 2, 2, a); p.rect(7, 7, 2, 1, a); p.set(5, 2, '#ffffff'); });
  def('drill', (p, c, a) => { p.round(0, 4, 5, 4, 1, a); for (let x = 5; x < 12; x++) { const h = Math.max(0, 2.5 - (x - 5) * 0.4); for (let y = -h; y <= h; y++) p.set(x, Math.round(6 + y), (x + Math.round(y)) % 2 ? c : a); } });
  def('gun', (p, c, a) => { p.round(0, 4, 8, 4, 1, a); p.rect(2, 8, 2, 3, a); p.rect(8, 5, 4, 2, c); });
  def('scatter', (p, c, a) => { p.round(0, 4, 7, 4, 1, a); p.rect(2, 8, 2, 3, a); p.rect(7, 3, 5, 2, c); p.rect(7, 7, 5, 2, c); });
  def('lance', (p, c, a) => { p.round(0, 4, 6, 4, 1, a); p.rect(2, 8, 2, 3, a); p.rect(6, 5, 6, 2, c); p.rect(10, 3, 2, 6, c); });
  def('dash', (p, c, a) => { p.spike(8, 2, 8, 8, 1, c); p.rect(0, 4, 4, 1, a); p.rect(0, 6, 5, 1, a); p.rect(0, 8, 3, 1, a); });
  def('scan', (p, c, a) => { for (let t = 0; t < 6.3; t += 0.35) p.set(6 + Math.cos(t) * 5, 6 + Math.sin(t) * 5, a); p.disc(6, 6, 2, c); p.line(6, 6, 10, 2, c); });
  def('o2', (p, c, a) => { p.round(3, 2, 6, 10, 2, c); p.rect(4, 0, 4, 2, a); p.rect(5, 4, 2, 5, a); });
  def('hull', (p, c, a) => { p.round(2, 1, 8, 7, 2, c); p.spike(6, 6, 8, 5, 1, c); p.rect(5, 3, 2, 3, a); });
  def('cargo', (p, c, a) => { p.round(1, 3, 10, 8, 1, c); p.rect(1, 5, 10, 1, a); p.rect(5, 3, 2, 8, a); });
  def('weight', (p, c, a) => { p.spike(6, 4, 10, 7, 1, c); p.rect(2, 10, 8, 1, c); p.rect(5, 1, 2, 3, a); p.set(5, 1, c); p.set(6, 1, c); });
  def('planet', (p, c, a) => { p.disc(6, 6, 4.5, c); p.disc(4.5, 4.5, 1.5, a); p.disc(7.5, 7, 1, a); p.rect(0, 6, 12, 1, a); });
  def('hole', (p, c, a) => { p.disc(6, 6, 5.5, c); p.disc(6, 6, 3.6, a); p.disc(6, 6, 2, INK); p.set(9, 3, a); p.set(3, 9, a); });
  def('hand', (p, c, a) => { p.rect(5, 0, 3, 7, c); p.round(2, 5, 9, 7, 2, c); p.rect(1, 6, 2, 3, c); p.rect(9, 6, 2, 3, c); p.rect(6, 1, 1, 4, a); p.rect(4, 8, 5, 1, a); });
  def('arrowR', (p, c) => { p.rect(0, 5, 7, 2, c); p.spike(8, 2, 8, 4, 1, c); p.spike(8, 6, 8, 4, -1, c); p.rect(7, 4, 2, 4, c); });
  def('arrowD', (p, c) => { p.rect(5, 0, 2, 7, c); for (let i = 0; i < 4; i++) p.rect(2 + i, 6 + i, 8 - i * 2, 1, c); });
  def('arrowU', (p, c) => { p.rect(5, 5, 2, 7, c); for (let i = 0; i < 4; i++) p.rect(2 + i, 5 - i, 8 - i * 2, 1, c); });
  def('lock', (p, c, a) => { p.round(2, 5, 8, 7, 1, c); p.rect(3, 2, 6, 4, a); p.rect(4, 3, 4, 3, INK); p.rect(3, 2, 6, 1, a); p.rect(5, 7, 2, 3, INK); });
  def('check', (p, c) => { p.line(1, 6, 4, 10, c); p.line(2, 6, 5, 10, c); p.line(4, 10, 11, 2, c); p.line(5, 10, 11, 3, c); });
  def('cross', (p, c) => { p.line(1, 1, 10, 10, c); p.line(2, 1, 11, 10, c); p.line(10, 1, 1, 10, c); p.line(11, 1, 2, 10, c); });
  def('clock', (p, c, a) => { p.disc(6, 6, 5.5, c); p.disc(6, 6, 4.3, INK); p.rect(5, 2, 2, 5, a); p.rect(6, 6, 3, 2, a); });
  def('star', (p, c, a) => { p.spike(6, 0, 5, 6, 1, c); p.spike(6, 6, 5, 6, -1, c); p.rect(0, 5, 12, 2, c); p.disc(6, 6, 1.5, a); });
  def('skull', (p, c, a) => { p.round(2, 1, 8, 7, 3, c); p.rect(3, 3, 2, 2, INK); p.rect(7, 3, 2, 2, INK); p.rect(4, 7, 4, 2, c); p.rect(4, 8, 1, 2, c); p.rect(6, 8, 1, 2, c); p.set(5, 6, INK); p.set(6, 6, INK); });
  def('machine', (p, c, a) => { p.round(1, 4, 10, 7, 1, c); p.rect(2, 1, 3, 3, a); p.rect(7, 2, 2, 2, a); p.rect(3, 6, 6, 2, INK); p.rect(3, 6, 3, 2, a); });
  def('belt', (p, c, a) => { p.rect(0, 4, 12, 4, c); p.rect(1, 5, 2, 2, a); p.rect(5, 5, 2, 2, a); p.rect(9, 5, 2, 2, a); });
  def('crew', (p, c, a) => { p.disc(6, 3.5, 3, c); p.round(1, 7, 10, 5, 2, c); p.set(5, 3, INK); p.set(7, 3, INK); p.rect(3, 9, 6, 1, a); });
  def('home', (p, c, a) => { p.spike(6, 0, 12, 6, 1, c); p.rect(2, 6, 8, 6, c); p.rect(5, 8, 2, 4, INK); p.rect(3, 7, 2, 2, a); });
  def('bang', (p, c) => { p.rect(5, 0, 2, 7, c); p.rect(5, 9, 2, 2, c); });

  /* Upgrades are fabricated, not bought: every level burns raw ore out of the
     vault as well as credits, and high tiers demand exotic matter. */
  function recipe(u, level) {
    const out = [];
    for (const [key, base] of u.mats) {
      out.push({ mat: M[key], qty: Math.ceil(base * Math.pow(1.34, level)) });
    }
    if (u.late && level >= 5) {
      out.push({ mat: M[u.late[0]], qty: Math.ceil(u.late[1] * Math.pow(1.4, level - 5)) });
    }
    return out;
  }

    p.round(hx - 9, hy - 13, 14, 6, 3, skinL);           // a shiny bald dome
    p.round(hx - 15, hy - 2, 5, 10, 2, skin);            // ears, different heights
    p.round(hx + 10, hy - 5, 5, 10, 2, skin);
    p.set(hx - 14, hy + 2, skinD); p.set(hx + 13, hy - 1, skinD);
    p.rect(hx - 11, hy - 10, 11, 3, skinD);             // heavy brow, one side only
    p.rect(hx + 3, hy - 7, 8, 2, skinD);
    /* THE FACE. One enormous eye and one that gave up, in seven states. The
       big eye carries nearly all of it, because the moustache has the mouth. */
    const EYE_L = { x: hx - 11, y: hy - 8, w: 11, h: 13 };   // the big one
    const EYE_R = { x: hx + 4, y: hy - 5, w: 7, h: 7 };      // the small one
    const white = (e, sq) => p.round(e.x, e.y + (sq ? e.h * 0.25 : 0), e.w, sq ? e.h * 0.5 : e.h, Math.min(5, e.w / 2), C.white);
    const pupil = (e, dx, dy, r) => {
      p.disc(e.x + e.w / 2 + (dx || 0), e.y + e.h / 2 + (dy || 0), r || e.w / 3.4, C.eye);
      p.set(e.x + e.w / 2 + (dx || 0) - 2, e.y + e.h / 2 + (dy || 0) - 2, C.white);
    };
    const lid = (e, from) => { for (let i = 0; i < e.w; i++) p.rect(e.x + i, e.y + (from ? 0 : e.h - 2), 1, 2, skinD); };
    const cross = (e) => {
      const cx2 = e.x + e.w / 2, cy2 = e.y + e.h / 2, k = Math.min(e.w, e.h) / 2;
      p.line(cx2 - k, cy2 - k, cx2 + k, cy2 + k, C.ink);
      p.line(cx2 + k, cy2 - k, cx2 - k, cy2 + k, C.ink);
      p.line(cx2 - k, cy2 - k + 1, cx2 + k, cy2 + k + 1, C.ink);
    };
    const arc = (e) => {                                   // a happy upturned eye
      for (let i = 0; i < e.w; i++) {
        const t2 = i / (e.w - 1), dip = Math.round(Math.sin(t2 * Math.PI) * (e.h * 0.32));
        p.rect(e.x + i, e.y + e.h / 2 - dip, 1, 3, C.ink);
      }
    };
    if (face === 'blink') {
      p.rect(hx - 10, hy - 2, 9, 2, C.ink); p.rect(hx + 4, hy, 6, 2, C.ink);
    } else if (face === 'happy') {
      arc(EYE_L); arc(EYE_R);
    } else if (face === 'woozy') {
      white(EYE_L); white(EYE_R); cross(EYE_L); cross(EYE_R);
    } else if (face === 'shock') {
      // both eyes blown wide, pupils tiny
      p.round(EYE_L.x - 2, EYE_L.y - 3, EYE_L.w + 4, EYE_L.h + 5, 6, C.white);
      p.round(EYE_R.x - 2, EYE_R.y - 3, EYE_R.w + 4, EYE_R.h + 5, 5, C.white);
      p.disc(hx - 6, hy - 1, 1.6, C.eye); p.disc(hx + 7, hy - 1, 1.2, C.eye);
      p.rect(hx - 13, hy - 14, 12, 2, skinD); p.rect(hx + 3, hy - 12, 9, 2, skinD);
    } else if (face === 'cross') {
      white(EYE_L); white(EYE_R);
      pupil(EYE_L, 0, 1); pupil(EYE_R, 0, 1);
      // brows driven down into the middle
      for (let i = 0; i < 12; i++) p.rect(hx - 12 + i, hy - 10 + Math.round(i * 0.42), 2, 3, skinD);
      for (let i = 0; i < 8; i++) p.rect(hx + 12 - i, hy - 8 + Math.round(i * 0.42), 2, 3, skinD);
    } else if (face === 'smug') {
      white(EYE_L, true); white(EYE_R);
      pupil(EYE_L, 1, -1, 2.4); pupil(EYE_R, 1, 0);
      lid(EYE_L, true);
      p.rect(hx - 12, hy - 11, 11, 2, skinD);
    } else {
      white(EYE_L); white(EYE_R);
      pupil(EYE_L, 1, 1, 3.2); pupil(EYE_R, 1, 1, 1.8);
      p.rect(hx - 11, hy - 8, 11, 1, skinD);
      p.rect(hx - 11, hy + 4, 11, 1, skinD);
    }
    // THE NOSE: a hooked wedge that arrives in the room before he does, and it
    // never holds still. nj/nx swing it a few pixels every frame, so it jiggles
    // whatever he is doing. It gets its own cast shadow so it stands off the
    // face instead of sinking into it.
    /* Smaller than it was -- it used to be most of his face. Still a hooked
       wedge, still jutting past the cheek, still jiggling; just no longer the
       largest thing in the room. */
    const ny2 = hy + nj, nxx = hx + nx;
    p.round(nxx - 4, ny2 - 5, 10, 15, 3, skinD);        // the shadow it throws
    p.round(nxx - 3, ny2 - 6, 9, 14, 3, skin);
    p.round(nxx - 2, ny2 - 5, 6, 12, 3, skinL);
    p.round(nxx - 3, ny2 + 2, 13, 7, 3, skin);          // the hook, past the cheek
    p.round(nxx - 2, ny2 + 2, 9, 5, 2, skinL);
    p.rect(nxx - 3, ny2 + 8, 14, 1, skinD);
    p.rect(nxx + 9, ny2 + 2, 1, 7, skinD);
    p.set(nxx - 1, ny2 + 7, C.ink); p.set(nxx + 3, ny2 + 7, C.ink);
    /* A MOUSTACHE, and now it is the biggest thing on him: a full bush hung
       off the underside of the nose with waxed tips curling up at both ends,
       and it swings with the nose. */
    const MO = '#2f3a22', MOL = '#4a5a35', MOD = '#1c2415';
    const my2 = ny2 + 8;
    p.rect(nxx - 15, my2, 32, 5, MO);                   // the bush
    p.rect(nxx - 13, my2 + 5, 28, 3, MO);
    p.rect(nxx - 10, my2 + 8, 21, 2, MO);
    p.rect(nxx - 17, my2 + 1, 4, 6, MO);                // and out past the cheeks
    p.rect(nxx + 16, my2 + 1, 4, 6, MO);
    p.rect(nxx - 19, my2 - 2, 4, 6, MO);                // waxed tips, curling up
    p.rect(nxx + 18, my2 - 2, 4, 6, MO);
    p.rect(nxx - 20, my2 - 5, 3, 4, MO);
    p.rect(nxx + 20, my2 - 5, 3, 4, MO);
    p.rect(nxx - 14, my2, 30, 1, MOL);                  // a shine along the top
    p.rect(nxx - 8, my2 + 9, 17, 1, MOD);               // and a shadow under it
    p.rect(nxx - 1, my2 + 1, 2, 8, MOD);                // parted in the middle
    for (let i = 0; i < 5; i++) {                       // combed, badly
      p.rect(nxx - 12 + i * 6, my2 + 2, 1, 5, MOD);
      p.rect(nxx + 3 + i * 3, my2 + 2, 1, 4, MOD);
    }
    // mouth: a flat line of disappointment under it, or gritted teeth
    if (drill) { p.rect(hx - 8, hy + 18, 11, 4, C.ink); for (let i = 0; i < 4; i++) p.rect(hx - 7 + i * 3, hy + 19, 2, 2, C.white); }
    else { p.rect(hx - 8, hy + 18, 10, 2, C.ink); p.set(hx - 9, hy + 17, C.ink); p.set(hx + 2, hy + 19, C.ink); }
    p.rect(hx - 8, hy + 17, 13, 2, skinD);              // chin, the first of several
    // one drooping antenna with a bulb that stopped working long ago
    const aw = walk ? [2, 0, -2, 0][f % 4] : [0, 1, 1, 0][f % 4];
    p.line(hx + 3, hy - 14, hx + 7 + aw, hy - 21, skinD);
    p.line(hx + 7 + aw, hy - 21, hx + 11 + aw, hy - 19, skinD);
    p.disc(hx + 12 + aw, hy - 18, 2.4, f === 2 ? C.gold : '#6b6450');
    // EXACTLY THREE STRANDS OF HAIR, and he is very proud of all of them
    const hw = [0, 1, 2, 1][f % 4];                      // they sway too
    for (let i = 0; i < 3; i++) {
      const sx2 = hx - 7 + i * 5, sh = 9 + i * 2, curl = (i % 2 ? 1 : -1);
      p.line(sx2, hy - 14, sx2 + curl + hw * curl, hy - 14 - sh, skinD);
      p.line(sx2 + 1, hy - 14, sx2 + 1 + curl + hw * curl, hy - 14 - sh, skinD);
      p.set(sx2 + curl * 2 + hw * curl, hy - 15 - sh, skinL);
    }

    p.outline(C.ink);
    return sheet;
  }

  function alienSet(P) {
    return {
      idle: [0, 1, 2, 3].map(i => buildAlien('idle', i, P)).concat([buildAlien('idle', 0, P, true)]),
      walk: [0, 1, 2, 3].map(i => buildAlien('walk', i, P)),
      fly: [buildAlien('fly', 0, P), buildAlien('fly', 1, P)],
      drill: [buildAlien('drill', 0, P), buildAlien('drill', 1, P), buildAlien('drill', 2, P)],
      roll: [buildAlien('roll', 0, P)]
    };
  }

  /* The bare body, for the live rig. Four nose-jiggle frames plus a blink,
     and three braced frames for when he is leaning on the drill. */
  /* Frames 0-3 are the nose jiggle; everything after is a face he can pull.
     PD.rig.FACE names the indices. */
  const FACES = ['blink', 'happy', 'cross', 'shock', 'woozy', 'smug'];
  function coreSet(P) {
    return {
      core: [0, 1, 2, 3].map(i => buildAlien('core', i, P))
        .concat(FACES.map(fc => buildAlien('core', 0, P, fc))),
      coreDrill: [0, 1, 2].map(i => buildAlien('coredrill', i, P))
        .concat([buildAlien('coredrill', 0, P, 'cross')])
    };
  }

  const base = alienSet(C);
  const AOX = 18, AOY = 37;                         // logical anchor: the belt
  reg('alien', base.idle, AOX, AOY, 2);
  reg('alienWalk', base.walk, AOX, AOY, 2);
  reg('alienFly', base.fly, AOX, AOY, 2);
  reg('alienDrill', base.drill, AOX, AOY, 2);
  reg('alienRoll', base.roll, AOX, 35, 2);
  const baseCore = coreSet(C);
  reg('alienCore', baseCore.core, AOX, AOY, 2);
  reg('alienCoreDrill', baseCore.coreDrill, AOX, AOY, 2);

  /* ------------------------------------------------------------------- drill
     Horizontal, pointing right, anchored at the shoulder end. */
  /* The drill at 2x: a chunky housing with a grip, a hot collar and a long
     striped bit that spins across four frames. */
  function buildDrill(phase, P) {
    P = P || { met: C.met, metDD: C.metDD, accent: C.orange };
    const p = pix(56, 24);
    p.round(0, 5, 20, 14, 4, P.metDD);            // housing
    p.round(2, 7, 14, 4, 2, P.met);
    p.rect(4, 12, 10, 3, C.ink2);                 // vent
    p.round(6, 17, 10, 6, 2, P.metDD);            // grip underneath
    p.rect(16, 3, 8, 18, P.accent);               // hot collar
    p.rect(17, 5, 2, 14, '#ffe2a8');
    p.disc(21, 12, 2, '#fff7d0');
    for (let x = 24; x < 55; x++) {               // tapering bit
      const t = (x - 24) / 31;
      const half = Math.max(1, 8 * (1 - t * 0.92));
      for (let y = -half; y <= half; y++) {
        const yy = Math.round(12 + y);
        const stripe = ((x + yy * 2 + phase * 3) % 8) < 4;
        p.set(x, yy, stripe ? P.met : P.metDD);
      }
    }
    p.set(55, 12, '#ffffff');
    p.outline(C.ink);
    return p;
  }

  reg('drill', [0, 1, 2, 3].map(buildDrill), 5, 6, 2);

  /* ------------------------------------------------------------------ pistol */
  function buildGun(charge) {
    const p = pix(18, 11);
    p.round(0, 3, 11, 6, 2, C.metDD);
    p.rect(2, 4, 5, 2, C.met);
    p.rect(3, 8, 3, 3, C.suitD);              // grip
    p.rect(11, 4, 4, 4, C.metD);
    p.rect(15, 4, 2, 4, charge ? C.cyan : C.cyanD);
    p.rect(6, 2, 4, 2, C.cyanD);              // energy cell
    p.outline(C.ink);
    return p;
  }
  reg('gun', [buildGun(false), buildGun(true)], 3, 6);

  /* -------------------------------------------------------------------- ship
     The Rustmaw: a fat little mining barge with landing legs and a bay door. */
  function buildShip(blink, P) {
    P = P || { met: C.met, metD: C.metD, metDD: C.metDD };
    const p = pix(84, 52);
    // landing legs first so the hull covers their tops
    p.line(16, 32, 10, 47, P.metDD); p.line(17, 32, 11, 47, P.metDD);
    p.line(67, 32, 73, 47, P.metDD); p.line(66, 32, 72, 47, P.metDD);
    p.round(5, 46, 12, 4, 2, P.metD);
    p.round(66, 46, 12, 4, 2, P.metD);

    // hull
    p.round(6, 12, 72, 24, 10, P.met);
    p.shade(P.met, P.metD, 0, 1);
    p.round(9, 14, 66, 5, 2, C.white);
    p.round(6, 30, 72, 7, 6, P.metD);

    // engine pods
    p.round(0, 17, 10, 12, 4, P.metDD);
    p.round(74, 17, 10, 12, 4, P.metDD);
    p.rect(2, 21, 3, 4, C.cyan);
    p.rect(79, 21, 3, 4, C.cyan);

    // cockpit dome
    p.disc(28, 12, 11, C.glass);
    p.disc(28, 13, 8, C.ink2);
    p.ellipse(25, 8, 3.2, 1.6, C.glassL);
    p.round(18, 12, 21, 3, 1, P.metD);

    // bay door + tractor emitter
    p.round(36, 33, 16, 5, 2, P.metDD);
    p.rect(40, 35, 8, 3, blink ? C.cyan : C.cyanD);

    // hull lights and decal
    p.disc(58, 24, 2.4, blink ? C.gold : C.goldD);
    p.disc(50, 24, 2.4, C.red);
    p.disc(66, 24, 2.4, C.lime);
    // tiny skull decal, because we are the villain
    p.round(13, 20, 8, 7, 2, C.gold);
    p.rect(15, 22, 2, 2, C.ink); p.rect(18, 22, 2, 2, C.ink);
    p.rect(16, 25, 3, 1, C.ink);

    // antenna
    p.line(45, 12, 45, 3, P.metD);
    p.disc(45, 2, 2, C.red);

    p.outline(C.ink);
    return p;
  }
  reg('ship', [buildShip(false), buildShip(true)], 42, 26);

  /* ------------------------------------------------------------------- drone */
  function buildDrone(phase) {
    const p = pix(14, 12);
    p.round(3, 4, 8, 6, 2, C.met);
    p.shade(C.met, C.metD, 0, 1);
    p.disc(7, 6.5, 2, C.cyan);
    const lift = phase ? 0 : 1;
    p.rect(0, 3 + lift, 4, 1, C.metD);
    p.rect(10, 3 + lift, 4, 1, C.metD);
    p.rect(5, 10, 4, 2, C.metDD);
    p.outline(C.ink);
    return p;
  }
  reg('drone', [buildDrone(0), buildDrone(1)], 7, 6);

  /* ----------------------------------------------------------------- enemies */
  function buildGrub(phase) {
    const p = pix(20, 14);
    const hump = phase === 1 ? 1 : 0;
    p.ellipse(10, 8 - hump, 8, 4.4, C.limeD);
    p.ellipse(10, 7 - hump, 7.4, 3.6, C.lime);
    for (let i = 0; i < 4; i++) p.rect(4 + i * 4, 4 - hump, 2, 3, C.limeD); // back ridges
    // legs
    for (let i = 0; i < 3; i++) {
      const lx = 5 + i * 5, d = ((i + phase) % 2) ? 1 : 0;
      p.line(lx, 11 - hump, lx - 1, 13 - d, C.ink2);
    }
    // face at the right end
    p.ellipse(15, 7 - hump, 1.5, 2, C.eye);
    p.set(16, 6 - hump, C.white);
    p.ellipse(12, 7 - hump, 1.5, 2, C.eye);
    p.set(13, 6 - hump, C.white);
    p.rect(17, 9 - hump, 2, 1, C.redD);
    p.outline(C.ink);
    return p;
  }
  reg('grub', [buildGrub(0), buildGrub(1)], 10, 8);

  function buildJelly(phase) {
    const p = pix(18, 22);
    const squash = phase === 1 ? 1 : 0;
    p.ellipse(9, 7 + squash, 7.5 - squash, 6 + squash, C.purple);
    p.shade(C.purple, C.purpleD, 0, 1);
    p.ellipse(6.5, 4 + squash, 2.4, 1.4, C.white);
    // tentacles
    for (let i = 0; i < 4; i++) {
      const tx = 3 + i * 4;
      const wob = ((i + phase) % 2) ? 1 : -1;
      p.line(tx, 12 + squash, tx + wob, 16 + squash, C.purpleD);
      p.line(tx + wob, 16 + squash, tx, 20, C.purpleD);
    }
    // one big cyclops eye
    p.disc(9, 8 + squash, 2.6, C.white);
    p.disc(9.5, 8 + squash, 1.5, C.eye);
    p.outline(C.ink);
    return p;
  }
  reg('jelly', [buildJelly(0), buildJelly(1)], 9, 8);

  function buildSpit(phase) {
    const p = pix(22, 16);
    p.ellipse(9, 9, 8, 6, C.slimeD);
    p.ellipse(9, 8, 7, 5, C.slime);
    p.ellipse(6, 5, 2.6, 1.4, C.white);
    // snout

    p.round(16, 6 - open, 5, 5 + open * 2, 1, C.slimeD);

    p.ellipse(9, 7, 1.6, 2.1, C.eye); p.set(10, 6, C.white);
    p.ellipse(13, 7, 1.6, 2.1, C.eye); p.set(14, 6, C.white);
    // spikes
    p.spike(5, 1, 4, 3, -1, C.slimeD);
    p.spike(10, 1, 4, 3, -1, C.slimeD);
    p.outline(C.ink);
    return p;
  }
  reg('spit', [buildSpit(0), buildSpit(1)], 9, 9);

  function buildGnasher(phase) {
    const p = pix(24, 17);
    p.ellipse(11, 9, 9.5, 6.5, C.orangeD);
    p.ellipse(11, 8, 8.6, 5.6, C.orange);
    p.ellipse(7, 4, 3, 1.6, C.white);
    // huge mouth on the right
    const gape = phase === 1 ? 2 : 0;
    p.round(15, 6 - gape, 8, 7 + gape * 2, 2, C.redD);
    for (let i = 0; i < 3; i++) {
      p.spike(17 + i * 2, 6 - gape, 3, 3, 1, C.white);
      p.spike(17 + i * 2, 10 + gape, 3, 3, -1, C.white);
    }
    // angry eyes
    p.ellipse(10, 7, 1.8, 2.2, C.eye); p.set(11, 6, C.white);
    p.ellipse(14, 7, 1.8, 2.2, C.eye); p.set(15, 6, C.white);
    p.line(8, 3, 12, 4, C.ink); p.line(13, 4, 16, 3, C.ink);
    // back spines
    p.spike(5, 0, 5, 4, -1, C.orangeD);
    p.spike(10, 0, 5, 4, -1, C.orangeD);
    p.outline(C.ink);
    return p;
  }
  reg('gnasher', [buildGnasher(0), buildGnasher(1)], 11, 9);

  function buildLurker(phase) {
    const p = pix(30, 26);
    const bob = phase === 1 ? 1 : 0;
    // tentacle skirt
    for (let i = 0; i < 5; i++) {
      const tx = 5 + i * 5;

      p.line(tx, 17, tx + wob, 21, C.purpleD);
      p.line(tx + wob, 21, tx, 25 - bob, C.purpleD);
      p.set(tx, 25 - bob, C.red);
    }
    p.ellipse(14, 11 + bob, 12, 9, C.purpleD);
    p.ellipse(14, 10 + bob, 11, 8, C.purple);
    p.ellipse(9, 5 + bob, 4, 2, C.glassL);
    // single glowing eye
    p.disc(15, 11 + bob, 4.4, C.white);
    p.disc(16, 11 + bob, 2.8, C.red);
    p.disc(16.5, 11 + bob, 1.2, C.ink);
    // horns
    p.spike(6, 1 + bob, 6, 5, -1, C.purpleD);
    p.spike(20, 1 + bob, 6, 5, -1, C.purpleD);

  reg('lurker', [buildLurker(0), buildLurker(1)], 14, 12);

  function buildWarden(phase) {
    const p = pix(40, 36);
    const bob = phase === 1 ? 1 : 0;

    for (let i = 0; i < 4; i++) {

    p.disc(20, 18 + bob, 5, C.orange);
    p.disc(20, 18 + bob, 2.6, C.gold);

  reg('warden', [buildWarden(0), buildWarden(1)], 20, 18);

  /* CAVE MITE: tiny, fast, comes in clouds. */
  function buildMite(phase) {
    const p = pix(10, 9);
    p.ellipse(5, 4, 3.6, 2.6, C.limeD);
    p.ellipse(5, 3.6, 3, 2, C.lime);
    p.set(6, 3, C.eye); p.set(4, 3, C.eye);
    const f = phase ? 1 : -1;
    p.line(1, 4, 0, 2 + f, C.ink2); p.line(9, 4, 10, 2 - f, C.ink2);
    p.line(2, 6, 1, 8, C.ink2); p.line(8, 6, 9, 8, C.ink2);

    return p;
  }
  reg('mite', [buildMite(0), buildMite(1)], 5, 4);

  /* SHELLBACK: armoured slab of a beast; shots glance off the carapace. */
  function buildShellback(phase) {
    const p = pix(28, 20);
    const lift = phase ? 1 : 0;
    for (let i = 0; i < 4; i++) {
      const lx = 5 + i * 6, d = ((i + phase) % 2) ? 1 : 0;
      p.line(lx, 15, lx - 1, 19 - d, C.ink2);
    }
    p.ellipse(13, 10, 12, 7, C.metDD);
    p.ellipse(13, 9 - lift, 11, 6, C.metD);

  /* MAGMA WYRM: lives in the lava, bursts out to bite. */
  function buildWyrm(phase) {
    const p = pix(30, 20);

    for (let i = 0; i < 4; i++) {
      const bx = 4 + i * 5, by = 12 + Math.sin(i * 1.4 + und) * 2;
      p.disc(bx, by, 3.4 - i * 0.3, C.redD);

    p.ellipse(22, 9 - und, 6.5, 5, C.redD);
    p.ellipse(22, 8 - und, 5.5, 4, C.orange);
    p.ellipse(21, 5 - und, 2.6, 1.2, C.gold);
    p.round(24, 8 - und, 6, 4 + und, 1, C.ink2);           // maw
    for (let i = 0; i < 3; i++) p.set(25 + i * 2, 8 - und, C.white);
    p.ellipse(21, 7 - und, 1.5, 1.7, C.eye); p.set(22, 6 - und, C.gold);

  /* SPACE SCOOTER: a hover-bike, drawn heading right; the rider sits on top. */

  /* THE POD: your own little fat ship. Round, stubby-winged, a dome up top
     and one big thruster. Heads right. */
  /* The pod at 2x: little, fat, riveted, with a bubble dome you can see into,
     twin nacelles, landing skids and a working exhaust. */
  /* THE DUMB UFO. One saucer, built once, used everywhere: it is the thing
     parked on bricks outside your house AND the thing hanging over the dig
     site. Wonky, dented, a satellite dish gaffer-taped to the roof, one leg
     that gave up years ago. Faceted throughout -- no ovals in it anywhere. */
  function buildSaucer(phase, P, landed) {
    P = P || { met: '#b6b0c8', metD: '#8e86a8', metDD: '#7d7396' };
    const p = pix(132, 76);
    const f = phase ? 1 : 0;
    const HULL = P.met, HULD = P.metD, HULDD = P.metDD;

    // the skirt: a wide bevelled slab, widest at the rim
    p.round(4, 30, 124, 14, 7, HULD);
    p.round(10, 26, 112, 14, 7, HULL);
    p.shade(HULL, HULDD, 0, 1);
    p.round(22, 22, 88, 10, 5, '#d6d0e8');
    p.rect(14, 36, 104, 2, HULDD);

    // the dome, a cut-glass box with a pilot-shaped hole in it
    p.round(44, 2, 44, 24, 10, C.glass);
    p.round(50, 7, 32, 15, 6, '#2a2440');
    p.rect(54, 10, 8, 3, '#eafcff');
    p.rect(50, 5, 32, 2, C.glassL);

    // dents: this thing has been reversed into a moon
    p.round(2, 34, 22, 10, 4, '#8e86a8');
    p.round(108, 34, 22, 10, 4, '#8e86a8');
    p.rect(38, 28, 22, 3, '#c46a3a');                    // rust
    p.rect(76, 30, 14, 2, '#c46a3a');
    p.rect(28, 24, 10, 2, '#c46a3a');

    // rim lights, chasing
    for (let i = 0; i < 8; i++) {
      const on = (i + f) % 2 === 0;
      p.round(14 + i * 14, 38, 8, 6, 2, on ? '#ffd34d' : '#5a5474');
      if (on) p.rect(15 + i * 14, 39, 6, 2, '#fff3c0');
    }

    // a satellite dish taped to the roof, aimed at nothing
    p.rect(92, 2, 3, 22, P.metDD || '#39405e');
    p.round(84, 0, 22, 8, 4, '#8e86a8');
    p.round(88, 1, 14, 5, 2, '#c9c4b4');
    p.rect(88, 10, 12, 3, '#ffe98a');                    // the tape
    p.rect(90, 13, 8, 2, '#e0c96a');

    if (landed) {
      // up on two bricks, with one leg that has given up
      p.round(20, 44, 24, 14, 3, '#8a5a3a');
      p.round(88, 44, 24, 14, 3, '#8a5a3a');
      p.rect(22, 48, 20, 2, '#6b4530');
      p.rect(90, 48, 20, 2, '#6b4530');
      p.rect(24, 54, 20, 2, '#6b4530');
      p.round(60, 42, 8, 18, 3, '#39405e');
      p.round(52, 58, 24, 6, 2, '#5e6688');
      p.round(74, 50, 16, 5, 2, '#39405e');              // the collapsed one
      p.rect(86, 54, 10, 3, '#5e6688');
    } else {
      // in flight: skids tucked, and a wash of light under the belly
      p.round(26, 44, 14, 8, 3, '#39405e');
      p.round(92, 44, 14, 8, 3, '#39405e');
      const glow = f ? '#ffe08a' : '#ffb03d';
      p.round(40, 44, 52, 8, 4, glow);
      p.round(50, 48, 32, 8, 4, f ? '#ffd34d' : '#ff9b3d');
      p.round(58, 54, 16, 8, 4, f ? '#fff6c8' : '#ffd34d');
      p.rect(6, 40, 8, 3, f ? '#7ef9ff' : '#2f8fae');
      p.rect(118, 40, 8, 3, f ? '#7ef9ff' : '#2f8fae');
    }
    p.outline(C.ink);
    return p;
  }
  PD.buildSaucer = buildSaucer;

  reg('pod', [buildSaucer(0), buildSaucer(1)], 33, 22, 2);

  /* LOOT CRATE: precursor supply case. */
  function buildCrate(open) {

  /* ------------------------------------------------------------------ pickups
     One small gem sprite per material tint, plus a generic rubble nugget. */
  /* ------------------------------------------------------------------- ore
     Every material gets its own chunk, drawn at 2x with real facets: cut gems
     with a table and a crown, metal nuggets with a bevel and a glint, rubble
     with chipped corners, ice shards, fossils, relics. All from the three
     colours in the material table, so all thirty exist. */
  const ORE_CLASS = {
    crust: 'rock', stone: 'rock', basalt: 'rock', shell: 'rock', hull: 'plate',
    iron: 'metal', copper: 'metal', silver: 'metal', gold: 'metal', titan: 'metal', star: 'metal',
    ice: 'ice', frost: 'ice',
    emerald: 'gem', sapphire: 'gem', ruby: 'gem', ameth: 'gem', diamond: 'gem', void: 'gem',
    crystal: 'shard', obsid: 'shard', aether: 'shard', uran: 'shard',
    fungus: 'cap', bio: 'bio', fossil: 'fossil', relic: 'relic'
  };

  function speck(p, w, h, seed, col, n) {
    for (let i = 0; i < n; i++) {
      const x = 2 + Math.floor(U.hash2(seed + i * 3, 11) * (w - 4));
      const y = 2 + Math.floor(U.hash2(seed + i * 7, 23) * (h - 4));
      p.set(x, y, col);
    }
  }

  function buildOre(m) {
    const c = m.c, kind = ORE_CLASS[m.key] || 'rock';
    const seed = m.id * 13 + 5;
    const p = pix(24, 22);
    const L = c[0], M = c[1], D2 = c[2];

    if (kind === 'gem') {
      // table on top, crown facets, pointed pavilion
      p.rect(6, 5, 12, 2, L);                       // table
      p.rect(5, 7, 14, 3, M);
      for (let i = 0; i < 4; i++) { p.rect(5 + i, 4 + i, 14 - i * 2, 1, i ? M : L); }
      p.spike(4, 10, 16, 10, 1, M);                 // pavilion
      p.spike(7, 10, 10, 8, 1, L);
      p.spike(10, 10, 4, 9, 1, D2);
      p.line(5, 10, 12, 19, D2); p.line(18, 10, 12, 19, D2);
      p.rect(7, 4, 4, 1, '#ffffff');                // sparkle on the table
      p.set(8, 6, '#ffffff'); p.set(9, 6, '#ffffff');
      p.set(15, 9, D2); p.set(16, 10, D2);
    } else if (kind === 'shard') {
      // a raw cluster: three uneven prisms
      p.spike(3, 8, 7, 12, -1, D2);
      p.spike(14, 6, 7, 14, -1, M);
      p.spike(8, 2, 9, 18, -1, M);
      p.rect(11, 5, 2, 12, L);
      p.rect(5, 12, 2, 6, L); p.rect(16, 11, 2, 8, L);
      p.rect(4, 18, 16, 2, D2);
      p.set(11, 4, '#ffffff'); p.set(12, 6, '#ffffff');
    } else if (kind === 'metal') {
      // rounded nugget with a hard bevel and a glint
      p.round(3, 6, 18, 12, 4, M);
      p.round(4, 7, 15, 4, 3, L);
      p.rect(5, 15, 14, 3, D2);
      p.round(6, 8, 6, 3, 1, '#ffffff');
      p.set(7, 12, L); p.set(13, 11, L); p.set(16, 13, D2); p.set(9, 15, D2);
      speck(p, 24, 22, seed, D2, 3);
      p.rect(8, 4, 3, 2, L); p.rect(15, 5, 2, 2, M);   // little lumps on top
    } else if (kind === 'ice') {
      p.spike(4, 4, 16, 16, 1, M);
      p.spike(7, 4, 10, 12, 1, L);
      p.rect(9, 6, 2, 9, '#ffffff');
      p.rect(5, 16, 14, 3, D2);
      p.set(14, 8, '#ffffff'); p.set(15, 10, L);
    } else if (kind === 'plate') {
      p.round(3, 7, 18, 10, 2, M);
      p.rect(4, 8, 16, 2, L);
      p.rect(4, 14, 16, 2, D2);
      for (let i = 0; i < 4; i++) p.set(6 + i * 4, 11, D2);
      p.rect(2, 10, 2, 4, D2); p.rect(20, 10, 2, 4, D2);
    } else if (kind === 'cap') {
      p.rect(10, 12, 4, 7, D2);                    // stalk
      p.round(4, 5, 16, 8, 4, M);
      p.round(5, 6, 13, 3, 3, L);
      p.set(8, 9, L); p.set(14, 8, L); p.set(11, 10, L);
      p.rect(8, 18, 8, 2, D2);
    } else if (kind === 'bio') {
      p.round(4, 6, 16, 13, 6, M);
      p.round(6, 7, 11, 4, 3, L);
      p.rect(8, 12, 3, 4, C.eye); p.rect(14, 12, 3, 4, C.eye);
      p.set(8, 12, '#ffffff'); p.set(14, 12, '#ffffff');
      p.rect(10, 17, 5, 1, D2);
      speck(p, 24, 22, seed, L, 4);
    } else if (kind === 'fossil') {
      // a coiled ammonite in a chip of stone
      p.round(3, 5, 18, 15, 4, D2);
      p.round(4, 6, 16, 4, 3, M);
      const spiral = [[12, 12], [12, 10], [14, 10], [15, 12], [14, 14], [11, 15], [8, 13], [8, 10], [10, 7], [14, 6], [17, 9]];
      for (let i = 0; i < spiral.length; i++) p.set(spiral[i][0], spiral[i][1], i % 2 ? L : '#ffffff');
      for (let i = 0; i < spiral.length - 1; i++) p.line(spiral[i][0], spiral[i][1], spiral[i + 1][0], spiral[i + 1][1], L);
      p.set(12, 12, '#ffffff');
    } else if (kind === 'relic') {
      // an ornate little idol on a base
      p.rect(6, 17, 12, 3, D2);
      p.rect(8, 14, 8, 3, M);
      p.round(7, 6, 10, 9, 3, M);
      p.rect(9, 8, 6, 2, D2);
      p.rect(11, 10, 2, 4, L);
      p.spike(8, 2, 8, 5, -1, L);
      p.set(12, 3, '#ffffff');
      p.rect(4, 8, 2, 6, L); p.rect(18, 8, 2, 6, L);
      p.set(5, 7, '#ffffff'); p.set(19, 7, '#ffffff');
    } else {
      // rubble: a chipped chunk with a flat lit top
      p.round(3, 7, 18, 12, 3, M);
      p.rect(4, 8, 15, 3, L);
      p.rect(5, 16, 14, 3, D2);
      p.set(6, 12, D2); p.set(15, 13, D2); p.set(10, 14, L);
      p.rect(2, 11, 2, 3, M); p.rect(20, 12, 2, 3, M);
      speck(p, 24, 22, seed, D2, 5);
      p.set(8, 6, M); p.set(14, 5, M);
    }
    if (m.glow) { p.set(12, 8, '#ffffff'); p.set(11, 9, '#ffffff'); }
    p.outline(C.ink);
    return p;
  }

  const gemSprites = {};
  function gemFor(matId) {
    if (gemSprites[matId]) return gemSprites[matId];
    const m = PD.data.MAT[matId];
    const cv = buildOre(m).toCanvas();
    gemSprites[matId] = { frames: [cv], w: cv.width / 2, h: cv.height / 2, hd: 2, ox: cv.width / 4, oy: cv.height / 4 };
    return gemSprites[matId];
  }
  /* Small ore chip for lists: the same sprite, drawn to fit a row. */
  function oreChip(ctx, matId, x, y, size) {
    const s = gemFor(matId);
    const cv = s.frames[0];
    const k = (size || 11) / (cv.width / 2);
    ctx.drawImage(cv, Math.round(x), Math.round(y), Math.round(cv.width / 2 * k), Math.round(cv.height / 2 * k));
  }

  const ICON = {};

    p.outline(C.ink);

  icon('drill', p => { p.rect(1, 6, 6, 4, C.metDD); for (let x = 7; x < 15; x++) { const h = Math.max(1, 3 - (x - 7) * 0.35); for (let y = -h; y <= h; y++) p.set(x, 8 + y, ((x + y) % 3) ? C.met : C.metD); } });
  icon('arm', p => { p.rect(1, 7, 10, 3, C.metD); p.round(10, 4, 5, 9, 2, C.orange); p.rect(2, 8, 6, 1, C.met); });
  icon('tank', p => { p.round(4, 2, 8, 12, 3, C.cyan); p.rect(6, 0, 4, 3, C.metD); p.rect(6, 5, 2, 6, C.white); });
  icon('pod', p => { p.round(1, 4, 14, 10, 2, C.orangeD); p.rect(1, 6, 14, 2, C.orange); p.rect(7, 4, 2, 10, C.metD); });
  icon('hull', p => { p.round(2, 1, 12, 10, 3, C.met); p.spike(8, 8, 12, 6, 1, C.met); p.rect(6, 4, 4, 4, C.cyan); });
  icon('thrust', p => { p.round(5, 1, 6, 8, 2, C.metD); p.spike(8, 9, 8, 6, 1, C.orange); p.spike(8, 9, 4, 4, 1, C.gold); });
  icon('gun', p => { p.round(1, 5, 10, 5, 2, C.metDD); p.rect(3, 9, 3, 4, C.suitD); p.rect(11, 6, 4, 3, C.cyan); });
  icon('coil', p => { p.disc(8, 8, 6, C.metD); p.disc(8, 8, 3, C.cyan); for (let i = 0; i < 4; i++) p.rect(7, 0 + i * 4, 2, 2, C.gold); });
  icon('lamp', p => { p.round(2, 4, 6, 8, 2, C.metD); p.spike(11, 8, 12, 8, 1, C.gold); p.rect(4, 6, 2, 4, C.white); });
  icon('magnet', p => { p.round(2, 2, 12, 10, 4, C.red); p.rect(5, 7, 6, 7, null); p.rect(2, 10, 4, 4, C.met); p.rect(10, 10, 4, 4, C.met); });
  icon('drone', p => { p.round(4, 5, 8, 6, 2, C.met); p.disc(8, 8, 2, C.cyan); p.rect(0, 3, 5, 1, C.metD); p.rect(11, 3, 5, 1, C.metD); });
  icon('scatter', p => { p.round(1, 5, 9, 6, 2, C.metDD); p.rect(9, 5, 6, 2, C.metD); p.rect(9, 8, 6, 2, C.metD); p.rect(3, 10, 3, 4, C.suitD); });
  icon('lance', p => { p.round(1, 6, 8, 5, 2, C.metDD); p.rect(8, 7, 7, 3, C.purpleD); p.rect(14, 5, 2, 7, C.cyan); p.rect(3, 10, 3, 4, C.suitD); });
  icon('dash', p => { p.round(6, 4, 8, 8, 3, C.met); p.spike(4, 8, 6, 5, 1, C.orange); p.rect(0, 6, 4, 1, C.gold); p.rect(0, 9, 4, 1, C.gold); p.rect(1, 12, 3, 1, C.gold); });
  icon('scan', p => { p.disc(8, 8, 7, C.metDD); p.disc(8, 8, 5, C.ink2); p.disc(8, 8, 2, C.cyan); for (let a = 0; a < 6.3; a += 0.8) p.set(8 + Math.cos(a) * 5, 8 + Math.sin(a) * 5, C.cyanD); p.line(8, 8, 12, 4, C.cyan); });
  icon('claw', p => { p.rect(7, 1, 2, 6, C.metD); p.line(7, 7, 3, 13, C.met); p.line(9, 7, 13, 13, C.met); p.rect(2, 12, 3, 3, C.orange); p.rect(11, 12, 3, 3, C.orange); });

  /* ------------------------------------------------------------ cosmetics
     Sprites are code, so a repaint is just a rebuild with a new palette.
     Cached by option ids -- a wardrobe change rebuilds three little sheets. */
  const skinCache = {};

  function optOf(catId, id) {
    const cat = PD.data.COS[catId];
    return cat.options.find(o => o.id === id) || cat.options[0];
  }

  /* --------------------------------------------------------------- the trash
     Space is full of other people's rubbish and he is going to sell all of it.
     Nine bits of junk, built once and tumbled across the menu: a dead
     satellite, a traffic cone, a fridge, a boot, an office chair, a bent
     antenna, a tyre, a crate and, inevitably, a rubber duck. */
  let junkCache = null;
  function buildJunk() {
    if (junkCache) return junkCache;
    const mk = (w, h, fn) => { const p = pix(w, h); fn(p); p.outline('#100a1c'); return p.toCanvas(); };
    junkCache = [
      mk(22, 16, p => {                                  // dead satellite
        p.rect(8, 5, 7, 6, '#8fa0b8'); p.rect(9, 6, 5, 2, '#c8d6ea');
        p.rect(1, 6, 6, 4, '#3f6ea8'); p.rect(16, 6, 6, 4, '#3f6ea8');
        p.rect(2, 7, 4, 1, '#7fb0e8'); p.rect(17, 7, 4, 1, '#7fb0e8');
        p.rect(11, 1, 1, 4, '#8fa0b8'); p.rect(9, 1, 5, 1, '#8fa0b8');
      }),
      mk(13, 15, p => {                                  // traffic cone
        p.spike(6, 1, 11, 12, 1, '#e8792a'); p.rect(1, 12, 11, 3, '#e8792a');
        p.rect(3, 5, 7, 2, '#f5e6d0'); p.rect(1, 13, 11, 1, '#a8501a');
      }),
      mk(14, 19, p => {                                  // a fridge, door open
        p.rect(1, 1, 10, 17, '#dfe6ea'); p.rect(2, 2, 8, 6, '#b9c4cc');
        p.rect(1, 8, 10, 1, '#8e9aa4'); p.rect(9, 3, 1, 3, '#6e7a84');
        p.rect(9, 11, 1, 4, '#6e7a84'); p.rect(11, 4, 3, 10, '#c8d2d8');
      }),
      mk(16, 12, p => {                                  // one boot
        p.round(2, 1, 7, 8, 2, '#5d3b1c'); p.rect(2, 7, 13, 4, '#4a2e13');
        p.rect(2, 10, 13, 2, '#241a12'); p.rect(3, 3, 4, 1, '#8a5c2c');
      }),
      mk(15, 17, p => {                                  // office chair
        p.round(2, 1, 9, 7, 2, '#3a3450'); p.rect(2, 8, 11, 3, '#4a4166');
        p.rect(7, 11, 2, 3, '#8e9aa4'); p.rect(3, 14, 10, 2, '#2a2440');
        p.set(3, 16, '#8e9aa4'); p.set(12, 16, '#8e9aa4');

/* THE RIG. The alien's arms and legs are not drawn into his sprite sheet any
   more -- only his body, head and nose are. His four limbs are built here out
   of live segments every frame, so they swing, plant, brace, bend and STRETCH
   instead of stepping through four baked poses.

  function ik(ax, ay, bx, by, l1, l2, sign, maxs) {

    const a1 = l1 * s, a2 = l2 * s;

     pair of slacks, pretending to have a knee, and it was always going to look
     wrong on something with one big eye and one small one.

     A tentacle is not a chain of bones. It is a CURVE swept from the hip to
     wherever the foot wants to be, sampled into hard-edged quads that taper to
     a point, with a row of suckers down the leading side and a tip that hooks
     forward when it is planted and curls back up when it is not. There is no
     IK in here at all: a tentacle has no bones to run out of, so the target is

     the curve you are, so they are never quite still even when he is. */
  const TSEG = 7;                         // samples along the body of the curve

     splays its tip, TLAG puts it a third of a cycle out of step with the one

  function curvePts(hx, hy, tx, ty, face, bow, hook, wob, ph) {
    const dy = Math.max(4, ty - hy);

    const c2x = tx - face * bow, c2y = ty - dy * 0.28;

    for (let i = 0; i < TSEG; i++) {

      const y = u * u * u * hy + 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * ty;

    pts.push([tx + face * hook * 0.6, ty]);

        [b[0] - px * wb + u[0] * ext, b[1] - py * wb + u[1] * ext],
        [a[0] - px * wa - u[0] * ext, a[1] - py * wa - u[1] * ext]

       pairs. They are drawn outer-first so the walking one ends up on top. */

    p.round(246, 60, 54, 70, 18, BL);                     // cheek plate
    for (let i = 0; i < 5; i++) p.rect(252, 70 + i * 12, 42, 4, BD);
    p.round(10, 60, 34, 60, 12, BL);
    p.outline('#191430');
    return p;
  }

  /* The pod's tape deck, for the docks. */
  function tapeDeck(f) {

  /* The big brain for the Mind screen, drawn large. */
  /* A brain. Lumpy, folded, faceted -- built out of overlapping bevelled
     blocks rather than curves, with a crease down the middle and a stem. */
  function brainLobes(p, cx, cy, r, c, cd, cl) {
    const lump = (x, y, w, h) => {
      p.round(x, y, w, h, Math.min(w, h) / 3 | 0, c);
      p.rect(x + 2, y + 1, w - 4, 2, cl);
      p.rect(x + 2, y + h - 2, w - 4, 1, cd);
    };
    lump(cx - r, cy - r * 0.72, r * 2, r * 1.5);
    lump(cx - r * 0.86, cy - r, r * 0.92, r * 0.78);
    lump(cx - r * 0.04, cy - r * 1.02, r * 0.9, r * 0.8);
    lump(cx - r * 0.72, cy + r * 0.34, r * 0.8, r * 0.62);
    lump(cx - r * 0.02, cy + r * 0.38, r * 0.78, r * 0.6);
    // the crease, and the folds either side of it
    p.rect(cx - 2, cy - r * 0.98, 4, r * 1.9, cd);
    for (let i = 0; i < 5; i++) {
      const yy = cy - r * 0.7 + i * r * 0.34;
      p.rect(cx - r * 0.92, yy, r * 0.8, 2, cd);
      p.rect(cx + r * 0.12, yy + 3, r * 0.8, 2, cd);
      p.rect(cx - r * 0.9, yy + 2, r * 0.7, 1, cl);
      p.rect(cx + r * 0.14, yy + 5, r * 0.7, 1, cl);
    }
    // the stem, dangling out of the bottom
    p.round(cx - 5, cy + r * 0.92, 10, r * 0.5, 3, cd);
    p.rect(cx - 3, cy + r * 0.96, 4, r * 0.4, c);
  }

  /* THE BRAIN IN THE JAR. It knows everything, it is in a bucket of acid, and
     it is wired to a keyboard he cannot use. This is the skill tree.
     Built like a piece of salvage: a heavy base, two posts, metal straps
     across the glass and a bolted lid, so it reads as a tank and not as a
     green rectangle. */
  function brainJar(f) {
    const p = pix(112, 150);
    const base = 148;
    const GL = '#cdeeff', GLD = '#4d7ea0';
    const glassTop = 30, glassBot = base - 26;
    // the plinth, on stubby feet
    p.round(2, base - 24, 108, 20, 3, P.steelD);
    p.rect(4, base - 22, 104, 3, P.steel);
    p.rect(4, base - 8, 104, 4, P.steelDD);
    p.rect(8, base - 4, 14, 4, P.steelDD);
    p.rect(90, base - 4, 14, 4, P.steelDD);
    // the acid, dark at the bottom where the sludge has settled
    p.rect(20, glassTop, 72, glassBot - glassTop, P.acidD);
    p.rect(23, glassTop + 3, 66, glassBot - glassTop - 6, P.acid);
    p.rect(23, glassBot - 14, 66, 11, '#12503a');
    p.rect(23, glassTop + 3 + (f % 2), 66, 3, '#a8ffd0');
    brainLobes(p, 56, 66 + (f === 1 ? -2 : 0), 24, P.brain, P.brainD, P.brainL);
    // bubbles, rising in whole-pixel steps
    for (let i = 0; i < 8; i++) {
      const bx = 26 + ((i * 27) % 58);
      const by = glassBot - 16 - ((i * 19 + f * 15) % (glassBot - glassTop - 24));
      p.round(bx, by, 4, 4, 1, '#d8fff0');
      p.set(bx + 1, by + 1, '#ffffff');
    }
    // the glass itself: a bright column down one side, a dull one down the other
    p.rect(24, glassTop + 6, 3, glassBot - glassTop - 20, GL);
    p.rect(85, glassTop + 12, 2, glassBot - glassTop - 30, '#7ec0e0');
    // two posts, front and back, holding the whole thing together
    p.round(6, 26, 15, glassBot - 20, 3, P.steelD);
    p.rect(9, 30, 4, glassBot - 30, P.steel);
    p.round(91, 26, 15, glassBot - 20, 3, P.steelD);
    p.rect(94, 30, 4, glassBot - 30, P.steelDD);
    // metal straps across the glass -- the thing that makes it read as a tank
    for (const sy of [glassTop + 4, glassBot - 18]) {
      p.rect(14, sy, 84, 7, P.steelD);
      p.rect(14, sy, 84, 2, P.steel);
      p.rect(14, sy + 6, 84, 1, P.steelDD);
      p.rect(18, sy + 2, 4, 3, P.steelDD);
      p.rect(90, sy + 2, 4, 3, P.steelDD);
    }
    // the lid: bolted down, with a hose taped into it
    p.round(2, 12, 108, 18, 4, P.steelD);
    p.rect(4, 14, 104, 3, P.steel);
    p.rect(4, 27, 104, 2, P.steelDD);
    for (let i = 0; i < 6; i++) { p.rect(10 + i * 18, 18, 6, 6, P.steelDD); p.rect(10 + i * 18, 18, 6, 2, P.steel); }
    p.round(44, 2, 22, 12, 3, P.steelDD);
    p.rect(48, 4, 6, 8, P.steel);
    girder(p, 66, 6, 104, 0);
    // a dial that has never moved and a label nobody can read
    p.round(6, glassBot - 14, 16, 16, 5, P.steelDD);
    p.round(9, glassBot - 11, 10, 10, 3, P.warm);
    p.line(14, glassBot - 6, 17, glassBot - 10, P.ink);
    p.round(28, glassBot - 12, 44, 12, 3, P.warm);
    p.rect(31, glassBot - 9, 38, 2, '#8a7a52');
    p.rect(31, glassBot - 5, 26, 2, '#8a7a52');
    // a stolen keyboard on a bracket, at brain height
    p.round(74, glassBot - 12, 34, 9, 2, '#ded7bf');
    p.rect(76, glassBot - 10, 30, 2, '#f4efdc');
    for (let i = 0; i < 6; i++) p.rect(78 + i * 5, glassBot - 7, 3, 3, '#9d9682');
    p.outline(P.ink);
    return p;
  }

  /* A SMALL rock hut. The moon it stands on is only a couple of hundred
     pixels across now, so the house had to come down with it. */
  function houseSmall(lit) {
    const p = pix(190, 150);
    const R1 = '#6b6480', R2 = '#5a5474', R3 = '#4a4460', R4 = '#3a3450', RL = '#8e86a8';
    const base = 148;
    for (let row = 0; row < 7; row++) {
      const y = base - 16 - row * 16;
      const inset = row < 4 ? row * 5 : 20 + (row - 4) * 14;
      const x0 = 18 + inset, x1 = 172 - inset;
      for (let x = x0; x < x1; x += 26) {
        const w = Math.min(24, x1 - x);
        if (w < 6) continue;
        const h = 15 + ((x + row) % 3);
        const c = [R1, R2, R3][(x / 26 + row) % 3 | 0];
        p.round(x, y, w, h, 3, c);
        p.rect(x + 1, y + 1, w - 2, 2, RL);
        p.rect(x + 1, y + h - 2, w - 2, 1, R4);
