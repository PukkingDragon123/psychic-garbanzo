/* ===== src/player.js ===== */
/* The player: one small greedy alien with a drill, a pistol and a finite
   amount of air. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const FX = PD.fx;
  const A = PD.audio;
  const TILE = PD.world.TILE;
  const Bullet = PD.ent.Bullet;

  function Player(g) {
    this.g = g;
    this.w = 9; this.h = 13;
    this.x = 0; this.y = 0;
    this.vx = 0; this.vy = 0;
    this.facing = 1;
    this.aim = 0;
    this.drillSpin = 0;
    this.drilling = false;
    this.drillPitch = 0;
    this.gunCool = 0;
    this.gunFlash = 0;
    this.invuln = 0;
    this.hurtT = 0;
    this.blink = 0;
    this.thrusting = { x: 0, y: 0 };
    this.docked = false;
    this.dead = false;
    this.recall = 0;
    this.o2 = this.stat('oxygen');
    this.hull = this.stat('hull');
    this.cargo = {};
    this.cargoKg = 0;
    this.suffocating = 0;
    this.alarmT = 0;
    this.squish = 0;
    this.tetherT = 0;
  }

  Player.prototype.stat = function (id) {
    const u = D.UPG[id];
    return u.value(this.g.save.upg[id] || 0);
  };

  Player.prototype.capacity = function () { return this.stat('cargo'); };
  Player.prototype.cargoFull = function () { return this.cargoKg >= this.capacity() - 0.001; };
  Player.prototype.loadFactor = function () { return U.clamp(this.cargoKg / this.capacity(), 0, 1); };

  Player.prototype.cargoValue = function () {
    let v = 0;
    for (const k in this.cargo) v += D.MAT[k].cr * this.cargo[k];
    return Math.round(v * this.g.valueMult());
  };

  Player.prototype.reset = function (x, y) {
    this.x = x; this.y = y;
    this.vx = this.vy = 0;
    this.o2 = this.stat('oxygen');
    this.hull = this.stat('hull');
    this.dead = false;
    this.invuln = 1.2;
    this.suffocating = 0;
  };

  /* ------------------------------------------------------------------ damage */
  Player.prototype.hurt = function (dmg, g, dir) {
    if (this.invuln > 0 || this.dead) return;
    this.hull -= dmg;
    this.invuln = 0.75;
    this.hurtT = 0.3;
    this.vx += (dir || 0) * 130;
    this.vy -= 40;
    FX.shake(5);
    FX.flash(0.35, '#ff5a4d');
    FX.hitStop(0.06);
    FX.burst(this.x, this.y, 10, ['#ff8ab0', '#ffffff', '#ff5a4d'], 130);
    A.sfx.hurt();
    if (this.hull <= 0) { this.hull = 0; g.onPlayerDown(); }
  };

  Player.prototype.heal = function (n) { this.hull = Math.min(this.stat('hull'), this.hull + n); };

  /* ------------------------------------------------------------------ update */
  Player.prototype.update = function (dt, g) {
    const IN = PD.input;
    const w = g.world;
    const frozen = g.cinematic;

    this.blink -= dt;
    if (this.blink < -0.2) this.blink = U.rand(2, 6);
    this.gunCool = Math.max(0, this.gunCool - dt);
    this.gunFlash = Math.max(0, this.gunFlash - dt);
    this.invuln = Math.max(0, this.invuln - dt);
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.squish = U.damp(this.squish, 0, 0.2, dt);

    // aim always follows the cursor
    const dxm = IN.mouse.wx - this.x, dym = IN.mouse.wy - this.y;
    if (dxm * dxm + dym * dym > 9) this.aim = Math.atan2(dym, dxm);

    let ix = 0, iy = 0;
    if (!frozen) {
      if (IN.down('left')) ix -= 1;
      if (IN.down('right')) ix += 1;
      if (IN.down('up')) iy -= 1;
      if (IN.down('down')) iy += 1;
    }
    if (ix) this.facing = ix;
    else if (Math.abs(dxm) > 6) this.facing = Math.sign(dxm);

    const load = this.loadFactor();
    const thrust = this.stat('thruster') * (1 - load * 0.42);
    const grav = w.gravityAt(this.y);

    this.vx += ix * thrust * dt;
    this.vy += iy * thrust * dt;
    this.vy += grav * dt * (1 + load * 0.5);

    // drilling drags you into the rock, which feels like the bit biting in
    if (this.drilling) {
      this.vx += Math.cos(this.aim) * 150 * dt;
      this.vy += Math.sin(this.aim) * 150 * dt;
    }

    const drag = this.onGround(w) ? 0.82 : 0.94;
    this.vx *= Math.pow(drag, dt * 60);
    this.vy *= Math.pow(0.955, dt * 60);
    const maxSp = 150 - load * 40;
    const sp = Math.hypot(this.vx, this.vy);
    if (sp > maxSp) { this.vx *= maxSp / sp; this.vy *= maxSp / sp; }

    this.thrusting.x = ix; this.thrusting.y = iy;
    if (!frozen) A.thrust((Math.abs(ix) + Math.abs(iy)) > 0 ? 0.7 : 0);

    const before = { x: this.x, y: this.y };
    const hit = PD.ent.moveBody(this, w, dt);
    if (hit.ground && before.y < this.y) this.squish = Math.min(1, Math.abs(this.vy) / 200 + this.squish);

    if (ix || iy) {
      // jetpack exhaust
      if (U.chance(dt * 34)) {
        FX.spawn({
          x: this.x - ix * 7 + U.rand(-2, 2), y: this.y - iy * 8 + 5 + U.rand(-2, 2),
          vx: -ix * U.rand(30, 80) + this.vx * 0.3, vy: -iy * U.rand(30, 80) + this.vy * 0.3 + 20,
          life: U.rand(0.16, 0.4), size: U.rand(1.5, 3),
          color: U.pick(['#ffd34d', '#ff9b3d', '#fff3c0']), grav: -0.1, drag: 0.86, glow: 1
        });
      }
    }

    if (!frozen) {
      this.doDrill(dt, g);
      this.doGun(dt, g);
      this.doAir(dt, g);
      this.doRecall(dt, g);
    } else {
      this.drilling = false;
      A.drill(false);
      A.thrust(0);
    }
  };

  Player.prototype.onGround = function (w) {
    return w.rectSolid(this.x - this.w / 2, this.y + this.h / 2, this.w, 2);
  };

  /* ------------------------------------------------------------------- drill */
  Player.prototype.drillTip = function () {
    const r = this.stat('reach');
    return { x: this.x + Math.cos(this.aim) * r, y: this.y + Math.sin(this.aim) * r };
  };

  /* The bit has real length, so bite the first solid tile anywhere along it.
     Without this the drill goes dead every time a tile pops and the player
     has to drift the last few pixels to the next one. */
  Player.prototype.findBite = function (w) {
    const reach = this.stat('reach') + PD.world.TILE * 1.2;
    const cos = Math.cos(this.aim), sin = Math.sin(this.aim);
    let lastCx = -1, lastCy = -1;
    for (let d = 5; d <= reach; d += 2.5) {
      const x = this.x + cos * d, y = this.y + sin * d;
      const cx = Math.floor(x / PD.world.TILE), cy = Math.floor(y / PD.world.TILE);
      if (cx === lastCx && cy === lastCy) continue;
      lastCx = cx; lastCy = cy;
      const mat = w.at(cx, cy);
      if (mat) return { cx, cy, mat, x, y, dist: d };
    }
    return null;
  };

  Player.prototype.doDrill = function (dt, g) {
    const IN = PD.input;
    const want = IN.mouse.left && !g.uiBlocking;
    this.drillSpin += dt * (want ? 26 : 4);
    const w = g.world;

    if (!want) {
      this.drilling = false;
      A.drill(false);
      return;
    }

    const bite = this.findBite(w);
    this.drilling = !!bite;
    if (!bite) { A.drill(false); return; }

    const power = this.stat('drill') * dt;
    const hardness = U.clamp(D.MAT[bite.mat].hp / 255, 0, 1);
    this.drillPitch = 1 - hardness;
    A.drill(true, this.drillPitch);

    const broke = w.damage(bite.cx, bite.cy, power);
    if (broke) g.onTileBroken(bite.cx, bite.cy, broke, true);

    // The bore is always wider than the bit: a one-tile shaft is narrower
    // than the player, so a single-tile tunnel would wedge you in place.
    const px = Math.round(-Math.sin(this.aim)), py = Math.round(Math.cos(this.aim));
    const side = this.g.save.upg.reach >= 5 ? 2 : 1;
    for (let k = 1; k <= side; k++) {
      const falloff = power * (k === 1 ? 0.7 : 0.4);
      const b2 = w.damage(bite.cx + px * k, bite.cy + py * k, falloff);
      if (b2) g.onTileBroken(bite.cx + px * k, bite.cy + py * k, b2, true);
      const b3 = w.damage(bite.cx - px * k, bite.cy - py * k, falloff);
      if (b3) g.onTileBroken(bite.cx - px * k, bite.cy - py * k, b3, true);
    }

    if (U.chance(dt * 55)) FX.sparks(bite.x, bite.y, this.aim, D.MAT[bite.mat], 3);
    FX.shake(0.55);
  };

  /* --------------------------------------------------------------------- gun */
  Player.prototype.doGun = function (dt, g) {
    const IN = PD.input;
    const want = (IN.mouse.right || IN.down('space')) && !g.uiBlocking;
    if (!want || this.gunCool > 0) return;
    this.gunCool = this.stat('trigger');
    this.gunFlash = 0.09;
    const dmg = this.stat('pistol');
    const a = this.aim + U.rand(-0.035, 0.035);
    const ox = Math.cos(a) * 12, oy = Math.sin(a) * 12;
    g.bullets.push(new Bullet(this.x + ox, this.y + oy, Math.cos(a) * 330, Math.sin(a) * 330, dmg, true));
    this.vx -= Math.cos(a) * 28;
    this.vy -= Math.sin(a) * 28;
    FX.burst(this.x + ox, this.y + oy, 4, ['#7ef9ff', '#ffffff'], 70, true);
    FX.shake(1.1);
    A.sfx.shoot();
  };

  /* --------------------------------------------------------------------- air */
  Player.prototype.doAir = function (dt, g) {
    if (this.docked) {
      this.o2 = Math.min(this.stat('oxygen'), this.o2 + 90 * dt);
      this.suffocating = 0;
      return;
    }
    const depth = U.clamp(g.world.depthMeters(this.y) / Math.max(20, g.world.maxDepthMeters()), 0, 1);
    let drain = 1.0 + depth * 0.9 + this.loadFactor() * 0.5;
    if (this.drilling) drain += 0.9;
    this.o2 -= drain * dt;

    if (this.o2 <= 0) {
      this.o2 = 0;
      this.suffocating += dt;
      this.hull -= 7 * dt;
      this.alarmT -= dt;
      if (this.alarmT <= 0) { A.sfx.alarm(); this.alarmT = 0.7; }
      FX.flash(0.06, '#3a0d1a');
      if (this.hull <= 0) { this.hull = 0; g.onPlayerDown(); }
    } else if (this.o2 < this.stat('oxygen') * 0.25) {
      this.alarmT -= dt;
      if (this.alarmT <= 0) { A.sfx.alarm(); this.alarmT = 1.4; }
    }
  };

  /* ------------------------------------------------------------------ recall
     Hold R for an emergency tractor-beam yank home; the ship charges for it. */
  Player.prototype.doRecall = function (dt, g) {
    if (PD.input.down('KeyR') && !this.docked) {
      this.recall += dt;
      if (this.recall > 0.06) {
        FX.trail(this.x + U.rand(-10, 10), this.y + U.rand(-12, 12), '#7ef9ff', 2);
      }
      if (this.recall >= 1.4) {
        this.recall = 0;
        g.emergencyRecall();
      }
    } else this.recall = Math.max(0, this.recall - dt * 2.4);
  };

  /* ------------------------------------------------------------------- cargo */
  Player.prototype.addOre = function (mat) {
    const m = D.MAT[mat];
    if (this.cargoKg + m.kg > this.capacity() + 0.0001) return false;
    this.cargo[mat] = (this.cargo[mat] || 0) + 1;
    this.cargoKg += m.kg;
    return true;
  };

  Player.prototype.clearCargo = function () { this.cargo = {}; this.cargoKg = 0; };

  /* ----------------------------------------------------------------- drawing */
  Player.prototype.draw = function (ctx, cam, t) {
    const skin = PD.art.skinFor(this.g.save.cos);
    const spr = skin.alien;
    const drill = skin.drill;
    const gun = PD.art.sprites.gun;
    const px = this.x - cam.x, py = this.y - cam.y;
    const flip = Math.cos(this.aim) < 0;

    if (this.invuln > 0 && Math.sin(this.invuln * 40) < -0.2) return;

    // pistol on the far side, drill on the aiming side
    ctx.save();
    ctx.translate(px | 0, py | 0);
    ctx.rotate(this.aim + (flip ? Math.PI : 0));
    ctx.scale(1, flip ? -1 : 1);
    const g = gun.frames[this.gunCool < this.stat('trigger') * 0.4 ? 0 : 1];
    ctx.drawImage(g, -2, -10);
    ctx.restore();

    ctx.save();
    ctx.translate(px | 0, py | 0);
    ctx.rotate(this.aim);
    if (this.drilling) ctx.translate(U.rand(-1, 1), U.rand(-1, 1));
    const df = drill.frames[Math.floor(this.drillSpin) % drill.frames.length];
    ctx.drawImage(df, -drill.ox, -drill.oy);
    ctx.restore();

    const frame = this.blink < 0 ? 2 : (this.squish > 0.25 ? 1 : 0);
    PD.ent.drawSprite(ctx, spr, frame, px, py - 1, flip, this.hurtT > 0.15);

    if (this.gunFlash > 0) {
      const a = this.aim;
      ctx.fillStyle = '#eafcff';
      ctx.globalAlpha = this.gunFlash / 0.09;
      const fx = px + Math.cos(a) * 15, fy = py + Math.sin(a) * 15;
      ctx.fillRect(fx - 3, fy - 3, 6, 6);
      ctx.globalAlpha = 1;
    }

    if (this.recall > 0.1) {
      ctx.strokeStyle = '#7ef9ff';
      ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 22);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(px | 0, py | 0, 8 + (1 - this.recall / 1.4) * 20, 0, U.TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

  PD.Player = Player;
})(window.PD);

/* ===== src/ui.js ===== */
/* HUD, shop, star map and all the overlay screens. Everything is drawn into
   the low-res canvas with immediate-mode widgets. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const F = PD.font;
  const A = PD.audio;

  const VW = 480, VH = 270;

  const COL = {
    ink: '#120a24', panel: '#1d1338', panelHi: '#2c1e52',
    line: '#5b3f96', lineHi: '#a67df0',
    text: '#f2e9ff', dim: '#9c8ec4', gold: '#ffd34d',
    o2: '#58e8ff', hull: '#ff5a4d', cargo: '#ffb03d',
    good: '#8affa0', bad: '#ff6b8a', core: '#ff8a3d'
  };

  /* ------------------------------------------------------------- primitives */
  function panel(ctx, x, y, w, h, title) {
    ctx.fillStyle = 'rgba(6,3,14,0.55)';
    ctx.fillRect(x + 3, y + 3, w, h);
    ctx.fillStyle = COL.panel;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = COL.panelHi;
    ctx.fillRect(x, y, w, 2);
    ctx.strokeStyle = COL.line;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    // corner rivets
    ctx.fillStyle = COL.lineHi;
    ctx.fillRect(x + 2, y + 2, 2, 2); ctx.fillRect(x + w - 4, y + 2, 2, 2);
    ctx.fillRect(x + 2, y + h - 4, 2, 2); ctx.fillRect(x + w - 4, y + h - 4, 2, 2);
    if (title) {
      const tw = F.width(title, 1) + 10;
      ctx.fillStyle = COL.line;
      ctx.fillRect(x + 8, y - 5, tw, 11);
      ctx.fillStyle = COL.panelHi;
      ctx.fillRect(x + 8, y - 5, tw, 2);
      F.draw(ctx, title, x + 13, y - 2, COL.text);
    }
  }

  function bar(ctx, x, y, w, h, frac, color, opts) {
    opts = opts || {};
    frac = U.clamp(frac, 0, 1);
    ctx.fillStyle = '#0d0720';
    ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = '#2a1c4a';
    ctx.fillRect(x, y, w, h);
    const fw = Math.round(w * frac);
    if (fw > 0) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, fw, h);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(x, y, fw, 1);
    }
    if (opts.ghost !== undefined && opts.ghost > frac) {
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      const gw = Math.round(w * U.clamp(opts.ghost, 0, 1));
      ctx.fillRect(x + fw, y, gw - fw, h);
    }
    // notch ticks
    ctx.fillStyle = 'rgba(10,6,22,0.5)';
    for (let i = 1; i < 4; i++) ctx.fillRect(x + Math.round(w * i / 4), y, 1, h);
    if (opts.label) F.draw(ctx, opts.label, x + 2, y + (h - 7) / 2 | 0, opts.labelColor || '#ffffff', { scale: 1 });
    if (opts.right) F.draw(ctx, opts.right, x + w - 2, y + (h - 7) / 2 | 0, opts.labelColor || '#ffffff', { right: true });
  }

  let hoverId = null, lastHover = null;

  function button(ctx, x, y, w, h, label, opts) {
    opts = opts || {};
    const m = PD.input.mouse;
    const enabled = opts.enabled !== false;
    const hot = enabled && m.inside && m.x >= x && m.x < x + w && m.y >= y && m.y < y + h;
    if (hot) hoverId = (opts.id || label);

    const base = !enabled ? '#241a3c' : (hot ? COL.lineHi : (opts.accent || COL.line));
    ctx.fillStyle = 'rgba(6,3,14,0.5)';
    ctx.fillRect(x + 2, y + 2, w, h);
    ctx.fillStyle = base;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = hot ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.18)';
    ctx.fillRect(x, y, w, 1);
    ctx.strokeStyle = enabled ? '#0d0720' : '#1a1030';
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    F.draw(ctx, label, x + w / 2, y + (h - 7) / 2 | 0, enabled ? '#ffffff' : '#6a5d90', { center: true, scale: opts.scale || 1 });

    const clicked = hot && m.leftPressed;
    if (clicked) A.sfx.click();
    return clicked;
  }

  function icon(ctx, name, x, y, scale) {
    const cv = PD.art.ICON[name];
    if (!cv) return;
    const s = scale || 1;
    ctx.drawImage(cv, 0, 0, cv.width, cv.height, x | 0, y | 0, cv.width * s, cv.height * s);
  }

  function endFrame() {
    if (hoverId && hoverId !== lastHover) A.tone(1500, { type: 'square', dur: 0.02, vol: 0.03 });
    lastHover = hoverId;
    hoverId = null;
  }

  /* -------------------------------------------------------------------- HUD */
  function hud(ctx, g) {
    const p = g.player;
    const maxO2 = p.stat('oxygen'), maxHull = p.stat('hull'), cap = p.capacity();

    // meters
    const bx = 26, bw = 76;
    icon(ctx, 'tank', 6, 5);
    bar(ctx, bx, 8, bw, 7, p.o2 / maxO2, p.o2 / maxO2 < 0.25 ? (Math.sin(g.time * 12) > 0 ? '#ff6b8a' : COL.o2) : COL.o2,
      { right: Math.ceil(p.o2) + '' });
    icon(ctx, 'hull', 6, 21);
    bar(ctx, bx, 24, bw, 7, p.hull / maxHull, COL.hull, { right: Math.ceil(p.hull) + '' });
    icon(ctx, 'pod', 6, 37);
    bar(ctx, bx, 40, bw, 7, p.cargoKg / cap, p.cargoFull() ? '#ff6b8a' : COL.cargo,
      { right: U.fmtKg(p.cargoKg) });

    if (p.cargoFull()) {
      F.draw(ctx, 'HOLD FULL', bx + bw / 2, 50, Math.sin(g.time * 9) > 0 ? '#ffe37a' : '#ff6b8a', { center: true });
    }

    // cargo manifest
    const entries = Object.keys(p.cargo).sort((a, b) => D.MAT[b].cr - D.MAT[a].cr).slice(0, 6);
    let my = 58;
    for (const k of entries) {
      const m = D.MAT[k];
      ctx.fillStyle = m.c[1];
      ctx.fillRect(8, my + 1, 5, 5);
      ctx.fillStyle = m.c[0];
      ctx.fillRect(8, my + 1, 5, 2);
      F.draw(ctx, m.name.slice(0, 12) + ' ' + p.cargo[k], 17, my, COL.dim);
      my += 9;
    }
    if (p.cargoValue() > 0) F.draw(ctx, '$' + U.fmt(p.cargoValue()), 8, my + 1, COL.gold);

    // credits + income
    F.draw(ctx, '$' + U.fmt(g.save.credits), VW - 8, 8, COL.gold, { right: true, scale: 2 });
    const dps = g.droneIncome();
    if (dps > 0) F.draw(ctx, '+' + U.fmt(dps) + '/S DRONES', VW - 8, 26, COL.good, { right: true });
    F.draw(ctx, 'GALAXY ' + g.save.dominion.toFixed(1) + '%', VW - 8, 36, COL.lineHi, { right: true });
    F.draw(ctx, D.titleFor(g.save.dominion), VW - 8, 46, '#ff8ad8', { right: true });

    // body + depth
    F.draw(ctx, g.world.body.name, 8, VH - 20, COL.text);
    const depth = g.world.depthMeters(p.y);
    F.draw(ctx, depth > 0 ? 'DEPTH ' + depth + 'M' : 'IN ORBIT', 8, VH - 11, COL.dim);

    // core integrity: only once the player has actually hit it
    if (g.world.coreHp < g.world.coreMax) {
      const cw = 150;
      const cx = VW / 2 - cw / 2;
      F.draw(ctx, 'CORE INTEGRITY', VW / 2, 8, COL.core, { center: true });
      bar(ctx, cx, 18, cw, 8, g.world.coreHp / g.world.coreMax, COL.core,
        { right: Math.ceil(g.world.coreHp / g.world.coreMax * 100) + '%' });
    }

    // recall charge
    if (p.recall > 0.1) {
      F.draw(ctx, 'TRACTOR BEAM', VW / 2, VH - 46, COL.o2, { center: true });
      bar(ctx, VW / 2 - 40, VH - 36, 80, 6, p.recall / 1.4, COL.o2, {});
    }

    // hints
    if (g.hintT > 0) {
      ctx.globalAlpha = U.clamp(g.hintT, 0, 1);
      F.draw(ctx, g.hint, VW / 2, VH - 30, '#ffffff', { center: true });
      ctx.globalAlpha = 1;
    }

    // toasts stack upward from the bottom so they never sit on the ship
    let ty = VH - 58;
    for (let i = g.toasts.length - 1; i >= 0; i--) {
      const t = g.toasts[i];
      ctx.globalAlpha = U.clamp(t.life, 0, 1);
      const tw = F.width(t.msg, 1) + 12;
      ctx.fillStyle = 'rgba(18,10,36,0.85)';
      ctx.fillRect(VW / 2 - tw / 2, ty - 3, tw, 13);
      ctx.strokeStyle = t.color || COL.line;
      ctx.strokeRect(VW / 2 - tw / 2 + 0.5, ty - 2.5, tw - 1, 12);
      F.draw(ctx, t.msg, VW / 2, ty, t.color || COL.text, { center: true });
      ctx.globalAlpha = 1;
      ty -= 16;
    }
  }

  /* ------------------------------------------------------------------- shop */
  const TABS = ['UPGRADES', 'STAR MAP', 'OPTIONS'];

  function shop(ctx, g) {
    ctx.fillStyle = 'rgba(8,4,18,0.72)';
    ctx.fillRect(0, 0, VW, VH);

    panel(ctx, 12, 16, VW - 24, VH - 32, 'THE RUSTMAW  -  DOCKED');

    F.draw(ctx, '$' + U.fmt(g.save.credits), VW - 24, 23, COL.gold, { right: true, scale: 2 });

    // tabs
    for (let i = 0; i < TABS.length; i++) {
      const tx = 22 + i * 84;
      if (button(ctx, tx, 22, 80, 13, TABS[i], { accent: g.shopTab === i ? COL.lineHi : '#2a1c4a', id: 'tab' + i })) {
        g.shopTab = i;
      }
    }

    if (g.shopTab === 0) shopUpgrades(ctx, g);
    else if (g.shopTab === 1) starMap(ctx, g);
    else options(ctx, g);

    if (button(ctx, VW / 2 - 52, VH - 30, 104, 15, 'LAUNCH  [E]', { accent: '#2f7a4a' })) g.undock();
  }

  function shopUpgrades(ctx, g) {
    const list = D.UPGRADES;
    for (let i = 0; i < list.length; i++) {
      const u = list[i];
      const col = i % 3, row = (i / 3) | 0;
      const x = 22 + col * 146, y = 44 + row * 45;
      const lvl = g.save.upg[u.id] || 0;
      const maxed = lvl >= u.max;
      const cost = D.upgradeCost(u, lvl);
      const afford = g.save.credits >= cost;

      const m = PD.input.mouse;
      const hot = m.inside && m.x >= x && m.x < x + 138 && m.y >= y && m.y < y + 41;

      ctx.fillStyle = hot ? '#2c1e52' : '#241844';
      ctx.fillRect(x, y, 138, 41);
      ctx.strokeStyle = maxed ? COL.gold : (hot ? COL.lineHi : COL.line);
      ctx.strokeRect(x + 0.5, y + 0.5, 137, 40);

      icon(ctx, u.icon, x + 3, y + 3);
      F.draw(ctx, u.name, x + 22, y + 4, maxed ? COL.gold : COL.text);
      F.draw(ctx, u.show(lvl), x + 4, y + 16, COL.dim);

      // level pips
      const pips = Math.min(u.max, 12);
      const step = u.max > 12 ? u.max / 12 : 1;
      for (let k = 0; k < pips; k++) {
        const on = lvl >= Math.ceil((k + 1) * step);
        ctx.fillStyle = on ? (maxed ? COL.gold : COL.lineHi) : '#3a2a5e';
        ctx.fillRect(x + 4 + k * 5, y + 30, 4, 4);
      }
      F.draw(ctx, 'LV' + lvl, x + 134, y + 4, maxed ? COL.gold : COL.dim, { right: true });

      if (maxed) {
        F.draw(ctx, 'MAXED', x + 108, y + 26, COL.gold, { center: true });
      } else if (button(ctx, x + 82, y + 22, 52, 15, '$' + U.fmt(cost), { enabled: afford, accent: afford ? '#3f6ea8' : undefined, id: 'buy' + u.id })) {
        g.buy(u.id);
      }
      if (hot) g.shopTip = u.blurb;
    }
    if (g.shopTip) F.draw(ctx, g.shopTip, VW / 2, VH - 44, COL.dim, { center: true });
  }

  function starMap(ctx, g) {
    F.draw(ctx, 'SELECT A WORLD TO RUIN', VW / 2, 44, COL.text, { center: true });
    const rows = D.BODIES.length;
    const top = 56, rh = 16;
    for (let i = 0; i < rows; i++) {
      const b = D.BODIES[i];
      const y = top + i * rh;
      const unlocked = i <= g.save.unlocked;
      const done = g.save.destroyed[i];
      const here = i === g.bodyIndex;

      const m = PD.input.mouse;
      const hot = unlocked && m.inside && m.x >= 22 && m.x < VW - 22 && m.y >= y && m.y < y + rh - 2;
      ctx.fillStyle = here ? '#33235e' : (hot ? '#2c1e52' : '#221740');
      ctx.fillRect(22, y, VW - 44, rh - 2);
      ctx.strokeStyle = here ? COL.lineHi : '#3a2a5e';
      ctx.strokeRect(22.5, y + 0.5, VW - 45, rh - 3);

      // little planet dot
      ctx.fillStyle = unlocked ? b.tint : '#3a3050';
      ctx.beginPath(); ctx.arc(32, y + 7, 4, 0, U.TAU); ctx.fill();
      if (done) { ctx.fillStyle = '#0d0720'; ctx.fillRect(29, y + 6, 6, 2); }

      const label = unlocked ? b.name : '?????? ??????';
      F.draw(ctx, label, 42, y + 4, unlocked ? (done ? COL.dim : COL.text) : '#4d4070');
      F.draw(ctx, unlocked ? b.kind : 'LOCKED', 178, y + 4, COL.dim);
      F.draw(ctx, unlocked ? 'GRAV ' + b.gravity : '', 250, y + 4, COL.dim);
      F.draw(ctx, done ? 'DESTROYED' : (unlocked ? 'BOUNTY $' + U.fmt(b.reward) : ''), 310, y + 4,
        done ? COL.good : COL.gold);

      if (unlocked && !here && button(ctx, VW - 74, y + 1, 48, rh - 4, 'FLY', { id: 'fly' + i })) {
        g.travelTo(i);
      }
      if (here) F.draw(ctx, 'HERE', VW - 50, y + 4, COL.lineHi, { center: true });
    }
    const nxt = g.save.unlocked + 1;
    if (nxt < D.BODIES.length) {
      F.draw(ctx, 'CRACK THIS WORLD OPEN TO UNLOCK THE NEXT', VW / 2, VH - 44, COL.dim, { center: true });
    } else {
      F.draw(ctx, 'THE WHOLE MAP IS YOURS TO GRIND', VW / 2, VH - 44, COL.gold, { center: true });
    }
  }

  function options(ctx, g) {
    const x = VW / 2 - 90;
    F.draw(ctx, 'CONTROLS', x, 48, COL.gold);
    const lines = [
      'WASD / ARROWS   THRUSTERS',
      'MOUSE           AIM',

    if (button(ctx, x + 96, 140, 84, 14, 'MUSIC ' + (A.state.music ? 'ON' : 'OFF'))) { A.toggleMusic(!A.state.music); }
    if (button(ctx, x, 160, 84, 14, 'SAVE NOW')) { g.saveGame(); g.toast('PROGRESS SAVED', COL.good); }
    if (button(ctx, x + 96, 160, 84, 14, 'WIPE SAVE', { accent: '#8a2f4a' })) { g.wipeSave(); }
    F.draw(ctx, 'TOTAL MINED ' + U.fmt(g.save.totalMined) + ' TILES', x, 186, COL.dim);

  /* ------------------------------------------------------------- sell splash */
  function sellSplash(ctx, g) {
    const s = g.sellReport;
    if (!s) return;
    const h = 30 + s.lines.length * 10;
    const w = 150;
    const x = VW / 2 - w / 2, y = 60;
    ctx.globalAlpha = U.clamp(s.life, 0, 1);
    panel(ctx, x, y, w, h, 'CARGO SOLD');
    let ly = y + 10;
    for (const l of s.lines) {
      F.draw(ctx, l.name + ' X' + l.n, x + 8, ly, COL.text);
      F.draw(ctx, '$' + U.fmt(l.cr), x + w - 8, ly, COL.gold, { right: true });

    }
    ctx.fillStyle = COL.line;
    ctx.fillRect(x + 6, ly + 1, w - 12, 1);
    F.draw(ctx, 'TOTAL', x + 8, ly + 5, COL.good);
    F.draw(ctx, '$' + U.fmt(s.total), x + w - 8, ly + 5, COL.good, { right: true });
    ctx.globalAlpha = 1;
  }

  /* ------------------------------------------------------------------ title */
  /* A little mascot diorama: our alien caught mid-crime on a cracking world. */
  function titleArt(ctx, t) {
    const px = 386, py = 246, r = 58;

    // the doomed planet
    ctx.fillStyle = '#2b1c4a';
    ctx.beginPath(); ctx.arc(px, py, r + 3, 0, U.TAU); ctx.fill();
    ctx.fillStyle = '#4f7d6a';
    ctx.beginPath(); ctx.arc(px, py, r, 0, U.TAU); ctx.fill();
    ctx.fillStyle = '#3a5f55';
    ctx.beginPath(); ctx.arc(px + 10, py + 12, r - 8, 0, U.TAU); ctx.fill();
    ctx.fillStyle = '#6a9a80';
    [[-26, -18, 9], [12, -30, 6], [-8, 6, 5], [26, -6, 7]].forEach(c => {
      ctx.beginPath(); ctx.arc(px + c[0], py + c[1], c[2], 0, U.TAU); ctx.fill();
    });

    // glowing fissures, breathing in time with the drill
    const glow = 0.7 + 0.3 * Math.sin(t * 4);
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(200,50,10,' + (glow * 0.8).toFixed(2) + ')';
    const cracks = [
      [[-6, -56], [-2, -34], [-14, -18], [-4, 0]],
      [[-4, -34], [14, -26], [22, -8]],
      [[-14, -18], [-32, -12], [-44, -20]]
    ];
    for (const line of cracks) {
      ctx.beginPath();
      ctx.moveTo(px + line[0][0], py + line[0][1]);
      for (let i = 1; i < line.length; i++) ctx.lineTo(px + line[i][0], py + line[i][1]);
      ctx.stroke();
    }
    // hot inner line on top of the dark fissure
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,190,80,' + glow.toFixed(2) + ')';
    for (const line of cracks) {
      ctx.beginPath();
      ctx.moveTo(px + line[0][0], py + line[0][1]);
      for (let i = 1; i < line.length; i++) ctx.lineTo(px + line[i][0], py + line[i][1]);
      ctx.stroke();
    }
    const hg = ctx.createRadialGradient(px - 6, py - 56, 1, px - 6, py - 56, 22);
    hg.addColorStop(0, 'rgba(255,240,190,' + glow.toFixed(2) + ')');
    hg.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(px - 28, py - 78, 56, 56);

    // sparks off the bit
    for (let i = 0; i < 9; i++) {
      const a = -1.9 + (i * 0.21) + Math.sin(t * 3 + i) * 0.1;
      const d = 8 + ((i * 7 + Math.floor(t * 30)) % 22);
      ctx.fillStyle = i % 3 ? '#ffd34d' : '#fff6c8';
      ctx.fillRect(px - 6 + Math.cos(a) * d | 0, py - 58 + Math.sin(a) * d | 0, 2, 2);
    }

    // the culprit
    const bob = Math.sin(t * 2.2) * 3;
    const al = PD.art.sprites.alien, dr = PD.art.sprites.drill;
    const ax = px - 34, ay = py - 96 + bob;
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(0.85);
    ctx.drawImage(dr.frames[Math.floor(t * 12) % dr.frames.length], 0, 0,
      dr.w, dr.h, -dr.ox * 2, -dr.oy * 2, dr.w * 2, dr.h * 2);
    ctx.restore();
    ctx.drawImage(al.frames[0], 0, 0, al.w, al.h,
      ax - al.ox * 2 | 0, ay - al.oy * 2 | 0, al.w * 2, al.h * 2);
  }

  function title(ctx, g, t) {
    const cx = 168;
    const bob = Math.sin(t * 1.6) * 2;

    titleArt(ctx, t);

    F.draw(ctx, 'PLANET', cx, 26 + bob, '#ffd34d', { center: true, scale: 5, shadow: '#7a2a10' });
    F.draw(ctx, 'DESTROYER', cx, 66 + bob, '#ff5fa8', { center: true, scale: 4, shadow: '#3a0c30' });
    F.draw(ctx, 'A GREEDY LITTLE ALIEN', cx, 104, COL.dim, { center: true });
    F.draw(ctx, 'MINING SIMULATOR', cx, 114, COL.dim, { center: true });
    if (g.save.totalEarned > 0) {
      F.draw(ctx, 'KNOWN AS ' + D.titleFor(g.save.dominion), cx, 172, '#ff8ad8', { center: true });
    }

    const start = button(ctx, cx - 62, 130, 124, 18, g.save.totalEarned > 0 ? 'CONTINUE' : 'START DRILLING',
      { accent: '#2f7a4a' });
    let wipe = false;
    if (g.save.totalEarned > 0) wipe = button(ctx, cx - 62, 152, 124, 13, 'NEW GAME', { accent: '#8a2f4a' });

    F.draw(ctx, 'GET RICH.  BREAK WORLDS.', 12, 182, COL.gold);
    F.draw(ctx, 'OWN THE GALAXY.', 12, 192, COL.gold);
    F.draw(ctx, 'WASD / ARROWS   THRUSTERS', 12, 210, COL.text);
    F.draw(ctx, 'LEFT MOUSE      DRILL', 12, 220, COL.text);
    F.draw(ctx, 'RIGHT / SPACE   PISTOL', 12, 230, COL.text);
    F.draw(ctx, 'E DOCK   R BEAM HOME', 12, 240, COL.text);
    F.draw(ctx, 'CLICK ONCE TO ENABLE SOUND', 12, 254, COL.dim);
    return { start, wipe };
  }

  /* ------------------------------------------------------------------ pause */
  function pause(ctx, g) {
    ctx.fillStyle = 'rgba(8,4,18,0.7)';
    ctx.fillRect(0, 0, VW, VH);
    panel(ctx, VW / 2 - 80, 80, 160, 110, 'PAUSED');
    let r = { resume: false, ship: false };
    r.resume = button(ctx, VW / 2 - 64, 96, 128, 16, 'RESUME  [ESC]');
    if (button(ctx, VW / 2 - 64, 118, 128, 14, 'SOUND ' + (A.state.sfx ? 'ON' : 'OFF'))) A.toggleSfx(!A.state.sfx);
    if (button(ctx, VW / 2 - 64, 136, 128, 14, 'MUSIC ' + (A.state.music ? 'ON' : 'OFF'))) A.toggleMusic(!A.state.music);
    if (button(ctx, VW / 2 - 64, 154, 128, 14, 'SAVE GAME')) { g.saveGame(); g.toast('PROGRESS SAVED', COL.good); }
    r.ship = button(ctx, VW / 2 - 64, 172, 128, 14, 'RECALL TO SHIP', { accent: '#3f6ea8' });
    return r;
  }

  /* -------------------------------------------------------- destroyed banner */
  function victory(ctx, g) {
    const v = g.victory;
    if (!v) return null;
    const t = v.t;
    const slide = U.smoothstep(0, 0.5, t);
    const y = U.lerp(-60, 40, slide);

    ctx.fillStyle = 'rgba(8,4,18,' + (0.8 * slide).toFixed(2) + ')';
    ctx.fillRect(0, 0, VW, VH);

    F.draw(ctx, 'WORLD', VW / 2, y, '#ffd34d', { center: true, scale: 4, shadow: '#7a2a10' });
    F.draw(ctx, 'DESTROYED', VW / 2, y + 34, '#ff5a4d', { center: true, scale: 5, shadow: '#3a0c30' });

    if (t > 0.7) {
      const a = U.clamp((t - 0.7) / 0.4, 0, 1);
      ctx.globalAlpha = a;
      panel(ctx, VW / 2 - 100, 122, 200, 78);
      F.draw(ctx, v.name, VW / 2, 128, COL.text, { center: true });
      F.draw(ctx, 'CORE BOUNTY', VW / 2 - 92, 144, COL.dim);
      F.draw(ctx, '$' + U.fmt(v.reward), VW / 2 + 92, 144, COL.gold, { right: true });
      F.draw(ctx, 'GALAXY CONTROL', VW / 2 - 92, 156, COL.dim);
      F.draw(ctx, '+' + v.dominion.toFixed(1) + '%', VW / 2 + 92, 156, COL.good, { right: true });
      F.draw(ctx, 'PERMANENT VALUE BONUS', VW / 2 - 92, 168, COL.dim);
      F.draw(ctx, '+' + v.bonus + '%', VW / 2 + 92, 168, COL.lineHi, { right: true });
      if (v.unlocked) F.draw(ctx, 'UNLOCKED: ' + v.unlocked, VW / 2, 182, COL.gold, { center: true });
      ctx.globalAlpha = 1;
      if (t > 1.0) {
        return { ok: button(ctx, VW / 2 - 66, 208, 132, 16, 'BACK TO THE SHIP  [E]', { accent: '#2f7a4a' }) };
      }
    }
    return null;
  }

  /* ------------------------------------------------------------------- ending */
  function ending(ctx, g, t) {
    ctx.fillStyle = 'rgba(8,4,18,0.82)';
    ctx.fillRect(0, 0, VW, VH);
    F.draw(ctx, 'GALAXY', VW / 2, 40, '#ffd34d', { center: true, scale: 5, shadow: '#7a2a10' });
    F.draw(ctx, 'CONQUERED', VW / 2, 80, '#8affa0', { center: true, scale: 5, shadow: '#0d4a20' });
    F.draw(ctx, 'EVERY WORLD ON THE MAP IS RUBBLE.', VW / 2, 124, COL.text, { center: true });
    F.draw(ctx, 'YOU ARE OBSCENELY, HORRIBLY RICH.', VW / 2, 138, COL.text, { center: true });
    F.draw(ctx, 'TOTAL EARNED $' + U.fmt(g.save.totalEarned), VW / 2, 158, COL.gold, { center: true, scale: 2 });
    F.draw(ctx, 'THE SANDBOX STAYS OPEN - WORLDS REGROW.', VW / 2, 184, COL.dim, { center: true });
    return button(ctx, VW / 2 - 60, 204, 120, 16, 'KEEP DRILLING', { accent: '#2f7a4a' });
  }

  PD.ui = {
    VW, VH, COL, panel, bar, button, icon, hud, shop, title, pause, victory,
    sellSplash, ending, endFrame
  };
})(window.PD);

/* ===== src/dialog.js ===== */
/* Comms panel: the game's speech system. Portrait window, name plate, text
   that types itself in, and a prompt to advance. Used by the crew and the
   opening cutscene. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const F = PD.font;
  const A = PD.audio;

  const VW = 480, VH = 270;

  /* Who can talk, and what their comms channel looks like. */
  const CAST = {
    nix:   { name: 'NIX',      sub: 'SHIP INTELLIGENCE', spr: 'nix',   col: '#7ef9ff', bg: '#0a2430', voice: 900 },
    bolt:  { name: 'BOLT',     sub: 'FABRICATION UNIT',  spr: 'bolt',  col: '#ffb03d', bg: '#2a1c08', voice: 340 },
    gloop: { name: 'GLOOP',    sub: 'SHIP PET',          spr: 'gloop', col: '#c8ff5a', bg: '#16280a', voice: 1400 },
    you:   { name: 'YOU',      sub: 'FUTURE TYRANT',     spr: 'you',   col: '#ff5fa8', bg: '#2a0a1e', voice: 700 },
    sys:   { name: 'RUSTMAW',  sub: 'AUTOMATED',         spr: null,    col: '#39ffa6', bg: '#062018', voice: 1100 }
  };

  const q = [];          // pending lines
  let cur = null, chars = 0, blipT = 0, done = false;

  function push(who, text) { q.push({ who, text }); if (!cur) next(); }
  function next() {
    cur = q.shift() || null;
    chars = 0; done = false;
  }
  function clear() { q.length = 0; cur = null; }
  const active = () => !!cur;

  /* Advance: first press finishes the typing, second moves on. */
  function advance() {
    if (!cur) return false;
    if (!done) { chars = cur.text.length; done = true; return true; }
    next();
    return true;
  }

  function update(dt) {
    if (!cur) return;
    if (!done) {
      chars += dt * 46;
      blipT -= dt;
      if (blipT <= 0) {
        blipT = 0.045;
        const c = CAST[cur.who] || CAST.sys;
        A.tone(c.voice + U.rand(-90, 90), { type: 'square', dur: 0.02, vol: 0.035 });
      }
      if (chars >= cur.text.length) { chars = cur.text.length; done = true; }
    }
  }

  function wrap(text, maxChars) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      if ((line + ' ' + w).trim().length > maxChars) { lines.push(line.trim()); line = w; }
      else line += ' ' + w;
    }
    if (line.trim()) lines.push(line.trim());
    return lines;
  }

  function draw(ctx, g, t, skinAlien) {
    if (!cur) return;
    const c = CAST[cur.who] || CAST.sys;
    const H = 62, Y = VH - H - 6, X = 10, W = VW - 20;

    // angled comms frame
    ctx.fillStyle = 'rgba(4,2,10,0.85)';
    ctx.fillRect(X, Y, W, H);
    ctx.strokeStyle = c.col;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(X + 6.5, Y + 0.5); ctx.lineTo(X + W - 0.5, Y + 0.5);
    ctx.lineTo(X + W - 0.5, Y + H - 6.5); ctx.lineTo(X + W - 6.5, Y + H - 0.5);
    ctx.lineTo(X + 0.5, Y + H - 0.5); ctx.lineTo(X + 0.5, Y + 6.5);
    ctx.closePath(); ctx.stroke();
    // corner ticks
    ctx.fillStyle = c.col;
    ctx.fillRect(X + W - 26, Y + 2, 22, 2);
    ctx.fillRect(X + 2, Y + H - 4, 22, 2);

    // portrait window
    const PX = X + 5, PY = Y + 5, PW = 46, PH = H - 10;
    ctx.fillStyle = c.bg; ctx.fillRect(PX, PY, PW, PH);
    ctx.strokeStyle = c.col; ctx.strokeRect(PX + 0.5, PY + 0.5, PW - 1, PH - 1);
    ctx.save();
    ctx.beginPath(); ctx.rect(PX, PY, PW, PH); ctx.clip();
    const bob = Math.sin(t * 2.4) * 1.5;
    if (c.spr === 'you') {
      const al = skinAlien || PD.art.sprites.alien;
      ctx.drawImage(al.frames[Math.sin(t * 1.3) > 0.93 ? 2 : 0], 0, 0, al.w, al.h,
        PX + PW / 2 - al.w | 0, PY + PH - al.h * 1.9 + bob | 0, al.w * 2, al.h * 2);
    } else if (c.spr) {
      const sp = PD.artint.S[c.spr];
      const sc = Math.min(2, (PH - 4) / sp.h);
      ctx.drawImage(sp.frames[Math.floor(t * 3) % sp.frames.length], 0, 0, sp.w, sp.h,
        PX + PW / 2 - sp.w * sc / 2 | 0, PY + PH - sp.h * sc + bob | 0, sp.w * sc, sp.h * sc);
    } else {
      F.draw(ctx, '///', PX + PW / 2, PY + PH / 2 - 4, c.col, { center: true, shadow: false });
    }
    // portrait scanlines
    ctx.globalAlpha = 0.2; ctx.fillStyle = '#000';
    for (let yy = PY; yy < PY + PH; yy += 2) ctx.fillRect(PX, yy, PW, 1);
    ctx.globalAlpha = 1;
    ctx.restore();

    // name plate
    ctx.fillStyle = c.col;
    ctx.fillRect(PX, Y - 5, PW + 74, 9);
    F.draw(ctx, c.name, PX + 3, Y - 4, '#0a0614', { shadow: false });
    F.draw(ctx, c.sub, PX + 3 + F.width(c.name, 1) + 8, Y - 4, 'rgba(10,6,20,0.7)', { shadow: false });

    // typed body text
    const shown = cur.text.slice(0, Math.floor(chars));
    const lines = wrap(shown, 62);
    for (let i = 0; i < Math.min(lines.length, 4); i++) {
      F.draw(ctx, lines[i], PX + PW + 8, Y + 10 + i * 11, '#f2e9ff', { shadow: false });
    }
    if (done && Math.sin(t * 6) > 0) {
      F.draw(ctx, q.length ? '>>' : '>', X + W - 14, Y + H - 12, c.col, { shadow: false });
    }
  }

  PD.dialog = { CAST, push, next, clear, advance, update, draw, active, get queued() { return q.length; } };
})(window.PD);

/* ===== src/terminal.js ===== */
/* RUSTMAW OS -- the in-fiction console.
   Every menu in the game is a screen the alien is actually standing at: a
   bezel, a phosphor tube, a boot sequence, scanlines and a cursor. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const F = PD.font;
  const A = PD.audio;

  const VW = 480, VH = 270;

  /* Each app gets its own phosphor colour so you know where you are. */
  const THEME = {
    market: { hi: '#39ffa6', mid: '#1e9e68', lo: '#0d3d2a', bg: '#04140f', name: 'CARGO EXCHANGE' },
    fab:    { hi: '#ffb03d', mid: '#c07a20', lo: '#3d2a0d', bg: '#140f04', name: 'FABRICATOR' },
    bay:    { hi: '#58e8ff', mid: '#2b8fae', lo: '#0d2f3d', bg: '#041014', name: 'DRONE BAY' },
    vanity: { hi: '#ff8ad8', mid: '#b0459a', lo: '#3d0d2f', bg: '#140418', name: 'IDENTITY SUITE' },
    nav:    { hi: '#9ab4ff', mid: '#4f66c0', lo: '#161d3d', bg: '#060818', name: 'NAV COMPUTER' }
  };

  const state = {
    app: null, t: 0, boot: 0, lines: [], scroll: 0,
    sel: 0, flash: 0, msg: '', msgT: 0, msgCol: null, cat: 0, tip: ''
  };

  const BOOT = {
    market: ['RUSTMAW OS 4.21', 'LINKING BLACK-MARKET RELAY...', 'RELAY OK  [ENCRYPTED]', 'NO QUESTIONS ASKED.'],
    fab: ['RUSTMAW OS 4.21', 'FABRICATOR ARM ONLINE', 'FEEDSTOCK BIN: READING...', 'BOLT SAYS HURRY UP.'],
    bay: ['RUSTMAW OS 4.21', 'DRONE SWARM HANDSHAKE...', 'ALL UNITS NOMINAL', 'THEY NEVER SLEEP.'],
    vanity: ['RUSTMAW OS 4.21', 'IDENTITY SUITE LOADED', 'GENE VAT: WARM', 'LOOK THE PART.'],
    nav: ['RUSTMAW OS 4.21', 'STELLAR CARTOGRAPHY ONLINE', 'PLOTTING VICTIMS...', 'SELECT A TARGET.']
  };

  function open(app) {
    state.app = app;
    state.t = 0; state.boot = 0; state.scroll = 0; state.msgT = 0;
    A.sfx.tone(180, { type: 'square', to: 900, dur: 0.18, vol: 0.1 });
    A.tone(1200, { type: 'square', dur: 0.03, vol: 0.05, delay: 0.2 });
  }
  function close() {
    if (!state.app) return;
    state.app = null;
    A.sfx.tone(700, { type: 'square', to: 140, dur: 0.16, vol: 0.09 });
  }
  function say(msg, col) { state.msg = msg; state.msgT = 2.6; state.msgCol = col; A.sfx.click(); }

  /* --------------------------------------------------------------- chrome */
  const SX = 14, SY = 10, SW = VW - 28, SH = VH - 20;
  const IX = SX + 12, IY = SY + 26, IW = SW - 24, IH = SH - 58;

  function chrome(ctx, th, title, sub) {
    // bezel
    ctx.fillStyle = '#171325';
    ctx.fillRect(SX - 6, SY - 6, SW + 12, SH + 12);
    ctx.fillStyle = '#241f38';
    ctx.fillRect(SX - 4, SY - 4, SW + 8, SH + 8);
    ctx.fillStyle = '#3a3358';
    ctx.fillRect(SX - 4, SY - 4, SW + 8, 2);
    for (const [bx, by] of [[SX - 2, SY - 2], [SX + SW - 2, SY - 2], [SX - 2, SY + SH - 2], [SX + SW - 2, SY + SH - 2]]) {
      ctx.fillStyle = '#6f6798'; ctx.fillRect(bx, by, 3, 3);
      ctx.fillStyle = '#171325'; ctx.fillRect(bx + 1, by + 1, 1, 1);
    }

    // tube
    ctx.fillStyle = th.bg;
    ctx.fillRect(SX, SY, SW, SH);

    // header rail
    ctx.fillStyle = th.lo;
    ctx.fillRect(SX, SY, SW, 14);
    ctx.fillStyle = th.mid;
    ctx.fillRect(SX, SY + 14, SW, 1);
    F.draw(ctx, 'RUSTMAW OS // ' + title, SX + 6, SY + 4, th.hi, { shadow: false });
    if (sub) F.draw(ctx, sub, SX + SW - 6, SY + 4, th.mid, { right: true, shadow: false });

    // footer rail
    ctx.fillStyle = th.lo;
    ctx.fillRect(SX, SY + SH - 14, SW, 14);
    ctx.fillStyle = th.mid;
    ctx.fillRect(SX, SY + SH - 15, SW, 1);
  }

  /* Phosphor bloom, scanlines and the occasional bad frame. */
  function glassOver(ctx, th, t) {
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#000000';
    for (let y = SY; y < SY + SH; y += 3) ctx.fillRect(SX, y, SW, 1);
    ctx.globalAlpha = 1;

    // rolling brightness band
    const band = (t * 42) % (SH + 60) - 30;
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = th.hi;
    ctx.fillRect(SX, SY + band, SW, 18);
    ctx.globalAlpha = 1;

    // rare glitch tear
    if (Math.sin(t * 1.7) > 0.995) {
      const gy = SY + ((t * 997) % SH | 0);
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = th.mid;
      ctx.fillRect(SX, gy, SW, 2);
      ctx.globalAlpha = 1;
    }

    // corner darkening
    const g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.3, VW / 2, VH / 2, VH * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = g;
    ctx.fillRect(SX, SY, SW, SH);
  }

  function cursor(ctx, x, y, th, t) {
    if (Math.sin(t * 8) > 0) ctx.fillStyle = th.hi, ctx.fillRect(x, y, 4, 7);
  }

  /* A selectable console row. Returns {hover, clicked}. */
  function row(ctx, x, y, w, h, th, opts) {
    opts = opts || {};
    const m = PD.input.mouse;
    const hover = m.inside && m.x >= x && m.x < x + w && m.y >= y && m.y < y + h && opts.enabled !== false;
    if (hover || opts.active) {
      ctx.fillStyle = opts.active ? th.lo : 'rgba(255,255,255,0.07)';
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = th.mid;
      ctx.fillRect(x, y, 1, h);
    }
    if (hover) F.draw(ctx, '>', x - 7, y + (h - 7) / 2 | 0, th.hi, { shadow: false });
    const clicked = hover && m.leftPressed;
    if (clicked) A.tone(900, { type: 'square', dur: 0.03, vol: 0.06 });
    return { hover, clicked };
  }

  /* A chunky console key/button. */
  function key(ctx, x, y, w, h, label, th, opts) {
    opts = opts || {};
    const m = PD.input.mouse;
    const on = opts.enabled !== false;
    const hover = on && m.inside && m.x >= x && m.x < x + w && m.y >= y && m.y < y + h;
    ctx.fillStyle = hover ? th.mid : (on ? th.lo : '#1a1a1a');
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = on ? (hover ? th.hi : th.mid) : '#333';
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    F.draw(ctx, label, x + w / 2, y + (h - 7) / 2 | 0, on ? (hover ? '#ffffff' : th.hi) : '#555', { center: true, shadow: false });
    const clicked = hover && m.leftPressed;
    if (clicked) A.sfx.click();
    return clicked;
  }

  function bar(ctx, x, y, w, h, frac, th) {
    ctx.fillStyle = th.lo; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = th.hi; ctx.fillRect(x, y, Math.round(w * U.clamp(frac, 0, 1)), h);
  }

  /* ---------------------------------------------------------------- market */
  function appMarket(ctx, g, th, t) {
    const vault = g.save.vault;
    const keys = Object.keys(vault).filter(k => vault[k] > 0).sort((a, b) => D.MAT[b].cr - D.MAT[a].cr);
    F.draw(ctx, 'ORE                QTY    UNIT      VALUE', IX, IY, th.mid, { shadow: false });
    ctx.fillStyle = th.lo; ctx.fillRect(IX, IY + 9, IW, 1);

    if (!keys.length) {
      F.draw(ctx, 'FEEDSTOCK BIN EMPTY.', IX, IY + 22, th.mid, { shadow: false });
      F.draw(ctx, 'GO BREAK SOMETHING.', IX, IY + 34, th.hi, { shadow: false });
    }

    let total = 0;
    const maxRows = 9;
    for (let i = 0; i < Math.min(keys.length, maxRows); i++) {
      const k = keys[i], m = D.MAT[k], n = vault[k];
      const unit = Math.round(m.cr * g.valueMult());
      const val = unit * n;
      total += val;
      const y = IY + 14 + i * 13;
      const r = row(ctx, IX, y, IW, 12, th);
      ctx.fillStyle = m.c[1]; ctx.fillRect(IX + 2, y + 3, 6, 6);
      ctx.fillStyle = m.c[0]; ctx.fillRect(IX + 2, y + 3, 6, 2);
      F.draw(ctx, m.name, IX + 12, y + 3, th.hi, { shadow: false });
      F.draw(ctx, String(n), IX + 128, y + 3, th.hi, { shadow: false });
      F.draw(ctx, '$' + U.fmt(unit), IX + 176, y + 3, th.mid, { shadow: false });
      F.draw(ctx, '$' + U.fmt(val), IX + 262, y + 3, th.hi, { shadow: false });
      if (key(ctx, IX + IW - 96, y, 44, 12, 'SELL', th)) g.sellFromVault(+k, n);
      if (key(ctx, IX + IW - 48, y, 46, 12, 'SELL 1', th)) g.sellFromVault(+k, 1);
      if (r.hover) state.tip = m.name.toUpperCase() + ' -- ' + m.kg + 'KG PER UNIT, $' + U.fmt(unit) + ' EACH';
    }
    if (keys.length > maxRows) {
      F.draw(ctx, '+' + (keys.length - maxRows) + ' MORE LINES BELOW THE FOLD', IX, IY + 14 + maxRows * 13, th.mid, { shadow: false });
    }

    // ticker footer
    for (let i = maxRows; i < keys.length; i++) total += Math.round(D.MAT[keys[i]].cr * g.valueMult()) * vault[keys[i]];
    ctx.fillStyle = th.lo; ctx.fillRect(IX, IY + IH - 22, IW, 1);
    F.draw(ctx, 'BIN TOTAL', IX, IY + IH - 16, th.mid, { shadow: false });
    F.draw(ctx, '$' + U.fmt(total), IX + 90, IY + IH - 16, th.hi, { shadow: false });
    if (key(ctx, IX + IW - 132, IY + IH - 19, 130, 14, 'LIQUIDATE ENTIRE BIN', th, { enabled: total > 0 })) g.sellAll();

    // scrolling relay chatter, so the tube always has something alive on it
    const feed = [
      'GEM PRICES UP ON GRIEF FROM THE INNER WORLDS',
      'SALVAGE BOARD: NO PROVENANCE REQUIRED',
      'BUYER SEEKS CORE FRAGMENTS. DISCRETION GUARANTEED',
      'INSURERS DECLINE TO COVER "ACTS OF YOU"',
      'RELAY 7 ASKS THAT YOU STOP SELLING PEOPLE THEIR OWN PLANET'
    ];
    const line = feed.join('   ///   ') + '   ///   ';
    const shift = Math.floor((t * 14) % line.length);
    const scroll = (line.slice(shift) + line.slice(0, shift)).slice(0, 66);
    ctx.fillStyle = th.lo;
    ctx.fillRect(IX, IY + IH - 44, IW, 11);
    F.draw(ctx, scroll, IX + 2, IY + IH - 42, th.hi, { shadow: false });
  }

  /* ------------------------------------------------------------ fabricator */
  function appFab(ctx, g, th, t) {
    const list = D.UPGRADES;
    const perPage = 6;
    const page = U.clamp(state.scroll, 0, Math.max(0, Math.ceil(list.length / perPage) - 1));
    state.scroll = page;

    F.draw(ctx, 'MODULE                     STATE        COST', IX, IY, th.mid, { shadow: false });
    ctx.fillStyle = th.lo; ctx.fillRect(IX, IY + 9, IW, 1);

    for (let i = 0; i < perPage; i++) {
      const idx = page * perPage + i;
      if (idx >= list.length) break;
      const u = list[idx];
      const lvl = g.save.upg[u.id] || 0;
      const maxed = lvl >= u.max;
      const cost = D.upgradeCost(u, lvl);
      const rec = maxed ? [] : D.recipe(u, lvl);
      const haveAll = rec.every(r => (g.save.vault[r.mat] || 0) >= r.qty);
      const canAfford = g.save.credits >= cost && haveAll;
      const y = IY + 14 + i * 26;

      const r = row(ctx, IX, y, IW, 25, th, { active: state.sel === idx });
      if (r.clicked) state.sel = idx;

      ctx.drawImage(PD.art.ICON[u.icon], IX + 2, y + 4);
      F.draw(ctx, u.name, IX + 20, y + 3, maxed ? th.mid : th.hi, { shadow: false });
      F.draw(ctx, u.show(lvl), IX + 20, y + 14, th.mid, { shadow: false });
      F.draw(ctx, 'LV' + lvl + '/' + u.max, IX + 150, y + 3, th.mid, { shadow: false });
      bar(ctx, IX + 150, y + 14, 40, 4, lvl / u.max, th);

      if (maxed) {
        F.draw(ctx, 'MAXED', IX + 210, y + 8, th.hi, { shadow: false });
      } else {
        // requirement chips: credits then ore
        F.draw(ctx, '$' + U.fmt(cost), IX + 206, y + 3,
          g.save.credits >= cost ? th.hi : '#ff5a4d', { shadow: false });
        let cxp = IX + 206;
        for (const req of rec) {
          const have = g.save.vault[req.mat] || 0;
          const ok = have >= req.qty;
          const m = D.MAT[req.mat];
          ctx.fillStyle = m.c[1]; ctx.fillRect(cxp, y + 15, 5, 5);
          F.draw(ctx, have + '/' + req.qty, cxp + 7, y + 14, ok ? th.hi : '#ff5a4d', { shadow: false });
          cxp += 8 + F.width(have + '/' + req.qty, 1) + 6;
        }
        if (key(ctx, IX + IW - 62, y + 5, 60, 15, 'FABRICATE', th, { enabled: canAfford })) g.fabricate(u.id);
      }
      if (r.hover) state.tip = u.blurb.toUpperCase();
    }

    const pages = Math.ceil(list.length / perPage);
    if (key(ctx, IX, IY + IH - 16, 46, 14, '< PREV', th, { enabled: page > 0 })) state.scroll--;
    if (key(ctx, IX + 50, IY + IH - 16, 46, 14, 'NEXT >', th, { enabled: page < pages - 1 })) state.scroll++;
    F.draw(ctx, 'PAGE ' + (page + 1) + '/' + pages, IX + 104, IY + IH - 13, th.mid, { shadow: false });
  }

  /* -------------------------------------------------------------- drone bay */
  function appBay(ctx, g, th, t) {
    const n = g.save.upg.drones || 0;
    const yieldLv = g.save.upg.droneyield || 0;
    F.draw(ctx, 'AUTONOMOUS SALVAGE SWARM', IX, IY, th.hi, { shadow: false });
    F.draw(ctx, 'THEY STRIP THE RUBBLE WHILE YOU FLY.', IX, IY + 11, th.mid, { shadow: false });

    // live swarm readout
    const spr = PD.art.sprites.drone;
    for (let i = 0; i < Math.min(n, 24); i++) {
      const col = i % 12, rw = (i / 12) | 0;
      const bob = Math.sin(t * 3 + i) * 2;
      ctx.drawImage(spr.frames[(Math.floor(t * 10) + i) % 2],
        IX + col * 17, IY + 26 + rw * 16 + bob | 0);
    }
    if (n === 0) F.draw(ctx, 'NO UNITS DEPLOYED.', IX, IY + 30, '#ff5a4d', { shadow: false });
    if (n > 24) F.draw(ctx, '+' + (n - 24) + ' MORE IN THE RACKS', IX, IY + 58, th.mid, { shadow: false });

    const boxY = IY + 74;
    ctx.fillStyle = th.lo; ctx.fillRect(IX, boxY, IW, 1);
    F.draw(ctx, 'UNITS', IX, boxY + 8, th.mid, { shadow: false });
    F.draw(ctx, String(n), IX + 60, boxY + 8, th.hi, { shadow: false });
    F.draw(ctx, 'YIELD', IX, boxY + 20, th.mid, { shadow: false });
    F.draw(ctx, 'X' + (1 + yieldLv * 0.55).toFixed(2), IX + 60, boxY + 20, th.hi, { shadow: false });
    F.draw(ctx, 'INCOME', IX, boxY + 32, th.mid, { shadow: false });
    F.draw(ctx, '$' + U.fmt(g.droneIncome()) + ' /SEC', IX + 60, boxY + 32, th.hi, { shadow: false });
    F.draw(ctx, '$' + U.fmt(g.droneIncome() * 60) + ' /MIN', IX + 150, boxY + 32, th.mid, { shadow: false });

    const mk = (id, label, y) => {
      const u = D.UPG[id];
      const lvl = g.save.upg[id] || 0;
      const cost = D.upgradeCost(u, lvl);
      const rec = D.recipe(u, lvl);
      const haveAll = rec.every(r => (g.save.vault[r.mat] || 0) >= r.qty);
      const ok = lvl < u.max && g.save.credits >= cost && haveAll;
      F.draw(ctx, label, IX + 200, y, th.mid, { shadow: false });
      let cxp = IX + 200;
      F.draw(ctx, '$' + U.fmt(cost), cxp, y + 10, g.save.credits >= cost ? th.hi : '#ff5a4d', { shadow: false });
      cxp += F.width('$' + U.fmt(cost), 1) + 8;
      for (const req of rec) {
        const have = g.save.vault[req.mat] || 0;
        ctx.fillStyle = D.MAT[req.mat].c[1]; ctx.fillRect(cxp, y + 11, 5, 5);
        F.draw(ctx, have + '/' + req.qty, cxp + 7, y + 10, have >= req.qty ? th.hi : '#ff5a4d', { shadow: false });
        cxp += 8 + F.width(have + '/' + req.qty, 1) + 5;
      }
      if (key(ctx, IX + IW - 62, y, 60, 15, lvl >= u.max ? 'MAXED' : 'BUILD', th, { enabled: ok })) g.fabricate(id);
    };
    mk('drones', 'ADD DRONE UNIT', boxY + 4);
    mk('droneyield', 'UPGRADE CLAWS', boxY + 30);
  }

  /* ---------------------------------------------------------------- vanity */
  function appVanity(ctx, g, th, t) {
    const cats = D.COSMETICS;
    state.cat = U.clamp(state.cat, 0, cats.length - 1);
    for (let i = 0; i < cats.length; i++) {
      if (key(ctx, IX + i * 86, IY, 82, 14, cats[i].name, th, { enabled: true })) { state.cat = i; A.sfx.click(); }
      if (state.cat === i) { ctx.fillStyle = th.hi; ctx.fillRect(IX + i * 86, IY + 14, 82, 1); }
    }
    const cat = cats[state.cat];
    F.draw(ctx, cat.blurb, IX, IY + 20, th.mid, { shadow: false });

    for (let i = 0; i < cat.options.length; i++) {
      const o = cat.options[i];
      const y = IY + 30 + i * 14;
      const owned = o.cost === 0 || (g.save.owned[cat.id] || {})[o.id];
      const worn = (g.save.cos[cat.id] || cat.options[0].id) === o.id;
      const r = row(ctx, IX, y, IW - 116, 13, th, { active: worn });
      for (let k = 0; k < 3; k++) { ctx.fillStyle = o.c[k]; ctx.fillRect(IX + 2 + k * 7, y + 3, 6, 7); }
      F.draw(ctx, o.name, IX + 26, y + 3, worn ? '#ffffff' : th.hi, { shadow: false });
      if (worn) F.draw(ctx, 'WORN', IX + 158, y + 3, th.hi, { shadow: false });
      else if (owned) F.draw(ctx, 'OWNED', IX + 158, y + 3, th.mid, { shadow: false });
      else F.draw(ctx, '$' + U.fmt(o.cost), IX + 158, y + 3, g.save.credits >= o.cost ? th.hi : '#ff5a4d', { shadow: false });
      if (r.clicked) {
        if (owned) g.equipCosmetic(cat.id, o.id);
        else g.buyCosmetic(cat.id, o.id);
      }
    }

    // live mannequin
    const skin = PD.art.skinFor(g.save.cos);
    const bx = IX + IW - 50, by = IY + 88;
    ctx.fillStyle = th.lo; ctx.fillRect(bx - 34, by - 68, 72, 104);
    ctx.strokeStyle = th.mid; ctx.strokeRect(bx - 33.5, by - 67.5, 71, 103);
    for (let i = 0; i < 6; i++) { ctx.fillStyle = th.mid; ctx.fillRect(bx - 32, by - 66 + i * 17, 68, 1); }
    const al = skin.alien, dr = skin.drill;
    ctx.save();
    ctx.translate(bx, by + Math.sin(t * 2) * 2);
    ctx.rotate(0.5);
    ctx.drawImage(dr.frames[Math.floor(t * 10) % dr.frames.length], -dr.ox * 1.4 | 0, -dr.oy * 1.4 | 0, dr.w * 1.4, dr.h * 1.4);
    ctx.restore();
    ctx.drawImage(al.frames[0], 0, 0, al.w, al.h,
      bx - al.ox * 1.6 | 0, by + Math.sin(t * 2) * 2 - al.oy * 1.6 | 0, al.w * 1.6, al.h * 1.6);
    F.draw(ctx, 'PREVIEW', bx, by + 40, th.mid, { center: true, shadow: false });

    // the dossier: who the galaxy thinks you are now
    const dy = IY + 126;
    ctx.fillStyle = th.lo; ctx.fillRect(IX, dy, IW - 108, 1);
    F.draw(ctx, 'GALACTIC DOSSIER', IX, dy + 6, th.hi, { shadow: false });
    F.draw(ctx, 'KNOWN AS', IX, dy + 20, th.mid, { shadow: false });
    F.draw(ctx, D.titleFor(g.save.dominion), IX + 78, dy + 20, '#ffffff', { shadow: false });
    F.draw(ctx, 'BOUNTY', IX, dy + 31, th.mid, { shadow: false });
    F.draw(ctx, '$' + U.fmt(D.bountyFor(g.save)), IX + 78, dy + 31, '#ff5a4d', { shadow: false });
    F.draw(ctx, 'WORLDS ENDED', IX, dy + 42, th.mid, { shadow: false });
    F.draw(ctx, String(g.save.destroyed.filter(Boolean).length), IX + 78, dy + 42, th.hi, { shadow: false });
    F.draw(ctx, 'GALAXY HELD', IX, dy + 53, th.mid, { shadow: false });
    F.draw(ctx, g.save.dominion.toFixed(1) + '%', IX + 78, dy + 53, th.hi, { shadow: false });
    bar(ctx, IX + 120, dy + 54, 96, 5, g.save.dominion / 100, th);
  }

  /* ------------------------------------------------------------------- nav */
  function appNav(ctx, g, th, t) {
    F.draw(ctx, 'TARGET                  CLASS      G     STATUS', IX, IY, th.mid, { shadow: false });
    ctx.fillStyle = th.lo; ctx.fillRect(IX, IY + 9, IW, 1);
    for (let i = 0; i < D.BODIES.length; i++) {
      const b = D.BODIES[i];
      const y = IY + 14 + i * 14;
      const unlocked = i <= g.save.unlocked;
      const done = g.save.destroyed[i];
      const here = i === g.bodyIndex;
      const r = row(ctx, IX, y, IW, 13, th, { active: here, enabled: unlocked });

      // a tiny live rendering of the target
      const moon = g.navIcon(i);
      if (unlocked && moon) ctx.drawImage(moon, 0, 0, moon.width, moon.height, IX + 2, y + 1, 11, 11);
      else { ctx.fillStyle = th.lo; ctx.fillRect(IX + 3, y + 3, 9, 9); }

      F.draw(ctx, unlocked ? b.name : '[ENCRYPTED]', IX + 16, y + 4, unlocked ? (done ? th.mid : th.hi) : th.lo, { shadow: false });
      F.draw(ctx, unlocked ? b.kind.slice(0, 12) : '---', IX + 148, y + 4, th.mid, { shadow: false });
      F.draw(ctx, unlocked ? String(b.gravity) : '--', IX + 226, y + 4, th.mid, { shadow: false });
      F.draw(ctx, done ? 'RUBBLE' : (unlocked ? 'INTACT  $' + U.fmt(b.reward) : 'LOCKED'), IX + 254, y + 4,
        done ? th.mid : (unlocked ? th.hi : th.lo), { shadow: false });
      if (here) F.draw(ctx, 'IN ORBIT', IX + IW - 4, y + 4, '#ffffff', { right: true, shadow: false });
      else if (unlocked && key(ctx, IX + IW - 68, y, 66, 13, 'SET COURSE', th)) g.travelTo(i);
      if (r.hover && unlocked) { state.tip = b.blurb.toUpperCase(); state.sel = i; }
    }

    // survey panel for whichever world is selected
    const sel = D.BODIES[U.clamp(state.sel, 0, g.save.unlocked)];
    const py = IY + 14 + D.BODIES.length * 14 + 4;
    ctx.fillStyle = th.lo; ctx.fillRect(IX, py, IW, 1);
    F.draw(ctx, 'SURVEY // ' + sel.name, IX, py + 4, th.hi, { shadow: false });
    F.draw(ctx, 'RADIUS ' + sel.radius + '   GRAVITY ' + sel.gravity +
      '   HOSTILES ' + Math.round(sel.enemyRate * 100) + '%   BOUNTY $' + U.fmt(sel.reward),
      IX + 120, py + 4, th.mid, { shadow: false });
    // one stacked bar for the ore signature, with a legend underneath
    const tw = sel.ores.reduce((n, o) => n + o[1], 0);
    const sorted = sel.ores.slice().sort((a, b) => b[1] - a[1]);
    let ox2 = IX;
    for (const [mid, wt] of sorted) {
      const wpx = Math.max(2, Math.round(wt / tw * IW));
      ctx.fillStyle = D.MAT[mid].c[1];
      ctx.fillRect(ox2, py + 14, wpx, 7);
      ctx.fillStyle = D.MAT[mid].c[0];
      ctx.fillRect(ox2, py + 14, wpx, 2);
      ox2 += wpx;
    }
    for (let i = 0; i < Math.min(6, sorted.length); i++) {
      const m = D.MAT[sorted[i][0]];
      const lx = IX + i * 62;
      ctx.fillStyle = m.c[1];
      ctx.fillRect(lx, py + 25, 5, 5);
      F.draw(ctx, m.name.slice(0, 8), lx + 8, py + 24, th.mid, { shadow: false });
    }
  }

  const APPS = { market: appMarket, fab: appFab, bay: appBay, vanity: appVanity, nav: appNav };

  /* ------------------------------------------------------------------ draw */
  function draw(ctx, g, dt) {
    if (!state.app) return;
    state.t += dt;
    state.boot = Math.min(1, state.boot + dt * 2.4);
    state.msgT = Math.max(0, state.msgT - dt);
    const th = THEME[state.app];
    const t = state.t;
    state.tip = '';

    chrome(ctx, th, th.name, '$' + U.fmt(g.save.credits) + '  //  ' + g.world.body.name);

    if (state.boot < 1) {
      // boot sequence types itself in before the app appears
      const lines = BOOT[state.app];
      const shown = Math.floor(state.boot * lines.length * 1.4);
      for (let i = 0; i < Math.min(lines.length, shown + 1); i++) {
        const full = lines[i];
        const chars = i < shown ? full.length : Math.floor((state.boot * lines.length * 1.4 - shown) * 26);
        F.draw(ctx, '> ' + full.slice(0, chars), IX, IY + i * 11, th.hi, { shadow: false });
        if (i === Math.min(lines.length - 1, shown)) cursor(ctx, IX + F.width('> ' + full.slice(0, chars), 1) + 1, IY + i * 11, th, t);
      }
    } else {
      APPS[state.app](ctx, g, th, t);
    }

    // status line + disconnect
    if (state.tip) {
      F.draw(ctx, state.tip, SX + 6, SY + SH - 11, th.mid, { shadow: false });
    } else if (state.msgT > 0) {
      ctx.globalAlpha = U.clamp(state.msgT, 0, 1);
      F.draw(ctx, state.msg, SX + 6, SY + SH - 11, state.msgCol || th.hi, { shadow: false });
      ctx.globalAlpha = 1;
    } else {
      F.draw(ctx, 'SESSION ' + (Math.floor(t * 3) % 1000 + 100) + '  //  LINK STABLE', SX + 6, SY + SH - 11, th.mid, { shadow: false });
    }
    if (key(ctx, SX + SW - 110, SY + SH - 13, 106, 11, 'DISCONNECT  [ESC]', th)) close();

    glassOver(ctx, th, t);
  }

  PD.term = {
    open, close, draw, say, key, row, chrome, glassOver, THEME,
    get app() { return state.app; },
    get booting() { return state.boot < 1; },
    state
  };
})(window.PD);

/* ===== src/cutscene.js ===== */
/* Cold open. Establishes the ship, the crew, and the fact that you are the
   villain of this story. Skippable, and only shown on a fresh save. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const F = PD.font;
  const A = PD.audio;
  const AI = PD.artint;

  const VW = 480, VH = 270;

  let t = 0, beat = 0, done = true, moon = null, stars = null, letter = 0, shipX = -120, card = null;

  const BEATS = [
    { dur: 4.2, card: ['THE OUTER DARK', 'SOMEWHERE EXPENSIVE'] },
    { dur: 0, say: ['sys', 'RUSTMAW SALVAGE BARGE // WAKING OCCUPANT ONE OF ONE.'] },
    { dur: 0, say: ['nix', 'Good morning. Your balance is zero credits. Your debt is not zero credits.'] },
    { dur: 0, say: ['nix', 'The bank has sent a very polite drone to collect your organs.'] },
    { dur: 0, say: ['you', 'Then we take the money out of the rocks. Every rock. All of them.'] },
    { dur: 0, say: ['nix', 'Ah. The tyrant plan. I have a folder for that. It is already quite thick.'] },
    { dur: 0, say: ['bolt', 'Drill is warm. Bin is empty. Go and be a problem, boss.'] },
    { dur: 0, say: ['gloop', 'GLOOP presses against the tank glass and chirps encouragingly.'] },
    { dur: 3.6, card: ['OBJECTIVE', 'GET RICH.  BREAK WORLDS.  OWN THE GALAXY.'] }
  ];

  function start() {
    t = 0; beat = 0; done = false; letter = 0; shipX = -120; card = null;
    moon = AI.buildMoon(190, '#9aa8c4', 991);
    const rnd = U.mulberry32(4242);
    stars = [];
    for (let i = 0; i < 150; i++) {
      stars.push({ x: rnd() * VW, y: rnd() * VH, s: rnd() > 0.85 ? 2 : 1, p: 0.2 + rnd() * 0.8, tw: rnd() * 6.28 });
    }
    PD.dialog.clear();
    enterBeat();
    A.music(true);
    A.setIntensity(0.15);
  }

  function enterBeat() {
    const b = BEATS[beat];
    if (!b) { finish(); return; }
    card = b.card || null;
    if (b.say) PD.dialog.push(b.say[0], b.say[1]);
  }

  function finish() { done = true; PD.dialog.clear(); }

  function update(dt, g) {
    if (done) return;
    t += dt;
    letter = Math.min(1, letter + dt * 2.5);
    shipX = U.damp(shipX, 190, 0.5, dt);

    const IN = PD.input;
    if (IN.hit('esc')) { finish(); return; }

    const b = BEATS[beat];
    if (!b) { finish(); return; }

    if (b.say) {
      PD.dialog.update(dt);
      if (IN.hit('KeyE') || IN.hit('space') || IN.hit('enter') || IN.mouse.leftPressed) {
        if (!PD.dialog.advance() || !PD.dialog.active()) { beat++; t = 0; enterBeat(); }
      }
      if (!PD.dialog.active()) { beat++; t = 0; enterBeat(); }
    } else {
      if (t > b.dur || IN.hit('KeyE') || IN.hit('space') || IN.hit('enter') || IN.mouse.leftPressed) {
        beat++; t = 0; enterBeat();
      }
    }
  }

  function draw(ctx, g, time) {
    // deep space
    const grd = ctx.createLinearGradient(0, 0, 0, VH);
    grd.addColorStop(0, '#0d0a24');
    grd.addColorStop(1, '#04030e');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, VW, VH);

    for (const s of stars) {
      ctx.globalAlpha = s.p * (0.5 + 0.5 * Math.sin(time * 2 + s.tw));
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(((s.x - time * s.p * 4) % VW + VW) % VW | 0, s.y | 0, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    // the moon we are about to ruin
    ctx.drawImage(moon, VW - 150, 40 + Math.sin(time * 0.3) * 3 | 0);

    // the barge, drifting in
    const ship = PD.art.skinFor(g.save.cos).ship;
    const sy = 150 + Math.sin(time * 0.9) * 4;
    ctx.drawImage(ship.frames[Math.sin(time * 3) > 0 ? 1 : 0], (shipX - ship.ox) | 0, (sy - ship.oy) | 0);
    // engine plume
    for (let i = 0; i < 3; i++) {
      ctx.globalAlpha = 0.25 + 0.2 * Math.sin(time * 12 + i);
      ctx.fillStyle = i ? '#ff9b3d' : '#ffe08a';
      ctx.fillRect(shipX - 46 - i * 7 | 0, sy - 6 + i | 0, 8, 5 - i);
    }
    ctx.globalAlpha = 1;

    // letterbox
    const bar = Math.round(22 * letter);
    ctx.fillStyle = '#050310';
    ctx.fillRect(0, 0, VW, bar);
    ctx.fillRect(0, VH - bar, VW, bar);

    if (card) {
      const a = U.clamp(Math.min(t * 1.6, (BEATS[beat].dur - t) * 1.6), 0, 1);
      ctx.globalAlpha = a;
      F.draw(ctx, card[0], VW / 2, 96, '#ffd34d', { center: true, scale: 3, shadow: '#7a2a10' });
      F.draw(ctx, card[1], VW / 2, 126, '#f2e9ff', { center: true, shadow: false });
      ctx.globalAlpha = 1;
    }

    PD.dialog.draw(ctx, g, time, PD.art.skinFor(g.save.cos).alien);

    F.draw(ctx, 'ESC  SKIP', VW - 6, VH - bar - 12, 'rgba(240,235,255,0.45)', { right: true, shadow: false });
  }

  PD.cutscene = { start, update, draw, get done() { return done; } };
})(window.PD);

/* ===== src/interior.js ===== */
/* Inside the Rustmaw. Instead of a shop popup you walk the deck and use the
   machines: market console, fabricator, drone bay, wardrobe, nav chart --
   with a crew that has opinions about what you are doing. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const F = PD.font;
  const A = PD.audio;
  const FX = PD.fx;
  const AI = PD.artint;

  const VW = 480, VH = 270;
  const ROOM_W = 720, ROOM_H = 270;
  const FLOOR = ROOM_H - 22;

  let bg = null;

  /* Everything you can walk up to. `app` opens a terminal; `act` runs code. */
  const STATIONS = [
    { id: 'airlock', x: 52,  spr: 'airlock',    label: 'AIRLOCK',        act: 'launch' },
    { id: 'market',  x: 160, spr: 'console',    label: 'CARGO EXCHANGE', app: 'market' },
    { id: 'fab',     x: 300, spr: 'fabricator', label: 'FABRICATOR',     app: 'fab' },
    { id: 'bay',     x: 440, spr: 'dronebay',   label: 'DRONE BAY',      app: 'bay' },
    { id: 'vanity',  x: 560, spr: 'wardrobe',   label: 'IDENTITY POD',   app: 'vanity' },
    { id: 'nav',     x: 660, spr: 'navchart',   label: 'NAV COMPUTER',   app: 'nav' }
  ];

  const CREW = [
    { id: 'nix',   x: 216, spr: 'nix',   label: 'NIX' },
    { id: 'bolt',  x: 356, spr: 'bolt',  label: 'BOLT' },
    { id: 'gloop', x: 502, spr: 'gloop', label: 'GLOOP' }
  ];

  const DECOR = [
    { x: 108, spr: 'crate', f: 0 }, { x: 128, spr: 'crate', f: 1 },
    { x: 396, spr: 'crate', f: 1 }, { x: 612, spr: 'plant', f: 0 },
    { x: 88, spr: 'plant', f: 0 }
  ];

  /* Crew barks. They rotate, and they are all enabling you. */
  const LINES = {
    nix: [
      'Balance updated. I have taken the liberty of rounding in our favour.',
      'Three civilisations have filed complaints. I filed them in the reactor.',
      'You look tired. Statistically, greed is a stimulant.',
      'That world had a name once. Now it has a market price.',
      'I calculate a 94% chance you enjoy this. The other 6% is modesty.'
    ],
    bolt: [
      'Bring me ore, not excuses. The bin does not fill itself.',
      'I welded that seam twice. Do not make me do it a third time.',
      'Every module you fabricate, I bleed a little coolant. You are welcome.',
      'Rocks in. Machines out. That is the whole religion.'
    ],
    gloop: [
      'GLOOP chirps and headbutts the glass affectionately.',
      'GLOOP is eating a rock you were going to sell. GLOOP is unrepentant.',
      'GLOOP blinks all four eyes at slightly different times.'
    ]
  };
  const barkIdx = { nix: 0, bolt: 0, gloop: 0 };

  const P = {
    x: 100, y: FLOOR, vx: 0, vy: 0, face: 1, walk: 0, near: null, hop: 0
  };

  function enter(g, atStation) {
    if (!bg) bg = AI.room(ROOM_W, ROOM_H).toCanvas();
    const st = STATIONS.find(s => s.id === atStation);
    P.x = st ? st.x + 30 : 96;
    P.y = FLOOR; P.vx = 0; P.vy = 0; P.face = 1;
    g.intCam = U.clamp(P.x - VW / 2, 0, ROOM_W - VW);
  }

  /* Nearest interactable, compared as a fraction of each one's own reach so a
     crew member standing beside a console cannot steal its prompt. */
  function nearest() {
    let best = null, score = 1;
    const test = (o, reach) => {
      const f = Math.abs(o.x - P.x) / reach;
      if (f < score) { score = f; best = o; }
    };
    for (const s of STATIONS) test(s, 30);
    for (const c of CREW) test(c, 20);
    return best;
  }

  function talk(who) {
    const lines = LINES[who];
    if (!lines) return;
    PD.dialog.push(who, lines[barkIdx[who] % lines.length]);
    barkIdx[who]++;
  }

  function update(dt, g) {
    const IN = PD.input;
    const use = IN.hit('KeyE') || IN.hit('space');
    const esc = IN.hit('esc');

    // One owner of the input per frame, resolved top down. Without this a
    // single E press both opens a terminal and closes it again.
    if (PD.term.app) {
      if (esc) PD.term.close();
    } else if (PD.dialog.active()) {
      PD.dialog.update(dt);
      if (use || IN.mouse.leftPressed) PD.dialog.advance();
    } else {
      let ix = 0;
      if (IN.down('left')) ix -= 1;
      if (IN.down('right')) ix += 1;
      if (ix) P.face = ix;
      P.vx = U.damp(P.vx, ix * 78, 0.3, dt);
      P.x = U.clamp(P.x + P.vx * dt, 28, ROOM_W - 28);
      P.walk += Math.abs(P.vx) * dt * 0.09;

      // a little hover-hop, since our alien does not really walk
      if (IN.hit('up') && P.y >= FLOOR) {
        P.vy = -120;
        A.sfx.tone(600, { type: 'triangle', dur: 0.08, vol: 0.06 });
      }
      P.vy += 400 * dt;
      P.y = Math.min(FLOOR, P.y + P.vy * dt);
      if (P.y >= FLOOR) { P.y = FLOOR; P.vy = 0; }

      P.near = nearest();

      if (use && P.near) {
        if (P.near.app) PD.term.open(P.near.app);
        else if (P.near.act === 'launch') { g.undock(); return; }
        else talk(P.near.id);
      } else if (esc) {
        g.undock();
        return;
      }
    }

    g.intCam = U.damp(g.intCam, U.clamp(P.x - VW / 2, 0, ROOM_W - VW), 0.16, dt);
  }

  function drawSpr(ctx, sp, frame, x, y) {
    ctx.drawImage(sp.frames[frame % sp.frames.length], (x - sp.ox) | 0, (y - sp.oy) | 0);
  }

  function draw(ctx, g, t) {
    const cam = Math.round(g.intCam);
    ctx.drawImage(bg, -cam, 0);

    for (const d of DECOR) drawSpr(ctx, AI.S[d.spr], d.f, d.x - cam, FLOOR + 2);

    const blink = Math.sin(t * 2.4) > 0 ? 1 : 0;
    for (const s of STATIONS) {
      const sp = AI.S[s.spr];
      const lit = s.app ? blink : (Math.sin(t * 3) > 0.4 ? 1 : 0);
      drawSpr(ctx, sp, Math.min(lit, sp.frames.length - 1), s.x - cam, FLOOR + 2);
    }

    // crew, bobbing on their own clocks
    for (const c of CREW) {
      const sp = AI.S[c.spr];
      const f = Math.floor(t * (c.id === 'nix' ? 4 : 2.4) + c.x) % sp.frames.length;
      drawSpr(ctx, sp, f, c.x - cam, FLOOR + 2);
      if (c.id === 'nix') {
        // holo flicker glow
        const gx = c.x - cam, gy = FLOOR - 22;
        const gr = ctx.createRadialGradient(gx, gy, 2, gx, gy, 30);
        gr.addColorStop(0, 'rgba(126,249,255,' + (0.22 + 0.08 * Math.sin(t * 9)).toFixed(2) + ')');
        gr.addColorStop(1, 'rgba(126,249,255,0)');
        ctx.fillStyle = gr;
        ctx.fillRect(gx - 30, gy - 30, 60, 60);
      }
    }

    // the player, hovering along on suit thrusters
    const skin = PD.art.skinFor(g.save.cos);
    const al = skin.alien;
    const bob = Math.sin(P.walk * 2 + t * 3) * 1.6 + (P.y < FLOOR ? -1 : 0);
    ctx.save();
    ctx.translate((P.x - cam) | 0, (P.y + bob) | 0);
    if (P.face < 0) ctx.scale(-1, 1);
    ctx.drawImage(al.frames[Math.sin(t * 0.9) > 0.95 ? 2 : 0], -al.ox, -al.oy - 6);
    ctx.restore();
    if (Math.abs(P.vx) > 12 && U.chance(0.5)) {
      FX.trail(P.x + cam * 0 - P.face * 6, P.y - 4, '#ffd34d', 1.4);
    }
    // thruster wash on the deck
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#ffb03d';
    ctx.fillRect((P.x - cam - 4) | 0, (P.y - 3) | 0, 8, 3);
    ctx.globalAlpha = 1;

    // interaction prompt
    if (P.near && !PD.term.app && !PD.dialog.active()) {
      const x = P.near.x - cam;
      const y = FLOOR - (P.near.spr === 'gloop' ? 40 : 66) + Math.sin(t * 5) * 2;
      const w = F.width(P.near.label, 1) + 22;
      ctx.fillStyle = 'rgba(8,4,18,0.85)';
      ctx.fillRect(x - w / 2, y, w, 13);
      ctx.strokeStyle = '#7ef9ff';
      ctx.strokeRect(x - w / 2 + 0.5, y + 0.5, w - 1, 12);
      F.draw(ctx, 'E', x - w / 2 + 4, y + 3, '#ffd34d', { shadow: false });
      F.draw(ctx, P.near.label, x - w / 2 + 16, y + 3, '#ffffff', { shadow: false });
    }
  }

  /* Slim diegetic status strip -- the deck's own readout, not a game HUD. */
  function drawStatus(ctx, g, t) {
    ctx.fillStyle = 'rgba(8,4,18,0.8)';
    ctx.fillRect(0, 0, VW, 14);
    ctx.fillStyle = '#39ffa6';
    ctx.fillRect(0, 14, VW, 1);
    F.draw(ctx, 'RUSTMAW // DECK A', 6, 4, '#39ffa6', { shadow: false });
    F.draw(ctx, 'CR ' + U.fmt(g.save.credits), 148, 4, '#ffd34d', { shadow: false });
    const bin = Object.keys(g.save.vault).reduce((n, k) => n + g.save.vault[k], 0);
    F.draw(ctx, 'BIN ' + U.fmt(bin), 226, 4, '#7ef9ff', { shadow: false });
    F.draw(ctx, 'DRONES ' + (g.save.upg.drones || 0), 296, 4, '#c8ff5a', { shadow: false });
    F.draw(ctx, 'GALAXY ' + g.save.dominion.toFixed(1) + '%', VW - 6, 4, '#ff8ad8', { right: true, shadow: false });
  }

  PD.interior = { enter, update, draw, drawStatus, talk, STATIONS, CREW, P, ROOM_W, FLOOR };
})(window.PD);

/* ===== src/game.js ===== */
/* Planet Destroyer -- main game module. Owns the loop, the camera, the ship,
   progression and the world-cracking finale. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const FX = PD.fx;
  const A = PD.audio;
  const F = PD.font;
  const UI = PD.ui;
  const TILE = PD.world.TILE;

  const VW = UI.VW, VH = UI.VH;
  const SAVE_KEY = 'planet-destroyer-save-v1';

  const g = {
    state: 'title',
    time: 0,
    save: null,
    world: null,
    player: null,
    mobs: [], bullets: [], pickups: [], boulders: [],
    cam: { x: 0, y: 0 },
    bodyIndex: 0,
    ship: { x: 0, y: 0, w: 84, h: 52 },
    toasts: [],
    hint: '', hintT: 0, hintKey: '',
    shopTab: 0, shopTip: '',
    cinematic: false,
    destruction: null,
    victory: null,
    sellReport: null,
    droneAcc: 0,
    fps: 60
  };
  PD.game = g;

  /* ------------------------------------------------------------------- saves */
  function blankSave() {
    const upg = {};
    for (const u of D.UPGRADES) upg[u.id] = 0;
    return {
      credits: 0, upg, unlocked: 0, destroyed: [], dominion: 0, bonus: 0,
      totalMined: 0, totalEarned: 0, bodyIndex: 0, seen: {},
      vault: {},                                  // ore stockpile aboard the ship
      cos: { suit: 'rose', skin: 'green', glass: 'sky', drill: 'steel', trim: 'stock' },
      owned: {},                                  // purchased cosmetics
      seenIntro: 0
    };
  }

  function loadGame() {
    let s = null;
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) s = JSON.parse(raw);
    } catch (e) { s = null; }
    const base = blankSave();
    if (s && typeof s === 'object') {
      base.credits = +s.credits || 0;
      base.unlocked = U.clamp(+s.unlocked || 0, 0, D.BODIES.length - 1);
      base.destroyed = Array.isArray(s.destroyed) ? s.destroyed : [];
      base.dominion = +s.dominion || 0;
      base.bonus = +s.bonus || 0;
      base.totalMined = +s.totalMined || 0;
      base.totalEarned = +s.totalEarned || 0;
      base.bodyIndex = U.clamp(+s.bodyIndex || 0, 0, D.BODIES.length - 1);
      base.seen = s.seen || {};
      base.seenIntro = s.seenIntro ? 1 : 0;
      if (s.vault) for (const k in s.vault) { const n = +s.vault[k]; if (n > 0 && D.MAT[k]) base.vault[k] = n; }
      if (s.owned) base.owned = s.owned;
      if (s.cos) for (const k in base.cos) if (s.cos[k]) base.cos[k] = s.cos[k];
      if (s.upg) for (const k in base.upg) base.upg[k] = U.clamp(+s.upg[k] || 0, 0, D.UPG[k].max);
    }
    g.save = base;
  }

  function saveGame() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(g.save)); } catch (e) { /* private mode */ }
  }

  function wipeSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    g.save = blankSave();
    startBody(0, true);
    g.state = 'cutscene';
    PD.cutscene.start();
    toast('SAVE WIPED. BACK TO THE PEBBLE.', UI.COL.bad);
  }

  g.saveGame = saveGame;
  g.wipeSave = wipeSave;

  g.valueMult = function () { return 1 + g.save.bonus / 100 + g.save.dominion * 0.004; };
  g.droneIncome = function () {
    const n = g.save.upg.drones || 0;
    if (!n) return 0;
    return n * 2.4 * D.UPG.droneyield.value(g.save.upg.droneyield || 0) * (1 + g.save.dominion / 100);
  };

  /* ------------------------------------------------------------------ toasts */
  function toast(msg, color) {
    g.toasts.push({ msg, color, life: 2.8 });
    if (g.toasts.length > 4) g.toasts.shift();
  }
  g.toast = toast;

  function hint(key, msg) {
    if (g.hintKey === key) { g.hintT = Math.max(g.hintT, 1); return; }
    g.hintKey = key;
    g.hint = msg;
    g.hintT = 5;
  }

  /* -------------------------------------------------------------- world setup */
  function startBody(index, freshPlayer) {
    g.bodyIndex = index;
    g.save.bodyIndex = index;
    const body = D.BODIES[index];
    g.world = new PD.world.World(body, index);
    g.mobs.length = 0; g.bullets.length = 0; g.pickups.length = 0; g.boulders.length = 0;
    FX.reset();
    g.destruction = null;
    g.victory = null;
    g.cinematic = false;

    g.ship.x = g.world.cx * TILE;
    g.ship.y = Math.max(30, g.world.bodyTopPx - 150);

    if (!g.player || freshPlayer) g.player = new PD.Player(g);
    g.player.clearCargo();
    g.player.reset(g.ship.x, g.ship.y + 34);
    g.player.docked = false;

    spawnMobs();
    g.cam.x = g.player.x - VW / 2;
    g.cam.y = g.player.y - VH / 2;
    if (!g.save.seen[index]) {
      g.save.seen[index] = 1;
      toast(body.name.toUpperCase(), UI.COL.gold);
      toast(body.blurb.toUpperCase(), UI.COL.text);
    }
    hint('dive', 'FLY DOWN TO THE ROCK - HOLD LEFT MOUSE TO DRILL');
  }

  function spawnMobs() {
    const w = g.world;
    const body = w.body;
    const cap = Math.min(70, 10 + g.bodyIndex * 6);
    let tries = 0;
    while (g.mobs.length < cap && tries < 6000) {
      tries++;
      const cx = U.randInt(2, w.w - 3), cy = U.randInt(PD.world.SKY, w.h - 3);
      if (w.at(cx, cy)) continue;
      // must be a real pocket, not open space outside the body
      const dx = cx - w.cx, dy = cy - w.cy;
      if (Math.sqrt(dx * dx + dy * dy) > w.radius - 2) continue;
      if (U.dist(cx * TILE, cy * TILE, w.coreCenter.x, w.coreCenter.y) < w.chamberR + TILE) continue;
      if (!U.chance(body.enemyRate * 0.5)) continue;
      const type = U.weighted(body.mobs);
      g.mobs.push(new PD.ent.Mob(type, cx * TILE + TILE / 2, cy * TILE + TILE / 2, 1 + g.bodyIndex * 0.14));
    }
    if (g.bodyIndex >= 1) {
      const c = w.coreCenter;
      g.mobs.push(new PD.ent.Mob('guardian', c.x + w.chamberR * 0.5, c.y - w.chamberR * 0.3,
        0.5 + g.bodyIndex * 0.32));
    }
  }

  g.travelTo = function (index) {
    if (index > g.save.unlocked) return;
    A.sfx.warp();
    FX.flash(0.9, '#a9d8ff');
    startBody(index, false);
    g.state = 'play';
    g.player.docked = false;
    saveGame();
    toast('ARRIVING AT ' + D.BODIES[index].name.toUpperCase(), UI.COL.o2);
  };
