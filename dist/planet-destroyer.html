    }
    // a lumpy cap and a crooked chimney with a dish taped on
    p.round(74, base - 132, 44, 18, 7, R2);
    p.round(82, base - 137, 30, 12, 5, R1);
    p.rect(86, base - 135, 22, 3, RL);
    p.round(126, base - 116, 20, 34, 4, R2);
    p.round(129, base - 123, 16, 11, 4, R3);
    p.rect(138, base - 128, 3, 16, P.steelD);
    p.round(132, base - 136, 18, 7, 3, '#8e86a8');
    p.rect(135, base - 130, 10, 3, '#ffe98a');
    // the doorway, with rubber strips
    p.round(78, base - 58, 44, 58, 5, '#120e1c');
    p.rect(76, base - 63, 48, 7, R4);
    p.rect(76, base - 63, 48, 3, RL);
    for (let i = 0; i < 6; i++) {
      const cx2 = 80 + i * 7, len = 30 + (i % 3) * 8;
      p.rect(cx2, base - 56, 5, len, i % 2 ? '#3f3856' : '#4a4260');
      p.rect(cx2, base - 56, 5, 2, '#8e86a8');
    }
    if (lit) { p.rect(78, base - 18, 44, 18, '#3a3020'); p.rect(84, base - 10, 32, 10, '#4a3a22'); }
    // one window, and the sign over the door
    p.round(34, base - 84, 30, 26, 4, '#241f36');
    p.round(37, base - 81, 24, 20, 3, lit ? '#ffe9a8' : '#2a2440');
    if (lit) { p.rect(39, base - 79, 20, 3, '#fff7d8'); p.rect(39, base - 69, 9, 7, '#e0c96a'); }
    p.rect(33, base - 72, 32, 3, R4);
    p.round(72, base - 79, 56, 16, 3, '#7a5a3a');
    p.rect(74, base - 77, 52, 3, '#9c7a52');
    p.rect(74, base - 67, 52, 2, '#4a3020');
    // junk piled against it
    p.round(6, base - 26, 24, 26, 3, '#6b4530');
    p.rect(8, base - 22, 20, 3, '#8a5a3a');
    p.round(150, base - 22, 24, 22, 3, '#8a5a3a');
    p.rect(152, base - 18, 20, 3, '#6b4530');
    p.round(168, base - 15, 18, 15, 3, '#4a4260');
    p.outline(P.ink);
    return p;
  }

  /* ------------------------------------------------------------- buildMoon */
  /* The moon disc, rasterised with integer scanlines at a low resolution and
     blown up: hard pixel steps all the way round, never a smooth circle. */
  function pxDisc(c, cx, cy, r, col) {
    c.fillStyle = col;
    const r2 = r;
    for (let y = Math.ceil(cy - r); y <= Math.floor(cy + r); y++) {
      const dy = Math.abs(y - cy + 0.5) / r2;
      if (dy > 1) continue;
      const w = r2 * Math.sqrt(Math.max(0, 1 - dy * dy));
      const x0 = Math.round(cx - w), x1 = Math.round(cx + w);
      if (x1 > x0) c.fillRect(x0, y, x1 - x0, 1);
    }
  }
  /* A WORLD. Rasterised at half size and blown up, so every feature is a hard
     block of pixels, and painted differently depending on what kind of place
     it is: a cratered rock, an ice ball with caps, a living world with
     continents and weather, a furnace cracked open, a cut gemstone, a plated
     machine-moon. All of it deterministic from the seed. */
  function buildPlanet(size, tint, seed, type) {
    const K = 2;
    const S = Math.max(10, Math.round(size / K));
    const src = document.createElement('canvas');
    src.width = src.height = S;
    const c = src.getContext('2d');
    const r = S / 2 - 0.5, cx = S / 2, cy = S / 2;
    const rnd = U.mulberry32(seed || 7);
    const px = (v) => Math.max(1, Math.round(v));
    function shade(col, f) {
      const n = parseInt(col.slice(1), 16);
      const R = U.clamp(((n >> 16) & 255) * f, 0, 255) | 0, G = U.clamp(((n >> 8) & 255) * f, 0, 255) | 0, B = U.clamp((n & 255) * f, 0, 255) | 0;
      return 'rgb(' + R + ',' + G + ',' + B + ')';
    }
    /* Every feature is clipped to the disc, so nothing spills off the limb. */
    const inside = (x, y, k) => U.dist(x, y, cx, cy) < r * (k === undefined ? 0.98 : k);

    pxDisc(c, cx, cy, r, shade(tint, 0.78));
    c.save();
    c.beginPath(); c.rect(0, 0, S, S); c.clip();

    /* ---- the ground itself, per kind ---- */
    const craters = (n, big) => {
      for (let i = 0; i < n; i++) {
        const a = rnd() * U.TAU, d = Math.sqrt(rnd()) * r * 0.88;
        const kx = cx + Math.cos(a) * d, ky = cy + Math.sin(a) * d;
        const kr = Math.max(1, (0.4 + rnd() * rnd() * (big ? 3 : 2.2)) * (S / 24));
        if (!inside(kx, ky, 0.92)) continue;
        pxDisc(c, kx, ky - kr * 0.2, kr, shade(tint, 1.12));          // sunlit rim
        pxDisc(c, kx, ky + kr * 0.25, kr * 0.7, shade(tint, 0.42));   // floor
        if (kr > S / 14) {                                            // and ejecta
          for (let q = 0; q < 5; q++) {
            const ea = rnd() * U.TAU, ed = kr * (1.2 + rnd());
            const ex = kx + Math.cos(ea) * ed, ey = ky + Math.sin(ea) * ed;
            if (inside(ex, ey)) { c.fillStyle = shade(tint, 1.2); c.fillRect(ex | 0, ey | 0, 1, 1); }
          }
        }
      }
    };
    const maria = (n, f) => {
      for (let i = 0; i < n; i++) {
        const a = rnd() * U.TAU, d = rnd() * r * 0.62;
        pxDisc(c, cx + Math.cos(a) * d, cy + Math.sin(a) * d, r * (0.14 + rnd() * 0.24), shade(tint, f + rnd() * 0.1));
      }
    };
    /* Latitude bands: whole-pixel rows, so a striped world stays striped. */
    const bands = (cols, h) => {
      for (let y = 0; y < S; y++) {
        const f = (y / S);
        const col = cols[Math.floor(f * cols.length * h) % cols.length];
        const w = Math.floor(Math.sqrt(Math.max(0, r * r - (y - cy) * (y - cy))));
        if (w <= 0) continue;
        c.fillStyle = col;
        c.fillRect(Math.round(cx - w), y, w * 2, 1);
      }
    };
    const caps = (col) => {
      for (let y = 0; y < S; y++) {
        const dy = Math.abs(y - cy) / r;
        if (dy < 0.62) continue;
        const w = Math.floor(Math.sqrt(Math.max(0, r * r - (y - cy) * (y - cy))));
        if (w <= 0) continue;
        const bite = Math.round(rnd() * 2);
        c.fillStyle = col;
        c.fillRect(Math.round(cx - w + bite), y, w * 2 - bite * 2, 1);
      }
    };
    const cracks = (n, col, glow) => {
      for (let i = 0; i < n; i++) {
        let a = rnd() * U.TAU, d = rnd() * r * 0.3;
        let x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;
        const steps = Math.round(S * (0.3 + rnd() * 0.4));
        for (let q = 0; q < steps; q++) {
          a += (rnd() - 0.5) * 0.9;
          x += Math.cos(a); y += Math.sin(a);
          if (!inside(x, y, 0.94)) break;
          c.fillStyle = col; c.fillRect(x | 0, y | 0, 1, 1);
          if (glow && rnd() > 0.6) { c.fillStyle = glow; c.fillRect((x | 0) + 1, y | 0, 1, 1); }
        }
      }
    };
    /* Flat cut panels with a bright edge -- a gemstone, not a ball. */
    const facets = (n) => {
      for (let i = 0; i < n; i++) {
        const a = rnd() * U.TAU, d = rnd() * r * 0.7;
        const fx = cx + Math.cos(a) * d, fy = cy + Math.sin(a) * d;
        const w = px(r * (0.3 + rnd() * 0.5)), h = px(r * (0.25 + rnd() * 0.45));
        c.fillStyle = shade(tint, 0.8 + rnd() * 0.5);
        c.fillRect(Math.round(fx - w / 2), Math.round(fy - h / 2), w, h);
        c.fillStyle = shade(tint, 1.5);
        c.fillRect(Math.round(fx - w / 2), Math.round(fy - h / 2), w, 1);
        c.fillStyle = shade(tint, 0.45);
        c.fillRect(Math.round(fx - w / 2), Math.round(fy + h / 2 - 1), w, 1);
      }
    };
    /* Plates and rivets: somebody built this one. */
    const plating = () => {
      const step = Math.max(3, Math.round(S / 7));
      for (let y = 0; y < S; y += step) {
        for (let x = 0; x < S; x += step) {
          if (!inside(x + step / 2, y + step / 2, 0.95)) continue;
          c.fillStyle = shade(tint, 0.72 + rnd() * 0.5);
          c.fillRect(x, y, step - 1, step - 1);
          c.fillStyle = shade(tint, 1.35);
          c.fillRect(x, y, step - 1, 1);
          c.fillStyle = shade(tint, 1.5);
          c.fillRect(x + 1, y + 1, 1, 1);
        }
      }
    };
    /* Weather: streaks of cloud lying along the latitudes. */
    const clouds = (n) => {
      for (let i = 0; i < n; i++) {
        const y = Math.round(cy + (rnd() * 2 - 1) * r * 0.82);
        const w = Math.floor(Math.sqrt(Math.max(0, r * r - (y - cy) * (y - cy))));
        if (w <= 2) continue;
        const x0 = Math.round(cx - w + rnd() * w), len = px(w * (0.4 + rnd() * 0.9));
        c.globalAlpha = 0.5 + rnd() * 0.35;
        c.fillStyle = '#ffffff';
        c.fillRect(x0, y, Math.min(len, Math.round(cx + w - x0)), px(S / 26));
        c.globalAlpha = 1;
      }
    };

    switch (type) {
      case 'ice':
        bands([shade(tint, 0.9), shade(tint, 1.05), shade(tint, 0.8)], 3);
        caps('#eaf6ff'); cracks(7, shade(tint, 1.5)); craters(6);
        break;
      case 'terra':
        bands([shade(tint, 0.7), shade(tint, 0.78), shade(tint, 0.72)], 2);
        maria(6, 1.25); caps('#f0f8ff'); clouds(Math.round(S / 5)); craters(3);
        break;
      case 'volcanic':
        pxDisc(c, cx, cy, r, shade(tint, 0.32));
        maria(5, 0.5); cracks(12, '#ff7a2a', '#ffd27a'); craters(7);
        for (let i = 0; i < 4; i++) {                        // calderas, glowing
          const a = rnd() * U.TAU, d = rnd() * r * 0.7;
          const hx = cx + Math.cos(a) * d, hy = cy + Math.sin(a) * d;
          if (!inside(hx, hy, 0.85)) continue;
          pxDisc(c, hx, hy, px(S / 16), '#ff7a2a');
          pxDisc(c, hx, hy, px(S / 26), '#ffe9a8');
        }
        break;
      case 'gem': case 'titan':
        facets(Math.round(S / 4)); cracks(5, shade(tint, 1.6));
        break;
      case 'metal':
        plating(); craters(5); cracks(4, shade(tint, 0.4));
        break;
      case 'core':
        bands([shade(tint, 0.6), shade(tint, 0.95), '#ff8a3d', shade(tint, 0.75)], 4);
        cracks(10, '#ffd27a', '#ff7a2a'); craters(4);
        break;
      default:
        maria(5, 0.55); craters(22, true);
    }

    // dust, everywhere
    for (let i = 0; i < S * 2; i++) {
      const dx2 = (rnd() * S) | 0, dy2 = (rnd() * S) | 0;
      if (!inside(dx2, dy2)) continue;
      c.fillStyle = shade(tint, rnd() > 0.5 ? 1.18 : 0.68);
      c.fillRect(dx2, dy2, 1, 1);
    }
    // the night side, stepped in columns
    for (let x = 0; x < S; x++) {
      const f = x / S;
      if (f > 0.45) continue;
      c.fillStyle = 'rgba(4,2,12,' + (0.9 - f * 1.8).toFixed(2) + ')';
      c.fillRect(x, 0, 1, S);
    }
    c.restore();

    /* Cut the whole thing back to a disc. Bands, clouds and lava spill to the
       corners of the square while they are being painted -- it is much easier
       to let them and then punch out everything that is not the planet than
       to clip each one. A hard-edged disc as the mask, so the limb stays
       pixels rather than a soft path edge. */
    /* The mask is built on its own canvas and composited in ONE call:
       destination-in is a whole-surface operation, so a disc drawn row by row
       would have each row erase the row before it. */
    const mk = document.createElement('canvas');
    mk.width = mk.height = S;
    pxDisc(mk.getContext('2d'), cx, cy, r + 0.5, '#ffffff');
    c.globalCompositeOperation = 'destination-in';
    c.drawImage(mk, 0, 0);
    c.globalCompositeOperation = 'source-over';

    // the lit limb: one pixel of highlight walked round the top-right quarter
    c.fillStyle = shade(tint, 1.55);
    for (let a = -Math.PI * 0.95; a <= -Math.PI * 0.05; a += 0.05) {
      c.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 1, 1);
    }
    for (let a = 0.35; a <= 1.2; a += 0.05) {
      c.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 1, 1);
    }

    const cv = document.createElement('canvas');
    cv.width = cv.height = S * K;
    const cc = cv.getContext('2d');
    cc.imageSmoothingEnabled = false;
    cc.drawImage(src, 0, 0, S, S, 0, 0, S * K, S * K);
    return cv;
  }

  /* A plain cratered rock: what hangs in the sky over a dig site. */
  function buildMoon(size, tint, seed) { return buildPlanet(size, tint, seed, 'moon'); }

  /* -------------------------------------------------------------- register */
  /* Somebody used this moon as a tip before you were handed the deed to it.
     Four grades of other people's rubbish, at the scale of the moon surface
     rather than the scale of the room, so they read from across the crater. */
  function moonJunk(k) {
    const p = pix(64, 46);
    if (k === 0) {                                        // a crashed satellite
      p.round(14, 24, 30, 18, 4, P.steelD);
      p.rect(16, 28, 26, 2, P.steel);
      p.rect(10, 20, 4, 18, P.steelDD);
      for (let i = 0; i < 4; i++) p.rect(44 + i * 4, 22 + i * 3, 3, 14 - i * 2, P.navyL);
      p.rect(28, 6, 3, 20, P.steelD);                     // a bent mast
      p.ellipse(30, 6, 11, 5, P.steel);
      p.ellipse(30, 7, 8, 3, P.navy);
      p.rect(2, 40, 20, 4, P.rockD);
    } else if (k === 1) {                                 // sacks, splitting
      for (let i = 0; i < 4; i++) {
        const x = 2 + i * 15, y = 18 + (i % 2) * 7;
        p.ellipse(x + 9, y + 12, 10, 11, i % 2 ? '#3a3348' : '#2e2a3e');
        p.rect(x + 6, y - 1, 6, 4, '#1c1a28');
        p.set(x + 13, y + 8, P.lime);
      }
      p.ellipse(30, 42, 22, 4, '#2a3320');                // the seepage
    } else if (k === 2) {                                 // a leaking drum
      p.round(16, 14, 26, 28, 5, '#7a5a2a');
      p.rect(16, 20, 26, 2, '#a87c3a');
      p.rect(16, 32, 26, 2, '#a87c3a');
      p.round(20, 10, 16, 6, 2, '#5a4020');
      p.rect(36, 26, 8, 3, '#4cff9a');                    // the leak
      p.ellipse(48, 42, 16, 4, '#2f7a52');
      p.ellipse(48, 41, 10, 2, P.acid);
    } else {                                              // bones and a crate
      p.round(2, 26, 26, 16, 3, '#6b4530');
      p.rect(4, 30, 22, 2, '#8a5a3a');
      p.line(4, 28, 26, 40, '#4a2e1e'); p.line(26, 28, 4, 40, '#4a2e1e');
      for (let i = 0; i < 3; i++) {
        const x = 32 + i * 9, y = 30 + (i % 2) * 5;
        p.round(x, y, 14, 4, 2, P.bone);
        p.disc(x + 1, y + 2, 3, P.bone); p.disc(x + 13, y + 2, 3, P.bone);
      }
      p.ellipse(44, 20, 8, 7, P.bone);                    // and a small skull
      p.rect(41, 19, 3, 3, P.ink); p.rect(46, 19, 3, 3, P.ink);
    }
    p.outline(P.ink);
    return p;
  }

  /* What was under the biggest heap all along. */
  function clubSign(lit) {
    const p = pix(58, 44);
    const neon = lit ? '#ff5fa8' : '#4a2340', tube = lit ? '#7ef9ff' : '#1d3a48';
    p.round(4, 22, 50, 20, 4, P.rockD);                   // a hatch in the regolith
    p.rect(6, 24, 46, 2, P.rockL);
    p.round(16, 28, 26, 14, 3, '#120a1c');
    for (let i = 0; i < 5; i++) p.rect(18 + i * 5, 30, 2, 10, lit ? '#2a1c33' : '#1a1024');
    p.rect(2, 18, 54, 3, P.steelDD);
    // the sign itself, on a little gantry
    p.rect(8, 4, 3, 16, P.steelD); p.rect(48, 4, 3, 16, P.steelD);
    p.round(6, 2, 46, 14, 3, '#1a1024');
    p.rect(6, 2, 46, 1, neon);
    for (const [x, w] of [[10, 4], [16, 4], [22, 4], [28, 4], [36, 4], [42, 4]]) p.rect(x, 5, w, 8, neon);
    p.rect(10, 5, 34, 2, tube);
    p.rect(10, 11, 34, 2, tube);
    if (lit) { p.rect(4, 0, 50, 1, '#ffd34d'); p.set(3, 8, tube); p.set(54, 8, tube); }
    p.outline(P.ink);
    return p;
  }

  /* The regulars. Body and face only -- their tentacles are drawn live so
     they can wave them about and wrap them round each other. Frame 1 is the
     face they make when somebody is kissing them. */
  /* ------------------------------------------------------------- a species
     The regulars in the club are generated, and they are PEOPLE: a head on a
     neck, a torso with clothes on it, two arms with hands on the ends and two
     legs with boots. A seed picks the body plan, the build, the hue, how many
     eyes there are and where, the mouth, what is growing out of the head, what
     the skin is made of and what they came out in.

     They were blobs with tentacles before. Blobs do not read at this size and
     nine of them in a room read as one thing. */
  function hsl(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
    const q = v => ('0' + Math.round((v + m) * 255).toString(16)).slice(-2);
    return '#' + q(r) + q(g) + q(b);
  }

  const BUILDK = ['lanky', 'stout', 'normal', 'normal', 'hulk'];
  const EYEK = ['row', 'row', 'row', 'stack', 'tri', 'stalk'];
  const MOUTHK = ['grin', 'grin', 'tusk', 'beak', 'straw', 'mandible', 'lips', 'grill', 'sucker'];
  const CROWNK = ['none', 'antenna', 'antenna', 'horns', 'fin', 'hat', 'tuft', 'ears',
    'mohawk', 'tendrils', 'cap', 'crest'];
  const SKINK = ['plain', 'plain', 'speckle', 'scale', 'stripe', 'plate', 'spot', 'glow'];
  const WEARK = ['vest', 'jacket', 'tank', 'sash', 'coat', 'bare', 'sequin', 'shirt'];

  function alienKin(seed) {
    const R = PD.util.mulberry32(seed * 2654435761 + 12345);
    const pick = a => a[(R() * a.length) | 0];
    const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
    const hue = R() * 360;
    const t = {
      seed: seed, hue: hue,
      skin: hsl(hue, 36 + R() * 32, 54 + R() * 14),
      dark: hsl(hue, 44 + R() * 20, 26 + R() * 8),
      lite: hsl(hue, 34 + R() * 24, 76 + R() * 10),
      acc: hsl(hue + 90 + R() * 180, 62, 56),
      accD: hsl(hue + 90 + R() * 180, 60, 30),
      cloth: hsl(hue + 140 + R() * 160, 38 + R() * 34, 44 + R() * 14),
      build: pick(BUILDK), eyes: ri(1, 4), eyeK: pick(EYEK),
      mouth: pick(MOUTHK), crown: pick(CROWNK), tex: pick(SKINK), wear: pick(WEARK),
      big: 0.9 + R() * 0.42, lean: R() < 0.5 ? -1 : 1, ant: ri(1, 3),
      belt: R() < 0.6, boots: R() < 0.7, pads: R() < 0.4,
      /* the things that make a room of them read as a NIGHT OUT rather than a
         line-up: eyewear, jewellery, something lit in the mouth */
      shades: R() < 0.26 ? (R() < 0.5 ? 'visor' : 'specs') : null,
      chain: R() < 0.3, ring: R() < 0.22, smoke: R() < 0.16,
      glowCol: hsl(hue + 160 + R() * 120, 84, 62)
    };
    t.clothL = hsl(hue + 140, 34, 66);
    t.clothD = hsl(hue + 140, 38, 26);
    /* Trousers get their own colour. When they shared one with the jacket the
       whole body below the neck read as a single dark slab. */
    t.pants = hsl(hue + 230 + R() * 60, 26 + R() * 22, 46 + R() * 14);
    t.pantsL = hsl(hue + 230, 24, 66);
    t.pantsD = hsl(hue + 230, 26, 19);
    if (t.eyeK === 'tri') t.eyes = 3;
    if (t.eyeK === 'stalk') t.eyes = Math.min(2, t.eyes);
    if (t.build === 'hulk') t.big = Math.max(t.big, 1.2);
    if (t.build === 'lanky') t.big = Math.min(t.big, 1.05);
    // the measurements everything else is hung off
    t.hr = Math.round(11 * t.big);                       // head radius
    t.sw = Math.round((t.build === 'hulk' ? 13 : t.build === 'lanky' ? 8 : 10) * t.big);
    t.th = Math.round((t.build === 'lanky' ? 17 : t.build === 'stout' ? 12 : 14) * t.big);
    t.lh = Math.round((t.build === 'lanky' ? 24 : t.build === 'stout' ? 15 : 19) * t.big);
    t.aw = Math.max(4, Math.round(5 * t.big));
    t.legLen = 0;                                        // no tentacles any more
    return t;
  }

  /* A tapered limb with a lit top and a dark underside, in whole pixels. */
  function limb(p, x0, y0, x1, y1, w0, w1, c, l, d) {
    const dx = x1 - x0, dy = y1 - y0;
    const n = Math.max(1, Math.ceil(Math.hypot(dx, dy)));
    for (let i = 0; i <= n; i++) {
      const q = i / n;
      const w = Math.max(1, Math.round(w0 + (w1 - w0) * q));
      const cx = Math.round(x0 + dx * q), cy = Math.round(y0 + dy * q);
      p.rect(cx - (w >> 1) - 1, cy - (w >> 1) - 1, w + 2, w + 2, d);
      p.rect(cx - (w >> 1), cy - (w >> 1), w, w, c);
      if (w > 2) p.rect(cx - (w >> 1), cy - (w >> 1), Math.max(1, w - 2), 1, l);
    }
  }

  function buildAlien(t, face) {
    const HW = t.hr * 2 + 26, HH = t.hr * 2 + t.th + t.lh + 26;
    const W = HW & ~1, H = HH & ~1;
    const p = pix(W, H);
    const cx = W >> 1;
    const FOOT = H - 2;
    const hipY = FOOT - t.lh;
    const shY = hipY - t.th;
    const neckY = shY - 3;
    const headY = neckY - t.hr - 1;
    const INK = '#140f26';
    const kiss = face === 4, blink = face === 5, cheer = face === 6;
    const talk = face === 3 || cheer;
    const step = face === 1 ? 1 : (face === 2 ? -1 : 0);   // walk frames

    // ---------------------------------------------------------------- legs
    const kneeY = hipY + Math.round(t.lh * 0.5);
    for (const side of [-1, 1]) {
      const sw = side * (step * 4);
      // far enough apart to leave daylight between them, or the two legs
      // and the body read as one solid block from across the room
      const hx = cx + side * (t.aw + 2);
      const fx = hx + sw;
      limb(p, hx, hipY, hx + sw * 0.5, kneeY, t.aw + 1, t.aw, t.pants, t.pantsL, INK);
      limb(p, hx + sw * 0.5, kneeY, fx, FOOT - 3, t.aw, t.aw - 1,
        t.wear === 'bare' ? t.skin : t.pants, t.wear === 'bare' ? t.lite : t.pantsL, INK);
      p.rect(hx - 1, kneeY - 1, 3, 2, t.pantsD);
      // a boot, or a foot with toes on it
      if (t.boots) {
        p.round(fx - t.aw, FOOT - 6, t.aw * 2 + 1, 7, 2, '#241f2e');
        p.rect(fx - t.aw, FOOT - 6, t.aw * 2 + 1, 2, t.acc);
      } else {
        p.round(fx - t.aw, FOOT - 4, t.aw * 2 + 1, 5, 2, t.skin);
        p.rect(fx - t.aw, FOOT - 1, t.aw * 2 + 1, 1, t.dark);
        for (let k = 0; k < 3; k++) p.set(fx + t.aw, FOOT - 4 + k, t.dark);
      }
    }

    // --------------------------------------------------------------- torso
    p.round(cx - t.sw, shY, t.sw * 2, t.th + 4, Math.max(2, (t.sw / 2) | 0), t.skin);
    p.round(cx - t.sw + 1, shY + 1, t.sw * 2 - 2, 4, 2, t.lite);          // lit shoulders
    p.round(cx - t.sw + 2, shY + t.th - 2, t.sw * 2 - 4, 5, 2, t.dark);   // shadow under the ribs
    // a belly, on the ones who have one
    if (t.build === 'stout' || t.build === 'hulk') {
      p.ellipse(cx, shY + t.th - 1, t.sw - 1, 5, t.skin);
      p.ellipse(cx, shY + t.th - 2, t.sw - 3, 3, t.lite);
    }

    // ------------------------------------------------------------- clothing
    const C = t.cloth, CL = t.clothL, CD = t.clothD;
    if (t.wear === 'vest') {
      p.round(cx - t.sw, shY + 1, 5, t.th + 2, 1, C);
      p.round(cx + t.sw - 5, shY + 1, 5, t.th + 2, 1, C);
      p.rect(cx - t.sw, shY + 1, 5, 1, CL); p.rect(cx + t.sw - 5, shY + 1, 5, 1, CL);
    } else if (t.wear === 'jacket') {
      p.round(cx - t.sw, shY, t.sw * 2, t.th + 3, 3, C);
      p.round(cx - 4, shY + 2, 8, t.th + 1, 2, t.lite);          // the shirt under it
      p.round(cx - t.sw, shY, 6, 9, 2, CL); p.round(cx + t.sw - 6, shY, 6, 9, 2, CL);
      p.rect(cx - t.sw, shY + t.th, t.sw * 2, 2, CD);
      p.rect(cx - 1, shY + 4, 2, t.th - 4, t.acc);                // and a tie on it
    } else if (t.wear === 'tank') {
      p.round(cx - t.sw + 2, shY + 4, t.sw * 2 - 4, t.th - 1, 2, C);
      p.rect(cx - t.sw + 2, shY + 4, t.sw * 2 - 4, 1, CL);
    } else if (t.wear === 'sash') {
      for (let i = 0; i < t.th + 2; i++) {
        p.rect(cx - t.sw + 1 + Math.round(i * 0.7), shY + 1 + i, 5, 1, i % 4 < 2 ? C : CL);
      }
    } else if (t.wear === 'coat') {
      p.round(cx - t.sw - 1, shY, t.sw * 2 + 2, t.th + 8, 3, C);
      p.rect(cx - 1, shY, 2, t.th + 8, CD);
      p.round(cx - t.sw - 1, shY, 6, 9, 2, CL); p.round(cx + t.sw - 5, shY, 6, 9, 2, CL);
    } else if (t.wear === 'sequin') {
      // a shirt that is entirely sequins, because it is that kind of room
      p.round(cx - t.sw, shY, t.sw * 2, t.th + 4, 2, C);
      for (let y = shY + 1; y < shY + t.th + 3; y += 2) {
        for (let x = cx - t.sw + 1; x < cx + t.sw - 1; x += 3) {
          const q = (x * 7 + y * 13) % 5;
          p.set(x + ((y >> 1) % 2), y, q === 0 ? '#ffffff' : (q === 1 ? CL : (q === 2 ? t.acc : CD)));
        }
      }
      p.rect(cx - t.sw, shY, t.sw * 2, 1, '#ffffff');
    } else if (t.wear === 'shirt') {
      // an open shirt with a collar and a triangle of chest
      p.round(cx - t.sw, shY, t.sw * 2, t.th + 4, 2, C);
      p.spike(cx, shY, 9, Math.round(t.th * 0.7), 1, t.skin);
      p.round(cx - t.sw, shY, 5, 6, 1, CL);
      p.round(cx + t.sw - 5, shY, 5, 6, 1, CL);
      for (let i = 0; i < 3; i++) p.set(cx, shY + Math.round(t.th * 0.7) + i * 3, t.acc);
    }
    // a chain, worn over whatever that was
    if (t.chain) {
      for (let i = -3; i <= 3; i++) {
        p.set(cx + i * 2, shY + 5 + Math.abs(i), t.acc);
        p.set(cx + i * 2 + 1, shY + 5 + Math.abs(i), t.accD);
      }
      p.round(cx - 2, shY + 9, 4, 4, 1, t.acc);
      p.set(cx - 1, shY + 10, '#ffffff');
    }
    // a waist, always: it is the line that stops the body being one slab
    p.rect(cx - t.sw + 1, shY + t.th + 1, t.sw * 2 - 2, 3, t.pantsD);
    p.rect(cx - t.sw + 1, shY + t.th + 1, t.sw * 2 - 2, 1, t.pants);
    if (t.belt) {
      p.rect(cx - t.sw, shY + t.th - 1, t.sw * 2, 3, CD);
      p.rect(cx - 2, shY + t.th - 1, 4, 3, t.acc);
    }

    // ---------------------------------------------------------------- arms
    for (const side of [-1, 1]) {
      const swing = side * (-step * 3);
      const sx = cx + side * (t.sw + 1);
      // both arms straight up when the room is going mad
      const ex = cheer ? sx + side * 2 : sx + side * 3 + swing;
      const hy = cheer ? shY - t.th + 2 : shY + t.th + 2 + Math.abs(swing);
      const mid = cheer ? shY - Math.round(t.th * 0.3) : shY + Math.round(t.th * 0.55);
      limb(p, sx, shY + 4, ex, mid, t.aw + 1, t.aw, t.skin, t.lite, INK);
      limb(p, ex, mid, ex + side * 2, hy, t.aw, t.aw - 1, t.skin, t.lite, INK);
      if (t.pads) p.round(sx - 2, shY + 2, 5, 4, 1, t.acc);
      // a hand with a couple of fingers on it
      p.round(ex + side * 2 - 3, hy, 6, 6, 2, t.lite);
      p.rect(ex + side * 2 - 3, hy + 5, 2, 2, t.skin);
      p.rect(ex + side * 2, hy + 5, 2, 2, t.skin);
    }

    // ---------------------------------------------------------------- head
    p.rect(cx - 2, neckY - 2, 4, 5, t.dark);                          // neck
    p.ellipse(cx, headY, t.hr, t.hr - 1, t.skin);
    p.ellipse(cx, headY - Math.round(t.hr * 0.4), Math.round(t.hr * 0.72), Math.round(t.hr * 0.34), t.lite);
    p.ellipse(cx, headY + Math.round(t.hr * 0.55), Math.round(t.hr * 0.8), Math.round(t.hr * 0.3), t.dark);
    // a jaw, so the head is not a ball
    p.round(cx - t.hr + 2, headY + 1, (t.hr - 2) * 2, t.hr, 3, t.skin);

    // ------------------------------------------------- skin, close up
    if (t.tex === 'speckle') {
      for (let i = 0; i < 16; i++) {
        const a = i * 1.7;
        p.set(cx + Math.cos(a) * t.hr * 0.6, headY + Math.sin(a) * t.hr * 0.55, t.dark);
        p.set(cx + Math.cos(a * 1.3) * t.sw * 0.6, shY + 4 + (i % t.th), t.dark);
      }
    } else if (t.tex === 'scale') {
      for (let y = shY + 3; y < shY + t.th; y += 3) {
        for (let x = cx - t.sw + 2; x < cx + t.sw - 1; x += 4) {
          p.set(x + ((y / 3) | 0) % 2 * 2, y, t.dark);
          p.set(x + ((y / 3) | 0) % 2 * 2 + 1, y, t.lite);
        }
      }
      for (let y = headY - 2; y < headY + t.hr - 2; y += 3) p.rect(cx - t.hr + 3, y, 2, 1, t.dark);
    } else if (t.tex === 'stripe') {
      for (let i = 0; i < 4; i++) {
        p.rect(cx - t.sw + 1, shY + 3 + i * 4, t.sw * 2 - 2, 1, t.dark);
        p.rect(cx - t.hr + 3, headY - 4 + i * 3, (t.hr - 3) * 2, 1, t.dark);
      }
    } else if (t.tex === 'plate') {
      p.round(cx - t.sw + 1, shY + 2, t.sw * 2 - 2, 5, 2, t.lite);
      p.round(cx - t.sw + 2, shY + 8, t.sw * 2 - 4, 4, 1, t.lite);
      p.round(cx - t.hr + 2, headY - t.hr + 2, (t.hr - 2) * 2, 5, 2, t.lite);
    } else if (t.tex === 'spot') {
      // big soft blotches, like a cow that got into space
      for (let i = 0; i < 5; i++) {
        const a = i * 1.9 + t.seed % 3;
        p.ellipse(cx + Math.cos(a) * t.hr * 0.5, headY + Math.sin(a) * t.hr * 0.45,
          2 + (i % 2), 2, t.dark);
        p.ellipse(cx + Math.cos(a * 1.6) * t.sw * 0.55, shY + 5 + (i * 3) % (t.th - 2),
          3, 2, t.dark);
      }
    } else if (t.tex === 'glow') {
      // lit from inside: a row of lamps down each side
      for (let i = 0; i < 4; i++) {
        for (const sd of [-1, 1]) {
          p.set(cx + sd * Math.round(t.hr * 0.66), headY - 3 + i * 3, t.glowCol);
          p.set(cx + sd * (t.sw - 2), shY + 4 + i * 3, t.glowCol);
        }
      }
    }

    // ---------------------------------------------------- what is on the head
    if (t.crown === 'fin') {
      for (let i = 0; i < 4; i++) p.spike(cx - 5 + i * 3, headY - t.hr - 8 + i * 2, 6, 11 - i * 2, -1, t.acc);
    } else if (t.crown === 'horns') {
      for (const s of [-1, 1]) {
        p.spike(cx + s * (t.hr - 2), headY - t.hr - 5, 6, 9, -1, t.lite);
        p.rect(cx + s * (t.hr - 3), headY - t.hr + 1, 3, 3, t.lite);
      }
    } else if (t.crown === 'antenna') {
      for (let i = 0; i < t.ant; i++) {
        const ax = cx + (i - (t.ant - 1) / 2) * 6;
        const hgt = 6 + ((t.seed >> (i + 2)) & 5);
        p.rect(ax, headY - t.hr - hgt, 2, hgt + 3, t.dark);
        p.disc(ax + 1, headY - t.hr - hgt, 2 + (i & 1), t.acc);
      }
    } else if (t.crown === 'tuft') {
      for (let i = 0; i < 4; i++) p.line(cx - 4 + i * 3, headY - t.hr + 2, cx - 8 + i * 6, headY - t.hr - 9, t.acc);
    } else if (t.crown === 'ears') {
      for (const s of [-1, 1]) {
        p.ellipse(cx + s * (t.hr + 1), headY - 2, 3, 5, t.skin);
        p.ellipse(cx + s * (t.hr + 1), headY - 2, 1, 3, t.dark);
      }
    } else if (t.crown === 'hat') {
      p.round(cx - 8, headY - t.hr - 7, 16, 8, 2, '#2a2438');
      p.rect(cx - 12, headY - t.hr - 1, 24, 2, '#2a2438');
      p.rect(cx - 8, headY - t.hr - 4, 16, 1, t.acc);
    } else if (t.crown === 'mohawk') {
      // a hard ridge of spines down the middle, tallest at the front
      for (let i = 0; i < 6; i++) {
        const hgt = 12 - Math.abs(i - 1) * 2;
        p.spike(cx - 6 + i * 2.4, headY - t.hr - hgt + 2, 4, hgt, -1, i % 2 ? t.acc : t.accD);
      }
      p.rect(cx - 7, headY - t.hr, 15, 2, t.accD);
    } else if (t.crown === 'tendrils') {
      // a crown of little feelers, each curling its own way
      for (let i = 0; i < 5; i++) {
        const sd = i % 2 ? 1 : -1, off = (i - 2) * 3;
        let px = cx + off, py = headY - t.hr + 1;
        for (let k = 0; k < 5; k++) {
          p.rect(px - 1, py, 2, 2, k > 2 ? t.acc : t.dark);
          px += sd * (k > 1 ? 1 : 0); py -= 2;
        }
        p.disc(px, py, 1.6, t.acc);
      }
    } else if (t.crown === 'cap') {
      // a flat cap with the peak pulled down over one eye
      p.round(cx - 9, headY - t.hr - 6, 18, 8, 3, t.clothD);
      p.rect(cx - 9, headY - t.hr - 1, 18, 2, t.cloth);
      p.round(cx + t.lean * 6 - 7, headY - t.hr + 1, 14, 3, 1, t.clothD);
      p.rect(cx - 2, headY - t.hr - 7, 4, 2, t.acc);
    } else if (t.crown === 'crest') {
      // one blade of bone, swept back and up off the skull
      const sd = t.lean > 0 ? -1 : 1;
      for (let i = 0; i < 12; i++) {
        const w = Math.max(1, 9 - i * 0.68);
        p.rect(cx + sd * i * 1.15 - w / 2, headY - t.hr - 1 - i, w, 2, i < 3 ? t.skin : t.lite);
      }
      p.rect(cx - 5, headY - t.hr - 1, 11, 2, t.dark);
    }

    // ---------------------------------------------------------------- face
    const ey = headY - Math.round(t.hr * 0.12);
    const er = t.hr > 12 ? 3 : 2;
    const pos = [];
    if (t.eyeK === 'stack') for (let i = 0; i < t.eyes; i++) pos.push([cx, ey - 4 + i * (er * 2 + 1)]);
    else if (t.eyeK === 'tri') pos.push([cx - 4, ey - 2], [cx + 4, ey - 2], [cx, ey + 4]);
    else if (t.eyeK === 'stalk') {
      for (let i = 0; i < t.eyes; i++) {
        const sxp = cx + (t.eyes === 1 ? 0 : (i ? 5 : -5));
        p.rect(sxp - 1, headY - t.hr - 7, 2, 10, t.dark);
        pos.push([sxp, headY - t.hr - 8]);
      }
    } else for (let i = 0; i < t.eyes; i++) pos.push([cx + (i - (t.eyes - 1) / 2) * (er * 2 + 2), ey]);

    for (const q of pos) {
      const ex = Math.round(q[0]), eyy = Math.round(q[1]);
      // a socket, so the eye sits IN the face rather than on it
      p.ellipse(ex, eyy, er + 1, er + 1, t.dark);
      if (kiss || blink) { p.rect(ex - er, eyy, er * 2 + 1, 2, INK); p.rect(ex - er + 1, eyy - 1, er * 2 - 1, 1, t.dark); continue; }
      p.ellipse(ex, eyy, er, er + 1, '#ffffff');
      p.ellipse(ex + t.lean, eyy + 1, Math.max(1, er - 1), Math.max(1, er - 1), INK);
      p.set(ex - 1, eyy - 2, '#ffffff');
      p.rect(ex - er - 1, eyy - er - 2, er * 2 + 2, 1, t.dark);        // a brow
    }

    const my = headY + Math.round(t.hr * 0.58);

    else if (talk) { p.ellipse(cx, my, 4, 3, '#3a1226'); p.rect(cx - 3, my - 2, 7, 1, '#ffffff'); p.rect(cx - 2, my + 2, 5, 1, '#c4566f'); }
    else if (t.mouth === 'grin') { p.rect(cx - 4, my, 9, 1, INK); p.set(cx - 5, my - 1, INK); p.set(cx + 5, my - 1, INK); }
    else if (t.mouth === 'lips') { p.ellipse(cx, my, 4, 2, t.accD); p.rect(cx - 3, my - 1, 7, 1, INK); }
    else if (t.mouth === 'tusk') {
      p.rect(cx - 5, my, 11, 1, INK);
      p.spike(cx - 4, my - 5, 4, 6, -1, '#ffffff'); p.spike(cx + 4, my - 5, 4, 6, -1, '#ffffff');
    } else if (t.mouth === 'beak') { p.spike(cx, my - 3, 8, 7, 1, t.acc); p.rect(cx - 4, my - 3, 9, 1, INK); }
    else if (t.mouth === 'straw') { p.rect(cx - 1, my, 2, 8, t.dark); p.disc(cx, my + 8, 2, t.acc); }
    else if (t.mouth === 'mandible') {
      p.spike(cx - 5, my - 2, 5, 7, 1, t.dark); p.spike(cx + 5, my - 2, 5, 7, 1, t.dark);
      p.rect(cx - 2, my, 5, 1, INK);
    } else if (t.mouth === 'grill') {
      // every tooth gold, and he knows it
      p.rect(cx - 5, my - 1, 11, 4, INK);

      p.rect(cx - t.hr + 2, ey - er, (t.hr - 2) * 2, 1, t.acc);

  /* THE DANCER. Four poses on a pole, all drawn in one canvas with the pole
     always at the same column, so the act lines up with the pole the room
     draws. A hold, a lean, a leg out, and the upside-down one. Sequins, a
     feather boa, and the professional detachment of somebody working a
     Tuesday. */
  const DPX = 40, DW = 60, DH = 78;
  function dancer(f) {
    const p = pix(DW, DH);
    const S1 = '#ff5fa8', S2 = '#c22a6a', SD = '#a33a78', L = '#ffd6f0';
    const G = '#ffd34d', B = '#c9a0ff';
    const POSE = [
      { bx: 24, by: 46, up: 1, legs: 'stand' },
      { bx: 17, by: 50, up: 1, legs: 'lean' },
      { bx: 26, by: 44, up: 1, legs: 'kick' },
      { bx: 24, by: 54, up: 0, legs: 'invert' }
    ][f];
    const bx = POSE.bx, by = POSE.by;

    // a tapering tentacle from one point to another, with a bit of curve in it
    const leg = (x0, y0, x1, y1, w) => {
      for (let i = 0; i <= 16; i++) {
        const q = i / 16;
        const x = x0 + (x1 - x0) * q + Math.sin(q * 3.1) * 3;
        const y = y0 + (y1 - y0) * q;
        const ww = Math.max(2, Math.round(w - q * (w - 2)));
        p.rect(x - ww / 2, y, ww, 2, q > 0.55 ? SD : S2);

    if (POSE.legs === 'stand') { leg(bx - 6, by + 8, bx - 11, 74, 7); leg(bx + 2, by + 9, bx + 5, 74, 7); leg(bx + 9, by + 6, bx + 22, 70, 5); }
    if (POSE.legs === 'lean') { leg(bx - 3, by + 8, bx + 8, 74, 7); leg(bx + 5, by + 5, bx + 20, 66, 6); leg(bx - 8, by + 4, bx - 13, 58, 5); }
    if (POSE.legs === 'kick') { leg(bx - 6, by + 8, bx - 9, 74, 7); leg(bx + 8, by + 2, bx + 33, 30, 6); leg(bx + 1, by + 9, bx + 9, 72, 6); }
    // upside down: head low over the boards, legs wrapped up the pole
    if (POSE.legs === 'invert') { leg(bx - 4, by - 10, DPX - 6, 12, 7); leg(bx + 6, by - 10, DPX + 4, 8, 7); leg(bx, by - 11, DPX + 12, 22, 5); }

    // the grip: a tentacle from the body to the pole, and a hand on it
    if (POSE.up) {
      const gy = 14;
      for (let i = 0; i <= 14; i++) {
        const q = i / 14;
        p.rect(bx + 7 + (DPX - bx - 7) * q - 2, by - 6 + (gy - by + 6) * q - 1, 4, 3, S1);
      }
      p.ellipse(DPX, gy, 5, 4, L);
      p.rect(DPX - 5, gy - 1, 10, 2, S2);
    }

    // the body, and what little there is of the outfit
    p.ellipse(bx, by, 12, 12, S1);
    p.ellipse(bx, by - 6, 9, 6, L);
    p.round(bx - 11, by + 2, 22, 10, 3, G);
    p.rect(bx - 11, by + 4, 22, 1, '#fff3b0');
    for (let i = 0; i < 6; i++) p.set(bx - 9 + i * 4, by + 6 + (i % 2) * 3, '#ffffff');
    // the boa, which cost more than the outfit
    for (let i = 0; i < 8; i++) p.disc(bx - 14 + i * 4, by - 10 + Math.sin(i * 1.2) * 3, 3, i % 2 ? B : '#d8bcff');
    // the face: one eye on the pole, one on the clock
    for (const ex of [bx - 5, bx + 4]) {
      if (f === 1) { p.rect(ex - 3, by - 3, 7, 2, '#140f26'); continue; }

      p.ellipse(ex + (f === 2 ? 1 : 0), by - 2, 2, 2, '#140f26');
      p.set(ex - 1, by - 5, '#ffffff');
    }
    p.round(bx - 3, by + 1, 7, 2, 1, S2);
    p.outline(P.ink);
    return p;
  }

/* ===== src/galaxy.js ===== */
/* Deep-space backdrop: a spiral arm of stars and dust, coloured nebulae, a sun
   with a flare, ringed planets and moons, shooting stars. Everything heavy is
   pre-rendered once into layer canvases and scrolled with parallax. */
(function (PD) {
  'use strict';
  const U = PD.util;

  const VW = 480, VH = 270;
  let layers = null;

  function shade(hex, f, alpha) {
    const n = parseInt(hex.slice(1), 16);
    const r = U.clamp(((n >> 16) & 255) * f, 0, 255) | 0, g = U.clamp(((n >> 8) & 255) * f, 0, 255) | 0, b = U.clamp((n & 255) * f, 0, 255) | 0;
    return alpha === undefined ? 'rgb(' + r + ',' + g + ',' + b + ')' : 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  /* An integer scanline disc: every edge is a hard pixel step. */
  function pxDisc(c, cx, cy, r, col) {
    if (col) c.fillStyle = col;
    const r2 = r;
    for (let y = Math.ceil(cy - r); y <= Math.floor(cy + r); y++) {
      const dy = Math.abs(y - cy + 0.5) / r2;
      if (dy > 1) continue;
      const w = r2 * Math.sqrt(Math.max(0, 1 - dy * dy));
      const x0 = Math.round(cx - w), x1 = Math.round(cx + w);
      if (x1 > x0) c.fillRect(x0, y, x1 - x0, 1);
    }
  }

  /* The galactic band: thousands of tiny stars concentrated along a tilted
     sine, with dust lanes drawn dark through them. */
  function buildBand(seed) {
    const W = 960, H = 540;
    const cv = canvas(W, H), c = cv.getContext('2d');
    const rnd = U.mulberry32(seed);
    const grd = c.createLinearGradient(0, 0, W, H);
    grd.addColorStop(0, 'rgba(40,20,80,0)');
    grd.addColorStop(0.5, 'rgba(70,40,120,0.35)');
    grd.addColorStop(1, 'rgba(30,15,60,0)');
    c.fillStyle = grd;
    c.save(); c.translate(W / 2, H / 2); c.rotate(-0.42); c.fillRect(-W, -90, W * 2, 180); c.restore();
    for (let i = 0; i < 5200; i++) {
      const t = rnd();
      const along = (rnd() - 0.5) * W * 1.6;
      const spread = (rnd() + rnd() + rnd() - 1.5) * 70;
      const x = W / 2 + along * Math.cos(-0.42) - spread * Math.sin(-0.42);
      const y = H / 2 + along * Math.sin(-0.42) + spread * Math.cos(-0.42);
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const big = t > 0.985;
      c.fillStyle = t > 0.93 ? '#ffe2b8' : (t > 0.86 ? '#b8d8ff' : '#ffffff');
      c.globalAlpha = big ? 0.9 : 0.25 + rnd() * 0.45;
      c.fillRect(x | 0, y | 0, big ? 2 : 1, big ? 2 : 1);
    }
    // dust lanes
    c.globalAlpha = 1;
    for (let i = 0; i < 14; i++) {
      const along = (rnd() - 0.5) * W * 1.2, spread = (rnd() - 0.5) * 60;
      const x = W / 2 + along * Math.cos(-0.42) - spread * Math.sin(-0.42);
      const y = H / 2 + along * Math.sin(-0.42) + spread * Math.cos(-0.42);
      const rr = 40 + rnd() * 60;
      c.save(); c.translate(x, y); c.rotate(-0.42); c.scale(2.6, 0.7); c.translate(-x, -y);
      for (let k = 5; k >= 1; k--) {                    // stepped dust bands
        c.globalAlpha = 0.16;
        pxDisc(c, x, y, rr * k / 5, 'rgb(6,3,14)');
      }
      c.globalAlpha = 1;
      c.restore();
    }
    return cv;
  }

  function buildNebulae(seed) {
    const W = 480, H = 270;
    const cv = canvas(W, H), c = cv.getContext('2d');
    const rnd = U.mulberry32(seed + 7);
    const cols = ['#5a2a8a', '#2a4a8a', '#8a2a5a', '#2a7a6a', '#7a3a2a'];
    for (let i = 0; i < 9; i++) {
      const x = rnd() * W, y = rnd() * H, r = 50 + rnd() * 110;
      const col = cols[i % cols.length];
      c.save(); c.translate(x, y); c.rotate(rnd() * 3); c.scale(1 + rnd(), 0.6 + rnd() * 0.5); c.translate(-x, -y);
      for (let k = 6; k >= 1; k--) pxDisc(c, x, y, r * k / 6, shade(col, 0.7 + k * 0.06, 0.05));
      c.restore();
    }
    // speckle so it reads as pixel art, not a soft blur
    for (let i = 0; i < 2600; i++) {
      c.fillStyle = 'rgba(255,255,255,' + (0.03 + rnd() * 0.08).toFixed(3) + ')';
      c.fillRect((rnd() * W) | 0, (rnd() * H) | 0, 1, 1);
    }
    return cv;
  }

  /* ------------------------------------------------------------ the spiral
     A whole galaxy, face on and tilted, for the menu to sit in front of. Two
     logarithmic arms are walked outwards and stars scattered along them with a
     falloff, so the arms are dense where they leave the bulge and fray at the
     rim; dark lanes are walked down the inside edge of each arm because the
     dust is what makes a spiral read as a spiral rather than a smear.

     Colour runs out with radius -- gold in the bulge, coral and violet through
     the arms, cold blue at the rim -- which is roughly what a real one does
     and, more to the point, is beautiful. */
  function buildSpiral(seed) {
    const W = 520, H = 340;
    const cv = canvas(W, H), c = cv.getContext('2d');
    const rnd = U.mulberry32(seed + 501);
    const cx = W / 2, cy = H / 2;
    const SQ = 0.44;                            // how far it is tilted over
    const R = 232;

    const hue = f => {
      if (f < 0.14) return '#fff3cf';
      if (f < 0.3) return '#ffd98a';
      if (f < 0.46) return '#ffab7a';
      if (f < 0.64) return '#e88ac4';
      if (f < 0.82) return '#a98ae8';
      return '#8ac4ff';
    };

    // the faint halo the whole thing sits in
    for (let k = 9; k >= 1; k--) {
      c.save(); c.translate(cx, cy); c.scale(1, SQ); c.translate(-cx, -cy);
      pxDisc(c, cx, cy, R * k / 9, 'rgba(120,90,200,0.035)');
      c.restore();
    }

    const ARMS = 2, TURN = 2.5;
    for (let a = 0; a < ARMS; a++) {
      const off = a * Math.PI * 2 / ARMS;
      // the dust lane first, so the stars of the arm sit on top of it
      for (let i = 0; i < 420; i++) {
        const f = 0.12 + (i / 420) * 0.88;
        const ang = off + f * TURN * Math.PI + 0.13;
        const r = f * R;
        const spread = (rnd() - 0.5) * 26 * f;
        const x = cx + Math.cos(ang) * (r + spread);
        const y = cy + Math.sin(ang) * (r + spread) * SQ;
        c.fillStyle = 'rgba(20,8,34,0.5)';
        c.fillRect(x | 0, y | 0, 3, 2);
      }
      for (let i = 0; i < 5600; i++) {
        const f = 0.07 + Math.pow(rnd(), 0.62) * 0.93;
        const ang = off + f * TURN * Math.PI + (rnd() - 0.5) * (0.5 - f * 0.28);
        const r = f * R;
        // stars scatter further off the arm the further out you go
        const spread = (rnd() + rnd() + rnd() - 1.5) * (10 + f * 34);
        const x = cx + Math.cos(ang) * r + spread;
        const y = cy + (Math.sin(ang) * r) * SQ + spread * SQ;
        if (x < 0 || y < 0 || x >= W || y >= H) continue;
        const big = rnd() > 0.988;
        c.globalAlpha = (0.25 + rnd() * 0.6) * (1 - f * 0.35);
        c.fillStyle = rnd() > 0.72 ? '#ffffff' : hue(f);
        c.fillRect(x | 0, y | 0, big ? 2 : 1, big ? 2 : 1);
      }
    }
    c.globalAlpha = 1;

    // the bulge: a hard little octagon of light with a gold skirt
    c.save(); c.translate(cx, cy); c.scale(1, 0.78); c.translate(-cx, -cy);
    for (let k = 7; k >= 1; k--) {
      const f = k / 7;
      c.globalAlpha = 0.1 + (1 - f) * 0.16;
      pxDisc(c, cx, cy, 46 * f, f > 0.6 ? '#d8913f' : (f > 0.3 ? '#ffd98a' : '#fff8e0'));
    }
    c.globalAlpha = 1;
    pxDisc(c, cx, cy, 9, '#fffaea');
    c.restore();

    // a thousand field stars over the top, so nothing looks airbrushed
    for (let i = 0; i < 900; i++) {
      c.globalAlpha = 0.1 + rnd() * 0.4;
      c.fillStyle = '#ffffff';
      c.fillRect((rnd() * W) | 0, (rnd() * H) | 0, 1, 1);
    }
    c.globalAlpha = 1;
    return cv;
  }

  let spiralCv = null;
  /* Draw the menu sky: deep space, the spiral drifting, a live pulse on its
     core and a scatter of twinkles that the baked canvas cannot do. */
  function spiral(ctx, t, seed) {
    if (!spiralCv) spiralCv = buildSpiral(seed || 7);
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, '#0a0620'); g.addColorStop(0.55, '#120a2c'); g.addColorStop(1, '#05030f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    const L = ensure((seed || 7) + 3);
    ctx.globalAlpha = 0.5;
    ctx.drawImage(L.nebulae, -((t * 3) % VW), -8, VW, VH + 16);
    ctx.drawImage(L.nebulae, -((t * 3) % VW) + VW, -8, VW, VH + 16);
    ctx.globalAlpha = 1;
    const dx = Math.round(296 - 260 + Math.sin(t * 0.09) * 5);
    const dy = Math.round(104 - 170 + Math.cos(t * 0.07) * 4);
    ctx.drawImage(spiralCv, dx, dy);
    // the core breathes
    PD.pxd.glowBands(ctx, dx + 260, dy + 170, 38 + Math.sin(t * 0.9) * 4, '#ffd98a', 5, 0.2);
    for (const st of L.stars[2]) {
      const x = (st.x * VW) % VW, y = (st.y * VH) % VH;
      ctx.globalAlpha = 0.3 + 0.7 * Math.max(0, Math.sin(t * 1.6 + st.tw));
      ctx.fillStyle = st.c;
      ctx.fillRect(x | 0, y | 0, st.s, st.s);
    }
    ctx.globalAlpha = 1;
  }

  /* A far planet: banded disc, optional rings, a moon, terminator shading. */
  /* Planets and suns are rasterised at a low resolution with an integer
     scanline disc -- every edge is a hard pixel step -- then blown up with
     nearest-neighbour, so a world in the sky reads as pixel art and never as
     a smooth vector circle. */
  const PXK = 4;                                   // blow-up factor

  /* One elliptical ring, as pixels. `back` draws the far half only. */
  function pxRingBand(c, cx, cy, r, squash, col, thick, back) {
    c.fillStyle = col;
    for (let x = Math.round(cx - r); x <= Math.round(cx + r); x++) {
      const dx = (x - cx) / r;
      const k = 1 - dx * dx;
      if (k < 0) continue;
      const dy = Math.sqrt(k) * r * squash;
      if (back) c.fillRect(x, Math.round(cy - dy), 1, thick);
      else c.fillRect(x, Math.round(cy + dy), 1, thick);
    }
  }

  function buildPlanet(size, tint, seed, rings) {
    const S = Math.max(12, Math.round(size / PXK));
    const pad = rings ? Math.round(S * 0.55) : Math.round(S * 0.18);
    const W = S + pad * 2;
    const src = canvas(W, W), c = src.getContext('2d');
    const rnd = U.mulberry32(seed);
    const cx = W / 2, cy = W / 2, r = S / 2;

    // continents, as blobs on the sphere's surface in latitude/longitude
    const spots = [];
    for (let i = 0; i < 7; i++) spots.push({ x: (rnd() - 0.5) * 1.7, y: (rnd() - 0.5) * 1.7, r: 0.16 + rnd() * 0.26, k: 1.2 + rnd() * 0.35 });
    const bands = [];
    for (let i = 0; i < 12; i++) bands.push(0.75 + rnd() * 0.5);

    if (rings) for (let k = 0; k < 3; k++) pxRingBand(c, cx, cy, r * (1.45 + k * 0.26), 0.3, shade(tint, 1.0 - k * 0.16), 2, true);

    // shade the sphere per pixel, quantised into steps
    for (let y = 0; y < W; y++) {
      for (let x = 0; x < W; x++) {
        const dx = (x - cx + 0.5) / r, dy = (y - cy + 0.5) / r;
        const ax = Math.abs(dx), ay = Math.abs(dy);
        if (ax * ax + ay * ay > 1) continue;                // a real disc
        const d2 = Math.min(0.999, dx * dx + dy * dy);
        const nz = Math.sqrt(1 - d2);
        let lam = -dx * 0.55 - dy * 0.5 + nz * 0.62;          // light from the upper left
        lam = U.clamp(lam, 0, 1);
        lam = Math.round(lam * 5) / 5;                          // five hard bands
        let f = 0.34 + lam * 1.05;
        f *= bands[Math.min(bands.length - 1, Math.floor((dy + 1) / 2 * bands.length))];
        for (const sp of spots) {
          if (Math.abs(dx - sp.x) < sp.r && Math.abs(dy - sp.y) < sp.r * 0.7) { f *= sp.k; break; }
        }
        c.fillStyle = shade(tint, U.clamp(f, 0.12, 1.9));
        c.fillRect(x, y, 1, 1);
      }
    }
    // lit limb, a single stepped pixel line on the sunward side
    c.fillStyle = shade(tint, 1.75);
    // the lit limb, traced along the octagon's own upper-left facets
    const cc2 = r * 0.42;
    const lim = [[-r + cc2, -r], [r - cc2, -r], [-r, -r + cc2], [-r, r - cc2], [-r + cc2, r]];
    for (let i = 0; i < lim.length - 1; i += 1) {
      const a3 = lim[i], b3 = lim[i + 1];
      const n = Math.max(2, Math.round(Math.hypot(b3[0] - a3[0], b3[1] - a3[1])));
      for (let k = 0; k <= n; k++) {
        const f = k / n;
        c.fillRect(Math.round(cx + a3[0] + (b3[0] - a3[0]) * f), Math.round(cy + a3[1] + (b3[1] - a3[1]) * f), 1, 1);
      }
    }
    if (rings) for (let k = 0; k < 3; k++) pxRingBand(c, cx, cy, r * (1.45 + k * 0.26), 0.3, shade(tint, 1.4 - k * 0.16), 2, false);
    // a moon, shaded the same way
    const mr = Math.max(1, r * 0.15);
    pxDisc(c, cx + r * 1.3, cy - r * 0.85, mr, shade(tint, 0.55));
    pxDisc(c, cx + r * 1.3 - mr * 0.3, cy - r * 0.85 - mr * 0.3, mr * 0.6, shade(tint, 0.85));

    const cv = canvas(W * PXK, W * PXK);
    const cc = cv.getContext('2d');
    cc.imageSmoothingEnabled = false;
    cc.drawImage(src, 0, 0, W, W, 0, 0, W * PXK, W * PXK);
    return cv;
  }

  /* A pixel sun: quantised corona rings and four tapering spikes. */
  function buildSun(size, col) {
    const R = Math.max(4, Math.round(size / PXK));
    const S = R * 8;
    const src = canvas(S, S), c = src.getContext('2d');
    const cx = S / 2, cy = S / 2;
    for (let y = 0; y < S; y++) {
      for (let x = 0; x < S; x++) {
        // octagonal falloff: |x|+|y| clipped, so even the corona is faceted
        const ax2 = Math.abs(x - cx + 0.5) / R, ay2 = Math.abs(y - cy + 0.5) / R;
        const d = Math.sqrt(ax2 * ax2 + ay2 * ay2);
        if (d > 3.4) continue;
        let a, f;
        if (d <= 0.55) { a = 1; f = 1.7; }
        else if (d <= 0.85) { a = 1; f = 1.35; }
        else if (d <= 1.05) { a = 1; f = 1.05; }
        else { a = U.clamp(0.42 - (d - 1.05) * 0.16, 0, 0.42); f = 1.1; }
        if (a <= 0.02) continue;
        c.globalAlpha = Math.round(a * 6) / 6;
        c.fillStyle = d <= 0.55 ? '#fff8e0' : shade(col, f);
        c.fillRect(x, y, 1, 1);
      }
    }
    c.globalAlpha = 1;
    // spikes: tapering pixel bars on the four axes
    for (let i = 0; i < 4; i++) {
      const len = R * 3.2;
      for (let d = R; d < len; d++) {
        const th = Math.max(1, Math.round((1 - d / len) * R * 0.5));
        c.globalAlpha = Math.round((1 - d / len) * 5) / 5 * 0.7;
        c.fillStyle = shade(col, 1.3);
        if (i === 0) c.fillRect(cx + d, cy - th / 2, 1, th);
        else if (i === 1) c.fillRect(cx - d, cy - th / 2, 1, th);
        else if (i === 2) c.fillRect(cx - th / 2, cy + d, th, 1);
        else c.fillRect(cx - th / 2, cy - d, th, 1);
      }
    }
    c.globalAlpha = 1;
    const cv = canvas(S * PXK, S * PXK);
    const cc = cv.getContext('2d');
    cc.imageSmoothingEnabled = false;
    cc.drawImage(src, 0, 0, S, S, 0, 0, S * PXK, S * PXK);
    return cv;
  }

  function ensure(seed) {
    if (layers && layers.seed === seed) return layers;
    const rnd = U.mulberry32(seed + 99);
    layers = {
      seed,
      band: buildBand(seed),
      nebulae: buildNebulae(seed),
      sun: { cv: buildSun(20 + rnd() * 14, U.pick(['#ffd27a', '#ffb07a', '#b8e0ff'])), x: 0.12 + rnd() * 0.5, y: 0.08 + rnd() * 0.25, p: 0.02 },
      planets: [],
      stars: [],
      shooters: []
    };
    const tints = ['#8a5a9a', '#5a8a9a', '#9a7a4a', '#4a7a5a', '#9a4a4a', '#6a6a9a'];
    for (let i = 0; i < 4; i++) {
      const size = 22 + rnd() * 50;
      layers.planets.push({ cv: buildPlanet(size, tints[(i + Math.floor(seed)) % tints.length], seed * 3 + i, i % 2 === 0),
        x: rnd() * 1.3, y: rnd() * 0.9, p: 0.03 + i * 0.015 });
    }
    for (let l = 0; l < 3; l++) {
      const arr = [];
      for (let i = 0; i < 110 - l * 25; i++) arr.push({ x: rnd() * 1.5, y: rnd() * 1.5, s: l === 2 && rnd() > 0.7 ? 2 : 1, tw: rnd() * 6.28, c: rnd() > 0.88 ? '#ffd9a0' : (rnd() > 0.72 ? '#a9d8ff' : '#ffffff') });
      layers.stars.push(arr);
    }
    return layers;
  }

  /* Draw the whole sky. `cam` in world px; `skyTint` is the world's own hue. */
  function draw(ctx, cam, time, seed, skyTint, opts) {
    opts = opts || {};
    const L = ensure(seed);
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, skyTint || '#0b0720');
    g.addColorStop(1, '#04030d');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

    // galactic band, slow parallax, tiled horizontally
    const bx = -((cam.x * 0.012) % 960), by = -60 - (cam.y * 0.008) % 40;
    ctx.globalAlpha = 0.9;
    ctx.drawImage(L.band, bx, by, 960, 540);
    ctx.drawImage(L.band, bx + 960, by, 960, 540);
    ctx.globalAlpha = 0.85;
    ctx.drawImage(L.nebulae, -((cam.x * 0.02) % VW) - 2, -((cam.y * 0.015) % 60) - 2, VW + 4, VH + 64);
    ctx.globalAlpha = 1;

    for (let l = 0; l < L.stars.length; l++) {
      const par = 0.03 + l * 0.05;
      for (const st of L.stars[l]) {
        const x = ((st.x * VW * 1.5 - cam.x * par) % (VW * 1.5) + VW * 1.5) % (VW * 1.5);
        const y = ((st.y * VH * 1.5 - cam.y * par * 0.7) % (VH * 1.5) + VH * 1.5) % (VH * 1.5);
        if (x > VW || y > VH) continue;
        ctx.globalAlpha = (0.55 + 0.45 * Math.sin(time * 2 + st.tw)) * (0.4 + l * 0.25);
        ctx.fillStyle = st.c;
        ctx.fillRect(x | 0, y | 0, st.s, st.s);
      }
    }
    ctx.globalAlpha = 1;

    const sun = L.sun;
    ctx.drawImage(sun.cv, (sun.x * VW - cam.x * sun.p - sun.cv.width / 2) | 0, (sun.y * VH - cam.y * sun.p * 0.7 - sun.cv.height / 2) | 0);

    for (const pl of L.planets) {
      const x = ((pl.x * VW * 1.3 - cam.x * pl.p) % (VW * 1.3) + VW * 1.3) % (VW * 1.3) - pl.cv.width / 2;
      const y = pl.y * VH - cam.y * pl.p * 0.6 - pl.cv.height / 2;
      ctx.drawImage(pl.cv, x | 0, y | 0);
    }

    // shooting stars, occasionally
    if (Math.random() < 0.004 && L.shooters.length < 2) L.shooters.push({ x: Math.random() * VW, y: Math.random() * VH * 0.5, vx: 260 + Math.random() * 200, vy: 90 + Math.random() * 80, life: 0.6 });
    for (let i = L.shooters.length - 1; i >= 0; i--) {
      const s = L.shooters[i];
      s.life -= 1 / 60; s.x += s.vx / 60; s.y += s.vy / 60;
      if (s.life <= 0) { L.shooters.splice(i, 1); continue; }
      PD.pxd.line(ctx, s.x, s.y, s.x - s.vx * 0.06, s.y - s.vy * 0.06, 'rgba(255,255,255,' + (s.life).toFixed(2) + ')', 1);
    }
  }

  PD.galaxy = { draw, ensure, spiral, buildPlanet, buildSun };
})(window.PD);

    ']': ['.###.', '...#.', '...#.', '...#.', '...#.', '...#.', '.###.'],
    "'": ['..#..', '..#..', '.....', '.....', '.....', '.....', '.....'],
    '<': ['....#', '...#.', '..#..', '.#...', '..#..', '...#.', '....#'],
    '>': ['#....', '.#...', '..#..', '...#.', '..#..', '.#...', '#....'],
    '*': ['.....', '#.#.#', '.###.', '#####', '.###.', '#.#.#', '.....'],
    '#': ['.#.#.', '#####', '.#.#.', '#####', '.#.#.', '.....', '.....'],
    '_': ['.....', '.....', '.....', '.....', '.....', '.....', '#####'],
    '|': ['..#..', '..#..', '..#..', '..#..', '..#..', '..#..', '..#..']
  };

  const GW = 5, GH = 7, GAP = 1;
  const cache = {};   // color -> { char: canvas }

  function glyph(ch, color) {
    let byColor = cache[color];
    if (!byColor) byColor = cache[color] = {};
    if (byColor[ch]) return byColor[ch];
    const rows = G[ch] || G['?'];
    const cv = document.createElement('canvas');
    cv.width = GW; cv.height = GH;
    const c = cv.getContext('2d');
    c.fillStyle = color;
    for (let y = 0; y < GH; y++) {
      const r = rows[y];
      for (let x = 0; x < GW; x++) if (r[x] === '#') c.fillRect(x, y, 1, 1);
    }
    byColor[ch] = cv;
    return cv;
  }

  function width(str, scale) {
    scale = scale || 1;
    return str.length * (GW + GAP) * scale - GAP * scale;
  }

  /* opts: { scale, center, right, shadow, alpha } */
  function draw(ctx, str, x, y, color, opts) {
    opts = opts || {};
    const s = opts.scale || 1;
    str = String(str).toUpperCase();
    let px = Math.round(x);
    if (opts.center) px = Math.round(x - width(str, s) / 2);
    else if (opts.right) px = Math.round(x - width(str, s));
    const py = Math.round(y);
    if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;

    if (opts.shadow !== false) {
      let sx = px;
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (ch !== ' ') ctx.drawImage(glyph(ch, opts.shadow || '#150c28'), 0, 0, GW, GH, sx, py + s, GW * s, GH * s);
        sx += (GW + GAP) * s;
      }
    }
    let cx = px;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (ch !== ' ') ctx.drawImage(glyph(ch, color), 0, 0, GW, GH, cx, py, GW * s, GH * s);
      cx += (GW + GAP) * s;
    }
    if (opts.alpha !== undefined) ctx.globalAlpha = 1;
    return px;
  }

  PD.font = { draw, width, GW, GH, GAP, lineHeight: s => (GH + 3) * (s || 1) };
})(window.PD);

/* ===== src/audio.js ===== */
/* Everything you hear is synthesised on the fly with WebAudio -- no asset
   files, and the drill can track its pitch to how hard the rock is. */
(function (PD) {
  'use strict';
  const U = PD.util;

  let ctx = null, master = null, sfxBus = null, musBus = null, noiseBuf = null;
  let ready = false;
  const state = { sfx: true, music: true };

  // for a one-off beep without caring which namespace it lives in

  };

/* Keyboard + mouse. Screen coordinates are converted to the low-res internal

(function (PD) {
  'use strict';

  const keys = {};        // held
  const pressed = {};     // edge-triggered, cleared each frame
  const released = {};

  const mouse = {
    sx: 0, sy: 0,          // css pixels inside the canvas element
    x: 0, y: 0,            // internal canvas pixels (filled by game)
    wx: 0, wy: 0,          // world pixels (filled by game)
    left: false, right: false,
    leftPressed: false, rightPressed: false,
    wheel: 0, inside: false
  };

  const ALIAS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
    Space: 'space', ShiftLeft: 'shift', ShiftRight: 'shift',
    Escape: 'esc', Enter: 'enter'
  };

  function code(e) { return ALIAS[e.code] || e.code; }

  let firstTouch = null;

  function attach(canvas) {
    window.addEventListener('keydown', e => {
      const c = code(e);
      if (!keys[c]) pressed[c] = true;
      keys[c] = true;
      if (['space', 'up', 'down', 'left', 'right', 'Tab', 'shift'].indexOf(c) >= 0) e.preventDefault();
      if (firstTouch) firstTouch();
    });
    window.addEventListener('keyup', e => {
      const c = code(e);
      keys[c] = false;
      released[c] = true;
    });
    window.addEventListener('blur', () => {
      for (const k in keys) keys[k] = false;
      mouse.left = mouse.right = false;
    });

    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      mouse.sx = e.clientX - r.left;
      mouse.sy = e.clientY - r.top;
      mouse.inside = true;
    });
    canvas.addEventListener('mouseleave', () => { mouse.inside = false; });
    canvas.addEventListener('mousedown', e => {
      if (e.button === 0) { mouse.left = true; mouse.leftPressed = true; }
      if (e.button === 2) { mouse.right = true; mouse.rightPressed = true; }
      e.preventDefault();
      if (firstTouch) firstTouch();
    });
    window.addEventListener('mouseup', e => {
      if (e.button === 0) mouse.left = false;
      if (e.button === 2) mouse.right = false;
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { mouse.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
  }

  function onFirstInteraction(fn) { firstTouch = () => { fn(); firstTouch = null; }; }

  function endFrame() {
    for (const k in pressed) pressed[k] = false;
    for (const k in released) released[k] = false;
    mouse.leftPressed = false;
    mouse.rightPressed = false;
    mouse.wheel = 0;
  }

  const down = k => !!keys[k];
  const hit = k => !!pressed[k];
  const pressedSet = k => { pressed[k] = true; };

  PD.input = { keys, mouse, attach, endFrame, down, hit, pressedSet, onFirstInteraction };
})(window.PD);

      }

        const r = Math.max(2, p.size);
        ctx.globalAlpha = t > 0.4 ? 1 : t / 0.4;
        ctx.save();
        ctx.translate(px2, py2);
        ctx.rotate(Math.round((p.rot || 0) / (Math.PI / 8)) * (Math.PI / 8));
