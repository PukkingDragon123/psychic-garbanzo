      for (let t = 0; t < 60; t++) {
        const ang = rnd() * U.TAU, dd = r * (1 - (dmin + rnd() * (dmax - dmin)));
        const cx = Math.round(this.cx + Math.cos(ang) * dd), cy = Math.round(this.cy + Math.sin(ang) * dd);
        if (!this.inBounds(cx, cy) || !this.inside[this.idx(cx, cy)]) continue;
        if (U.dist(cx, cy, this.cx, this.cy) < this.chamberR / TILE + 6) continue;
        return { cx, cy };
      }
      return null;
    };
    const gemsFor = (cx, cy) => {
      const L0 = this.strata[this.stratum[this.idx(cx, cy)]];
      const shiny = L0.ores.filter(o => D.MAT[M[o[0]]].shine);
      return shiny.length ? shiny : [['crystal', 1]];
    };

    for (let n = 0; n < (poi.geode || 0); n++) {
      const at = spot(0.25, 0.85); if (!at) continue;
      const R = 2.5 + rnd() * 3.5;
      const gems = gemsFor(at.cx, at.cy);
      for (let cy = Math.floor(at.cy - R - 2); cy <= at.cy + R + 2; cy++) {
        for (let cx = Math.floor(at.cx - R - 2); cx <= at.cx + R + 2; cx++) {
          if (!this.inBounds(cx, cy)) continue;
          const i = this.idx(cx, cy);
          if (!this.inside[i] || this.cells[i] === M.core) continue;
          const d = U.dist(cx + 0.5, cy + 0.5, at.cx + 0.5, at.cy + 0.5);
          if (d < R) this.cells[i] = 0;
          else if (d < R + 1.6) this.cells[i] = rnd() > 0.45 ? M.crystal : M[pickTableKey(gems, rnd())];
        }
      }
      this.pois.push({ kind: 'geode', cx: at.cx, cy: at.cy });
    }

    for (let n = 0; n < (poi.fossil || 0); n++) {
      const at = spot(0.3, 0.8); if (!at) continue;
      for (let k = 0; k < 9; k++) {
        const cx = at.cx + Math.round((rnd() - 0.5) * 7), cy = at.cy + Math.round((rnd() - 0.5) * 3);
        if (!this.inBounds(cx, cy)) continue;
        const i = this.idx(cx, cy);
        if (this.inside[i] && this.cells[i] && this.cells[i] !== M.core) this.cells[i] = M.fossil;
      }
    }

    for (let n = 0; n < (poi.ruin || 0); n++) {
      const at = spot(0.35, 0.8); if (!at) continue;
      const W = 8 + Math.floor(rnd() * 6), H = 5 + Math.floor(rnd() * 2);
      const x0 = at.cx - (W >> 1), y0 = at.cy - (H >> 1);
      let ok = true;
      for (let cy = y0 - 1; cy <= y0 + H; cy++) for (let cx = x0 - 1; cx <= x0 + W; cx++) {
        if (!this.inBounds(cx, cy) || !this.inside[this.idx(cx, cy)]) ok = false;
      }
      if (!ok) continue;
      for (let cy = y0 - 1; cy <= y0 + H; cy++) {
        for (let cx = x0 - 1; cx <= x0 + W; cx++) {
          const i = this.idx(cx, cy);
          const wall = cy === y0 - 1 || cy === y0 + H || cx === x0 - 1 || cx === x0 + W;
          this.cells[i] = wall ? M.hull : 0;
        }
      }
      // a plinth with the relic on it, and room for the loot
      const px = x0 + (W >> 1);
      this.cells[this.idx(px, y0 + H - 1)] = M.hull;
      this.cells[this.idx(px, y0 + H - 2)] = M.relic;
      // one doorway so it can be found by tunnelling in
      this.cells[this.idx(x0 - 1, y0 + H - 1)] = 0;
      this.cells[this.idx(x0 + W, y0 + H - 1)] = 0;
      this.pois.push({ kind: 'ruin', cx: at.cx, cy: at.cy, x0, y0, w: W, h: H });
    }
    this.totalSolid = 0;
    for (let i = 0; i < this.cells.length; i++) if (this.cells[i]) this.totalSolid++;
  };

  function pickTableKey(table, t) {
    let total = 0;
    for (const e of table) total += e[1];
    let acc = 0;
    for (const e of table) { acc += e[1] / total; if (t <= acc) return e[0]; }
    return table[table.length - 1][0];
  }

  World.prototype.carveCraters = function (r) {
    const rnd = U.mulberry32(this.seed + 17);
    const n = Math.round(4 + r * 0.32);
    for (let i = 0; i < n; i++) {
      const ang = rnd() * U.TAU;
      const rad = 1.6 + rnd() * rnd() * (2.2 + r * 0.11);
      const depth = rad * (0.45 + rnd() * 0.5);
      const ox = this.cx + Math.cos(ang) * (r + rad - depth);
      const oy = this.cy + Math.sin(ang) * (r + rad - depth);
      const c0 = Math.floor(ox - rad - 1), c1 = Math.ceil(ox + rad + 1);
      const r0 = Math.floor(oy - rad - 1), r1 = Math.ceil(oy + rad + 1);
      for (let cy = r0; cy <= r1; cy++) {
        for (let cx = c0; cx <= c1; cx++) {
          if (!this.inBounds(cx, cy)) continue;
          const dx = cx + 0.5 - ox, dy = cy + 0.5 - oy;
          if (dx * dx + dy * dy > rad * rad) continue;
          const i2 = this.idx(cx, cy);
          if (this.cells[i2] === M.core) continue;
          if (this.cells[i2]) this.totalSolid--;
          this.cells[i2] = 0;
          this.inside[i2] = 0;
        }
      }
    }
  };

  /* Dark rock face drawn behind caves so tunnels no longer show stars. */
  World.prototype.buildBackdrop = function () {
    this.bgAtlas = this.strata.map((L0, si) => {
      const variants = [];
      for (let v = 0; v < 4; v++) {
        const cv = document.createElement('canvas');
        cv.width = TILE; cv.height = TILE;
        const c = cv.getContext('2d');
        // the wall behind a cave is lit rock, not a hole: colour it and give it
        // a soft mottle so caverns read as rooms
        c.fillStyle = lift(L0.tint, 1.15, 10);
        c.fillRect(0, 0, TILE, TILE);
        for (let k = 0; k < 4; k++) {
          const h = U.hash2(v * 17 + k, si * 31 + k * 5);
          c.fillStyle = lift(L0.tint, h > 0.5 ? 1.5 : 0.75, h > 0.5 ? 18 : 0);
          c.globalAlpha = 0.5;
          c.beginPath();
          c.arc(h * TILE, U.hash2(k, v + si) * TILE, 1.6 + h * 2.4, 0, Math.PI * 2);
          c.fill();
        }
        c.globalAlpha = 1;
        variants.push(cv);
      }
      return variants;
    });
  };

  /* Stratum under a world point -- for banners, ambience and light colour. */
  World.prototype.stratumAt = function (x, y) {
    const d = U.dist(x, y, this.coreCenter.x, this.coreCenter.y) / (this.radius * TILE);
    if (d > 1.02) return -1;
    return this.stratumFor(U.clamp(1 - d, 0, 1));
  };

  /* Mark everything the lamp can reach as seen, for the minimap. */
  World.prototype.reveal = function (x, y, radius) {
    const c0 = Math.max(0, Math.floor((x - radius) / TILE)), c1 = Math.min(this.w - 1, Math.ceil((x + radius) / TILE));
    const r0 = Math.max(0, Math.floor((y - radius) / TILE)), r1 = Math.min(this.h - 1, Math.ceil((y + radius) / TILE));
    const rr = radius * radius;
    for (let cy = r0; cy <= r1; cy++) {
      for (let cx = c0; cx <= c1; cx++) {
        const dx = cx * TILE + 5 - x, dy = cy * TILE + 5 - y;
        if (dx * dx + dy * dy <= rr) this.seen[cy * this.w + cx] = 1;
      }
    }
  };

  World.prototype.buildStars = function () {
    const rnd = U.mulberry32(this.seed);
    this.stars = [];
    for (let layer = 0; layer < 3; layer++) {
      const n = 90 - layer * 20;
      const arr = [];
      for (let i = 0; i < n; i++) {
        arr.push({
          x: rnd() * 1.4, y: rnd(),
          s: layer === 0 ? 1 : (rnd() > 0.75 ? 2 : 1),
          tw: rnd() * 6.28,
          c: rnd() > 0.86 ? '#ffd9a0' : (rnd() > 0.7 ? '#a9d8ff' : '#ffffff')
        });
      }
      this.stars.push(arr);
    }
    // a couple of distant sibling planets for depth
    this.decor = [];
    for (let i = 0; i < 3; i++) {
      this.decor.push({
        x: rnd(), y: rnd() * 0.55, r: 6 + rnd() * 16,
        c: U.pick(['#3b2a5c', '#2a3a5c', '#5c3a3a', '#2f4a42']),
        p: 0.06 + i * 0.05
      });
    }

    // a big cratered companion moon hanging over the dig site
    const size = 96 + Math.round(rnd() * 80);
    this.moon = {
      cv: PD.arthome.buildMoon(size, this.body.tint, this.seed * 3 + 11),
      x: 0.12 + rnd() * 0.5, y: 0.05 + rnd() * 0.2, p: 0.035
    };
    // and a soft nebula wash behind everything
    this.nebula = buildNebula(this.body.sky, this.body.tint, this.seed);
  };

  /* Low-res coloured clouds, blown up with smoothing off for a chunky wash. */
  function buildNebula(sky, tint, seed) {
    const w = 60, h = 34;
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const img = c.createImageData(w, h);
    const tr = parseInt(tint.slice(1, 3), 16), tg = parseInt(tint.slice(3, 5), 16), tb = parseInt(tint.slice(5, 7), 16);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const n = U.fbm(x * 0.09 + seed, y * 0.13 - seed, 3);
        const a = U.clamp((n - 0.5) * 2.6, 0, 1);
        const i = (y * w + x) * 4;
        img.data[i] = tr * 0.55 + 40;
        img.data[i + 1] = tg * 0.5 + 26;
        img.data[i + 2] = tb * 0.7 + 70;
        img.data[i + 3] = a * 70;
      }
    }
    c.putImageData(img, 0, 0);
    return cv;
  }

  /* ------------------------------------------------------------- queries */
  World.prototype.solidAt = function (x, y) {
    const cx = Math.floor(x / TILE), cy = Math.floor(y / TILE);
    if (!this.inBounds(cx, cy)) return false;
    return this.cells[cy * this.w + cx] !== 0;
  };

  World.prototype.matAt = function (x, y) {
    const cx = Math.floor(x / TILE), cy = Math.floor(y / TILE);
    if (!this.inBounds(cx, cy)) return 0;
    return this.cells[cy * this.w + cx];
  };

  World.prototype.rectSolid = function (x, y, w, h) {
    const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.001) / TILE);
    const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 0.001) / TILE);
    for (let cy = y0; cy <= y1; cy++) {
      for (let cx = x0; cx <= x1; cx++) {
        if (!this.inBounds(cx, cy)) continue;
        if (this.cells[cy * this.w + cx]) return true;
      }
    }
    return false;
  };

  /* Gravity fades in as you approach the rock -- pure float in open space. */
  World.prototype.gravityAt = function (y) {
    const top = this.bodyTopPx;
    return this.body.gravity * U.smoothstep(top - 90, top + 40, y);
  };

  World.prototype.depthMeters = function (y) {
    return Math.max(0, Math.round((y - this.bodyTopPx) / TILE));
  };

  World.prototype.maxDepthMeters = function () {
    return Math.round((this.radius * 2) * 1);
  };

  /* --------------------------------------------------------------- drilling */
  World.prototype.tileHp = function (mat, cx, cy) {
    let h = D.MAT[mat].hp * this.hardness;
    if (cx !== undefined) {
      const si = this.stratum[this.idx(cx, cy)];
      h *= 1 + si * 0.22;           // every band down is tougher rock
    }
    return h;
  };

  /* Returns the material id if the tile broke this call, else 0. */
  World.prototype.damage = function (cx, cy, amount) {
    if (!this.inBounds(cx, cy)) return 0;
    const i = cy * this.w + cx;
    const mat = this.cells[i];
    if (!mat) return 0;
    if (mat === M.core) {
      this.coreHp = Math.max(0, this.coreHp - amount);
      this.dmg[i] += amount;
      return this.coreHp <= 0 ? M.core : 0;
    }
    this.dmg[i] += amount;
    if (this.dmg[i] >= this.tileHp(mat, cx, cy)) {
      const mm = D.MAT[mat];
      this.dmg[i] = 0;
      if (mm.drop) {                 // magma quenches into basalt; nothing to collect
        this.cells[i] = mm.drop;
        return -mat;
      }
      this.cells[i] = 0;
      this.mined++;
      return mat;
    }
    return 0;
  };

  /* Hazard damage per second for a world rect (magma, mostly). */
  World.prototype.hazardIn = function (x, y, w, h) {
    const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w) / TILE);
    const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h) / TILE);
    let worst = 0;
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
      const m = this.at(cx, cy);
      if (m && D.MAT[m].hazard) worst = Math.max(worst, D.MAT[m].hazard);
    }
    return worst;
  };

  World.prototype.crackFrac = function (cx, cy) {
    const i = this.idx(cx, cy);
    const mat = this.cells[i];
    if (!mat) return 0;
    if (mat === M.core) return 1 - this.coreHp / this.coreMax;
    return U.clamp(this.dmg[i] / this.tileHp(mat, cx, cy), 0, 1);
  };

  World.prototype.clear = function (cx, cy) {
    if (!this.inBounds(cx, cy)) return 0;
    const i = cy * this.w + cx;
    const m = this.cells[i];
    this.cells[i] = 0; this.dmg[i] = 0;
    return m;
  };

  /* True when a tile has nothing beneath or beside it -- a cave-in candidate. */
  World.prototype.unsupported = function (cx, cy) {
    if (!this.at(cx, cy)) return false;
    if (this.at(cx, cy + 1)) return false;
    let side = 0;
    if (this.at(cx - 1, cy)) side++;
    if (this.at(cx + 1, cy)) side++;
    return side < 2;
  };

  /* Rip a hole and hand back what came out (used by explosions). */
  World.prototype.removeDisc = function (px, py, r) {
    const out = [];
    const c0 = Math.floor((px - r) / TILE), c1 = Math.floor((px + r) / TILE);
    const r0 = Math.floor((py - r) / TILE), r1 = Math.floor((py + r) / TILE);
    for (let cy = r0; cy <= r1; cy++) {
      for (let cx = c0; cx <= c1; cx++) {
        if (!this.inBounds(cx, cy)) continue;
        const tx = cx * TILE + TILE / 2, ty = cy * TILE + TILE / 2;
        if (U.dist2(px, py, tx, ty) > r * r) continue;
        const m = this.cells[cy * this.w + cx];
        if (!m || m === M.core) continue;
        this.cells[cy * this.w + cx] = 0;
        this.dmg[cy * this.w + cx] = 0;
        out.push({ cx, cy, mat: m, x: tx, y: ty });
      }
    }
    return out;
  };

  /* Snapshot a patch of tiles as a little canvas -- flying debris art. */
  World.prototype.grabChunk = function (cx, cy, size) {
    const cv = document.createElement('canvas');
    cv.width = size * TILE; cv.height = size * TILE;
    const c = cv.getContext('2d');
    let any = false;
    for (let j = 0; j < size; j++) {
      for (let i = 0; i < size; i++) {
        const m = this.at(cx + i, cy + j);
        if (!m) continue;
        any = true;
        const v = (U.hash2(cx + i, cy + j) * 4) | 0;
        c.drawImage(matShape(m, 15, v), i * TILE, j * TILE, TILE, TILE);
      }
    }
    if (!any) return null;
    // round the corners a touch so chunks read as broken rock, not squares
    c.globalCompositeOperation = 'destination-out';
    c.fillStyle = '#000';
    const k = Math.max(1, (size * TILE) / 5);
    c.fillRect(0, 0, k, k); c.fillRect(cv.width - k, 0, k, k);
    c.fillRect(0, cv.height - k, k, k); c.fillRect(cv.width - k, cv.height - k, k, k);
    return cv;
  };

  /* ---------------------------------------------------------------- drawing */
  World.prototype.drawSky = function (ctx, cam, vw, vh, time, hideMoon, skipBase) {
    const b = this.body;
    if (skipBase) { this.drawMoon(ctx, cam, vw, vh); return; }
    const g = ctx.createLinearGradient(0, 0, 0, vh);
    g.addColorStop(0, b.sky);
    g.addColorStop(1, '#05030f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, vw, vh);

    if (this.nebula) {
      ctx.globalAlpha = 0.85;
      ctx.drawImage(this.nebula, -((cam.x * 0.02) % vw) - 4, -((cam.y * 0.015) % vh) - 4, vw + 8, vh + 8);
      ctx.globalAlpha = 1;
    }

    for (let l = 0; l < this.stars.length; l++) {
      const par = 0.04 + l * 0.05;
      const arr = this.stars[l];
      for (const st of arr) {
        const x = ((st.x * vw * 1.4 - cam.x * par) % (vw * 1.4) + vw * 1.4) % (vw * 1.4);
        const y = ((st.y * vh * 1.6 - cam.y * par * 0.7) % (vh * 1.6) + vh * 1.6) % (vh * 1.6);
        if (x > vw || y > vh) continue;
        const tw = 0.55 + 0.45 * Math.sin(time * 2 + st.tw);
        ctx.globalAlpha = tw * (0.35 + l * 0.22);
        ctx.fillStyle = st.c;
        ctx.fillRect(x | 0, y | 0, st.s, st.s);
      }
    }
    ctx.globalAlpha = 1;

    for (const d of this.decor) {
      const x = d.x * vw * 1.2 - cam.x * d.p;
      const y = d.y * vh - cam.y * d.p * 0.6;
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = d.c;
      ctx.beginPath(); ctx.arc(x | 0, y | 0, d.r, 0, U.TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }

    if (!hideMoon) this.drawMoon(ctx, cam, vw, vh);
  };

  World.prototype.drawMoon = function (ctx, cam, vw, vh) {
    if (this.moon) {
      const m = this.moon;
      const x = m.x * vw - cam.x * m.p;
      const y = m.y * vh - cam.y * m.p * 0.8;
      ctx.globalAlpha = 0.34;                       // halo
      const hg = ctx.createRadialGradient(x + m.cv.width / 2, y + m.cv.height / 2, m.cv.width * 0.4,
        x + m.cv.width / 2, y + m.cv.height / 2, m.cv.width * 0.85);
      hg.addColorStop(0, this.body.tint);
      hg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = hg;
      ctx.fillRect(x - m.cv.width * 0.4, y - m.cv.height * 0.4, m.cv.width * 1.8, m.cv.height * 1.8);
      ctx.globalAlpha = 0.95;
      ctx.drawImage(m.cv, x | 0, y | 0);
      ctx.globalAlpha = 1;
    }
  };

  World.prototype.drawCoreGlow = function (ctx, cam, time) {
    if (this.coreHp <= 0) return;
    const x = this.coreCenter.x - cam.x, y = this.coreCenter.y - cam.y;
    const frac = this.coreHp / this.coreMax;
    const r = this.coreR * (2.6 + 0.5 * Math.sin(time * 3)) * (1 + (1 - frac) * 0.5);
    const grd = ctx.createRadialGradient(x, y, this.coreR * 0.4, x, y, r);
    grd.addColorStop(0, 'rgba(255,220,150,0.55)');
    grd.addColorStop(0.5, 'rgba(255,130,60,0.22)');
    grd.addColorStop(1, 'rgba(255,90,40,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  };

  World.prototype.draw = function (ctx, cam, vw, vh, time) {
    this.drawCoreGlow(ctx, cam, time);
    const c0 = Math.max(0, Math.floor(cam.x / TILE));
    const c1 = Math.min(this.w - 1, Math.ceil((cam.x + vw) / TILE));
    const r0 = Math.max(0, Math.floor(cam.y / TILE));
    const r1 = Math.min(this.h - 1, Math.ceil((cam.y + vh) / TILE));

    this.glows = this.glows || [];
    this.glows.length = 0;

    for (let cy = r0; cy <= r1; cy++) {
      for (let cx = c0; cx <= c1; cx++) {
        const i = cy * this.w + cx;
        const m = this.cells[i];
        const sx = cx * TILE - cam.x | 0;
        const sy = cy * TILE - cam.y | 0;
        if (!m) {
          // a cave shows the rock face behind it, not the stars
          if (this.inside[i]) {
            const v = (U.hash2(cx * 3, cy * 7) * 4) | 0;
            ctx.drawImage(this.bgAtlas[this.stratum[i]][v], sx, sy);
          }
          continue;
        }

        if (m === PD.data.M.core) { this.drawCoreTile(ctx, sx, sy, cx, cy, time); continue; }
        if (m === PD.data.M.lava) { this.drawLavaTile(ctx, sx, sy, cx, cy, time); this.glows.push(sx + 5, sy + 5, 26, 0); continue; }
        if (D.MAT[m].glow && this.glows.length < 200) this.glows.push(sx + 5, sy + 5, D.MAT[m].glowR || 16, m);

        const up = cy > 0 ? this.cells[i - this.w] : 1;
        const dn = cy < this.h - 1 ? this.cells[i + this.w] : 1;
        const lf = cx > 0 ? this.cells[i - 1] : 1;
        const rt = cx < this.w - 1 ? this.cells[i + 1] : 1;
        const mask = (up ? 1 : 0) | (rt ? 2 : 0) | (dn ? 4 : 0) | (lf ? 8 : 0);
        const v = (U.hash2(cx, cy) * 4) | 0;
        const mm2 = D.MAT[m];

        // 1. the band's own rock, so cut corners never show through to space
        ctx.drawImage(baseShape(this.strata[this.stratum[i]].tint, mask, v), sx, sy, TILE, TILE);
        // 2. this material as a blob against its own kind
        const mmask = (up === m ? 1 : 0) | (rt === m ? 2 : 0) | (dn === m ? 4 : 0) | (lf === m ? 8 : 0);
        ctx.drawImage(matShape(m, mmask, v), sx, sy, TILE, TILE);
        // 3. light and rim, only where the tile faces open space
        if (mask !== 15) ctx.drawImage(lightShape(mask, v), sx, sy, TILE, TILE);

        // rolling soil lip along any open surface: the ground line waves
        if (!up) {
          const hL = (U.hash2(cx, cy * 3) - 0.5) * 3.4;
          const hR = (U.hash2(cx + 1, cy * 3) - 0.5) * 3.4;
          const hM = (U.hash2(cx * 2 + 7, cy) - 0.5) * 5;
          ctx.fillStyle = mm2.c[0];
          ctx.beginPath();
          ctx.moveTo(sx, sy + hL);
          ctx.quadraticCurveTo(sx + TILE / 2, sy + hM - 1, sx + TILE, sy + hR);

    const hardness = U.clamp(D.MAT[bite.mat].hp / 255, 0, 1);
    this.drillPitch = 1 - hardness;
    A.drill(true, this.drillPitch);

    if (broke) g.onTileBroken(bite.cx, bite.cy, broke, true);

      const b2 = w.damage(bite.cx + px * k, bite.cy + py * k, falloff);
      if (b2) g.onTileBroken(bite.cx + px * k, bite.cy + py * k, b2, true);
      const b3 = w.damage(bite.cx - px * k, bite.cy - py * k, falloff);

    if (hz && !this.docked) {

  /* ---------------------------------------------------------------- minimap
     Fog of war: only what the lamp has touched is drawn. Scanner pings paint
     ore you have not reached yet. */
  let mmCv = null, mmCtx = null, mmDirty = 0;
  function minimap(ctx, g) {
    const w = g.world;
    const MW = 92, MH = 92;
    const x0 = VW - MW - 8, y0 = 58;
    const sc = Math.min(MW / w.w, MH / w.h);
    const ox = x0 + (MW - w.w * sc) / 2, oy = y0 + (MH - w.h * sc) / 2;

    if (!mmCv) { mmCv = document.createElement('canvas'); mmCtx = mmCv.getContext('2d'); }
    if (mmCv.width !== w.w || mmCv.height !== w.h) { mmCv.width = w.w; mmCv.height = w.h; mmDirty = 0; }
    // rebuild the fog texture a few times a second, not every frame
    mmDirty -= 1;
    if (mmDirty <= 0) {
      mmDirty = 8;
      const img = mmCtx.createImageData(w.w, w.h);
      for (let i = 0; i < w.cells.length; i++) {
        if (!w.seen[i]) continue;
        const m = w.cells[i];
        const k = i * 4;
        if (!m) { if (w.inside[i]) { img.data[k] = 24; img.data[k + 1] = 18; img.data[k + 2] = 40; img.data[k + 3] = 255; } continue; }
        const c = D.MAT[m].c[1];
        img.data[k] = parseInt(c.slice(1, 3), 16); img.data[k + 1] = parseInt(c.slice(3, 5), 16); img.data[k + 2] = parseInt(c.slice(5, 7), 16);
        img.data[k + 3] = 255;
      }
      mmCtx.putImageData(img, 0, 0);
    }

    ctx.fillStyle = 'rgba(8,4,18,0.75)';
    ctx.fillRect(x0 - 2, y0 - 2, MW + 4, MH + 4);
    ctx.strokeStyle = COL.line; ctx.strokeRect(x0 - 1.5, y0 - 1.5, MW + 3, MH + 3);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(mmCv, 0, 0, w.w, w.h, ox, oy, w.w * sc, w.h * sc);

    // scanner pings
    for (const pg of g.pings) {
      ctx.globalAlpha = U.clamp(pg.life / 3, 0, 1) * (0.6 + 0.4 * Math.sin(g.time * 6 + pg.cx));
      ctx.fillStyle = D.MAT[pg.mat].c[0];
      ctx.fillRect(ox + pg.cx * sc - 1, oy + pg.cy * sc - 1, Math.max(2, sc * 2), Math.max(2, sc * 2));
    }
    ctx.globalAlpha = 1;
    // core, ship, you
    if (w.coreHp > 0) { ctx.fillStyle = '#ff8a3d'; ctx.fillRect(ox + w.cx * sc - 1, oy + w.cy * sc - 1, 3, 3); }
    ctx.fillStyle = '#7ef9ff'; ctx.fillRect(ox + g.ship.x / 10 * sc - 2, oy + g.ship.y / 10 * sc - 1, 4, 2);
    const px = ox + g.player.x / 10 * sc, py = oy + g.player.y / 10 * sc;
    ctx.fillStyle = Math.sin(g.time * 10) > 0 ? '#ffffff' : '#ff5fa8';
    ctx.fillRect(px - 1, py - 1, 3, 3);
    PD.glyph.draw(ctx, 'scan', x0 + MW / 2 - 7, y0 + MH + 3, COL.dim, COL.line);
  }

  const TABS = ['UPGRADES', 'STAR MAP', 'OPTIONS'];

  function shop(ctx, g) {

  function shopUpgrades(ctx, g) {
    const list = D.UPGRADES;
    for (let i = 0; i < list.length; i++) {
      const u = list[i];
      const col = i % 3, row = (i / 3) | 0;
      const x = 22 + col * 146, y = 44 + row * 45;
      const lvl = g.save.upg[u.id] || 0;
      const maxed = lvl >= u.max;
      const cost = D.upgradeCost(u, lvl);
      const afford = g.save.credits >= cost;

      const m = PD.input.mouse;
      const hot = m.inside && m.x >= x && m.x < x + 138 && m.y >= y && m.y < y + 41;

      ctx.fillStyle = hot ? '#2c1e52' : '#241844';
      ctx.fillRect(x, y, 138, 41);
      ctx.strokeStyle = maxed ? COL.gold : (hot ? COL.lineHi : COL.line);
      ctx.strokeRect(x + 0.5, y + 0.5, 137, 40);

      icon(ctx, u.icon, x + 3, y + 3);
      F.draw(ctx, u.name, x + 22, y + 4, maxed ? COL.gold : COL.text);
      F.draw(ctx, u.show(lvl), x + 4, y + 16, COL.dim);

      // level pips
      const pips = Math.min(u.max, 12);
      const step = u.max > 12 ? u.max / 12 : 1;
      for (let k = 0; k < pips; k++) {
        const on = lvl >= Math.ceil((k + 1) * step);
        ctx.fillStyle = on ? (maxed ? COL.gold : COL.lineHi) : '#3a2a5e';
        ctx.fillRect(x + 4 + k * 5, y + 30, 4, 4);
      }
      F.draw(ctx, 'LV' + lvl, x + 134, y + 4, maxed ? COL.gold : COL.dim, { right: true });

      if (maxed) {
        F.draw(ctx, 'MAXED', x + 108, y + 26, COL.gold, { center: true });
      } else if (button(ctx, x + 82, y + 22, 52, 15, '$' + U.fmt(cost), { enabled: afford, accent: afford ? '#3f6ea8' : undefined, id: 'buy' + u.id })) {
        g.buy(u.id);
      }
      if (hot) g.shopTip = u.blurb;
    }
    if (g.shopTip) F.draw(ctx, g.shopTip, VW / 2, VH - 44, COL.dim, { center: true });
  }

  function starMap(ctx, g) {
    F.draw(ctx, 'SELECT A WORLD TO RUIN', VW / 2, 44, COL.text, { center: true });
    const rows = D.BODIES.length;
    const top = 56, rh = 16;
    for (let i = 0; i < rows; i++) {
      const b = D.BODIES[i];
      const y = top + i * rh;
      const unlocked = i <= g.save.unlocked;
      const done = g.save.destroyed[i];
      const here = i === g.bodyIndex;

      const m = PD.input.mouse;
      const hot = unlocked && m.inside && m.x >= 22 && m.x < VW - 22 && m.y >= y && m.y < y + rh - 2;
      ctx.fillStyle = here ? '#33235e' : (hot ? '#2c1e52' : '#221740');
      ctx.fillRect(22, y, VW - 44, rh - 2);
      ctx.strokeStyle = here ? COL.lineHi : '#3a2a5e';
      ctx.strokeRect(22.5, y + 0.5, VW - 45, rh - 3);

      // little planet dot
      ctx.fillStyle = unlocked ? b.tint : '#3a3050';
      ctx.beginPath(); ctx.arc(32, y + 7, 4, 0, U.TAU); ctx.fill();
      if (done) { ctx.fillStyle = '#0d0720'; ctx.fillRect(29, y + 6, 6, 2); }

      const label = unlocked ? b.name : '?????? ??????';
      F.draw(ctx, label, 42, y + 4, unlocked ? (done ? COL.dim : COL.text) : '#4d4070');
      F.draw(ctx, unlocked ? b.kind : 'LOCKED', 178, y + 4, COL.dim);
      F.draw(ctx, unlocked ? 'GRAV ' + b.gravity : '', 250, y + 4, COL.dim);
      F.draw(ctx, done ? 'DESTROYED' : (unlocked ? 'BOUNTY $' + U.fmt(b.reward) : ''), 310, y + 4,
        done ? COL.good : COL.gold);

      if (unlocked && !here && button(ctx, VW - 74, y + 1, 48, rh - 4, 'FLY', { id: 'fly' + i })) {
        g.travelTo(i);
      }
      if (here) F.draw(ctx, 'HERE', VW - 50, y + 4, COL.lineHi, { center: true });
    }
    const nxt = g.save.unlocked + 1;

      F.draw(ctx, 'CRACK THIS WORLD OPEN TO UNLOCK THE NEXT', VW / 2, VH - 44, COL.dim, { center: true });

  /* ------------------------------------------------------------------ title */
  /* A little mascot diorama: our alien caught mid-crime on a cracking world. */
  function titleArt(ctx, t) {
    const px = 386, py = 246, r = 58;

    // the doomed planet
    ctx.fillStyle = '#2b1c4a';
    ctx.beginPath(); ctx.arc(px, py, r + 3, 0, U.TAU); ctx.fill();
    ctx.fillStyle = '#4f7d6a';
    ctx.beginPath(); ctx.arc(px, py, r, 0, U.TAU); ctx.fill();
    ctx.fillStyle = '#3a5f55';
    ctx.beginPath(); ctx.arc(px + 10, py + 12, r - 8, 0, U.TAU); ctx.fill();
    ctx.fillStyle = '#6a9a80';
    [[-26, -18, 9], [12, -30, 6], [-8, 6, 5], [26, -6, 7]].forEach(c => {
      ctx.beginPath(); ctx.arc(px + c[0], py + c[1], c[2], 0, U.TAU); ctx.fill();
    });

    // glowing fissures, breathing in time with the drill
    const glow = 0.7 + 0.3 * Math.sin(t * 4);
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(200,50,10,' + (glow * 0.8).toFixed(2) + ')';
    const cracks = [
      [[-6, -56], [-2, -34], [-14, -18], [-4, 0]],
      [[-4, -34], [14, -26], [22, -8]],
      [[-14, -18], [-32, -12], [-44, -20]]
    ];
    for (const line of cracks) {
      ctx.beginPath();
      ctx.moveTo(px + line[0][0], py + line[0][1]);
      for (let i = 1; i < line.length; i++) ctx.lineTo(px + line[i][0], py + line[i][1]);
      ctx.stroke();
    }
    // hot inner line on top of the dark fissure
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,190,80,' + glow.toFixed(2) + ')';
    for (const line of cracks) {
      ctx.beginPath();
      ctx.moveTo(px + line[0][0], py + line[0][1]);
      for (let i = 1; i < line.length; i++) ctx.lineTo(px + line[i][0], py + line[i][1]);
      ctx.stroke();
    }
    const hg = ctx.createRadialGradient(px - 6, py - 56, 1, px - 6, py - 56, 22);
    hg.addColorStop(0, 'rgba(255,240,190,' + glow.toFixed(2) + ')');
    hg.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(px - 28, py - 78, 56, 56);

    // sparks off the bit
    for (let i = 0; i < 9; i++) {
      const a = -1.9 + (i * 0.21) + Math.sin(t * 3 + i) * 0.1;
      const d = 8 + ((i * 7 + Math.floor(t * 30)) % 22);
      ctx.fillStyle = i % 3 ? '#ffd34d' : '#fff6c8';
      ctx.fillRect(px - 6 + Math.cos(a) * d | 0, py - 58 + Math.sin(a) * d | 0, 2, 2);
    }

    // the culprit
    const bob = Math.sin(t * 2.2) * 3;
    const al = PD.art.sprites.alien, dr = PD.art.sprites.drill;
    const ax = px - 34, ay = py - 96 + bob;
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(0.85);
    ctx.drawImage(dr.frames[Math.floor(t * 12) % dr.frames.length], 0, 0,
      dr.w, dr.h, -dr.ox * 2, -dr.oy * 2, dr.w * 2, dr.h * 2);
    ctx.restore();
    ctx.drawImage(al.frames[0], 0, 0, al.w, al.h,
      ax - al.ox * 2 | 0, ay - al.oy * 2 | 0, al.w * 2, al.h * 2);
  }

      F.draw(ctx, '$' + U.fmt(g.save.credits) + '   GALAXY ' + g.save.dominion.toFixed(1) + '%', cx, 194, COL.gold, { center: true });
    }
    const legend = [['hand', 'FLY'], ['hand', 'DRILL'], ['gun', 'SHOOT'], ['hole', 'HOME']];
    for (let i = 0; i < legend.length; i++) {
      PD.glyph.draw(ctx, legend[i][0], 14 + i * 80, 240, COL.gold, '#b8860b');
      F.draw(ctx, legend[i][1], 30 + i * 80, 244, COL.text);
    }
    F.draw(ctx, 'HOLD MOUSE / TOUCH TO FLY     E DOCK     Q SWAP     TAB SCAN', VW / 2, 258, COL.dim, { center: true });
    return { start, wipe };
  }

  /* ------------------------------------------------------------------ pause */
  function pause(ctx, g) {
    ctx.fillStyle = 'rgba(8,4,18,0.7)';
    ctx.fillRect(0, 0, VW, VH);
    const m = PD.input.mouse;
    const keys = [
      { g: 'play', x: VW / 2 - 78, col: '#2f7a4a', id: 'resume' },
      { g: A.state.sfx ? 'check' : 'cross', x: VW / 2 - 26, col: '#3f6ea8', id: 'sfx' },
      { g: 'star', x: VW / 2 + 26, col: A.state.music ? '#6b3fb5' : '#2a1c4a', id: 'music' },
      { g: 'home', x: VW / 2 + 78, col: '#8a2f4a', id: 'ship' }
    ];
    const r = { resume: false, ship: false };
    for (const k of keys) {
      const hot = m.inside && U.dist(m.x, m.y, k.x, VH / 2) < 20;
      PD.glyph.hex(ctx, k.x, VH / 2, 20 + (hot ? 2 : 0), k.col, hot ? '#ffffff' : COL.lineHi, 1.5);
      if (k.g === 'play') { ctx.save(); ctx.translate(k.x + 2, VH / 2); ctx.rotate(-Math.PI / 2); PD.glyph.draw(ctx, 'play', -7, -7, '#ffffff', k.col); ctx.restore(); }
      else PD.glyph.draw(ctx, k.g, k.x - 7, VH / 2 - 7, '#ffffff', k.col);
      if (hot && m.leftPressed) {
        A.sfx.click();
        if (k.id === 'resume') r.resume = true;
        if (k.id === 'sfx') A.toggleSfx(!A.state.sfx);
        if (k.id === 'music') A.toggleMusic(!A.state.music);
        if (k.id === 'ship') r.ship = true;
      }
    }
    return r;
  }

  /* -------------------------------------------------------- destroyed banner */
  function victory(ctx, g) {
    const v = g.victory;
    if (!v) return null;
    const t = v.t;
    const slide = U.smoothstep(0, 0.5, t);
    const y = U.lerp(-60, 40, slide);

    ctx.fillStyle = 'rgba(8,4,18,' + (0.8 * slide).toFixed(2) + ')';
    ctx.fillRect(0, 0, VW, VH);

    F.draw(ctx, 'WORLD', VW / 2, y, '#ffd34d', { center: true, scale: 4, shadow: '#7a2a10' });
    F.draw(ctx, 'DESTROYED', VW / 2, y + 34, '#ff5a4d', { center: true, scale: 5, shadow: '#3a0c30' });

    if (t > 0.7) {
      const a = U.clamp((t - 0.7) / 0.4, 0, 1);
      ctx.globalAlpha = a;
      panel(ctx, VW / 2 - 100, 122, 200, 78);
      PD.glyph.stat(ctx, 'star', U.fmt(v.reward), VW / 2 - 40, 130, COL.gold, '#b8860b', COL.gold);
      PD.glyph.stat(ctx, 'galaxy', '+' + v.dominion.toFixed(1) + '%', VW / 2 - 40, 146, COL.good, '#3fb85a', COL.good);
      PD.glyph.stat(ctx, 'coin', '+' + v.bonus + '%', VW / 2 - 40, 162, COL.lineHi, '#3a2a5e', COL.lineHi);
      if (v.unlocked) { PD.glyph.draw(ctx, 'planet', VW / 2 - 16, 178, COL.gold, '#b8860b'); PD.glyph.draw(ctx, 'check', VW / 2 + 2, 178, COL.good, '#3fb85a'); }
      ctx.globalAlpha = 1;
      if (t > 1.0) {
        return { ok: button(ctx, VW / 2 - 20, 206, 40, 18, '', { accent: '#2f7a4a' }) && true, _g: PD.glyph.draw(ctx, 'home', VW / 2 - 7, 208, '#ffffff', '#8affa0') };
      }
    }
    return null;
  }

  /* ------------------------------------------------------------------- ending */
  function ending(ctx, g, t) {
    ctx.fillStyle = 'rgba(8,4,18,0.82)';
    ctx.fillRect(0, 0, VW, VH);
    F.draw(ctx, 'GALAXY', VW / 2, 40, '#ffd34d', { center: true, scale: 5, shadow: '#7a2a10' });
    F.draw(ctx, 'CONQUERED', VW / 2, 80, '#8affa0', { center: true, scale: 5, shadow: '#0d4a20' });
    F.draw(ctx, 'EVERY WORLD ON THE MAP IS RUBBLE.', VW / 2, 124, COL.text, { center: true });
    F.draw(ctx, 'YOU ARE OBSCENELY, HORRIBLY RICH.', VW / 2, 138, COL.text, { center: true });
    F.draw(ctx, 'TOTAL EARNED $' + U.fmt(g.save.totalEarned), VW / 2, 158, COL.gold, { center: true, scale: 2 });
    F.draw(ctx, 'THE SANDBOX STAYS OPEN - WORLDS REGROW.', VW / 2, 184, COL.dim, { center: true });
    return button(ctx, VW / 2 - 60, 204, 120, 16, 'KEEP DRILLING', { accent: '#2f7a4a' });
  }

  PD.ui = {
    VW, VH, COL, panel, bar, button, icon, hud, homeBar, shop, title, pause, victory,
    sellSplash, ending, endFrame
  };
})(window.PD);

/* ===== src/starmap.js ===== */
/* The chart. Two views: the galaxy (four sectors, each one past the first
   locked behind a drive you buy outright) and a solar system (the worlds in
   one sector, orbiting their star, ready to be dropped on to). */
(function (PD) {
  'use strict';
  const U = PD.util;
  const F = PD.font;
  const D = PD.data;
  const A = PD.audio;
  const G = PD.galaxy;
  const VW = 480, VH = 270;

  const S = {
    view: 'galaxy',       // 'galaxy' | 'system'
    zone: 0,              // zone being looked at in system view
    selZone: 0,
    selBody: 0,
    t: 0,
    zoom: 0,              // 0..1 transition into the system view
    msg: '', msgT: 0
  };

  const suns = {};
  const planets = {};
  function sun(zi) {
    if (!suns[zi]) suns[zi] = G.buildSun(16, D.ZONES[zi].star);
    return suns[zi];
  }
  function planetArt(i, size) {
    const k = i + ':' + size;
    if (!planets[k]) planets[k] = G.buildPlanet(size, D.BODIES[i].tint, 1000 + i * 977, i % 3 === 2);
    return planets[k];
  }

  function zoneOpen(g, zi) { return g.zoneOpen(zi); }
  function bodyOpen(g, i) { return i <= g.save.unlocked && zoneOpen(g, D.zoneOf(i)); }

  function enter(g) {
    S.view = 'galaxy';
    S.t = 0; S.zoom = 0;
    S.selZone = D.zoneOf(Math.min(g.save.unlocked, D.BODIES.length - 1));
    S.selBody = Math.min(g.save.unlocked, D.BODIES.length - 1);
    A.sfx.click();
  }

  function say(m) { S.msg = m; S.msgT = 2.6; }

  function openZone(g, zi) {
    if (!zoneOpen(g, zi)) {
      say('THE OBSERVATORY NEEDS LEVEL ' + (zi + 1) + ' TO SEE THAT FAR.');
      A.sfx.deny();
      return;
    }
    S.view = 'system';
    S.zone = zi;
    S.zoom = 0;
    const list = D.ZONES[zi].bodies;
    S.selBody = list.indexOf(g.save.unlocked) >= 0 ? g.save.unlocked : list[0];
    A.sfx.click();
  }

  /* ---------------------------------------------------------------- update */
  function update(dt, g) {
    const IN = PD.input;
    S.t += dt;
    S.msgT = Math.max(0, S.msgT - dt);
    S.zoom = Math.min(1, S.zoom + dt * 3.4);
    const click = IN.mouse.leftPressed;
    const mx = IN.mouse.x, my = IN.mouse.y;

    if (IN.hit('esc')) {
      if (S.view === 'system') { S.view = 'galaxy'; S.zoom = 0; A.sfx.click(); }
      else { g.state = 'home'; PD.home.P.lock = 0.25; A.sfx.click(); }
      return;
    }

    if (S.view === 'galaxy') {
      if (IN.hit('left')) S.selZone = U.clamp(S.selZone - 1, 0, D.ZONES.length - 1);
      if (IN.hit('right')) S.selZone = U.clamp(S.selZone + 1, 0, D.ZONES.length - 1);
      for (let i = 0; i < D.ZONES.length; i++) {
        const z = D.ZONES[i];
        if (Math.abs(mx - z.x) < 30 && Math.abs(my - z.y) < 30) {
          S.selZone = i;
          if (click) openZone(g, i);
        }
      }
      if (IN.hit('KeyE') || IN.hit('space')) openZone(g, S.selZone);
      // the whole bottom panel is a button on touch
      if (click && my > VH - 44) openZone(g, S.selZone);
      return;
    }

    // ---- system view
    const list = D.ZONES[S.zone].bodies;
    const at = list.indexOf(S.selBody);
    if (IN.hit('left')) S.selBody = list[U.clamp(at - 1, 0, list.length - 1)];
    if (IN.hit('right')) S.selBody = list[U.clamp(at + 1, 0, list.length - 1)];
    for (let k = 0; k < list.length; k++) {
      const p = bodyPos(k, list.length);
      if (Math.hypot(mx - p.x, my - p.y) < 26) {
        S.selBody = list[k];
        if (click) drop(g, list[k]);
      }
    }
    if (IN.hit('KeyE') || IN.hit('space')) drop(g, S.selBody);
    if (click && my > VH - 40 && mx > VW - 130) drop(g, S.selBody);
  }

  function drop(g, i) {
    if (i > g.save.unlocked) { say('DESTROY ' + D.BODIES[g.save.unlocked].name.toUpperCase() + ' FIRST.'); A.sfx.deny(); return; }
    if (!zoneOpen(g, D.zoneOf(i))) { A.sfx.deny(); return; }
    A.sfx.warp();
    g.dive(i);
  }

  function bodyPos(k, n) {
    const spread = Math.min(120, 330 / Math.max(1, n));
    const x = 150 + k * spread;
    const y = 132 + Math.sin(k * 1.1 + 0.6) * 26;
    return { x, y };
  }

  /* ------------------------------------------------------------------ draw */
  function ring(ctx, x, y, r, col, alpha, dash) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    if (dash) ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * 0.34, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function panel(ctx, x, y, w, h, col) {
    ctx.fillStyle = 'rgba(6,4,18,0.88)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.fillStyle = col;
    ctx.fillRect(x, y, 10, 1); ctx.fillRect(x, y, 1, 10);
    ctx.fillRect(x + w - 10, y + h - 1, 10, 1); ctx.fillRect(x + w - 1, y + h - 10, 1, 10);
  }

  function draw(ctx, g, t) {
    G.draw(ctx, { x: S.view === 'galaxy' ? 0 : 600, y: 0 }, t, 7, '#05030f');
    ctx.fillStyle = 'rgba(4,2,12,0.68)';
    ctx.fillRect(0, 0, VW, VH);

    if (S.view === 'galaxy') drawGalaxy(ctx, g, t);
    else drawSystem(ctx, g, t);

    // header
    ctx.fillStyle = 'rgba(6,4,18,0.9)';
    ctx.fillRect(0, 0, VW, 16);
    ctx.fillStyle = '#7ef9ff'; ctx.fillRect(0, 16, VW, 1);
    PD.glyph.draw(ctx, 'planet', 3, 2, '#ffffff', '#7ef9ff');
    F.draw(ctx, S.view === 'galaxy' ? 'GALAXY CHART' : D.ZONES[S.zone].name, 20, 5, '#7ef9ff', { shadow: false });
    F.draw(ctx, S.view === 'galaxy' ? 'ESC  BACK TO THE MOON' : 'ESC  BACK TO THE CHART', 150, 5, '#5a4d80', { shadow: false });
    F.draw(ctx, '$' + U.fmt(g.save.credits), VW - 6, 4, '#ffd34d', { right: true, shadow: false });

    if (S.msgT > 0) {
      const w = F.width(S.msg, 1) + 16;
      ctx.globalAlpha = Math.min(1, S.msgT);
      panel(ctx, VW / 2 - w / 2, 22, w, 16, '#ffb03d');
      F.draw(ctx, S.msg, VW / 2, 27, '#ffd34d', { center: true, shadow: false });
      ctx.globalAlpha = 1;
    }
    PD.touch.draw(ctx, 'ui');
  }

  function drawGalaxy(ctx, g, t) {
    // travel lanes
    for (let i = 1; i < D.ZONES.length; i++) {
      const a = D.ZONES[i - 1], b = D.ZONES[i];
      const open = zoneOpen(g, i);
      ctx.save();
      ctx.globalAlpha = open ? 0.55 : 0.25;
      ctx.strokeStyle = open ? '#7ef9ff' : '#5a4d80';
      ctx.lineWidth = 1;
      if (!open) ctx.setLineDash([3, 5]);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo((a.x + b.x) / 2, (a.y + b.y) / 2 - 30, b.x, b.y);
      ctx.stroke();
      ctx.restore();
    }

    for (let i = 0; i < D.ZONES.length; i++) {
      const z = D.ZONES[i];
      const open = zoneOpen(g, i);
      const sel = S.selZone === i;
      ctx.save();
      if (!open) ctx.globalAlpha = 0.45;
      const sp = sun(i);
      const pulse = 1 + Math.sin(t * 2 + i) * 0.04;
      ctx.drawImage(sp, z.x - sp.width / 2 * pulse, z.y - sp.height / 2 * pulse, sp.width * pulse, sp.height * pulse);
      // its worlds as little beads on an orbit
      ring(ctx, z.x, z.y, 26, z.star, 0.35, !open);
      for (let k = 0; k < z.bodies.length; k++) {
        const a = t * (0.3 + k * 0.12) + k * 2.1;
        const px = z.x + Math.cos(a) * 26, py = z.y + Math.sin(a) * 26 * 0.34;
        const bi = z.bodies[k];
        ctx.fillStyle = g.save.destroyed[bi] ? '#5a4d80' : D.BODIES[bi].tint;
        ctx.beginPath(); ctx.arc(px, py, 2.6, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();

      if (!open) {
        PD.glyph.draw(ctx, 'lock', z.x - 6, z.y - 8, '#ffffff', '#5a4d80');
        F.draw(ctx, 'OBSERVATORY LV ' + (i + 1), z.x, z.y + 42, '#9c8ec4', { center: true });
      }
      F.draw(ctx, z.name, z.x, z.y + 32, open ? '#f2e9ff' : '#9c8ec4', { center: true, shadow: true });
      if (sel) {
        const w = F.width(z.name, 1) + 14;
        ctx.strokeStyle = '#ffd34d';
        ctx.setLineDash([2, 3]);
        ctx.strokeRect(z.x - w / 2 + 0.5, z.y - 34.5, w, 70);
        ctx.setLineDash([]);
      }
    }

    // selection panel
    const z = D.ZONES[S.selZone];
    const open = zoneOpen(g, S.selZone);
    panel(ctx, 8, VH - 44, VW - 16, 38, open ? '#7ef9ff' : '#ff8a3d');
    F.draw(ctx, z.name, 16, VH - 38, z.star, { shadow: false });
    F.draw(ctx, z.sub, 16, VH - 28, '#9c8ec4', { shadow: false });
    let done = 0;
    for (const b of z.bodies) if (g.save.destroyed[b]) done++;
    F.draw(ctx, 'WORLDS ' + done + '/' + z.bodies.length, 16, VH - 18, '#f2e9ff', { shadow: false });
    if (open) {
      F.draw(ctx, 'E  ENTER SECTOR', VW - 16, VH - 26, '#39ffa6', { right: true, shadow: false });
    } else {
      F.draw(ctx, 'OUT OF RANGE', VW - 16, VH - 32, '#ff8a3d', { right: true, shadow: false });
      F.draw(ctx, 'UPGRADE THE OBSERVATORY TO LV ' + (S.selZone + 1), VW - 16, VH - 20, '#9c8ec4', { right: true, shadow: false });
    }
  }

  function drawSystem(ctx, g, t) {
    const z = D.ZONES[S.zone];
    const list = z.bodies;
    const zo = U.clamp(S.zoom, 0, 1);
    ctx.save();
    ctx.globalAlpha = zo;

    // the star, hard left, with orbit arcs sweeping out of it
    const sp = sun(S.zone);
    ctx.drawImage(sp, 34 - sp.width / 2, 132 - sp.height / 2);
    for (let k = 0; k < list.length; k++) {
      const p = bodyPos(k, list.length);
      ctx.save();
      ctx.globalAlpha = zo * 0.3;
      ctx.strokeStyle = z.star;
      ctx.setLineDash([2, 4]);
      ctx.beginPath();
      ctx.ellipse(34, 132, p.x - 34, (p.x - 34) * 0.42, 0, -0.7, 0.7);
      ctx.stroke();
      ctx.restore();
    }

    for (let k = 0; k < list.length; k++) {
      const i = list[k];
      const p = bodyPos(k, list.length);
      const size = 22 + Math.min(3, k) * 5;
      const art = planetArt(i, size);
      const open = bodyOpen(g, i);
      const sel = S.selBody === i;
      const bob = Math.sin(t * 1.2 + k) * 2;
      ctx.save();
      if (!open) ctx.globalAlpha = zo * 0.4;
      ctx.drawImage(art, p.x - art.width / 2, p.y + bob - art.height / 2);
      ctx.restore();
      if (g.save.destroyed[i]) {
        ctx.strokeStyle = '#ff6b8a'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x - 12, p.y + bob - 12); ctx.lineTo(p.x + 12, p.y + bob + 12);
        ctx.moveTo(p.x + 12, p.y + bob - 12); ctx.lineTo(p.x - 12, p.y + bob + 12);
        ctx.stroke();
      } else if (!open) {
        PD.glyph.draw(ctx, 'lock', p.x - 6, p.y + bob - 6, '#ffffff', '#5a4d80');
      }
      F.draw(ctx, D.BODIES[i].name.toUpperCase(), p.x, p.y + bob + size * 0.7 + 6, sel ? '#ffd34d' : '#9c8ec4', { center: true });
      if (sel) {
        const r = size * 0.62 + 6 + Math.sin(t * 4) * 1.5;
        ctx.strokeStyle = '#ffd34d';
        ctx.lineWidth = 1;
        for (let a = 0; a < 4; a++) {
          const ang = t * 0.6 + a * Math.PI / 2;
          ctx.beginPath();
          ctx.arc(p.x, p.y + bob, r, ang, ang + 0.5);
          ctx.stroke();
        }
      }
    }
    ctx.restore();

    // dossier
    const b = D.BODIES[S.selBody];
    const open = bodyOpen(g, S.selBody);
    panel(ctx, 8, VH - 72, VW - 16, 66, open ? '#7ef9ff' : '#5a4d80');
    F.draw(ctx, b.name.toUpperCase(), 16, VH - 66, '#f2e9ff', { shadow: false, scale: 2 });
    F.draw(ctx, b.kind.toUpperCase(), VW - 16, VH - 64, '#7ef9ff', { right: true, shadow: false });
    F.draw(ctx, b.blurb, 16, VH - 48, '#9c8ec4', { shadow: false });
    F.draw(ctx, 'DEPTH ' + b.radius * 10 + 'M', 16, VH - 36, '#7ef9ff', { shadow: false });
    F.draw(ctx, 'GRAV ' + b.gravity, 106, VH - 36, '#7ef9ff', { shadow: false });
    F.draw(ctx, 'CORE ' + U.fmt(b.coreHp), 166, VH - 36, '#ff6b8a', { shadow: false });
    F.draw(ctx, 'BOUNTY $' + U.fmt(b.reward), 246, VH - 36, '#ffd34d', { shadow: false });
    let ox = 16;
    F.draw(ctx, 'ORE', ox, VH - 22, '#9c8ec4', { shadow: false });
    ox += 24;
    for (const pair of b.ores.slice(0, 8)) {
      const m = D.MAT[pair[0]];
      ctx.fillStyle = m.c[1]; ctx.fillRect(ox, VH - 23, 8, 8);
      ctx.fillStyle = m.c[0]; ctx.fillRect(ox, VH - 23, 8, 2);
      ctx.fillStyle = '#0a0616'; ctx.fillRect(ox, VH - 15, 8, 1);
      ox += 11;
    }
    if (g.save.destroyed[S.selBody]) F.draw(ctx, 'ALREADY DESTROYED', ox + 10, VH - 22, '#ff6b8a', { shadow: false });
    if (open) {
      const bw = 110, bx = VW - bw - 12, by = VH - 30;
      ctx.fillStyle = Math.sin(t * 4) > 0 ? '#39ffa6' : '#2ad48a';
      ctx.fillRect(bx, by, bw, 20);
      ctx.strokeStyle = '#d6ffe9'; ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, 19);
      F.draw(ctx, 'E    DROP', bx + bw / 2, by + 7, '#05170e', { center: true, shadow: false });
    } else {
      F.draw(ctx, S.selBody > g.save.unlocked ? 'LOCKED - FINISH THE LAST WORLD' : 'NEEDS A DRIVE', VW - 14, VH - 22, '#ff6b8a', { right: true, shadow: false });
    }
  }

  PD.starmap = { enter, update, draw, S };
})(window.PD);

/* ===== src/mind.js ===== */
/* THE MIND. A brain in a tank of acid, and the skill tree is its wiring:
   neurons in rings around the stem, dendrites between them, a pulse of light
   that runs down the wire when you buy one. Opened from the building on the
   moon; ESC closes it. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const F = PD.font;
  const D = PD.data;
  const A = PD.audio;
  const G = PD.glyph;
  const VW = 480, VH = 270;

  const CX = 176, CY = 138;                // brain centre on screen
  const RING = [0, 40, 76, 108];           // ring radii
  const S = { t: 0, sel: null, pulses: [], flash: 0, bubbles: [] };
  /* upgrade icons that have no glyph of their own borrow a neighbour's */
  const ICON = { reach: 'drill', oxygen: 'o2', thruster: 'speed', trigger: 'gun', lamp: 'eye', magnet: 'weight', scanner: 'scan',
    lung: 'o2', belly: 'cargo', ironskin: 'hull', greed: 'coin', kiln: 'machine', refine: 'machine', tether: 'belt', droneyield: 'drone' };
  function iconOf(id) { const u = D.UPG[id]; const g = ICON[id] || u.icon; return G.names.indexOf(g) >= 0 ? g : 'hex'; }

  for (let i = 0; i < 40; i++) S.bubbles.push({ x: U.hash2(i, 3), y: U.hash2(i, 7), r: 0.6 + U.hash2(i, 11) * 1.6, sp: 6 + U.hash2(i, 13) * 14 });

  function pos(n) {
    const a = (n.a - 90) * Math.PI / 180;
    return { x: CX + Math.cos(a) * RING[n.ring], y: CY + Math.sin(a) * RING[n.ring] * 0.86 };
  }
  function level(g, id) { return g.save.neur[id] || 0; }
  function ringOpen(g, n) { return n.ring <= Math.max(0, g.buildLevel('mind') - 1) + 1; }
  function wired(g, n) {
    if (n.ring === 0) return true;
    return n.links.some(l => level(g, l) > 0);
  }
  function cost(id, lvl) { return D.upgradeCost(D.UPG[id], lvl); }

  function open(g) {
    g.state = 'mind';

  }
  function close(g) {
    g.state = 'home';

  }

  function buy(g, n) {
    const id = n.id, u = D.UPG[id], lvl = level(g, id);
    if (!ringOpen(g, n)) { A.sfx.deny(); S.flash = 0.3; return; }
    if (!wired(g, n)) { A.sfx.deny(); S.flash = 0.3; return; }
    if (lvl >= u.max) { A.sfx.deny(); return; }
    const c = cost(id, lvl);
    if (g.save.credits < c) { A.sfx.deny(); S.flash = 0.3; return; }
    g.save.credits -= c;
    g.save.neur[id] = lvl + 1;

    const from = n.links.length ? D.NEURON[n.links.find(l => level(g, l) > 0) || n.links[0]] : null;

    A.sfx.tone(220, { type: 'sine', to: 1200, dur: 0.35, vol: 0.12 });

  function update(dt, g) {
    S.t += dt;
    S.flash = Math.max(0, S.flash - dt);
    for (let i = S.pulses.length - 1; i >= 0; i--) { S.pulses[i].t += dt * 1.8; if (S.pulses[i].t > 1.6) S.pulses.splice(i, 1); }

    if (IN.hit('esc')) { close(g); return; }
    const m = IN.mouse;
    let hover = null;
    for (const n of D.NEURONS) {
      const p = pos(n);
      if (m.inside && U.dist(m.x, m.y, p.x, p.y) < 12) hover = n;
    }
    if (hover && m.leftPressed) {
      if (S.sel === hover.id) buy(g, hover);
      else { S.sel = hover.id; A.sfx.click(); }
    }
    if ((IN.hit('KeyE') || IN.hit('space')) && S.sel) buy(g, D.NEURON[S.sel]);
    // the panel's own build key
    if (m.leftPressed && m.x >= 336 && m.x <= 466 && m.y >= VH - 44 && m.y <= VH - 20 && S.sel) buy(g, D.NEURON[S.sel]);

  /* ------------------------------------------------------------------ draw */
  function draw(ctx, g, t) {
    // the tank: acid, glass, bubbles
    const grd = ctx.createLinearGradient(0, 0, 0, VH);
    grd.addColorStop(0, '#04150f'); grd.addColorStop(1, '#0a2a1c');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#123f2a';
    ctx.fillRect(0, 26 + Math.sin(t * 1.3) * 2, 330, VH);
    ctx.fillStyle = '#1e9e5c'; ctx.globalAlpha = 0.35; ctx.fillRect(0, 26 + Math.sin(t * 1.3) * 2, 330, 3); ctx.globalAlpha = 1;
    for (const b of S.bubbles) {
      const y = VH - ((b.y * VH + t * b.sp) % (VH - 30));
      const x = b.x * 320 + Math.sin(t * 2 + b.y * 10) * 3;
      ctx.fillStyle = 'rgba(200,255,224,0.55)';
      ctx.fillRect(x | 0, y | 0, b.r > 1.4 ? 2 : 1, b.r > 1.4 ? 2 : 1);
    }
    // the brain, breathing
    const br = PD.arthome.S.brain;
    const pulse = 1 + Math.sin(t * 1.6) * 0.012;
    ctx.save();
    ctx.translate(CX, CY - 6);
    ctx.scale(pulse, pulse);
    ctx.globalAlpha = 0.92;
    ctx.drawImage(br.frames[0], -br.ox, -br.oy, br.w, br.h);
    ctx.restore();
    ctx.globalAlpha = 1;
    // glass wall and rim
    ctx.fillStyle = 'rgba(159,224,255,0.08)'; ctx.fillRect(0, 0, 330, VH);
    ctx.fillStyle = 'rgba(234,252,255,0.25)'; ctx.fillRect(6, 30, 3, VH - 60);
    ctx.fillStyle = '#5e6688'; ctx.fillRect(0, 0, 330, 12); ctx.fillRect(0, VH - 10, 330, 10); ctx.fillRect(328, 0, 4, VH);
    ctx.fillStyle = '#9aa3c4'; ctx.fillRect(0, 12, 330, 1);

    // dendrites
    const mindLvl = g.buildLevel('mind');
    for (const n of D.NEURONS) {
      const p = pos(n);
      for (const l of n.links) {
        const q = pos(D.NEURON[l]);
        const lit = level(g, n.id) > 0 && level(g, l) > 0;
        const half = level(g, l) > 0;
        ctx.strokeStyle = lit ? '#8affa0' : (half ? '#3fb85a' : '#1e4a34');
        ctx.lineWidth = lit ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(q.x, q.y);

          const f = (t * 0.6 + n.a / 360) % 1;
          const bx = (1 - f) * (1 - f) * q.x + 2 * (1 - f) * f * mx + f * f * p.x;

        }
      }
    }
    // neurons
    let hover = null;
    const m = PD.input.mouse;
    for (const n of D.NEURONS) {
      const p = pos(n);
      const u = D.UPG[n.id];
      const lvl = level(g, n.id);
      const open = ringOpen(g, n) && wired(g, n);
      const sel = S.sel === n.id;
      const isHover = m.inside && U.dist(m.x, m.y, p.x, p.y) < 12;
      if (isHover) hover = n;
      const r = 7 + (lvl > 0 ? 2 : 0) + (sel ? Math.sin(t * 6) * 1 : 0);
      // soma
      ctx.fillStyle = lvl > 0 ? '#8affa0' : (open ? '#2f7a56' : '#163826');
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = sel ? '#ffffff' : (isHover ? '#c8ffe0' : (open ? '#63c48a' : '#1e4a34'));
      ctx.lineWidth = sel ? 2 : 1;
      ctx.stroke();
      if (lvl > 0) { ctx.fillStyle = '#e8fff2'; ctx.beginPath(); ctx.arc(p.x - 2, p.y - 2, 2, 0, Math.PI * 2); ctx.fill(); }
      G.draw(ctx, iconOf(n.id), p.x - 6, p.y - 6, lvl > 0 ? '#06210f' : (open ? '#e8fff2' : '#2f5a44'), 'rgba(0,0,0,0)');
      if (lvl > 0) F.draw(ctx, String(lvl), p.x + 7, p.y + 3, '#ffffff', { shadow: true });

    }

    for (const pu of S.pulses) {
      const f = U.clamp(pu.t, 0, 1);
      const x = pu.from.x + (pu.to.x - pu.from.x) * f, y = pu.from.y + (pu.to.y - pu.from.y) * f;
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 1 - Math.max(0, pu.t - 1) / 0.6;
      ctx.beginPath(); ctx.arc(x, y, 3 + (pu.t > 1 ? (pu.t - 1) * 24 : 0), 0, Math.PI * 2);
      if (pu.t > 1) { ctx.strokeStyle = '#8affa0'; ctx.lineWidth = 2; ctx.stroke(); } else ctx.fill();
      ctx.globalAlpha = 1;
    }

    // the read-out panel, right: what the selected neuron is and does
    ctx.fillStyle = '#071a12'; ctx.fillRect(332, 0, VW - 332, VH);
    ctx.fillStyle = '#1e9e5c'; ctx.fillRect(332, 0, 1, VH);
    F.draw(ctx, 'THE MIND', 340, 6, '#8affa0', { shadow: false, scale: 2 });
    F.draw(ctx, 'LEVEL ' + mindLvl, 340, 22, '#3fb85a', { shadow: false });
    F.draw(ctx, 'ESC', VW - 8, 6, '#3fb85a', { right: true, shadow: false });
    const n = D.NEURON[S.sel] || D.NEURONS[0];
    const u = D.UPG[n.id];
    const lvl = level(g, n.id);
    const open = ringOpen(g, n) && wired(g, n);
    F.draw(ctx, u.name.toUpperCase(), 340, 44, '#ffffff', { shadow: false });
    F.draw(ctx, 'LEVEL ' + lvl + ' / ' + u.max, 340, 56, '#8affa0', { shadow: false });
    F.draw(ctx, u.show(lvl), 340, 70, '#ffd34d', { shadow: false });
    // wrapped blurb
    const words = u.blurb.toUpperCase().split(' ');
    let line = '', ly = 86;
    for (const w of words) {
      if (F.width(line + ' ' + w, 1) > 130) { F.draw(ctx, line, 340, ly, '#63c48a', { shadow: false }); line = w; ly += 10; }
      else line = line ? line + ' ' + w : w;
    }
    if (line) F.draw(ctx, line, 340, ly, '#63c48a', { shadow: false });
    // level pips
    for (let k = 0; k < Math.min(u.max, 14); k++) {
      ctx.fillStyle = lvl > Math.floor(k * u.max / Math.min(u.max, 14)) ? '#8affa0' : '#163826';
      ctx.fillRect(340 + k * 9, ly + 16, 6, 4);
    }
    // status
    let status, col;
    if (lvl >= u.max) { status = 'FULLY GROWN'; col = '#8affa0'; }
    else if (!ringOpen(g, n)) { status = 'RING ' + n.ring + ' NEEDS MIND LV ' + n.ring; col = '#ff6b8a'; }
    else if (!wired(g, n)) { status = 'GROW A NEIGHBOUR FIRST'; col = '#ff6b8a'; }
    else { status = 'COST $' + U.fmt(cost(n.id, lvl)); col = g.save.credits >= cost(n.id, lvl) ? '#ffd34d' : '#ff6b8a'; }
    F.draw(ctx, status, 340, ly + 30, col, { shadow: false });
    // the grow key
    const can = open && lvl < u.max && g.save.credits >= cost(n.id, lvl);
    ctx.fillStyle = can ? (Math.sin(t * 5) > 0 ? '#8affa0' : '#63c48a') : '#12281f';
    ctx.fillRect(336, VH - 44, 130, 24);
    ctx.strokeStyle = can ? '#e8fff2' : '#1e4a34'; ctx.strokeRect(336.5, VH - 43.5, 129, 23);
    F.draw(ctx, lvl ? 'E   GROW' : 'E   FIRE NEURON', 401, VH - 36, can ? '#06210f' : '#2f5a44', { center: true, shadow: false });
    F.draw(ctx, '$' + U.fmt(g.save.credits), 401, VH - 14, '#ffd34d', { center: true, shadow: false });
    if (hover && hover.id !== S.sel) {
      const hp = pos(hover);
      F.draw(ctx, D.UPG[hover.id].name.toUpperCase(), hp.x, hp.y - 18, '#ffffff', { center: true });
    }
    if (S.flash > 0) { ctx.fillStyle = 'rgba(255,90,77,' + (S.flash * 0.6).toFixed(2) + ')'; ctx.fillRect(332, 0, VW - 332, VH); }
    PD.touch.draw(ctx, 'ui');
  }

  PD.mind = { open, close, update, draw, S, pos };

/* ===== src/scenes.js ===== */
/* Close-up scenes. Using a building on the moon zooms you into it, first

   readable cards. Four scenes: the multi-tool in your hands, the terminal's

(function (PD) {
  'use strict';
  const U = PD.util;
  const F = PD.font;
  const D = PD.data;
  const A = PD.audio;
  const G = PD.glyph;
  const AH = PD.arthome;
  const VW = 480, VH = 270;

  const S = { mode: null, sel: 0, t: 0, msg: '', msgT: 0, printT: 0, printId: null, fitT: 0, fitId: null, talk: 0, blink: 0, feed: [], feedT: 0 };
  const CHATTER = [
    ['ZAZ', 'Your regolith is... regolith. Send the gems, darling.'],
    ['BROKER K', 'Iron is up. Do not ask why. Sell now.'],
    ['THE SYNDICATE', 'We noticed a planet is missing. Nice work.'],
    ['ZAZ', 'Quality cannot be rushed. It can be bribed.'],
    ['MUM', 'Are you eating? Are you destroying enough worlds?'],
    ['BROKER K', 'Voidstone buyers are circling. Hold or fold.'],
    ['THE SYNDICATE', 'Bounty on your head went up. Congratulations.'],
    ['ZAZ', 'A relic! Finally something worth appraising.']
  ];
  const FACES = { 'ZAZ': ['#c4a0ff', '#8455c4'], 'BROKER K': ['#ffb03d', '#c25c14'], 'THE SYNDICATE': ['#ff5a4d', '#8a2a2a'], 'MUM': ['#8affa0', '#3fb85a'] };

  function enter(mode, g) {
    S.mode = mode; S.sel = 0; S.t = 0; S.msgT = 0; S.printT = 0; S.fitT = 0;
    if (!S.feed.length) for (let i = 0; i < 3; i++) S.feed.push(CHATTER[(i * 3) % CHATTER.length]);
    if (mode === 'terminal') S.talk = 1.2;
    A.sfx.tone(180, { type: 'square', to: 900, dur: 0.18, vol: 0.08 });
  }
  function close() { S.mode = null; PD.home.closeScene(); }
  function say(m) { S.msg = m; S.msgT = 2; A.sfx.deny(); }

  function list(g) {
    if (S.mode === 'phone') return D.BUILDINGS;
    if (S.mode === 'fab') return D.RECIPES.filter(r => r.tier <= g.buildLevel('fab'));
    if (S.mode === 'docks') return D.RECIPES.filter(r => (g.save.parts[r.id] || 0) > 0);

  }

  /* Layout: rows live in LIST, the action key in BTN. */
  const LIST = { x: 20, y: 46, w: 240, rowH: 30, rows: 6 };
  const BTN = { x: VW - 190, y: VH - 44, w: 170, h: 28 };
  const BACK = { x: VW - 56, y: 6, w: 50, h: 18 };

  function inRect(m, r) { return m.inside && m.x >= r.x && m.x <= r.x + r.w && m.y >= r.y && m.y <= r.y + r.h; }

  function act(g) {
    const items = list(g);
    if (S.mode === 'phone') {
      const b = items[S.sel]; if (!b) return;
      const lvl = g.buildLevel(b.id);
      if (lvl <= 0) { if (g.startBuild(b.id)) close(); else say('NOT ENOUGH CREDITS'); }
      else if (lvl >= b.max) say('ALREADY AT FULL SIZE');
      else if (!g.upgradeBuilding(b.id)) say('NOT ENOUGH CREDITS');
    } else if (S.mode === 'terminal') {
      if (g.vaultValue() > 0) { g.sellAll(); S.talk = 1.6; S.feed.push(['ZAZ', 'Pleasure doing business. Bring me more.']); if (S.feed.length > 3) S.feed.shift(); }
      else say('NOTHING TO SELL');
    } else if (S.mode === 'fab') {
      const r = items[S.sel]; if (!r) return;
      if (g.craft(r.id)) { S.printT = 1.4; S.printId = r.id; } else say('MISSING ORE');
    } else if (S.mode === 'docks') {
      const r = items[S.sel]; if (!r) return;
      if (g.install(r.id)) { S.fitT = 1; S.fitId = r.id; S.sel = Math.min(S.sel, Math.max(0, list(g).length - 1)); } else say('NO FREE SLOT');
    }
  }

  function update(dt, g) {
    S.t += dt;
    S.msgT = Math.max(0, S.msgT - dt);
    S.printT = Math.max(0, S.printT - dt);
    S.fitT = Math.max(0, S.fitT - dt);
    S.talk = Math.max(0, S.talk - dt);
    S.blink -= dt; if (S.blink < -0.15) S.blink = 2 + Math.random() * 3;
    S.feedT += dt;
    if (S.feedT > 8) { S.feedT = 0; S.feed.push(CHATTER[(Math.random() * CHATTER.length) | 0]); if (S.feed.length > 3) S.feed.shift(); S.talk = 1.2; }
    const IN = PD.input, m = IN.mouse;

  /* ------------------------------------------------------------- widgets */
  function panel(ctx, x, y, w, h, col, fill) {
    ctx.fillStyle = fill || 'rgba(6,10,26,0.82)';

    ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.fillStyle = col;
    ctx.fillRect(x, y, 10, 2); ctx.fillRect(x, y, 2, 10); ctx.fillRect(x + w - 10, y + h - 2, 10, 2); ctx.fillRect(x + w - 2, y + h - 10, 2, 10);
  }
  function button(ctx, r, label, on, t, col) {
    col = col || '#39ffa6';
    ctx.fillStyle = on ? (Math.sin(t * 5) > 0 ? col : shade(col)) : '#141a30';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = on ? '#ffffff' : '#2a3350'; ctx.lineWidth = 1; ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    F.draw(ctx, label, r.x + r.w / 2, r.y + r.h / 2 - 7, on ? '#05170e' : '#3a4a6a', { center: true, shadow: false, scale: 2 });
  }
  function shade(hex) { const n = parseInt(hex.slice(1), 16); return 'rgb(' + (((n >> 16) & 255) * 0.8 | 0) + ',' + (((n >> 8) & 255) * 0.8 | 0) + ',' + ((n & 255) * 0.8 | 0) + ')'; }
  function header(ctx, title, sub, col) {
    ctx.fillStyle = 'rgba(4,6,18,0.9)'; ctx.fillRect(0, 0, VW, 30);
    ctx.fillStyle = col; ctx.fillRect(0, 30, VW, 1);
    F.draw(ctx, title, 12, 8, '#ffffff', { shadow: false, scale: 2 });
    if (sub) F.draw(ctx, sub, 12 + F.width(title, 2) + 14, 14, col, { shadow: false });
    ctx.fillStyle = '#1a2240'; ctx.fillRect(BACK.x, BACK.y, BACK.w, BACK.h);
    ctx.strokeStyle = col; ctx.strokeRect(BACK.x + 0.5, BACK.y + 0.5, BACK.w - 1, BACK.h - 1);
    F.draw(ctx, 'BACK', BACK.x + BACK.w / 2, BACK.y + 6, '#ffffff', { center: true, shadow: false });
  }
  function row(ctx, i, sel, col) {

    ctx.fillRect(LIST.x, y, LIST.w, LIST.rowH - 2);
    if (sel) { ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.strokeRect(LIST.x + 0.5, y + 0.5, LIST.w - 1, LIST.rowH - 3); ctx.fillStyle = col; ctx.fillRect(LIST.x, y, 3, LIST.rowH - 2); }

  }
  /* Your own green mittens, on the counter. */
  function hands(ctx, t, holding) {

    const draw = (x, flip) => {
      ctx.save(); ctx.translate(x, VH + 18 + bob); if (flip) ctx.scale(-1, 1);
      ctx.fillStyle = '#2b3a66'; ctx.beginPath(); ctx.ellipse(0, 22, 34, 30, 0, 0, Math.PI * 2); ctx.fill();   // sleeve
      ctx.fillStyle = '#f6f3ff'; ctx.fillRect(-26, -4, 52, 6);                                                // cuff
      ctx.fillStyle = P.skin; ctx.beginPath(); ctx.ellipse(0, -12, 24, 18, 0, 0, Math.PI * 2); ctx.fill();   // mitten
      ctx.fillStyle = P.skinD; ctx.beginPath(); ctx.ellipse(-16, -16, 8, 10, -0.4, 0, Math.PI * 2); ctx.fill(); // thumb
      ctx.strokeStyle = '#1a1030'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, -12, 24, 18, 0, 0, Math.PI * 2); ctx.stroke();

      ctx.fillStyle = 'rgba(80,10,20,0.9)'; ctx.fillRect(VW / 2 - 90, VH / 2 - 12, 180, 24);
      F.draw(ctx, S.msg, VW / 2, VH / 2 - 4, '#ffffff', { center: true, shadow: false });
      ctx.globalAlpha = 1;
    }
    PD.touch.draw(ctx, 'ui');
  }

  /* The multi-tool, held up in front of you. */
  function drawPhone(ctx, g, t) {
    const sky = ctx.createLinearGradient(0, 0, 0, VH);
    sky.addColorStop(0, '#0d0826'); sky.addColorStop(1, '#2a1846');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, VW, VH);
    // moon horizon blurred behind the device
    ctx.fillStyle = '#3a3450'; ctx.beginPath(); ctx.moveTo(0, 200); for (let x = 0; x <= VW; x += 8) ctx.lineTo(x, 200 + Math.sin(x * 0.02) * 8); ctx.lineTo(VW, VH); ctx.lineTo(0, VH); ctx.fill();
    // the device
    const px = 100, py = 14, pw = 280, ph = 250;
    ctx.fillStyle = '#1b2547'; roundRect(ctx, px - 4, py - 4, pw + 8, ph + 8, 14); ctx.fill();
    ctx.fillStyle = '#2b3a66'; roundRect(ctx, px, py, pw, ph, 12); ctx.fill();
    ctx.fillStyle = '#9aa3c4'; ctx.fillRect(px + pw / 2 - 16, py + 5, 32, 3);
    ctx.fillStyle = '#062a33'; roundRect(ctx, px + 10, py + 14, pw - 20, ph - 30, 6); ctx.fill();
    // scanlines
    ctx.fillStyle = 'rgba(88,232,255,0.05)';
    for (let y = py + 14 + (Math.floor(t * 30) % 4); y < py + ph - 16; y += 4) ctx.fillRect(px + 10, y, pw - 20, 1);
    F.draw(ctx, 'MULTI-TOOL', px + 20, py + 22, '#eafcff', { shadow: false, scale: 2 });
    F.draw(ctx, '$' + U.fmt(g.save.credits), px + pw - 20, py + 26, '#ffd34d', { right: true, shadow: false });
    F.draw(ctx, 'TAP A BUILDING. TAP AGAIN TO PRINT OR UPGRADE.', px + 20, py + 40, '#2f8fae', { shadow: false });
    // building cards
    const items = D.BUILDINGS;
    const cardY = py + 52, cardH = 26;
    LIST.x = px + 16; LIST.y = cardY; LIST.w = pw - 32; LIST.rowH = cardH; LIST.rows = 5;
    items.forEach((b, i) => {
      const y = row(ctx, i, S.sel === i, '#58e8ff');
      const lvl = g.buildLevel(b.id);
      const s = AH.S[b.id + (lvl <= 1 ? 0 : (lvl < 4 ? 1 : 2))];
      ctx.save();
      if (lvl <= 0) ctx.globalAlpha = 0.45;
      spriteFit(ctx, s, LIST.x + 22, y + cardH - 4, 34, 24);
      ctx.restore();
      F.draw(ctx, b.name, LIST.x + 46, y + 5, '#eafcff', { shadow: false });
      for (let k = 0; k < b.max; k++) { ctx.fillStyle = k < lvl ? '#58e8ff' : '#123a44'; ctx.fillRect(LIST.x + 46 + k * 7, y + 16, 5, 3); }
      const cost = D.buildCost(b, lvl);
      const txt = lvl <= 0 ? 'PRINT $' + U.fmt(cost) : (lvl >= b.max ? 'MAX' : 'UP $' + U.fmt(cost));
      F.draw(ctx, txt, LIST.x + LIST.w - 8, y + 10, lvl >= b.max ? '#8affa0' : (g.save.credits >= cost ? '#ffd34d' : '#ff6b8a'), { right: true, shadow: false });
    });
    const sb = items[S.sel];
    if (sb) wrap(ctx, sb.blurb, px + 20, py + ph - 56, pw - 40, '#58e8ff', 2);
    const lvl = g.buildLevel(sb.id);
    const cost = D.buildCost(sb, lvl);
    BTN.x = px + 20; BTN.y = py + ph - 34; BTN.w = pw - 40; BTN.h = 20;
    button(ctx, BTN, lvl <= 0 ? 'PRINT  $' + U.fmt(cost) : (lvl >= sb.max ? 'FULL SIZE' : 'UPGRADE  $' + U.fmt(cost)), lvl < sb.max && g.save.credits >= cost, t, '#58e8ff');
    header(ctx, '', '', '#58e8ff');
    ctx.fillStyle = 'rgba(0,0,0,0)';
    hands(ctx, t, true);
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  /* The terminal: a video desk. The buyer on the left, the book on the right. */
  function face(ctx, x, y, name, t) {
    const col = FACES[name] || ['#c4a0ff', '#8455c4'];
    const talking = S.talk > 0;
    const mouth = talking ? Math.abs(Math.sin(t * 16)) * 5 + 1 : 1;
    const blink = S.blink < 0;
    // shoulders, head
    ctx.fillStyle = col[1]; ctx.beginPath(); ctx.ellipse(x, y + 58, 40, 22, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = col[0]; ctx.beginPath(); ctx.ellipse(x, y + 10 + Math.sin(t * 2) * 1.5, 30, 34, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1a1030'; ctx.lineWidth = 2; ctx.stroke();
    if (name === 'ZAZ') { ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + 12, y + 6, 8, 0, Math.PI * 2); ctx.stroke(); }
    ctx.fillStyle = '#151233';
    if (blink) { ctx.fillRect(x - 18, y + 4, 12, 2); ctx.fillRect(x + 6, y + 4, 12, 2); }
    else { ctx.beginPath(); ctx.ellipse(x - 12, y + 4, 5, 7, 0, 0, Math.PI * 2); ctx.ellipse(x + 12, y + 4, 5, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(x - 14, y, 3, 3); ctx.fillRect(x + 10, y, 3, 3); }
    ctx.fillStyle = '#1a1030'; ctx.beginPath(); ctx.ellipse(x, y + 24, 9, mouth, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff8ab0'; ctx.beginPath(); ctx.ellipse(x - 22, y + 16, 5, 3, 0, 0, Math.PI * 2); ctx.ellipse(x + 22, y + 16, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    if (name === 'THE SYNDICATE') { ctx.fillStyle = '#151233'; ctx.fillRect(x - 32, y - 2, 64, 10); }   // shades
    if (name === 'MUM') { ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.arc(x - 24, y - 22, 6, 0, Math.PI * 2); ctx.arc(x + 24, y - 22, 6, 0, Math.PI * 2); ctx.fill(); }
  }
  function drawTerminal(ctx, g, t) {
    ctx.fillStyle = '#0a1a16'; ctx.fillRect(0, 0, VW, VH);
    // kiosk interior: warm wall panels
    ctx.fillStyle = '#12302a'; ctx.fillRect(0, 30, VW, VH - 30);
    for (let x = 0; x < VW; x += 40) { ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(x, 30, 1, VH); }
    // the video window
    const vx = 18, vy = 42, vw = 190, vh = 120;
    panel(ctx, vx, vy, vw, vh, '#39ffa6', '#04140f');
    const last = S.feed[S.feed.length - 1] || CHATTER[0];
    ctx.save(); ctx.beginPath(); ctx.rect(vx + 2, vy + 2, vw - 4, vh - 4); ctx.clip();
    const bg = ctx.createLinearGradient(0, vy, 0, vy + vh); bg.addColorStop(0, '#1a3a52'); bg.addColorStop(1, '#0a1a2a');
    ctx.fillStyle = bg; ctx.fillRect(vx, vy, vw, vh);
    face(ctx, vx + vw / 2, vy + 40, last[0], t);
    ctx.fillStyle = 'rgba(57,255,166,0.06)'; for (let y = vy + (Math.floor(t * 30) % 3); y < vy + vh; y += 3) ctx.fillRect(vx, y, vw, 1);
    ctx.restore();
    ctx.fillStyle = '#ff5a4d'; ctx.beginPath(); ctx.arc(vx + 10, vy + 10, 3 + Math.sin(t * 6), 0, Math.PI * 2); ctx.fill();
    F.draw(ctx, 'LIVE  -  ' + last[0], vx + 18, vy + 6, '#39ffa6', { shadow: false });
    // speech
    panel(ctx, vx, vy + vh + 6, vw, 52, '#1e9e68', 'rgba(4,20,15,0.9)');
    wrap(ctx, last[1], vx + 8, vy + vh + 14, vw - 16, '#eafcff', 3);
    // the book
    const bx = 224, by = 42, bw = VW - 224 - 12;
    panel(ctx, bx, by, bw, 180, '#39ffa6');
    F.draw(ctx, 'THE BOOK', bx + 8, by + 6, '#39ffa6', { shadow: false });
    F.draw(ctx, 'QTY', bx + 130, by + 6, '#1e9e68', { shadow: false });
    F.draw(ctx, 'EACH', bx + 162, by + 6, '#1e9e68', { shadow: false });
    F.draw(ctx, 'TREND', bx + bw - 8, by + 6, '#1e9e68', { right: true, shadow: false });
    const keys = Object.keys(g.save.vault).filter(k => g.save.vault[k] > 0).sort((a, c) => D.MAT[c].cr - D.MAT[a].cr);
    if (!keys.length) F.draw(ctx, 'EMPTY. GO DIG SOMETHING UP.', bx + 8, by + 40, '#1e9e68', { shadow: false });
    keys.slice(0, 8).forEach((k, i) => {
      const y = by + 20 + i * 16;
      ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0)'; ctx.fillRect(bx + 4, y - 2, bw - 8, 15);
      orePip(ctx, bx + 8, y, +k);
      F.draw(ctx, D.MAT[k].name.toUpperCase().slice(0, 14), bx + 22, y + 2, '#eafcff', { shadow: false });
      F.draw(ctx, String(g.save.vault[k]), bx + 130, y + 2, '#ffd34d', { shadow: false });
      F.draw(ctx, U.fmt(g.priceOf(+k)), bx + 162, y + 2, '#eafcff', { shadow: false });
      const pct = Math.round((g.demandFor(+k) - 1) * 100);
      F.draw(ctx, (pct >= 0 ? '+' : '') + pct + '%', bx + bw - 8, y + 2, pct >= 0 ? '#8affa0' : '#ff6b8a', { right: true, shadow: false });
    });
    const total = g.vaultValue();
    F.draw(ctx, 'TOTAL', bx + 8, by + 158, '#1e9e68', { shadow: false });
    F.draw(ctx, '$' + U.fmt(total), bx + bw - 8, by + 154, '#ffd34d', { right: true, shadow: false, scale: 2 });
    BTN.x = bx; BTN.y = VH - 40; BTN.w = bw; BTN.h = 26;
    button(ctx, BTN, 'SELL ALL', total > 0, t);
    header(ctx, 'TERMINAL', 'LV ' + g.buildLevel('terminal') + '   +' + Math.round((D.UPG.crew.value(g.save.upg.crew || 0) - 1) * 100) + '% PRICES', '#39ffa6');
    hands(ctx, t, false);
  }

  /* The fabricator bench: recipes left, the printer bed right. */
  function drawFab(ctx, g, t) {
    ctx.fillStyle = '#1a1210'; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#2c1f18'; ctx.fillRect(0, 30, VW, VH - 30);
    for (let y = 40; y < VH; y += 26) { ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(0, y, VW, 2); }
    // bench top
    ctx.fillStyle = '#6b4a3a'; ctx.fillRect(0, VH - 60, VW, 60); ctx.fillStyle = '#8a5a3a'; ctx.fillRect(0, VH - 60, VW, 4);
    const items = list(g);
    LIST.x = 14; LIST.y = 44; LIST.w = 250; LIST.rowH = 30; LIST.rows = 6;
    panel(ctx, LIST.x - 4, LIST.y - 8, LIST.w + 8, LIST.rowH * 6 + 12, '#ffb03d');
    items.forEach((r, i) => {
      if (i >= 6) return;
      const y = row(ctx, i, S.sel === i, '#ffb03d');
      G.draw(ctx, r.glyph, LIST.x + 8, y + 3, '#ffffff', '#c07a20', 2);
      F.draw(ctx, r.name, LIST.x + 36, y + 4, '#fff3d0', { shadow: false });
      let mx = LIST.x + 36;
      for (const key in r.mats) {
        const mat = D.M[key], have = g.save.vault[mat] || 0, need = r.mats[key];
        orePip(ctx, mx, y + 15, mat);
        F.draw(ctx, have + '/' + need, mx + 12, y + 17, have >= need ? '#8affa0' : '#ff6b8a', { shadow: false });
        mx += 44;
      }
      F.draw(ctx, 'x' + (g.save.parts[r.id] || 0), LIST.x + LIST.w - 8, y + 10, '#ffd34d', { right: true, shadow: false });
    });
    if (g.buildLevel('fab') < 4) F.draw(ctx, 'MORE RECIPES AT FABRICATOR LV ' + (g.buildLevel('fab') + 1), LIST.x, LIST.y + LIST.rowH * 6 + 8, '#8a5a3a', { shadow: false });
    // the printer bed
    const px = 284, py = 44, pw = 182, ph = 130;
    panel(ctx, px, py, pw, ph, '#ffb03d', '#0f0a08');
    ctx.fillStyle = '#39405e'; ctx.fillRect(px + 12, py + ph - 22, pw - 24, 8);
    ctx.fillStyle = '#9aa3c4'; ctx.fillRect(px + 10, py + 10, 4, ph - 32); ctx.fillRect(px + pw - 14, py + 10, 4, ph - 32); ctx.fillRect(px + 10, py + 10, pw - 20, 4);
    const sel = items[S.sel];
    if (sel) {
      const cx = px + pw / 2, cy = py + ph - 26;
      const printing = S.printT > 0 && S.printId === sel.id;
      const k = printing ? 1 - S.printT / 1.4 : 1;
      // the part, big
      ctx.save();
      ctx.beginPath(); ctx.rect(px, cy - 60 * k, pw, 60 * k + 2); ctx.clip();
      G.draw(ctx, sel.glyph, cx - 30, cy - 62, printing ? '#ffffff' : '#eafcff', '#c07a20', 5);
      ctx.restore();
      if (printing) {
        const headX = px + 20 + ((S.t * 260) % (pw - 44));
        ctx.fillStyle = '#ffb03d'; ctx.fillRect(headX, py + 14, 12, 10); ctx.fillStyle = '#58e8ff'; ctx.fillRect(headX + 4, py + 24, 4, cy - 60 * k - py - 24);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(px + 16, cy - 60 * k, pw - 32, 2);
        F.draw(ctx, Math.round(k * 100) + '%', cx, py + ph - 12, '#ffffff', { center: true, shadow: false });
      } else {
        F.draw(ctx, sel.name, cx, py + 20, '#fff3d0', { center: true, shadow: false });
        wrap(ctx, sel.blurb, px + 10, py + ph - 14, pw - 20, '#ffb03d', 1);
      }
    }
    BTN.x = px; BTN.y = VH - 44; BTN.w = pw; BTN.h = 26;
    let can = false;
    if (sel) { can = true; for (const key in sel.mats) if ((g.save.vault[D.M[key]] || 0) < sel.mats[key]) can = false; }
    button(ctx, BTN, 'CRAFT', can, t, '#ffb03d');
    header(ctx, 'FABRICATOR', 'LV ' + g.buildLevel('fab') + '   TIER ' + g.buildLevel('fab') + ' RECIPES', '#ffb03d');
    hands(ctx, t, false);
  }

  /* The docks: your pod on the lift, its slots, its numbers. */
  function drawDocks(ctx, g, t) {
    ctx.fillStyle = '#0c1020'; ctx.fillRect(0, 0, VW, VH);
    // hangar: ribs and a lit floor
    for (let x = 0; x < VW; x += 60) { ctx.fillStyle = '#161d38'; ctx.fillRect(x, 30, 8, VH); }
    ctx.fillStyle = '#1c2446'; ctx.fillRect(0, VH - 70, VW, 70);
    ctx.fillStyle = '#2b3a66'; ctx.fillRect(0, VH - 70, VW, 3);
    for (let i = 0; i < 8; i++) { ctx.fillStyle = i % 2 ? '#ffb03d' : '#39405e'; ctx.fillRect(40 + i * 52, VH - 66, 26, 3); }
    // the pod, big, on the lift
    const pod = PD.art.skinFor(g.save.cos).pod;
    const cx = 300, cy = VH - 74 + Math.sin(t * 1.4) * 2;
    ctx.fillStyle = '#39405e'; ctx.fillRect(cx - 60, VH - 70, 120, 6); ctx.fillRect(cx - 8, VH - 64, 16, 20);
    ctx.save(); ctx.translate(cx, cy); ctx.scale(2.4, 2.4);
    ctx.drawImage(pod.frames[Math.floor(t * 3) % 2], -pod.ox, -pod.oy + 2, pod.w, pod.h);
    ctx.restore();
    // slots as hexes hung off the hull
    const slots = g.slots();
    const inst = [];
    for (const id in g.save.installed) for (let k = 0; k < g.save.installed[id]; k++) inst.push(id);
    for (let i = 0; i < slots; i++) {
      const a = Math.PI * 1.15 + i * (Math.PI * 0.7 / Math.max(1, slots - 1));
      const sx = cx + Math.cos(a) * 92, sy = cy - 44 + Math.sin(a) * 40;
      ctx.strokeStyle = inst[i] ? '#58e8ff' : '#2b3a66'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(cx + Math.cos(a) * 40, cy - 40 + Math.sin(a) * 20); ctx.stroke();
      const flash = S.fitT > 0 && inst[i] === S.fitId && i === inst.lastIndexOf(S.fitId);
      G.hex(ctx, sx, sy, 12, inst[i] ? (flash ? '#ffffff' : '#123a44') : '#0c1020', inst[i] ? '#58e8ff' : '#2b3a66', 1);
      if (inst[i]) G.draw(ctx, D.RECIPE[inst[i]].glyph, sx - 6, sy - 6, '#eafcff', 'rgba(0,0,0,0)');
      else F.draw(ctx, String(i + 1), sx, sy - 3, '#2b3a66', { center: true, shadow: false });
    }
    // stats
    const p = g.player;
    const stats = [['AIR', Math.round(p.stat('oxygen')), '#58e8ff'], ['HULL', Math.round(p.stat('hull')), '#ff5a4d'], ['HOLD', Math.round(p.capacity()) + 'KG', '#ffb03d'],
      ['DRILL', Math.round(p.stat('drill')), '#ffd34d'], ['WIRE', Math.round((p.stat('tether') - 70) / 10) + 'M', '#8affa0']];
    panel(ctx, 14, 40, 120, 96, '#58e8ff');
    F.draw(ctx, 'THE POD', 22, 46, '#58e8ff', { shadow: false });
    stats.forEach((s, i) => { F.draw(ctx, s[0], 22, 60 + i * 14, '#9aa3c4', { shadow: false }); F.draw(ctx, String(s[1]), 126, 60 + i * 14, s[2], { right: true, shadow: false }); });
    // parts in store
    const items = list(g);
    LIST.x = 14; LIST.y = 150; LIST.w = 150; LIST.rowH = 18; LIST.rows = 4;
    panel(ctx, LIST.x - 4, LIST.y - 16, LIST.w + 8, LIST.rowH * 4 + 22, '#58e8ff');
    F.draw(ctx, 'PARTS IN STORE', LIST.x + 4, LIST.y - 10, '#58e8ff', { shadow: false });
    if (!items.length) F.draw(ctx, 'NONE. THE FABRICATOR MAKES THEM.', LIST.x + 4, LIST.y + 6, '#2b3a66', { shadow: false });
    items.slice(0, 4).forEach((r, i) => {
      const y = row(ctx, i, S.sel === i, '#58e8ff');
      G.draw(ctx, r.glyph, LIST.x + 6, y + 2, '#eafcff', '#2b3a66');
      F.draw(ctx, r.name + ' x' + (g.save.parts[r.id] || 0), LIST.x + 22, y + 4, '#eafcff', { shadow: false });
    });
    const sel = items[S.sel];
    if (sel) wrap(ctx, sel.blurb, 180, 46, 120, '#58e8ff', 2);
    BTN.x = 14; BTN.y = VH - 40; BTN.w = 160; BTN.h = 26;
    button(ctx, BTN, 'FIT PART', !!sel && g.installedCount() < slots, t, '#58e8ff');
    header(ctx, 'THE DOCKS', 'LV ' + g.buildLevel('docks') + '   SLOTS ' + g.installedCount() + '/' + slots, '#58e8ff');
    hands(ctx, t, false);
  }

  PD.scenes = { enter, close, update, draw, S };
})(window.PD);

/* ===== src/home.js ===== */
/* Your moon. Side-scrolling, low gravity: run, jump very high, tuck into a
   roll. Five buildings, each one raised from a hologram blueprint by the
   multi-purpose tool in your pocket and then 3D-printed in place. Stand at a
   building and press E to use it. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const F = PD.font;
  const A = PD.audio;
  const FX = PD.fx;
  const D = PD.data;
  const AH = PD.arthome;
  const G = PD.glyph;

  const VW = 480, VH = 270;
  const ROOM_W = 1040;
  const HORIZON = 204;
  const GRAV = 330;

  function groundY(x) {
    return HORIZON + Math.sin(x * 0.0121) * 12 + Math.sin(x * 0.0331 + 1.7) * 5 + Math.sin(x * 0.0072 + 4.1) * 8;
  }

  const P = {
    x: 150, y: 0, vx: 0, vy: 0, face: 1, walk: 0, near: null, target: null, autoUse: null, lock: 0,
    roll: 0, rollA: 0, land: 0, air: 0
  };
  const UI = { mode: null, sel: 0, msg: '', msgT: 0, phoneT: 0, feed: [], feedT: 0 };

  const critters = [
    { x: 260, dir: 1, t: 0, spr: 'critter', speed: 15 },
    { x: 600, dir: -1, t: 0.5, spr: 'critter2', speed: 11 },
    { x: 960, dir: 1, t: 1.2, spr: 'critter', speed: 18 }
  ];
  const RUINS = [{ x: 60, k: 2 }, { x: 250, k: 0 }, { x: 420, k: 1 }, { x: 600, k: 2 }, { x: 790, k: 1 }, { x: 1000, k: 0 }];
  const FLAGS = [{ x: 96 }, { x: 410 }, { x: 780 }];
  const ROCKS = [];
  for (let i = 0; i < 26; i++) ROCKS.push({ x: 20 + U.hash2(i, 3) * (ROOM_W - 40), k: (U.hash2(i, 9) * 3) | 0 });
  const CRATERS = [];
  for (let i = 0; i < 16; i++) CRATERS.push({ x: 40 + U.hash2(i, 21) * (ROOM_W - 80), r: 10 + U.hash2(i, 33) * 22 });
  const FORE = [];
  for (let i = 0; i < 14; i++) FORE.push({ x: U.hash2(i, 41) * ROOM_W * 1.15, s: 8 + U.hash2(i, 47) * 16, y: 238 + U.hash2(i, 53) * 30 });
  const MOTES = [];
