      return;
    }
    if (!ready) { if (key || tap) UNI.arrive = Math.max(UNI.arrive, 6.0); return; }
    if (UNI.choice) {
      if ((hotExit && m.leftPressed) || IN.hit('Escape')) {
        UNI.choice = 0; IN_S.quit = 1; startSpin(1.7);
        return;
      }
      if (key || tap) { UNI.choice = 0; startSpin(1.7); }
      return;
    }
    if (key || tap) startSpin(UNI.n < 8 ? 0.72 : 1.2);
  }

  function startSpin(len) {
    UNI.spin = len; UNI.spinMax = len; UNI.pull = 0.62;
    const k = Math.floor(U.hash2(UNI.n * 13 + 3, 7) * 5);
    UNI.face = [k, k, UNI.n < 9 ? k : 3];
    A.sfx.tone(300, { type: 'square', to: 120, dur: 0.18, vol: 0.08 });
    A.noise({ from: 400, to: 1800, dur: 0.5, vol: 0.05 });
    bits(PIVX + 14, PIVY - 6, 4, ['#8e86a8'], 60, 2);
  }

  /* ---------------------------------------------------------- the symbols */
  const WORLDS = [
    { c: '#c9744a', d: '#7a3d22', l: '#ffb07a', ring: 0, spot: 1 },   // a rock
    { c: '#4a8fd6', d: '#23507f', l: '#a8daff', ring: 0, spot: 2 },   // an ocean
    { c: '#d6b44a', d: '#8a6a1e', l: '#ffe9a8', ring: 1, spot: 0 },   // a ringed one
    { c: '#7a4ad6', d: '#3f2280', l: '#c9a8ff', ring: 0, spot: 3 },   // a void
    { c: '#4ad69a', d: '#1e7a58', l: '#a8ffd8', ring: 1, spot: 1 }    // a living one
  ];
  function reelWorld(ctx, x, y, r, k, t, blur) {
    const w = WORLDS[((k % 5) + 5) % 5];
    if (r < 6) {
      // on the little screens a world is three pixels of colour; drawing the
      // whole planet there costs thousands of fills a frame and shows nothing
      X.blob(ctx, x, y, r + 1, r + 1, '#0a0614');
      X.blob(ctx, x, y, r, r, w.c);
      X.blob(ctx, x - r * 0.3, y - r * 0.3, Math.max(1, r * 0.5), Math.max(1, r * 0.45), w.l);
      if (w.ring) X.rect(ctx, x - r * 1.6, y + r * 0.2, r * 3.2, 1, w.d);
      return;
    }
    if (w.ring) {
      ctx.globalAlpha = blur ? 0.4 : 0.75;
      X.blob(ctx, x, y + Math.round(r * 0.25), Math.round(r * 1.65), Math.max(1, Math.round(r * 0.26)), w.d);
      ctx.globalAlpha = 1;
    }
    X.blob(ctx, x, y, r + 1, r + 1, '#0a0614');
    X.blob(ctx, x, y, r, r, w.c);
    X.blob(ctx, x - Math.round(r * 0.32), y - Math.round(r * 0.32), Math.round(r * 0.55), Math.round(r * 0.5), w.l);
    for (let i = 0; i < w.spot; i++) {
      const a = i * 2.1 + t * 0.4;
      X.blob(ctx, x + Math.cos(a) * r * 0.45, y + Math.sin(a) * r * 0.4,
        Math.max(1, Math.round(r * 0.22)), Math.max(1, Math.round(r * 0.18)), w.d);
    }
    X.blob(ctx, x + Math.round(r * 0.4), y + Math.round(r * 0.4), Math.round(r * 0.5), Math.round(r * 0.45), 'rgba(10,6,20,0.35)');
    if (w.ring) {
      X.blob(ctx, x, y + Math.round(r * 0.25), Math.round(r * 1.65), Math.max(1, Math.round(r * 0.2)), w.l);
      X.blob(ctx, x, y + Math.round(r * 0.25), Math.round(r * 1.1), Math.max(1, Math.round(r * 0.14)), '#0a0614');
    }
  }
  function reelSkull(ctx, x, y, r, t) {
    X.blob(ctx, x, y, r + 2, r + 2, '#1a0a12');
    X.blob(ctx, x, y, r, r, '#2a1018');
    PD.glyph.draw(ctx, 'skull', x - 14, y - 14, '#c22a4a', '#ff8a9a', 2);
    ctx.globalAlpha = 0.35 + Math.abs(Math.sin(t * 5)) * 0.3;
    X.blob(ctx, x, y, r * 1.4, r * 1.4, 'rgba(200,40,70,0.25)');
    ctx.globalAlpha = 1;
  }

  const WARP = [];
  for (let i = 0; i < 70; i++) WARP.push({ a: U.hash2(i, 3) * U.TAU, r: U.hash2(i, 7), s: 0.4 + U.hash2(i, 11) });

  /* ------------------------------------------------------------- the hall */
  const HUES = ['#ff5fa8', '#5fe8d8', '#ffd34d', '#9a6aff', '#ff8a4d', '#6affa0'];
  const BANKS = [];
  (function buildBanks() {
    // two ranks either side of the big one. The bar has the left-hand end of
    // the floor, the pit has the right, and nothing stands in the doorway.
    for (let i = 0; i < 7; i++) BANKS.push({ x: -80 + i * 44, y: 214, s: 0.78, i: i });
    for (let i = 0; i < 6; i++) BANKS.push({ x: 540 + i * 44, y: 214, s: 0.78, i: i + 5 });
    for (let i = 0; i < 4; i++) BANKS.push({ x: -60 + i * 56, y: 228, s: 1.08, i: i + 3 });
    for (let i = 0; i < 4; i++) BANKS.push({ x: 556 + i * 56, y: 228, s: 1.08, i: i + 7 });
  })();

  /* One ordinary machine. Everything on it that does not move -- base, body,
     screen surround, the 888 and its own little lever -- is baked once per
     colour and per size; twenty-odd of them redrawn live was two thousand
     fills a frame of furniture. */
  const SW = 34, SH = 62;
  const slotCv = {};
  function slotBody(i, s) {
    const key = (i % HUES.length) + '|' + s;
    if (slotCv[key]) return slotCv[key];
    const hue = HUES[i % HUES.length];
    const OX = SW / 2 + 6, OY = SH + 14;
    const c = document.createElement('canvas');
    c.width = Math.ceil((SW + 12) * s); c.height = Math.ceil((SH + 20) * s);
    const q = c.getContext('2d');
    q.imageSmoothingEnabled = false;
    q.scale(s, s); q.translate(OX, OY);
    q.globalAlpha = 0.35; X.blob(q, 0, -1, SW * 0.6, 4, '#0a0614'); q.globalAlpha = 1;
    X.plate(q, -SW / 2 - 2, -12, SW + 4, 12, '#1b0f2c', '#3a2352', '#0a0614', 2);   // the base
    X.plate(q, -SW / 2, -SH, SW, SH - 10, '#2a1442', hue, '#120722', 3);
    X.plate(q, -SW / 2 + 3, -SH + 22, SW - 6, 20, '#0d0620', '#4a2a70', '#060310', 2);
    F.draw(q, '888', 0, -SH + 7, 'rgba(255,211,77,0.75)', { center: true, shadow: false });
    X.rect(q, SW / 2 - 1, -SH + 26, 3, 3, '#8e86a8');                               // its lever
    X.rect(q, SW / 2 + 1, -SH + 20, 2, 8, '#6a5a9c');
    X.blob(q, SW / 2 + 2, -SH + 19, 3, 3, '#c22a4a');
    slotCv[key] = { cv: c, ox: OX * s, oy: OY * s };
    return slotCv[key];
  }

  function slotBox(ctx, x, y, s, i, t) {
    const body = slotBody(i, s);
    ctx.drawImage(body.cv, Math.round(x - body.ox), Math.round(y - body.oy));
    const hue = HUES[i % HUES.length];
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    // the little screen, turning on its own schedule
    const spin = (Math.floor(t * 2.4 + i * 1.7) % 7) < 2;
    for (let r = 0; r < 3; r++) {
      const cx = -SW / 2 + 8 + r * 9;
      const k = spin ? (Math.floor(t * 22 + r * 3 + i) % 5) : ((i + r) % 5);
      ctx.globalAlpha = spin ? 0.6 : 1;
      reelWorld(ctx, cx, -SH + 32, 3.4, k, t, spin ? 1 : 0);
      ctx.globalAlpha = 1;
    }
    // the topper, pulsing out of step with its neighbours
    const on = Math.sin(t * 3 + i * 1.3) > -0.2;
    X.plate(ctx, -SW / 2 + 2, -SH - 9, SW - 4, 9, on ? '#3a2208' : '#170c22', on ? hue : '#33224a', '#0a0614', 2);
    if (on) {
      F.draw(ctx, ['LUX', 'NOVA', 'HOT', 'BIG', 'ZAP', 'GEM'][i % 6], 0, -SH - 7, '#fff3b0', { center: true, shadow: false });
      ctx.globalAlpha = 0.22; X.blob(ctx, 0, -SH - 5, 22, 12, hue); ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  /* ------------------------------------------------------------- THE ROOM
     The Galaxy Room is drawn ONCE, at world scale, into one big canvas: the
     vault and its rose window, both galleries, the long bar, the roulette pit,
     the far bank of machines and the carpet. Live that is the better part of
     six thousand fills a frame; baked it is a single blit, and the whole frame
     budget goes on the people instead. */
  const HX0 = -520, HY0 = -320, HCW = 1760, HCH = 830;
  let hallCv = null;

  /* the vault: a rose window with ribs running out of it into coffered bays */
  function bakeVault(q) {
    const CEIL = -52;
    X.rect(q, HX0, HY0, HCW, CEIL - HY0 + 10, '#180a2a');
    // bays, going away from the middle
    for (let i = -13; i <= 13; i++) {
      const x = 350 + i * 62;
      X.poly(q, [[x - 26, CEIL], [x + 26, CEIL], [x + 16, -170], [x - 16, -170]], '#200e36');
      X.poly(q, [[x - 22, CEIL - 3], [x + 22, CEIL - 3], [x + 13, -166], [x - 13, -166]], '#2a1442');
      X.line(q, x - 26, CEIL, x - 16, -170, '#3c1a58', 1);
    }
    for (let r = 0; r < 5; r++) {
      const y = CEIL - 8 - r * 24;
      X.rect(q, HX0, y, HCW, 3, '#3c1a58');
      X.rect(q, HX0, y, HCW, 1, '#5e2a86');
    }
    // two roses, either side of the middle: the centre of the vault is kept
    // clear for the sign and the chandelier that hang in front of it
    for (const RX of [-70, 770]) {
      const RY = -186;
      for (let r = 5; r >= 1; r--) {
        const rr = r * 17;
        X.ring(q, RX, RY, rr, r % 2 ? '#3a2208' : '#2a1040', 3);
        if (r % 2) {
          for (let i = 0; i < 10 + r * 3; i++) {
            const a = (i / (10 + r * 3)) * U.TAU + r;
            X.blob(q, RX + Math.cos(a) * rr, RY + Math.sin(a) * rr * 0.9, 2, 2, '#ffd34d');
          }
        }
      }
      for (let i = 0; i < 16; i++) {                       // ribs out of the rose
        const a = (i / 16) * U.TAU;
        X.line(q, RX + Math.cos(a) * 46, RY + Math.sin(a) * 42,
          RX + Math.cos(a) * 190, RY + Math.sin(a) * 140, '#4a2270', 2);
      }
      X.blob(q, RX, RY, 26, 23, '#3a2208');
      X.blob(q, RX, RY, 18, 16, '#ffd34d');
      X.blob(q, RX, RY, 10, 9, '#fff3b0');
      q.globalAlpha = 0.12; X.blob(q, RX, RY, 100, 78, '#ffd34d'); q.globalAlpha = 1;
    }
  }

  /* two tiers of gallery: an arcade of lit openings with a floor slab under it */
  function bakeGallery(q, floorY, deep) {
    const col = deep ? '#1c0c30' : '#241038';
    X.rect(q, HX0, floorY - 74, HCW, 74, col);
    for (let i = -9; i <= 9; i++) {
      const x = 350 + i * 92;
      // an arched opening with the rest of the casino glowing behind it
      X.rect(q, x - 34, floorY - 66, 68, 66, '#120722');
      for (let k = 0; k <= 14; k++) {
        const a = Math.PI + k * (Math.PI / 14);
        X.blob(q, x + Math.cos(a) * 34, floorY - 66 + Math.sin(a) * 22, 3, 3, '#4a2270');
      }
      // a lit room behind, with a rank of little machines standing in it
      const hue = HUES[((i % HUES.length) + HUES.length) % HUES.length];
      q.globalAlpha = 0.2;
      X.rect(q, x - 31, floorY - 58, 62, 58, hue);
      q.globalAlpha = 0.45;
      X.rect(q, x - 31, floorY - 58, 62, 4, hue);
      q.globalAlpha = 1;
      for (let m = -2; m <= 2; m++) {
        X.rect(q, x + m * 12 - 4, floorY - 22, 9, 22, '#150920');
        X.rect(q, x + m * 12 - 4, floorY - 25, 9, 3, '#22102f');
        X.rect(q, x + m * 12 - 2, floorY - 18, 5, 4, hue);
      }
      X.rect(q, x - 31, floorY - 60, 62, 2, '#3c1a58');       // the transom
      X.rect(q, x - 38, floorY - 70, 8, 70, '#2e1446');       // the pier between
      X.rect(q, x - 38, floorY - 70, 2, 70, '#4a2270');
    }
    X.rect(q, HX0, floorY, HCW, 16, '#180a28');
    X.rect(q, HX0, floorY, HCW, 1, '#3c1a58');
    for (let i = 0; i < 44; i++) X.rect(q, HX0 + 6 + i * 40, floorY + 16, 6, 10, '#120720');
  }

  /* the long bar down the left-hand end of the floor */
  function bakeBar(q) {
    const X0 = -424, X1 = -172, TOPY = 196;
    // the back fitting: three lit shelves of bottles under a canopy
    X.rect(q, X0, 118, X1 - X0, 84, '#1a0c2c');
    X.rect(q, X0, 112, X1 - X0, 8, '#2e1446');
    X.rect(q, X0, 112, X1 - X0, 2, '#5e2a86');
    for (let i = 0; i < 3; i++) {
      const y = 128 + i * 24;
      X.rect(q, X0 + 4, y + 18, X1 - X0 - 8, 3, '#3a1a58');
      q.globalAlpha = 0.3; X.rect(q, X0 + 4, y, X1 - X0 - 8, 18, '#ff5fa8'); q.globalAlpha = 1;
      for (let k = 0; k < 30; k++) {
        const x = X0 + 8 + k * 9, h = 9 + (k % 5) * 3;
        X.rect(q, x, y + 18 - h, 5, h, HUES[(k + i) % HUES.length]);
        X.rect(q, x + 1, y + 18 - h, 1, h, '#ffffff');
        X.rect(q, x + 1, y + 14 - h, 3, 3, '#2a1440');
      }
    }
    // the counter, its brass rail, the stools, and the glow off the bottles
    X.plate(q, X0, TOPY, X1 - X0, 10, '#3a1c12', '#8a5a2a', '#170a08', 3);
    X.rect(q, X0, TOPY + 10, X1 - X0, 34, '#241028');
    X.rect(q, X0, TOPY + 18, X1 - X0, 2, '#8a6a2a');
    for (let i = 0; i < 8; i++) {
      const x = X0 + 22 + i * 34;
      X.rect(q, x - 2, TOPY + 24, 4, 20, '#5a4a78');
      X.blob(q, x, TOPY + 24, 9, 3, '#3a1c12');
      X.blob(q, x, TOPY + 44, 7, 2, '#0a0614');
    }
    q.globalAlpha = 0.12; X.blob(q, (X0 + X1) / 2, 200, 150, 40, '#ff5fa8'); q.globalAlpha = 1;
    X.plate(q, X0 + 60, 86, 160, 22, '#170a28', '#5fe8d8', '#080312', 4);
    F.draw(q, 'THE LONG BAR', X0 + 140, 93, '#5fe8d8', { center: true, shadow: '#031014' });
  }

  /* the pit at the other end: two tables, a wheel, and the people round them */
  function bakePit(q) {
    for (let k = 0; k < 2; k++) {
      const cx = 806 + k * 168, cy = 204 + k * 18, s = 1 + k * 0.22;
      X.blob(q, cx, cy + 14 * s, 78 * s, 9 * s, '#0a0614');
      X.blob(q, cx, cy, 76 * s, 22 * s, '#123a22');
      X.blob(q, cx, cy - 2 * s, 70 * s, 18 * s, '#1a5c33');
      X.ring(q, cx, cy, 74 * s, '#5a3a1a', 3);
      if (!k) {
        X.blob(q, cx - 40, cy - 2, 22, 12, '#3a1a10');     // the wheel
        X.blob(q, cx - 40, cy - 3, 17, 9, '#7a2450');
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * U.TAU;
          X.blob(q, cx - 40 + Math.cos(a) * 13, cy - 3 + Math.sin(a) * 7, 2, 2, i % 2 ? '#0a0614' : '#e8dfc4');
        }
        X.blob(q, cx - 40, cy - 3, 4, 3, '#ffd34d');
      }
      for (let i = 0; i < 9; i++) {                        // stacks of chips
        const x = cx - 30 + i * 9, n = 1 + (i % 4);
        for (let j = 0; j < n; j++) X.blob(q, x, cy + 4 - j * 2, 4, 2, j % 2 ? '#ff5fa8' : '#f4f0ff');
      }
    }
    X.plate(q, 760, 128, 120, 22, '#170a28', '#8affa0', '#080312', 4);
    F.draw(q, 'THE PIT', 820, 135, '#8affa0', { center: true, shadow: '#031014' });
  }

  /* the wall of machines behind the floor: bodies only, lights go on live */
  const FAR0 = -84, FARN = 24, FARG = 36;
  function bakeFarBank(q) {
    for (let i = 0; i < FARN; i++) {
      const x = FAR0 + i * FARG, W = 22, H = 40, y = 198;
      X.plate(q, x - W / 2 - 1, y - 8, W + 2, 8, '#1b0f2c', '#3a2352', '#0a0614', 2);
      X.plate(q, x - W / 2, y - H, W, H - 7, '#2a1442', HUES[i % HUES.length], '#120722', 2);
      X.plate(q, x - W / 2 + 2, y - H + 14, W - 4, 13, '#0d0620', '#4a2a70', '#060310', 2);
      X.plate(q, x - W / 2 + 1, y - H - 6, W - 2, 6, '#170c22', '#33224a', '#0a0614', 2);
      X.rect(q, x + W / 2 - 1, y - H + 17, 2, 2, '#8e86a8');
      q.globalAlpha = 0.3; X.blob(q, x, y - 1, W * 0.6, 3, '#0a0614'); q.globalAlpha = 1;
    }
  }

  /* the carpet, its motif and the velvet rope: nothing on it ever moves */
  function bakeCarpet(q) {
    X.rect(q, HX0, FY, HCW, HY0 + HCH - FY, '#3a0e26');
    for (let y = FY; y < FY + 190; y += 7) {
      const k = (y - FY) / 190;
      X.rect(q, HX0, y, HCW, 7, k > 0.45 ? '#4a1230' : '#3d0f28');
      for (let x = HX0 + ((y * 11) % 26); x < HX0 + HCW; x += 26) {
        X.rect(q, x, y + 2, 9 + k * 4, 3, k > 0.45 ? '#5c1a3c' : '#47122e');
        X.rect(q, x + 3, y + 3, 3, 1, '#6e2148');
      }
    }
    for (let row = 0; row < 6; row++) {
      const y = FY + 16 + row * 30, sc = 1 + row * 0.34;
      for (let x = HX0 + ((row % 2) * 46); x < HX0 + HCW; x += 92) {
        q.globalAlpha = 0.5;
        X.poly(q, [[x, y - 6 * sc], [x + 9 * sc, y], [x, y + 6 * sc], [x - 9 * sc, y]], '#5c1a3c');
        X.poly(q, [[x, y - 3 * sc], [x + 4 * sc, y], [x, y + 3 * sc], [x - 4 * sc, y]], '#7a2450');
        q.globalAlpha = 1;
      }
    }
    X.rect(q, HX0, FY, HCW, 2, '#2a0a1c');
    X.rect(q, HX0, FY + 2, HCW, 1, '#57163a');
    q.globalAlpha = 0.1; X.blob(q, 350, FY + 22, 220, 28, '#ff5fa8'); q.globalAlpha = 1;
    // velvet rope: they are allowed to watch and no closer
    for (let i = -12; i <= 16; i++) {
      const px = 160 + i * 60;
      if (i < 16) {
        X.curve(q, px, FY + 30, px + 30, FY + 41, px + 60, FY + 30, '#5e0f2c', 5, 10);
        X.curve(q, px, FY + 29, px + 30, FY + 40, px + 60, FY + 29, '#a8265a', 2, 10);
      }
      X.blob(q, px, FY + 46, 7, 2.5, '#0a0614');
      X.rect(q, px - 5, FY + 43, 11, 3, '#6a5220');
      X.rect(q, px - 2, FY + 28, 4, 16, '#8a6a2a');
      X.rect(q, px - 2, FY + 28, 1, 16, '#ffd34d');
      X.blob(q, px, FY + 27, 3.5, 3.5, '#ffd34d');
      X.blob(q, px - 1, FY + 26, 1.2, 1, '#fff3b0');
    }
  }

  function buildHall() {
    const c = document.createElement('canvas');
    c.width = HCW; c.height = HCH;
    const q = c.getContext('2d');
    q.imageSmoothingEnabled = false;
    q.translate(-HX0, -HY0);
    X.rect(q, HX0, HY0, HCW, HCH, '#150826');
    const grd = q.createLinearGradient(0, -180, 0, FY);
    grd.addColorStop(0, '#0b0418'); grd.addColorStop(0.55, '#25103c'); grd.addColorStop(1, '#3a1550');
    q.fillStyle = grd; q.fillRect(HX0, -180, HCW, FY + 180);
    bakeVault(q);
    bakeGallery(q, 52, true);            // the top gallery
    bakeGallery(q, 120, false);          // the mezzanine
    bakeBar(q);
    bakePit(q);
    bakeFarBank(q);
    bakeCarpet(q);
    return c;
  }

  function hallRoom(ctx, t) {
    if (!hallCv) hallCv = buildHall();
    ctx.drawImage(hallCv, HX0, HY0);

    // ----------------------------------------------------- everything that moves
    // the far bank, blinking
    for (let i = 0; i < FARN; i++) {
      const x = FAR0 + i * FARG;
      if (Math.sin(t * 3 + i * 1.3) < -0.2) continue;
      X.rect(ctx, x - 9, 152, 18, 5, HUES[i % HUES.length]);
      ctx.globalAlpha = 0.2; X.blob(ctx, x, 154, 14, 8, HUES[i % HUES.length]); ctx.globalAlpha = 1;
      for (let r = 0; r < 3; r++) {
        const w = WORLDS[(Math.floor(t * 14 + r * 3 + i) % 5 + 5) % 5];
        X.rect(ctx, x - 8 + r * 6, 171, 5, 5, w.c);
        X.rect(ctx, x - 8 + r * 6, 171, 2, 2, w.l);
      }
    }
    // the arcade behind both galleries, lit in turn
    for (const fy of [52, 120]) {
      for (let i = -9; i <= 9; i++) {
        const on = (Math.floor(t * 3.5 - (fy === 52 ? 2 : 0)) + i) % 5 !== 0;
        if (!on) continue;
        ctx.globalAlpha = 0.1;
        X.rect(ctx, 350 + i * 92 - 30, fy - 56, 60, 54,
          HUES[((i % HUES.length) + HUES.length) % HUES.length]);
        ctx.globalAlpha = 1;
      }
    }
    // neon arches over the back of the floor
    for (let a = 0; a < 3; a++) {
      const r = 280 + a * 74;
      ctx.globalAlpha = 0.72 - a * 0.16;
      for (let i = 0; i <= 17; i++) {
        const ang = Math.PI + i * (Math.PI / 17);
        const on = (Math.floor(t * 5 - a * 2) + i) % 5 !== 0;
        X.blob(ctx, 350 + Math.cos(ang) * r, 210 + Math.sin(ang) * (r * 0.56), 3, 3,
          on ? HUES[(a * 2 + i) % HUES.length] : '#2a1440');
      }
      ctx.globalAlpha = 1;
    }
    // the house banner, hung off the vault well over the big machine
    const bw = Math.sin(t * 0.8) * 1.5;
    X.rect(ctx, 266, -196, 1, 34, '#5a4a78'); X.rect(ctx, 434, -196, 1, 34, '#5a4a78');
    X.plate(ctx, 206, -166 + bw, 288, 40, '#3a0e26', '#ff5fa8', '#180510', 5);
    F.draw(ctx, 'THE GALAXY ROOM', 350, -158 + bw, '#ffd6f0', { center: true, scale: 2, shadow: '#180510' });
    F.draw(ctx, 'NO CREDIT  NO REFUNDS  NO PITY', 350, -140 + bw, '#ff8ad8', { center: true, shadow: '#180510' });
    for (let i = 0; i < 16; i++) {
      const on = (Math.floor(t * 6) + i) % 3 !== 0;
      X.blob(ctx, 214 + i * 18, -130 + bw, 2, 2, on ? '#ffd34d' : '#5a3a10');
    }
    // the two big ones, either side of the sign -- nothing hangs over the meter
    for (const gx of [66, 634]) {
      const cy = -110 + Math.sin(t * 0.6 + gx) * 2;
      X.rect(ctx, gx, -206, 1, 96, '#5a4a78');
      for (let r = 0; r < 3; r++) {
        const rr = 15 + r * 12, n = 8 + r * 5;
        for (let k = 0; k < n; k++) {
          const a = k / n * U.TAU + t * (0.16 + r * 0.05) * (r % 2 ? -1 : 1);
          X.blob(ctx, gx + Math.cos(a) * rr, cy + r * 7 + Math.sin(a) * rr * 0.34,
            3 - r * 0.5, 3 - r * 0.5, r === 1 ? '#fff3b0' : '#ffe9a8');
        }
      }
      X.blob(ctx, gx, cy + 4, 9, 6, '#fff3b0');
      ctx.globalAlpha = 0.16; X.blob(ctx, gx, cy + 10, 58, 32, '#ffd34d'); ctx.globalAlpha = 1;
    }
    // chandeliers, the length of the room
    for (let i = 0; i < 9; i++) {
      const cx = -410 + i * 190, cy = -62 + Math.sin(t * 0.7 + i) * 1.5;
      X.rect(ctx, cx, -92, 1, 30, '#5a4a78');
      for (let k = 0; k < 9; k++) {
        const a = k / 9 * U.TAU + t * 0.25 + i;
        X.blob(ctx, cx + Math.cos(a) * 15, cy + 2 + Math.sin(a) * 6, 2.5, 2.5, '#ffe9a8');
      }
      X.blob(ctx, cx, cy + 2, 7, 5, '#fff3b0');
      ctx.globalAlpha = 0.13; X.blob(ctx, cx, cy + 8, 34, 20, '#ffd34d'); ctx.globalAlpha = 1;
    }
    // and the house lights, sweeping
    for (let i = 0; i < 7; i++) {
      const bx = -260 + i * 200, a = Math.sin(t * 0.5 + i * 1.9) * 0.5;
      const fx = bx + Math.sin(a) * 230, sp = 30;
      ctx.globalAlpha = 0.07;
      X.poly(ctx, [[bx - 5, -60], [bx + 5, -60], [fx + sp, FY], [fx - sp, FY]], HUES[(i * 2) % HUES.length]);
      ctx.globalAlpha = 1;
      X.blob(ctx, bx, -60, 5, 3, '#ffe9a8');
    }
  }

  /* The rail of each gallery, drawn over the people leaning on it. */
  function balconyRail(ctx, y) {
    for (let i = 0; i < 90; i++) X.rect(ctx, HX0 + 8 + i * 20, y - 10, 2, 10, '#3c1a58');
    X.rect(ctx, HX0, y - 12, HCW, 3, '#4a2270');
    X.rect(ctx, HX0, y - 12, HCW, 1, '#8a5ac0');
    X.rect(ctx, HX0, y - 2, HCW, 3, '#2a1040');
  }

  /* The way out. It is lit, it is real, and at nine you can walk at it. */
  function exitSign(ctx, t) {
    const hot = UNI.exitHot && UNI.choice;
    // the doorway: a stone surround with the street showing through it
    X.plate(ctx, EXITX - 40, 134, 80, 92, '#1a0c2a', '#3a2252', '#0a0614', 5);
    X.plate(ctx, EXITX - 30, 148, 60, 78, '#080410', '#2a1840', '#050208', 3);
    ctx.globalAlpha = 0.45 + Math.abs(Math.sin(t * 1.4)) * 0.2;
    X.blob(ctx, EXITX, 206, 26, 24, '#2a4a6a');                      // the street outside
    X.rect(ctx, EXITX - 26, 214, 52, 12, '#1a3048');
    ctx.globalAlpha = 1;
    for (let i = 0; i < 3; i++) {                                    // rain going past it
      const ry = (t * 60 + i * 30) % 70;
      ctx.globalAlpha = 0.3;
      X.rect(ctx, EXITX - 16 + i * 13, 152 + ry, 1, 5, '#7ec8ff');
      ctx.globalAlpha = 1;
    }
    // the box over the door
    const on = hot || Math.sin(t * 2.2) > -0.6;
    X.plate(ctx, EXITX - 34, 116, 68, 18, on ? '#0f3a22' : '#0a1c14', on ? '#5fff9a' : '#1d5a38', '#040c08', 3);
    F.draw(ctx, 'EXIT', EXITX, 121, on ? '#c4ffd8' : '#2a6a46', { center: true, scale: 1, shadow: '#041008' });
    if (on) { ctx.globalAlpha = 0.14; X.blob(ctx, EXITX, 128, 42, 22, '#5fff9a'); ctx.globalAlpha = 1; }
    // at nine it is a real thing you can walk at, so it says so
    if (UNI.choice) {
      const pu = hot ? 1 : 0.45 + Math.abs(Math.sin(t * 2.6)) * 0.3;
      ctx.globalAlpha = pu * (hot ? 0.26 : 0.12);
      X.blob(ctx, EXITX, 180, 58, 68, '#5fff9a');
      ctx.globalAlpha = 1;
      ctx.globalAlpha = pu;
      X.plate(ctx, EXITX - 44, 92, 88, 18, hot ? '#0f3a22' : '#0a1c14', '#5fff9a', '#040c08', 4);
      F.draw(ctx, 'WALK AWAY', EXITX, 97, hot ? '#ffffff' : '#c4ffd8', { center: true, shadow: '#041008' });
      // an arrow on the carpet, pointing at the door
      const aw = Math.sin(t * 3) * 3;
      X.poly(ctx, [[EXITX + 34 + aw, FY + 16], [EXITX + 14 + aw, FY + 8],
        [EXITX + 14 + aw, FY + 24]], '#5fff9a');
      ctx.globalAlpha = 1;
    }
  }

  /* ---------------------------------------------------------- the cabinet */
  function drawCabinet(ctx, g, t) {
    const CX = CBX + CBW / 2;
    const hot = UNI.n >= 9;
    // a shadow and a little dais
    ctx.globalAlpha = 0.4; X.blob(ctx, CX, FY + 6, 128, 9, '#0a0614'); ctx.globalAlpha = 1;
    X.plate(ctx, CBX - 26, FY - 12, CBW + 52, 18, '#2a1040', '#5e2a86', '#120722', 4);
    X.plate(ctx, CBX - 14, FY - 22, CBW + 28, 12, '#351550', '#7a3aae', '#170a2a', 3);
    // the body
    X.plate(ctx, CBX, CBTOP + 10, CBW, FY - CBTOP - 30, '#2a1442', '#5e2a86', '#120722', 8);
    X.plate(ctx, CBX + 8, CBTOP + 18, CBW - 16, FY - CBTOP - 46, '#1c0c2e', '#4a2270', '#0a0414', 6);
    // ------------------------------------------------------------- the towers
    // a pillar of chasing lamps up each cheek, with a beacon on top
    for (const sd of [-1, 1]) {
      const tx2 = CX + sd * (CBW / 2 + 21);
      X.plate(ctx, tx2 - 13, 58, 26, FY - 70, '#2a1442', '#5e2a86', '#120722', 4);
      X.plate(ctx, tx2 - 8, 64, 16, FY - 84, '#170a28', '#4a2270', '#0a0414', 3);
      for (let i = 0; i < 13; i++) {
        const on = (Math.floor(t * (hot ? 16 : 8)) + i * (sd > 0 ? 1 : -1)) % 4 !== 0;
        X.blob(ctx, tx2, 74 + i * 11, 5, 5, on ? '#ffd34d' : '#4a3a10');
        X.blob(ctx, tx2 - 1, 73 + i * 11, 2, 2, on ? '#fff3b0' : '#6a5a2a');
        if (on) { ctx.globalAlpha = 0.14; X.blob(ctx, tx2, 74 + i * 11, 11, 11, '#ffd34d'); ctx.globalAlpha = 1; }
      }
      // the beacon
      const bo = Math.sin(t * (hot ? 9 : 3) + (sd > 0 ? 0 : 1.6)) > -0.2;
      X.plate(ctx, tx2 - 11, 44, 22, 16, '#351550', '#7a3aae', '#170a2a', 4);
      X.blob(ctx, tx2, 40, 7, 7, bo ? '#ff5fa8' : '#4a1c3a');
      X.blob(ctx, tx2 - 2, 38, 2.5, 2.5, bo ? '#ffd6f0' : '#6a2a4a');
      if (bo) { ctx.globalAlpha = 0.2; X.blob(ctx, tx2, 40, 20, 20, '#ff5fa8'); ctx.globalAlpha = 1; }
    }

    // ---------------------------------------------------------- the crown
    // a glass dome over the whole thing with a world turning slowly in it
    const DY = CBTOP - 30;
    X.plate(ctx, CBX + 52, DY + 26, CBW - 104, 16, '#351550', '#7a3aae', '#170a2a', 4);
    X.blob(ctx, CX, DY, 52, 46, '#0a0418');
    ctx.save();
    ctx.beginPath(); ctx.rect(CX - 52, DY - 46, 104, 92); ctx.clip();
    for (let i = 0; i < 22; i++) {                       // a little sky inside it
      const a = i * 1.31 + t * 0.05;
      X.rect(ctx, CX + Math.cos(a) * 44, DY + Math.sin(a * 1.7) * 38, 1, 1, '#7a6ab0');
    }
    reelWorld(ctx, CX, DY + 2, 24, Math.floor(t * 0.22) % 5, t, 0);
    ctx.globalAlpha = 0.09;
    X.poly(ctx, [[CX - 50, DY + 40], [CX - 16, DY - 44], [CX + 2, DY - 44], [CX - 30, DY + 40]], '#ffffff');
    ctx.globalAlpha = 1;
    ctx.restore();
    X.ring(ctx, CX, DY, 52, '#12081e', 4);
    X.ring(ctx, CX, DY, 50, '#7a3aae', 2);
    for (let i = 0; i < 14; i++) {                       // lamps round the rim
      const a = Math.PI * 0.08 + i * (Math.PI * 0.84 / 13);
      const on = (Math.floor(t * (hot ? 15 : 6)) + i) % 3 !== 0;
      X.blob(ctx, CX - Math.cos(a) * 52, DY - Math.sin(a) * 47, 3.5, 3.5, on ? '#ffd34d' : '#4a3a10');
    }

    // the meter across the top: what the house has had off the room tonight
    const take = 41200000 + Math.floor(t * 137) * 100 + UNI.n * 250000;
    X.plate(ctx, CBX - 6, DY - 74, CBW + 12, 22, '#170a28', '#ff5fa8', '#080312', 4);
    X.rect(ctx, CBX - 2, DY - 70, CBW + 4, 1, '#3a0c30');
    F.draw(ctx, 'TAKINGS TONIGHT', CX, DY - 71, '#ff8ad8', { center: true, shadow: '#180510' });
    F.draw(ctx, '$' + take.toLocaleString('en-US'), CX, DY - 62, '#ffd34d',
      { center: true, shadow: '#3a0c30' });
    // the marquee
    const lit = UNI.arrive < 6.2 ? true : (hot ? Math.sin(t * 14) > -0.2 : Math.sin(t * 5) > -0.35);
    X.plate(ctx, CBX + 2, CBTOP + 2, CBW - 4, 36, '#170a28', lit ? '#ffd34d' : '#5a4418', '#080312', 4);
    X.rect(ctx, CBX + 6, CBTOP + 6, CBW - 12, 1, lit ? '#3a2a08' : '#1a1008');
    F.draw(ctx, 'THE UNIVERSAL', CX, CBTOP + 9, lit ? '#ffd34d' : '#6a5a1a',
      { center: true, scale: 2, shadow: '#3a0c30' });
    F.draw(ctx, 'TEN WORLDS TAKES THE LOT', CX, CBTOP + 26, lit ? '#ff5fa8' : '#4a1c3a',
      { center: true, shadow: '#1a0614' });
    if (UNI.glare > 0) {
      ctx.globalAlpha = UNI.glare * 0.3;
      X.blob(ctx, CX, CBTOP + 20, CBW * 0.7, 30, '#ffd34d');
      ctx.globalAlpha = 1;
    }

    // ------------------------------------------------- the window, and the void
    const WX = CBX + 22, WY = 82, WW = CBW - 44, WH2 = 62;
    X.plate(ctx, WX - 6, WY - 6, WW + 12, WH2 + 12, '#3a1a58', '#6e3a9e', '#150828', 5);
    ctx.save();
    ctx.beginPath(); ctx.rect(WX, WY, WW, WH2); ctx.clip();
    ctx.fillStyle = '#0a0418'; ctx.fillRect(WX, WY, WW, WH2);
    ctx.globalAlpha = 0.2;
    X.blob(ctx, WX + 50, WY + 26, 58, 22, '#6a2ab0');
    X.blob(ctx, WX + 116, WY + 38, 46, 18, '#2a5fb0');
    ctx.globalAlpha = 1;
    for (const w of WARP) {
      const sp = UNI.spin > 0 ? 5 : 0.6;
      const f = ((w.r + t * w.s * sp * 0.2) % 1);
      const px = WX + WW / 2 + Math.cos(w.a) * f * WW * 0.72;
      const py = WY + WH2 / 2 + Math.sin(w.a) * f * WH2 * 0.72;
      const ln = UNI.spin > 0 ? 1 + f * 8 : 1;
      ctx.globalAlpha = 0.25 + f * 0.6;
      X.rect(ctx, px, py, Math.round(ln), 1, f > 0.7 ? '#ffffff' : '#a8c8ff');
      ctx.globalAlpha = 1;
    }
    // three bands, each stopping in its own time
    const prog = UNI.spin > 0 ? 1 - UNI.spin / UNI.spinMax : 1;
    for (let r = 0; r < 3; r++) {
      const rx = WX + 4 + r * ((WW - 8) / 3), rw = (WW - 8) / 3 - 3;
      const cx = rx + rw / 2, cy = WY + WH2 / 2;
      ctx.globalAlpha = 0.3; X.rect(ctx, rx, WY, rw, WH2, '#160a26'); ctx.globalAlpha = 1;
      const spinning = UNI.spin > 0 && prog < STOPF[r];
      if (spinning) {
        // six worlds smeared through the window at once, so it reads as speed
        const roll = (UNI.reel * 2.6 + r * 2.1);
        const off = (roll % 1) * 22;
        for (let k = -3; k <= 3; k++) {
          ctx.globalAlpha = 0.3 - Math.abs(k) * 0.05;
          reelWorld(ctx, cx, cy + k * 22 + off, 11, Math.floor(roll) + k, t, 1);
          ctx.globalAlpha = 1;
        }
        // horizontal streaks, and a wash over the lot
        for (let sy = WY + 2; sy < WY + WH2; sy += 4) {
          ctx.globalAlpha = 0.1 + ((sy + roll * 40) % 12 < 4 ? 0.14 : 0);
          X.rect(ctx, rx + 2, sy + ((roll * 30) % 4), rw - 4, 1, '#e8d8ff');
          ctx.globalAlpha = 1;
        }
        ctx.globalAlpha = 0.14;
        X.rect(ctx, rx, WY, rw, WH2, '#c9a8ff');
        ctx.globalAlpha = 1;
      } else {
        // a settle bounce for the first tenth of a second after it lands
        // a settle bounce for a fifth of a second after this reel lands
        const at = UNI.spinMax * (1 - STOPF[r]);
        const set = UNI.spin > 0 ? Math.max(0, 1 - (at - UNI.spin) / 0.2) : 0;
        const bY = cy + Math.sin(set * 9) * set * 7;
        if (UNI.face[r] === 3 && UNI.lost) reelSkull(ctx, cx, bY, 15, t);
        else reelWorld(ctx, cx, bY, 15, UNI.face[r], t, 0);
        if (!UNI.lost && UNI.n > 0) {
          ctx.globalAlpha = 0.2 + Math.abs(Math.sin(t * 3 + r)) * 0.16;
          X.blob(ctx, cx, bY, 24, 24, 'rgba(255,211,77,0.35)');
          ctx.globalAlpha = 1;
        }
      }
      X.rect(ctx, rx - 2, WY, 1, WH2, '#6e3a9e');
      X.rect(ctx, rx + rw + 1, WY, 1, WH2, '#6e3a9e');
      // the last reel left turning gets a frame round it that will not keep still
      if (r === 2 && spinning && prog >= STOPF[1]) {
        const pu = 0.4 + Math.abs(Math.sin(t * 9)) * 0.6;
        ctx.globalAlpha = pu;
        X.rect(ctx, rx - 2, WY, rw + 4, 2, '#ffd34d');
        X.rect(ctx, rx - 2, WY + WH2 - 2, rw + 4, 2, '#ffd34d');
        X.rect(ctx, rx - 2, WY, 2, WH2, '#ffd34d');
        X.rect(ctx, rx + rw, WY, 2, WH2, '#ffd34d');
        ctx.globalAlpha = pu * 0.16;
        X.blob(ctx, cx, cy, rw, WH2 * 0.7, '#ffd34d');
        ctx.globalAlpha = 1;
      }
    }
    // the payline
    X.rect(ctx, WX, WY + WH2 / 2, WW, 1, UNI.lost ? '#ff5a4d' : 'rgba(255,95,168,0.5)');
    // glass: a diagonal sheen over the whole window
    ctx.globalAlpha = 0.07;
    X.poly(ctx, [[WX, WY + WH2], [WX + WW * 0.4, WY], [WX + WW * 0.62, WY], [WX + WW * 0.22, WY + WH2]], '#ffffff');
    ctx.globalAlpha = 1;
    ctx.restore();

    // -------------------------------------------------- the ten world lamps
    for (let i = 0; i < 10; i++) {
      const lx = CBX + 10 + i * 18, ly = 156;
      const on = i < UNI.n;
      const fresh = on && i === UNI.n - 1 && UNI.glare > 0;
      X.plate(ctx, lx, ly, 16, 18, on ? '#3a2a08' : '#221238', on ? '#ffd34d' : '#54357a', '#0a0414', 3);
      if (on) {
        reelWorld(ctx, lx + 8, ly + 9, 5, i % 5, t, 0);
        ctx.globalAlpha = fresh ? 0.14 + UNI.glare * 0.3 : 0.12;
        X.blob(ctx, lx + 8, ly + 9, fresh ? 11 + UNI.glare * 6 : 8, fresh ? 11 + UNI.glare * 6 : 8, '#ffd34d');
        ctx.globalAlpha = 1;
      } else {
        F.draw(ctx, String(i + 1), lx + 8, ly + 6, '#4a3a66', { center: true, shadow: false });
      }
    }
    // the counter, and the coin slot, and the bit that takes everything
    X.plate(ctx, CBX + 34, 180, 60, 16, '#0d0620', '#4a2a70', '#060310', 3);
    F.draw(ctx, UNI.n + '/10', CBX + 64, 184, UNI.n >= 9 ? '#ffd34d' : '#8a7ab0', { center: true, shadow: '#1a0614' });
    X.plate(ctx, CBX + 104, 180, 62, 16, '#0d0620', '#4a2a70', '#060310', 3);
    F.draw(ctx, UNI.lost ? 'NOTHING' : (IN_S.quit ? 'TOO LATE' : 'ALL OF IT'), CBX + 135, 184,
      UNI.lost ? '#ff5a4d' : '#ff5fa8', { center: true, shadow: '#1a0614' });
    // a ledge to lean on, and the coin tray
    X.plate(ctx, CBX - 6, 198, CBW + 12, 10, '#351550', '#7a3aae', '#170a2a', 3);
    X.rect(ctx, CBX + 74, 208, 52, 6, '#0a0614');

    // the mount the lever turns in; the lever itself goes on last, over you
    X.plate(ctx, PIVX - 7, PIVY - 7, 14, 16, '#2a1442', '#6e3a9e', '#120722', 3);
    X.blob(ctx, PIVX, PIVY, 3.5, 3.5, '#12081e');
  }

  function leverBall() {
    const ang = -1.1 + UNI.lever * 1.42;
    return { x: PIVX + Math.cos(ang) * 18, y: PIVY + Math.sin(ang) * 18 };
  }
  /* Drawn under your hand, not over it: shaft, chrome, and a ball you can just
     about get a tentacle round. */
  function drawLever(ctx) {
    const b = leverBall();
    X.limb(ctx, PIVX, PIVY, b.x, b.y, 4, 3, '#4a3f70', '#a89ad0', '#1c1430');
    X.blob(ctx, b.x, b.y, 5.5, 5.5, '#5e0c22');
    X.blob(ctx, b.x, b.y, 4, 4, '#c22a4a');
    X.blob(ctx, b.x - 1.3, b.y - 1.4, 1.6, 1.4, '#ff8a9a');
    if (UNI.pull > 0) {
      ctx.globalAlpha = 0.26;
      X.blob(ctx, b.x, b.y, 9, 9, '#ff5fa8');
      ctx.globalAlpha = 1;
    }
  }

  /* --------------------------------------------------------------- you
     The full rig, one hand on the lever the whole time, which means the arm
     genuinely rides the lever down and springs back with it. */
  function drawGambler(ctx, g, t) {
    const sk = PD.art.skinFor(g.save ? g.save.cos : null);
    if (!UNI.rig) UNI.rig = PD.rig.make();
    const r = UNI.rig;
    const lb = leverBall(), bx = lb.x, by = lb.y;
    const hop = UNI.hop > 0 ? Math.sin(Math.PI * (1 - UNI.hop / 0.6)) : 0;
    const sag = UNI.lost ? Math.min(1, UNI.t / 1.1) : 0;
    const y = FY - 13 - hop * 9 + UNI.lever * 2 + sag * 11;
    const shx = PSX - 4, shy = y - 6.5;
    ctx.globalAlpha = 0.42 - hop * 0.18;
    X.blob(ctx, PSX, FY + 1, 12 - hop * 3, 3, '#0a0614');
    ctx.globalAlpha = 1;
    const grip = UNI.lost ? null : { x: bx, y: by };
    ctx.save();
    // he puts his weight into it: a step in toward the machine and a crouch
    ctx.translate(PSX - UNI.lever * 5, FY + UNI.lever * 2);
    ctx.rotate(UNI.lever * 0.13 - hop * 0.04 - sag * 0.3);
    ctx.translate(-PSX, -FY);
    PD.rig.draw(ctx, r, {
      x: PSX, y: y, flip: true, spr: sk.alienCore,
      frame: PD.rig.faceOf(r, t, Math.sin(t * 1.3) > 0.93),
      drilling: false, twoHand: false, grip: grip,
      aim: grip ? Math.atan2(by - shy, bx - shx) : Math.PI,
      ground: true, vx: 0, vy: 0,
      squash: 1 + (hop > 0 ? hop * 0.16 : Math.sin(t * 3.2) * 0.02) - sag * 0.12,
      ragdoll: false
    }, sk.P, PD.art.BIZ);
    ctx.restore();
    if (hop > 0.5 && U.chance(0.4)) bits(PSX, FY, 1, ['#ffd34d', '#ffffff'], 60, 0);
  }

  /* -------------------------------------------------------- one of the room */
  function drawFan(ctx, c, t) {
    const K = AH.KIN[c.k % AH.KIN.length];
    if (c.gal && UNI.lost && c.drift > 0.5) return;            // the galleries empty
    const jump = (c.jt > 0 && c.jt < c.jd) ? Math.sin(Math.PI * c.jt / c.jd) * c.jh : 0;
    const hot = UNI.hype;
    const bob = Math.sin(t * (2.2 + hot * 6) + c.ph) * (0.8 + hot * 2.2);
    const x = c.x + (UNI.lost ? 0 : Math.sin(t * 0.6 + c.ph) * 1.6);
    const y = c.y - jump + bob * 0.4;
    if (!c.gal) {
      ctx.globalAlpha = 0.42 - Math.min(0.3, jump / 46);
      X.blob(ctx, x, c.y + 1, K.w * 0.42 * c.s, 3 * c.s, '#0a0614');
      ctx.globalAlpha = 1;
    }
    const walking = UNI.lost && c.drift > 0.02 && c.drift < 0.98;
    const face = c.guard
      ? (Math.floor(t * 1.4 + c.ph) % 13 === 0 ? 5 : 0)
      : (UNI.lost
        ? (walking ? (Math.floor(t * 7 + c.ph) % 2 ? 1 : 2) : 0)
        : (jump > 0.4 || hot > 0.45 ? 6 : (c.shout > 0 ? 3 : (Math.floor(t * 2 + c.ph) % 11 === 0 ? 5 : 0))));
    ctx.save();
    ctx.translate(x, y); ctx.scale(c.s, c.s);
    const flip = c.guard ? c.face > 0 : (UNI.lost ? c.x0 < 350 : c.face < 0);
    AH.blit(ctx, AH.S[K.key], face, 0, 0, flip);
    if (c.guard) {
      // a black jacket over whatever he came in, and a wire behind the ear
      X.rect(ctx, -K.w * 0.36, -K.h * 0.66, K.w * 0.72, K.h * 0.36, '#141222');
      X.rect(ctx, -K.w * 0.36, -K.h * 0.66, K.w * 0.72, 2, '#2c2a40');
      X.rect(ctx, -2, -K.h * 0.66, 4, K.h * 0.36, '#2a2838');
      X.rect(ctx, -1, -K.h * 0.55, 2, 7, '#8a1a2a');
      const ex2 = (flip ? -1 : 1) * K.w * 0.22;
      X.curve(ctx, ex2, -K.h * 0.82, ex2 * 1.6, -K.h * 0.72, ex2 * 0.7, -K.h * 0.6, '#e8e4f0', 1, 6);
      X.rect(ctx, ex2 - 1, -K.h * 0.83, 2, 2, '#f4f0ff');
    }
    if (c.rider !== undefined) {
      // somebody's mate, up on the shoulders, with the best view in the room
      const RK = AH.KIN[c.rider % AH.KIN.length];
      ctx.save(); ctx.scale(0.84, 0.84);
      AH.blit(ctx, AH.S[RK.key], face === 6 ? 6 : (face === 3 ? 3 : 0),
        0, -K.h / 0.84 + 7, !flip);
      ctx.restore();
    }
    if (c.cam) {
      // a camera held up over the heads in front, and the flash off it
      const cx2 = (flip ? -1 : 1) * K.w * 0.42, cy2 = -K.h * 0.86;
      X.rect(ctx, cx2 - 5, cy2, 10, 7, '#2a2838');
      X.rect(ctx, cx2 - 5, cy2, 10, 2, '#4a4660');
      X.blob(ctx, cx2 + 1, cy2 + 3, 2.4, 2.4, '#7ec8ff');
      if (UNI.glare > 0.35 && U.hash2(Math.floor(t * 7) + c.k, 5) > 0.55) {
        X.rect(ctx, cx2 - 4, cy2 - 4, 8, 4, '#ffffff');
        ctx.globalAlpha = 0.7; X.blob(ctx, cx2, cy2 - 3, 16, 12, '#ffffff'); ctx.globalAlpha = 1;
      }
    }
    // a drink held up, spilling when they jump
    if (c.drink >= 0 && face !== 6) {
      const dc = ['#8affa0', '#ff8ad8', '#ffb03d', '#7ec8ff'][c.drink];
      const hx = (flip ? -1 : 1) * (K.w * 0.52 + 2), hy = -K.h * 0.42 + Math.sin(t * 3 + c.ph) * 1.5;
      X.rect(ctx, hx - 2, hy, 5, 7, 'rgba(220,235,255,0.35)');
      X.rect(ctx, hx - 2, hy + 2, 5, 5, dc);
      X.rect(ctx, hx - 2, hy, 5, 1, '#d8fbff');
    }
    ctx.restore();
    if (jump > 3 && c.drink >= 0 && U.chance(0.16)) {
      bits(x + (c.face < 0 ? -6 : 6) * c.s, y - K.h * 0.42 * c.s, 1,
        [['#8affa0', '#ff8ad8', '#ffb03d', '#7ec8ff'][c.drink]], 40, 0);
    }
    c.sx = x; c.sy = y - K.h * c.s;
  }

  /* the placards, up over the heads, swinging harder the louder it gets */
  const SIGNW = SIGNS.map(w => F.width(w, 1) + 10);
  function drawSigns(ctx, t) {
    for (const c of CROWD) {
      if (c.sign === undefined || c.sx === undefined) continue;
      const hot = UNI.lost ? 0.1 : 0.3 + UNI.hype;
      const sw = Math.sin(t * (1.6 + hot * 4) + c.ph) * (2 + hot * 5);
      const tipX = c.sx + sw, tipY = c.sy - 14;
      X.limb(ctx, c.sx + 3, c.sy + 12, tipX, tipY, 3, 2, '#8a6a3a', '#c9a46a', '#2a1a10');
      const w = SIGNW[c.sign], h = 15;
      X.plate(ctx, tipX - w / 2, tipY - h, w, h, '#f4f0ff', '#ffffff', '#9a90c0', 3);
      X.rect(ctx, tipX - w / 2 + 2, tipY - h + 2, w - 4, 1, '#c9bce8');
      F.draw(ctx, SIGNS[c.sign], tipX, tipY - h + 5, '#c22a4a', { center: true, shadow: false });
    }
  }

  /* every shout in the room, drawn last so nothing sits on top of one */
  function drawShouts(ctx, t) {
    void t;
    for (const c of CROWD) {
      if (c.shout <= 0 || c.row < 3 || c.sx === undefined) continue;
      const w = WORDS[c.word % WORDS.length];
      const bw = F.width(w, 1) + 8, bh = 11;
      const x = c.sx, by = c.sy - 11 - Math.min(7, c.shout * 7) - (c.row === 4 ? 4 : 0);
      ctx.globalAlpha = Math.min(1, c.shout * 1.6) * 0.94;
      X.plate(ctx, x - bw / 2, by, bw, bh, '#f4f0ff', '#ffffff', '#9a90c0', 2);
      X.poly(ctx, [[x - 3, by + bh - 1], [x + 3, by + bh - 1], [x - 1, by + bh + 4]], '#f4f0ff');
      F.draw(ctx, w, x, by + 3, '#2a1a44', { center: true, shadow: false });
      ctx.globalAlpha = 1;
    }
  }

  /* ------------------------------------------------------------ the scene */
  function drawHall(ctx, g, t, opts) {
    opts = opts || {};
    hallRoom(ctx, t);
    for (const c of CROWD) if (c.row === 0) drawFan(ctx, c, t);     // the top gallery
    balconyRail(ctx, 52);
    for (const c of CROWD) if (c.row === 1) drawFan(ctx, c, t);     // the mezzanine
    balconyRail(ctx, 120);
    for (const c of CROWD) if (c.row === 2) drawFan(ctx, c, t);
    for (const b of BANKS) if (b.s < 1) slotBox(ctx, b.x, b.y, b.s, b.i, t);
    for (const b of BANKS) if (b.s >= 1) slotBox(ctx, b.x, b.y, b.s, b.i, t);
    exitSign(ctx, t);
    drawCabinet(ctx, g, t);
    // the house has one light on you, because you are the entertainment
    ctx.globalAlpha = 0.09 + UNI.hype * 0.05;
    X.poly(ctx, [[PSX - 4, -50], [PSX + 6, -50], [PSX + 20, FY + 2], [PSX - 18, FY + 2]], '#ffe9a8');
    ctx.globalAlpha = 1;
    drawBits(ctx);
    drawLever(ctx);
    if (!opts.noPlayer) drawGambler(ctx, g, t);
    for (const c of CROWD) if (c.row === 3) drawFan(ctx, c, t);
    if (opts.player) opts.player(ctx);
    drawServers(ctx, t);
    for (const c of CROWD) if (c.row === 4) drawFan(ctx, c, t);
    // haze, so the far end of the room sits back
    ctx.globalAlpha = 0.09;
    X.rect(ctx, HX0, 40, HCW, 172, '#6a3ab0');
    ctx.globalAlpha = 1;
    drawSigns(ctx, t);
    drawShouts(ctx, t);
  }

  function drawUniversal(ctx, g, t) {
    const sh = UNI.shake > 0 ? Math.sin(t * 58) * UNI.shake * 5 : 0;
    ctx.save();
    ctx.translate(VW / 2 + sh, VH / 2 + sh * 0.4);
    ctx.scale(CAM.z, CAM.z);
    ctx.translate(-CAM.x, -CAM.y);
    drawHall(ctx, g, t, {});
    ctx.restore();

    if (UNI.flash > 0) {
      ctx.fillStyle = 'rgba(255,90,77,' + (UNI.flash * 0.5).toFixed(2) + ')';
      ctx.fillRect(0, 0, VW, VH);
    }
    if (UNI.glare > 0) {
      ctx.fillStyle = 'rgba(255,211,77,' + (UNI.glare * 0.16).toFixed(2) + ')';
      ctx.fillRect(0, 0, VW, VH);
    }
    // a soft vignette and a warm bloom over the whole frame
    ctx.globalAlpha = 0.16 + UNI.hype * 0.1;
    const vg = ctx.createRadialGradient(240, 128, 60, 240, 128, 260);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, '#0a0412');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 1;

    // ---------------------------------------------------------- what it wants
    // no buttons: one line at the bottom of the frame and the room does the rest
    let line = null, sub = null;
    if (UNI.arrive < 6.2) { line = 'EVERY NIGHT SOMEBODY GETS NINE.'; sub = 'NOBODY HAS EVER GOT TEN.'; }
    else if (UNI.lost) { line = IN_S.quit ? 'YOU WALKED AWAY. IT SPUN ANYWAY.' : 'NINE. AND THEN THIS.'; sub = UNI.t > 3 ? 'TAP' : null; }
    else if (UNI.choice) { line = 'NINE. ONE MORE TAKES EVERYTHING.'; sub = 'PULL AGAIN, OR GO AND STAND AT THE EXIT'; }
    else if (UNI.spin > 0) { line = null; }
    else { line = UNI.n === 0 ? 'PULL THE LEVER.' : 'AGAIN. ' + (10 - UNI.n) + ' TO GO.'; sub = null; }
    if (line) {
      const a = UNI.arrive < 6.2 ? U.clamp(UNI.arrive * 1.4, 0, 1) * U.clamp((6.2 - UNI.arrive) * 2, 0, 1) : 1;
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(8,4,18,0.55)'; ctx.fillRect(0, VH - 34, VW, 34);
      X.rect(ctx, 0, VH - 35, VW, 1, 'rgba(255,95,168,0.35)');
      F.draw(ctx, line, 240, VH - 28, '#ffe9a8', { center: true, scale: 2, shadow: '#1a0614' });
      if (sub) {
        const bl = sub === 'TAP' ? (Math.abs(Math.sin(t * 4)) > 0.4 ? 1 : 0.25) : 1;
        ctx.globalAlpha = a * bl;
        F.draw(ctx, sub, 240, VH - 12, '#c9a8ff', { center: true, shadow: '#1a0614' });
      }
      ctx.globalAlpha = 1;
    }
  }

  /* ---- the same floor, from down on it ----
     Same room, same machine, same people: the only thing that has changed is
     that you are on the carpet and they are leaving. */
  function drawFloor(ctx, g, t) {
    const bt = IN_S.t;
    const k = U.clamp(bt / 5, 0, 1);
    const z = U.lerp(1.02, 1.24, k);
    const cx = U.lerp(414, 388, k), cy = U.lerp(176, 190, k);
    ctx.save();
    ctx.translate(VW / 2, VH / 2);
    ctx.scale(z, z);
    ctx.translate(-cx, -cy);
    hallRoom(ctx, t);
    for (const c of CROWD) if (c.row === 0) drawFan(ctx, c, t);
    balconyRail(ctx, 52);
    for (const c of CROWD) if (c.row === 1) drawFan(ctx, c, t);
    balconyRail(ctx, 120);
    for (const c of CROWD) if (c.row === 2) drawFan(ctx, c, t);
    for (const b of BANKS) slotBox(ctx, b.x, b.y, b.s, b.i, t);
    drawCabinet(ctx, g, t);
    drawLever(ctx);
    drawBits(ctx);

    // -------------------------------------------------------------- you
    // he goes down in two stages: on to his knees, then all the way over
    const sk = PD.art.skinFor(g.save.cos);
    if (!UNI.rig) UNI.rig = PD.rig.make();
    PD.rig.step(UNI.rig, { dt: g.dt, vx: 0, vy: 0, ground: false, drilling: false });
    const fall = U.smoothstep(0, 1, U.clamp((bt - 0.5) / 1.7, 0, 1));
    const rot = -0.3 - fall * 1.16;
    const px = PSX - 8 - fall * 58, py = FY - 14 + fall * 12;
    ctx.save();
    ctx.translate(px, py + Math.sin(t * 1.2) * 0.5);
    ctx.rotate(rot + Math.sin(t * 0.9) * 0.015);
    PD.rig.draw(ctx, UNI.rig, {
      x: 0, y: 0, flip: true, spr: sk.alienCore, frame: 3,
      drilling: false, twoHand: false, grip: null, aim: Math.PI,
      ground: false, vx: 0, vy: 30, squash: 0.94, ragdoll: true
    }, sk.P, PD.art.BIZ);
    ctx.restore();
    // his shadow, spreading as he goes down
    ctx.globalAlpha = 0.38;
    X.blob(ctx, px - fall * 14, FY + 3, 12 + fall * 22, 3.5, '#0a0614');
    ctx.globalAlpha = 1;
    // the last of his money, all over the carpet
    for (let i = 0; i < 9; i++) {
      const cx2 = px - 34 + U.hash2(i, 3) * 78, cy2 = FY + 3 + U.hash2(i, 7) * 16;
      ctx.globalAlpha = 0.9;
      X.blob(ctx, cx2, cy2, 3, 1.6, i % 3 ? '#8a6a2a' : '#3a2a52');
      X.blob(ctx, cx2 - 0.8, cy2 - 0.5, 1.2, 0.7, i % 3 ? '#ffd34d' : '#6a5a9c');
      ctx.globalAlpha = 1;
    }
    // and the tears, which are the only thing moving fast
    for (let i = 0; i < 6; i++) {
      const f = ((t * 1.5 + i * 0.17) % 1);
      ctx.globalAlpha = (1 - f) * fall;
      X.rect(ctx, px - 24 + i * 2 - f * 7, FY - 14 + f * 13, 2, 3, '#9fe8ff');
      ctx.globalAlpha = 1;
    }
    for (const c of CROWD) if (c.row === 2) drawFan(ctx, c, t);
    // somebody walks across the front of the shot to get to the bar
    const wx = -60 + ((bt * 62) % 620);
    const WK = AH.KIN[3];
    ctx.save();
    ctx.translate(wx, 300); ctx.scale(1.5, 1.5);
    AH.blit(ctx, AH.S[WK.key], Math.floor(bt * 7) % 2 ? 1 : 2, 0, 0, false);
    ctx.restore();
    for (const c of CROWD) if (c.row === 3) drawFan(ctx, c, t);
    ctx.restore();

    ctx.globalAlpha = 0.32;
    const vg = ctx.createRadialGradient(240, 150, 40, 240, 150, 230);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, '#0a0412');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 1;
  }

  /* ---- the city, going past upside down ---- */
  const CITY = [];
  for (let i = 0; i < 120; i++) {
    CITY.push({ l: i % 3, x: U.hash2(i, 3) * 1600, w: 16 + U.hash2(i, 7) * 42, h: 40 + U.hash2(i, 11) * 130,
      hue: U.hash2(i, 13) });
  }
  function drawDrag(ctx, g, t) {
    const scroll = t * 58;
    // a sky with a fat neon smear in it
    const grd = ctx.createLinearGradient(0, 0, 0, VH);
    grd.addColorStop(0, '#120428'); grd.addColorStop(0.55, '#2a0c3e'); grd.addColorStop(1, '#0a0418');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 0.18;
    X.blob(ctx, 300, 56, 150, 40, '#ff2f7a');
    X.blob(ctx, 120, 40, 110, 26, '#2f7aff');
    ctx.globalAlpha = 1;
    // rain
    for (let i = 0; i < 70; i++) {
      const x = ((U.hash2(i, 5) * VW + t * 40) % (VW + 20)) - 10;
      const y = ((U.hash2(i, 9) * VH + t * 420 + i * 13) % VH);
      ctx.globalAlpha = 0.18 + U.hash2(i, 17) * 0.2;
      X.rect(ctx, x, y, 1, 7, '#9fd8ff');
      ctx.globalAlpha = 1;
    }
    // three layers of tower, each slower than the one in front
    for (let L = 2; L >= 0; L--) {
      const sp = [1, 0.55, 0.28][L];
      const base = [186, 176, 168][L];
      const col = ['#150a24', '#1d1030', '#28183f'][L];
      const litc = ['#3a2050', '#4a2a66', '#5e3a80'][L];
      for (const b of CITY) {
        if (b.l !== L) continue;
        const x = ((b.x - scroll * sp) % 1600 + 1600) % 1600 - 200;
        if (x < -80 || x > VW + 20) continue;
        const h = b.h * (0.6 + L * 0.2);
        X.rect(ctx, x, base - h, b.w, h + 40, col);
        X.rect(ctx, x, base - h, b.w, 2, litc);
        // windows
        for (let wy = base - h + 6; wy < base - 4; wy += 8) {
          for (let wx = x + 3; wx < x + b.w - 3; wx += 7) {
            const on = U.hash2((wx * 3) | 0, (wy * 5) | 0) > (0.35 + L * 0.12);
            if (!on) continue;
            X.rect(ctx, wx, wy, 3, 4, b.hue > 0.6 ? '#ffd34d' : (b.hue > 0.3 ? '#7ef9ff' : '#ff5fa8'));
          }
        }
        // a sign on about one in five
        if (b.hue > 0.78) {
          const on = Math.sin(t * 5 + b.x) > -0.4;
          X.rect(ctx, x + 2, base - h - 10, b.w - 4, 8, on ? '#ff2f7a' : '#3a0e26');
          X.rect(ctx, x + 4, base - h - 8, b.w - 8, 4, on ? '#ffd6f0' : '#5a1a3a');
        }
      }
    }
    // traffic, in the gap between the layers
    for (let i = 0; i < 5; i++) {
      const x = ((i * 137 - t * (90 + i * 30)) % (VW + 120) + VW + 120) % (VW + 120) - 60;
      const y = 60 + (i % 3) * 16;
      X.rect(ctx, x, y, 18, 5, '#2a2140');
      X.rect(ctx, x + 2, y - 2, 12, 3, '#3a3060');
      X.rect(ctx, x + 17, y + 1, 4, 2, '#ff5a4d');
      X.rect(ctx, x - 3, y + 1, 4, 2, '#7ef9ff');
      ctx.globalAlpha = 0.25;
      X.blob(ctx, x - 8, y + 2, 10, 2, '#7ef9ff');
      ctx.globalAlpha = 1;
    }
    // the street
    X.rect(ctx, 0, 200, VW, VH - 200, '#0f0a1a');
    X.rect(ctx, 0, 198, VW, 3, '#1d1030');
    for (let x = ((-scroll * 1.6) % 40 + 40) % 40 - 40; x < VW; x += 40) X.rect(ctx, x, 214, 22, 3, '#2a2140');
    ctx.globalAlpha = 0.14;
    for (let i = 0; i < 6; i++) X.blob(ctx, ((i * 96 - scroll * 1.6) % 600 + 600) % 600 - 60, 208, 30, 8, '#ff2f7a');
    ctx.globalAlpha = 1;

    // and the three of them, dead centre
    const a = ensureArt();
    const bob = Math.sin(t * 5) * 2;
    drawBull(ctx, 300, 200 + bob, t);
    drawDrax(ctx, 176, 200 - bob, t);
    // you, between them, being dragged by the ankles
    const sk = PD.art.skinFor(g.save.cos), spr = sk.alienCore;
    const cv = spr.frames[0], k = spr.hd || 1;
    ctx.save();
    ctx.translate(238, 190 + bob);
    ctx.rotate(1.5);
    ctx.drawImage(cv, -spr.ox, -spr.oy, cv.width / k, cv.height / k);
    ctx.restore();
    for (let i = 0; i < 4; i++) {
      if (!U.chance(0.5)) continue;
      X.rect(ctx, 226 + U.rand(-14, 14), 198 + U.rand(-2, 4), 2, 1, '#c9bce8');
    }
  }

  /* Drax: grey, covered in red, bare to the waist, and not remotely joking.
     Built out of the same parts as everything else -- pecs, arms with hands on
     them, trousers with boots -- rather than a stack of rectangles. */
  function limbPx(ctx, x0, y0, x1, y1, w0, w1, c, l, d) {
    const dx = x1 - x0, dy = y1 - y0;
    const n = Math.max(1, Math.ceil(Math.hypot(dx, dy)));
    for (let i = 0; i <= n; i++) {
      const q = i / n;
      const w = Math.max(1, Math.round(w0 + (w1 - w0) * q));
      const cx = Math.round(x0 + dx * q), cy = Math.round(y0 + dy * q);
      X.rect(ctx, cx - (w >> 1) - 1, cy - (w >> 1) - 1, w + 2, w + 2, d);
      X.rect(ctx, cx - (w >> 1), cy - (w >> 1), w, w, c);
      if (w > 3) X.rect(ctx, cx - (w >> 1), cy - (w >> 1), w - 2, 1, l);
    }
  }
  function drawDrax(ctx, x, y, t) {
    const S1 = '#8d99a6', SL = '#b3bec9', SD = '#5d6874', RD = '#b04a52', RL = '#d4707a';
    const TR = '#252a36', TL = '#39404f', INK = '#10131a';
    const br = Math.sin(t * 3) * 1;
    X.blob(ctx, x, y + 1, 16, 3, '#0a0614');
    // legs, planted wide
    for (const sgn of [-1, 1]) {
      limbPx(ctx, x + sgn * 6, y - 26, x + sgn * 8, y - 13, 10, 9, TR, TL, INK);
      limbPx(ctx, x + sgn * 8, y - 13, x + sgn * 9, y - 4, 9, 8, TR, TL, INK);
      X.round ? 0 : 0;
      X.rect(ctx, x + sgn * 9 - 6, y - 5, 12, 5, '#15181f');
      X.rect(ctx, x + sgn * 9 - 6, y - 5, 12, 2, '#2a303c');
    }
    // the torso: a slab with a chest on it
    X.blob(ctx, x, y - 36, 14, 12 + br, S1);
    X.rect(ctx, x - 14, y - 30, 28, 6, SD);
    X.blob(ctx, x - 6, y - 42, 7, 5, SL);              // pecs
    X.blob(ctx, x + 6, y - 42, 7, 5, SL);
    X.rect(ctx, x - 1, y - 45, 2, 12, SD);
    for (let i = 0; i < 3; i++) X.rect(ctx, x - 7, y - 34 + i * 4, 14, 1, SD);   // abs
    X.rect(ctx, x - 13, y - 28, 26, 4, TR);            // waistband
    X.rect(ctx, x - 3, y - 28, 6, 4, '#7a6a3a');
    // the red, everywhere
    for (let i = 0; i < 9; i++) {
      const a = i * 1.9;
      X.rect(ctx, x + Math.cos(a) * 9, y - 40 + Math.sin(a) * 7, 4 + (i % 3), 2, i % 2 ? RD : RL);
      X.rect(ctx, x + Math.cos(a * 1.4) * 6, y - 44 + (i % 5) * 3, 2, 4, RD);
    }
    // arms: one of them is holding your ankle
    limbPx(ctx, x - 14, y - 44, x - 20, y - 33, 9, 8, S1, SL, INK);
    limbPx(ctx, x - 20, y - 33, x - 24, y - 24, 8, 7, S1, SL, INK);
    X.blob(ctx, x - 25, y - 21, 5, 5, SL);
    limbPx(ctx, x + 14, y - 44, x + 20, y - 34, 9, 8, S1, SL, INK);
    limbPx(ctx, x + 20, y - 34, x + 27, y - 29, 8, 7, S1, SL, INK);
    X.blob(ctx, x + 29, y - 28, 5, 5, SL);
    X.rect(ctx, x - 19, y - 42, 6, 2, RD);
    X.rect(ctx, x + 16, y - 42, 6, 2, RD);
    // head: a hard one
    X.blob(ctx, x, y - 54, 9, 8, S1);
    X.blob(ctx, x, y - 58, 7, 3, SL);
    X.round && 0;
    X.rect(ctx, x - 7, y - 60, 14, 2, RD);
    X.rect(ctx, x - 8, y - 56, 5, 1, RD); X.rect(ctx, x + 3, y - 56, 5, 1, RD);
    X.rect(ctx, x - 6, y - 55, 4, 3, '#ffffff'); X.rect(ctx, x + 2, y - 55, 4, 3, '#ffffff');
    X.rect(ctx, x - 5, y - 54, 2, 2, INK); X.rect(ctx, x + 3, y - 54, 2, 2, INK);
    X.rect(ctx, x - 4, y - 49, 8, 1, '#3a2028');
    X.rect(ctx, x - 3, y - 48, 6, 1, SD);
  }

  /* The big one. Horns, a ring in his nose, and nothing at all to say. */
  function drawBull(ctx, x, y, t) {
    const S1 = '#8a6650', SL = '#ab8468', SD = '#5c4234', H = '#e8dfc4', HD2 = '#b0a888';
    const TR = '#2a2438', TL = '#3f3750', INK = '#140f26';
    const br = Math.sin(t * 2.4 + 1) * 1;
    X.blob(ctx, x, y + 1, 20, 4, '#0a0614');
    for (const sgn of [-1, 1]) {
      limbPx(ctx, x + sgn * 8, y - 28, x + sgn * 10, y - 14, 13, 11, TR, TL, INK);
      limbPx(ctx, x + sgn * 10, y - 14, x + sgn * 11, y - 5, 11, 9, TR, TL, INK);
      X.rect(ctx, x + sgn * 11 - 8, y - 6, 16, 6, '#15121c');
      X.rect(ctx, x + sgn * 11 - 8, y - 6, 16, 2, '#2e2840');
    }
    // a chest you could park on
    X.blob(ctx, x, y - 42, 19, 15 + br, S1);
    X.rect(ctx, x - 19, y - 34, 38, 7, SD);
    X.blob(ctx, x - 8, y - 50, 9, 6, SL);
    X.blob(ctx, x + 8, y - 50, 9, 6, SL);
    X.rect(ctx, x - 1, y - 54, 2, 16, SD);
    for (let i = 0; i < 3; i++) X.rect(ctx, x - 9, y - 38 + i * 4, 18, 1, SD);
    // fur, along the edges
    for (let i = 0; i < 14; i++) {
      const a = i / 14 * Math.PI * 2;
      X.rect(ctx, x + Math.cos(a) * 19, y - 42 + Math.sin(a) * 15, 2, 2, i % 2 ? SD : SL);
    }
    X.rect(ctx, x - 18, y - 30, 36, 4, '#3a2a1a');
    X.rect(ctx, x - 4, y - 30, 8, 4, '#c9a02a');
    // arms
    limbPx(ctx, x - 19, y - 52, x - 26, y - 38, 12, 10, S1, SL, INK);
    limbPx(ctx, x - 26, y - 38, x - 31, y - 30, 10, 8, S1, SL, INK);
    X.blob(ctx, x - 33, y - 27, 6, 6, SL);
    limbPx(ctx, x + 19, y - 52, x + 26, y - 40, 12, 10, S1, SL, INK);
    limbPx(ctx, x + 26, y - 40, x + 32, y - 33, 10, 8, S1, SL, INK);
    X.blob(ctx, x + 34, y - 31, 6, 6, SL);
    // head, snout, ring, horns
    X.blob(ctx, x + 1, y - 64, 11, 9, S1);
    X.blob(ctx, x - 3, y - 60, 7, 5, SL);
    X.rect(ctx, x - 5, y - 60, 2, 2, '#2a1810'); X.rect(ctx, x - 1, y - 60, 2, 2, '#2a1810');
    X.rect(ctx, x - 5, y - 67, 4, 2, INK); X.rect(ctx, x + 3, y - 67, 4, 2, INK);
    X.rect(ctx, x - 4, y - 56, 6, 2, '#c9c4b4');
    for (const s of [-1, 1]) {
      X.rect(ctx, x + 1 + s * 9, y - 70, 5, 4, H);
      X.rect(ctx, x + 1 + s * 13, y - 75, 5, 6, H);
      X.rect(ctx, x + 1 + s * 16, y - 79, 4, 5, HD2);
      X.rect(ctx, x + 1 + s * 17, y - 82, 3, 4, H);
    }
    // and the ears, out sideways
    for (const s of [-1, 1]) X.blob(ctx, x + 1 + s * 13, y - 62, 5, 3, S1);
  }

  /* ---- the fist ---- */
  function drawFist(ctx, g, t) {
    drawDrag(ctx, g, t);
    const k = U.clamp((IN_S.t - 3.2) / 0.7, 0, 1);
    if (IN_S.line >= 2 && k > 0) {
      // it arrives very fast and it fills the screen
      const r = 20 + k * k * 260;
      X.blob(ctx, 240, 130, r, r * 0.85, '#8d99a6');
      X.blob(ctx, 240 - r * 0.3, 130 - r * 0.3, r * 0.5, r * 0.4, '#a7b2be');
      for (let i = 0; i < 5; i++) X.rect(ctx, 240 - r + i * r * 0.4, 130 - r * 0.2, r * 0.25, r * 0.5, '#6d7885');
      if (k >= 1) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, VW, VH); }
    }
  }

  /* ---- and the room with the throne in it, seen from the carpet ---- */
  function drawThrone(ctx, g, t) {
    const wake = U.clamp(IN_S.t / 1.6, 0, 1);
    ctx.fillStyle = '#12060c'; ctx.fillRect(0, 0, VW, VH);
    // a gold ceiling, way up, because you are looking up at it
    for (let i = 0; i < 9; i++) {
      const w = 60 + i * 6;
      X.rect(ctx, 240 - w / 2, 4 + i * 4, w, 3, i % 2 ? '#6a5220' : '#8a6a2a');
    }
    ctx.globalAlpha = 0.14;
    X.blob(ctx, 240, 30, 190, 30, '#ffd34d');
    ctx.globalAlpha = 1;
    // pillars either side, converging because of the angle
    for (const s of [-1, 1]) {
      X.poly(ctx, [[240 + s * 70, 30], [240 + s * 96, 30], [240 + s * 250, VH], [240 + s * 150, VH]], '#2a1018');
      X.poly(ctx, [[240 + s * 70, 30], [240 + s * 78, 30], [240 + s * 170, VH], [240 + s * 150, VH]], '#3a1a24');
    }
    // the steps up to it
    for (let i = 0; i < 6; i++) {
      const w = 150 + i * 26, y = 150 + i * 14;
      X.rect(ctx, 240 - w / 2, y, w, 14, i % 2 ? '#3a1a24' : '#451f2c');
      X.rect(ctx, 240 - w / 2, y, w, 2, '#5e2c3c');
    }
    // the throne
    X.plate(ctx, 206, 84, 68, 70, '#5e2c3c', '#8a4458', '#2a1018', 5);
    for (let i = 0; i < 5; i++) X.spike(ctx, 0, 0, 0, 0, 0, '#000');
    for (let i = 0; i < 7; i++) {
      const sx = 208 + i * 10;
      X.poly(ctx, [[sx, 84], [sx + 8, 84], [sx + 4, 84 - 8 - (i % 2) * 6]], '#8a6a2a');
    }
    X.rect(ctx, 206, 130, 68, 6, '#8a6a2a');
    // and him on it, at a comfortable size for a man who owns the building
    const a = ensureArt();
    const K = 1.4;
    ctx.save();
    ctx.translate(Math.round(240 - MCX * K), Math.round(146 - MBASE * K));
    ctx.scale(K, K);
    ctx.drawImage(a.mini.walk[IN_S.chars < (BEATS[B_OF.throne].lines[IN_S.line] || '').length
      && Math.floor(t * 9) % 2 === 0 ? 1 : 0][0], 0, 0);
    ctx.restore();
    // two very large silhouettes either side of him
    for (const s of [-1, 1]) {
      ctx.globalAlpha = 0.9;
      X.blob(ctx, 240 + s * 62, 150, 16, 30, '#160a10');
      X.blob(ctx, 240 + s * 62, 116, 11, 10, '#160a10');
      ctx.globalAlpha = 1;
    }
    // the edge of your own eyelids, opening
    const lid = (1 - wake) * (VH / 2);
    if (lid > 0.5) {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, VW, lid);
      ctx.fillRect(0, VH - lid, VW, lid);
    }
    // the watch, being fitted
    if (IN_S.line >= 6) {
      const bz = Math.round(U.rand(-1, 1));
      X.plate(ctx, 40 + bz, VH - 52, 26, 16, '#2a2438', '#453c5c', '#0a0614', 3);
      X.rect(ctx, 44 + bz, VH - 48, 18, 9, '#0d5a78');
      X.rect(ctx, 46 + bz, VH - 46, 14, 5, '#7ef9ff');
    }
  }

  /* There is no opening cutscene any more. The night starts with you already on
     your feet in the club -- the machine is at the back of the room and you go
     and find it yourself. Everything after that is beats. */
  function enterIntro(g) {
    ensureArt();
    IN_S.beat = 0; IN_S.t = 0; IN_S.line = 0; IN_S.chars = 0; IN_S.pop = 0; IN_S.quit = 0;
    IN_S.flash = 0;
    IN_S.done = 0; IN_S.inClub = 1;
    g.save.story = 1;
    g.saveGame();
    g.state = 'home';
    PD.home.enter(g);
    PD.home.goClub(g, true);
    A.sfx.tone(180, { type: 'square', to: 90, dur: 0.5, vol: 0.1 });
  }

  function nextBeat(g) {
    IN_S.beat++; IN_S.t = 0; IN_S.line = 0; IN_S.chars = 0; IN_S.pop = 0;
    if (IN_S.beat >= BEATS.length) { finishIntro(g); return; }
  }

  function finishIntro(g) {
    /* Once is enough. updateIntro keeps running while the iris closes, and
       without this it re-started the wipe every frame -- so it never reached
       its own midpoint and the cutscene never ended. */
    if (IN_S.done) return;
    IN_S.done = 1;
    g.save.seenIntro = 1;
    g.save.debt = DEBT0;
    g.saveGame();
    g.wipeTo(240, 135, '#0a0614', () => {
      g.state = 'home';
      PD.home.enter(g);
      call(g, 'welcome');
      call(g, 'tip');           // queues behind it: the state of the place
    });
  }

  function updateIntro(dt, g) {
    if (IN_S.done) return;
    const IN = PD.input;
    IN_S.t += dt;
    if (BEATS[IN_S.beat] && BEATS[IN_S.beat].id === 'universal') {
      IN_S.pop = 1;
      updateUniversal(dt, g);
      return;
    }
    // the crowd carries on leaving while you are still on the carpet
    if (BEATS[IN_S.beat] && BEATS[IN_S.beat].id === 'floor') {
      UNI.lever = 0; UNI.pull = 0;
      updateCrowd(dt, IN_S.t); updateServers(dt); updateBits(dt);
    }
    if (IN.hit('Escape')) { finishIntro(g); return; }
    IN_S.pop = Math.min(1, IN_S.pop + dt * 4.5);
    IN_S.flash = Math.max(0, IN_S.flash - dt * 2.2);
    const b = BEATS[IN_S.beat];
    if (!b) { finishIntro(g); return; }
    const line = b.lines[IN_S.line] || '';
    if (IN_S.chars < line.length) IN_S.chars = Math.min(line.length, IN_S.chars + dt * 46);

    const m = IN.mouse;
    const poke = IN.hit('KeyE') || IN.hit('Space') || IN.hit('Enter') || (m.inside && m.leftPressed);
    if (poke) {
      if (IN_S.chars < line.length) { IN_S.chars = line.length; return; }
      IN_S.line++; IN_S.chars = 0; IN_S.pop = 0; A.sfx.click();
      if (IN_S.line >= b.lines.length) nextBeat(g);
      return;
    }
    if (IN_S.t > b.dur) nextBeat(g);
  }

  /* ---- and out, over the moon he now owns ---- */
  function drawDrop(ctx, g, t) {
    const grd = ctx.createLinearGradient(0, 0, 0, VH);
    grd.addColorStop(0, '#0b0720'); grd.addColorStop(1, '#04030d');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, VW, VH);
    for (let i = 0; i < 90; i++) {
      const x = (U.hash2(i, 5) * VW) | 0, y = (U.hash2(i, 9) * VH) | 0;
      ctx.globalAlpha = 0.3 + U.hash2(i, 11) * 0.6;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, 1, 1);
    }
    ctx.globalAlpha = 1;
    if (!drawDrop.moon) drawDrop.moon = PD.arthome.buildPlanet(300, '#8e86a8', 4, 'moon');
    ctx.drawImage(drawDrop.moon, 90, 120);
    // the pod, dropping something off and leaving
    const f = U.clamp(IN_S.t / 4, 0, 1);
    const spr = PD.art.skinFor(g.save.cos).pod;
    const px = U.lerp(VW + 40, 150, Math.min(1, f * 2.2));
    const py = U.lerp(60, 128, Math.min(1, f * 2.2));
    ctx.save(); ctx.translate(px | 0, py | 0); ctx.scale(0.7, 0.7);
    ctx.drawImage(spr.frames[Math.floor(t * 8) % 2], -spr.ox, -spr.oy);
    ctx.restore();
    if (f > 0.5) {
      X.line(ctx, px, py + 12, px, py + 12 + (f - 0.5) * 60, '#c9c9dc', 1);
      const al = PD.art.sprites.alien;
      ctx.drawImage(al.frames[1], 0, 0, al.frames[0].width, al.frames[0].height,
        Math.round(px - al.ox), Math.round(py + 12 + (f - 0.5) * 60 - al.oy * 0.5), al.w, al.h);
    }
  }

  /* Break a line into rows that fit, at whichever scale is asked for. */
  function wrap(str, w, scale) {
    const out = [];
    let row = '';
    for (const wd of str.split(' ')) {
      const test = row ? row + ' ' + wd : wd;
      if (F.width(test, scale) > w && row) { out.push(row); row = wd; }
      else row = test;
    }
    if (row) out.push(row);
    return out.length ? out : [''];
  }

  function drawIntro(ctx, g, t) {
    const id = BEATS[IN_S.beat] ? BEATS[IN_S.beat].id : 'drop';
    if (id === 'universal') { drawUniversal(ctx, g, t); return; }
    else if (id === 'floor') drawFloor(ctx, g, t);
    else if (id === 'drag') drawDrag(ctx, g, t);
    else if (id === 'fist') drawFist(ctx, g, t);
    else drawDrop(ctx, g, t);

    if (IN_S.flash > 0) {
      ctx.fillStyle = 'rgba(255,90,77,' + (IN_S.flash * 0.5).toFixed(2) + ')';
      ctx.fillRect(0, 0, VW, VH);
    }

    /* What he says comes out of a bubble pointed at his head; what the film
       says comes up on a card. Both bang in with the same overshoot, so the
       whole cutscene has one bit of cartoon running through it. */
    const b = BEATS[IN_S.beat];
    if (b) {
      const full = b.lines[IN_S.line] || '';
      const chum = full.indexOf('MR CHUM:') === 0;
      const body = chum ? full.slice(9) : full;
      const shown = body.slice(0, Math.max(0, Math.floor(IN_S.chars) - (chum ? 9 : 0)));
      const CWID = chum ? 320 : VW - 76;
      let sc = 2, rows = wrap(shown, CWID, 2);
      if (rows.length > 2) { sc = 1; rows = wrap(shown, CWID, 1); }
      const done = Math.floor(IN_S.chars) >= full.length;
      const blink = Math.abs(Math.sin(t * 4)) > 0.4;
      if (chum) {
        speech(ctx, {
          cx: 276, tipX: 104, ty: 92, rows, scale: sc, pop: IN_S.pop, t,
          fill: '#f2ece0', light: '#ffffff', dark: '#ad9f88', ink: '#1a1020',
          foot: done ? 'E / TAP' : null, foot2: blink ? '#1a1020' : '#ad9f88'
        });
      } else {
        captionCard(ctx, rows, sc, IN_S.pop, t, done && blink ? 'E / TAP' : null);
      }
    }
    X.plate(ctx, VW - 62, 4, 56, 13, 'rgba(6,3,14,0.7)', null, null, 3);
    F.draw(ctx, 'ESC  SKIP', VW - 10, 7, 'rgba(178,162,216,0.9)', { right: true, shadow: '#000000' });
  }

  PD.chum = {
    enterIntro, updateIntro, drawIntro, enterGamble, B_OF,
    call, update, draw, active, takeCut, drawDebt, DEBT0, S, IN_S, HS, LESSONS,
    leadStep, drawMini, miniFrame, MS, MW, MH, MCX, MBASE,
    artFor: ensureArt, CW, CH, CCX, CBASE, UNI, CAM, CROWD,
    /* the house style, shared with the room you walk through to get here */
    reelWorld, HUES
  };
})(window.PD);

/* ===== src/travel.js ===== */
/* THE CROSSING, both ways.
   Picking a world on the chart used to teleport you there between two frames.
   Now you fly it, and when you are done you fly home again with the hold full.

   The trip out is the sharper one: a launch off the moon, a run through a rock
   field that is genuinely trying to hit you, a burn-in and a landing. The trip
   home is the chill one -- half the rocks, a shorter haul, and mostly things to
   look at rather than dodge.

   Neither leg is a shooting gallery. Rocks drift rather than sprint, every one
   is telegraphed, and there is as much out there worth steering TOWARDS as
   away from: scrap to scoop, repair kits, Reaver skiffs that whistle past,
   Nova Watch cutters that scan you and lose interest, drifting hulks and one
   enormous animal that has no opinion about any of it.

   Three upgrades make it easier -- a WARP COIL that shortens the trip and
   sharpens the turn, a DEFLECTOR that eats rocks before they reach the paint,
   and a NAV COMPUTER that calls them out early. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const X = PD.pxd;
  const F = PD.font;
  const A = PD.audio;
  const FX = PD.fx;
  const D = PD.data;

  const VW = 480, VH = 270;
  const LANE = { x0: 30, x1: 300, y0: 30, y1: VH - 34 };
  const MOON_TINT = '#8e86a8';

  const S = {
    phase: 'launch', t: 0, index: 0, body: null, dir: 'out', ore: 0,
    dur: 14, dist: 0, rocks: [], things: [], stars: [], dust: [], bits: [],
    px: 90, py: VH / 2, vx: 0, vy: 0, tilt: 0,
    hits: 0, shield: 0, shieldMax: 0, shieldT: 0, invuln: 0,
    shake: 0, spawn: 0, evt: 0, handling: 1, navLead: 0, fieldK: 1,
    planet: null, moon: null, legs: 0, touched: 0, saidT: 0, said: '',
    flashT: 0, flashCol: '#ffffff', gained: 0
  };

  /* ------------------------------------------------------------------ setup */
  function lump(r, n) {
    const pts = [];
    n = n || U.randInt(6, 9);
    for (let i = 0; i < n; i++) {
      const a = i * U.TAU / n + U.rand(-0.18, 0.18);
      const rr = r * U.rand(0.7, 1.26);
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    return pts;
  }

  function common(g, index) {
    const upg = g.save.upg;
    const warp = upg.warp || 0, defl = upg.deflector || 0, nav = upg.navcom || 0;
    S.t = 0; S.index = index; S.body = D.BODIES[index];
    S.dist = 0;
    S.rocks.length = 0; S.things.length = 0; S.dust.length = 0; S.bits.length = 0;
    S.px = 74; S.py = VH / 2; S.vx = 0; S.vy = 0; S.tilt = 0;
    S.hits = 0; S.invuln = 0; S.shake = 0; S.spawn = 1.4; S.evt = U.rand(3, 6);
    S.shieldMax = defl; S.shield = defl; S.shieldT = 0;
    S.handling = 1 + warp * 0.09;
    S.navLead = nav * 0.28;
    S.legs = 0; S.touched = 0; S.flashT = 0; S.gained = 0;
    S.stars = [];
    for (let i = 0; i < 150; i++) {
      S.stars.push({ x: U.rand(0, VW), y: U.rand(0, VH), z: U.rand(0.25, 1), s: U.chance(0.12) ? 2 : 1 });
    }
    if (!S.moon) S.moon = PD.arthome.buildPlanet(320, MOON_TINT, 4, 'moon');
    S.planet = PD.arthome.buildPlanet(320, S.body.tint, 100 + index * 17, planetKind(S.body.type));
    A.sfx.warp();
    g.state = 'travel';
    return warp;
  }

  /* Out: the long leg, the full field, and the hull you arrive with matters. */
  function enter(g, index) {
    const warp = common(g, index);
    S.dir = 'out'; S.phase = 'launch'; S.ore = 0;
    PD.chum.call(g, 'travel');
    S.dur = Math.max(7, (11 + index * 2.6) * (1 - warp * 0.06));
    S.fieldK = 1 - (g.save.upg.navcom || 0) * 0.05;
    say('DEPARTING. NOBODY WAVED.');
  }

  /* Home: shorter, thinner, and nothing out there can take the hold off you --
     it can only shake a rock or two loose. You have earned a quiet ride. */
  function enterReturn(g, ore) {
    const warp = common(g, g.bodyIndex || 0);
    S.dir = 'home'; S.phase = 'launch'; S.ore = ore || 0;
    S.dur = Math.max(6, (8 + S.index * 1.5) * (1 - warp * 0.06));
    S.fieldK = (1 - (g.save.upg.navcom || 0) * 0.05) * 0.55;
    S.evt = U.rand(2, 4);
    say(S.ore > 0 ? 'HOLD IS FULL. GOING HOME.' : 'NOTHING IN THE HOLD. GOING HOME ANYWAY.');
  }

  function planetKind(type) {
    if (type === 'ice') return 'ice';
    if (type === 'volcanic') return 'volcanic';
    if (type === 'gem' || type === 'titan') return 'gem';
    if (type === 'metal') return 'metal';
    if (type === 'core') return 'core';
    if (type === 'terra') return 'terra';
    return 'moon';
  }

  function say(line) { S.said = line; S.saidT = 3; }
  function fromTint() { return S.dir === 'out' ? MOON_TINT : S.body.tint; }
  function toTint() { return S.dir === 'out' ? S.body.tint : MOON_TINT; }
  function toName() { return S.dir === 'out' ? S.body.name : 'HOME'; }
  function toCanvasImg() { return S.dir === 'out' ? S.planet : S.moon; }

  /* ----------------------------------------------------------------- update */
  function update(dt, g) {
    S.t += dt;
    S.shake = Math.max(0, S.shake - dt * 3.2);
    S.invuln = Math.max(0, S.invuln - dt);
    S.saidT = Math.max(0, S.saidT - dt);
    S.flashT = Math.max(0, S.flashT - dt * 3.4);

    const IN = PD.input;
    if (IN.hit('Escape') && S.phase !== 'land' && S.dir === 'out') { g.openChart(); return; }

    for (const st of S.stars) {
      st.x -= (40 + st.z * 300) * dt * speedK();
      if (st.x < 0) { st.x += VW; st.y = U.rand(0, VH); }
    }
    for (let i = S.dust.length - 1; i >= 0; i--) {
      const d = S.dust[i];
      d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt;
      d.vx *= 1 - dt * 1.4; d.vy *= 1 - dt * 1.4;
      if (d.life <= 0) S.dust.splice(i, 1);
    }
    // pieces of his own ship, tumbling away behind him for ever
    for (let i = S.bits.length - 1; i >= 0; i--) {
      const b = S.bits[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.va * dt; b.life -= dt;
      if (b.life <= 0) S.bits.splice(i, 1);
    }

    if (S.phase === 'launch') { launch(dt); return; }
    if (S.phase === 'cruise') { cruise(dt, g); return; }
    if (S.phase === 'approach') { approach(dt, g); return; }
    land(dt, g);
  }

  function speedK() {
    if (S.phase === 'launch') return U.clamp(S.t / 1.8, 0, 1);
    if (S.phase === 'approach') return 1 - U.smoothstep(0, 2.4, S.t) * 0.7;
    if (S.phase === 'land') return 0.06;
    return 1;
  }

  function launch(dt) {
    const f = U.clamp(S.t / 1.8, 0, 1);
    S.py = U.lerp(VH + 40, VH / 2, U.smoothstep(0, 1, f));
    S.px = 74;
    if (U.chance(0.9)) {
      S.dust.push({ x: S.px - 8, y: S.py + 10, vx: U.rand(-40, -160), vy: U.rand(-24, 46),
        life: U.rand(0.3, 0.8), col: U.chance(0.4) ? '#ffd27a' : '#ff8a3d', r: U.rand(1, 3) });
    }
    if (S.t > 1.8) {
      S.phase = 'cruise'; S.t = 0;
      say(S.dir === 'out' ? 'WATCH THE ROCKS.' : 'EASY DOES IT.');
    }
  }

  /* Steering is a thrust, not a teleport, so the pod has weight and the coil
     is worth buying. Pointer, keys and the phone stick all feed the same two
     numbers, so nothing is second-class. */
  function steer(dt) {
    const IN = PD.input;
    const m = IN.mouse;
    const acc = 700 * S.handling;
    let ax = 0, ay = 0;
    const axis = PD.touch.axis ? PD.touch.axis() : null;
    if (axis && axis.on) { ax = axis.x; ay = axis.y; }
    else {
      if (IN.down('left')) ax -= 1;
      if (IN.down('right')) ax += 1;
      if (IN.down('up')) ay -= 1;
      if (IN.down('down')) ay += 1;
      // holding the pointer flies straight at it -- the thing everyone tries
      if (!ax && !ay && m.inside && m.left) {
        const dx = m.x - S.px, dy = m.y - S.py;
        const d = Math.max(1, Math.hypot(dx, dy));
        if (d > 3) { ax = dx / d; ay = dy / d; }
      }
    }
    S.vx += ax * acc * dt; S.vy += ay * acc * dt;
    S.vx *= 1 - Math.min(0.6, dt * 4.6); S.vy *= 1 - Math.min(0.6, dt * 4.6);
    S.px = U.clamp(S.px + S.vx * dt, LANE.x0, LANE.x1);
    S.py = U.clamp(S.py + S.vy * dt, LANE.y0, LANE.y1);
    if (S.px <= LANE.x0 || S.px >= LANE.x1) S.vx *= 0.3;
    if (S.py <= LANE.y0 || S.py >= LANE.y1) S.vy *= 0.3;
    S.tilt = U.damp(S.tilt, U.clamp(S.vy / 260, -1, 1), 0.3, dt);
    if (U.chance(0.6)) {
      S.dust.push({ x: S.px - 11, y: S.py + 2, vx: U.rand(-120, -200), vy: U.rand(-12, 12),
        life: U.rand(0.12, 0.3), col: U.chance(0.5) ? '#7ef9ff' : '#ffd27a', r: 1 });
    }
  }

  /* Rocks drift. The big ones drift SLOWEST, so the scary-looking thing is
     always the one you have the most time to get round. */
  function spawnRock() {
    const hard = U.clamp(S.t / S.dur, 0, 1);
    const big = U.chance(0.28);
    const r = big ? U.rand(11, 19) : U.rand(4, 8);
    const y = U.rand(LANE.y0 - 6, LANE.y1 + 6);
    const lead = S.navLead * 110;
    const speed = big ? U.rand(44, 72) : (62 + hard * 44 + U.rand(0, 34));
    S.rocks.push({
      x: VW + 24 + lead, y, r, pts: lump(r),
      vx: -speed, vy: U.rand(-14, 14),
      a: U.rand(0, U.TAU), va: U.rand(-1.8, 1.8),
      ice: U.chance(0.22)
    });
  }

  /* --------------------------------------------------------------- the traffic
     Everything that is not a rock. Some of it is worth flying into. */
  const NPC_LINES = {
    skiff: ['REAVER SKIFF: NICE POD. SHAME.', 'BLUEFIN WHISTLED AT YOU.', 'REAVER SKIFF: OI.'],
    patrol: ['NOVA WATCH: SCANNING. ...CARRY ON.', 'NOVA WATCH: WE HAVE A FORM FOR THAT.', 'NOVA WATCH: DO NOT DESTROY ANY PLANETS.'],
    hulk: ['SOMEBODY ELSE GOT UNLUCKY HERE.', 'THE DISTRESS LIGHT IS STILL ON.'],
    whale: ['IT DOES NOT CARE ABOUT YOU.', 'IT HUMMED. YOU HUMMED BACK.'],
    scrap: ['FREE SCRAP. THE BEST KIND.'],
    patch: ['A REPAIR KIT. SOMEONE WAS ORGANISED.'],
    rat: ['BRENDA\'S COUSIN. HE DOES NOT WAVE BACK.', 'A RAT. IN A SHIP. WITH CHEESE.', 'HE IS DOING BETTER THAN YOU.'],
    bus: ['A TOUR BUS. THEY PHOTOGRAPHED YOU.', 'TOUR GUIDE: AND ON YOUR LEFT, NOTHING.', 'FOURTEEN TOURISTS SAW YOUR DENTS.'],
    busker: ['SOMEONE IS PLAYING MUSIC AT SPACE.', 'THE SPEAKER IS BIGGER THAN THE SHIP.', 'IT IS NOT A GOOD SONG.']
  };

  function spawnThing() {
    const pool = S.dir === 'out'
      ? ['scrap', 'scrap', 'patch', 'skiff', 'patrol', 'hulk', 'whale', 'comet', 'rat', 'bus', 'busker']
      : ['scrap', 'scrap', 'patch', 'patch', 'whale', 'hulk', 'patrol', 'rat', 'bus', 'busker', 'skiff'];
    const kind = U.pick(pool);
    const y = U.rand(LANE.y0 + 10, LANE.y1 - 10);
    const t = { kind, x: VW + 30, y, a: 0, va: 0, got: 0, said: 0, r: 10, vy: 0 };
    if (kind === 'scrap') { t.vx = -80; t.r = 8; t.pts = lump(8, 5); t.va = 1.1; }
    else if (kind === 'patch') { t.vx = -76; t.r = 8; }
    else if (kind === 'skiff') { t.vx = -290; t.r = 12; t.vy = U.rand(-16, 16); }
    else if (kind === 'patrol') { t.vx = -54; t.r = 16; }
    else if (kind === 'hulk') { t.vx = -38; t.r = 26; t.pts = lump(26, 9); t.va = 0.22; }
    else if (kind === 'whale') { t.vx = -30; t.r = 30; t.y = U.rand(60, VH - 70); }
    else if (kind === 'rat') { t.vx = -120; t.r = 12; t.vy = U.rand(-8, 8); }
    else if (kind === 'bus') { t.vx = -46; t.r = 22; }
    else if (kind === 'busker') { t.vx = -70; t.r = 12; t.notes = []; }
    else { t.vx = -58; t.r = 13; t.pts = lump(13, 8); t.va = 0.8; }   // comet
    return t;
  }

  const SOLID = { hulk: 1, comet: 1 };
  const PICKUP = { scrap: 1, patch: 1 };

  function takeThing(t, g) {
    t.got = 1;
    if (t.kind === 'scrap') {
      const v = Math.round((120 + S.index * 90) * U.rand(0.8, 1.4));
      g.save.credits += v; g.save.totalEarned += v; S.gained += v;
      say('+$' + U.fmt(v) + ' OF SOMEBODY ELSE\'S SHIP');
      A.sfx.coin();
    } else {
      if (S.hits > 0) { S.hits--; say('PATCHED. GOOD AS SOME OTHER SHIP.'); }
      else if (S.shield < S.shieldMax) { S.shield++; say('SHIELD BACK UP.'); }
      else { const v = 140; g.save.credits += v; g.save.totalEarned += v; S.gained += v; say('NOTHING BROKEN. SOLD IT.'); }
      A.sfx.buy ? A.sfx.buy() : A.sfx.coin();
    }
    for (let i = 0; i < 16; i++) {
      S.dust.push({ x: t.x, y: t.y, vx: U.rand(-90, 90), vy: U.rand(-90, 90),
        life: U.rand(0.2, 0.5), col: t.kind === 'scrap' ? '#ffd34d' : '#8affa0', r: U.rand(1, 2) });
    }
  }

  /* A hit takes a piece OFF him: a panel, a fin, the dish. It tumbles away and
     the pod is drawn with that piece missing for the rest of the trip. */
  /* Placed on the hull the sprite actually has: the rim runs from about -33
     to +33 across and +2 to +14 down, with the dome above it. A hole in empty
     space is not damage, it is a bug you can see. */
  const PARTS = [
    { x: 17, y: 7, w: 14, h: 7 }, { x: -19, y: 8, w: 13, h: 7 },
    { x: 0, y: 12, w: 15, h: 6 }, { x: 27, y: 4, w: 11, h: 6 },
    { x: -28, y: 4, w: 11, h: 6 }
  ];

  function shed(n) {
    for (let i = 0; i < n && S.hits + i - 1 < PARTS.length; i++) {
      const p = PARTS[(S.hits - 1 + i) % PARTS.length];
      S.bits.push({
        x: S.px + p.x * 0.6, y: S.py + p.y * 0.6, w: p.w * 0.6, h: p.h * 0.6,
        vx: U.rand(-170, -60), vy: U.rand(-70, 70), a: 0, va: U.rand(-5, 5), life: 4
      });
    }
  }

  function hitPod(g, soft) {
    if (S.invuln > 0) return;
    if (S.shield > 0) {
      S.shield--; S.shieldT = 0;
      S.invuln = 0.6; S.shake = 0.5;
      S.flashT = 0.8; S.flashCol = '#7ef9ff';
      A.sfx.tone(880, { type: 'square', to: 300, dur: 0.14, vol: 0.11 });
      for (let i = 0; i < 14; i++) {
        S.dust.push({ x: S.px, y: S.py, vx: U.rand(-160, 160), vy: U.rand(-160, 160),
          life: U.rand(0.2, 0.5), col: '#7ef9ff', r: U.rand(1, 2) });
      }
      return;
    }
    S.hits++;
    S.invuln = 1.4; S.shake = 1;
