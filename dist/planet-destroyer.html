<title>Planet Destroyer</title>
<meta name="description" content="A 2D pixel-art mining sandbox: drill asteroids to the core, get obscenely rich, take over the galaxy.">
<style>
:root {
  --ink: #05030f;
  --grape: #1d1338;
  --edge: #5b3f96;
  --gold: #ffd34d;
  --pink: #ff5fa8;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--ink);
  color: #f2e9ff;
  font-family: "Courier New", ui-monospace, monospace;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}

#screen {
  display: block;
  width: 100vw;
  height: 100vh;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: crosshair;
  background: var(--ink);
}

/* Subtle scanline + vignette laid over the canvas for that CRT arcade feel. */
#crt {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.14) 0px,
      rgba(0, 0, 0, 0.14) 1px,
      rgba(0, 0, 0, 0) 1px,
      rgba(0, 0, 0, 0) 3px
    ),
    radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
  mix-blend-mode: multiply;
  opacity: 0.85;
  z-index: 5;
}

#boot {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: var(--ink);
  z-index: 10;
  text-align: center;
  padding: 24px;
}

#boot h1 {
  margin: 0;
  font-size: clamp(24px, 6vw, 54px);
  letter-spacing: 4px;
  color: var(--gold);
  text-shadow: 4px 4px 0 #7a2a10;
}

#boot h2 {
  margin: 0;
  font-size: clamp(18px, 4.5vw, 40px);
  letter-spacing: 3px;
  color: var(--pink);
  text-shadow: 4px 4px 0 #3a0c30;
}

#boot p { margin: 0; color: #9c8ec4; max-width: 34em; line-height: 1.5; }

#boot .err {
  color: #ff6b8a;
  border: 1px solid #8a2f4a;
  background: #200a18;
  padding: 10px 14px;
  max-width: 40em;
  text-align: left;
  white-space: pre-wrap;
}

.hidden { display: none !important; }

</style>

<canvas id="screen" width="960" height="540"></canvas>
<div id="crt"></div>
<div id="boot">
  <h1>PLANET</h1>
  <h2>DESTROYER</h2>
  <p>Loading the drill&hellip;</p>
</div>

<script>
/* ===== src/util.js ===== */
/* Planet Destroyer -- small math / helper library.
   Everything hangs off the single global PD namespace so the game can run
   straight off the filesystem (classic scripts, no module loader needed). */
window.PD = window.PD || {};

(function (PD) {
  'use strict';

  const TAU = Math.PI * 2;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function invLerp(a, b, v) { return b === a ? 0 : (v - a) / (b - a); }
  function smoothstep(a, b, v) { const t = clamp(invLerp(a, b, v), 0, 1); return t * t * (3 - 2 * t); }

  /* Frame-rate independent exponential approach: `t` is the fraction covered
     in one second. Used for camera and meter easing. */
  function damp(a, b, t, dt) { return lerp(a, b, 1 - Math.pow(1 - t, dt * 60)); }

  function rand(a, b) {
    if (a === undefined) return Math.random();
    if (b === undefined) return Math.random() * a;
    return a + Math.random() * (b - a);
  }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function chance(p) { return Math.random() < p; }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* table is [[value, weight], ...] */
  function weighted(table) {
    let total = 0;
    for (let i = 0; i < table.length; i++) total += table[i][1];
    let r = Math.random() * total;
    for (let i = 0; i < table.length; i++) {
      r -= table[i][1];
      if (r <= 0) return table[i][0];
    }
    return table[table.length - 1][0];
  }

  /* Deterministic hash noise -- keeps tile speckle stable between frames.
     Math.imul throughout: a plain float multiply here overflows 2^53 and
     silently throws away the low bits, which badly skews the distribution. */
  function hash2(x, y) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Cheap value noise built on hash2 -- plenty for ore veins and cave blobs. */
  function noise2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi), b = hash2(xi + 1, yi);
    const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }

  function fbm(x, y, octaves) {
    let sum = 0, amp = 0.5, norm = 0;
    for (let i = 0; i < (octaves || 3); i++) {
      sum += noise2(x, y) * amp;
      norm += amp;
      amp *= 0.5; x *= 2; y *= 2;
    }
    return sum / norm;
  }

  /* Turn "I want the top f fraction of tiles" into an fbm threshold.
     fbm() is roughly normal (mean ~0.52, sd ~0.15), so we go through a small
     inverse-normal table instead of guessing cutoffs. */
  const QZ = [
    [0.00, 3.2], [0.01, 2.33], [0.02, 2.05], [0.05, 1.645], [0.10, 1.282],
    [0.15, 1.036], [0.20, 0.842], [0.25, 0.674], [0.30, 0.524], [0.40, 0.253],
    [0.50, 0], [0.60, -0.253], [0.70, -0.524], [0.80, -0.842], [0.90, -1.282],
    [1.00, -3.2]
  ];
  function probitTop(f) {
    f = clamp(f, 0, 1);
    for (let i = 1; i < QZ.length; i++) {
      if (f <= QZ[i][0]) {
        const t = (f - QZ[i - 1][0]) / (QZ[i][0] - QZ[i - 1][0]);
        return lerp(QZ[i - 1][1], QZ[i][1], t);
      }
    }
    return -3.2;
  }
  function fbmThreshold(f, mean, sd) {
    return (mean === undefined ? 0.52 : mean) + (sd === undefined ? 0.15 : sd) * probitTop(f);
  }

  function dist(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return Math.sqrt(dx * dx + dy * dy); }
  function dist2(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; }

  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  /* Shortest signed angle from a to b. */
  function angleDelta(a, b) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }

  const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
  function fmt(n) {
    n = Math.floor(n);
    if (Math.abs(n) < 1000) return String(n);
    let tier = 0;
    let v = n;
    while (Math.abs(v) >= 1000 && tier < SUFFIX.length - 1) { v /= 1000; tier++; }
    const s = v < 10 ? v.toFixed(2) : (v < 100 ? v.toFixed(1) : v.toFixed(0));
    return s.replace(/\.0+$/, '') + SUFFIX[tier];
  }

  function fmtKg(kg) {
    return (kg < 10 ? kg.toFixed(1) : Math.round(kg).toString()) + 'kg';
  }

  function roman(n) {
    const map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
    let out = '';
    for (const [v, s] of map) { while (n >= v) { out += s; n -= v; } }
    return out || 'I';
  }

  PD.util = {
    TAU, clamp, lerp, invLerp, smoothstep, damp,
    rand, randInt, chance, pick, shuffle, weighted,
    hash2, mulberry32, noise2, fbm, probitTop, fbmThreshold,
    dist, dist2, aabb, angleDelta,
    fmt, fmtKg, roman
  };
})(window.PD);

/* ===== src/pix.js ===== */
/* A tiny pixel-pushing helper.
   Sprites are painted at their true pixel size with hard-edged primitives, then
   `outline()` traces a dark border around everything -- which is what gives the
   whole game its chunky cartoon look for free. */
(function (PD) {
  'use strict';

  function Pix(w, h) {
    this.w = w; this.h = h;
    this.d = new Array(w * h).fill(null);
  }

  Pix.prototype.idx = function (x, y) { return y * this.w + x; };

  Pix.prototype.set = function (x, y, c) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return this;
    this.d[y * this.w + x] = c;
    return this;
  };

  Pix.prototype.get = function (x, y) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null;
    return this.d[y * this.w + x];
  };

  Pix.prototype.rect = function (x, y, w, h, c) {
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c);
    return this;
  };

  Pix.prototype.ellipse = function (cx, cy, rx, ry, c) {
    const x0 = Math.floor(cx - rx - 1), x1 = Math.ceil(cx + rx + 1);
    const y0 = Math.floor(cy - ry - 1), y1 = Math.ceil(cy + ry + 1);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) this.set(x, y, c);
      }
    }
    return this;
  };

  Pix.prototype.disc = function (cx, cy, r, c) { return this.ellipse(cx, cy, r, r, c); };

  /* Rounded rectangle -- corners are simply clipped by a distance test. */
  Pix.prototype.round = function (x, y, w, h, r, c) {
    for (let j = 0; j < h; j++) {
      for (let i = 0; i < w; i++) {
        const px = i < r ? r - i - 0.5 : (i >= w - r ? i - (w - r) + 0.5 : 0);
        const py = j < r ? r - j - 0.5 : (j >= h - r ? j - (h - r) + 0.5 : 0);
        if (px * px + py * py > r * r) continue;
        this.set(x + i, y + j, c);
      }
    }
    return this;
  };

  Pix.prototype.line = function (x0, y0, x1, y1, c) {
    x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    for (;;) {
      this.set(x0, y0, c);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
    return this;
  };

  /* Isoceles triangle pointing up (dir -1) or down (dir 1). */
  Pix.prototype.spike = function (x, y, w, h, dir, c) {
    for (let j = 0; j < h; j++) {
      const t = j / h;
      const half = Math.max(0, (w / 2) * (1 - t));
      const yy = dir > 0 ? y + j : y + h - 1 - j;
      for (let i = -half; i <= half; i++) this.set(x + i, yy, c);
    }
    return this;
  };

  /* Mirror the left half onto the right half -- keeps faces symmetrical. */
  Pix.prototype.mirrorX = function () {
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w / 2; x++) {
        this.set(this.w - 1 - x, y, this.get(x, y));
      }
    }
    return this;
  };

  Pix.prototype.replace = function (from, to) {
    for (let i = 0; i < this.d.length; i++) if (this.d[i] === from) this.d[i] = to;
    return this;
  };

  /* Trace a border around every filled pixel. */
  Pix.prototype.outline = function (c) {
    const snap = this.d.slice();
    const at = (x, y) => (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : snap[y * this.w + x];
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        if (at(x, y)) continue;
        if (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1)) this.set(x, y, c);
      }
    }
    return this;
  };

  /* Darken the lower-right facing pixels of a colour to fake a light source. */
  Pix.prototype.shade = function (from, to, dx, dy) {
    const snap = this.d.slice();
    const at = (x, y) => (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : snap[y * this.w + x];
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        if (at(x, y) !== from) continue;
        const n = at(x + dx, y + dy);
        if (n === null || n !== from) this.set(x, y, to);
      }
    }
    return this;
  };

  Pix.prototype.toCanvas = function () {
    const cv = document.createElement('canvas');
    cv.width = this.w; cv.height = this.h;
    const ctx = cv.getContext('2d');
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        const c = this.d[y * this.w + x];
        if (!c) continue;
        ctx.fillStyle = c;
        ctx.fillRect(x, y, 1, 1);
      }
    }
    return cv;
  };

  PD.Pix = Pix;
  PD.pix = (w, h) => new Pix(w, h);
})(window.PD);

  /* ------------------------------------------------------------------- bodies

      p.set(15, cy - 1, C.white); p.set(15, cy, C.white);

    p.set(14, cy + 3, P.skinD);

    // antenna with bobble

    for (let i = 0; i < 5; i++) {

      p.line(tx, 17, tx + wob, 21, C.purpleD);

    p.ellipse(14, 10 + bob, 11, 8, C.purple);
    p.ellipse(9, 5 + bob, 4, 2, C.glassL);

    p.disc(16, 11 + bob, 2.8, C.red);

    p.ellipse(20, 16 + bob, 15, 11, C.metD);

    p.spike(5, 1, 9, 5, 1, cols[1]);

  icon('drill', p => { p.rect(1, 6, 6, 4, C.metDD); for (let x = 7; x < 15; x++) { const h = Math.max(1, 3 - (x - 7) * 0.35); for (let y = -h; y <= h; y++) p.set(x, 8 + y, ((x + y) % 3) ? C.met : C.metD); } });
  icon('arm', p => { p.rect(1, 7, 10, 3, C.metD); p.round(10, 4, 5, 9, 2, C.orange); p.rect(2, 8, 6, 1, C.met); });

  icon('thrust', p => { p.round(5, 1, 6, 8, 2, C.metD); p.spike(8, 9, 8, 6, 1, C.orange); p.spike(8, 9, 4, 4, 1, C.gold); });
  icon('gun', p => { p.round(1, 5, 10, 5, 2, C.metDD); p.rect(3, 9, 3, 4, C.suitD); p.rect(11, 6, 4, 3, C.cyan); });
  icon('coil', p => { p.disc(8, 8, 6, C.metD); p.disc(8, 8, 3, C.cyan); for (let i = 0; i < 4; i++) p.rect(7, 0 + i * 4, 2, 2, C.gold); });
  icon('lamp', p => { p.round(2, 4, 6, 8, 2, C.metD); p.spike(11, 8, 12, 8, 1, C.gold); p.rect(4, 6, 2, 4, C.white); });
  icon('magnet', p => { p.round(2, 2, 12, 10, 4, C.red); p.rect(5, 7, 6, 7, null); p.rect(2, 10, 4, 4, C.met); p.rect(10, 10, 4, 4, C.met); });
  icon('drone', p => { p.round(4, 5, 8, 6, 2, C.met); p.disc(8, 8, 2, C.cyan); p.rect(0, 3, 5, 1, C.metD); p.rect(11, 3, 5, 1, C.metD); });
  icon('claw', p => { p.rect(7, 1, 2, 6, C.metD); p.line(7, 7, 3, 13, C.met); p.line(9, 7, 13, 13, C.met); p.rect(2, 12, 3, 3, C.orange); p.rect(11, 12, 3, 3, C.orange); });

  /* ------------------------------------------------------------ cosmetics

     Cached by option ids -- a wardrobe change rebuilds three little sheets. */
  const skinCache = {};

  function optOf(catId, id) {
    const cat = PD.data.COS[catId];
    return cat.options.find(o => o.id === id) || cat.options[0];
  }

  function skinFor(cos) {
    cos = cos || {};
    const key = [cos.suit, cos.skin, cos.glass, cos.drill, cos.trim].join('|');
    if (skinCache[key]) return skinCache[key];

    const suit = optOf('suit', cos.suit), skin = optOf('skin', cos.skin);
    const glass = optOf('glass', cos.glass), bit = optOf('drill', cos.drill);
    const trim = optOf('trim', cos.trim);

    const P = {
      suit: suit.c[0], suitD: suit.c[1], suitL: suit.c[2],
      skin: skin.c[0], skinD: skin.c[1], skinL: skin.c[2],
      glass: glass.c[0], glassD: glass.c[1], glassL: glass.c[2]
    };
    const DP = { met: bit.c[0], metDD: bit.c[1], accent: bit.c[2] };
    const SP = { met: trim.c[0], metD: trim.c[1], metDD: trim.c[2] };

    const mk = (builders, ox, oy) => {
      const frames = builders.map(b => b.toCanvas());

      ship: mk([buildShip(false, SP), buildShip(true, SP)], 42, 26),

    };
    skinCache[key] = set;
    return set;
  }

  PD.art = { C, sprites, gemFor, ICON, skinFor, optOf, reg, pixOf: pix };
})(window.PD);

/* Interior art: the inside of the Rustmaw, its machinery and its crew.
   Same procedural pixel pipeline as everything else. */
(function (PD) {
  'use strict';
  const pix = PD.pix;
  const U = PD.util;
  const C = PD.art.C;

  const P = {
    wall: '#2b2740', wallD: '#1d1a30', wallL: '#3d3859',
    floor: '#3a3550', floorD: '#241f38', grate: '#4d4770',
    pipe: '#5a5478', pipeD: '#3a3556',
    steel: '#9aa3c4', steelD: '#5e6688', steelDD: '#3a4060',
    screen: '#0f2a2e', screenL: '#39ffa6', screenD: '#0a1a1e',
    amber: '#ffb03d', red: '#ff5a4d', cyan: '#58e8ff',
    holo: '#7ef9ff', holoD: '#2f8fae',
    rust: '#8a5a3a', gold: '#ffd34d', ink: '#120e22'
  };

  const S = {};
  function reg(name, builders, ox, oy) {
    const frames = builders.map(b => b.toCanvas());

  }

  /* --------------------------------------------------------- room backdrop
     Deck A of the Rustmaw. Layered top to bottom: ceiling ducting, viewports,
     a service catwalk, wall lockers, hazard band, then plated floor. */
  function room(w, h) {
    const p = pix(w, h);
    const floorY = h - 22;
    const rnd = U.mulberry32(31337);

    p.rect(0, 0, w, floorY, P.wall);

    // structural ribs, floor to ceiling
    for (let x = 0; x < w; x += 60) {
      p.rect(x, 0, 7, floorY, P.wallD);
      p.rect(x + 1, 0, 1, floorY, P.wallL);
      p.rect(x + 6, 0, 1, floorY, '#171426');
      for (let y = 22; y < floorY; y += 18) { p.set(x + 2, y, P.wallL); p.set(x + 4, y, P.wallL); }
    }
    // panel seams between ribs
    for (let x = 10; x < w; x += 60) {
      for (let y = 96; y < floorY - 30; y += 26) {
        p.rect(x, y, 46, 1, P.wallD);
        p.rect(x, y + 1, 46, 1, P.wallL);
      }
    }

    // --- ceiling: duct run, strip lights, valve wheels
    p.rect(0, 0, w, 16, P.wallD);
    p.rect(0, 16, w, 3, P.pipeD);
    p.rect(0, 19, w, 1, P.wallL);
    for (let x = 0; x < w; x += 30) { p.rect(x, 2, 2, 12, P.steelDD); p.rect(x + 12, 5, 8, 2, P.pipe); }
    for (let x = 24; x < w; x += 72) {
      p.round(x, 20, 26, 6, 2, P.steelD);
      p.rect(x + 3, 22, 20, 3, '#fff0c0');
      p.rect(x + 3, 25, 20, 1, '#ffd88a');
    }
    for (let i = 0; i < 2; i++) {
      const y = 30 + i * 9;
      p.rect(0, y, w, 5, i ? P.pipeD : P.pipe);
      p.rect(0, y, w, 1, P.steel);
      for (let x = 26; x < w; x += 88) {
        p.round(x, y - 2, 7, 9, 2, P.steelD);
        p.disc(x + 3, y + 2, 3, P.steelDD);
      }
    }

    // --- viewports on to the void
    for (let x = 34; x < w - 40; x += 118) {
      p.round(x, 50, 46, 30, 9, P.steelDD);
      p.round(x + 3, 53, 40, 24, 7, '#070518');
      const r2 = U.mulberry32(x * 13 + 5);
      for (let i = 0; i < 22; i++) {
        p.set(x + 5 + Math.floor(r2() * 36), 55 + Math.floor(r2() * 20), r2() > 0.72 ? '#a9d8ff' : '#ffffff');
      }
      p.rect(x + 3, 64, 40, 1, 'rgba(0,0,0,0)');
      for (let i = 0; i < 4; i++) p.disc(x + 4 + i * 12, 51, 1.4, P.steel);
    }

    // --- service catwalk with railing and drooping cable

    p.rect(0, cw, w, 4, P.steelDD);
    p.rect(0, cw, w, 1, P.steel);
    for (let x = 0; x < w; x += 5) p.rect(x, cw + 4, 2, 3, P.steelDD);
    for (let x = 0; x < w; x += 26) { p.rect(x, cw - 11, 2, 11, P.steelD); }
    p.rect(0, cw - 12, w, 2, P.steelD);
    for (let x = 0; x < w; x += 3) {
      const sag = Math.sin(x * 0.09) * 3 + 4;
      p.set(x, cw + 8 + sag, '#241f38');
      p.set(x, cw + 9 + sag, P.pipeD);
    }

    // --- wall furniture between the ribs: lockers, screens, notices
    for (let x = 12; x < w - 50; x += 60) {
      const kind = Math.floor(rnd() * 3);
      const y = 128;
      if (kind === 0) {                                  // locker bank
        p.round(x, y, 44, 56, 2, P.steelDD);
        for (let i = 0; i < 2; i++) {
          p.round(x + 2 + i * 21, y + 2, 19, 52, 1, P.steelD);
          p.rect(x + 4 + i * 21, y + 6, 15, 1, P.steelDD);
          p.rect(x + 16 + i * 21, y + 26, 3, 5, P.steel);
        }
      } else if (kind === 1) {                           // wall monitor + notices
        p.round(x + 2, y, 40, 26, 2, P.steelDD);
        p.rect(x + 5, y + 3, 34, 20, P.screenD);
        for (let i = 0; i < 5; i++) p.rect(x + 7, y + 5 + i * 4, 6 + ((i * 11) % 24), 2, i ? P.screenL : P.amber);
        p.round(x + 6, y + 32, 14, 18, 1, '#c8c2b0');
        for (let i = 0; i < 5; i++) p.rect(x + 8, y + 35 + i * 3, 10, 1, '#8a8478');
        p.round(x + 24, y + 34, 14, 16, 1, '#c8c2b0');
        p.rect(x + 26, y + 37, 10, 8, P.red);
      } else {                                           // pipe stack + valve
        for (let i = 0; i < 3; i++) {
          p.rect(x + 4 + i * 10, y, 6, 56, i % 2 ? P.pipeD : P.pipe);
          p.rect(x + 4 + i * 10, y + 18 + i * 6, 6, 3, P.steelD);
        }
        p.disc(x + 34, y + 24, 7, P.steelDD);
        p.disc(x + 34, y + 24, 4, P.rust);
        p.rect(x + 27, y + 23, 14, 2, P.steel);
      }
    }

    // --- painted decal: the Rustmaw's own jolly roger
    const dx = Math.floor(w * 0.62), dy = 118;
    p.round(dx, dy, 30, 26, 8, '#3a3358');
    p.round(dx + 4, dy + 4, 22, 16, 6, P.gold);
    p.rect(dx + 8, dy + 9, 5, 5, P.ink);
    p.rect(dx + 17, dy + 9, 5, 5, P.ink);
    p.rect(dx + 11, dy + 17, 8, 2, P.gold);
    for (let i = 0; i < 4; i++) p.rect(dx + 10 + i * 3, dy + 19, 2, 4, P.gold);
    p.rect(dx + 9, dy + 19, 12, 1, P.ink);

    // --- hazard band just above the deck
    for (let x = 0; x < w; x += 8) {
      p.rect(x, floorY - 12, 4, 6, P.amber);
      p.rect(x + 4, floorY - 12, 4, 6, P.ink);
    }
    p.rect(0, floorY - 13, w, 1, P.steelD);
    p.rect(0, floorY - 6, w, 2, P.wallD);

    // --- floor
    p.rect(0, floorY, w, h - floorY, P.floor);
    p.rect(0, floorY, w, 2, P.grate);
    p.rect(0, floorY + 2, w, 1, P.floorD);
    for (let x = 0; x < w; x += 6) p.rect(x, floorY + 5, 3, h - floorY - 8, P.floorD);
    for (let x = 0; x < w; x += 42) p.rect(x, floorY, 1, h - floorY, P.wallD);

    for (let i = 0; i < w / 5; i++) {
      const rx = Math.floor(rnd() * w), ry = 40 + Math.floor(rnd() * (floorY - 60));
      p.rect(rx, ry, 1 + Math.floor(rnd() * 4), 1, rnd() > 0.5 ? P.wallD : '#211d34');
    }
    return p;
  }

  /* -------------------------------------------------------------- stations */
  function airlock() {
    const p = pix(46, 62);
    p.round(2, 2, 42, 58, 6, P.steelDD);
    p.round(5, 5, 36, 52, 5, P.steelD);

  function fabricator(spark) {

  function droneBay(lit) {

  function navChart(lit) {

    for (let i = 0; i < 9; i++) {
      p.set(10 + Math.floor(U.hash2(i, 5) * 56), 7 + Math.floor(U.hash2(i, 13) * 24), '#ffffff');
    }
    p.rect(8, 39, 60, 2, P.screenD);
    p.rect(9, 39, lit ? 40 : 18, 2, P.screenL);
    p.outline(P.ink);
    return p;

  function crate(kind) {
    const p = pix(22, 18);
    p.round(1, 2, 20, 16, 2, kind ? P.rust : P.steelD);
    p.rect(3, 5, 16, 2, kind ? '#a8724a' : P.steel);
    p.rect(3, 12, 16, 2, P.steelDD);
    p.rect(9, 2, 4, 16, P.steelDD);

  function plant() {
    const p = pix(20, 26);
    p.round(5, 17, 10, 9, 2, P.rust);
    p.rect(6, 19, 8, 1, '#a8724a');
    for (let i = 0; i < 5; i++) {
      const a = -1.9 + i * 0.5;
      p.line(10, 18, 10 + Math.cos(a) * 7, 18 + Math.sin(a) * 12, '#4dbb66');
      p.disc(10 + Math.cos(a) * 7, 18 + Math.sin(a) * 12, 2, '#7ff08a');

  /* ------------------------------------------------------------------- crew */
  /* NIX: the ship AI. A hovering holographic head with no body and no ethics. */
  function nix(phase) {
    const p = pix(26, 34);
    const bob = phase ? 1 : 0;
    // projector base
    p.round(7, 29, 12, 5, 2, P.steelD);
    p.round(9, 27, 8, 3, 1, P.steelDD);

    for (let y = 26; y > 20; y--) {

      p.rect(13 - wdt / 2, y, wdt, 1, P.holoD);

  function bolt(phase) {

    p.round(4, 22 - lift, 16, 8, 3, P.steelDD);   // tracked base
    p.rect(6, 27 - lift, 12, 3, P.ink);
    for (let i = 0; i < 4; i++) p.rect(6 + i * 3, 28 - lift, 2, 2, P.steelD);

    p.rect(9, 13 - lift, 2, 2, P.ink);

    p.round(4, 6, 20, 22, 3, '#2a5a6e');

    p.ellipse(14, y - 1, 6.4, 3.2, '#c8ff5a');
    p.ellipse(16.5, y - 1, 1.4, 1.8, P.ink);

  reg('airlock', [airlock()], 23, 62);
  reg('console', [console_(false), console_(true)], 29, 50);
  reg('fabricator', [fabricator(false), fabricator(true)], 35, 56);
  reg('dronebay', [droneBay(false), droneBay(true)], 31, 54);
  reg('wardrobe', [wardrobe(false), wardrobe(true)], 22, 60);
  reg('navchart', [navChart(false), navChart(true)], 38, 50);
  reg('crate', [crate(0), crate(1)], 11, 18);
  reg('plant', [plant()], 10, 26);
  reg('nix', [nix(0), nix(1)], 13, 34);
  reg('bolt', [bolt(0), bolt(1)], 12, 30);
  reg('gloop', [gloop(0), gloop(1)], 14, 34);

  /* ------------------------------------------------------- moon / planet art
     A big detailed body for the sky: maria, craters with rim light, a soft
     terminator and a thin lit limb. */
  function buildMoon(size, tint, seed) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const c = cv.getContext('2d');
    const r = size / 2 - 1;
    const cx = size / 2, cy = size / 2;
    const rnd = U.mulberry32(seed || 7);

    function shade(col, f) {
      const n = parseInt(col.slice(1), 16);
      const R = U.clamp(((n >> 16) & 255) * f, 0, 255) | 0;
      const G = U.clamp(((n >> 8) & 255) * f, 0, 255) | 0;
      const B = U.clamp((n & 255) * f, 0, 255) | 0;
      return 'rgb(' + R + ',' + G + ',' + B + ')';
    }

    c.fillStyle = shade(tint, 0.75);
    c.beginPath(); c.arc(cx, cy, r, 0, U.TAU); c.fill();

    c.save();
    c.beginPath(); c.arc(cx, cy, r, 0, U.TAU); c.clip();

    // maria: broad dark seas
    for (let i = 0; i < 6; i++) {
      const a = rnd() * U.TAU, d = rnd() * r * 0.7;
      c.fillStyle = shade(tint, 0.5 + rnd() * 0.12);
      c.beginPath();
      c.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r * (0.16 + rnd() * 0.24), 0, U.TAU);
      c.fill();
    }
    // craters, biggest first
    const craters = [];
    for (let i = 0; i < 46; i++) {
      const a = rnd() * U.TAU, d = Math.sqrt(rnd()) * r * 0.94;
      craters.push({ x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d, r: (0.5 + rnd() * rnd() * 5.5) * (size / 90) });
    }
    craters.sort((p1, p2) => p2.r - p1.r);
    for (const k of craters) {
      c.fillStyle = shade(tint, 0.98);          // sunlit upper rim
      c.beginPath(); c.arc(k.x, k.y - k.r * 0.16, k.r, 0, U.TAU); c.fill();
      c.fillStyle = shade(tint, 0.42);          // shadowed floor
      c.beginPath(); c.arc(k.x, k.y + k.r * 0.2, k.r * 0.78, 0, U.TAU); c.fill();
      c.fillStyle = shade(tint, 0.62);
      c.beginPath(); c.arc(k.x, k.y + k.r * 0.05, k.r * 0.5, 0, U.TAU); c.fill();
    }
    // dust speckle
    for (let i = 0; i < size * 3; i++) {
      c.fillStyle = shade(tint, rnd() > 0.5 ? 1.12 : 0.7);
      c.globalAlpha = 0.3;
      c.fillRect((rnd() * size) | 0, (rnd() * size) | 0, 1, 1);
    }
    c.globalAlpha = 1;

    // terminator: night creeping in from the lower left
    const term = c.createLinearGradient(0, size, size * 0.85, 0);
    term.addColorStop(0, 'rgba(4,2,12,0.94)');
    term.addColorStop(0.45, 'rgba(4,2,12,0.55)');
    term.addColorStop(0.8, 'rgba(4,2,12,0)');
    c.fillStyle = term;
    c.fillRect(0, 0, size, size);

    // lit limb
    c.strokeStyle = shade(tint, 1.5);
    c.lineWidth = Math.max(1, size / 90);
    c.beginPath(); c.arc(cx, cy, r - 0.5, -1.5, 0.7); c.stroke();
    c.restore();
    return cv;
  }

  PD.artint = { P, S, room, buildMoon };
})(window.PD);

    '_': ['.....', '.....', '.....', '.....', '.....', '.....', '#####'],
    '|': ['..#..', '..#..', '..#..', '..#..', '..#..', '..#..', '..#..']
  };

  const GW = 5, GH = 7, GAP = 1;
  const cache = {};   // color -> { char: canvas }

  function glyph(ch, color) {
    let byColor = cache[color];
    if (!byColor) byColor = cache[color] = {};
    if (byColor[ch]) return byColor[ch];
    const rows = G[ch] || G['?'];
    const cv = document.createElement('canvas');
    cv.width = GW; cv.height = GH;
    const c = cv.getContext('2d');
    c.fillStyle = color;
    for (let y = 0; y < GH; y++) {
      const r = rows[y];
      for (let x = 0; x < GW; x++) if (r[x] === '#') c.fillRect(x, y, 1, 1);
    }
    byColor[ch] = cv;
    return cv;
  }

  function width(str, scale) {
    scale = scale || 1;
    return str.length * (GW + GAP) * scale - GAP * scale;
  }

  /* opts: { scale, center, right, shadow, alpha } */
  function draw(ctx, str, x, y, color, opts) {
    opts = opts || {};
    const s = opts.scale || 1;
    str = String(str).toUpperCase();
    let px = Math.round(x);
    if (opts.center) px = Math.round(x - width(str, s) / 2);
    else if (opts.right) px = Math.round(x - width(str, s));
    const py = Math.round(y);
    if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;

    if (opts.shadow !== false) {
      let sx = px;
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (ch !== ' ') ctx.drawImage(glyph(ch, opts.shadow || '#150c28'), 0, 0, GW, GH, sx, py + s, GW * s, GH * s);
        sx += (GW + GAP) * s;

    let cx = px;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (ch !== ' ') ctx.drawImage(glyph(ch, color), 0, 0, GW, GH, cx, py, GW * s, GH * s);
      cx += (GW + GAP) * s;
    }
    if (opts.alpha !== undefined) ctx.globalAlpha = 1;
    return px;
  }

})(window.PD);

/* ===== src/audio.js ===== */
/* Everything you hear is synthesised on the fly with WebAudio -- no asset
   files, and the drill can track its pitch to how hard the rock is. */
(function (PD) {
  'use strict';
  const U = PD.util;

  let ctx = null, master = null, sfxBus = null, musBus = null, noiseBuf = null;
  let ready = false;
  const state = { sfx: true, music: true };

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    musBus = ctx.createGain(); musBus.gain.value = 0.34; musBus.connect(master);

    const len = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    ready = true;
  }

  function resume() {
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }

  const now = () => ctx.currentTime;

  function env(node, t0, peak, attack, decay, hold) {
    const g = node.gain;
    g.setValueAtTime(0.0001, t0);
    g.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + attack);
    if (hold) g.setValueAtTime(Math.max(0.0002, peak), t0 + attack + hold);
    g.exponentialRampToValueAtTime(0.0001, t0 + attack + (hold || 0) + decay);
  }

  function tone(freq, opts) {
    if (!ready || !state.sfx) return;
    opts = opts || {};
    const t0 = now() + (opts.delay || 0);
    const o = ctx.createOscillator();
    o.type = opts.type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (opts.to) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.to), t0 + (opts.dur || 0.12));
    const g = ctx.createGain();
    env(g, t0, opts.vol === undefined ? 0.2 : opts.vol, opts.attack || 0.005, opts.dur || 0.12, opts.hold || 0);
    let out = g;
    if (opts.filter) {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = opts.filter;
      g.connect(f); out = f;
    }
    o.connect(g); out.connect(sfxBus);
    o.start(t0); o.stop(t0 + (opts.dur || 0.12) + (opts.hold || 0) + 0.06);
  }

  function noise(opts) {
    if (!ready || !state.sfx) return;
    opts = opts || {};
    const t0 = now() + (opts.delay || 0);
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.playbackRate.value = opts.rate || 1;
    const f = ctx.createBiquadFilter();
    f.type = opts.type || 'lowpass';
    f.frequency.setValueAtTime(opts.from || 1800, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, opts.to || 300), t0 + (opts.dur || 0.2));
    f.Q.value = opts.q || 1;
    const g = ctx.createGain();
    env(g, t0, opts.vol === undefined ? 0.25 : opts.vol, opts.attack || 0.004, opts.dur || 0.2, opts.hold || 0);
    src.connect(f); f.connect(g); g.connect(sfxBus);
    src.start(t0); src.stop(t0 + (opts.dur || 0.2) + (opts.hold || 0) + 0.05);
  }

  /* ------------------------------------------------------- looping drill rig */
  let drillNodes = null;
  function drill(on, pitch) {
    if (!ready) return;
    if (on && state.sfx) {
      if (!drillNodes) {
        const src = ctx.createBufferSource();
        src.buffer = noiseBuf; src.loop = true;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 2.2;
        const lo = ctx.createOscillator(); lo.type = 'sawtooth'; lo.frequency.value = 62;
        const loG = ctx.createGain(); loG.gain.value = 0.05;
        const g = ctx.createGain(); g.gain.value = 0.0001;
        src.connect(bp); bp.connect(g); lo.connect(loG); loG.connect(g); g.connect(sfxBus);
        src.start(); lo.start();
        drillNodes = { src, bp, g, lo, loG };
      }
      const p = pitch || 0;
      drillNodes.bp.frequency.setTargetAtTime(560 + p * 900, now(), 0.05);
      drillNodes.lo.frequency.setTargetAtTime(52 + p * 40, now(), 0.05);
      drillNodes.g.gain.setTargetAtTime(0.16, now(), 0.02);
    } else if (drillNodes) {
      drillNodes.g.gain.setTargetAtTime(0.0001, now(), 0.05);
    }
  }

      const step = U.clamp(Math.log2(1 + value / 14) * 90, 0, 900);
      tone(620 + step, { type: 'triangle', dur: 0.1, vol: 0.16 });
      tone(930 + step, { type: 'sine', dur: 0.13, vol: 0.1, delay: 0.045 });
    },
    coin(i) {
      tone(880 + (i % 6) * 110, { type: 'square', dur: 0.07, vol: 0.09 });
      tone(1320 + (i % 6) * 110, { type: 'sine', dur: 0.1, vol: 0.06, delay: 0.03 });
    },
    sell() {
      [0, 4, 7, 12].forEach((s, i) => tone(523 * Math.pow(2, s / 12), { type: 'triangle', dur: 0.22, vol: 0.14, delay: i * 0.06 }));
    },
    shoot() {
      tone(1500, { type: 'square', to: 260, dur: 0.1, vol: 0.13, filter: 3000 });
      noise({ from: 3200, to: 800, dur: 0.06, vol: 0.08 });
    },
    hitMob() { noise({ from: 1700, to: 400, dur: 0.09, vol: 0.16 }); tone(300, { type: 'sawtooth', to: 160, dur: 0.07, vol: 0.08 }); },
    killMob() {
      noise({ from: 900, to: 120, dur: 0.3, vol: 0.2 });
      tone(420, { type: 'sawtooth', to: 70, dur: 0.28, vol: 0.12 });
    },
    hurt() {
      tone(180, { type: 'sawtooth', to: 70, dur: 0.26, vol: 0.2 });
      noise({ from: 700, to: 90, dur: 0.22, vol: 0.16 });
    },
    boom(size) {
      const s = size || 1;
      noise({ from: 1500 * s, to: 60, dur: 0.5 * s, vol: 0.34, rate: 0.7 });
      tone(120, { type: 'sine', to: 32, dur: 0.6 * s, vol: 0.3 });
      tone(220, { type: 'triangle', to: 55, dur: 0.35 * s, vol: 0.16, delay: 0.02 });
    },
    crack(i) {
      noise({ from: 900 + i * 320, to: 300, dur: 0.14, vol: 0.16, type: 'bandpass', q: 4 });
      tone(200 + i * 80, { type: 'square', to: 90, dur: 0.1, vol: 0.07 });
    },
    rumble() {
      noise({ from: 220, to: 40, dur: 1.6, vol: 0.3, rate: 0.4, attack: 0.6 });
    },
    dock() {
      [0, 5, 9].forEach((s, i) => tone(392 * Math.pow(2, s / 12), { type: 'triangle', dur: 0.34, vol: 0.12, delay: i * 0.05 }));
    },
    buy() {
      tone(660, { type: 'square', dur: 0.08, vol: 0.14 });
      tone(990, { type: 'square', dur: 0.14, vol: 0.12, delay: 0.07 });
    },
    deny() { tone(200, { type: 'square', to: 140, dur: 0.16, vol: 0.13 }); },
    click() { tone(1100, { type: 'square', dur: 0.04, vol: 0.07 }); },
    alarm() {
      tone(880, { type: 'square', dur: 0.11, vol: 0.11 });
      tone(880, { type: 'square', dur: 0.11, vol: 0.11, delay: 0.16 });
    },
    warp() {
      tone(180, { type: 'sawtooth', to: 2400, dur: 1.1, vol: 0.16, filter: 4000 });
      noise({ from: 200, to: 4000, dur: 1.1, vol: 0.12, attack: 0.5 });
    },
    fanfare() {
      [0, 4, 7, 12, 16, 19].forEach((s, i) =>
        tone(392 * Math.pow(2, s / 12), { type: 'triangle', dur: 0.4, vol: 0.15, delay: i * 0.11 }));
    }
  };

  /* --------------------------------------------------------------- the music
     Sleazy little villain groove: walking bass, minor arpeggio, hat pulse. */
  const SCALE = [0, 3, 5, 7, 10];          // minor pentatonic
  const BASS = [0, 0, 3, 0, -2, -2, 5, 3];
  let step = 0, nextTime = 0, musicOn = false, intensity = 0;
  const BPM = 96, SPB = 60 / BPM / 4;      // 16th notes

  function mnote(freq, t0, dur, type, vol) {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(musBus);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  function hz(semi) { return 55 * Math.pow(2, semi / 12); }

  function schedule() {
    if (!ready || !musicOn || !state.music) return;
    const lookahead = now() + 0.2;
    while (nextTime < lookahead) {
      const bar = Math.floor(step / 16) % 4;
      const s16 = step % 16;
      const root = BASS[(Math.floor(step / 8)) % BASS.length];

      if (s16 % 4 === 0) mnote(hz(root + 24), nextTime, 0.22, 'square', 0.11);            // bass
      if (s16 % 8 === 4) mnote(hz(root + 31), nextTime, 0.14, 'triangle', 0.07);
      if (s16 % 2 === 1) {                                                                // hat
        const src = ctx.createBufferSource(); src.buffer = noiseBuf;
        const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6500;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.05 + intensity * 0.04, nextTime);
        g.gain.exponentialRampToValueAtTime(0.0001, nextTime + 0.05);
        src.connect(f); f.connect(g); g.connect(musBus);
        src.start(nextTime); src.stop(nextTime + 0.07);
      }
      if (intensity > 0.2 && (s16 === 0 || s16 === 6 || s16 === 10)) {                     // kick
        mnote(58, nextTime, 0.16, 'sine', 0.2);
      }
      if (bar !== 3 || intensity > 0.4) {                                                  // arp
        const n = SCALE[(step * 3) % SCALE.length];
        if (s16 % 2 === 0) mnote(hz(root + 48 + n), nextTime, 0.1, 'square', 0.045 + intensity * 0.03);
      }
      step++;
      nextTime += SPB;
    }
  }

  function music(on) {
    init();
    musicOn = on;
    if (on && ready) { nextTime = Math.max(nextTime, now() + 0.05); }
  }

  function setIntensity(v) { intensity = U.clamp(v, 0, 1); }

  function toggleSfx(on) {
    state.sfx = on;
    if (!on) { drill(false); thrust(0); }
  }
  function toggleMusic(on) {
    state.music = on;
    if (musBus) musBus.gain.value = on ? 0.34 : 0;
  }

  // expose the raw synth voices on the sfx table too, so callers can reach
  // for a one-off beep without caring which namespace it lives in
  S.tone = tone;
  S.noise = noise;

  PD.audio = {
    init, resume, tone, noise, drill, thrust, music, schedule, setIntensity,
    toggleSfx, toggleMusic, state, sfx: S,
    get ok() { return ready; }
  };
})(window.PD);

/* ===== src/input.js ===== */
/* Keyboard + mouse. Screen coordinates are converted to the low-res internal
   canvas space by game.js, which owns the scale factor. */
(function (PD) {
  'use strict';

  const keys = {};        // held
  const pressed = {};     // edge-triggered, cleared each frame
  const released = {};

  const mouse = {
    sx: 0, sy: 0,          // css pixels inside the canvas element
    x: 0, y: 0,            // internal canvas pixels (filled by game)
    wx: 0, wy: 0,          // world pixels (filled by game)
    left: false, right: false,
    leftPressed: false, rightPressed: false,
    wheel: 0, inside: false
  };

  const ALIAS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
    Space: 'space', ShiftLeft: 'shift', ShiftRight: 'shift',
    Escape: 'esc', Enter: 'enter'
  };

  function code(e) { return ALIAS[e.code] || e.code; }

  let firstTouch = null;

  function attach(canvas) {
    window.addEventListener('keydown', e => {
      const c = code(e);
      if (!keys[c]) pressed[c] = true;
      keys[c] = true;
      if (['space', 'up', 'down', 'left', 'right', 'Tab'].indexOf(c) >= 0) e.preventDefault();
      if (firstTouch) firstTouch();
    });
    window.addEventListener('keyup', e => {
      const c = code(e);
      keys[c] = false;
      released[c] = true;
    });
    window.addEventListener('blur', () => {
      for (const k in keys) keys[k] = false;
      mouse.left = mouse.right = false;
    });

    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      mouse.sx = e.clientX - r.left;
      mouse.sy = e.clientY - r.top;
      mouse.inside = true;
    });
    canvas.addEventListener('mouseleave', () => { mouse.inside = false; });
    canvas.addEventListener('mousedown', e => {
      if (e.button === 0) { mouse.left = true; mouse.leftPressed = true; }
      if (e.button === 2) { mouse.right = true; mouse.rightPressed = true; }
      e.preventDefault();
      if (firstTouch) firstTouch();
    });
    window.addEventListener('mouseup', e => {
      if (e.button === 0) mouse.left = false;
      if (e.button === 2) mouse.right = false;
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { mouse.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
  }

  function onFirstInteraction(fn) { firstTouch = () => { fn(); firstTouch = null; }; }

  function endFrame() {
    for (const k in pressed) pressed[k] = false;
    for (const k in released) released[k] = false;
    mouse.leftPressed = false;
    mouse.rightPressed = false;
    mouse.wheel = 0;
  }

  const down = k => !!keys[k];
  const hit = k => !!pressed[k];

  PD.input = { keys, mouse, attach, endFrame, down, hit, onFirstInteraction };
})(window.PD);

/* ===== src/touch.js ===== */
/* Touch controls. A thumbstick for the jets, drag-to-aim that also drills,
   and chunky action keys -- all drawn into the low-res canvas so they look
   like part of the ship, not a browser overlay. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const F = PD.font;

  const VW = 480, VH = 270;

  const cfg = {
    stick: { x: 62, y: VH - 58, r: 34, knob: 15 },
    fire:  { x: VW - 40, y: VH - 40, r: 21, label: 'FIRE', col: '#7ef9ff' },
    use:   { x: VW - 40, y: VH - 92, r: 15, label: 'E', col: '#ffd34d' },
    beam:  { x: VW - 88, y: VH - 34, r: 14, label: 'R', col: '#ff8ad8' }
  };

  const state = {
    enabled: false, forced: null,
    stickId: null, sx: 0, sy: 0, dx: 0, dy: 0,
    aimId: null, ax: 0, ay: 0, aiming: false,
    fire: false, use: false, useEdge: false, beam: false,
    mode: 'play', tapX: 0, tapY: 0, tapPress: false, tapHold: false
  };

  function autoDetect() {
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    return coarse || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
  }

  let toScreen = null;      // set by game.js: css px -> internal px

  function attach(canvas, mapper) {
    toScreen = mapper;
    state.enabled = state.forced === null ? autoDetect() : state.forced;

    const hit = (p, c) => U.dist(p.x, p.y, c.x, c.y) <= c.r + 8;

    function pos(touch) {
      const r = canvas.getBoundingClientRect();
      return toScreen(touch.clientX - r.left, touch.clientY - r.top);
    }

    canvas.addEventListener('touchstart', e => {
      state.enabled = state.forced === null ? true : state.forced;
      for (const tch of e.changedTouches) {
        const p = pos(tch);
        state.tapX = p.x; state.tapY = p.y;
        if (state.mode !== 'play') { state.tapPress = true; state.tapHold = true; continue; }
        if (hit(p, cfg.fire)) { state.fire = true; continue; }
        if (hit(p, cfg.use)) { state.use = true; state.useEdge = true; continue; }
        if (hit(p, cfg.beam)) { state.beam = true; continue; }
        if (p.x < VW * 0.45) {
          state.stickId = tch.identifier;
          state.sx = p.x; state.sy = p.y; state.dx = 0; state.dy = 0;
        } else {
          state.aimId = tch.identifier;
          state.ax = p.x; state.ay = p.y; state.aiming = true;
        }
      }
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      for (const tch of e.changedTouches) {
        const p = pos(tch);
        state.tapX = p.x; state.tapY = p.y;
        if (tch.identifier === state.stickId) {
          const dx = p.x - state.sx, dy = p.y - state.sy;
          const d = Math.hypot(dx, dy) || 1;
          const k = Math.min(1, d / cfg.stick.r);
          state.dx = dx / d * k; state.dy = dy / d * k;
        } else if (tch.identifier === state.aimId) {
          state.ax = p.x; state.ay = p.y;
        }
      }
      e.preventDefault();
    }, { passive: false });

    function end(e) {
      for (const tch of e.changedTouches) {
        if (tch.identifier === state.stickId) { state.stickId = null; state.dx = state.dy = 0; }
        if (tch.identifier === state.aimId) { state.aimId = null; state.aiming = false; }
      }
      if (!e.touches.length) { state.fire = state.use = state.beam = false; state.tapHold = false; }
      e.preventDefault();
    }
    canvas.addEventListener('touchend', end, { passive: false });
    canvas.addEventListener('touchcancel', end, { passive: false });
  }

  /* Push the touch state into the shared input object before the game reads it. */
  function apply(mode) {
    state.mode = mode;
    if (!state.enabled) return;
    const IN = PD.input;

    if (mode === 'play') {
      const dz = 0.28;
      IN.keys.left = state.dx < -dz;
      IN.keys.right = state.dx > dz;
      IN.keys.up = state.dy < -dz;
      IN.keys.down = state.dy > dz;

      if (state.aiming) {
        IN.mouse.x = state.ax; IN.mouse.y = state.ay;
        IN.mouse.inside = true;
        IN.mouse.left = true;
      } else {
        IN.mouse.left = false;
      }
      IN.mouse.right = state.fire;
      if (state.useEdge) { IN.keys.KeyE = true; state.useEdge = false; }
      IN.keys.KeyR = state.beam;
    } else {
      // menus, interior and terminals: touches behave like a mouse
      IN.mouse.x = state.tapX; IN.mouse.y = state.tapY;
      IN.mouse.inside = true;
      IN.mouse.left = state.tapHold;
      if (state.tapPress) { IN.mouse.leftPressed = true; state.tapPress = false; }
    }
  }

  /* Called after apply() so a synthetic KeyE only lasts one frame. */
  function clearEdges() {
    if (!state.enabled) return;
    PD.input.keys.KeyE = false;
  }

  function ring(ctx, x, y, r, col, alpha, width) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = col;
    ctx.lineWidth = width || 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, U.TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function padBtn(ctx, c, pressed) {
    ctx.globalAlpha = pressed ? 0.5 : 0.24;
    ctx.fillStyle = c.col;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, U.TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ring(ctx, c.x, c.y, c.r, c.col, pressed ? 1 : 0.6, 2);
    F.draw(ctx, c.label, c.x, c.y - 3, '#ffffff', { center: true, shadow: false, alpha: pressed ? 1 : 0.85 });
  }

  function draw(ctx, mode) {
    if (!state.enabled || mode !== 'play') return;
    const s = cfg.stick;
    ring(ctx, s.x, s.y, s.r, '#7ef9ff', 0.35, 2);
    ring(ctx, s.x, s.y, s.r - 10, '#7ef9ff', 0.15, 1);
    const kx = s.x + state.dx * (s.r - s.knob), ky = s.y + state.dy * (s.r - s.knob);
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#7ef9ff';
    ctx.beginPath(); ctx.arc(kx, ky, s.knob, 0, U.TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ring(ctx, kx, ky, s.knob, '#eafcff', 0.8, 1);

    padBtn(ctx, cfg.fire, state.fire);
    padBtn(ctx, cfg.use, state.use);
    padBtn(ctx, cfg.beam, state.beam);

    // aim reticle while dragging
    if (state.aiming) {
      ring(ctx, state.ax, state.ay, 9, '#ffd34d', 0.9, 1);
      ring(ctx, state.ax, state.ay, 3, '#ffffff', 0.9, 1);
    } else {
      F.draw(ctx, 'DRAG RIGHT SIDE TO DRILL', VW - 6, VH - 128, 'rgba(255,255,255,0.35)', { right: true, shadow: false });
    }
  }

  function setEnabled(on) { state.forced = on; state.enabled = on; }

  PD.touch = { attach, apply, clearEdges, draw, setEnabled, cfg, state, get enabled() { return state.enabled; } };
})(window.PD);

/* ===== src/fx.js ===== */
/* Particles, floating numbers, shockwaves, screen shake -- the juice layer. */
(function (PD) {
  'use strict';
  const U = PD.util;

  const parts = [];
  const floaters = [];
  const rings = [];
  const chunks = [];
  let shakeAmt = 0, shakeT = 0;
  let flashAmt = 0, flashColor = '#ffffff';
  let freeze = 0;
  const MAXP = 1400;

  function reset() {
    parts.length = 0; floaters.length = 0; rings.length = 0; chunks.length = 0;
    shakeAmt = 0; flashAmt = 0; freeze = 0;
  }

  function spawn(o) {
    if (parts.length >= MAXP) parts.shift();
    parts.push({
      x: o.x, y: o.y, vx: o.vx || 0, vy: o.vy || 0,
      life: o.life || 0.5, max: o.life || 0.5,
      size: o.size || 1, color: o.color || '#fff',
      grav: o.grav === undefined ? 0.4 : o.grav,
      drag: o.drag === undefined ? 0.9 : o.drag,
      glow: o.glow || 0, collide: o.collide || 0, spin: 0
    });
  }

  /* Drill sparks: hot little chips flying away from the bit. */
  function sparks(x, y, ang, mat, n) {
    const cols = mat.c;
    for (let i = 0; i < (n || 4); i++) {
      const a = ang + Math.PI + U.rand(-0.9, 0.9);
      const sp = U.rand(30, 130);
      spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
        life: U.rand(0.18, 0.5), size: U.rand(1, 2.2),
        color: U.chance(0.35) ? '#fff6c8' : U.pick(cols), grav: 1.1, drag: 0.86, glow: U.chance(0.3) ? 1 : 0
      });
    }
  }

  function dust(x, y, n, color, spread) {
    for (let i = 0; i < n; i++) {
      const a = U.rand(0, U.TAU);
      const sp = U.rand(4, spread || 40);
      spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: U.rand(0.3, 0.9), size: U.rand(1.4, 3.4),
        color: color || '#a08c7a', grav: 0.1, drag: 0.88
      });
    }
  }

  function burst(x, y, n, colors, power, glow) {
    for (let i = 0; i < n; i++) {
      const a = U.rand(0, U.TAU);
      const sp = U.rand(0.2, 1) * (power || 120);
      spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: U.rand(0.3, 1.0), size: U.rand(1, 3),
        color: U.pick(colors), grav: 0.3, drag: 0.9, glow: glow ? 1 : (U.chance(0.4) ? 1 : 0)
      });
    }
  }

  function smoke(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      spawn({
        x: x + U.rand(-3, 3), y: y + U.rand(-3, 3),
        vx: U.rand(-14, 14), vy: U.rand(-30, -6),
        life: U.rand(0.5, 1.3), size: U.rand(2, 5),
        color: color || '#5a5470', grav: -0.15, drag: 0.93
      });
    }
  }

  function trail(x, y, color, size) {
    spawn({ x, y, vx: U.rand(-6, 6), vy: U.rand(-6, 6), life: U.rand(0.14, 0.3), size: size || 1.6, color, grav: 0, drag: 0.86, glow: 1 });
  }

  function text(x, y, str, color, size) {
    floaters.push({ x, y, vy: -26, life: 1.1, max: 1.1, str, color: color || '#fff', size: size || 1 });
  }

  function ring(x, y, r0, r1, life, color, width) {
    rings.push({ x, y, r: r0, r0, r1, life, max: life, color, width: width || 2 });
  }

  /* A flying piece of the world, painted from the tile colours it came from. */
  function chunk(x, y, vx, vy, cv, life) {
    chunks.push({ x, y, vx, vy, rot: U.rand(0, U.TAU), spin: U.rand(-6, 6), cv, life: life || 2.4, max: life || 2.4 });
  }

  function shake(amount) { shakeAmt = Math.max(shakeAmt, amount); }
  function flash(amount, color) { flashAmt = Math.max(flashAmt, amount); if (color) flashColor = color; }
  function hitStop(t) { freeze = Math.max(freeze, t); }

  function update(dt, world) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += p.grav * 260 * dt;
      const d = Math.pow(p.drag, dt * 60);
      p.vx *= d; p.vy *= d;
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      if (p.collide && world && world.solidAt(nx, ny)) {
        if (!world.solidAt(p.x, ny)) { p.vx = -p.vx * 0.4; }
        else if (!world.solidAt(nx, p.y)) { p.vy = -p.vy * 0.4; }
        else { p.vx *= 0.3; p.vy *= 0.3; }
        p.life -= dt * 2;
      } else { p.x = nx; p.y = ny; }
    }

    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= dt;
      f.y += f.vy * dt;
      f.vy *= Math.pow(0.94, dt * 60);
      if (f.life <= 0) floaters.splice(i, 1);
    }

    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.life -= dt;
      const t = 1 - r.life / r.max;
      r.r = U.lerp(r.r0, r.r1, 1 - Math.pow(1 - t, 2.2));
      if (r.life <= 0) rings.splice(i, 1);
    }

    for (let i = chunks.length - 1; i >= 0; i--) {
      const c = chunks[i];
      c.life -= dt;
      c.vy += 180 * dt;
      c.vx *= Math.pow(0.985, dt * 60);
      c.x += c.vx * dt; c.y += c.vy * dt;
      c.rot += c.spin * dt;
      if (U.chance(dt * 6)) trail(c.x, c.y, '#8a7a6a', 2);
      if (c.life <= 0) chunks.splice(i, 1);
    }

    shakeT += dt * 44;
    shakeAmt = Math.max(0, shakeAmt - dt * (12 + shakeAmt * 3.2));
    flashAmt = Math.max(0, flashAmt - dt * 4.6);

/* The drillable world: one celestial body floating in space, stored as a tile
   grid. Space is simply empty tiles above/around the body, so flying out of
   the ship and boring to the core happen in one continuous scene. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const M = D.M;

  const TILE = 10;
  const SKY = 32;            // tiles of open space above the body's north pole
  const MARGIN = 14;         // tiles of space either side

  /* ------------------------------------------------------------ tile atlases */
  const atlas = {};          // matId -> [canvas x4]
  const edgeCache = {};      // matId -> highlight strip canvas
  let crackCv = null;

  function buildAtlas() {
    for (const m of D.MAT) {
      if (m.id === 0) continue;
      const variants = [];
      for (let v = 0; v < 4; v++) {
        const cv = document.createElement('canvas');
        cv.width = TILE; cv.height = TILE;
        const c = cv.getContext('2d');
        c.fillStyle = m.c[1];
        c.fillRect(0, 0, TILE, TILE);
        // speckle the tile so large rock faces do not look flat
        for (let i = 0; i < 7; i++) {
          const h = U.hash2(v * 31 + i, m.id * 17 + i * 3);
          const x = Math.floor(h * TILE);
          const y = Math.floor(U.hash2(m.id + i * 7, v * 13 + 5) * TILE);
          const s = h > 0.72 ? 2 : 1;
          c.fillStyle = h > 0.5 ? m.c[0] : m.c[2];
          c.globalAlpha = 0.55;
          c.fillRect(x, y, s, s);
        }
        c.globalAlpha = 1;
        variants.push(cv);
      }
      atlas[m.id] = variants;

      const e = document.createElement('canvas');
      e.width = TILE; e.height = 3;
      const ec = e.getContext('2d');
      ec.fillStyle = m.c[0];
      ec.fillRect(0, 0, TILE, 2);
      ec.globalAlpha = 0.5;
      ec.fillRect(0, 2, TILE, 1);
      edgeCache[m.id] = e;
    }

    crackCv = [];
    for (let stage = 0; stage < 3; stage++) {
      const cv = document.createElement('canvas');
      cv.width = TILE; cv.height = TILE;
      const c = cv.getContext('2d');
      c.fillStyle = 'rgba(10,6,20,0.75)';
      const n = 4 + stage * 5;
      for (let i = 0; i < n; i++) {
        const x = Math.floor(U.hash2(i * 3 + stage * 41, 7) * TILE);
        const y = Math.floor(U.hash2(i * 11 + 3, stage * 17) * TILE);
        c.fillRect(x, y, 1 + (stage > 1 ? 1 : 0), 1);

  }

  /* ------------------------------------------------------------------- world */
  function World(body, index) {
    this.body = body;
    this.index = index;
    this.radius = body.radius;
    this.w = body.radius * 2 + MARGIN * 2;
    this.h = SKY + body.radius * 2 + 10;
    this.cx = this.w / 2;
    this.cy = SKY + body.radius;
    this.pxW = this.w * TILE;
    this.pxH = this.h * TILE;
    this.bodyTopPx = (this.cy - this.radius) * TILE;
    this.centerPx = { x: this.cx * TILE, y: this.cy * TILE };

    this.cells = new Uint8Array(this.w * this.h);
    this.dmg = new Float32Array(this.w * this.h);
    this.heat = new Float32Array(this.w * this.h);

    this.coreCells = [];
    this.coreMax = body.coreHp;
    this.coreHp = body.coreHp;
    this.mined = 0;
    this.totalSolid = 0;

    this.hardness = 1 + index * 0.16;

  World.prototype.idx = function (cx, cy) { return cy * this.w + cx; };
  World.prototype.inBounds = function (cx, cy) { return cx >= 0 && cy >= 0 && cx < this.w && cy < this.h; };
  World.prototype.at = function (cx, cy) {
    if (!this.inBounds(cx, cy)) return 0;

  World.prototype.generate = function () {
    const b = this.body, s = this.seed;
    const r = this.radius;
    // Core and chamber scale with the body: a pebble must not be two thirds
    // hollow, and a superplanet needs room to fight the Warden in.
    const coreR = Math.max(2.6, r * 0.1 + 1.2);
    const chamberR = coreR + U.clamp(r * 0.14, 3.5, 11);

    // ores sorted valuable-first so the rarest vein wins a contested tile
    const ores = b.ores.slice().sort((a, x) => D.MAT[x[0]].cr - D.MAT[a[0]].cr);
    const totalW = b.ores.reduce((t, o) => t + o[1], 0);

    for (let cy = 0; cy < this.h; cy++) {
      for (let cx = 0; cx < this.w; cx++) {
        const dx = cx + 0.5 - this.cx, dy = cy + 0.5 - this.cy;
        const d = Math.sqrt(dx * dx + dy * dy);
        const ang = Math.atan2(dy, dx);
        // lumpy silhouette so asteroids read as hand-drawn rocks
        const wobble = (U.fbm(Math.cos(ang) * 2 + s, Math.sin(ang) * 2 + s, 3) - 0.5) * r * 0.22
                     + (U.noise2(Math.cos(ang) * 6 + s, Math.sin(ang) * 6 + s) - 0.5) * r * 0.09;
        const rEff = r + wobble;
        if (d > rEff) continue;

        const depth = 1 - d / Math.max(1, rEff);   // 0 at surface, 1 at core
        let mat;

        if (d < coreR) { mat = M.core; }
        else if (d < chamberR) { mat = 0; }        // hollow core chamber
        else {
          // caves. Frequency matters as much as the threshold here: too low
          // and a small asteroid only samples a handful of noise features,
          // so whole materials can vanish by luck.
          const cave = U.fbm(cx * 0.12 + s, cy * 0.12 - s, 3);
          const caveWant = b.caves * (0.16 + depth * 0.72);
          if (cave > U.fbmThreshold(caveWant, 0.52, 0.145) && depth > 0.13) {
            this.cells[this.idx(cx, cy)] = 0; continue;
          }

          if (depth < 0.09) mat = b.ores[0][0] === M.ice ? M.ice : M.crust;
          else {
            mat = depth > 0.72 && U.chance(0.3) ? M.shell : M.stone;
            for (const [oid, wt] of ores) {
              const om = D.MAT[oid];
              const share = wt / totalW;
              const rarity = U.clamp(om.cr / 900, 0, 1);
              // the good stuff only shows up once you have committed to the dig
              if (depth < rarity * 0.34) continue;
              const want = U.clamp(share * (0.4 + depth * 1.4) * (1 - rarity * 0.35), 0, 0.8);
              const vein = U.fbm(cx * 0.24 + oid * 21 + s, cy * 0.24 - oid * 13 - s, 2);
              if (vein > U.fbmThreshold(want, 0.52, 0.155)) { mat = oid; break; }
            }

        if (mat === M.core) this.coreCells.push(this.idx(cx, cy));
        if (mat) this.totalSolid++;

    }

    this.carveCraters(r);

    // a crust skin makes the silhouette crisp and gives a surface to land on
    for (let cy = 0; cy < this.h; cy++) {
      for (let cx = 0; cx < this.w; cx++) {
        const i = this.idx(cx, cy);
        const m = this.cells[i];
        if (!m || m === M.core) continue;
        if (!this.at(cx, cy - 1) && U.hash2(cx, cy) > 0.25) {
          if (D.MAT[m].cr < 40) this.cells[i] = this.body.ores[0][0] === M.ice ? M.ice : M.crust;
        }
      }
    }

    this.coreCenter = { x: this.cx * TILE, y: this.cy * TILE };
    this.coreR = coreR * TILE;
    this.chamberR = chamberR * TILE;
  };

  /* Bite shallow bowls out of the rim so the silhouette reads as a cratered

  World.prototype.carveCraters = function (r) {
    const rnd = U.mulberry32(this.seed + 17);
    const n = Math.round(4 + r * 0.32);
    for (let i = 0; i < n; i++) {
      const ang = rnd() * U.TAU;
      const rad = 1.6 + rnd() * rnd() * (2.2 + r * 0.11);
      const depth = rad * (0.45 + rnd() * 0.5);
      const ox = this.cx + Math.cos(ang) * (r + rad - depth);
      const oy = this.cy + Math.sin(ang) * (r + rad - depth);
      const c0 = Math.floor(ox - rad - 1), c1 = Math.ceil(ox + rad + 1);
      const r0 = Math.floor(oy - rad - 1), r1 = Math.ceil(oy + rad + 1);
      for (let cy = r0; cy <= r1; cy++) {
        for (let cx = c0; cx <= c1; cx++) {
          if (!this.inBounds(cx, cy)) continue;
          const dx = cx + 0.5 - ox, dy = cy + 0.5 - oy;
          if (dx * dx + dy * dy > rad * rad) continue;
          const i2 = this.idx(cx, cy);
          if (this.cells[i2] === M.core) continue;
          if (this.cells[i2]) this.totalSolid--;
          this.cells[i2] = 0;
        }

      for (let i = 0; i < n; i++) {
        arr.push({
          x: rnd() * 1.4, y: rnd(),
          s: layer === 0 ? 1 : (rnd() > 0.75 ? 2 : 1),
          tw: rnd() * 6.28,
          c: rnd() > 0.86 ? '#ffd9a0' : (rnd() > 0.7 ? '#a9d8ff' : '#ffffff')
        });

    }

    this.decor = [];
    for (let i = 0; i < 3; i++) {

        x: rnd(), y: rnd() * 0.55, r: 6 + rnd() * 16,
        c: U.pick(['#3b2a5c', '#2a3a5c', '#5c3a3a', '#2f4a42']),
        p: 0.06 + i * 0.05
      });
    }

    // a big cratered companion moon hanging over the dig site
    const size = 96 + Math.round(rnd() * 80);
    this.moon = {
      cv: PD.artint.buildMoon(size, this.body.tint, this.seed * 3 + 11),
      x: 0.12 + rnd() * 0.5, y: 0.05 + rnd() * 0.2, p: 0.035
    };

  };

  /* Low-res coloured clouds, blown up with smoothing off for a chunky wash. */
  function buildNebula(sky, tint, seed) {
    const w = 60, h = 34;
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const img = c.createImageData(w, h);
    const tr = parseInt(tint.slice(1, 3), 16), tg = parseInt(tint.slice(3, 5), 16), tb = parseInt(tint.slice(5, 7), 16);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const n = U.fbm(x * 0.09 + seed, y * 0.13 - seed, 3);
        const a = U.clamp((n - 0.5) * 2.6, 0, 1);
        const i = (y * w + x) * 4;
        img.data[i] = tr * 0.55 + 40;
        img.data[i + 1] = tg * 0.5 + 26;
        img.data[i + 2] = tb * 0.7 + 70;
        img.data[i + 3] = a * 70;
      }
    }
    c.putImageData(img, 0, 0);

  }

  /* ------------------------------------------------------------- queries */
  World.prototype.solidAt = function (x, y) {
    const cx = Math.floor(x / TILE), cy = Math.floor(y / TILE);
    if (!this.inBounds(cx, cy)) return false;
    return this.cells[cy * this.w + cx] !== 0;
  };

  World.prototype.matAt = function (x, y) {
    const cx = Math.floor(x / TILE), cy = Math.floor(y / TILE);
    if (!this.inBounds(cx, cy)) return 0;
    return this.cells[cy * this.w + cx];
  };

  World.prototype.rectSolid = function (x, y, w, h) {
    const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.001) / TILE);
    const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 0.001) / TILE);

      for (let cx = x0; cx <= x1; cx++) {

      }

  };

  World.prototype.depthMeters = function (y) {
    return Math.max(0, Math.round((y - this.bodyTopPx) / TILE));
  };

  World.prototype.maxDepthMeters = function () {
    return Math.round((this.radius * 2) * 1);
  };

  /* --------------------------------------------------------------- drilling */

  };

  /* Returns the material id if the tile broke this call, else 0. */
  World.prototype.damage = function (cx, cy, amount) {
    if (!this.inBounds(cx, cy)) return 0;
    const i = cy * this.w + cx;
    const mat = this.cells[i];
    if (!mat) return 0;
    if (mat === M.core) {
      this.coreHp = Math.max(0, this.coreHp - amount);
      this.dmg[i] += amount;
      return this.coreHp <= 0 ? M.core : 0;

      this.dmg[i] = 0;

    if (this.at(cx + 1, cy)) side++;

        if (!m || m === M.core) continue;

    const cv = document.createElement('canvas');
    cv.width = size * TILE; cv.height = size * TILE;
    const c = cv.getContext('2d');
    let any = false;
    for (let j = 0; j < size; j++) {
      for (let i = 0; i < size; i++) {
        const m = this.at(cx + i, cy + j);
        if (!m) continue;

        c.drawImage(atlas[m][v], i * TILE, j * TILE);

    c.fillRect(0, 0, k, k); c.fillRect(cv.width - k, 0, k, k);
    c.fillRect(0, cv.height - k, k, k); c.fillRect(cv.width - k, cv.height - k, k, k);

  };

  /* ---------------------------------------------------------------- drawing */
  World.prototype.drawSky = function (ctx, cam, vw, vh, time, hideMoon) {
    const b = this.body;
    const g = ctx.createLinearGradient(0, 0, 0, vh);
    g.addColorStop(0, b.sky);
    g.addColorStop(1, '#05030f');
    ctx.fillStyle = g;

      ctx.globalAlpha = 0.85;
      ctx.drawImage(this.nebula, -((cam.x * 0.02) % vw) - 4, -((cam.y * 0.015) % vh) - 4, vw + 8, vh + 8);

    }

      const par = 0.04 + l * 0.05;
      const arr = this.stars[l];

        const x = ((st.x * vw * 1.4 - cam.x * par) % (vw * 1.4) + vw * 1.4) % (vw * 1.4);
        const y = ((st.y * vh * 1.6 - cam.y * par * 0.7) % (vh * 1.6) + vh * 1.6) % (vh * 1.6);

        x + m.cv.width / 2, y + m.cv.height / 2, m.cv.width * 0.85);
      hg.addColorStop(0, this.body.tint);
      hg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = hg;
      ctx.fillRect(x - m.cv.width * 0.4, y - m.cv.height * 0.4, m.cv.width * 1.8, m.cv.height * 1.8);
      ctx.globalAlpha = 0.95;
      ctx.drawImage(m.cv, x | 0, y | 0);
      ctx.globalAlpha = 1;
    }
  };

  World.prototype.drawCoreGlow = function (ctx, cam, time) {
    if (this.coreHp <= 0) return;
    const x = this.coreCenter.x - cam.x, y = this.coreCenter.y - cam.y;
    const frac = this.coreHp / this.coreMax;
    const r = this.coreR * (2.6 + 0.5 * Math.sin(time * 3)) * (1 + (1 - frac) * 0.5);
    const grd = ctx.createRadialGradient(x, y, this.coreR * 0.4, x, y, r);
    grd.addColorStop(0, 'rgba(255,220,150,0.55)');
    grd.addColorStop(0.5, 'rgba(255,130,60,0.22)');

        const v = (U.hash2(cx, cy) * 4) | 0;

        const up = cy > 0 ? this.cells[i - this.w] : 1;
        const dn = cy < this.h - 1 ? this.cells[i + this.w] : 1;

        const mm2 = D.MAT[m];
        if (!lf) { ctx.fillStyle = mm2.c[0]; ctx.globalAlpha = 0.5; ctx.fillRect(sx, sy, 1, TILE); ctx.globalAlpha = 1; }
        if (!rt) { ctx.fillStyle = mm2.c[2]; ctx.globalAlpha = 0.7; ctx.fillRect(sx + TILE - 1, sy, 1, TILE); ctx.globalAlpha = 1; }

        ctx.fillStyle = mm2.c[2];
        ctx.globalAlpha = 0.85;
        if (!up && !lf) { ctx.fillRect(sx, sy, 2, 1); ctx.fillRect(sx, sy + 1, 1, 1); }
        if (!up && !rt) { ctx.fillRect(sx + TILE - 2, sy, 2, 1); ctx.fillRect(sx + TILE - 1, sy + 1, 1, 1); }
        if (!dn && !lf) { ctx.fillRect(sx, sy + TILE - 1, 2, 1); ctx.fillRect(sx, sy + TILE - 2, 1, 1); }
        if (!dn && !rt) { ctx.fillRect(sx + TILE - 2, sy + TILE - 1, 2, 1); ctx.fillRect(sx + TILE - 1, sy + TILE - 2, 1, 1); }

  /* The core reads as one molten orb rather than a stack of flat tiles:

    // Already buried (cave-in, teleport, spawned inside rock)? Move freely so
    // the body can work its way out instead of vibrating in place forever.
    if (world.rectSolid(e.x - e.w / 2, e.y - e.h / 2, e.w, e.h)) {
      // a slow ooze, deliberately too weak to use as a shortcut through rock

      const k = sp > 45 ? 45 / sp : 1;
      e.x += e.vx * k * 0.35 * dt;
      e.y += e.vy * k * 0.35 * dt;

      e.y = U.clamp(e.y, 4, world.pxH - 4);

    let nx = e.x + e.vx * dt;
    if (world.rectSolid(nx - e.w / 2, e.y - e.h / 2, e.w, e.h)) {

      hit.y = Math.sign(e.vy) || 1;

  /* ------------------------------------------------------------------ pickup */

    if (d < pull && !p.cargoFull()) {

      this.vx = U.damp(this.vx, Math.cos(a) * force, 0.22, dt);
      this.vy = U.damp(this.vy, Math.sin(a) * force, 0.22, dt);

  /* ----------------------------------------------------------------- boulder

    ctx.save();
    ctx.translate(this.x - cam.x | 0, this.y - cam.y | 0);
    ctx.rotate(Math.round(this.rot / (Math.PI / 8)) * (Math.PI / 8));
    ctx.drawImage(this.cv, -this.cv.width / 2 | 0, -this.cv.height / 2 | 0);
    ctx.restore();
