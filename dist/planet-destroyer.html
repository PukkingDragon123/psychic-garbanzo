    S.flashT = 1; S.flashCol = '#ff5a4d';
    S.vx -= soft ? 40 : 80; S.vy += U.rand(-110, 110);
    A.sfx.hurt();
    PD.touch.buzz(26);
    shed(1);
    // cartoon first, physics second: stars round the pod and a hard puff
    for (let i = 0; i < 6; i++) {
      const a2 = (i / 6) * U.TAU;
      S.dust.push({ x: S.px + Math.cos(a2) * 14, y: S.py + Math.sin(a2) * 10,
        vx: Math.cos(a2) * 60 - 40, vy: Math.sin(a2) * 60,
        life: 0.6, col: '#ffe86a', r: 2, star: 1 });
    }
    for (let i = 0; i < 22; i++) {
      S.dust.push({ x: S.px, y: S.py, vx: U.rand(-220, 120), vy: U.rand(-180, 180),
        life: U.rand(0.3, 0.8), col: U.chance(0.5) ? '#ff8a3d' : '#c9bce8', r: U.rand(1, 3) });
    }
    say(S.dir === 'home'
      ? U.pick(['A ROCK FELL OUT OF THE HOLD.', 'THAT WAS THE GOOD ONE.', 'OW. AND ALSO OW.'])
      : U.pick(['OW.', 'THAT WAS THE PAINT.', 'IT IS FINE. IT IS FINE.', 'WHO PUT THAT THERE.']));
  }

  function cruise(dt, g) {
    steer(dt);
    S.dist = U.clamp(S.t / S.dur, 0, 1);
    const hard = S.dist;

    S.spawn -= dt;
    if (S.spawn <= 0) {
      spawnRock();
      // a gentler curve than it was: the gaps never close right up
      S.spawn = (0.95 - hard * 0.4) / S.fieldK * U.rand(0.7, 1.35);
    }
    S.evt -= dt;
    if (S.evt <= 0) { S.things.push(spawnThing()); S.evt = U.rand(4.5, 8); }

    if (S.shieldMax > 0 && S.shield < S.shieldMax) {
      S.shieldT += dt;
      const need = Math.max(6, 16 - S.shieldMax);
      if (S.shieldT >= need) { S.shieldT = 0; S.shield++; A.sfx.tone(520, { type: 'triangle', to: 900, dur: 0.16, vol: 0.08 }); }
    }

    for (let i = S.rocks.length - 1; i >= 0; i--) {
      const k = S.rocks[i];
      k.x += k.vx * dt; k.y += k.vy * dt; k.a += k.va * dt;
      if (k.y < LANE.y0 - 18 || k.y > LANE.y1 + 18) k.vy = -k.vy;
      if (k.x < -30) { S.rocks.splice(i, 1); continue; }
      const dx = (k.x - S.px) / (k.r + 16), dy = (k.y - S.py) / (k.r + 10);
      if (dx * dx + dy * dy < 1) {
        hitPod(g);
        k.vx = Math.abs(k.vx) * 0.5; k.vy += U.rand(-90, 90);
        S.rocks.splice(i, 1);
      }
    }

    for (let i = S.things.length - 1; i >= 0; i--) {
      const t = S.things[i];
      t.x += t.vx * dt; t.y += t.vy * dt; t.a += t.va * dt;
      if (t.x < -60) { S.things.splice(i, 1); continue; }
      // they talk once, as they pass the middle of the screen
      if (!t.said && t.x < VW * 0.72 && NPC_LINES[t.kind]) { t.said = 1; say(U.pick(NPC_LINES[t.kind])); }
      const dx = (t.x - S.px) / (t.r + 16), dy = (t.y - S.py) / (t.r + 10);
      const touching = dx * dx + dy * dy < 1;
      if (!touching) continue;
      if (PICKUP[t.kind] && !t.got) { takeThing(t, g); S.things.splice(i, 1); }
      else if (SOLID[t.kind]) { hitPod(g, t.kind === 'hulk'); t.vy += U.rand(-40, 40); }
    }

    if (S.t >= S.dur) {
      S.phase = 'approach'; S.t = 0;
      say(S.dir === 'out' ? 'THAT IS THE ONE. BRACE.' : 'THERE IT IS. HOME.');
      A.sfx.tone(220, { type: 'sawtooth', to: 90, dur: 0.7, vol: 0.1 });
    }
  }

  function approach(dt, g) {
    steer(dt);
    for (let i = S.rocks.length - 1; i >= 0; i--) {
      const k = S.rocks[i];
      k.x += k.vx * dt * 1.3; k.y += k.vy * dt; k.a += k.va * dt;
      if (k.x < -30) S.rocks.splice(i, 1);
    }
    for (let i = S.things.length - 1; i >= 0; i--) {
      const t = S.things[i];
      t.x += t.vx * dt * 1.3; t.a += t.va * dt;
      if (t.x < -60) S.things.splice(i, 1);
    }
    S.px = U.damp(S.px, 200, 0.5, dt);
    S.py = U.damp(S.py, 92, 0.5, dt);
    if (S.t > 2.4) { S.phase = 'land'; S.t = 0; say('LANDING. PROBABLY.'); }
  }

  function land(dt, g) {
    const t = S.t;
    for (let i = S.rocks.length - 1; i >= 0; i--) {
      const k = S.rocks[i];
      k.x += k.vx * dt * 0.5; k.y += k.vy * dt * 0.5; k.a += k.va * dt * 0.5;
      if (k.x < -30) S.rocks.splice(i, 1);
    }
    S.legs = U.clamp((t - 1.1) / 0.7, 0, 1);
    const groundY = VH - 46;
    if (t < 2.9) {
      S.py = U.lerp(92, groundY, U.smoothstep(0, 2.9, t));
      S.px = U.damp(S.px, 200, 0.4, dt);
      if (U.chance(0.85)) {
        S.dust.push({ x: S.px + U.rand(-6, 6), y: S.py + 10, vx: U.rand(-30, 30), vy: U.rand(40, 150),
          life: U.rand(0.2, 0.5), col: U.chance(0.5) ? '#ffd27a' : '#ff8a3d', r: U.rand(1, 3) });
      }
      if (t > 1.9 && U.chance(0.8)) {
        S.dust.push({ x: S.px + U.rand(-26, 26), y: groundY + 10, vx: U.rand(-130, 130), vy: U.rand(-60, -10),
          life: U.rand(0.4, 1), col: toTint(), r: U.rand(1, 3) });
      }
    } else if (!S.touched) {
      S.touched = 1; S.shake = 1.2;
      A.sfx.dock();
      FX.flash(0.3, '#ffe0a0');
      for (let i = 0; i < 40; i++) {
        S.dust.push({ x: S.px + U.rand(-14, 14), y: groundY + 10, vx: U.rand(-230, 230), vy: U.rand(-110, 10),
          life: U.rand(0.5, 1.3), col: U.chance(0.4) ? '#fff3c0' : toTint(), r: U.rand(1, 4) });
      }
      say(S.dir === 'out' ? 'TOUCHDOWN. NOBODY DIED.' : 'HOME. PUT THE KETTLE ON.');
    }
    if (t > 4.2) arrive(g);
  }

  /* What the crossing was worth. On the way out, rocks you ate come off the
     hull you start the dive with and a clean run pays. On the way home they
     only shake loose ore -- you are not going to be punished for coming back. */
  function arrive(g) {
    if (S.dir === 'home') {
      let lost = 0;
      if (S.hits > 0) lost = dropFromVault(g, S.hits);
      g.travelResult = { dir: 'home', hits: S.hits, lost, gained: S.gained };
      g.arriveHome(Math.max(0, S.ore - lost));
      return;
    }
    const dmg = S.hits;
    g.travelResult = { dir: 'out', hits: dmg, clean: dmg === 0, gained: S.gained };
    g.dive(S.index);
    const p = g.player;
    if (dmg > 0) {
      p.hull = Math.max(p.stat('hull') * 0.25, p.hull - dmg * p.stat('hull') * 0.12);
      FX.text(p.x, p.y - 30, '-' + dmg + ' HULL', '#ff5a4d', 1);
    } else {
      const bonus = Math.round(400 + S.index * 340);
      g.save.credits += bonus; g.save.totalEarned += bonus;
      FX.text(p.x, p.y - 30, 'CLEAN RUN +$' + U.fmt(bonus), '#8affa0', 2);
    }
  }

  /* Shake `n` units out of the hold, cheapest first -- he is not going to
     throw the ruby away when there is regolith on top of it. */
  function dropFromVault(g, n) {
    const v = g.save.vault || {};
    const ids = Object.keys(v).map(Number).filter(k => v[k] > 0)
      .sort((a, b) => (D.MAT[a] ? D.MAT[a].cr : 0) - (D.MAT[b] ? D.MAT[b].cr : 0));
    let lost = 0;
    for (const id of ids) {
      while (v[id] > 0 && lost < n) { v[id]--; lost++; }
      if (v[id] <= 0) delete v[id];
      if (lost >= n) break;
    }
    return lost;
  }

  /* ------------------------------------------------------------------- draw */
  const POD_K = 0.6;
  function pod(ctx, g, x, y, tilt, thrust) {
    const spr = PD.art.skinFor(g.save.cos).pod;
    const t = PD.game.time;
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    ctx.rotate(tilt * 0.3);
    ctx.scale(POD_K, POD_K);
    const back = -spr.ox + 3, bottom = spr.oy - 4;
    if (S.phase === 'land' && !S.touched) {
      const L = 14 + thrust * 26 + Math.sin(t * 40) * 5;
      X.poly(ctx, [[-14, bottom], [0, bottom + L], [14, bottom]], '#ff8a3d');
      X.poly(ctx, [[-7, bottom], [0, bottom + L * 0.6], [7, bottom]], '#fff3c0');
    } else if (thrust > 0.02) {
      const L = 16 + thrust * 30 + Math.sin(t * 40) * 5;
      X.poly(ctx, [[back, -9], [back - L, 0], [back, 9]], '#ff8a3d');
      X.poly(ctx, [[back, -5], [back - L * 0.55, 0], [back, 5]], '#fff3c0');
    }
    if (S.legs > 0.02) {
      const L = 6 + S.legs * 18;
      for (const dx of [-22, 0, 22]) {
        X.line(ctx, dx, bottom - 2, dx * 1.3, bottom + L, '#1a2030', 5);
        X.line(ctx, dx, bottom - 2, dx * 1.3, bottom + L, '#9aa6b8', 3);
        X.rect(ctx, dx * 1.3 - 8, bottom + L, 17, 5, '#3a4456');
        X.rect(ctx, dx * 1.3 - 7, bottom + L, 15, 2, '#c8d6ea');
      }
    }
    ctx.drawImage(spr.frames[Math.floor(t * 8) % 2], -spr.ox, -spr.oy);
    /* The damage: every hit punched a panel off him and it stays punched. A
       torn scorched gap where it was, and a spark out of it now and then. */
    for (let i = 0; i < Math.min(S.hits, PARTS.length); i++) {
      const p = PARTS[i], L = p.x - p.w / 2, T = p.y - p.h / 2;
      X.rect(ctx, L - 1, T - 1, p.w + 2, p.h + 2, '#3a2430');       // scorch
      X.rect(ctx, L, T, p.w, p.h, '#0a0614');                       // the hole
      // torn edge: a couple of teeth left hanging off the rim
      X.rect(ctx, L + 2, T, 3, 2, '#6a5a70');
      X.rect(ctx, L + p.w - 5, T + p.h - 2, 3, 2, '#6a5a70');
      if (Math.sin(t * 9 + i * 2) > 0.8) X.rect(ctx, p.x + U.rand(-4, 4), p.y + U.rand(-2, 2), 2, 2, '#ffd34d');
    }
    // past three panels he is visibly on fire and trailing smoke
    if (S.hits >= 3) {
      for (let i = 0; i < 3; i++) {
        const f = (t * 1.4 + i * 0.33) % 1;
        ctx.globalAlpha = 0.5 * (1 - f);
        X.blob(ctx, -34 - f * 60, 6 + Math.sin(t * 3 + i) * 5, 4 + f * 9, 4 + f * 9, '#6a6478');
      }
      ctx.globalAlpha = 1;
      X.rect(ctx, 10, 4, 4, 4, Math.sin(t * 17) > 0 ? '#ff8a3d' : '#ffd34d');
    }
    ctx.restore();
  }

  function drawThing(ctx, t, time) {
    const k = t.kind;
    if (k === 'scrap') {
      X.poly(ctx, t.pts.map(p => rot(p, t, 1.4)), '#140c22');
      X.poly(ctx, t.pts.map(p => rot(p, t, 1)), '#b08a4d');
      X.rect(ctx, t.x - 5, t.y - 1, 10, 2, '#ffd34d');
      if (Math.sin(time * 6) > 0) X.rect(ctx, t.x - 1, t.y - 6, 2, 2, '#fff3c0');
      return;
    }
    if (k === 'patch') {
      X.plate(ctx, t.x - 8, t.y - 7, 16, 14, '#dfe6ea', '#ffffff', '#6e7a84', 3);
      X.rect(ctx, t.x - 5, t.y - 1, 10, 3, '#3fa85a');
      X.rect(ctx, t.x - 1, t.y - 5, 3, 10, '#3fa85a');
      return;
    }
    if (k === 'skiff') {
      // a fast mean wedge with a Reaver visible in the bubble, mohawk and all
      X.poly(ctx, [[t.x - 16, t.y - 8], [t.x + 16, t.y], [t.x - 16, t.y + 8]], '#140c22');
      X.poly(ctx, [[t.x - 14, t.y - 6], [t.x + 13, t.y], [t.x - 14, t.y + 6]], '#8a2f4a');
      X.poly(ctx, [[t.x - 14, t.y - 6], [t.x + 2, t.y - 3], [t.x - 14, t.y - 1]], '#c25070');
      X.rect(ctx, t.x - 7, t.y - 4, 9, 6, '#1d2a3a');      // the bubble
      X.rect(ctx, t.x - 5, t.y - 3, 5, 4, '#6fe0a0');      // a green pilot in it
      X.rect(ctx, t.x - 4, t.y - 6, 1, 3, '#ff5a4d');      // and his mohawk
      X.rect(ctx, t.x - 2, t.y - 7, 1, 4, '#ff5a4d');
      X.rect(ctx, t.x, t.y - 6, 1, 3, '#ff5a4d');
      X.rect(ctx, t.x - 16, t.y - 10, 4, 3, '#6a1f33');    // the fin
      for (let i = 1; i < 8; i++) X.rect(ctx, t.x + 15 + i * 5, t.y - 1, 4, 2, 'rgba(255,90,77,' + (0.55 / i).toFixed(2) + ')');
      return;
    }
    if (k === 'rat') {
      /* Brenda's cousin, who has his own ship and a wheel of cheese on a rope
         and is, by any measure, doing better than you. */
      X.poly(ctx, [[t.x - 13, t.y - 6], [t.x + 12, t.y - 2], [t.x + 12, t.y + 4], [t.x - 13, t.y + 7]], '#140c22');
      X.poly(ctx, [[t.x - 12, t.y - 5], [t.x + 10, t.y - 1], [t.x + 10, t.y + 3], [t.x - 12, t.y + 6]], '#9a6a8a');
      X.rect(ctx, t.x - 6, t.y - 9, 12, 6, '#2a1d33');     // canopy
      X.rect(ctx, t.x - 4, t.y - 8, 8, 4, '#c9bce8');
      X.rect(ctx, t.x - 3, t.y - 7, 5, 3, '#6e5a50');      // the rat
      X.rect(ctx, t.x - 4, t.y - 9, 2, 2, '#6e5a50');      // ears
      X.rect(ctx, t.x + 1, t.y - 9, 2, 2, '#6e5a50');
      X.rect(ctx, t.x + 2, t.y - 6, 1, 1, '#ffffff');      // eye
      X.line(ctx, t.x - 12, t.y + 4, t.x - 24, t.y + 9, '#b8aed0', 1);
      X.blob(ctx, t.x - 27, t.y + 10, 5, 5, '#b08a2a');    // the cheese
      X.blob(ctx, t.x - 27, t.y + 10, 4, 4, '#ffd34d');
      X.rect(ctx, t.x - 28, t.y + 9, 2, 2, '#b08a2a');
      return;
    }
    if (k === 'bus') {
      /* Fourteen tourists, every one of them photographing your dents. */
      X.plate(ctx, t.x - 26, t.y - 11, 52, 22, '#141020', null, null, 4);
      X.plate(ctx, t.x - 25, t.y - 10, 50, 20, '#e8c44d', '#fff3a8', '#8a6a1a', 4);
      X.rect(ctx, t.x - 25, t.y - 2, 50, 3, '#8a6a1a');
      for (let i = 0; i < 5; i++) {
        const wx = t.x - 21 + i * 9;
        X.rect(ctx, wx, t.y - 8, 7, 6, '#2a3a5a');
        X.rect(ctx, wx + 1, t.y - 7, 5, 4, '#7fb0e8');
        X.rect(ctx, wx + 2, t.y - 6, 3, 3, U.hash2(i, 3) > 0.5 ? '#6fe0a0' : '#e8a06f');
        // and a camera flash, one window at a time
        if ((Math.floor(time * 3) % 5) === i) X.rect(ctx, wx - 1, t.y - 9, 9, 8, 'rgba(255,255,255,0.8)');
      }
      X.rect(ctx, t.x + 24, t.y - 4, 6, 5, '#fff3c0');     // headlight
      X.rect(ctx, t.x - 30, t.y - 2, 5, 4, '#ff5a4d');     // tail light
      return;
    }
    if (k === 'busker') {
      /* One small ship, one enormous speaker, and no sense of occasion. */
      X.plate(ctx, t.x - 12, t.y - 6, 20, 13, '#141020', null, null, 3);
      X.plate(ctx, t.x - 11, t.y - 5, 18, 11, '#5a4a8a', '#8a7ac4', '#2a2050', 3);
      X.rect(ctx, t.x - 6, t.y - 3, 8, 5, '#c9bce8');
      X.plate(ctx, t.x + 6, t.y - 12, 18, 24, '#140c22', null, null, 3);
      X.plate(ctx, t.x + 7, t.y - 11, 16, 22, '#3a2a1a', '#6a5030', '#1a1008', 3);
      const pu = 3 + Math.abs(Math.sin(time * 9)) * 2;
      X.blob(ctx, t.x + 15, t.y - 4, pu + 1, pu + 1, '#1a1008');
      X.blob(ctx, t.x + 15, t.y - 4, pu, pu, '#c9a06a');
      X.blob(ctx, t.x + 15, t.y + 6, 3, 3, '#c9a06a');
      for (let i = 0; i < 3; i++) {                         // notes, escaping
        const f = ((time * 0.8 + i * 0.33) % 1);
        const nx = t.x + 24 + f * 26, ny = t.y - 4 - f * 22 + Math.sin(f * 9 + i) * 4;
        ctx.globalAlpha = 1 - f;
        X.rect(ctx, nx, ny, 2, 6, '#8dff5a');
        X.rect(ctx, nx - 2, ny + 5, 4, 3, '#8dff5a');
        ctx.globalAlpha = 1;
      }
      return;
    }
    if (k === 'patrol') {
      X.plate(ctx, t.x - 20, t.y - 8, 40, 16, '#3f6ea8', '#a9d8ff', '#1a2f52', 4);
      X.rect(ctx, t.x - 12, t.y - 4, 18, 4, '#c8e4ff');
      X.rect(ctx, t.x + 14, t.y - 2, 7, 4, '#e6f0fa');
      const blink = Math.sin(time * 7) > 0;
      X.rect(ctx, t.x - 18, t.y - 11, 5, 3, blink ? '#ff5a4d' : '#7ef9ff');
      X.rect(ctx, t.x + 13, t.y - 11, 5, 3, blink ? '#7ef9ff' : '#ff5a4d');
      // the scan: a cone that sweeps down over whatever is below it
      const sw = Math.sin(time * 1.6) * 0.5;
      ctx.globalAlpha = 0.16 + Math.abs(Math.sin(time * 3)) * 0.1;
      X.poly(ctx, [[t.x - 4, t.y + 8], [t.x + 4, t.y + 8],
        [t.x + 30 + sw * 40, t.y + 74], [t.x - 30 + sw * 40, t.y + 74]], '#a9d8ff');
      ctx.globalAlpha = 1;
      return;
    }
    if (k === 'hulk') {
      X.poly(ctx, t.pts.map(p => rot(p, t, 1.25)), '#0e0a18');
      X.poly(ctx, t.pts.map(p => rot(p, t, 1)), '#46525e');
      X.poly(ctx, t.pts.slice(0, 4).map(p => rot(p, t, 0.55)), '#5c6a82');
      X.rect(ctx, t.x - 4, t.y - 3, 9, 6, '#191320');      // a hole clean through
      X.line(ctx, t.x + 14, t.y - 8, t.x + 34, t.y - 22, '#3a4456', 3);  // snapped mast
      X.line(ctx, t.x + 14, t.y - 8, t.x + 34, t.y - 22, '#7a8594', 1);
      // the distress light nobody has come for
      if (Math.sin(time * 2.6) > 0.55) {
        X.blob(ctx, t.x + 34, t.y - 23, 5, 5, 'rgba(255,90,77,0.4)');
        X.rect(ctx, t.x + 32, t.y - 25, 4, 4, '#ff5a4d');
      }
      return;
    }
    if (k === 'whale') {
      // one enormous animal, entirely uninterested in any of this
      const w = 52, h = 20, fl = Math.sin(time * 1.3) * 5;
      X.poly(ctx, [[t.x - w, t.y], [t.x - 18, t.y - h], [t.x + 24, t.y - 9],
        [t.x + 34, t.y], [t.x + 24, t.y + 9], [t.x - 18, t.y + h]], '#0e1a2a');
      X.poly(ctx, [[t.x - w + 3, t.y], [t.x - 17, t.y - h + 3], [t.x + 22, t.y - 8],
        [t.x + 31, t.y], [t.x + 22, t.y + 8], [t.x - 17, t.y + h - 3]], '#2f5a8a');
      X.poly(ctx, [[t.x - 17, t.y - h + 5], [t.x + 18, t.y - 6], [t.x + 6, t.y + 2]], '#4d84c4');
      X.poly(ctx, [[t.x - w, t.y], [t.x - w - 16, t.y - 14 + fl], [t.x - w - 14, t.y + 12 + fl]], '#2f5a8a');
      X.rect(ctx, t.x + 22, t.y - 4, 3, 3, '#d8eeff');
      return;
    }
    // comet: a slow bright lump with a long tail, impossible to miss
    for (let i = 1; i < 14; i++) {
      ctx.globalAlpha = 0.4 / Math.sqrt(i);
      X.blob(ctx, t.x + i * 9, t.y - i * 0.6, t.r * (1 - i / 18), t.r * 0.55 * (1 - i / 18), '#7ef9ff');
    }
    ctx.globalAlpha = 1;
    X.poly(ctx, t.pts.map(p => rot(p, t, 1.3)), '#0e1a2a');
    X.poly(ctx, t.pts.map(p => rot(p, t, 1)), '#a9e6f5');
    X.poly(ctx, t.pts.slice(0, 3).map(p => rot(p, t, 0.55)), '#ffffff');
  }

  function rot(p, t, grow) {
    const co = Math.cos(t.a), si = Math.sin(t.a);
    return [t.x + (p[0] * co - p[1] * si) * grow, t.y + (p[0] * si + p[1] * co) * grow];
  }

  function hud(ctx, g) {
    const x0 = 96, x1 = VW - 24, y = 16;
    X.plate(ctx, 86, 7, VW - 104, 18, 'rgba(10,6,26,0.8)', '#3c2f66', '#0a0618', 3);
    X.rect(ctx, x0, y, x1 - x0, 1, '#3c2f66');
    for (let i = 0; i <= 10; i++) X.rect(ctx, x0 + (x1 - x0) * i / 10, y - 2, 1, 5, '#4a3a78');
    const f = S.phase === 'launch' ? 0 : (S.phase === 'cruise' ? S.dist : 1);
    PD.glyph.draw(ctx, S.dir === 'out' ? 'home' : 'planet', x0 - 8, y - 7, fromTint(), '#4a3a78');
    PD.glyph.draw(ctx, S.dir === 'out' ? 'planet' : 'home', x1 - 5, y - 7, toTint(), '#4a3a78');
    const mx = Math.round(x0 + (x1 - x0) * f);
    X.rect(ctx, x0, y, mx - x0, 1, '#7ef9ff');
    X.poly(ctx, [[mx - 4, y - 4], [mx + 4, y], [mx - 4, y + 4]], '#7ef9ff');

    F.draw(ctx, toName().toUpperCase(), 10, 8, '#ffd34d', { shadow: '#0b0718' });
    F.draw(ctx, S.dir === 'out' ? S.body.kind.toUpperCase() : 'THE ROCK HOUSE', 10, 17, '#8a7ab0', { shadow: '#0b0718' });

    const hp = Math.max(0, 5 - S.hits);
    for (let i = 0; i < 5; i++) {
      X.plate(ctx, 10 + i * 9, 28, 7, 8, i < hp ? '#ff5a4d' : '#2a1c33', i < hp ? '#ffb0a8' : null, '#140c22', 2);
    }
    for (let i = 0; i < S.shieldMax; i++) {
      const on = i < S.shield;
      PD.glyph.hex(ctx, 14 + i * 10, 46, 4, on ? '#7ef9ff' : '#1e2a44', on ? '#eafcff' : '#2a3a58', 1);
    }
    if (S.dir === 'home' && S.ore > 0) {
      PD.glyph.draw(ctx, 'ore', 8, VH - 22, '#ffb03d', '#8a5c1a');
      F.draw(ctx, 'x' + S.ore, 25, VH - 18, '#ffb03d', { shadow: '#0b0718' });
    }
    if (S.saidT > 0) {
      ctx.globalAlpha = Math.min(1, S.saidT * 1.6);
      F.draw(ctx, S.said, VW / 2, VH - 16, '#ffe9a8', { center: true, shadow: '#0b0718' });
      ctx.globalAlpha = 1;
    }
    if (S.phase === 'cruise') {
      F.draw(ctx, 'ETA ' + Math.max(0, S.dur - S.t).toFixed(1) + 's', VW - 10, 30, '#8a7ab0', { right: true, shadow: '#0b0718' });
    }
  }

  function draw(ctx, g, time) {
    const b = S.body || D.BODIES[0];
    const grd = ctx.createLinearGradient(0, 0, 0, VH);
    grd.addColorStop(0, S.dir === 'out' ? (b.sky || '#0b0720') : '#0b0720');
    grd.addColorStop(1, '#04030d');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, VW, VH);

    const sh = S.shake > 0 ? S.shake * S.shake * 4 : 0;
    ctx.save();
    if (sh) ctx.translate(Math.round(U.rand(-sh, sh)), Math.round(U.rand(-sh, sh)));

    const sk = speedK();
    for (const st of S.stars) {
      const len = 1 + st.z * 14 * sk;
      ctx.globalAlpha = 0.3 + st.z * 0.6;
      ctx.fillStyle = st.z > 0.8 ? '#ffffff' : (st.z > 0.5 ? '#c9d8ff' : '#7a6aa8');
      ctx.fillRect(st.x | 0, st.y | 0, Math.max(st.s, len | 0), st.s);
    }
    ctx.globalAlpha = 1;

    drawDest(ctx);

    for (const t of S.things) drawThing(ctx, t, time);

    for (const k of S.rocks) {
      X.poly(ctx, k.pts.map(p => rot(p, k, 1.3)), '#140c22');
      X.poly(ctx, k.pts.map(p => rot(p, k, 1)), k.ice ? '#79c4de' : '#8a6a4f');
      X.poly(ctx, k.pts.slice(0, 3).map(p => rot(p, k, 0.6)), k.ice ? '#d4eef7' : '#b08a6a');
    }

    for (const bit of S.bits) {
      ctx.save();
      ctx.translate(bit.x | 0, bit.y | 0); ctx.rotate(bit.a);
      X.rect(ctx, -bit.w / 2 - 1, -bit.h / 2 - 1, bit.w + 2, bit.h + 2, '#140c22');
      X.rect(ctx, -bit.w / 2, -bit.h / 2, bit.w, bit.h, '#8fa0b8');
      ctx.restore();
    }

    for (const d of S.dust) {
      ctx.globalAlpha = Math.min(1, d.life * 2.4);
      if (d.star) {                                   // the cartoon OW
        X.rect(ctx, d.x - 1, d.y - 3, 3, 7, '#1a1030');
        X.rect(ctx, d.x - 3, d.y - 1, 7, 3, '#1a1030');
        X.rect(ctx, d.x, d.y - 3, 1, 7, d.col);
        X.rect(ctx, d.x - 3, d.y, 7, 1, d.col);
      } else X.rect(ctx, d.x, d.y, d.r, d.r, d.col);
    }
    ctx.globalAlpha = 1;

    if (S.phase === 'land') {
      const f = U.clamp(S.t / 1.4, 0, 1);
      drawGround(ctx, VH - 36 + (1 - f) * 60, toTint(), S.index + 3, S.px);
    } else if (S.phase === 'launch') {
      drawGround(ctx, VH - 24 + S.t * 150, fromTint(), S.index + 11, null);
    }

    const thrust = S.phase === 'launch' ? 1 : (S.phase === 'land' && !S.touched ? 0.8 : 0.35);
    if (!(S.invuln > 0 && Math.floor(time * 22) % 2)) {
      pod(ctx, g, S.px, S.py, S.phase === 'land' ? 0 : S.tilt, thrust);
    }
    if (S.shield > 0 && S.phase !== 'land') {
      const pu = 1 + Math.sin(time * 6) * 0.05;
      PD.glyph.hex(ctx, S.px, S.py, 17 * pu, null, 'rgba(126,249,255,' + (0.3 + S.shield / Math.max(1, S.shieldMax) * 0.4).toFixed(2) + ')', 1);
    }
    ctx.restore();

    if (S.navLead > 0 && (S.phase === 'cruise' || S.phase === 'approach')) {
      const blink = Math.sin(time * 16) > -0.3;
      if (blink) for (const k of S.rocks) {
        if (k.x < VW - 4) continue;
        const y = U.clamp(k.y, 8, VH - 8);
        X.poly(ctx, [[VW - 3, y], [VW - 11, y - 5], [VW - 11, y + 5]], '#ffd34d');
      }
    }

    if (S.flashT > 0) {
      ctx.fillStyle = S.flashCol === '#ff5a4d'
        ? 'rgba(255,90,77,' + (S.flashT * 0.4).toFixed(2) + ')'
        : 'rgba(126,249,255,' + (S.flashT * 0.32).toFixed(2) + ')';
      ctx.fillRect(0, 0, VW, VH);
    }

    hud(ctx, g);
    PD.touch.draw(ctx, touchMode(), g);
  }

  function drawDest(ctx) {
    const img = toCanvasImg();
    if (!img) return;
    let size, cx, cy;
    if (S.phase === 'launch') { size = 14; cx = VW - 40; cy = 60; }
    else if (S.phase === 'cruise') { size = 14 + S.dist * 26; cx = VW - 40; cy = 60; }
    else if (S.phase === 'approach') {
      const f = U.smoothstep(0, 2.4, S.t);
      size = U.lerp(40, 420, f * f);
      cx = U.lerp(VW - 40, 200, f); cy = U.lerp(60, VH + 120, f);
    } else {
      size = 420; cx = 200; cy = VH + 120;
      ctx.globalAlpha = U.clamp(1 - S.t / 1.2, 0, 1);
    }
    const s = Math.round(size);
    ctx.drawImage(img, 0, 0, img.width, img.height,
      Math.round(cx - s / 2), Math.round(cy - s / 2), s, s);
    ctx.globalAlpha = 1;
  }

  /* Ground, close up: a jagged horizon in the body's own colour with a flat
     pad cleared where the pod is coming down. Used for the rock he leaves as
     well as the one he arrives at, so both ends of the trip have somewhere
     solid. */
  function drawGround(ctx, baseY, tint, seed, padX) {
    const dark = shade(tint, 0.46), mid = shade(tint, 0.72);
    const lit = shade(tint, 1.05), hi = shade(tint, 1.4);
    for (let x = 0; x < VW; x += 3) {
      const h = Math.round(Math.sin(x * 0.031 + seed) * 5 + Math.sin(x * 0.0113 + seed * 2) * 9
        + Math.sin(x * 0.09) * 1.5);
      const flat = padX !== null && Math.abs(x - padX) < 38 ? 0 : h;
      const y = Math.round(baseY + flat);
      if (y > VH) continue;
      X.rect(ctx, x, y + 4, 3, VH - y, dark);
      X.rect(ctx, x, y + 1, 3, 4, mid);
      X.rect(ctx, x, y, 3, 1, lit);
      for (let k = 0; k < 3; k++) {
        const hv = U.hash2(x, Math.round(seed) + k * 17);
        if (hv > 0.72) X.rect(ctx, x + (k % 3), y + 7 + (hv * 46 | 0), 1, 1, k ? shade(tint, 0.3) : hi);
      }
      if (U.hash2(x, Math.round(seed) + 3) > 0.9) X.rect(ctx, x, y + 3, 3, 3, shade(tint, 0.3));
    }
    if (padX !== null) {
      const t = PD.game.time;
      for (let i = -3; i <= 3; i++) {
        const on = (Math.floor(t * 7) + i + 8) % 4 === 0;
        X.plate(ctx, padX + i * 11 - 2, baseY - 5, 5, 4, on ? '#ffd34d' : '#6a5a2a', on ? '#fff3c0' : null, '#241a08', 1);
      }
      X.rect(ctx, padX - 38, baseY - 1, 76, 1, 'rgba(255,211,77,0.5)');
    }
  }

  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const r = U.clamp(((n >> 16) & 255) * f, 0, 255) | 0;
    const g2 = U.clamp(((n >> 8) & 255) * f, 0, 255) | 0;
    const b2 = U.clamp((n & 255) * f, 0, 255) | 0;
    return 'rgb(' + r + ',' + g2 + ',' + b2 + ')';
  }

  function touchMode() { return S.phase === 'cruise' || S.phase === 'approach' ? 'travel' : 'ui'; }

  PD.travel = { enter, enterReturn, update, draw, touchMode, S, drawThing,
    drawPodOnly: (ctx, g) => pod(ctx, g, S.px, S.py, 0, 0.35) };
})(window.PD);

/* ===== src/starmap.js ===== */
/* The chart. Two views: the galaxy (four sectors, each one past the first
   locked behind a drive you buy outright) and a solar system (the worlds in
   one sector, orbiting their star, ready to be dropped on to). */
(function (PD) {
  'use strict';
  const U = PD.util;
  const F = PD.font;
  const D = PD.data;
  const A = PD.audio;
  const G = PD.galaxy;
  const X = PD.pxd;
  const VW = 480, VH = 270;

  const S = {
    backHit: 0,
    view: 'galaxy',       // 'galaxy' | 'system'
    zone: 0,              // zone being looked at in system view
    selZone: 0,
    selBody: 0,
    t: 0,
    zoom: 0,              // 0..1 transition into the system view
    msg: '', msgT: 0
  };

  const suns = {};
  const planets = {};
  function sun(zi) {
    if (!suns[zi]) suns[zi] = G.buildSun(16, D.ZONES[zi].star);
    return suns[zi];
  }
  function planetArt(i, size) {
    const k = i + ':' + size;
    if (!planets[k]) planets[k] = G.buildPlanet(size, D.BODIES[i].tint, 1000 + i * 977, i % 3 === 2);
    return planets[k];
  }

  function zoneOpen(g, zi) { return g.zoneOpen(zi); }
  function bodyOpen(g, i) { return i <= g.save.unlocked && zoneOpen(g, D.zoneOf(i)); }

  function enter(g) {
    S.view = 'galaxy';
    S.t = 0; S.zoom = 0;
    S.selZone = D.zoneOf(Math.min(g.save.unlocked, D.BODIES.length - 1));
    S.selBody = Math.min(g.save.unlocked, D.BODIES.length - 1);
    A.sfx.click();
  }

  function say(m) { S.msg = m; S.msgT = 2.6; }

  function openZone(g, zi) {
    if (!zoneOpen(g, zi)) {
      say('THE OBSERVATORY NEEDS LEVEL ' + (zi + 1) + ' TO SEE THAT FAR.');
      A.sfx.deny();
      return;
    }
    S.view = 'system';
    S.zone = zi;
    S.zoom = 0;
    const list = D.ZONES[zi].bodies;
    S.selBody = list.indexOf(g.save.unlocked) >= 0 ? g.save.unlocked : list[0];
    A.sfx.click();
  }

  /* ---------------------------------------------------------------- update */
  function update(dt, g) {
    const IN = PD.input;
    S.t += dt;
    S.msgT = Math.max(0, S.msgT - dt);
    S.zoom = Math.min(1, S.zoom + dt * 3.4);
    const inBack = IN.mouse.inside && IN.mouse.x < 96 && IN.mouse.y < 26;
    const click = IN.mouse.leftPressed && !inBack;
    const mx = IN.mouse.x, my = IN.mouse.y;

    if (IN.hit('esc') || S.backHit) {
      S.backHit = 0;
      if (S.view === 'system') { S.view = 'galaxy'; S.zoom = 0; A.sfx.click(); }
      else { g.state = 'home'; PD.home.P.lock = 0.25; A.sfx.click(); }
      return;
    }

    if (S.view === 'galaxy') {
      if (IN.hit('left')) S.selZone = U.clamp(S.selZone - 1, 0, D.ZONES.length - 1);
      if (IN.hit('right')) S.selZone = U.clamp(S.selZone + 1, 0, D.ZONES.length - 1);
      for (let i = 0; i < D.ZONES.length; i++) {
        const z = D.ZONES[i];
        if (Math.abs(mx - z.x) < 30 && Math.abs(my - z.y) < 30) {
          S.selZone = i;
          if (click) openZone(g, i);
        }
      }
      if (IN.hit('KeyE') || IN.hit('space')) openZone(g, S.selZone);
      // the whole bottom panel is a button on touch
      if (click && my > VH - 44) openZone(g, S.selZone);
      return;
    }

    // ---- system view
    const list = D.ZONES[S.zone].bodies;
    const at = list.indexOf(S.selBody);
    if (IN.hit('left')) S.selBody = list[U.clamp(at - 1, 0, list.length - 1)];
    if (IN.hit('right')) S.selBody = list[U.clamp(at + 1, 0, list.length - 1)];
    for (let k = 0; k < list.length; k++) {
      const p = bodyPos(k, list.length);
      if (Math.hypot(mx - p.x, my - p.y) < 26) {
        S.selBody = list[k];
        if (click) drop(g, list[k]);
      }
    }
    if (IN.hit('KeyE') || IN.hit('space')) drop(g, S.selBody);
    if (click && my > VH - 40 && mx > VW - 130) drop(g, S.selBody);
  }

  function drop(g, i) {
    if (i > g.save.unlocked) { say('DESTROY ' + D.BODIES[g.save.unlocked].name.toUpperCase() + ' FIRST.'); A.sfx.deny(); return; }
    if (!zoneOpen(g, D.zoneOf(i))) { A.sfx.deny(); return; }
    /* The crossing is a real journey now: the chart hands off to the flight
       rather than dropping you on the rock between two frames. */
    PD.travel.enter(g, i);
  }

  function bodyPos(k, n) {
    const spread = Math.min(120, 330 / Math.max(1, n));
    const x = 150 + k * spread;
    const y = 132 + Math.sin(k * 1.1 + 0.6) * 26;
    return { x, y };
  }

  /* ------------------------------------------------------------------ draw */
  function ring(ctx, x, y, r, col, alpha, dash) {
    X.orbit(ctx, x, y, r, r * 0.34, col, dash ? 5 : 2, alpha);
  }

  function panel(ctx, x, y, w, h, col) {
    ctx.fillStyle = 'rgba(6,4,18,0.88)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.fillStyle = col;
    ctx.fillRect(x, y, 10, 1); ctx.fillRect(x, y, 1, 10);
    ctx.fillRect(x + w - 10, y + h - 1, 10, 1); ctx.fillRect(x + w - 1, y + h - 10, 1, 10);
  }

  function draw(ctx, g, t) {
    G.draw(ctx, { x: S.view === 'galaxy' ? 0 : 600, y: 0 }, t, 7, '#05030f');
    ctx.fillStyle = 'rgba(4,2,12,0.68)';
    ctx.fillRect(0, 0, VW, VH);

    if (S.view === 'galaxy') drawGalaxy(ctx, g, t);
    else drawSystem(ctx, g, t);

    // header
    ctx.fillStyle = 'rgba(6,4,18,0.9)';
    ctx.fillRect(0, 0, VW, 16);

      F.draw(ctx, S.msg, VW / 2, 27, '#ffd34d', { center: true, shadow: false });

  function drawGalaxy(ctx, g, t) {
    // travel lanes
    for (let i = 1; i < D.ZONES.length; i++) {
      const a = D.ZONES[i - 1], b = D.ZONES[i];
      const open = zoneOpen(g, i);
      ctx.save();
      ctx.globalAlpha = open ? 0.55 : 0.25;
      X.curve(ctx, a.x, a.y, (a.x + b.x) / 2, (a.y + b.y) / 2 - 30, b.x, b.y, open ? '#7ef9ff' : '#5a4d80', 1, open ? 16 : 7);
      ctx.restore();
    }

    for (let i = 0; i < D.ZONES.length; i++) {
      const z = D.ZONES[i];
      const open = zoneOpen(g, i);
      const sel = S.selZone === i;
      ctx.save();
      if (!open) ctx.globalAlpha = 0.45;
      const sp = sun(i);
      const pulse = 1 + Math.sin(t * 2 + i) * 0.04;
      ctx.drawImage(sp, z.x - sp.width / 2 * pulse, z.y - sp.height / 2 * pulse, sp.width * pulse, sp.height * pulse);
      // its worlds as little beads on an orbit
      ring(ctx, z.x, z.y, 26, z.star, 0.35, !open);
      for (let k = 0; k < z.bodies.length; k++) {
        const a = t * (0.3 + k * 0.12) + k * 2.1;
        const px = z.x + Math.cos(a) * 26, py = z.y + Math.sin(a) * 26 * 0.34;
        const bi = z.bodies[k];
        X.rect(ctx, px - 2, py - 2, 4, 4, g.save.destroyed[bi] ? '#5a4d80' : D.BODIES[bi].tint);
      }
      ctx.restore();

      if (!open) {
        PD.glyph.draw(ctx, 'lock', z.x - 6, z.y - 8, '#ffffff', '#5a4d80');
        F.draw(ctx, 'OBSERVATORY LV ' + (i + 1), z.x, z.y + 42, '#9c8ec4', { center: true });
      }
      F.draw(ctx, z.name, z.x, z.y + 32, open ? '#f2e9ff' : '#9c8ec4', { center: true, shadow: true });
      if (sel) {
        const w = F.width(z.name, 1) + 14;
        ctx.strokeStyle = '#ffd34d';
        ctx.setLineDash([2, 3]);
        ctx.strokeRect(z.x - w / 2 + 0.5, z.y - 34.5, w, 70);
        ctx.setLineDash([]);
      }
    }

    // selection panel
    const z = D.ZONES[S.selZone];
    const open = zoneOpen(g, S.selZone);
    panel(ctx, 8, VH - 44, VW - 16, 38, open ? '#7ef9ff' : '#ff8a3d');
    F.draw(ctx, z.name, 16, VH - 38, z.star, { shadow: false });
    F.draw(ctx, z.sub, 16, VH - 28, '#9c8ec4', { shadow: false });
    let done = 0;
    for (const b of z.bodies) if (g.save.destroyed[b]) done++;
    F.draw(ctx, 'WORLDS ' + done + '/' + z.bodies.length, 16, VH - 18, '#f2e9ff', { shadow: false });
    if (open) {
      F.draw(ctx, 'E  ENTER SECTOR', VW - 16, VH - 26, '#39ffa6', { right: true, shadow: false });
    } else {
      F.draw(ctx, 'OUT OF RANGE', VW - 16, VH - 32, '#ff8a3d', { right: true, shadow: false });
      F.draw(ctx, 'UPGRADE THE OBSERVATORY TO LV ' + (S.selZone + 1), VW - 16, VH - 20, '#9c8ec4', { right: true, shadow: false });
    }
  }

  function drawSystem(ctx, g, t) {
    const z = D.ZONES[S.zone];
    const list = z.bodies;
    const zo = U.clamp(S.zoom, 0, 1);
    ctx.save();
    ctx.globalAlpha = zo;

    // the star, hard left, with orbit arcs sweeping out of it
    const sp = sun(S.zone);
    ctx.drawImage(sp, 34 - sp.width / 2, 132 - sp.height / 2);
    for (let k = 0; k < list.length; k++) {
      const p = bodyPos(k, list.length);
      X.orbit(ctx, 34, 132, p.x - 34, (p.x - 34) * 0.42, z.star, 4, zo * 0.35);
    }

    for (let k = 0; k < list.length; k++) {
      const i = list[k];
      const p = bodyPos(k, list.length);
      const size = 22 + Math.min(3, k) * 5;
      const art = planetArt(i, size);
      const open = bodyOpen(g, i);
      const sel = S.selBody === i;
      const bob = Math.sin(t * 1.2 + k) * 2;
      ctx.save();
      if (!open) ctx.globalAlpha = zo * 0.4;
      ctx.drawImage(art, p.x - art.width / 2, p.y + bob - art.height / 2);
      ctx.restore();
      if (g.save.destroyed[i]) {
        ctx.strokeStyle = '#ff6b8a'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x - 12, p.y + bob - 12); ctx.lineTo(p.x + 12, p.y + bob + 12);
        ctx.moveTo(p.x + 12, p.y + bob - 12); ctx.lineTo(p.x - 12, p.y + bob + 12);
        ctx.stroke();
      } else if (!open) {
        PD.glyph.draw(ctx, 'lock', p.x - 6, p.y + bob - 6, '#ffffff', '#5a4d80');
      }
      F.draw(ctx, D.BODIES[i].name.toUpperCase(), p.x, p.y + bob + size * 0.7 + 6, sel ? '#ffd34d' : '#9c8ec4', { center: true });
      if (sel) {
        // pixel corner brackets instead of a spinning circle
        const r = Math.round(size * 0.62 + 7 + Math.sin(t * 4) * 1.5);
        for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
          X.rect(ctx, p.x + sx * r - (sx < 0 ? 0 : 7), p.y + bob + sy * r - (sy < 0 ? 0 : 1), 7, 2, '#ffd34d');
          X.rect(ctx, p.x + sx * r - (sx < 0 ? 0 : 2), p.y + bob + sy * r - (sy < 0 ? 0 : 7), 2, 7, '#ffd34d');
        }
      }
    }
    ctx.restore();

    // dossier
    const b = D.BODIES[S.selBody];
    const open = bodyOpen(g, S.selBody);
    panel(ctx, 8, VH - 72, VW - 16, 66, open ? '#7ef9ff' : '#5a4d80');
    F.draw(ctx, b.name.toUpperCase(), 16, VH - 66, '#f2e9ff', { shadow: false, scale: 2 });
    F.draw(ctx, b.kind.toUpperCase(), VW - 16, VH - 64, '#7ef9ff', { right: true, shadow: false });
    F.draw(ctx, b.blurb, 16, VH - 52, '#9c8ec4', { shadow: false });
    F.draw(ctx, (D.LORE[S.selBody] || '').toUpperCase().slice(0, 62), 16, VH - 42, '#7d6aa8', { shadow: false });
    F.draw(ctx, 'DEPTH ' + b.radius * 10 + 'M', 16, VH - 36, '#7ef9ff', { shadow: false });
    F.draw(ctx, 'GRAV ' + b.gravity, 106, VH - 36, '#7ef9ff', { shadow: false });
    F.draw(ctx, 'CORE ' + U.fmt(b.coreHp), 166, VH - 36, '#ff6b8a', { shadow: false });
    F.draw(ctx, 'BOUNTY $' + U.fmt(b.reward), 246, VH - 36, '#ffd34d', { shadow: false });
    let ox = 16;
    F.draw(ctx, 'ORE', ox, VH - 22, '#9c8ec4', { shadow: false });
    ox += 24;
    for (const pair of b.ores.slice(0, 8)) { PD.art.oreChip(ctx, pair[0], ox, VH - 26, 14); ox += 15; }
    if (g.save.destroyed[S.selBody]) F.draw(ctx, 'ALREADY DESTROYED', ox + 10, VH - 22, '#ff6b8a', { shadow: false });
    if (open) {
      const bw = 110, bx = VW - bw - 12, by = VH - 30;
      ctx.fillStyle = Math.sin(t * 4) > 0 ? '#39ffa6' : '#2ad48a';
      ctx.fillRect(bx, by, bw, 20);
      ctx.strokeStyle = '#d6ffe9'; ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, 19);
      F.draw(ctx, 'E    DROP', bx + bw / 2, by + 7, '#05170e', { center: true, shadow: false });
    } else {
      F.draw(ctx, S.selBody > g.save.unlocked ? 'LOCKED - FINISH THE LAST WORLD' : 'NEEDS A DRIVE', VW - 14, VH - 22, '#ff6b8a', { right: true, shadow: false });
    }
  }

  PD.starmap = { enter, update, draw, S };
})(window.PD);

/* ===== src/desk.js ===== */
/* THE STOLEN COMPUTER.

   You are not clever with machines. You took this one off a human world along
   with the desk it was bolted to, and you have never really worked out how it
   goes. So: first person, hands on the keys, a beige box humming in your face,
   and a mouse pointer that arrives a moment after you meant it to. Everything
   you will ever own is bought on ABAY, and every rock you dig is listed there.
   The scene is drawn entirely in screen space -- no cameras, no world. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const F = PD.font;
  const A = PD.audio;
  const D = PD.data;
  const X = PD.pxd;
  const pix = PD.pix;
  const Gy = () => PD.glyph;

  const VW = 480, VH = 270;

  /* ----------------------------------------------------------- geometry */
  const CX = 20, CY = 2, CW = 440, CH = 202;          // the beige case
  const SX = 40, SY = 14, SW = 400, SH = 168;         // the glass
  const BARY = SY + SH - 12;                          // task bar
  const WX = SX + 4, WY = SY + 10, WW = SW - 8, WH = SH - 22;

  /* ----------------------------------------------------------- palette
     A 1990s human office, seen by something that has never worked in one. */
  const C = {
    caseF: '#cfc4a0', caseL: '#e8dfbe', caseD: '#a19574', caseDD: '#6d6450',
    wall: '#2a2233', wallD: '#1c1626', wallL: '#3a3145',
    glass: '#0a1108', phos: '#9dffb0',
    page: '#e9e5d6', pageD: '#d2ccb6', pageDD: '#b6af98',
    ink: '#241f16', dim: '#6f6752',
    chrome: '#bab4a0', chromeL: '#e2dcc8', chromeD: '#87816e',
    link: '#2f4fb0', red: '#d8382c', ylw: '#f0b028', blu: '#2f6fd0', grn: '#3a9c48',
    win: '#2f4a9c', winD: '#1d2f66',
    wood: '#5a3f2c', woodD: '#3e2a1c', woodL: '#75543a'
  };

  /* ------------------------------------------------------------- assets
     A fat three-fingered mitt, seen from behind, resting on the keys. Built
     at double density so it survives the zoom. */
  const handCache = {};
  function buildHands(P) {
    const key = P.skin;
    if (handCache[key]) return handCache[key];
    const s = P.skin, d = P.skinD, l = P.skinL;
    const NAIL = '#efe6bd', NAILD = '#c9bb8a';
    const frames = [];
    for (let f = 0; f < 3; f++) {
      const p = pix(136, 158);
      /* forearm, running down and out of frame towards you */
      p.round(34, 100, 78, 58, 22, d);
      p.round(28, 112, 90, 46, 20, s);
      p.round(36, 122, 74, 36, 16, d);
      /* the jacket cuff, three sizes too short for the arm inside it */
      p.round(22, 122, 100, 24, 8, '#4a5a3a');
      p.rect(22, 122, 100, 4, '#63744c');
      p.rect(22, 142, 100, 4, '#36432a');
      for (let i = 0; i < 5; i++) p.rect(28 + i * 20, 126, 7, 16, '#3f4c32');
      p.round(30, 118, 12, 10, 4, '#63744c');            // a button, hanging on
      /* wrist, then the back of the hand -- wide, meaty, faceted */
      p.round(30, 78, 72, 38, 15, s);
      p.round(20, 40, 92, 52, 18, s);
      p.round(26, 34, 80, 26, 11, l);
      p.shade(s, d, 1, 1);
      /* three knuckle ridges, each with its own little shadow under it */
      for (let k = 0; k < 3; k++) {
        const kx = 26 + k * 28;
        p.round(kx, 34, 24, 18, 8, l);
        p.round(kx + 3, 36, 18, 8, 4, '#d8f2df');
        p.rect(kx + 2, 52, 20, 3, d);
      }
      /* tendons across the back of the hand */
      for (let k = 0; k < 3; k++) p.rect(32 + k * 28, 58, 3, 26, d);
      /* three fat fingers. The middle one lifts to type; the others drum. */
      const lift = [[0, 0, 0], [0, -12, 0], [-8, 0, -5]][f];
      for (let k = 0; k < 3; k++) {
        const fx = 24 + k * 28, fy = 4 + lift[k];
        p.round(fx, fy + 6, 24, 42, 11, s);              // the finger
        p.round(fx + 3, fy + 10, 17, 20, 8, l);          // lit along the top
        p.rect(fx + 4, fy + 30, 16, 3, d);               // the joint crease
        p.rect(fx + 6, fy + 38, 12, 3, d);
        p.round(fx + 4, fy, 16, 12, 5, NAIL);            // a flat, filthy claw
        p.rect(fx + 5, fy + 2, 14, 6, '#f8f0d0');
        p.rect(fx + 4, fy + 9, 16, 3, NAILD);
        p.set(fx + 7, fy + 4, '#ffffff');

      /* the warts, the veins and one very old scar */
      p.round(40, 66, 10, 8, 4, l); p.round(72, 74, 8, 7, 3, l);
      p.round(58, 90, 7, 6, 3, l);
      p.rect(36, 94, 24, 3, d); p.rect(68, 100, 20, 3, d);
      p.line(32, 56, 56, 46, d); p.line(32, 57, 56, 47, d);
      p.line(33, 58, 57, 48, l);
      p.outline('#140f1e');
      frames.push(p.toCanvas());

  /* ---------------------------------------------------------------- state */
  const S = {

    tab: 0,                 // abay: 0 buy, 1 auctions, 2 sell, 3 feedback
    cat: 0,                 // which shelf of BUY IT NOW you are looking at
    auc: [], aucT: 0,

    view: null, cart: [], cartOpen: 0, co: null, bump: 0,
    icon: -1
  };

  const APPS = [
    { id: 'abay', name: 'ABAY', glyph: 'sell' },
    { id: 'map', name: 'STAR MAP', glyph: 'galaxy' },
    { id: 'mail', name: 'MESSAGES', glyph: 'quest' },
    { id: 'setup', name: 'SETUP', glyph: 'machine' }
  ];

  const GLYPH_OF = {
    drill: 'drill', reach: 'drill', oxygen: 'o2', lung: 'o2', cargo: 'cargo', belly: 'cargo',
    hull: 'hull', ironskin: 'hull', tether: 'belt', thruster: 'speed', dash: 'dash',
    pistol: 'gun', trigger: 'gun', scatter: 'scatter', lance: 'lance', lamp: 'eye',
    magnet: 'weight', scanner: 'scan', crew: 'crew', refine: 'machine', greed: 'coin', warp: 'galaxy'
  };

  /* Adverts. They are for other people. They are always for other people. */
  const ADS = [
    'ZORB SINGLES: WET WORMS IN YOUR SECTOR >>',
    'HOOKED ON A FEELING? BUY THE TAPE. 2 CREDITS.',

    'ONE WEIRD TRICK TO CRACK A PLANET. NOVA HATE IT.',
    'KNOWHERE TIMESHARE. IT IS A HEAD. LIVE IN A HEAD.',
    'ARE YOU A TREE? CLICK HERE. WE ARE ALSO A TREE.',
    'LOSE 40KG OF ROCK FAST. ASK ME ABOUT MY SACK.'
  ];

  /* Feedback left on you, by people who have met you. */
  const FEEDBACK = [
    ['gamora_no_relation', 5, 'FAST DELIVERY. SELLER SMELLED OF BURNING. WOULD BUY AGAIN.'],
    ['i_am_groot', 5, 'I AM GROOT.'],
    ['yondu_prime_deals', 1, 'HE STOLE THE ORB OFF ME. I TAUGHT HIM THAT. PROUD. ANGRY.'],
    ['collector_tivan', 4, 'ITEM WAS A ROCK, AS DESCRIBED. I COLLECT ROCKS. NO NOTES.'],
    ['drax_literal', 2, 'HE SAID THE PRICE WAS A STEAL. NOTHING WAS STOLEN. LIAR.'],
    ['rocket_88', 3, 'BOUGHT HIS LEG. SENT ME A DRILL. LEG STILL PENDING.'],
    ['nova_corps_admin', 1, 'YOU ARE ON A LIST. THE LIST IS NOT A GOOD LIST.'],
    ['star_lad_69', 4, 'ASKED IF HE HAD A WALKMAN. HE ATE IT. FOUR STARS FOR EFFORT.'],
    ['ronan_customer_care', 1, 'YOUR PLANET-CRACKING IS DERIVATIVE. I DID IT FIRST.'],
    ['wet_ted', 5, 'GOOD CUSTOMER. BUYS ORGANS. NEVER ASKS WHOSE.']
  ];

  /* Messages. Nobody nice has this address. */
  function mailbox(g) {
    const box = [
      ['MUM', 'ARE YOU EATING. ARE YOU DESTROYING ENOUGH WORLDS. ANSWER ONE.'],
      ['ABAY BILLING', 'YOUR SUBSCRIPTION TO ABAY PRIME RENEWED. YOU NEVER SUBSCRIBED.'],
      ['NOVA CORPS', 'BOUNTY UPDATED: $' + U.fmt(D.bountyFor ? D.bountyFor(g.save) : 0) + '. CONGRATULATIONS?'],
      ['krunk_tools_99', 'DRILL BIT IS NOT UNDER WARRANTY IF USED ON A PLANET.'],

  /* ---------------------------------------------------------------- enter */
  function enter(g) {
    S.lock = 0.25;
    S.boot = 0;
    S.app = 'home';
    S.scroll = S.scrollTo = 0;
    S.cx = VW / 2; S.cy = 120; S.vx = S.vy = 0;

  }

  function close(g) {

  /* --------------------------------------------------------------- update */
  function update(dt, g) {
    const IN = PD.input;
    const m = IN.mouse;

    S.boot = Math.min(2, S.boot + dt);
    S.hum += dt;
    S.press = Math.max(0, S.press - dt * 3);
    S.typeT = Math.max(0, S.typeT - dt);
    S.flash = Math.max(0, S.flash - dt * 2);
    S.adT += dt;
    if (S.adT > 7) { S.adT = 0; S.ad = (S.ad + 1) % ADS.length; S.adOn = true; }
    // the auction clocks run whether or not you are looking at them
    if (S.auc.length) stepAuctions(dt, g);

    // the pointer. He has it by the wrong end, so it swings past and settles.
    const tx = U.clamp(m.x, SX + 2, SX + SW - 2), ty = U.clamp(m.y, SY + 2, SY + SH - 2);
    if (PD.touch && PD.touch.enabled) { S.cx = tx; S.cy = ty; S.vx = S.vy = 0; }
    else {
      const k = 900, drag = 11;
      S.vx += (tx - S.cx) * k * dt; S.vy += (ty - S.cy) * k * dt;
      S.vx -= S.vx * drag * dt; S.vy -= S.vy * drag * dt;
      S.cx += S.vx * dt; S.cy += S.vy * dt;
      // a permanent tremor: he is holding a mouse with a hand built for rocks

      S.wantT += dt;

  /* The font is fixed width, so a truncation is just arithmetic. */
  function clip(str, maxW) {
    const per = F.GW + F.GAP;
    const n = Math.floor(maxW / per);
    str = String(str);
    return str.length <= n ? str : str.slice(0, Math.max(0, n - 2)) + '..';
  }

  /* An OCTAGON made of integer scanlines. Nothing on this machine is round. */
  function pxDisc(ctx, cx, cy, r, col) {
    ctx.fillStyle = col;
    for (let y = Math.ceil(cy - r); y <= Math.floor(cy + r); y++) {
      const dy = Math.abs(y - cy + 0.5) / r;
      if (dy > 1) continue;
      const w = r * Math.sqrt(Math.max(0, 1 - dy * dy));
      const x0 = Math.round(cx - w), x1 = Math.round(cx + w);
      if (x1 > x0) ctx.fillRect(x0, y, x1 - x0, 1);
    }
  }

  /* ------------------------------------------------------------- AUCTIONS
     ABAY is not only a shop. Half of it is people selling one thing each with
     a clock on it, and a rival who wants it too. Bid and you are winning;
     wait and grunk_92 takes it off you. Win and you pay well under the
     buy-it-now, which is the whole reason to bother.

     The rival has a hidden ceiling of about five-sixths of the shop price, so
     an auction is always worth a go and never a sure thing. */
  const RIVALS = ['grunk_92', 'notarobot4', 'MOTHER', 'bidbot_prime', 'zorb_jr',
    'THE_CURATOR', 'a_very_normal_guy', 'kevin'];

  function makeAuction(g) {
    const pool = D.ABAY.filter(it => (g.save.upg[it.id] || 0) < g.abayMax(it.id));
    if (!pool.length) return null;
    const it = U.pick(pool);
    const shop = g.abayPrice(it.id);
    return {
      it, shop,
      bid: Math.max(10, Math.round(shop * U.rand(0.28, 0.46) / 10) * 10),
      inc: Math.max(10, Math.round(shop * 0.06 / 10) * 10),
      ceil: Math.round(shop * U.rand(0.72, 0.92)),
      ends: U.rand(26, 70), mine: false,
      rival: U.pick(RIVALS), think: U.rand(1.6, 4), done: 0
    };
  }

  function seedAuctions(g) {
    S.auc.length = 0;
    for (let i = 0; i < 4; i++) { const a = makeAuction(g); if (a) S.auc.push(a); }
  }

  function stepAuctions(dt, g) {
    for (let i = S.auc.length - 1; i >= 0; i--) {
      const a = S.auc[i];
      a.ends -= dt;
      if (a.ends <= 0) {
        // the hammer. If you are still the high bidder it is yours.
        if (a.mine) {
          if (g.save.credits >= a.bid) {
            g.save.credits -= a.bid;
            g.save.upg[a.it.id] = (g.save.upg[a.it.id] || 0) + 1;
            g.recompute(); g.saveGame();
            say('WON: ' + a.it.name + ' FOR $' + U.fmt(a.bid) + '. THAT IS A STEAL.');
            A.sfx.fanfare ? A.sfx.fanfare() : A.sfx.coin();
            S.flash = 1;
            for (let k = 0; k < 18; k++) {
              S.coins.push({ x: SX + SW / 2 + U.rand(-20, 20), y: SY + 60, vx: U.rand(-90, 90), vy: U.rand(-110, -30), t: 0, life: 1.2 });
            }
          } else { say('YOU WON AND CANNOT PAY. ABAY IS TELLING EVERYONE.'); A.sfx.deny(); }
        } else if (a.seen) {
          say(a.rival.toUpperCase() + ' GOT THE ' + a.it.name + '. OF COURSE THEY DID.');
        }
        S.auc.splice(i, 1);
        const nu = makeAuction(g); if (nu) S.auc.push(nu);
        continue;
      }
      // the rival only wakes up when you are ahead, and only up to its ceiling
      if (!a.mine) continue;
      a.think -= dt;
      if (a.think > 0) continue;
      a.think = U.rand(1.8, 5);
      if (a.bid + a.inc > a.ceil) return;         // it has had enough
      a.bid += a.inc; a.mine = false;
      a.ends = Math.max(a.ends, 6);               // a late bid extends the clock
      say(a.rival.toUpperCase() + ' BID $' + U.fmt(a.bid) + '. ON YOUR OWN ITEM.');
      A.sfx.tone(300, { type: 'square', to: 180, dur: 0.12, vol: 0.08 });
    }
  }

  function placeBid(g, a) {
    const next = a.mine ? a.bid : a.bid + a.inc;
    if (a.mine) { say('YOU ARE ALREADY WINNING. CALM DOWN.'); A.sfx.deny(); return; }
    if (g.save.credits < next) { say('NOT ENOUGH MONEY. GO AND HIT A PLANET.'); A.sfx.deny(); return; }
    a.bid = next; a.mine = true; a.seen = 1;
    a.ends = Math.max(a.ends, 8);
    a.think = U.rand(1.4, 4);
    say('BID $' + U.fmt(a.bid) + '. YOU ARE WINNING. FOR NOW.');
    A.sfx.click();
  }

  /* ------------------------------------------------------------------ ABAY */
  const TABS = ['BUY NOW', 'AUCTIONS', 'MY ROCKS', 'FEEDBACK'];
  const CATS = ['ALL', 'DIG', 'BODY', 'SHIP', 'BANG', 'BIZ', 'JUNK'];
  function drawAbay(ctx, g, t) {
    windowFrame(ctx, 'ABAY - THE PLACE WHERE THINGS ARE', g);

    if (btn(ctx, x0 + 226, y0 + 4, 30, 11, 'FIND')) { A.sfx.deny(); say('NO. YOU FIND.'); }
    // the basket, which is the only thing on this page that has ever worked
    const cn = cartCount();
    S.bump = Math.max(0, S.bump - g.dt * 2);
    const bkx = x0 + w - 178, bky = y0 + 2 - Math.round(S.bump * 3);
    X.plate(ctx, bkx, bky, 60, 14, S.cartOpen ? '#f2c23a' : C.chrome, C.chromeL, C.chromeD, 3);
    Gy().draw(ctx, 'cargo', bkx + 2, bky, C.ink, C.dim);
    F.draw(ctx, 'BASKET', bkx + 18, bky + 4, C.ink, { shadow: false });
    if (cn > 0) {
      X.rect(ctx, bkx + 50, bky - 2, 12, 10, C.red);
      F.draw(ctx, String(cn), bkx + 56, bky - 1, '#ffffff', { center: true, shadow: false });
    }
    if (press(bkx, bky, 60, 14)) { S.cartOpen = S.cartOpen ? 0 : 1; S.view = null; A.sfx.click(); }
    Gy().draw(ctx, 'coin', x0 + w - 96, y0 + 3, C.ylw, '#a8781a');
    F.draw(ctx, '$' + U.fmt(g.save.credits), x0 + w - 6, y0 + 2, '#1e6b2e', { right: true, shadow: false });
    if (g.save.debt > 0) {
      F.draw(ctx, 'OWED $' + U.fmt(g.save.debt), x0 + w - 6, y0 + 11, C.red, { right: true, shadow: false });
    }

    const ty = y0 + 18;
    /* The listing page, the basket and the checkout each take over the whole
       window: the tab strip's content area is seventy pixels tall and a real
       photograph of a thing does not fit in seventy pixels. */
    if (S.co || S.view || S.cartOpen) {
      const ay = ty + 2, ah = WY + WH - 16 - ay;
      if (S.co) drawCheckout(ctx, g, t, x0 + 2, w - 4, ay, ah);
      else if (S.view) drawDetail(ctx, g, t, x0 + 2, w - 4, ay, ah);
      else drawCart(ctx, g, t, x0 + 2, w - 4, ay, ah);
      const fy2 = WY + WH - 14;
      X.rect(ctx, x0 + 2, fy2, w - 4, 11, C.pageD);
      F.draw(ctx, S.status, x0 + 6, fy2 + 2, C.dim, { shadow: false });
      return;
    }

    /* tabs */
    for (let i = 0; i < TABS.length; i++) {
      const tw = 63, tx = x0 + 4 + i * (tw + 3);
      const on = S.tab === i;
      X.rect(ctx, tx, ty + (on ? 0 : 2), tw, on ? 12 : 10, on ? C.page : C.pageD);
      X.rect(ctx, tx, ty + (on ? 0 : 2), tw, 1, on ? '#ffffff' : C.pageDD);
      F.draw(ctx, TABS[i], tx + tw / 2, ty + (on ? 3 : 4), on ? C.ink : C.dim, { center: true, shadow: false });
      if (press(tx, ty, tw, 12)) {
        S.tab = i; S.scroll = S.scrollTo = 0; A.sfx.click();
        if (i === 0) PD.chum.call(g, 'abay');
        if (i === 1) PD.chum.call(g, 'auction');
      }
      if (i === 1 && S.auc.some(a => a.mine)) {   // you are winning something
        X.rect(ctx, tx + tw - 5, ty - 2, 5, 5, Math.sin(t * 7) > 0 ? C.grn : '#1e6b2e');
      }
    }
    X.rect(ctx, x0, ty + 12, w, 1, C.pageDD);

    /* the shelf of categories, only where it means anything */
    let shelf = 0;
    if (S.tab === 0) {
      shelf = 13;
      X.rect(ctx, x0, ty + 13, w, 12, C.pageD);
      for (let i = 0; i < CATS.length; i++) {
        const cw = 38, cx2 = x0 + 5 + i * (cw + 2);
        const on = S.cat === i;
        X.rect(ctx, cx2, ty + 14, cw, 10, on ? C.blu : C.page);
        X.rect(ctx, cx2, ty + 14, cw, 1, on ? '#8ab0ff' : '#ffffff');
        F.draw(ctx, CATS[i], cx2 + cw / 2, ty + 16, on ? '#ffffff' : C.dim, { center: true, shadow: false });
        if (press(cx2, ty + 14, cw, 10)) { S.cat = i; S.scroll = S.scrollTo = 0; A.sfx.click(); }
      }
      X.rect(ctx, x0, ty + 25, w, 1, C.pageDD);
    }

    const bx = x0 + 4, by = ty + 15 + shelf, bw = w - 8, bh = WY + WH - 4 - by - 12;
    ctx.save();
    ctx.beginPath(); ctx.rect(bx, by, bw, bh); ctx.clip();
    if (S.tab === 0) abayBuy(ctx, g, t, bx, by, bw, bh);
    else if (S.tab === 1) abayAuctions(ctx, g, t, bx, by, bw, bh);
    else if (S.tab === 2) abaySell(ctx, g, t, bx, by, bw, bh);
    else abayFeedback(ctx, g, t, bx, by, bw, bh);
    ctx.restore();

    /* the advert strip, and the status line */
    const fy = WY + WH - 14;
    if (S.adOn) {
      X.rect(ctx, x0 + 2, fy, w - 4, 11, '#3a1c4e');
      for (let i = 0; i < w - 4; i += 6) X.rect(ctx, x0 + 2 + i, fy, 3, 1, ((i / 6 + (t * 6 | 0)) % 2) ? '#ff8ad8' : '#58e8ff');
      F.draw(ctx, ADS[S.ad], x0 + 8, fy + 2, Math.sin(t * 6) > 0 ? '#ffe86a' : '#ff9ad8', { shadow: false });
      if (btn(ctx, x0 + w - 14, fy + 1, 10, 9, 'X', { face: C.chrome })) { S.adOn = false; A.sfx.click(); say('THE ADVERT IS BACK IN 7 SECONDS. THAT IS THE DEAL.'); }
    } else {
      X.rect(ctx, x0 + 2, fy, w - 4, 11, C.pageD);
      F.draw(ctx, S.status, x0 + 6, fy + 2, C.dim, { shadow: false });
    }
  }

  function abayLogo(ctx, x, y, t) {
    const L = [['A', C.red], ['B', C.blu], ['A', C.ylw], ['Y', C.grn]];
    for (let i = 0; i < 4; i++) {
      const bob = Math.round(Math.sin(t * 3 + i) * 1);
      F.draw(ctx, L[i][0], x + i * 14, y + bob, L[i][1], { scale: 2, shadow: false });
    }
    F.draw(ctx, 'TM', x + 56, y, C.dim, { shadow: false });
  }

  function scrollbar(ctx, x, y, h, total, view) {
    if (total <= view) { S.scrollTo = 0; return; }
    S.scrollTo = Math.min(S.scrollTo, total - view);
    X.rect(ctx, x, y, 7, h, C.pageD);
    const kh = Math.max(10, Math.round(h * view / total));
    const ky = y + Math.round((h - kh) * S.scroll / (total - view));
    X.rect(ctx, x, ky, 7, kh, C.chrome);
    X.rect(ctx, x, ky, 7, 1, C.chromeL);
    X.rect(ctx, x, ky + kh - 1, 7, 1, C.chromeD);
    if (press(x, y, 7, h)) { S.scrollTo = U.clamp((S.fireY - y - kh / 2) / (h - kh) * (total - view), 0, total - view); A.sfx.click(); }
  }

  /* ---------------------------------------------------------- the photograph
     Every listing on ABAY has a real photo of the actual item, taken by the
     seller, on the floor, at night, with the flash on. There is a thumb over
     the corner of about half of them and they all have the date burned into
     them in orange. Built once per item and kept. */
  const PHOTO = {};
  const SURFACES = [
    ['#7a6a52', '#6b5c46', '#8a7a62'],      // a carpet
    ['#3a4a6a', '#32405c', '#46577a'],      // a duvet
    ['#8a5a5a', '#7a4e4e', '#9a6a6a'],      // a sofa
    ['#5a6a4a', '#4e5c40', '#6a7a58'],      // a lawn, somehow
    ['#9a9488', '#8a8478', '#aaa498']       // a worktop
  ];
  const PW = 58, PH = 44;

  function photoOf(it) {
    if (PHOTO[it.id]) return PHOTO[it.id];
    let seed = 7;
    for (let i = 0; i < it.id.length; i++) seed = (Math.imul(seed, 31) + it.id.charCodeAt(i)) | 0;
    seed >>>= 0;
    const R = U.mulberry32(seed);
    const cv = document.createElement('canvas');
    cv.width = PW; cv.height = PH;
    const c = cv.getContext('2d');
    const su = SURFACES[(R() * SURFACES.length) | 0];

    // the surface it has been dumped on
    c.fillStyle = su[0]; c.fillRect(0, 0, PW, PH);
    for (let y = 0; y < PH; y++) {
      for (let x = 0; x < PW; x++) {
        const n = U.hash2(x + seed, y * 3);
        if (n > 0.88) { c.fillStyle = su[2]; c.fillRect(x, y, 1, 1); }
        else if (n < 0.14) { c.fillStyle = su[1]; c.fillRect(x, y, 1, 1); }
      }
    }
    // the item: off-centre, because nobody lines a photo up
    const ox = Math.round((R() - 0.5) * 10), oy = Math.round((R() - 0.5) * 6);
    const gx = PW / 2 + ox - 21, gy = PH / 2 + oy - 21;
    X.blob(c, PW / 2 + ox + 2, PH / 2 + oy + 15, 17, 4, 'rgba(0,0,0,0.4)');
    c.globalAlpha = 0.3;                                  // the shake
    Gy().draw(c, GLYPH_OF[it.id] || 'quest', gx + 1, gy + 1, '#c9c4b4', '#7a7460', 3);
    c.globalAlpha = 1;
    Gy().draw(c, GLYPH_OF[it.id] || 'quest', gx, gy, '#fbf7ea', '#b0a892', 3);

    // the flash, straight back off it
    const fx = PW / 2 + ox - 5, fy = PH / 2 + oy - 8;
    for (let i = 4; i >= 1; i--) {
      c.globalAlpha = 0.13 * (5 - i) / 4;
      X.blob(c, fx, fy, 4 + i * 4, 3 + i * 3, '#ffffff');
    }
    c.globalAlpha = 0.55; X.blob(c, fx, fy, 4, 3, '#ffffff'); c.globalAlpha = 1;

    // a thumb, about half the time
    if (R() < 0.45) {
      const left = R() < 0.5;
      const tx = left ? -4 : PW - 12;
      c.globalAlpha = 0.95;
      X.blob(c, tx + 8, PH - 2, 13, 12, '#c98a6a');
      X.blob(c, tx + 8, PH - 6, 8, 6, '#e0a78a');
      c.globalAlpha = 1;
    }
    // it is too dark at the edges, as these things are
    for (let i = 0; i < 5; i++) {
      c.fillStyle = 'rgba(0,0,0,' + (0.05 * (5 - i)).toFixed(2) + ')';
      c.fillRect(i, 0, 1, PH); c.fillRect(PW - 1 - i, 0, 1, PH);
      c.fillRect(0, i, PW, 1); c.fillRect(0, PH - 1 - i, PW, 1);
    }
    // and the date, burned in, in the wrong year
    F.draw(c, '12 05 ' + (70 + ((seed >> 3) % 30)), PW - 2, PH - 8, '#ff8a3d', { right: true, shadow: false });
    PHOTO[it.id] = cv;
    return cv;
  }

  function drawPhoto(ctx, it, x, y, k) {
    const cv = photoOf(it);
    X.rect(ctx, x - 1, y - 1, PW * k + 2, PH * k + 2, '#ffffff');
    X.rect(ctx, x - 1, y - 1, PW * k + 2, 1, C.pageDD);
    ctx.drawImage(cv, 0, 0, PW, PH, x | 0, y | 0, PW * k, PH * k);
  }

  /* ------------------------------------------------------------- the basket */
  function cartCount() { let n = 0; for (const l of S.cart) n += l.n; return n; }
  function cartTotal(g) {
    let n = 0;
    for (const l of S.cart) {
      const lvl = (g.save.upg[l.id] || 0);
      for (let i = 0; i < l.n; i++) n += Math.round(D.abayCost(D.ABAYX[l.id], lvl + i) * (1 - g.brain('know') * 0.05));
    }
    return n;
  }
  function addToCart(g, it) {
    const cap = g.abayMax(it.id), lvl = g.save.upg[it.id] || 0;
    const line = S.cart.find(l => l.id === it.id);
    if (lvl + (line ? line.n : 0) >= cap) { A.sfx.deny(); say('YOU ALREADY HAVE ALL OF THOSE.'); return; }
    if (line) line.n++; else S.cart.push({ id: it.id, n: 1 });
    A.sfx.click();
    say('ADDED TO BASKET. THE BASKET IS AT THE TOP.');
    S.bump = 1;
  }

  /* ================================================================ CHECKOUT
     Buying a thing off a human website involves signing in, proving you are
     not a robot, reading numbers off a piece of plastic, and then waiting for
     a code to arrive from orbit. He does all four, badly, and Mr Chum talks
     him through it. */
  const CARD = { no: '4029 8817 3355 9142', last: '9142', name: 'MR ALIEN', exp: '99/99', cvv: '007' };
  const CAPTCHA = [
    ['rock', '#8a7a62', '#5e5040'], ['coin', '#e0b02a', '#8a6a12'], ['rock', '#8a7a62', '#5e5040'],
    ['star', '#58a8e0', '#2a5f8a'], ['skull', '#d8d4c4', '#7a7460'], ['rock', '#8a7a62', '#5e5040'],
    ['hand', '#6aba72', '#2f7a42'], ['rock', '#8a7a62', '#5e5040'], ['o2', '#c06aa8', '#7a2f62']
  ];

  function startCheckout(g) {
    if (!S.cart.length) { A.sfx.deny(); say('THE BASKET IS EMPTY. THAT IS WHY IT IS LIGHT.'); return; }
    if (g.save.credits < cartTotal(g)) { A.sfx.deny(); say('NOT ENOUGH MONEY FOR THE WHOLE BASKET.'); return; }
    let code = '';
    for (let i = 0; i < 8; i++) code += U.randInt(0, 9);
    S.co = { step: 0, typed: '', code: code, got: 0, t: 0, ticked: [], err: 0, ok: 0 };
    S.view = null;
    A.sfx.click();
    PD.chum.call(g, 'checkout');
  }

  function keypad(ctx, g, x, y, max) {
    const KW = 22, KH = 13;
    for (let i = 0; i < 12; i++) {
      const kx = x + (i % 3) * (KW + 3), ky = y + ((i / 3) | 0) * (KH + 3);
      const lab = i < 9 ? String(i + 1) : (i === 9 ? 'DEL' : (i === 10 ? '0' : 'OK'));
      const face = i === 10 || i < 9 ? '#e8e4d0' : (i === 9 ? '#d8b0a0' : '#9fdc9f');
      if (btn(ctx, kx, ky, KW, KH, lab, { face: face })) {
        if (i === 9) { S.co.typed = S.co.typed.slice(0, -1); A.sfx.click(); }
        else if (i === 11) { S.co.ok = 1; A.sfx.click(); }
        else if (S.co.typed.length < max) { S.co.typed += (i === 10 ? '0' : String(i + 1)); A.sfx.tone(700 + i * 30, { type: 'square', dur: 0.04, vol: 0.04 }); }
      }
    }
    // the real keyboard works too, for anyone who has one
    const IN = PD.input;
    for (let d = 0; d <= 9; d++) {
      if ((IN.hit('Digit' + d) || IN.hit('Numpad' + d)) && S.co.typed.length < max) {
        S.co.typed += String(d); A.sfx.tone(700 + d * 30, { type: 'square', dur: 0.04, vol: 0.04 });
      }
    }
    if (IN.hit('Backspace')) S.co.typed = S.co.typed.slice(0, -1);
    if (IN.hit('enter')) S.co.ok = 1;
  }

  function typedBox(ctx, x, y, w, n, t) {
    const CWD = Math.floor(w / n);
    for (let i = 0; i < n; i++) {
      const bx = x + i * CWD;
      sunk(ctx, bx, y, CWD - 2, 15, '#ffffff');
      const ch = S.co.typed[i];
      if (ch) F.draw(ctx, ch, bx + (CWD - 2) / 2, y + 4, C.ink, { center: true, shadow: false, scale: 2 });
      else if (i === S.co.typed.length && Math.sin(t * 8) > 0) X.rect(ctx, bx + (CWD - 2) / 2, y + 3, 1, 9, C.ink);
    }
  }

  function drawCheckout(ctx, g, t, x0, w, ay, ah) {
    const co = S.co;
    co.t += g.dt;
    X.rect(ctx, x0, ay, w, ah, C.page);
    // the progress strip
    const STEPS = ['SIGN IN', 'CARD', 'CODE', 'DONE'];
    for (let i = 0; i < 4; i++) {
      const sw = 62, sx = x0 + 8 + i * (sw + 6);
      const on = co.step === i, done = co.step > i;
      X.rect(ctx, sx, ay + 4, sw, 11, done ? '#9fdc9f' : (on ? C.blu : C.pageD));
      F.draw(ctx, STEPS[i], sx + sw / 2, ay + 6, on ? '#ffffff' : (done ? '#1e6b2e' : C.dim), { center: true, shadow: false });
      if (i < 3) X.rect(ctx, sx + sw, ay + 9, 6, 1, C.pageDD);
    }
    const py = ay + 20, ph2 = ah - 22;

    if (co.step === 0) {
      F.draw(ctx, 'SIGN IN TO ABAY', x0 + 8, py, C.ink, { shadow: false, scale: 2 });
      F.draw(ctx, 'EMAIL', x0 + 8, py + 20, C.dim, { shadow: false });
      sunk(ctx, x0 + 44, py + 18, 150, 11, '#ffffff');
      F.draw(ctx, 'BIG_ALIEN_1997@ZORB.MOON', x0 + 47, py + 20, C.ink, { shadow: false });
      F.draw(ctx, 'PASS', x0 + 8, py + 34, C.dim, { shadow: false });
      sunk(ctx, x0 + 44, py + 32, 150, 11, '#ffffff');
      F.draw(ctx, '**************', x0 + 47, py + 34, C.ink, { shadow: false });
      // the captcha, which is the only bit of this he has to do
      F.draw(ctx, 'TICK THE ROCKS', x0 + 238, py + 2, C.ink, { shadow: false });
      for (let i = 0; i < 9; i++) {
        const cx2 = x0 + 238 + (i % 3) * 22, cy2 = py + 12 + ((i / 3) | 0) * 22;
        const tick = co.ticked.indexOf(i) >= 0;
        sunk(ctx, cx2, cy2, 20, 20, tick ? '#cfe6ff' : '#ffffff');
        Gy().draw(ctx, CAPTCHA[i][0], cx2 + 3, cy2 + 3, CAPTCHA[i][1], CAPTCHA[i][2]);
        if (tick) { X.rect(ctx, cx2 + 14, cy2 + 1, 6, 6, C.grn); F.draw(ctx, 'V', cx2 + 15, cy2 + 2, '#ffffff', { shadow: false }); }
        if (press(cx2, cy2, 20, 20)) {
          const k = co.ticked.indexOf(i);
          if (k >= 0) co.ticked.splice(k, 1); else co.ticked.push(i);
          A.sfx.click();
        }
      }
      if (btn(ctx, x0 + 8, py + 50, 90, 14, 'SIGN IN', { face: '#f2c23a', light: '#ffe08a' })) {
        const want = [];
        for (let i = 0; i < 9; i++) if (CAPTCHA[i][0] === 'rock') want.push(i);
        const got = co.ticked.slice().sort().join(',') === want.join(',');
        if (got) { co.step = 1; co.typed = ''; A.sfx.buy(); say('SIGNED IN. THAT TOOK LONGER THAN THE MINING.'); }
        else { co.err = 1.4; co.ticked.length = 0; A.sfx.deny(); say('THAT IS NOT A ROCK. TRY AGAIN.'); }
      }
      if (co.err > 0) {
        co.err -= g.dt;
        F.draw(ctx, 'WRONG. IT THINKS YOU ARE A ROBOT.', x0 + 8, py + 68, C.red, { shadow: false });
      }
    } else if (co.step === 1) {
      F.draw(ctx, 'THE LAST FOUR', x0 + 8, py, C.ink, { shadow: false, scale: 2 });
      F.draw(ctx, 'READ IT OFF THE CARD.', x0 + 172, py + 1, C.dim, { shadow: false });
      F.draw(ctx, 'IT IS IN THE BOX.', x0 + 172, py + 10, C.dim, { shadow: false });
      // the card itself, on the desk
      const cx2 = x0 + 8, cy2 = py + 16;
      X.plate(ctx, cx2, cy2, 134, 54, '#3f6ba8', '#5a8cc9', '#22436b', 4);
      X.rect(ctx, cx2, cy2 + 8, 134, 9, '#2a3f60');
      X.rect(ctx, cx2 + 8, cy2 + 20, 18, 12, '#e0c060');
      for (let i = 0; i < 3; i++) X.rect(ctx, cx2 + 10, cy2 + 22 + i * 4, 14, 1, '#a8842a');
      F.draw(ctx, 'ZORB EXPRESS', cx2 + 128, cy2 + 2, '#cfe0ff', { right: true, shadow: false });
      F.draw(ctx, CARD.no, cx2 + 6, cy2 + 35, '#ffffff', { shadow: false });
      F.draw(ctx, CARD.name, cx2 + 6, cy2 + 45, '#cfe0ff', { shadow: false });
      F.draw(ctx, 'EXP ' + CARD.exp, cx2 + 128, cy2 + 45, '#cfe0ff', { right: true, shadow: false });
      /* The last four are ringed. Without the ring he types the first four,
         every single time, and then blames the card. */
      const lx = cx2 + 6 + F.width('4029 8817 3355 ', 1) - 2;
      X.rect(ctx, lx, cy2 + 32, 27, 1, '#ffd34d');
      X.rect(ctx, lx, cy2 + 42, 27, 1, '#ffd34d');
      X.rect(ctx, lx, cy2 + 32, 1, 11, '#ffd34d');
      X.rect(ctx, lx + 26, cy2 + 32, 1, 11, '#ffd34d');
      typedBox(ctx, x0 + 150, py + 26, 84, 4, t);
      keypad(ctx, g, x0 + w - 82, py + 14, 4);
      if (co.ok) {
        co.ok = 0;
        if (co.typed === CARD.last) { co.step = 2; co.typed = ''; co.got = 0; co.t = 0; A.sfx.buy(); PD.chum.call(g, 'twofa'); }
        else { co.err = 1.4; co.typed = ''; A.sfx.deny(); say('THAT IS NOT THE NUMBER. IT IS ON THE CARD.'); }
      }
      if (co.err > 0) { co.err -= g.dt; F.draw(ctx, 'NO.', x0 + 150, py + 46, C.red, { shadow: false, scale: 2 }); }
    } else if (co.step === 2) {
      F.draw(ctx, 'THE 8 DIGITS', x0 + 8, py, C.ink, { shadow: false, scale: 2 });
      F.draw(ctx, 'COMING IN FROM ORBIT.', x0 + 166, py + 4, C.dim, { shadow: false });
      // the code is coming in from orbit, one digit at a time
      const want = Math.min(8, Math.floor(co.t / 0.55));
      if (want > co.got) { co.got = want; A.sfx.tone(1200, { type: 'sine', to: 1700, dur: 0.07, vol: 0.04 }); }
      const sx2 = x0 + 8, sy2 = py + 16, sw2 = 132, sh2 = 46;
      X.rect(ctx, sx2, sy2, sw2, sh2, '#0b0720');
      for (let i = 0; i < 40; i++) {
        const px2 = sx2 + ((U.hash2(i, 5) * sw2) | 0), py2 = sy2 + ((U.hash2(i, 9) * sh2) | 0);
        X.rect(ctx, px2, py2, 1, 1, U.hash2(i, 11) > 0.6 ? '#ffffff' : '#8a7ab0');
      }
      // a satellite, turning
      const stx = sx2 + 22, sty = sy2 + 26;
      X.rect(ctx, stx - 8, sty - 2, 16, 5, '#8e86a8');
      X.rect(ctx, stx - 14, sty - 6, 5, 13, '#3f6ba8');
      X.rect(ctx, stx + 9, sty - 6, 5, 13, '#3f6ba8');
      X.blob(ctx, stx + 2, sty - 8, 5, 4, '#c9c4b4');
      ctx.globalAlpha = 0.3 + Math.abs(Math.sin(t * 4)) * 0.3;
      X.poly(ctx, [[stx + 4, sty - 9], [stx + 8, sty - 9], [sx2 + sw2, sy2 + 6], [sx2 + sw2, sy2 + 22]], '#7ef9ff');
      ctx.globalAlpha = 1;
      // the digits fly in one at a time and line up along the bottom
      for (let i = 0; i < co.got; i++) {
        const a = Math.min(1, (co.t - i * 0.55) * 3);
        const dx = sx2 + 22 + i * 12 + (1 - a) * 60, dy = sy2 + sh2 - 13 - (1 - a) * 14;
        ctx.globalAlpha = a;
        F.draw(ctx, co.code[i], dx, dy, a >= 1 ? '#4cff9a' : '#7ef9ff', { shadow: false, scale: 2 });
        ctx.globalAlpha = 1;
      }
      F.draw(ctx, co.got >= 8 ? 'ALL EIGHT' : 'RECEIVING...', sx2 + 4, sy2 + 3, '#8a7ab0', { shadow: false });
      typedBox(ctx, x0 + 150, py + 26, 92, 8, t);
      keypad(ctx, g, x0 + w - 82, py + 14, 8);
      if (co.ok) {
        co.ok = 0;
        if (co.typed === co.code) { co.step = 3; co.t = 0; A.sfx.buy(); }
        else { co.err = 1.4; co.typed = ''; A.sfx.deny(); say('WRONG CODE. IT IS THE ONE FROM SPACE.'); }
      }
      if (co.err > 0) { co.err -= g.dt; F.draw(ctx, 'NO.', x0 + 150, py + 46, C.red, { shadow: false, scale: 2 }); }
    } else {
      if (co.t < 1.4) {
        F.draw(ctx, 'PLACING ORDER', x0 + w / 2, py + 20, C.ink, { center: true, shadow: false, scale: 2 });
        const n = Math.floor(co.t * 6) % 4;
        F.draw(ctx, '.'.repeat(n + 1), x0 + w / 2, py + 38, C.dim, { center: true, shadow: false, scale: 2 });
        X.rect(ctx, x0 + w / 2 - 60, py + 54, 120, 8, C.pageD);
        X.rect(ctx, x0 + w / 2 - 60, py + 54, Math.round(120 * co.t / 1.4), 8, C.grn);
      } else {
        if (!co.done) {
          co.done = 1;
          let bought = 0;
          for (const l of S.cart) for (let i = 0; i < l.n; i++) if (g.abayBuy(l.id)) bought++;
          co.bought = bought;
          S.cart.length = 0;
          S.flash = 1;
          for (let i = 0; i < 20; i++) S.coins.push({ x: SX + SW / 2 + U.rand(-30, 30), y: SY + 50, vx: U.rand(-80, 80), vy: U.rand(-110, -20), t: 0, life: 1 });
          say('ORDER PLACED. IT IS ALREADY ON THE MOON. DO NOT ASK.');
