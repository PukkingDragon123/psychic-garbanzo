<title>Planet Destroyer</title>
<meta name="description" content="A 2D pixel-art mining sandbox: drill asteroids to the core, get obscenely rich, take over the galaxy.">
<style>
:root {
  --ink: #05030f;
  --grape: #1d1338;
  --edge: #5b3f96;
  --gold: #ffd34d;
  --pink: #ff5fa8;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--ink);
  color: #f2e9ff;
  font-family: "Courier New", ui-monospace, monospace;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}

#screen {
  display: block;
  width: 100vw;
  height: 100vh;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: crosshair;
  background: var(--ink);
}

/* Subtle scanline + vignette laid over the canvas for that CRT arcade feel. */
#crt {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.14) 0px,
      rgba(0, 0, 0, 0.14) 1px,
      rgba(0, 0, 0, 0) 1px,
      rgba(0, 0, 0, 0) 3px
    ),
    radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
  mix-blend-mode: multiply;
  opacity: 0.85;
  z-index: 5;
}

#boot {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: var(--ink);
  z-index: 10;
  text-align: center;
  padding: 24px;
}

#boot h1 {
  margin: 0;
  font-size: clamp(24px, 6vw, 54px);
  letter-spacing: 4px;
  color: var(--gold);
  text-shadow: 4px 4px 0 #7a2a10;
}

#boot h2 {
  margin: 0;
  font-size: clamp(18px, 4.5vw, 40px);
  letter-spacing: 3px;
  color: var(--pink);
  text-shadow: 4px 4px 0 #3a0c30;
}

#boot p { margin: 0; color: #9c8ec4; max-width: 34em; line-height: 1.5; }

#boot .err {
  color: #ff6b8a;
  border: 1px solid #8a2f4a;
  background: #200a18;
  padding: 10px 14px;
  max-width: 40em;
  text-align: left;
  white-space: pre-wrap;
}

.hidden { display: none !important; }

</style>

<canvas id="screen" width="960" height="540"></canvas>
<div id="crt"></div>
<div id="boot">
  <h1>PLANET</h1>
  <h2>DESTROYER</h2>
  <p>Loading the drill&hellip;</p>
</div>

<script>
/* ===== src/util.js ===== */
/* Planet Destroyer -- small math / helper library.
   Everything hangs off the single global PD namespace so the game can run
   straight off the filesystem (classic scripts, no module loader needed). */
window.PD = window.PD || {};

(function (PD) {
  'use strict';

  const TAU = Math.PI * 2;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function invLerp(a, b, v) { return b === a ? 0 : (v - a) / (b - a); }
  function smoothstep(a, b, v) { const t = clamp(invLerp(a, b, v), 0, 1); return t * t * (3 - 2 * t); }

  /* Frame-rate independent exponential approach: `t` is the fraction covered
     in one second. Used for camera and meter easing. */
  function damp(a, b, t, dt) { return lerp(a, b, 1 - Math.pow(1 - t, dt * 60)); }

  function rand(a, b) {
    if (a === undefined) return Math.random();
    if (b === undefined) return Math.random() * a;
    return a + Math.random() * (b - a);
  }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function chance(p) { return Math.random() < p; }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* table is [[value, weight], ...] */
  function weighted(table) {
    let total = 0;
    for (let i = 0; i < table.length; i++) total += table[i][1];
    let r = Math.random() * total;
    for (let i = 0; i < table.length; i++) {
      r -= table[i][1];
      if (r <= 0) return table[i][0];
    }
    return table[table.length - 1][0];
  }

  /* Deterministic hash noise -- keeps tile speckle stable between frames.
     Math.imul throughout: a plain float multiply here overflows 2^53 and
     silently throws away the low bits, which badly skews the distribution. */
  function hash2(x, y) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Cheap value noise built on hash2 -- plenty for ore veins and cave blobs. */
  function noise2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi), b = hash2(xi + 1, yi);
    const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }

  function fbm(x, y, octaves) {
    let sum = 0, amp = 0.5, norm = 0;
    for (let i = 0; i < (octaves || 3); i++) {
      sum += noise2(x, y) * amp;
      norm += amp;
      amp *= 0.5; x *= 2; y *= 2;
    }
    return sum / norm;
  }

  /* Turn "I want the top f fraction of tiles" into an fbm threshold.
     fbm() is roughly normal (mean ~0.52, sd ~0.15), so we go through a small
     inverse-normal table instead of guessing cutoffs. */
  const QZ = [
    [0.00, 3.2], [0.01, 2.33], [0.02, 2.05], [0.05, 1.645], [0.10, 1.282],
    [0.15, 1.036], [0.20, 0.842], [0.25, 0.674], [0.30, 0.524], [0.40, 0.253],
    [0.50, 0], [0.60, -0.253], [0.70, -0.524], [0.80, -0.842], [0.90, -1.282],
    [1.00, -3.2]
  ];
  function probitTop(f) {
    f = clamp(f, 0, 1);
    for (let i = 1; i < QZ.length; i++) {
      if (f <= QZ[i][0]) {
        const t = (f - QZ[i - 1][0]) / (QZ[i][0] - QZ[i - 1][0]);
        return lerp(QZ[i - 1][1], QZ[i][1], t);
      }
    }
    return -3.2;
  }
  function fbmThreshold(f, mean, sd) {
    return (mean === undefined ? 0.52 : mean) + (sd === undefined ? 0.15 : sd) * probitTop(f);
  }

  function dist(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return Math.sqrt(dx * dx + dy * dy); }
  function dist2(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; }

  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  /* Shortest signed angle from a to b. */
  function angleDelta(a, b) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }

  const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
  function fmt(n) {
    n = Math.floor(n);
    if (Math.abs(n) < 1000) return String(n);
    let tier = 0;
    let v = n;
    while (Math.abs(v) >= 1000 && tier < SUFFIX.length - 1) { v /= 1000; tier++; }
    const s = v < 10 ? v.toFixed(2) : (v < 100 ? v.toFixed(1) : v.toFixed(0));
    return s.replace(/\.0+$/, '') + SUFFIX[tier];
  }

  function fmtKg(kg) {
    return (kg < 10 ? kg.toFixed(1) : Math.round(kg).toString()) + 'kg';
  }

  function roman(n) {
    const map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
    let out = '';
    for (const [v, s] of map) { while (n >= v) { out += s; n -= v; } }
    return out || 'I';
  }

  PD.util = {
    TAU, clamp, lerp, invLerp, smoothstep, damp,
    rand, randInt, chance, pick, shuffle, weighted,
    hash2, mulberry32, noise2, fbm, probitTop, fbmThreshold,
    dist, dist2, aabb, angleDelta,
    fmt, fmtKg, roman
  };
})(window.PD);

/* ===== src/pix.js ===== */
/* A tiny pixel-pushing helper.
   Sprites are painted at their true pixel size with hard-edged primitives, then
   `outline()` traces a dark border around everything -- which is what gives the
   whole game its chunky cartoon look for free. */
(function (PD) {
  'use strict';

  function Pix(w, h) {
    this.w = w; this.h = h;
    this.d = new Array(w * h).fill(null);
  }

  Pix.prototype.idx = function (x, y) { return y * this.w + x; };

  Pix.prototype.set = function (x, y, c) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return this;
    this.d[y * this.w + x] = c;
    return this;
  };

  Pix.prototype.get = function (x, y) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null;
    return this.d[y * this.w + x];
  };

  Pix.prototype.rect = function (x, y, w, h, c) {
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c);
    return this;
  };

  Pix.prototype.ellipse = function (cx, cy, rx, ry, c) {
    const x0 = Math.floor(cx - rx - 1), x1 = Math.ceil(cx + rx + 1);
    const y0 = Math.floor(cy - ry - 1), y1 = Math.ceil(cy + ry + 1);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) this.set(x, y, c);
      }
    }
    return this;
  };

  Pix.prototype.disc = function (cx, cy, r, c) { return this.ellipse(cx, cy, r, r, c); };

  /* Rounded rectangle -- corners are simply clipped by a distance test. */
  Pix.prototype.round = function (x, y, w, h, r, c) {
    for (let j = 0; j < h; j++) {
      for (let i = 0; i < w; i++) {
        const px = i < r ? r - i - 0.5 : (i >= w - r ? i - (w - r) + 0.5 : 0);
        const py = j < r ? r - j - 0.5 : (j >= h - r ? j - (h - r) + 0.5 : 0);
        if (px * px + py * py > r * r) continue;
        this.set(x + i, y + j, c);
      }
    }
    return this;
  };

  Pix.prototype.line = function (x0, y0, x1, y1, c) {
    x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    for (;;) {
      this.set(x0, y0, c);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
    return this;
  };

  /* Isoceles triangle pointing up (dir -1) or down (dir 1). */
  Pix.prototype.spike = function (x, y, w, h, dir, c) {
    for (let j = 0; j < h; j++) {
      const t = j / h;
      const half = Math.max(0, (w / 2) * (1 - t));
      const yy = dir > 0 ? y + j : y + h - 1 - j;
      for (let i = -half; i <= half; i++) this.set(x + i, yy, c);
    }
    return this;
  };

  /* Mirror the left half onto the right half -- keeps faces symmetrical. */
  Pix.prototype.mirrorX = function () {
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w / 2; x++) {
        this.set(this.w - 1 - x, y, this.get(x, y));
      }
    }
    return this;
  };

  Pix.prototype.replace = function (from, to) {
    for (let i = 0; i < this.d.length; i++) if (this.d[i] === from) this.d[i] = to;
    return this;
  };

  /* Trace a border around every filled pixel. */
  Pix.prototype.outline = function (c) {
    const snap = this.d.slice();
    const at = (x, y) => (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : snap[y * this.w + x];
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        if (at(x, y)) continue;
        if (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1)) this.set(x, y, c);
      }
    }
    return this;
  };

  /* Darken the lower-right facing pixels of a colour to fake a light source. */
  Pix.prototype.shade = function (from, to, dx, dy) {
    const snap = this.d.slice();
    const at = (x, y) => (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : snap[y * this.w + x];
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        if (at(x, y) !== from) continue;
        const n = at(x + dx, y + dy);
        if (n === null || n !== from) this.set(x, y, to);
      }
    }
    return this;
  };

  Pix.prototype.toCanvas = function () {
    const cv = document.createElement('canvas');
    cv.width = this.w; cv.height = this.h;
    const ctx = cv.getContext('2d');
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        const c = this.d[y * this.w + x];
        if (!c) continue;
        ctx.fillStyle = c;
        ctx.fillRect(x, y, 1, 1);
      }
    }
    return cv;
  };

  PD.Pix = Pix;
  PD.pix = (w, h) => new Pix(w, h);
})(window.PD);

/* ===== src/glyph.js ===== */
/* The game's icon language. Every glyph is drawn procedurally at 12x12 and
   cached per colour, so the HUD, terminals and tutorial can speak without
   words: a bar plus a glyph plus a number is a sentence. */
(function (PD) {
  'use strict';
  const pix = PD.pix;
  const U = PD.util;

  const INK = '#1a1030';
  const builders = {};
  const cache = {};

  function def(name, fn) { builders[name] = fn; }

  /* Each builder draws in a single "paint" colour c, plus optional accent a. */
  def('coin', (p, c, a) => { p.disc(6, 6, 5, c); p.disc(6, 6, 3.2, a); p.rect(5, 3, 2, 6, c); p.rect(4, 4, 4, 1, c); p.rect(4, 7, 4, 1, c); });
  def('ore', (p, c, a) => { p.round(1, 4, 10, 7, 3, c); p.round(3, 1, 6, 5, 2, c); p.rect(3, 3, 3, 1, a); p.rect(2, 6, 2, 2, a); p.rect(7, 7, 2, 1, a); p.set(5, 2, '#ffffff'); });
  def('drill', (p, c, a) => { p.round(0, 4, 5, 4, 1, a); for (let x = 5; x < 12; x++) { const h = Math.max(0, 2.5 - (x - 5) * 0.4); for (let y = -h; y <= h; y++) p.set(x, Math.round(6 + y), (x + Math.round(y)) % 2 ? c : a); } });
  def('gun', (p, c, a) => { p.round(0, 4, 8, 4, 1, a); p.rect(2, 8, 2, 3, a); p.rect(8, 5, 4, 2, c); });
  def('scatter', (p, c, a) => { p.round(0, 4, 7, 4, 1, a); p.rect(2, 8, 2, 3, a); p.rect(7, 3, 5, 2, c); p.rect(7, 7, 5, 2, c); });
  def('lance', (p, c, a) => { p.round(0, 4, 6, 4, 1, a); p.rect(2, 8, 2, 3, a); p.rect(6, 5, 6, 2, c); p.rect(10, 3, 2, 6, c); });
  def('dash', (p, c, a) => { p.spike(8, 2, 8, 8, 1, c); p.rect(0, 4, 4, 1, a); p.rect(0, 6, 5, 1, a); p.rect(0, 8, 3, 1, a); });
  def('scan', (p, c, a) => { for (let t = 0; t < 6.3; t += 0.35) p.set(6 + Math.cos(t) * 5, 6 + Math.sin(t) * 5, a); p.disc(6, 6, 2, c); p.line(6, 6, 10, 2, c); });
  def('o2', (p, c, a) => { p.round(3, 2, 6, 10, 2, c); p.rect(4, 0, 4, 2, a); p.rect(5, 4, 2, 5, a); });
  def('hull', (p, c, a) => { p.round(2, 1, 8, 7, 2, c); p.spike(6, 6, 8, 5, 1, c); p.rect(5, 3, 2, 3, a); });
  def('cargo', (p, c, a) => { p.round(1, 3, 10, 8, 1, c); p.rect(1, 5, 10, 1, a); p.rect(5, 3, 2, 8, a); });
  def('weight', (p, c, a) => { p.spike(6, 4, 10, 7, 1, c); p.rect(2, 10, 8, 1, c); p.rect(5, 1, 2, 3, a); p.set(5, 1, c); p.set(6, 1, c); });
  def('planet', (p, c, a) => { p.disc(6, 6, 4.5, c); p.disc(4.5, 4.5, 1.5, a); p.disc(7.5, 7, 1, a); p.rect(0, 6, 12, 1, a); });
  def('hole', (p, c, a) => { p.disc(6, 6, 5.5, c); p.disc(6, 6, 3.6, a); p.disc(6, 6, 2, INK); p.set(9, 3, a); p.set(3, 9, a); });
  def('hand', (p, c, a) => { p.rect(5, 0, 3, 7, c); p.round(2, 5, 9, 7, 2, c); p.rect(1, 6, 2, 3, c); p.rect(9, 6, 2, 3, c); p.rect(6, 1, 1, 4, a); p.rect(4, 8, 5, 1, a); });
  def('arrowR', (p, c) => { p.rect(0, 5, 7, 2, c); p.spike(8, 2, 8, 4, 1, c); p.spike(8, 6, 8, 4, -1, c); p.rect(7, 4, 2, 4, c); });
  def('arrowD', (p, c) => { p.rect(5, 0, 2, 7, c); for (let i = 0; i < 4; i++) p.rect(2 + i, 6 + i, 8 - i * 2, 1, c); });
  def('arrowU', (p, c) => { p.rect(5, 5, 2, 7, c); for (let i = 0; i < 4; i++) p.rect(2 + i, 5 - i, 8 - i * 2, 1, c); });
  def('lock', (p, c, a) => { p.round(2, 5, 8, 7, 1, c); p.rect(3, 2, 6, 4, a); p.rect(4, 3, 4, 3, INK); p.rect(3, 2, 6, 1, a); p.rect(5, 7, 2, 3, INK); });
  def('check', (p, c) => { p.line(1, 6, 4, 10, c); p.line(2, 6, 5, 10, c); p.line(4, 10, 11, 2, c); p.line(5, 10, 11, 3, c); });
  def('cross', (p, c) => { p.line(1, 1, 10, 10, c); p.line(2, 1, 11, 10, c); p.line(10, 1, 1, 10, c); p.line(11, 1, 2, 10, c); });
  def('clock', (p, c, a) => { p.disc(6, 6, 5.5, c); p.disc(6, 6, 4.3, INK); p.rect(5, 2, 2, 5, a); p.rect(6, 6, 3, 2, a); });
  def('star', (p, c, a) => { p.spike(6, 0, 5, 6, 1, c); p.spike(6, 6, 5, 6, -1, c); p.rect(0, 5, 12, 2, c); p.disc(6, 6, 1.5, a); });
  def('skull', (p, c, a) => { p.round(2, 1, 8, 7, 3, c); p.rect(3, 3, 2, 2, INK); p.rect(7, 3, 2, 2, INK); p.rect(4, 7, 4, 2, c); p.rect(4, 8, 1, 2, c); p.rect(6, 8, 1, 2, c); p.set(5, 6, INK); p.set(6, 6, INK); });
  def('machine', (p, c, a) => { p.round(1, 4, 10, 7, 1, c); p.rect(2, 1, 3, 3, a); p.rect(7, 2, 2, 2, a); p.rect(3, 6, 6, 2, INK); p.rect(3, 6, 3, 2, a); });
  def('belt', (p, c, a) => { p.rect(0, 4, 12, 4, c); p.rect(1, 5, 2, 2, a); p.rect(5, 5, 2, 2, a); p.rect(9, 5, 2, 2, a); });
  def('crew', (p, c, a) => { p.disc(6, 3.5, 3, c); p.round(1, 7, 10, 5, 2, c); p.set(5, 3, INK); p.set(7, 3, INK); p.rect(3, 9, 6, 1, a); });
  def('home', (p, c, a) => { p.spike(6, 0, 12, 6, 1, c); p.rect(2, 6, 8, 6, c); p.rect(5, 8, 2, 4, INK); p.rect(3, 7, 2, 2, a); });
  def('bang', (p, c) => { p.rect(5, 0, 2, 7, c); p.rect(5, 9, 2, 2, c); });
  def('quest', (p, c) => { p.round(3, 0, 6, 5, 2, c); p.rect(4, 1, 4, 2, INK); p.rect(3, 1, 1, 2, INK); p.rect(6, 5, 2, 3, c); p.rect(6, 10, 2, 2, c); });
  def('play', (p, c) => { p.spike(6, 1, 10, 10, 1, c); }); // pointing down; rotated in draw
  def('rock', (p, c, a) => { p.round(1, 3, 10, 8, 3, c); p.round(3, 1, 6, 4, 2, c); p.set(4, 5, a); p.set(7, 6, a); p.set(5, 8, a); });
  def('depth', (p, c, a) => { p.rect(2, 0, 8, 2, c); p.rect(5, 2, 2, 7, c); p.spike(6, 8, 8, 4, 1, c); p.rect(0, 10, 12, 2, a); });

  function build(name, c, a) {
    const key = name + '|' + c + '|' + a;
    if (cache[key]) return cache[key];
    const p = pix(14, 14);
    const inner = pix(12, 12);
    (builders[name] || builders.quest)(inner, c, a || c);
    for (let y = 0; y < 12; y++) for (let x = 0; x < 12; x++) { const v = inner.get(x, y); if (v) p.set(x + 1, y + 1, v); }
    p.outline(INK);
    const cv = p.toCanvas();
    cache[key] = cv;
    return cv;
  }

  /* Draw a glyph with its top-left at x,y (14px box) at integer scale. */
  function draw(ctx, name, x, y, c, a, scale) {
    const cv = build(name, c || '#f2e9ff', a || '#9c8ec4');
    const s = scale || 1;
    ctx.drawImage(cv, 0, 0, 14, 14, x | 0, y | 0, 14 * s, 14 * s);
  }

  /* A glyph + a number, the game's basic HUD sentence. Returns the width. */
  function stat(ctx, name, value, x, y, c, a, numCol) {
    draw(ctx, name, x, y, c, a);
    PD.font.draw(ctx, value, x + 17, y + 4, numCol || '#f2e9ff');
    return 17 + PD.font.width(String(value), 1);
  }

  /* Hexagon outline/fill helpers -- the UI's only shape besides the rectangle. */
  function hexPath(ctx, x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ang = Math.PI / 6 + i * Math.PI / 3;
      const px = x + Math.cos(ang) * r, py = y + Math.sin(ang) * r;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
  }
  function hex(ctx, x, y, r, fill, stroke, lw) {
    hexPath(ctx, x, y, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
  }
  /* Six-segment progress ring drawn as hex arcs. */
  function hexProgress(ctx, x, y, r, frac, col) {
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    const segs = Math.round(U.clamp(frac, 0, 1) * 6);
    for (let i = 0; i < segs; i++) {
      const a0 = -Math.PI / 2 + i * Math.PI / 3, a1 = a0 + Math.PI / 3;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a0) * r, y + Math.sin(a0) * r);
      ctx.lineTo(x + Math.cos(a1) * r, y + Math.sin(a1) * r);
      ctx.stroke();
    }
  }

  PD.glyph = { draw, stat, hex, hexPath, hexProgress, names: Object.keys(builders), build };

  function upgradeCost(u, level) {
    return Math.round(u.base * Math.pow(u.growth, level) / 10) * 10;
  }

  /* Upgrades are fabricated, not bought: every level burns raw ore out of the
     vault as well as credits, and high tiers demand exotic matter. */
  function recipe(u, level) {
    const out = [];
    for (const [key, base] of u.mats) {
      out.push({ mat: M[key], qty: Math.ceil(base * Math.pow(1.34, level)) });
    }
    if (u.late && level >= 5) {
      out.push({ mat: M[u.late[0]], qty: Math.ceil(u.late[1] * Math.pow(1.4, level - 5)) });
    }
    return out;
  }

  const gemSprites = {};
  function gemFor(matId) {
    if (gemSprites[matId]) return gemSprites[matId];
    const m = PD.data.MAT[matId];
    const build = m.shine ? buildGem : buildNugget;
    const cv = build(m.c).toCanvas();
    gemSprites[matId] = { frames: [cv], w: cv.width, h: cv.height, ox: cv.width / 2, oy: cv.height / 2 };
    return gemSprites[matId];
  }

  const skinCache = {};

    const cat = PD.data.COS[catId];

  function skinFor(cos) {
    cos = cos || {};

      const k = hd || 1;
      return { frames, w: frames[0].width / k, h: frames[0].height / k, ox, oy, hd: k };

    const set = {
      alien: mk(frames.idle, AOX, AOY, 2),
      alienWalk: mk(frames.walk, AOX, AOY, 2),
      alienFly: mk(frames.fly, AOX, AOY, 2),
      alienDrill: mk(frames.drill, AOX, AOY, 2),
      alienRoll: mk(frames.roll, AOX, 25, 2),
      drill: mk([0, 1, 2, 3].map(i => buildDrill(i, DP)), 5, 6, 2),
      ship: mk([buildShip(false, SP), buildShip(true, SP)], 42, 26),
      pod: mk([buildPod(0, SP), buildPod(1, SP)], 23, 18, 2),

    skinCache[key] = set;
    return set;
  }

  PD.art = { C, sprites, gemFor, ICON, skinFor, optOf, reg, blit, pixOf: pix };

/* ===== src/arthome.js ===== */
/* Art for your moon, at 2x density: the five buildings across three tiers,
   the ruins that were already here, the critters, the handheld tool, and the
   brain for the Mind screen. Everything is hard-edged pixel art built from

(function (PD) {
  'use strict';
  const pix = PD.pix;

  const C = PD.art.C;
  const HD = 2;

    gold: '#ffd34d', goldD: '#c99a1e',
    glow: '#7ef9ff', glowD: '#2f8fae', holo: '#58e8ff',
    lime: '#8affa0', rose: '#ff8ad8', amber: '#ffb03d', red: '#ff5a4d',
    ink: '#140f26', bone: '#e8dfc4', boneD: '#a89b78',
    navy: '#2b3a66', navyL: '#40568f', navyD: '#1b2547',

    warm: '#ffe9a8'

  const S = {};
  function crop(p) {
    let x0 = p.w, y0 = p.h, x1 = -1, y1 = -1;
    for (let y = 0; y < p.h; y++) for (let x = 0; x < p.w; x++) {
      if (!p.d[y * p.w + x]) continue;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }

    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) out.set(x - x0, y - y0, p.d[y * p.w + x]);
    return out;
  }
  /* Register at HD: ox/oy are logical, defaulting to bottom-centre. */
  function reg(name, builders, ox, oy) {
    const frames = builders.map(b => crop(b).toCanvas());

  }
  function blit(ctx, s, frame, x, y, flip) {

  /* ---------------------------------------------------------------- helpers */
  function windows(p, x, y, cols, rows, on, gap) {

  function lamp(p, x, y, col) { p.disc(x, y, 3, col); p.set(x - 1, y - 1, '#ffffff'); }

  /* ------------------------------------------------------------- THE DOCKS
     A landing apron with a gantry crane and fuel. The pod parks on it. */
  function docks(t) {

    // gantry crane, right

    pipeV(p, gx + 22, base - 90 - t * 10, 74 + t * 10);

    pipeH(p, gx - 60 - t * 12, base - 92 - t * 10, 88 + t * 12);
    p.round(gx - 52 - t * 12, base - 100 - t * 10, 26, 12, 3, P.amber);        // trolley
    p.line(gx - 40 - t * 12, base - 88 - t * 10, gx - 40 - t * 12, base - 56, '#d6cfe8');
    p.round(gx - 46 - t * 12, base - 58, 12, 8, 3, P.steel);                   // hook block
    p.disc(gx - 40 - t * 12, base - 48, 4, P.gold);

      p.rect(tx + 4, base - 50, 14, 4, '#ffd6b0');
      p.round(tx + 6, base - 66, 10, 8, 3, P.steelDD);
      p.rect(tx + 2, base - 34, 18, 3, P.steelDD);

    pipeH(p, 8, base - 24, 40 + t * 26);
    // control shack + tower at tier 2

      const sx = w / 2 - 20;

      p.shade(P.navy, P.navyD, 0, 1);
      windows(p, sx + 6, base - 42, 3, 1, 1, 12);
      p.round(sx - 2, base - 56, 48, 8, 3, P.steelD);

    }
    if (t >= 2) {

      p.round(tx - 14, base - 128, 32, 18, 5, P.navyL);

  }

  /* ---------------------------------------------------------------- TERMINAL
     A kiosk with a market board, a dish, and a bench for waiting. */
  function terminal(t) {
    const w = 130 + t * 24, h = 130 + t * 26;
    const p = pix(w, h);
    const base = h - 1, cx = w / 2;

    p.round(cx - 40, base - 60, 80, 60, 6, P.navy);
    p.shade(P.navy, P.navyD, 0, 1);

    }

    p.round(cx - 62, base - 14, 22, 5, 2, '#8a5a3a'); p.rect(cx - 60, base - 9, 3, 9, '#5a3a24'); p.rect(cx - 45, base - 9, 3, 9, '#5a3a24');
    for (let i = 0; i < 6; i++) p.rect(cx - 40 + i * 14, base - 76 + Math.abs(i - 3), 5, 7, [P.rose, P.amber, P.lime, P.glow, P.gold, P.rose][i]);
    if (t >= 2) {                                                     // billboard

      p.round(cx - 70, base - 114, 52, 32, 3, '#0f2a2e');
      p.rect(cx - 64, base - 106, 40, 4, P.lime); p.rect(cx - 64, base - 98, 28, 4, P.gold); p.rect(cx - 64, base - 90, 34, 4, P.rose);
      pipeV(p, cx - 48, base - 78, 78);
    }

    return p;
  }

  /* -------------------------------------------------------------- FABRICATOR
     A factory box with a printer arm, a furnace door and a conveyor. */
  function fab(t) {
    const w = 150 + t * 28, h = 120 + t * 26;
    const p = pix(w, h);

  /* ---------------------------------------------------------------- THE MIND
     A brain in a tank of acid, wired to a bank of computers. */
  function brainShape(p, cx, cy, r, col, colD, colL) {
    p.ellipse(cx, cy, r, r * 0.78, col);
    p.ellipse(cx - r * 0.5, cy - r * 0.25, r * 0.5, r * 0.5, col);
    p.ellipse(cx + r * 0.5, cy - r * 0.25, r * 0.5, r * 0.5, col);
    p.ellipse(cx, cy - r * 0.45, r * 0.55, r * 0.4, col);
    p.shade(col, colD, 0, 1);

    for (let i = 0; i < 6; i++) {
      const a = -0.3 + i * 0.5;
      p.line(cx + Math.cos(a) * r * 0.2, cy + Math.sin(a) * r * 0.2, cx + Math.cos(a) * r * 0.8, cy + Math.sin(a) * r * 0.55, colD);
    }
    p.rect(cx - 1, cy - r * 0.8, 2, r * 1.4, colD);
    p.ellipse(cx - r * 0.35, cy - r * 0.55, r * 0.22, r * 0.12, colL);

    p.round(cx - 4, cy + r * 0.6, 8, r * 0.5, 3, colD);
  }
  function mind(t) {
    const w = 150 + t * 30, h = 130 + t * 30;
    const p = pix(w, h);
    const base = h - 1;
    const tw = 70 + t * 14, th = 80 + t * 18, tx = 8, ty = base - 20 - th;
    // plinth
    p.round(0, base - 20, tw + 16, 20, 5, P.steelDD);
    p.rect(4, base - 17, tw + 8, 4, P.steel);
    for (let i = 0; i < 5; i++) lamp(p, 10 + i * ((tw - 4) / 4), base - 8, i % 2 ? P.lime : P.acid);

    p.round(tx, ty, tw, th, 10, C.glass);
    p.round(tx + 4, ty + 8, tw - 8, th - 12, 8, P.acidD);
    p.round(tx + 4, ty + 14, tw - 8, th - 18, 8, P.acid);
    p.rect(tx + 6, ty + 14, tw - 12, 2, '#c8ffe0');                     // surface
    for (let i = 0; i < 6 + t * 2; i++) {                               // bubbles
      p.disc(tx + 8 + U.hash2(i, 5) * (tw - 16), ty + 20 + U.hash2(i, 9) * (th - 30), 1.4 + U.hash2(i, 3) * 1.6, '#e8fff2');

    p.round(tx - 2, ty - 6, tw + 4, 10, 4, P.steelD);                     // lid
    pipeV(p, tx + tw / 2 - 2, ty - 24, 20); p.round(tx + tw / 2 - 8, ty - 30, 16, 8, 3, P.steelDD);

    p.round(bx + 3, base - 20 - (60 + t * 16) + 3, bw - 6, 20, 2, '#0f2a2e');
    for (let i = 0; i < 4; i++) p.rect(bx + 6, base - 20 - (60 + t * 16) + 7 + i * 4, 8 + Math.floor(U.hash2(i, t) * (bw - 20)), 2, i % 2 ? P.acid : P.glow);
    for (let j = 0; j < 3 + t; j++) for (let i = 0; i < 3; i++) p.rect(bx + 6 + i * 8, base - 44 + j * 7 - t * 16, 4, 3, U.hash2(i, j + t) > 0.5 ? P.lime : P.red);
    pipeH(p, tx + tw - 2, ty + th * 0.4, 12); pipeH(p, tx + tw - 2, ty + th * 0.7, 12);
    p.round(bx + 4, base - 26, bw - 8, 6, 2, P.steelDD);
    p.outline(P.ink);
    return p;
  }

  /* -------------------------------------------------------------- OBSERVATORY
     A dome on a stone base with a telescope poking out of the slit. */
  function obs(t) {
    const w = 130 + t * 24, h = 130 + t * 26;
    const p = pix(w, h);
    const base = h - 1, cx = w / 2;
    p.round(cx - 40, base - 50, 80, 50, 6, P.bone);
    p.shade(P.bone, P.boneD, 0, 1);
    for (let y = base - 44; y < base - 6; y += 10) p.rect(cx - 38, y, 76, 1, P.boneD);
    p.round(cx - 12, base - 24, 24, 24, 3, '#2a2440');
    p.round(cx - 10, base - 22, 20, 22, 2, P.warm);

    const dr = 42 + t * 6;
    p.disc(cx, base - 50, dr, P.navyL);
    p.rect(0, base - 50, w, 60, null);
    p.shade(P.navyL, P.navy, 0, 1);
    for (let i = 1; i < 4; i++) p.line(cx - dr + i * dr * 0.5, base - 50, cx - dr + i * dr * 0.5, base - 50 - Math.sqrt(dr * dr - Math.pow(i * dr * 0.5 - dr, 2)), P.navy);
    p.rect(cx + 6, base - 50 - dr, 14, dr - 6, '#0b0720');           // the slit
    // telescope
    for (let k = 0; k < 40 + t * 8; k++) p.rect(cx + 10 + k * 0.7, base - 70 - k, 8, 4, k % 8 < 4 ? P.steel : P.steelD);
    p.round(cx + 34 + t * 5, base - 116 - t * 8, 14, 10, 3, P.glow);
    // radar array at tier 2
    if (t >= 2) {
      for (let i = 0; i < 3; i++) {
        const rx = 12 + i * 22;

        p.ellipse(rx + 2, base - 76, 10, 6, P.steelD); p.ellipse(rx + 2, base - 78, 7, 4, P.glow);
      }
    }
    lamp(p, cx, base - 52 - dr, P.red);
    p.outline(P.ink);
    return p;
  }

  /* --------------------------------------------------------------- scenery */
  function survey() {
    const p = pix(60, 40);
    p.rect(28, 6, 4, 34, '#8a5a3a');
    p.round(22, 4, 16, 10, 3, P.holo);
    p.rect(26, 7, 8, 4, '#0b0720');
    for (let i = 0; i < 5; i++) { p.rect(4 + i * 12, 34 + (i % 2) * 2, 6, 2, i % 2 ? P.rose : P.amber); p.rect(4 + i * 12, 26, 1, 10, P.steelDD); }
    p.outline(P.ink);

  function ruin(kind) {

    if (kind === 0) {
      p.round(4, 26, 16, 58, 4, P.bone); p.round(60, 34, 16, 50, 4, P.bone);
      for (let i = 0; i < 26; i++) { const a = Math.PI + i / 25 * Math.PI; p.disc(40 + Math.cos(a) * 32, 34 + Math.sin(a) * 20, 6, i < 15 ? P.bone : P.boneD); }
      p.rect(8, 40, 6, 36, P.boneD); p.rect(64, 48, 6, 30, P.boneD);

      p.round(12, 40, 20, 26, 6, P.boneD); p.disc(52, 52, 9, P.bone); p.rect(48, 50, 8, 2, P.rose);
    } else {
      p.round(26, 4, 28, 78, 6, P.bone); p.shade(P.bone, P.boneD, 0, 1);
      p.rect(30, 12, 20, 4, P.rose); p.rect(30, 24, 20, 4, P.rose); p.rect(34, 36, 12, 4, P.glow); p.rect(30, 48, 20, 4, P.rose);
      p.round(20, 72, 40, 12, 4, P.boneD);
    }
    p.outline(P.ink);
    return p;
  }
  function critter(f, col, colD) {
    const p = pix(32, 30);
    const y = f ? 2 : 4;
    p.ellipse(16, y + 15, 12, 10, col);
    p.shade(col, colD, 0, 1);
    p.ellipse(16, y + 9, 8, 4, '#ffffff');
    p.ellipse(12, y + 13, 3, 3.6, C.eye); p.ellipse(20, y + 13, 3, 3.6, C.eye);
    p.disc(13, y + 12, 1.2, '#ffffff'); p.disc(21, y + 12, 1.2, '#ffffff');
    p.rect(14, y + 18, 4, 1, colD);
    p.round(7, y + 23, 7, 5, 2, P.ink); p.round(18, y + 23, 7, 5, 2, P.ink);
    p.line(16, y + 4, 16 + (f ? 4 : -4), y - 3, P.ink);
    p.disc(16 + (f ? 4 : -4), y - 4, 3, P.amber);
    p.ellipse(8, y + 16, 2, 1.4, '#ff8ab0'); p.ellipse(24, y + 16, 2, 1.4, '#ff8ab0');
    p.outline(P.ink);
    return p;
  }
  function flag(f) {
    const p = pix(28, 52);
    p.rect(4, 0, 4, 52, P.steelD);
    for (let i = 0; i < 16; i++) p.rect(8 + i, 6 + Math.floor(Math.sin(i * 0.5 + (f ? 1.5 : 0)) * 2.4), 1, 16, i < 8 ? P.rose : P.amber);
    p.outline(P.ink);
    return p;
  }
  function rock(k) {
    const p = pix(40, 26);
    const r = 8 + k * 4;
    p.ellipse(20, 16, r, r * 0.7, P.rock);
    p.shade(P.rock, P.rockD, 0, 1);
    p.ellipse(16, 10, r * 0.5, r * 0.25, P.rockL);
    p.set(24, 14, P.rockD); p.set(12, 18, P.rockD);
    p.outline(P.ink);
    return p;
  }

  /* The handheld multi-purpose tool, for the corner of the screen. */
  function phone(on) {
    const p = pix(36, 56);
    p.round(2, 2, 32, 52, 6, P.navyD);
    p.round(4, 4, 28, 48, 5, P.navy);
    p.round(6, 8, 24, 34, 3, on ? '#062a33' : '#0b1220');
    if (on) {
      p.rect(9, 12, 18, 3, P.holo); p.rect(9, 18, 12, 2, P.glowD); p.rect(9, 23, 16, 2, P.glowD);
      p.round(9, 28, 18, 10, 2, P.glowD); p.rect(12, 31, 12, 4, P.holo);
    }
    p.disc(18, 47, 3.5, P.steel); p.rect(14, 5, 8, 1, P.steel);
    p.rect(34, 14, 2, 8, P.steelD);
    p.outline(P.ink);
    return p;
  }

  /* The big brain for the Mind screen, drawn large. */
  function brainBig() {
    const p = pix(220, 170);
    brainShape(p, 110, 90, 78, P.brain, P.brainD, P.brainL);
    p.outline(P.ink);
    return p;
  }

  /* ------------------------------------------------------------- buildMoon */
  function buildMoon(size, tint, seed) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const c = cv.getContext('2d');
    const r = size / 2 - 1, cx = size / 2, cy = size / 2;
    const rnd = U.mulberry32(seed || 7);
    function shade(col, f) {
      const n = parseInt(col.slice(1), 16);
      const R = U.clamp(((n >> 16) & 255) * f, 0, 255) | 0, G = U.clamp(((n >> 8) & 255) * f, 0, 255) | 0, B = U.clamp((n & 255) * f, 0, 255) | 0;
      return 'rgb(' + R + ',' + G + ',' + B + ')';
    }
    c.fillStyle = shade(tint, 0.75);
    c.beginPath(); c.arc(cx, cy, r, 0, U.TAU); c.fill();
    c.save(); c.beginPath(); c.arc(cx, cy, r, 0, U.TAU); c.clip();
    for (let i = 0; i < 6; i++) {
      const a = rnd() * U.TAU, d = rnd() * r * 0.7;
      c.fillStyle = shade(tint, 0.5 + rnd() * 0.12);
      c.beginPath(); c.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r * (0.16 + rnd() * 0.24), 0, U.TAU); c.fill();
    }
    const craters = [];
    for (let i = 0; i < 46; i++) { const a = rnd() * U.TAU, d = Math.sqrt(rnd()) * r * 0.94; craters.push({ x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d, r: (0.5 + rnd() * rnd() * 5.5) * (size / 90) }); }
    craters.sort((p1, p2) => p2.r - p1.r);
    for (const k of craters) {
      c.fillStyle = shade(tint, 0.98); c.beginPath(); c.arc(k.x, k.y - k.r * 0.16, k.r, 0, U.TAU); c.fill();
      c.fillStyle = shade(tint, 0.42); c.beginPath(); c.arc(k.x, k.y + k.r * 0.2, k.r * 0.78, 0, U.TAU); c.fill();
      c.fillStyle = shade(tint, 0.62); c.beginPath(); c.arc(k.x, k.y + k.r * 0.05, k.r * 0.5, 0, U.TAU); c.fill();
    }
    for (let i = 0; i < size * 3; i++) { c.fillStyle = shade(tint, rnd() > 0.5 ? 1.12 : 0.7); c.globalAlpha = 0.3; c.fillRect((rnd() * size) | 0, (rnd() * size) | 0, 1, 1); }
    c.globalAlpha = 1;
    const term = c.createLinearGradient(0, size, size * 0.85, 0);
    term.addColorStop(0, 'rgba(4,2,12,0.94)'); term.addColorStop(0.45, 'rgba(4,2,12,0.55)'); term.addColorStop(0.8, 'rgba(4,2,12,0)');
    c.fillStyle = term; c.fillRect(0, 0, size, size);
    c.strokeStyle = shade(tint, 1.5); c.lineWidth = Math.max(1, size / 90);
    c.beginPath(); c.arc(cx, cy, r - 0.5, -1.5, 0.7); c.stroke();
    c.restore();
    return cv;
  }

  /* -------------------------------------------------------------- register */
  const BUILDERS = { docks, terminal, fab, mind, obs };
  for (const id in BUILDERS) for (let t = 0; t < 3; t++) reg(id + t, [BUILDERS[id](t)]);
  reg('survey', [survey()]);
  for (let i = 0; i < 3; i++) reg('ruin' + i, [ruin(i)]);
  for (let i = 0; i < 3; i++) reg('rock' + i, [rock(i)]);
  reg('critter', [critter(0, '#8affa0', '#3fb85a'), critter(1, '#8affa0', '#3fb85a')]);
  reg('critter2', [critter(0, '#ff8ad8', '#b0459a'), critter(1, '#ff8ad8', '#b0459a')]);
  reg('flag', [flag(0), flag(1)], 3);
  reg('phone', [phone(false), phone(true)], 9, 14);
  reg('brain', [brainBig()], 55, 42);

  PD.arthome = { S, P, buildMoon, blit, HD };
})(window.PD);

/* Deep-space backdrop: a spiral arm of stars and dust, coloured nebulae, a sun
   with a flare, ringed planets and moons, shooting stars. Everything heavy is
   pre-rendered once into layer canvases and scrolled with parallax. */
(function (PD) {
  'use strict';
  const U = PD.util;

  const VW = 480, VH = 270;
  let layers = null;

  function shade(hex, f, alpha) {
    const n = parseInt(hex.slice(1), 16);
    const r = U.clamp(((n >> 16) & 255) * f, 0, 255) | 0, g = U.clamp(((n >> 8) & 255) * f, 0, 255) | 0, b = U.clamp((n & 255) * f, 0, 255) | 0;
    return alpha === undefined ? 'rgb(' + r + ',' + g + ',' + b + ')' : 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  /* The galactic band: thousands of tiny stars concentrated along a tilted
     sine, with dust lanes drawn dark through them. */
  function buildBand(seed) {
    const W = 960, H = 540;
    const cv = canvas(W, H), c = cv.getContext('2d');
    const rnd = U.mulberry32(seed);
    const grd = c.createLinearGradient(0, 0, W, H);
    grd.addColorStop(0, 'rgba(40,20,80,0)');
    grd.addColorStop(0.5, 'rgba(70,40,120,0.35)');
    grd.addColorStop(1, 'rgba(30,15,60,0)');
    c.fillStyle = grd;
    c.save(); c.translate(W / 2, H / 2); c.rotate(-0.42); c.fillRect(-W, -90, W * 2, 180); c.restore();
    for (let i = 0; i < 5200; i++) {
      const t = rnd();
      const along = (rnd() - 0.5) * W * 1.6;
      const spread = (rnd() + rnd() + rnd() - 1.5) * 70;
      const x = W / 2 + along * Math.cos(-0.42) - spread * Math.sin(-0.42);
      const y = H / 2 + along * Math.sin(-0.42) + spread * Math.cos(-0.42);
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const big = t > 0.985;
      c.fillStyle = t > 0.93 ? '#ffe2b8' : (t > 0.86 ? '#b8d8ff' : '#ffffff');
      c.globalAlpha = big ? 0.9 : 0.25 + rnd() * 0.45;
      c.fillRect(x | 0, y | 0, big ? 2 : 1, big ? 2 : 1);
    }
    // dust lanes
    c.globalAlpha = 1;
    for (let i = 0; i < 14; i++) {
      const along = (rnd() - 0.5) * W * 1.2, spread = (rnd() - 0.5) * 60;
      const x = W / 2 + along * Math.cos(-0.42) - spread * Math.sin(-0.42);
      const y = H / 2 + along * Math.sin(-0.42) + spread * Math.cos(-0.42);
      const g2 = c.createRadialGradient(x, y, 2, x, y, 40 + rnd() * 60);
      g2.addColorStop(0, 'rgba(6,3,14,0.8)');
      g2.addColorStop(1, 'rgba(6,3,14,0)');
      c.fillStyle = g2;
      c.save(); c.translate(x, y); c.rotate(-0.42); c.scale(2.6, 0.7); c.translate(-x, -y);
      c.fillRect(x - 160, y - 160, 320, 320); c.restore();
    }
    return cv;
  }

  function buildNebulae(seed) {
    const W = 480, H = 270;
    const cv = canvas(W, H), c = cv.getContext('2d');
    const rnd = U.mulberry32(seed + 7);
    const cols = ['#5a2a8a', '#2a4a8a', '#8a2a5a', '#2a7a6a', '#7a3a2a'];
    for (let i = 0; i < 9; i++) {
      const x = rnd() * W, y = rnd() * H, r = 50 + rnd() * 110;
      const col = cols[i % cols.length];
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, shade(col, 1, 0.22));
      g.addColorStop(0.5, shade(col, 0.8, 0.1));
      g.addColorStop(1, shade(col, 0.6, 0));
      c.fillStyle = g;
      c.save(); c.translate(x, y); c.rotate(rnd() * 3); c.scale(1 + rnd(), 0.6 + rnd() * 0.5); c.translate(-x, -y);
      c.fillRect(x - r * 2, y - r * 2, r * 4, r * 4); c.restore();
    }
    // speckle so it reads as pixel art, not a soft blur
    for (let i = 0; i < 2600; i++) {
      c.fillStyle = 'rgba(255,255,255,' + (0.03 + rnd() * 0.08).toFixed(3) + ')';
      c.fillRect((rnd() * W) | 0, (rnd() * H) | 0, 1, 1);
    }
    return cv;
  }

  /* A far planet: banded disc, optional rings, a moon, terminator shading. */
  function buildPlanet(size, tint, seed, rings) {
    const pad = rings ? size : size * 0.3;
    const W = size + pad * 2;
    const cv = canvas(W, W), c = cv.getContext('2d');
    const rnd = U.mulberry32(seed);
    const cx = W / 2, cy = W / 2, r = size / 2;
    if (rings) {                                        // back half of the rings
      c.save(); c.translate(cx, cy); c.rotate(-0.35); c.scale(1, 0.32);
      for (let k = 0; k < 3; k++) {
        c.strokeStyle = shade(tint, 1.2 - k * 0.2, 0.55 - k * 0.12); c.lineWidth = 3 + k;
        c.beginPath(); c.arc(0, 0, r * (1.5 + k * 0.25), Math.PI, Math.PI * 2); c.stroke();
      }
      c.restore();
    }
    c.save(); c.beginPath(); c.arc(cx, cy, r, 0, U.TAU); c.clip();
    c.fillStyle = shade(tint, 0.85); c.fillRect(0, 0, W, W);
    for (let y = -r; y < r; y += 2 + rnd() * 3) {          // bands
      c.fillStyle = shade(tint, 0.6 + rnd() * 0.7, 0.5);
      c.fillRect(cx - r, cy + y, r * 2, 1 + rnd() * 3);
    }
    for (let i = 0; i < 6; i++) {                          // storms
      c.fillStyle = shade(tint, 1.3, 0.35);
      c.beginPath(); c.ellipse(cx + (rnd() - 0.5) * r * 1.4, cy + (rnd() - 0.5) * r * 1.4, 2 + rnd() * r * 0.2, 1 + rnd() * r * 0.08, 0, 0, U.TAU); c.fill();
    }
    const term = c.createLinearGradient(cx - r, 0, cx + r, 0);
    term.addColorStop(0, 'rgba(255,255,255,0.12)'); term.addColorStop(0.55, 'rgba(0,0,0,0)'); term.addColorStop(1, 'rgba(4,2,12,0.9)');
    c.fillStyle = term; c.fillRect(0, 0, W, W);
    c.restore();
    c.strokeStyle = shade(tint, 1.5, 0.6); c.lineWidth = 1;
    c.beginPath(); c.arc(cx, cy, r - 0.5, Math.PI * 0.8, Math.PI * 1.6); c.stroke();
    if (rings) {                                        // front half
      c.save(); c.translate(cx, cy); c.rotate(-0.35); c.scale(1, 0.32);
      for (let k = 0; k < 3; k++) {
        c.strokeStyle = shade(tint, 1.3 - k * 0.2, 0.7 - k * 0.15); c.lineWidth = 3 + k;
        c.beginPath(); c.arc(0, 0, r * (1.5 + k * 0.25), 0, Math.PI); c.stroke();
      }
      c.restore();
    }
    // a moon
    c.fillStyle = shade(tint, 0.5);
    c.beginPath(); c.arc(cx + r * 1.25, cy - r * 0.9, Math.max(2, r * 0.14), 0, U.TAU); c.fill();
    return cv;
  }

  function buildSun(size, col) {
    const W = size * 3;
    const cv = canvas(W, W), c = cv.getContext('2d');
    const cx = W / 2, cy = W / 2;
    const g = c.createRadialGradient(cx, cy, size * 0.3, cx, cy, W / 2);
    g.addColorStop(0, shade(col, 1.4, 0.9)); g.addColorStop(0.25, shade(col, 1, 0.45)); g.addColorStop(1, shade(col, 0.8, 0));
    c.fillStyle = g; c.fillRect(0, 0, W, W);
    for (let i = 0; i < 8; i++) {                       // rays
      c.save(); c.translate(cx, cy); c.rotate(i * Math.PI / 4);
      const rg = c.createLinearGradient(0, 0, W / 2, 0);
      rg.addColorStop(0, shade(col, 1.3, 0.35)); rg.addColorStop(1, shade(col, 1, 0));
      c.fillStyle = rg; c.fillRect(0, -1, W / 2, 2); c.restore();
    }
    c.fillStyle = '#fff8e0';
    c.beginPath(); c.arc(cx, cy, size * 0.42, 0, U.TAU); c.fill();
    return cv;
  }

  function ensure(seed) {
    if (layers && layers.seed === seed) return layers;
    const rnd = U.mulberry32(seed + 99);
    layers = {
      seed,
      band: buildBand(seed),
      nebulae: buildNebulae(seed),
      sun: { cv: buildSun(20 + rnd() * 14, U.pick(['#ffd27a', '#ffb07a', '#b8e0ff'])), x: 0.12 + rnd() * 0.5, y: 0.08 + rnd() * 0.25, p: 0.02 },
      planets: [],
      stars: [],
      shooters: []
    };
    const tints = ['#8a5a9a', '#5a8a9a', '#9a7a4a', '#4a7a5a', '#9a4a4a', '#6a6a9a'];
    for (let i = 0; i < 4; i++) {
      const size = 22 + rnd() * 50;
      layers.planets.push({ cv: buildPlanet(size, tints[(i + Math.floor(seed)) % tints.length], seed * 3 + i, i % 2 === 0),
        x: rnd() * 1.3, y: rnd() * 0.9, p: 0.03 + i * 0.015 });
    }
    for (let l = 0; l < 3; l++) {
      const arr = [];
      for (let i = 0; i < 110 - l * 25; i++) arr.push({ x: rnd() * 1.5, y: rnd() * 1.5, s: l === 2 && rnd() > 0.7 ? 2 : 1, tw: rnd() * 6.28, c: rnd() > 0.88 ? '#ffd9a0' : (rnd() > 0.72 ? '#a9d8ff' : '#ffffff') });
      layers.stars.push(arr);
    }
    return layers;
  }

  /* Draw the whole sky. `cam` in world px; `skyTint` is the world's own hue. */
  function draw(ctx, cam, time, seed, skyTint, opts) {
    opts = opts || {};
    const L = ensure(seed);
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, skyTint || '#0b0720');
    g.addColorStop(1, '#04030d');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

    // galactic band, slow parallax, tiled horizontally
    const bx = -((cam.x * 0.012) % 960), by = -60 - (cam.y * 0.008) % 40;
    ctx.globalAlpha = 0.9;
    ctx.drawImage(L.band, bx, by, 960, 540);
    ctx.drawImage(L.band, bx + 960, by, 960, 540);
    ctx.globalAlpha = 0.85;
    ctx.drawImage(L.nebulae, -((cam.x * 0.02) % VW) - 2, -((cam.y * 0.015) % 60) - 2, VW + 4, VH + 64);
    ctx.globalAlpha = 1;

    for (let l = 0; l < L.stars.length; l++) {
      const par = 0.03 + l * 0.05;
      for (const st of L.stars[l]) {
        const x = ((st.x * VW * 1.5 - cam.x * par) % (VW * 1.5) + VW * 1.5) % (VW * 1.5);
        const y = ((st.y * VH * 1.5 - cam.y * par * 0.7) % (VH * 1.5) + VH * 1.5) % (VH * 1.5);
        if (x > VW || y > VH) continue;
        ctx.globalAlpha = (0.55 + 0.45 * Math.sin(time * 2 + st.tw)) * (0.4 + l * 0.25);
        ctx.fillStyle = st.c;
        ctx.fillRect(x | 0, y | 0, st.s, st.s);
      }
    }
    ctx.globalAlpha = 1;

    const sun = L.sun;
    ctx.drawImage(sun.cv, (sun.x * VW - cam.x * sun.p - sun.cv.width / 2) | 0, (sun.y * VH - cam.y * sun.p * 0.7 - sun.cv.height / 2) | 0);

    for (const pl of L.planets) {
      const x = ((pl.x * VW * 1.3 - cam.x * pl.p) % (VW * 1.3) + VW * 1.3) % (VW * 1.3) - pl.cv.width / 2;
      const y = pl.y * VH - cam.y * pl.p * 0.6 - pl.cv.height / 2;
      ctx.drawImage(pl.cv, x | 0, y | 0);
    }

    // shooting stars, occasionally
    if (Math.random() < 0.004 && L.shooters.length < 2) L.shooters.push({ x: Math.random() * VW, y: Math.random() * VH * 0.5, vx: 260 + Math.random() * 200, vy: 90 + Math.random() * 80, life: 0.6 });
    for (let i = L.shooters.length - 1; i >= 0; i--) {
      const s = L.shooters[i];
      s.life -= 1 / 60; s.x += s.vx / 60; s.y += s.vy / 60;
      if (s.life <= 0) { L.shooters.splice(i, 1); continue; }
      ctx.strokeStyle = 'rgba(255,255,255,' + (s.life).toFixed(2) + ')'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 0.06, s.y - s.vy * 0.06); ctx.stroke();
    }
  }

  PD.galaxy = { draw, ensure, buildPlanet, buildSun };
})(window.PD);

    '2': ['.###.', '#...#', '....#', '...#.', '..#..', '.#...', '#####'],
    '3': ['####.', '....#', '....#', '.###.', '....#', '....#', '####.'],
    '4': ['#...#', '#...#', '#...#', '#####', '....#', '....#', '....#'],
    '5': ['#####', '#....', '#....', '####.', '....#', '....#', '####.'],
    '6': ['.###.', '#....', '#....', '####.', '#...#', '#...#', '.###.'],
    '7': ['#####', '....#', '...#.', '..#..', '.#...', '.#...', '.#...'],
    '8': ['.###.', '#...#', '#...#', '.###.', '#...#', '#...#', '.###.'],
    '9': ['.###.', '#...#', '#...#', '.####', '....#', '....#', '.###.'],
    ' ': ['.....', '.....', '.....', '.....', '.....', '.....', '.....'],
    '.': ['.....', '.....', '.....', '.....', '.....', '.....', '..#..'],
    ',': ['.....', '.....', '.....', '.....', '.....', '..#..', '.#...'],
    ':': ['.....', '..#..', '.....', '.....', '.....', '..#..', '.....'],
    '!': ['..#..', '..#..', '..#..', '..#..', '..#..', '.....', '..#..'],
    '?': ['.###.', '#...#', '....#', '...#.', '..#..', '.....', '..#..'],
    '-': ['.....', '.....', '.....', '#####', '.....', '.....', '.....'],
    '+': ['.....', '..#..', '..#..', '#####', '..#..', '..#..', '.....'],
    '=': ['.....', '.....', '#####', '.....', '#####', '.....', '.....'],
    '/': ['....#', '....#', '...#.', '..#..', '.#...', '#....', '#....'],
    '%': ['#...#', '...#.', '...#.', '..#..', '.#...', '.#...', '#...#'],
    '$': ['..#..', '.####', '#.#..', '.###.', '..#.#', '####.', '..#..'],
    '(': ['..##.', '.#...', '#....', '#....', '#....', '.#...', '..##.'],
    ')': ['.##..', '...#.', '....#', '....#', '....#', '...#.', '.##..'],
    '[': ['.###.', '.#...', '.#...', '.#...', '.#...', '.#...', '.###.'],
    ']': ['.###.', '...#.', '...#.', '...#.', '...#.', '...#.', '.###.'],
    "'": ['..#..', '..#..', '.....', '.....', '.....', '.....', '.....'],
    '<': ['....#', '...#.', '..#..', '.#...', '..#..', '...#.', '....#'],
    '>': ['#....', '.#...', '..#..', '...#.', '..#..', '.#...', '#....'],
    '*': ['.....', '#.#.#', '.###.', '#####', '.###.', '#.#.#', '.....'],
    '#': ['.#.#.', '#####', '.#.#.', '#####', '.#.#.', '.....', '.....'],
    '_': ['.....', '.....', '.....', '.....', '.....', '.....', '#####'],
    '|': ['..#..', '..#..', '..#..', '..#..', '..#..', '..#..', '..#..']
  };

  const GW = 5, GH = 7, GAP = 1;
  const cache = {};   // color -> { char: canvas }

  function glyph(ch, color) {
    let byColor = cache[color];
    if (!byColor) byColor = cache[color] = {};
    if (byColor[ch]) return byColor[ch];
    const rows = G[ch] || G['?'];
    const cv = document.createElement('canvas');
    cv.width = GW; cv.height = GH;
    const c = cv.getContext('2d');
    c.fillStyle = color;
    for (let y = 0; y < GH; y++) {
      const r = rows[y];
      for (let x = 0; x < GW; x++) if (r[x] === '#') c.fillRect(x, y, 1, 1);
    }
    byColor[ch] = cv;
    return cv;
  }

  function width(str, scale) {
    scale = scale || 1;
    return str.length * (GW + GAP) * scale - GAP * scale;
  }

  /* opts: { scale, center, right, shadow, alpha } */
  function draw(ctx, str, x, y, color, opts) {
    opts = opts || {};
    const s = opts.scale || 1;
    str = String(str).toUpperCase();
    let px = Math.round(x);
    if (opts.center) px = Math.round(x - width(str, s) / 2);
    else if (opts.right) px = Math.round(x - width(str, s));
    const py = Math.round(y);
    if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;

    if (opts.shadow !== false) {
      let sx = px;
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (ch !== ' ') ctx.drawImage(glyph(ch, opts.shadow || '#150c28'), 0, 0, GW, GH, sx, py + s, GW * s, GH * s);
        sx += (GW + GAP) * s;
      }
    }
    let cx = px;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (ch !== ' ') ctx.drawImage(glyph(ch, color), 0, 0, GW, GH, cx, py, GW * s, GH * s);
      cx += (GW + GAP) * s;
    }
    if (opts.alpha !== undefined) ctx.globalAlpha = 1;
    return px;
  }

  PD.font = { draw, width, GW, GH, GAP, lineHeight: s => (GH + 3) * (s || 1) };
})(window.PD);

/* ===== src/audio.js ===== */
/* Everything you hear is synthesised on the fly with WebAudio -- no asset
   files, and the drill can track its pitch to how hard the rock is. */
(function (PD) {
  'use strict';
  const U = PD.util;

  let ctx = null, master = null, sfxBus = null, musBus = null, noiseBuf = null;
  let ready = false;
  const state = { sfx: true, music: true };

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    musBus = ctx.createGain(); musBus.gain.value = 0.34; musBus.connect(master);

    const len = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    ready = true;
  }

  function resume() {
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }

  const now = () => ctx.currentTime;

  function env(node, t0, peak, attack, decay, hold) {
    const g = node.gain;
    g.setValueAtTime(0.0001, t0);
    g.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + attack);
    if (hold) g.setValueAtTime(Math.max(0.0002, peak), t0 + attack + hold);
    g.exponentialRampToValueAtTime(0.0001, t0 + attack + (hold || 0) + decay);
  }

  function tone(freq, opts) {
    if (!ready || !state.sfx) return;
    opts = opts || {};
    const t0 = now() + (opts.delay || 0);
    const o = ctx.createOscillator();
    o.type = opts.type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (opts.to) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.to), t0 + (opts.dur || 0.12));
    const g = ctx.createGain();
    env(g, t0, opts.vol === undefined ? 0.2 : opts.vol, opts.attack || 0.005, opts.dur || 0.12, opts.hold || 0);
    let out = g;
    if (opts.filter) {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = opts.filter;
      g.connect(f); out = f;
    }
    o.connect(g); out.connect(sfxBus);
    o.start(t0); o.stop(t0 + (opts.dur || 0.12) + (opts.hold || 0) + 0.06);
  }

  function noise(opts) {
    if (!ready || !state.sfx) return;
    opts = opts || {};
    const t0 = now() + (opts.delay || 0);
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.playbackRate.value = opts.rate || 1;
    const f = ctx.createBiquadFilter();
    f.type = opts.type || 'lowpass';
    f.frequency.setValueAtTime(opts.from || 1800, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, opts.to || 300), t0 + (opts.dur || 0.2));
    f.Q.value = opts.q || 1;
    const g = ctx.createGain();
    env(g, t0, opts.vol === undefined ? 0.25 : opts.vol, opts.attack || 0.004, opts.dur || 0.2, opts.hold || 0);
    src.connect(f); f.connect(g); g.connect(sfxBus);
    src.start(t0); src.stop(t0 + (opts.dur || 0.2) + (opts.hold || 0) + 0.05);
  }

  /* ------------------------------------------------------- looping drill rig */
  let drillNodes = null;
  function drill(on, pitch) {
    if (!ready) return;
    if (on && state.sfx) {
      if (!drillNodes) {
        const src = ctx.createBufferSource();
        src.buffer = noiseBuf; src.loop = true;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 2.2;
        const lo = ctx.createOscillator(); lo.type = 'sawtooth'; lo.frequency.value = 62;
        const loG = ctx.createGain(); loG.gain.value = 0.05;
        const g = ctx.createGain(); g.gain.value = 0.0001;
        src.connect(bp); bp.connect(g); lo.connect(loG); loG.connect(g); g.connect(sfxBus);
        src.start(); lo.start();
        drillNodes = { src, bp, g, lo, loG };
      }
      const p = pitch || 0;
      drillNodes.bp.frequency.setTargetAtTime(560 + p * 900, now(), 0.05);
      drillNodes.lo.frequency.setTargetAtTime(52 + p * 40, now(), 0.05);
      drillNodes.g.gain.setTargetAtTime(0.16, now(), 0.02);
    } else if (drillNodes) {
      drillNodes.g.gain.setTargetAtTime(0.0001, now(), 0.05);
    }
  }

  let thrustNodes = null;
  function thrust(amount) {
    if (!ready) return;
    if (amount > 0.01 && state.sfx) {
      if (!thrustNodes) {
        const src = ctx.createBufferSource();
        src.buffer = noiseBuf; src.loop = true;
        const f = ctx.createBiquadFilter();
        f.type = 'lowpass'; f.frequency.value = 420; f.Q.value = 0.8;
        const g = ctx.createGain(); g.gain.value = 0.0001;
        src.connect(f); f.connect(g); g.connect(sfxBus);
        src.start();
        thrustNodes = { src, f, g };
      }
      thrustNodes.g.gain.setTargetAtTime(0.05 * amount, now(), 0.04);
      thrustNodes.f.frequency.setTargetAtTime(300 + amount * 500, now(), 0.06);
    } else if (thrustNodes) {
      thrustNodes.g.gain.setTargetAtTime(0.0001, now(), 0.06);
    }
  }

  /* ---------------------------------------------------------------- one-shots */
  const S = {
    break_(hard) {
      noise({ from: 2400 - hard * 900, to: 220, dur: 0.16, vol: 0.2, rate: 1.4 });
      tone(150 - hard * 30, { type: 'triangle', to: 60, dur: 0.1, vol: 0.14 });
    },
    ore(value) {
      const step = U.clamp(Math.log2(1 + value / 14) * 90, 0, 900);
      tone(620 + step, { type: 'triangle', dur: 0.1, vol: 0.16 });
      tone(930 + step, { type: 'sine', dur: 0.13, vol: 0.1, delay: 0.045 });
    },
    coin(i) {
      tone(880 + (i % 6) * 110, { type: 'square', dur: 0.07, vol: 0.09 });
      tone(1320 + (i % 6) * 110, { type: 'sine', dur: 0.1, vol: 0.06, delay: 0.03 });
    },
    sell() {
      [0, 4, 7, 12].forEach((s, i) => tone(523 * Math.pow(2, s / 12), { type: 'triangle', dur: 0.22, vol: 0.14, delay: i * 0.06 }));
    },
    shoot() {
      tone(1500, { type: 'square', to: 260, dur: 0.1, vol: 0.13, filter: 3000 });
      noise({ from: 3200, to: 800, dur: 0.06, vol: 0.08 });
    },
    hitMob() { noise({ from: 1700, to: 400, dur: 0.09, vol: 0.16 }); tone(300, { type: 'sawtooth', to: 160, dur: 0.07, vol: 0.08 }); },
    killMob() {
      noise({ from: 900, to: 120, dur: 0.3, vol: 0.2 });
      tone(420, { type: 'sawtooth', to: 70, dur: 0.28, vol: 0.12 });
    },
    hurt() {
      tone(180, { type: 'sawtooth', to: 70, dur: 0.26, vol: 0.2 });
      noise({ from: 700, to: 90, dur: 0.22, vol: 0.16 });
    },
    boom(size) {
      const s = size || 1;
      noise({ from: 1500 * s, to: 60, dur: 0.5 * s, vol: 0.34, rate: 0.7 });
      tone(120, { type: 'sine', to: 32, dur: 0.6 * s, vol: 0.3 });
      tone(220, { type: 'triangle', to: 55, dur: 0.35 * s, vol: 0.16, delay: 0.02 });
    },
    crack(i) {
      noise({ from: 900 + i * 320, to: 300, dur: 0.14, vol: 0.16, type: 'bandpass', q: 4 });
      tone(200 + i * 80, { type: 'square', to: 90, dur: 0.1, vol: 0.07 });
    },
    rumble() {
      noise({ from: 220, to: 40, dur: 1.6, vol: 0.3, rate: 0.4, attack: 0.6 });
    },
    dock() {
      [0, 5, 9].forEach((s, i) => tone(392 * Math.pow(2, s / 12), { type: 'triangle', dur: 0.34, vol: 0.12, delay: i * 0.05 }));
    },
    buy() {
      tone(660, { type: 'square', dur: 0.08, vol: 0.14 });
      tone(990, { type: 'square', dur: 0.14, vol: 0.12, delay: 0.07 });
    },
    deny() { tone(200, { type: 'square', to: 140, dur: 0.16, vol: 0.13 }); },
    click() { tone(1100, { type: 'square', dur: 0.04, vol: 0.07 }); },
    alarm() {
      tone(880, { type: 'square', dur: 0.11, vol: 0.11 });
      tone(880, { type: 'square', dur: 0.11, vol: 0.11, delay: 0.16 });
    },
    warp() {
      tone(180, { type: 'sawtooth', to: 2400, dur: 1.1, vol: 0.16, filter: 4000 });
      noise({ from: 200, to: 4000, dur: 1.1, vol: 0.12, attack: 0.5 });
    },
    fanfare() {
      [0, 4, 7, 12, 16, 19].forEach((s, i) =>
        tone(392 * Math.pow(2, s / 12), { type: 'triangle', dur: 0.4, vol: 0.15, delay: i * 0.11 }));
    }
  };

  /* --------------------------------------------------------------- the music
     Sleazy little villain groove: walking bass, minor arpeggio, hat pulse. */
  const SCALE = [0, 3, 5, 7, 10];          // minor pentatonic
  const BASS = [0, 0, 3, 0, -2, -2, 5, 3];
  let step = 0, nextTime = 0, musicOn = false, intensity = 0;
  const BPM = 96, SPB = 60 / BPM / 4;      // 16th notes

  function mnote(freq, t0, dur, type, vol) {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(musBus);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  function hz(semi) { return 55 * Math.pow(2, semi / 12); }

  function schedule() {
    if (!ready || !musicOn || !state.music) return;
    const lookahead = now() + 0.2;
    while (nextTime < lookahead) {
      const bar = Math.floor(step / 16) % 4;
      const s16 = step % 16;
      const root = BASS[(Math.floor(step / 8)) % BASS.length];

      if (s16 % 4 === 0) mnote(hz(root + 24), nextTime, 0.22, 'square', 0.11);            // bass
      if (s16 % 8 === 4) mnote(hz(root + 31), nextTime, 0.14, 'triangle', 0.07);
      if (s16 % 2 === 1) {                                                                // hat
        const src = ctx.createBufferSource(); src.buffer = noiseBuf;
        const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6500;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.05 + intensity * 0.04, nextTime);
        g.gain.exponentialRampToValueAtTime(0.0001, nextTime + 0.05);
        src.connect(f); f.connect(g); g.connect(musBus);
        src.start(nextTime); src.stop(nextTime + 0.07);
      }
      if (intensity > 0.2 && (s16 === 0 || s16 === 6 || s16 === 10)) {                     // kick
        mnote(58, nextTime, 0.16, 'sine', 0.2);
      }
      if (bar !== 3 || intensity > 0.4) {                                                  // arp
        const n = SCALE[(step * 3) % SCALE.length];
        if (s16 % 2 === 0) mnote(hz(root + 48 + n), nextTime, 0.1, 'square', 0.045 + intensity * 0.03);
      }
      step++;
      nextTime += SPB;
    }
  }

  function music(on) {
    init();
    musicOn = on;
    if (on && ready) { nextTime = Math.max(nextTime, now() + 0.05); }
  }

  function setIntensity(v) { intensity = U.clamp(v, 0, 1); }

  function toggleSfx(on) {
    state.sfx = on;
    if (!on) { drill(false); thrust(0); }
  }
  function toggleMusic(on) {
    state.music = on;
    if (musBus) musBus.gain.value = on ? 0.34 : 0;
  }

  // expose the raw synth voices on the sfx table too, so callers can reach
  // for a one-off beep without caring which namespace it lives in
  S.tone = tone;
  S.noise = noise;

  PD.audio = {
    init, resume, tone, noise, drill, thrust, music, schedule, setIntensity,
    toggleSfx, toggleMusic, state, sfx: S,
    get ok() { return ready; }
  };
})(window.PD);

/* ===== src/input.js ===== */
/* Keyboard + mouse. Screen coordinates are converted to the low-res internal
   canvas space by game.js, which owns the scale factor. */
(function (PD) {
  'use strict';

  const keys = {};        // held
  const pressed = {};     // edge-triggered, cleared each frame
  const released = {};

  const mouse = {
    sx: 0, sy: 0,          // css pixels inside the canvas element
    x: 0, y: 0,            // internal canvas pixels (filled by game)
    wx: 0, wy: 0,          // world pixels (filled by game)
    left: false, right: false,
    leftPressed: false, rightPressed: false,
    wheel: 0, inside: false
  };

  const ALIAS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
    Space: 'space', ShiftLeft: 'shift', ShiftRight: 'shift',
    Escape: 'esc', Enter: 'enter'
  };

  function code(e) { return ALIAS[e.code] || e.code; }

  let firstTouch = null;

  function attach(canvas) {
    window.addEventListener('keydown', e => {
      const c = code(e);
      if (!keys[c]) pressed[c] = true;
      keys[c] = true;
      if (['space', 'up', 'down', 'left', 'right', 'Tab', 'shift'].indexOf(c) >= 0) e.preventDefault();
      if (firstTouch) firstTouch();
    });
    window.addEventListener('keyup', e => {
      const c = code(e);
      keys[c] = false;
      released[c] = true;
    });
    window.addEventListener('blur', () => {
      for (const k in keys) keys[k] = false;
      mouse.left = mouse.right = false;
    });

    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      mouse.sx = e.clientX - r.left;
      mouse.sy = e.clientY - r.top;
      mouse.inside = true;
    });
    canvas.addEventListener('mouseleave', () => { mouse.inside = false; });
    canvas.addEventListener('mousedown', e => {
      if (e.button === 0) { mouse.left = true; mouse.leftPressed = true; }
      if (e.button === 2) { mouse.right = true; mouse.rightPressed = true; }
      e.preventDefault();
      if (firstTouch) firstTouch();
    });
    window.addEventListener('mouseup', e => {
      if (e.button === 0) mouse.left = false;
      if (e.button === 2) mouse.right = false;
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { mouse.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
  }

  function onFirstInteraction(fn) { firstTouch = () => { fn(); firstTouch = null; }; }

  function endFrame() {
    for (const k in pressed) pressed[k] = false;
    for (const k in released) released[k] = false;
    mouse.leftPressed = false;
    mouse.rightPressed = false;
    mouse.wheel = 0;
  }

  const down = k => !!keys[k];
  const hit = k => !!pressed[k];
  const pressedSet = k => { pressed[k] = true; };

  PD.input = { keys, mouse, attach, endFrame, down, hit, pressedSet, onFirstInteraction };
})(window.PD);

/* ===== src/touch.js ===== */
/* Touch controls, no circles: a hexagonal pad for the jets, hex action keys,
   drag-to-aim that also drills, tap-to-fly in the field, tap-through in menus. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const G = PD.glyph;

  const VW = 480, VH = 270;

  const cfg = {
    stick: { x: 62, y: VH - 60, r: 36, knob: 15 },
    play: {
      dash: { x: VW - 34, y: VH - 74, r: 16, glyph: 'dash', col: '#ffd34d', key: 'shift' },
      scan: { x: VW - 72, y: VH - 92, r: 13, glyph: 'scan', col: '#8affa0', key: 'Tab' },
      use:  { x: VW - 30, y: VH - 116, r: 13, glyph: 'home', col: '#ffb03d', key: 'KeyE' },
      beam: { x: VW - 76, y: VH - 130, r: 11, glyph: 'hole', col: '#ff5a4d', key: 'KeyR', hold: true }
    },
    home: {
      jump: { x: VW - 34, y: VH - 74, r: 18, glyph: 'up', col: '#7ef9ff', key: 'up' },
      roll: { x: VW - 78, y: VH - 50, r: 14, glyph: 'dash', col: '#ffd34d', key: 'shift' },
      use:  { x: VW - 78, y: VH - 92, r: 14, glyph: 'hand', col: '#ffb03d', key: 'KeyE' }
    }
  };

  const state = {
    enabled: false, forced: null,
    stickId: null, sx: 0, sy: 0, dx: 0, dy: 0,
    aimId: null, ax: 0, ay: 0, aiming: false,
    down: {}, edge: {}, pressAnim: {},
    mode: 'play', tapX: 0, tapY: 0, tapPress: false, tapHold: false

  function attach(canvas, mapper) {
    toScreen = mapper;
    state.enabled = state.forced === null ? autoDetect() : state.forced;
    const hit = (p, c) => U.dist(p.x, p.y, c.x, c.y) <= c.r + 7;
    const pos = tch => { const r = canvas.getBoundingClientRect(); return toScreen(tch.clientX - r.left, tch.clientY - r.top); };

/* Particles, floating numbers, shockwaves, screen shake -- the juice layer. */
(function (PD) {
  'use strict';
  const U = PD.util;

  const parts = [];
  const floaters = [];
  const rings = [];
  const chunks = [];
  let shakeAmt = 0, shakeT = 0;
  let flashAmt = 0, flashColor = '#ffffff';

  function reset() {
    parts.length = 0; floaters.length = 0; rings.length = 0; chunks.length = 0;

  }

  function spawn(o) {
    if (parts.length >= MAXP) parts.shift();

      x: o.x, y: o.y, vx: o.vx || 0, vy: o.vy || 0,
      life: o.life || 0.5, max: o.life || 0.5,
      size: o.size || 1, color: o.color || '#fff',
      grav: o.grav === undefined ? 0.4 : o.grav,

      glow: o.glow || 0, collide: o.collide || 0, spin: 0

  }

  /* Drill sparks: hot little chips flying away from the bit. */
  function sparks(x, y, ang, mat, n) {
    const cols = mat.c;
    for (let i = 0; i < (n || 4); i++) {
      const a = ang + Math.PI + U.rand(-0.9, 0.9);
      const sp = U.rand(30, 130);
      spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
        life: U.rand(0.18, 0.5), size: U.rand(1, 2.2),
        color: U.chance(0.35) ? '#fff6c8' : U.pick(cols), grav: 1.1, drag: 0.86, glow: U.chance(0.3) ? 1 : 0
      });
    }
  }

  function dust(x, y, n, color, spread) {
    for (let i = 0; i < n; i++) {
      const a = U.rand(0, U.TAU);
      const sp = U.rand(4, spread || 40);
      spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: U.rand(0.3, 0.9), size: U.rand(1.4, 3.4),
        color: color || '#a08c7a', grav: 0.1, drag: 0.88
      });
    }
  }

  function burst(x, y, n, colors, power, glow) {
    for (let i = 0; i < n; i++) {
      const a = U.rand(0, U.TAU);
      const sp = U.rand(0.2, 1) * (power || 120);
      spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: U.rand(0.3, 1.0), size: U.rand(1, 3),
        color: U.pick(colors), grav: 0.3, drag: 0.9, glow: glow ? 1 : (U.chance(0.4) ? 1 : 0)
      });
    }
  }

    for (let i = 0; i < n; i++) {

        x: x + U.rand(-3, 3), y: y + U.rand(-3, 3),
        vx: U.rand(-14, 14), vy: U.rand(-30, -6),
        life: U.rand(0.5, 1.3), size: U.rand(2, 5),
        color: color || '#5a5470', grav: -0.15, drag: 0.93

    }
  }

      x: Math.round(Math.sin(shakeT * 1.7) * shakeAmt + Math.sin(shakeT * 3.1) * shakeAmt * 0.4),

    // rock chunks first, they read as background debris
    for (const c of chunks) {
      const a = U.clamp(c.life / 0.5, 0, 1);

      ctx.rotate(Math.round(c.rot / (Math.PI / 8)) * (Math.PI / 8));
      ctx.drawImage(c.cv, -c.cv.width / 2 | 0, -c.cv.height / 2 | 0);
      ctx.restore();
    }

    for (const p of parts) {
      const t = p.life / p.max;
      const s = Math.max(1, Math.round(p.size * (0.4 + t * 0.7)));
      ctx.globalAlpha = t > 0.5 ? 1 : t * 2;
      if (p.glow) {
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x - cam.x) - s, Math.round(p.y - cam.y) - s, s * 3, s * 3);
        ctx.globalAlpha *= 0.5;
      }
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x - cam.x), Math.round(p.y - cam.y), s, s);
    }
    ctx.globalAlpha = 1;

    for (const r of rings) {
      const t = r.life / r.max;
      ctx.globalAlpha = t * t;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.width;
      ctx.beginPath();
      ctx.arc(Math.round(r.x - cam.x), Math.round(r.y - cam.y), Math.max(1, r.r), 0, U.TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters(ctx, cam, font) {
    for (const f of floaters) {
      const t = f.life / f.max;
      ctx.globalAlpha = t > 0.6 ? 1 : t / 0.6;
      font(ctx, f.str, Math.round(f.x - cam.x), Math.round(f.y - cam.y), f.color, f.size, true);
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay(ctx, w, h) {
    if (flashAmt > 0.01) {
      ctx.globalAlpha = U.clamp(flashAmt, 0, 1) * 0.7;
      ctx.fillStyle = flashColor;
      ctx.fillRect(0, 0, w, h);
      ctx.globalAlpha = 1;
    }
  }

  PD.fx = {
    reset, spawn, sparks, dust, burst, smoke, trail, text, ring, chunk,
    shake, flash, hitStop, update, tickFreeze, shakeOffset, drawWorld, drawFloaters, drawOverlay,
    get freeze() { return freeze; },
    get counts() { return { parts: parts.length, chunks: chunks.length }; }
  };
})(window.PD);

/* The drillable world: one celestial body floating in space, stored as a tile
   grid. Space is simply empty tiles above/around the body, so flying out of
   the ship and boring to the core happen in one continuous scene. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const M = D.M;

  const TILE = 10;
  const SKY = 32;            // tiles of open space above the body's north pole
  const MARGIN = 14;         // tiles of space either side

  /* ------------------------------------------------------------ tile atlases */
  let crackCv = null;

  /* Rounded tile shapes. Every convex corner (both of its neighbours empty)
     is cut with a real arc, so stair-stepped rock reads as a rolling blob
     instead of graph paper. 16 neighbour masks x 2 speckle variants, built
     on demand and cached. */
  const shapeCache = new Map();
  const R = 5;                 // corner radius on a 10px tile: a lone tile is a ball

  /* Lift a colour toward light without washing out its hue. */
  function lift(hex, f, mix) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g2 = (n >> 8) & 255, b = n & 255;
    r = U.clamp(r * f + (mix || 0), 0, 255) | 0;
    g2 = U.clamp(g2 * f + (mix || 0), 0, 255) | 0;
    b = U.clamp(b * f + (mix || 0), 0, 255) | 0;
    return 'rgb(' + r + ',' + g2 + ',' + b + ')';
  }

  function tilePath(c, mask, v, rad) {
    const up = mask & 1, rt = mask & 2, dn = mask & 4, lf = mask & 8;
    // open faces bow in or out a touch, and neighbouring tiles pick different
    // bows, so a long rock face stops being a ruler-straight line
    const bow = ((v === undefined ? 0 : v) - 1.5) * 0.9;
    const B = (open, x0, y0, x1, y1, nx, ny) => {
      if (open) c.quadraticCurveTo((x0 + x1) / 2 + nx * bow, (y0 + y1) / 2 + ny * bow, x1, y1);
      else c.lineTo(x1, y1);
    };
    const RR = rad === undefined ? R : rad;
    const tl = (!up && !lf) ? RR : 0;
    const tr = (!up && !rt) ? RR : 0;
    const br = (!dn && !rt) ? RR : 0;
    const bl = (!dn && !lf) ? RR : 0;
    const T = TILE;
    c.beginPath();
    c.moveTo(tl, 0);
    B(!up, tl, 0, T - tr, 0, 0, -1);
    if (tr) c.arcTo(T, 0, T, tr, tr); else c.lineTo(T, 0);
    B(!rt, T, tr, T, T - br, 1, 0);
    if (br) c.arcTo(T, T, T - br, T, br); else c.lineTo(T, T);
    B(!dn, T - br, T, bl, T, 0, 1);
    if (bl) c.arcTo(0, T, 0, T - bl, bl); else c.lineTo(0, T);
    B(!lf, 0, T - bl, 0, tl, -1, 0);

  /* Three cached layers make rock read as rock instead of a tile grid:
       1. a base shell in the depth band's own colour, cut to the solid mask
       2. the material's blob, cut to a mask of *same-material* neighbours, so
          an iron seam is a rounded vein rather than a run of squares
       3. lighting and the dark rim, drawn only on tiles that face open space */
  /* Shapes are rendered at 2x density and drawn at tile size, so the arcs
     and bows come out smooth and the speckle fine. */
  const HD = 2;
  function cut(key, mask, v, paint, rad) {
    let cv = shapeCache.get(key);

    cv.width = TILE * HD; cv.height = TILE * HD;

    c.scale(HD, HD);

    c.save();

    c.restore();

  }

  function baseShape(tint, mask, v) {

  /* Colour-free: works over any material underneath. */
  function lightShape(mask, v) {

    cv.width = TILE * HD; cv.height = TILE * HD;
    const c = cv.getContext('2d');

    if (!(mask & 4)) { c.fillStyle = 'rgba(8,4,18,0.42)'; c.fillRect(0, TILE - 3, TILE, 3); }
    if (!(mask & 8)) { c.fillStyle = 'rgba(255,255,255,0.14)'; c.fillRect(0, 0, 1, TILE); }

  /* ------------------------------------------------------------------- world */
  function World(body, index) {

    this.index = index;

    this.w = body.radius * 2 + MARGIN * 2;
    this.h = SKY + body.radius * 2 + 10;

    this.cy = SKY + body.radius;
    this.pxW = this.w * TILE;
    this.pxH = this.h * TILE;

    this.centerPx = { x: this.cx * TILE, y: this.cy * TILE };

    this.cells = new Uint8Array(this.w * this.h);
    this.dmg = new Float32Array(this.w * this.h);
    this.heat = new Float32Array(this.w * this.h);
    this.inside = new Uint8Array(this.w * this.h);    // silhouette mask: cave backdrop goes here
    this.stratum = new Uint8Array(this.w * this.h);   // which depth band a cell belongs to
    this.seen = new Uint8Array(this.w * this.h);      // fog of war for the minimap
    this.pois = [];                                    // ruins etc. the game spawns things at

    this.coreMax = body.coreHp;
    this.coreHp = body.coreHp;

  function pickTable(table, t) {

    let acc = 0;
    for (const e of table) {

      if (t <= acc) return M[e[0]];
    }
    return M[table[table.length - 1][0]];
  }

  World.prototype.stratumFor = function (depth) {
    const st = this.strata;
    for (let i = 0; i < st.length; i++) if (depth >= st[i].a && depth < st[i].b) return i;
    return st.length - 1;

  World.prototype.generate = function () {

            for (const [okey, wt] of sorted) {

              const share = wt / Math.max(1, totalW);
              const rarity = U.clamp(om.cr / 5000, 0, 1);
              // the good stuff only shows up once you have committed to the dig
              if (depth < rarity * 0.3) continue;
              // steep curve: a 2000-credit ore is a find, a 40000-credit one a legend
              const scarce = Math.max(0.03, Math.pow(1 - rarity, 1.7)) * (om.shine ? 0.6 : 1);
              const want = U.clamp(share * (0.3 + depth * 1.0) * scarce, 0, 0.6);
              if (want <= 0) continue;

        const i = this.idx(cx, cy);
        const m = this.cells[i];

        if (!this.at(cx, cy - 1) && this.stratum[i] === 0 && U.hash2(cx, cy) > 0.25) {

        }
      }
    }
  };

  /* Molten pools settle on cavern floors in the hot strata. */
