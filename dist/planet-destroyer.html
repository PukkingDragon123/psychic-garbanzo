/* ===== src/world.js ===== */
/* The drillable world: one celestial body floating in space, stored as a tile
   grid. Space is simply empty tiles above/around the body, so flying out of
   the ship and boring to the core happen in one continuous scene. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const M = D.M;

  const TILE = 10;
  const SKY = 32;            // tiles of open space above the body's north pole
  const MARGIN = 14;         // tiles of space either side

  /* ------------------------------------------------------------ tile atlases */
  let crackCv = null;

  /* Rounded tile shapes. Every convex corner (both of its neighbours empty)
     is cut with a real arc, so stair-stepped rock reads as a rolling blob
     instead of graph paper. 16 neighbour masks x 2 speckle variants, built
     on demand and cached. */
  const shapeCache = new Map();
  const R = 5;                 // corner radius on a 10px tile: a lone tile is a ball

  /* Lift a colour toward light without washing out its hue. */
  function lift(hex, f, mix) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g2 = (n >> 8) & 255, b = n & 255;
    r = U.clamp(r * f + (mix || 0), 0, 255) | 0;
    g2 = U.clamp(g2 * f + (mix || 0), 0, 255) | 0;
    b = U.clamp(b * f + (mix || 0), 0, 255) | 0;
    return 'rgb(' + r + ',' + g2 + ',' + b + ')';
  }

  /* A tile is a CUT STONE: every exposed corner comes off as a straight
     45-degree chamfer and every open face takes one shallow notch, so a rock
     face reads as knapped flint. There is not an arc in it -- the game has no
     ovals anywhere, and rock is the largest surface in it. */
  function tilePath(c, mask, v, rad) {
    const up = mask & 1, rt = mask & 2, dn = mask & 4, lf = mask & 8;
    const notch = ((v === undefined ? 0 : v) % 2) ? 1 : 0;   // which side the kink sits
    const RR = rad === undefined ? R : rad;
    const tl = (!up && !lf) ? RR : 0;
    const tr = (!up && !rt) ? RR : 0;
    const br = (!dn && !rt) ? RR : 0;
    const bl = (!dn && !lf) ? RR : 0;
    const T = TILE;
    // one kink part-way along an open face, alternating in and out per tile
    const F = (open, x0, y0, x1, y1, nx, ny) => {
      if (open) {
        const k = notch ? 0.62 : 0.38;
        const d = notch ? 0.8 : -0.8;
        c.lineTo(x0 + (x1 - x0) * k + nx * d, y0 + (y1 - y0) * k + ny * d);
      }
      c.lineTo(x1, y1);
    };
    c.beginPath();
    c.moveTo(tl, 0);
    F(!up, tl, 0, T - tr, 0, 0, -1);
    if (tr) c.lineTo(T, tr); else c.lineTo(T, 0);
    F(!rt, T, tr, T, T - br, 1, 0);
    if (br) c.lineTo(T - br, T); else c.lineTo(T, T);
    F(!dn, T - br, T, bl, T, 0, 1);
    if (bl) c.lineTo(0, T - bl); else c.lineTo(0, T);
    F(!lf, 0, T - bl, 0, tl, -1, 0);
    if (tl) c.lineTo(tl, 0); else c.lineTo(0, 0);
    c.closePath();
  }

  /* Three cached layers make rock read as rock instead of a tile grid:
       1. a base shell in the depth band's own colour, cut to the solid mask
       2. the material's blob, cut to a mask of *same-material* neighbours, so
          an iron seam is a rounded vein rather than a run of squares
       3. lighting and the dark rim, drawn only on tiles that face open space */
  /* Shapes are rendered at 2x density and drawn at tile size, so the arcs
     and bows come out smooth and the speckle fine. */
  const HD = 2;
  function cut(key, mask, v, paint, rad) {
    let cv = shapeCache.get(key);
    if (cv) return cv;
    cv = document.createElement('canvas');
    cv.width = TILE * HD; cv.height = TILE * HD;
    const c = cv.getContext('2d');
    c.scale(HD, HD);
    tilePath(c, mask, v, rad);
    c.save();
    c.clip();
    paint(c);
    c.restore();
    shapeCache.set(key, cv);
    return cv;
  }

  function baseShape(tint, mask, v) {
    return cut('b' + tint + mask + v, mask, v, c => {
      c.fillStyle = lift(tint, 1.34, 14);
      c.fillRect(0, 0, TILE, TILE);
      c.fillStyle = lift(tint, 1.7, 30);
      c.fillRect(0, 0, TILE, 3);
      c.fillStyle = 'rgba(10,5,20,0.22)';
      c.fillRect(0, TILE - 2, TILE, 2);
    });
  }

  function matShape(matId, mask, v) {
    const m = D.MAT[matId];
    return cut('m' + matId + '_' + mask + '_' + v, mask, v, c => {
      c.fillStyle = m.c[1];
      c.fillRect(0, 0, TILE, TILE);
      // fine grain: half-unit flecks, only possible at 2x
      for (let i = 0; i < 16; i++) {
        const h = U.hash2(v * 31 + i, matId * 17 + i * 3);
        const x = Math.floor(h * TILE * 2) / 2;
        const y = Math.floor(U.hash2(matId + i * 7, v * 13 + 5) * TILE * 2) / 2;
        c.fillStyle = h > 0.5 ? m.c[0] : m.c[2];
        c.globalAlpha = 0.55;
        c.fillRect(x, y, h > 0.72 ? 1 : 0.5, 0.5);
      }
      c.globalAlpha = 1;
    }, 2.5);
  }

  /* Colour-free: works over any material underneath. */
  function lightShape(mask, v) {
    const key = 'l' + mask + '_' + v;
    let cv = shapeCache.get(key);
    if (cv) return cv;
    cv = document.createElement('canvas');
    cv.width = TILE * HD; cv.height = TILE * HD;
    const c = cv.getContext('2d');
    c.scale(HD, HD);
    c.save();
    tilePath(c, mask, v);
    c.clip();
    if (!(mask & 1)) { c.fillStyle = 'rgba(255,255,255,0.3)'; c.fillRect(0, 0, TILE, 1.5); c.fillStyle = 'rgba(255,255,255,0.13)'; c.fillRect(0, 1.5, TILE, 1); }
    if (!(mask & 4)) { c.fillStyle = 'rgba(8,4,18,0.42)'; c.fillRect(0, TILE - 3, TILE, 3); }
    if (!(mask & 8)) { c.fillStyle = 'rgba(255,255,255,0.14)'; c.fillRect(0, 0, 1, TILE); }
    if (!(mask & 2)) { c.fillStyle = 'rgba(8,4,18,0.3)'; c.fillRect(TILE - 1, 0, 1, TILE); }
    c.restore();
    // dark cartoon rim, only along the sides that face open space
    const sides = [
      [!(mask & 1), 0, 0, TILE, 3],
      [!(mask & 2), TILE - 3, 0, 3, TILE],
      [!(mask & 4), 0, TILE - 3, TILE, 3],
      [!(mask & 8), 0, 0, 3, TILE]
    ];
    for (const sd of sides) {
      if (!sd[0]) continue;
      c.save();
      c.beginPath();
      c.rect(sd[1], sd[2], sd[3], sd[4]);
      c.clip();
      c.strokeStyle = 'rgba(10,5,20,0.55)';
      c.lineWidth = 1.5;
      tilePath(c, mask, v);
      c.stroke();
      c.restore();
    }
    shapeCache.set(key, cv);
    return cv;
  }

  /* Five stages of coming apart. A crack is a dark pixel with a pale one
     beside it, so a damaged tile reads as fractured rather than dirty, and by
     the last stage whole chips are missing out of it. */
  const CRACK_STAGES = 5;
  function buildAtlas() {
    crackCv = [];
    for (let stage = 0; stage < CRACK_STAGES; stage++) {
      const cv = document.createElement('canvas');
      cv.width = TILE; cv.height = TILE;
      const c = cv.getContext('2d');
      // fractures spreading from the middle outward
      const n = 3 + stage * 6;
      for (let i = 0; i < n; i++) {
        const a = U.hash2(i * 3 + 7, 11) * Math.PI * 2;
        const len = 1 + U.hash2(i * 5, stage * 13 + 3) * (2 + stage * 1.4);
        let x = TILE / 2 + Math.cos(a) * 0.5, y = TILE / 2 + Math.sin(a) * 0.5;
        for (let k = 0; k < len; k++) {
          x += Math.cos(a) + (U.hash2(i * 17 + k, stage) - 0.5);
          y += Math.sin(a) + (U.hash2(i * 23 + k, stage + 5) - 0.5);
          if (x < 0 || y < 0 || x >= TILE || y >= TILE) break;
          c.fillStyle = 'rgba(10,6,20,0.8)';
          c.fillRect(x | 0, y | 0, 1, 1);
          c.fillStyle = 'rgba(255,255,255,0.14)';
          c.fillRect((x | 0) + 1, (y | 0) - 1, 1, 1);
        }
      }
      // and by the end, chips knocked clean out of the corners
      if (stage >= 3) {
        c.globalCompositeOperation = 'source-over';
        c.fillStyle = 'rgba(6,3,14,0.85)';
        const k = stage - 2;
        c.fillRect(0, 0, k, k);
        c.fillRect(TILE - k - 1, TILE - k, k + 1, k);
      }
      crackCv.push(cv);
    }
  }

  /* ------------------------------------------------------------------- world */
  function World(body, index) {
    this.body = body;
    this.index = index;
    this.radius = body.radius;
    this.w = body.radius * 2 + MARGIN * 2;
    this.h = SKY + body.radius * 2 + 10;
    this.cx = this.w / 2;
    this.cy = SKY + body.radius;
    this.pxW = this.w * TILE;
    this.pxH = this.h * TILE;
    this.bodyTopPx = (this.cy - this.radius) * TILE;
    this.centerPx = { x: this.cx * TILE, y: this.cy * TILE };

    this.cells = new Uint8Array(this.w * this.h);
    this.dmg = new Float32Array(this.w * this.h);
    this.heat = new Float32Array(this.w * this.h);
    this.inside = new Uint8Array(this.w * this.h);    // silhouette mask: cave backdrop goes here
    this.stratum = new Uint8Array(this.w * this.h);   // which depth band a cell belongs to
    this.seen = new Uint8Array(this.w * this.h);      // fog of war for the minimap
    this.pois = [];                                    // ruins etc. the game spawns things at
    this.strata = D.STRATA[body.type] || D.STRATA.rock;

    this.coreCells = [];
    this.coreMax = body.coreHp;
    this.coreHp = body.coreHp;
    this.mined = 0;
    this.totalSolid = 0;

    this.hardness = 1 + index * 0.14;
    this.seed = 1000 + index * 977;
    this.generate();
    this.buildBackdrop();
    this.buildStars();
  }

  World.prototype.idx = function (cx, cy) { return cy * this.w + cx; };
  World.prototype.inBounds = function (cx, cy) { return cx >= 0 && cy >= 0 && cx < this.w && cy < this.h; };
  World.prototype.at = function (cx, cy) {
    if (!this.inBounds(cx, cy)) return 0;
    return this.cells[cy * this.w + cx];
  };

  /* Pick from a [[key, weight]...] table using a 0..1 value, so neighbouring
     cells sharing a noise value share a rock and the base fill clumps. */
  function pickTable(table, t) {
    let total = 0;
    for (const e of table) total += e[1];
    let acc = 0;
    for (const e of table) {
      acc += e[1] / total;
      if (t <= acc) return M[e[0]];
    }
    return M[table[table.length - 1][0]];
  }

  World.prototype.stratumFor = function (depth) {
    const st = this.strata;
    for (let i = 0; i < st.length; i++) if (depth >= st[i].a && depth < st[i].b) return i;
    return st.length - 1;
  };

  World.prototype.generate = function () {
    const b = this.body, s = this.seed;
    const r = this.radius;
    // Core and chamber scale with the body: a pebble must not be two thirds
    // hollow, and a superplanet needs room to fight the Warden in.
    const coreR = Math.max(2.6, r * 0.1 + 1.2);
    const chamberR = coreR + U.clamp(r * 0.14, 3.5, 11);
    const strata = this.strata;

    for (let cy = 0; cy < this.h; cy++) {
      for (let cx = 0; cx < this.w; cx++) {
        const dx = cx + 0.5 - this.cx, dy = cy + 0.5 - this.cy;
        const d = Math.sqrt(dx * dx + dy * dy);
        const ang = Math.atan2(dy, dx);
        // lumpy silhouette so bodies read as hand-drawn rocks
        const wobble = (U.fbm(Math.cos(ang) * 2 + s, Math.sin(ang) * 2 + s, 3) - 0.5) * r * 0.22
                     + (U.noise2(Math.cos(ang) * 6 + s, Math.sin(ang) * 6 + s) - 0.5) * r * 0.09;
        const rEff = r + wobble;
        if (d > rEff) continue;

        const i = this.idx(cx, cy);
        this.inside[i] = 1;
        const depth = 1 - d / Math.max(1, rEff);   // 0 at surface, 1 at core
        const si = this.stratumFor(depth);
        const L0 = strata[si];
        this.stratum[i] = si;
        let mat;

        if (d < coreR) { mat = M.core; }
        else if (d < chamberR) { mat = 0; }        // hollow core chamber
        else {
          // pocket biome: swap in the stratum's alternate table where the
          // slow biome noise runs hot
          const biome = U.fbm(cx * 0.05 + s * 2, cy * 0.05 - s * 2, 2);
          const pocket = L0.alt && biome > U.fbmThreshold(0.3, 0.52, 0.14);
          const fills = pocket ? L0.alt.fills : L0.fills;
          const ores = pocket ? L0.alt.ores : L0.ores;

          // caves: tight worm tunnels plus a few grand caverns
          const tunnel = U.fbm(cx * 0.12 + s, cy * 0.12 - s, 3);
          const cavern = U.fbm(cx * 0.045 - s, cy * 0.05 + s, 2);
          const caveWant = L0.caves * (0.22 + depth * 0.6);
          if (depth > 0.1 && (tunnel > U.fbmThreshold(caveWant, 0.52, 0.145) ||
              cavern > U.fbmThreshold(caveWant * 0.28, 0.52, 0.15))) {
            this.cells[i] = 0; continue;
          }

          if (depth < 0.07) {
            mat = pickTable(strata[0].fills, U.hash2(cx, cy));
          } else {
            const fillT = U.clamp((U.fbm(cx * 0.055 + s * 5, cy * 0.055 + s * 7, 2) - 0.22) / 0.6, 0, 0.999);
            mat = pickTable(fills, fillT);

            // veins, valuable first so the rarest ore wins a contested tile
            const totalW = ores.reduce((t, o) => t + o[1], 0);
            const sorted = ores.slice().sort((a, x) => D.MAT[M[x[0]]].cr - D.MAT[M[a[0]]].cr);
            for (const [okey, wt] of sorted) {
              const oid = M[okey];
              const om = D.MAT[oid];
              const share = wt / Math.max(1, totalW);
              const rarity = U.clamp(om.cr / 5000, 0, 1);
              // the good stuff only shows up once you have committed to the dig
              if (depth < rarity * 0.3) continue;
              // steep curve: a 2000-credit ore is a find, a 40000-credit one a legend
              const scarce = Math.max(0.03, Math.pow(1 - rarity, 1.7)) * (om.shine ? 0.6 : 1);
              const want = U.clamp(share * (0.3 + depth * 1.0) * scarce, 0, 0.6);
              if (want <= 0) continue;
              const vein = U.fbm(cx * 0.24 + oid * 21 + s, cy * 0.24 - oid * 13 - s, 2);
              if (vein > U.fbmThreshold(want, 0.52, 0.155)) { mat = oid; break; }
            }

            // magma pockets in the hot bands
            if (L0.lava) {
              const hot = U.fbm(cx * 0.16 + s * 3, cy * 0.16 + s * 9, 2);
              if (hot > U.fbmThreshold(L0.lava, 0.52, 0.15)) mat = M.lava;
            }
          }
        }
        this.cells[i] = mat;
        if (mat === M.core) this.coreCells.push(i);
        if (mat) this.totalSolid++;
      }
    }

    this.coreCenter = { x: this.cx * TILE, y: this.cy * TILE };
    this.coreR = coreR * TILE;
    this.chamberR = chamberR * TILE;

    this.carveCraters(r);
    this.lavaLakes();
    this.placePois();

    // a crust skin makes the silhouette crisp and gives a surface to land on
    for (let cy = 0; cy < this.h; cy++) {
      for (let cx = 0; cx < this.w; cx++) {
        const i = this.idx(cx, cy);
        const m = this.cells[i];
        if (!m || m === M.core || m === M.lava) continue;
        if (!this.at(cx, cy - 1) && this.stratum[i] === 0 && U.hash2(cx, cy) > 0.25) {
          if (D.MAT[m].cr < 40) this.cells[i] = pickTable(this.strata[0].fills, U.hash2(cy, cx));
        }
      }
    }
  };

  /* Molten pools settle on cavern floors in the hot strata. */
  World.prototype.lavaLakes = function () {
    const rnd = U.mulberry32(this.seed + 99);
    for (let cy = 1; cy < this.h - 1; cy++) {
      for (let cx = 1; cx < this.w - 1; cx++) {
        const i = this.idx(cx, cy);
        if (!this.inside[i] || this.cells[i]) continue;
        const L0 = this.strata[this.stratum[i]];
        if (!L0.lava) continue;
        if (!this.at(cx, cy + 1) || this.at(cx, cy + 1) === M.lava) continue;
        if (rnd() > L0.lava * 0.9) continue;
        // spread sideways along the floor
        for (let k = -4; k <= 4; k++) {
          const x2 = cx + k;
          if (!this.inBounds(x2, cy)) continue;
          const j = this.idx(x2, cy);
          if (this.cells[j] || !this.inside[j]) continue;
          if (!this.at(x2, cy + 1)) continue;
          this.cells[j] = M.lava;
          if (rnd() > 0.55 && !this.cells[j - this.w]) this.cells[j - this.w] = M.lava;
        }
      }
    }
  };

  /* Points of interest: geodes, fossil beds and precursor ruins. */
  World.prototype.placePois = function () {
    const rnd = U.mulberry32(this.seed + 4242);
    const r = this.radius;
    const poi = this.body.poi || {};
    const spot = (dmin, dmax) => {
      for (let t = 0; t < 60; t++) {
        const ang = rnd() * U.TAU, dd = r * (1 - (dmin + rnd() * (dmax - dmin)));
        const cx = Math.round(this.cx + Math.cos(ang) * dd), cy = Math.round(this.cy + Math.sin(ang) * dd);
        if (!this.inBounds(cx, cy) || !this.inside[this.idx(cx, cy)]) continue;
        if (U.dist(cx, cy, this.cx, this.cy) < this.chamberR / TILE + 6) continue;
        return { cx, cy };
      }
      return null;
    };
    const gemsFor = (cx, cy) => {
      const L0 = this.strata[this.stratum[this.idx(cx, cy)]];
      const shiny = L0.ores.filter(o => D.MAT[M[o[0]]].shine);
      return shiny.length ? shiny : [['crystal', 1]];
    };

    for (let n = 0; n < (poi.geode || 0); n++) {
      const at = spot(0.25, 0.85); if (!at) continue;
      const R = 2.5 + rnd() * 3.5;
      const gems = gemsFor(at.cx, at.cy);
      for (let cy = Math.floor(at.cy - R - 2); cy <= at.cy + R + 2; cy++) {
        for (let cx = Math.floor(at.cx - R - 2); cx <= at.cx + R + 2; cx++) {
          if (!this.inBounds(cx, cy)) continue;
          const i = this.idx(cx, cy);
          if (!this.inside[i] || this.cells[i] === M.core) continue;
          const d = U.dist(cx + 0.5, cy + 0.5, at.cx + 0.5, at.cy + 0.5);
          if (d < R) this.cells[i] = 0;
          else if (d < R + 1.6) this.cells[i] = rnd() > 0.45 ? M.crystal : M[pickTableKey(gems, rnd())];
        }
      }
      this.pois.push({ kind: 'geode', cx: at.cx, cy: at.cy });
    }

    for (let n = 0; n < (poi.fossil || 0); n++) {
      const at = spot(0.3, 0.8); if (!at) continue;
      for (let k = 0; k < 9; k++) {
        const cx = at.cx + Math.round((rnd() - 0.5) * 7), cy = at.cy + Math.round((rnd() - 0.5) * 3);
        if (!this.inBounds(cx, cy)) continue;
        const i = this.idx(cx, cy);
        if (this.inside[i] && this.cells[i] && this.cells[i] !== M.core) this.cells[i] = M.fossil;
      }
    }

    for (let n = 0; n < (poi.ruin || 0); n++) {
      const at = spot(0.35, 0.8); if (!at) continue;
      const W = 8 + Math.floor(rnd() * 6), H = 5 + Math.floor(rnd() * 2);
      const x0 = at.cx - (W >> 1), y0 = at.cy - (H >> 1);
      let ok = true;
      for (let cy = y0 - 1; cy <= y0 + H; cy++) for (let cx = x0 - 1; cx <= x0 + W; cx++) {
        if (!this.inBounds(cx, cy) || !this.inside[this.idx(cx, cy)]) ok = false;
      }
      if (!ok) continue;
      for (let cy = y0 - 1; cy <= y0 + H; cy++) {
        for (let cx = x0 - 1; cx <= x0 + W; cx++) {
          const i = this.idx(cx, cy);
          const wall = cy === y0 - 1 || cy === y0 + H || cx === x0 - 1 || cx === x0 + W;
          this.cells[i] = wall ? M.hull : 0;
        }
      }
      // a plinth with the relic on it, and room for the loot
      const px = x0 + (W >> 1);
      this.cells[this.idx(px, y0 + H - 1)] = M.hull;
      this.cells[this.idx(px, y0 + H - 2)] = M.relic;
      // one doorway so it can be found by tunnelling in
      this.cells[this.idx(x0 - 1, y0 + H - 1)] = 0;
      this.cells[this.idx(x0 + W, y0 + H - 1)] = 0;
      this.pois.push({ kind: 'ruin', cx: at.cx, cy: at.cy, x0, y0, w: W, h: H });
    }
    this.totalSolid = 0;
    for (let i = 0; i < this.cells.length; i++) if (this.cells[i]) this.totalSolid++;
  };

  function pickTableKey(table, t) {
    let total = 0;
    for (const e of table) total += e[1];
    let acc = 0;
    for (const e of table) { acc += e[1] / total; if (t <= acc) return e[0]; }
    return table[table.length - 1][0];
  }

  World.prototype.carveCraters = function (r) {
    const rnd = U.mulberry32(this.seed + 17);
    const n = Math.round(4 + r * 0.32);
    for (let i = 0; i < n; i++) {
      const ang = rnd() * U.TAU;
      const rad = 1.6 + rnd() * rnd() * (2.2 + r * 0.11);
      const depth = rad * (0.45 + rnd() * 0.5);
      const ox = this.cx + Math.cos(ang) * (r + rad - depth);
      const oy = this.cy + Math.sin(ang) * (r + rad - depth);
      const c0 = Math.floor(ox - rad - 1), c1 = Math.ceil(ox + rad + 1);
      const r0 = Math.floor(oy - rad - 1), r1 = Math.ceil(oy + rad + 1);
      for (let cy = r0; cy <= r1; cy++) {
        for (let cx = c0; cx <= c1; cx++) {
          if (!this.inBounds(cx, cy)) continue;
          const dx = cx + 0.5 - ox, dy = cy + 0.5 - oy;
          if (dx * dx + dy * dy > rad * rad) continue;
          const i2 = this.idx(cx, cy);
          if (this.cells[i2] === M.core) continue;
          if (this.cells[i2]) this.totalSolid--;
          this.cells[i2] = 0;
          this.inside[i2] = 0;
        }
      }
    }
  };

  /* Dark rock face drawn behind caves so tunnels no longer show stars. */
  World.prototype.buildBackdrop = function () {
    this.bgAtlas = this.strata.map((L0, si) => {
      const variants = [];
      for (let v = 0; v < 4; v++) {
        const cv = document.createElement('canvas');
        cv.width = TILE; cv.height = TILE;
        const c = cv.getContext('2d');
        // the wall behind a cave is lit rock, not a hole: colour it and give it
        // a soft mottle so caverns read as rooms
        c.fillStyle = lift(L0.tint, 1.15, 10);
        c.fillRect(0, 0, TILE, TILE);
        for (let k = 0; k < 5; k++) {
          const h = U.hash2(v * 17 + k, si * 31 + k * 5);
          c.fillStyle = lift(L0.tint, h > 0.5 ? 1.5 : 0.75, h > 0.5 ? 18 : 0);
          c.globalAlpha = 0.5;
          // chipped flecks, not soft dots
          const bx = Math.floor(h * TILE), by = Math.floor(U.hash2(k, v + si) * TILE);
          const bw = 1 + Math.floor(h * 3), bh = 1 + ((k + v) % 2);
          c.fillRect(bx, by, bw, bh);
          c.fillRect(bx + 1, by + bh, Math.max(1, bw - 2), 1);
        }
        c.globalAlpha = 1;
        variants.push(cv);
      }
      return variants;
    });
  };

  /* Stratum under a world point -- for banners, ambience and light colour. */
  World.prototype.stratumAt = function (x, y) {
    const d = U.dist(x, y, this.coreCenter.x, this.coreCenter.y) / (this.radius * TILE);
    if (d > 1.02) return -1;
    return this.stratumFor(U.clamp(1 - d, 0, 1));
  };

  /* Mark everything the lamp can reach as seen, for the minimap. */
  World.prototype.reveal = function (x, y, radius) {
    const c0 = Math.max(0, Math.floor((x - radius) / TILE)), c1 = Math.min(this.w - 1, Math.ceil((x + radius) / TILE));
    const r0 = Math.max(0, Math.floor((y - radius) / TILE)), r1 = Math.min(this.h - 1, Math.ceil((y + radius) / TILE));
    const rr = radius * radius;
    for (let cy = r0; cy <= r1; cy++) {
      for (let cx = c0; cx <= c1; cx++) {
        const dx = cx * TILE + 5 - x, dy = cy * TILE + 5 - y;
        if (dx * dx + dy * dy <= rr) this.seen[cy * this.w + cx] = 1;
      }
    }
  };

  World.prototype.buildStars = function () {
    const rnd = U.mulberry32(this.seed);
    this.stars = [];
    for (let layer = 0; layer < 3; layer++) {
      const n = 90 - layer * 20;
      const arr = [];
      for (let i = 0; i < n; i++) {
        arr.push({
          x: rnd() * 1.4, y: rnd(),
          s: layer === 0 ? 1 : (rnd() > 0.75 ? 2 : 1),
          tw: rnd() * 6.28,
          c: rnd() > 0.86 ? '#ffd9a0' : (rnd() > 0.7 ? '#a9d8ff' : '#ffffff')
        });
      }
      this.stars.push(arr);
    }
    // a couple of distant sibling planets for depth
    this.decor = [];
    for (let i = 0; i < 3; i++) {
      this.decor.push({
        x: rnd(), y: rnd() * 0.55, r: 6 + rnd() * 16,
        c: U.pick(['#3b2a5c', '#2a3a5c', '#5c3a3a', '#2f4a42']),
        p: 0.06 + i * 0.05
      });
    }

    // a big cratered companion moon hanging over the dig site
    const size = 96 + Math.round(rnd() * 80);
    this.moon = {
      cv: PD.arthome.buildMoon(size, this.body.tint, this.seed * 3 + 11),
      x: 0.12 + rnd() * 0.5, y: 0.05 + rnd() * 0.2, p: 0.035
    };
    // and a soft nebula wash behind everything
    this.nebula = buildNebula(this.body.sky, this.body.tint, this.seed);
  };

  /* Low-res coloured clouds, blown up with smoothing off for a chunky wash. */
  function buildNebula(sky, tint, seed) {
    const w = 60, h = 34;
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const img = c.createImageData(w, h);
    const tr = parseInt(tint.slice(1, 3), 16), tg = parseInt(tint.slice(3, 5), 16), tb = parseInt(tint.slice(5, 7), 16);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const n = U.fbm(x * 0.09 + seed, y * 0.13 - seed, 3);
        const a = U.clamp((n - 0.5) * 2.6, 0, 1);
        const i = (y * w + x) * 4;
        img.data[i] = tr * 0.55 + 40;
        img.data[i + 1] = tg * 0.5 + 26;
        img.data[i + 2] = tb * 0.7 + 70;
        img.data[i + 3] = a * 70;
      }
    }
    c.putImageData(img, 0, 0);
    return cv;
  }

  /* ------------------------------------------------------------- queries */
  World.prototype.solidAt = function (x, y) {
    const cx = Math.floor(x / TILE), cy = Math.floor(y / TILE);
    if (!this.inBounds(cx, cy)) return false;
    return this.cells[cy * this.w + cx] !== 0;
  };

  World.prototype.matAt = function (x, y) {
    const cx = Math.floor(x / TILE), cy = Math.floor(y / TILE);
    if (!this.inBounds(cx, cy)) return 0;
    return this.cells[cy * this.w + cx];
  };

  World.prototype.rectSolid = function (x, y, w, h) {
    const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.001) / TILE);
    const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 0.001) / TILE);
    for (let cy = y0; cy <= y1; cy++) {
      for (let cx = x0; cx <= x1; cx++) {
        if (!this.inBounds(cx, cy)) continue;
        if (this.cells[cy * this.w + cx]) return true;
      }
    }
    return false;
  };

  /* Gravity fades in as you approach the rock -- pure float in open space. */
  World.prototype.gravityAt = function (y) {
    const top = this.bodyTopPx;
    return this.body.gravity * U.smoothstep(top - 90, top + 40, y);
  };

  World.prototype.depthMeters = function (y) {
    return Math.max(0, Math.round((y - this.bodyTopPx) / TILE));
  };

  World.prototype.maxDepthMeters = function () {
    return Math.round((this.radius * 2) * 1);
  };

  /* --------------------------------------------------------------- drilling */
  World.prototype.tileHp = function (mat, cx, cy) {
    let h = D.MAT[mat].hp * this.hardness;
    if (cx !== undefined) {
      const si = this.stratum[this.idx(cx, cy)];
      h *= 1 + si * 0.22;           // every band down is tougher rock
    }
    return h;
  };

  /* Returns the material id if the tile broke this call, else 0. */
  World.prototype.damage = function (cx, cy, amount) {
    if (!this.inBounds(cx, cy)) return 0;
    const i = cy * this.w + cx;
    const mat = this.cells[i];
    if (!mat) return 0;
    if (mat === M.core) {
      this.coreHp = Math.max(0, this.coreHp - amount);
      this.dmg[i] += amount;
      return this.coreHp <= 0 ? M.core : 0;
    }
    this.dmg[i] += amount;
    if (this.dmg[i] >= this.tileHp(mat, cx, cy)) {
      const mm = D.MAT[mat];
      this.dmg[i] = 0;
      if (mm.drop) {                 // magma quenches into basalt; nothing to collect
        this.cells[i] = mm.drop;
        return -mat;
      }
      this.cells[i] = 0;
      this.mined++;
      return mat;
    }
    return 0;
  };

  /* Hazard damage per second for a world rect (magma, mostly). */
  World.prototype.hazardIn = function (x, y, w, h) {
    const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w) / TILE);
    const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h) / TILE);
    let worst = 0;
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
      const m = this.at(cx, cy);
      if (m && D.MAT[m].hazard) worst = Math.max(worst, D.MAT[m].hazard);
    }
    return worst;
  };

  World.prototype.crackFrac = function (cx, cy) {
    const i = this.idx(cx, cy);
    const mat = this.cells[i];
    if (!mat) return 0;
    if (mat === M.core) return 1 - this.coreHp / this.coreMax;
    return U.clamp(this.dmg[i] / this.tileHp(mat, cx, cy), 0, 1);
  };

  World.prototype.clear = function (cx, cy) {
    if (!this.inBounds(cx, cy)) return 0;
    const i = cy * this.w + cx;
    const m = this.cells[i];
    this.cells[i] = 0; this.dmg[i] = 0;
    return m;
  };

  /* True when a tile has nothing beneath or beside it -- a cave-in candidate. */
  World.prototype.unsupported = function (cx, cy) {
    if (!this.at(cx, cy)) return false;
    if (this.at(cx, cy + 1)) return false;
    let side = 0;
    if (this.at(cx - 1, cy)) side++;
    if (this.at(cx + 1, cy)) side++;
    return side < 2;
  };

  /* Rip a hole and hand back what came out (used by explosions). */
  World.prototype.removeDisc = function (px, py, r) {
    const out = [];
    const c0 = Math.floor((px - r) / TILE), c1 = Math.floor((px + r) / TILE);
    const r0 = Math.floor((py - r) / TILE), r1 = Math.floor((py + r) / TILE);
    for (let cy = r0; cy <= r1; cy++) {
      for (let cx = c0; cx <= c1; cx++) {
        if (!this.inBounds(cx, cy)) continue;
        const tx = cx * TILE + TILE / 2, ty = cy * TILE + TILE / 2;
        if (U.dist2(px, py, tx, ty) > r * r) continue;
        const m = this.cells[cy * this.w + cx];
        if (!m || m === M.core) continue;
        this.cells[cy * this.w + cx] = 0;
        this.dmg[cy * this.w + cx] = 0;
        out.push({ cx, cy, mat: m, x: tx, y: ty });
      }
    }
    return out;
  };

  /* Snapshot a patch of tiles as a little canvas -- flying debris art. */
  World.prototype.grabChunk = function (cx, cy, size) {
    const cv = document.createElement('canvas');
    cv.width = size * TILE; cv.height = size * TILE;
    const c = cv.getContext('2d');
    let any = false;
    for (let j = 0; j < size; j++) {
      for (let i = 0; i < size; i++) {
        const m = this.at(cx + i, cy + j);
        if (!m) continue;
        any = true;
        const v = (U.hash2(cx + i, cy + j) * 4) | 0;
        c.drawImage(matShape(m, 15, v), i * TILE, j * TILE, TILE, TILE);
      }
    }
    if (!any) return null;
    // round the corners a touch so chunks read as broken rock, not squares
    c.globalCompositeOperation = 'destination-out';
    c.fillStyle = '#000';
    const k = Math.max(1, (size * TILE) / 5);
    c.fillRect(0, 0, k, k); c.fillRect(cv.width - k, 0, k, k);
    c.fillRect(0, cv.height - k, k, k); c.fillRect(cv.width - k, cv.height - k, k, k);
    return cv;
  };

  /* ---------------------------------------------------------------- drawing */
  World.prototype.drawSky = function (ctx, cam, vw, vh, time, hideMoon, skipBase) {
    const b = this.body;
    if (skipBase) { this.drawMoon(ctx, cam, vw, vh); return; }
    const g = ctx.createLinearGradient(0, 0, 0, vh);
    g.addColorStop(0, b.sky);
    g.addColorStop(1, '#05030f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, vw, vh);

    if (this.nebula) {
      ctx.globalAlpha = 0.85;
      ctx.drawImage(this.nebula, -((cam.x * 0.02) % vw) - 4, -((cam.y * 0.015) % vh) - 4, vw + 8, vh + 8);
      ctx.globalAlpha = 1;
    }

    for (let l = 0; l < this.stars.length; l++) {
      const par = 0.04 + l * 0.05;
      const arr = this.stars[l];
      for (const st of arr) {
        const x = ((st.x * vw * 1.4 - cam.x * par) % (vw * 1.4) + vw * 1.4) % (vw * 1.4);
        const y = ((st.y * vh * 1.6 - cam.y * par * 0.7) % (vh * 1.6) + vh * 1.6) % (vh * 1.6);
        if (x > vw || y > vh) continue;
        const tw = 0.55 + 0.45 * Math.sin(time * 2 + st.tw);
        ctx.globalAlpha = tw * (0.35 + l * 0.22);
        ctx.fillStyle = st.c;
        ctx.fillRect(x | 0, y | 0, st.s, st.s);
      }
    }
    ctx.globalAlpha = 1;

    for (const d of this.decor) {
      const x = d.x * vw * 1.2 - cam.x * d.p;
      const y = d.y * vh - cam.y * d.p * 0.6;
      ctx.globalAlpha = 0.5;
      PD.pxd.blob(ctx, x, y, d.r, d.r, d.c);
      ctx.globalAlpha = 1;
    }

    if (!hideMoon) this.drawMoon(ctx, cam, vw, vh);
  };

  World.prototype.drawMoon = function (ctx, cam, vw, vh) {
    if (this.moon) {
      const m = this.moon;
      const x = m.x * vw - cam.x * m.p;
      const y = m.y * vh - cam.y * m.p * 0.8;
      // halo as stepped bands
      PD.pxd.glowBands(ctx, x + m.cv.width / 2, y + m.cv.height / 2, m.cv.width * 0.85, this.body.tint, 4, 0.3);
      ctx.globalAlpha = 0.95;
      ctx.drawImage(m.cv, x | 0, y | 0);
      ctx.globalAlpha = 1;
    }
  };

  World.prototype.drawCoreGlow = function (ctx, cam, time) {
    if (this.coreHp <= 0) return;
    const x = this.coreCenter.x - cam.x, y = this.coreCenter.y - cam.y;
    const frac = this.coreHp / this.coreMax;
    const r = this.coreR * (2.6 + 0.5 * Math.sin(time * 3)) * (1 + (1 - frac) * 0.5);
    PD.pxd.glowBands(ctx, x, y, r, '#ff8a3c', 5, 0.5);
  };

  World.prototype.draw = function (ctx, cam, vw, vh, time) {
    this.drawCoreGlow(ctx, cam, time);
    const c0 = Math.max(0, Math.floor(cam.x / TILE));
    const c1 = Math.min(this.w - 1, Math.ceil((cam.x + vw) / TILE));
    const r0 = Math.max(0, Math.floor(cam.y / TILE));
    const r1 = Math.min(this.h - 1, Math.ceil((cam.y + vh) / TILE));

    this.glows = this.glows || [];
    this.glows.length = 0;

    for (let cy = r0; cy <= r1; cy++) {
      for (let cx = c0; cx <= c1; cx++) {
        const i = cy * this.w + cx;
        const m = this.cells[i];
        const sx = cx * TILE - cam.x | 0;
        const sy = cy * TILE - cam.y | 0;
        if (!m) {
          // a cave shows the rock face behind it, not the stars
          if (this.inside[i]) {
            const v = (U.hash2(cx * 3, cy * 7) * 4) | 0;
            ctx.drawImage(this.bgAtlas[this.stratum[i]][v], sx, sy);
          }
          continue;
        }

        if (m === PD.data.M.core) { this.drawCoreTile(ctx, sx, sy, cx, cy, time); continue; }
        if (m === PD.data.M.lava) { this.drawLavaTile(ctx, sx, sy, cx, cy, time); this.glows.push(sx + 5, sy + 5, 26, 0); continue; }
        if (D.MAT[m].glow && this.glows.length < 200) this.glows.push(sx + 5, sy + 5, D.MAT[m].glowR || 16, m);

        const up = cy > 0 ? this.cells[i - this.w] : 1;
        const dn = cy < this.h - 1 ? this.cells[i + this.w] : 1;
        const lf = cx > 0 ? this.cells[i - 1] : 1;
        const rt = cx < this.w - 1 ? this.cells[i + 1] : 1;
        const mask = (up ? 1 : 0) | (rt ? 2 : 0) | (dn ? 4 : 0) | (lf ? 8 : 0);
        const v = (U.hash2(cx, cy) * 4) | 0;
        const mm2 = D.MAT[m];

        // 1. the band's own rock, so cut corners never show through to space
        ctx.drawImage(baseShape(this.strata[this.stratum[i]].tint, mask, v), sx, sy, TILE, TILE);
        // 2. this material as a blob against its own kind
        const mmask = (up === m ? 1 : 0) | (rt === m ? 2 : 0) | (dn === m ? 4 : 0) | (lf === m ? 8 : 0);
        ctx.drawImage(matShape(m, mmask, v), sx, sy, TILE, TILE);
        // 3. light and rim, only where the tile faces open space
        if (mask !== 15) ctx.drawImage(lightShape(mask, v), sx, sy, TILE, TILE);

        // rolling soil lip along any open surface: the ground line waves
        if (!up) {
          const hL = Math.round((U.hash2(cx, cy * 3) - 0.5) * 3);
          const hR = Math.round((U.hash2(cx + 1, cy * 3) - 0.5) * 3);
          const hM = Math.round((U.hash2(cx * 2 + 7, cy) - 0.5) * 3);
          // a hard sawtooth crest, drawn as columns so it stays pixels
          ctx.fillStyle = mm2.c[0];
          for (let k = 0; k < TILE; k += 2) {
            const f = k / TILE;
            const top = Math.round(f < 0.5 ? hL + (hM - hL) * (f * 2) : hM + (hR - hM) * ((f - 0.5) * 2));
            ctx.fillRect(sx + k, sy + top, 2, 4 - top);
          }
        }

        const mm = mm2;
        if (mm.shine) {
          const exposed = !this.cells[i - 1] || !this.cells[i + 1] || !this.cells[i - this.w] || !this.cells[i + this.w];
          if (exposed) {
            const tw = Math.sin(time * 3 + cx * 1.7 + cy * 2.3);
            if (tw > 0.55) {
              ctx.fillStyle = '#ffffff';
              ctx.globalAlpha = (tw - 0.55) / 0.45;
              ctx.fillRect(sx + 4, sy + 3, 2, 1);
              ctx.fillRect(sx + 4, sy + 5, 2, 1);
              ctx.fillRect(sx + 3, sy + 4, 4, 1);
              ctx.globalAlpha = 1;
            }
          }
        }

        const dmg = this.dmg[i];
        if (dmg > 0) {
          const f = dmg / this.tileHp(m, cx, cy);
          const stage = U.clamp(Math.floor(f * CRACK_STAGES), 0, CRACK_STAGES - 1);
          // a tile about to give shudders in place: the last thing it does
          if (stage >= 3) {
            const jx = Math.round(Math.sin(time * 47 + cx * 3 + cy) * (stage - 2) * 0.6);
            const jy = Math.round(Math.cos(time * 41 + cy * 3) * (stage - 2) * 0.4);
            ctx.drawImage(crackCv[stage], sx + jx, sy + jy);
            ctx.fillStyle = 'rgba(255,240,200,0.16)';
            ctx.fillRect(sx, sy, TILE, 1);
          } else ctx.drawImage(crackCv[stage], sx, sy);
        }

        const heat = this.heat[i];
        if (heat > 0) {
          ctx.globalAlpha = U.clamp(heat, 0, 1) * (0.55 + 0.45 * Math.sin(time * 18 + cx + cy));
          ctx.fillStyle = heat > 0.6 ? '#fff2b0' : '#ff7a2a';
          ctx.fillRect(sx, sy, TILE, TILE);
          ctx.globalAlpha = 1;
        }
      }
    }
  };

  /* The core reads as one molten orb rather than a stack of flat tiles:
     each tile is shaded by its distance from the core centre. */
  /* Magma: a slow churn of bright cells on a dark crust, with a hot skin. */
  World.prototype.drawFlora = function () {};   // no plants: these are dead rocks

  World.prototype.drawLavaTile = function (ctx, sx, sy, cx, cy, time) {
    const swirl = Math.sin(time * 1.6 + cx * 0.9 + cy * 1.3) * 0.5 + 0.5;
    ctx.fillStyle = swirl > 0.55 ? '#ff7a2a' : '#e0521c';
    ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = '#ffd27a';
    ctx.globalAlpha = 0.5 + swirl * 0.5;
    const ox = Math.floor(U.hash2(cx, cy + Math.floor(time * 2)) * 6);
    ctx.fillRect(sx + ox, sy + 3, 3, 2);
    ctx.fillRect(sx + (ox + 4) % 8, sy + 6, 2, 2);
    ctx.globalAlpha = 1;
    if (!this.at(cx, cy - 1)) {                  // glowing surface skin
      ctx.fillStyle = '#fff0b0';
      ctx.fillRect(sx, sy, TILE, 1);

  World.prototype.drawCoreTile = function (ctx, sx, sy, cx, cy, time) {
    const dx = (cx + 0.5) - this.cx, dy = (cy + 0.5) - this.cy;
    const t = U.clamp(Math.sqrt(dx * dx + dy * dy) / Math.max(1, this.coreR / TILE), 0, 1);
    const frac = this.coreHp / this.coreMax;
    const pulse = 0.5 + 0.5 * Math.sin(time * 5 - t * 4);

/* ===== src/entities.js ===== */
/* Mobs, bullets, loose ore and falling boulders. Each entity exposes
   update(dt, g) / draw(ctx, cam, t) where `g` is the running game. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const FX = PD.fx;
  const TILE = PD.world.TILE;
  const A = PD.audio;

  /* Cache a solid-white copy of each sprite frame for hit flashes. */
  const whiteCache = new Map();
  function flashOf(cv) {
    if (whiteCache.has(cv)) return whiteCache.get(cv);
    const c = document.createElement('canvas');
    c.width = cv.width; c.height = cv.height;
    const x = c.getContext('2d');
    x.drawImage(cv, 0, 0);
    x.globalCompositeOperation = 'source-atop';
    x.fillStyle = '#ffffff';
    x.fillRect(0, 0, c.width, c.height);
    whiteCache.set(cv, c);
    return c;
  }

  /* Sprites authored at 2x density carry hd = 2 and draw at logical size. */
  function drawSprite(ctx, spr, frame, x, y, flip, tint) {
    const cv = spr.frames[frame % spr.frames.length];
    const src = tint ? flashOf(cv) : cv;
    const k = spr.hd || 1;
    ctx.save();
    ctx.translate(x | 0, y | 0);
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(src, -spr.ox | 0, -spr.oy | 0, cv.width / k, cv.height / k);
    ctx.restore();
  }

  /* Axis-separated tile collision. Returns which sides were blocked. */
  function moveBody(e, world, dt) {
    const hit = { x: 0, y: 0, ground: false, ceil: false };

    // Already buried (cave-in, teleport, spawned inside rock)? Move freely so
    // the body can work its way out instead of vibrating in place forever.
    if (world.rectSolid(e.x - e.w / 2, e.y - e.h / 2, e.w, e.h)) {
      // a slow ooze, deliberately too weak to use as a shortcut through rock
      const sp = Math.hypot(e.vx, e.vy);
      const k = sp > 45 ? 45 / sp : 1;
      e.x += e.vx * k * 0.35 * dt;
      e.y += e.vy * k * 0.35 * dt;
      e.x = U.clamp(e.x, 4, world.pxW - 4);
      e.y = U.clamp(e.y, 4, world.pxH - 4);
      hit.stuck = true;
      return hit;
    }

    let nx = e.x + e.vx * dt;
    if (world.rectSolid(nx - e.w / 2, e.y - e.h / 2, e.w, e.h)) {
      hit.x = Math.sign(e.vx) || 1;
      e.vx = 0;
    } else e.x = nx;

    let ny = e.y + e.vy * dt;
    if (world.rectSolid(e.x - e.w / 2, ny - e.h / 2, e.w, e.h)) {
      if (e.vy > 0) { hit.ground = true; } else { hit.ceil = true; }
      hit.y = Math.sign(e.vy) || 1;
      e.vy = 0;
    } else e.y = ny;

    e.x = U.clamp(e.x, 4, world.pxW - 4);
    e.y = U.clamp(e.y, 4, world.pxH - 4);
    return hit;
  }

  function lineClear(world, x0, y0, x1, y1) {
    const d = U.dist(x0, y0, x1, y1);
    const steps = Math.ceil(d / (TILE * 0.6));
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      if (world.solidAt(U.lerp(x0, x1, t), U.lerp(y0, y1, t))) return false;
    }
    return true;
  }

  /* ------------------------------------------------------------------- bullet */
  function Bullet(x, y, vx, vy, dmg, friendly, color, opts) {
    opts = opts || {};
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.dmg = dmg; this.friendly = friendly;
    this.color = color || (friendly ? '#7ef9ff' : '#ff8ab0');
    this.life = opts.life || 1.5; this.dead = false;
    this.w = 3; this.h = 3;
    this.size = opts.size || 1;
  }
  Bullet.prototype.update = function (dt, g) {
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    const steps = 3;
    for (let s = 0; s < steps; s++) {
      this.x += this.vx * dt / steps;
      this.y += this.vy * dt / steps;
      if (g.world.solidAt(this.x, this.y)) {
        // friendly fire chips the rock a little -- satisfying, not a mining tool
        if (this.friendly) {
          const cx = Math.floor(this.x / TILE), cy = Math.floor(this.y / TILE);
          const mat = g.world.damage(cx, cy, this.dmg * 0.5);
          if (mat) g.onTileBroken(cx, cy, mat, false);
        }
        FX.sparks(this.x, this.y, Math.atan2(this.vy, this.vx), D.MAT[2], 3);
        this.dead = true;
        return;
      }
      if (this.friendly) {
        for (const m of g.mobs) {
          if (m.dead) continue;
          if (Math.abs(this.x - m.x) < m.w / 2 + 2 && Math.abs(this.y - m.y) < m.h / 2 + 2) {
            m.hurtBy(this.dmg, g, Math.sign(this.vx), 'bullet');
            this.dead = true;
            return;
          }
        }
      } else {
        const p = g.player;
        if (!p.dead && Math.abs(this.x - p.x) < p.w / 2 + 2 && Math.abs(this.y - p.y) < p.h / 2 + 2) {
          p.hurt(this.dmg, g);
          this.dead = true;
          return;
        }
      }
    }
    if (U.chance(dt * 40)) FX.trail(this.x, this.y, this.color, 1.4);
  };
  Bullet.prototype.draw = function (ctx, cam) {
    const x = this.x - cam.x | 0, y = this.y - cam.y | 0;
    const s2 = this.size;
    ctx.fillStyle = this.color;
    ctx.globalAlpha = 0.45;
    ctx.fillRect(x - 2 * s2, y - 2 * s2, 5 * s2, 5 * s2);
    ctx.globalAlpha = 1;
    ctx.fillRect(x - s2, y - s2, 3 * s2, 3 * s2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x, y, 1, 1);
  };

  /* ------------------------------------------------------------------- beam
     The plasma lance: an instant piercing line that scorches rock too. */
  function Beam(x0, y0, ang, len, dmg, g) {
    this.x0 = x0; this.y0 = y0;
    this.ang = ang; this.len = len;
    this.life = 0.22; this.max = 0.22; this.dead = false;
    // walk the line: hit every mob once, chip every tile
    const hit = new Set();
    const step = 4;
    let endD = len;
    for (let d = 0; d < len; d += step) {
      const x = x0 + Math.cos(ang) * d, y = y0 + Math.sin(ang) * d;
      const cx = Math.floor(x / TILE), cy = Math.floor(y / TILE);
      const mat = g.world.at(cx, cy);
      if (mat) {
        const broke = g.world.damage(cx, cy, dmg * 0.45);
        if (broke > 0) g.onTileBroken(cx, cy, broke, false);
        if (g.world.at(cx, cy) && D.MAT[mat].hp > 150) { endD = d; break; }   // dense rock stops it
      }
      for (const m of g.mobs) {
        if (m.dead || hit.has(m)) continue;
        if (Math.abs(x - m.x) < m.w / 2 + 3 && Math.abs(y - m.y) < m.h / 2 + 3) {
          hit.add(m);
          m.hurtBy(dmg, g, Math.sign(Math.cos(ang)), 'beam');
        }
      }
      if (U.chance(0.35)) FX.trail(x, y, '#d8bcff', 1.6);
    }
    this.len = endD;
    FX.burst(x0 + Math.cos(ang) * endD, y0 + Math.sin(ang) * endD, 10, ['#ffffff', '#d8bcff', '#7ef9ff'], 120, true);
  }
  Beam.prototype.update = function (dt) { this.life -= dt; if (this.life <= 0) this.dead = true; };
  Beam.prototype.draw = function (ctx, cam) {
    const t = this.life / this.max;
    const x1 = this.x0 + Math.cos(this.ang) * this.len, y1 = this.y0 + Math.sin(this.ang) * this.len;
    ctx.globalAlpha = t;
    ctx.strokeStyle = '#d8bcff'; ctx.lineWidth = 5 * t + 1;
    ctx.beginPath(); ctx.moveTo(this.x0 - cam.x, this.y0 - cam.y); ctx.lineTo(x1 - cam.x, y1 - cam.y); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2 * t;
    ctx.beginPath(); ctx.moveTo(this.x0 - cam.x, this.y0 - cam.y); ctx.lineTo(x1 - cam.x, y1 - cam.y); ctx.stroke();
    ctx.globalAlpha = 1;
  };

  /* --------------------------------------------------------------------- mob */
  const SPRITE_FOR = {
    crawler: 'grub', floater: 'jelly', spitter: 'spit',
    gnasher: 'gnasher', lurker: 'lurker', guardian: 'warden',
    mite: 'mite', shellback: 'shellback', wyrm: 'wyrm'
  };

  function Mob(type, x, y, scale) {
    const def = D.ENEMY[type];
    this.type = type;
    this.def = def;
    this.spr = PD.art.sprites[SPRITE_FOR[type]];
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.w = def.w; this.h = def.h;
    this.maxHp = Math.round(def.hp * (scale || 1));
    this.hp = this.maxHp;
    this.dmg = def.dmg * (0.7 + (scale || 1) * 0.3);
    this.facing = U.chance(0.5) ? -1 : 1;
    this.hurtT = 0;
    this.cool = U.rand(0.4, 2.2);
    this.dead = false;
    this.anim = U.rand(0, 4);
    this.state = 'idle';
    this.stateT = 0;
    this.touchCool = 0;
    this.bob = U.rand(0, U.TAU);
    this.wind = 0;                 // telegraph timer before an attack
    this.submerged = false;        // wyrms hide in magma
  }

  Mob.prototype.hurtBy = function (dmg, g, dir, src) {
    if (this.submerged) { FX.text(this.x, this.y - 12, 'SUBMERGED', '#ff8a3d', 0); return; }
    // carapace: shots glance off, the drill and beams do not
    if (this.def.armor && src === 'bullet') {
      dmg *= 1 - this.def.armor;
      FX.sparks(this.x, this.y - 4, U.rand(0, U.TAU), D.MAT[2], 4);
      A.tone(1800, { type: 'square', to: 900, dur: 0.05, vol: 0.06 });
    }
    this.hp -= dmg;
    this.hurtT = 0.14;
    this.vx += (dir || 0) * 60;
    FX.text(this.x, this.y - this.h / 2 - 4, String(Math.round(dmg)), '#fff3a0', 0);
    FX.burst(this.x, this.y, 5, ['#ffffff', '#ffd0e0', this.def.kind === 'boss' ? '#ffb060' : '#c8ff8a'], 90);
    FX.shake(1.6);
    if (this.hp <= 0) {
      this.dead = true;
      g.onMobKilled(this);
    } else {
      PD.audio.sfx.hitMob();
    }
  };

  Mob.prototype.shoot = function (g, spread) {
    const p = g.player;
    const a = Math.atan2(p.y - this.y, p.x - this.x) + (spread || 0);
    const sp = 105;
    g.bullets.push(new Bullet(this.x + Math.cos(a) * 8, this.y + Math.sin(a) * 8,
      Math.cos(a) * sp, Math.sin(a) * sp, this.dmg, false, '#b6ff8a'));
    PD.audio.sfx.tone(320, { type: 'sawtooth', to: 140, dur: 0.14, vol: 0.09 });
  };

  Mob.prototype.update = function (dt, g) {
    const p = g.player;
    const w = g.world;
    this.anim += dt * 6;
    this.stateT += dt;
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.cool -= dt;
    this.touchCool = Math.max(0, this.touchCool - dt);
    const toP = U.dist(this.x, this.y, p.x, p.y);
    const kind = this.def.kind;
    const sees = toP < 190 && !p.dead && lineClear(w, this.x, this.y, p.x, p.y);

    // magma wyrms lurk under the lava until you come close
    if (this.def.fire) {
      const inLava = w.matAt(this.x, this.y + this.h / 2 + 2) === D.M.lava || w.matAt(this.x, this.y) === D.M.lava;
      this.submerged = inLava && (toP > 110 || !sees);
      if (U.chance(dt * 8)) FX.spawn({ x: this.x + U.rand(-8, 8), y: this.y, vx: U.rand(-8, 8), vy: U.rand(-40, -15), life: 0.6, size: 1.5, color: '#ffb03d', grav: -0.2, glow: 1 });
    }

    if (kind === 'crawl' || kind === 'charge') {
      this.vy += w.gravityAt(this.y) * 2.4 * dt;
      // wind-up: the tell before a charge, so it can be dodged
      if (kind === 'charge' && sees && this.state === 'idle' && this.cool <= 0 && !this.submerged) {
        this.state = 'wind'; this.stateT = 0; this.wind = this.def.tele || 0.4;
        this.facing = Math.sign(p.x - this.x) || 1;
        this.vx = 0;
        A.tone(140, { type: 'square', to: 90, dur: 0.25, vol: 0.09 });
      }
      if (this.state === 'wind') {
        this.wind -= dt;
        this.vx *= 0.8;
        if (this.wind <= 0) {
          this.state = 'dash'; this.stateT = 0; this.cool = U.rand(1.7, 2.8);
          this.facing = Math.sign(p.x - this.x) || this.facing;
          this.vy = -70;
          A.sfx.tone(180, { type: 'square', to: 420, dur: 0.18, vol: 0.1 });
          FX.ring(this.x, this.y, 2, 18, 0.25, '#ffffff', 2);
        }
      } else if (this.state === 'dash') {
        this.vx = this.facing * this.def.speed * 3.4;
        if (this.def.fire && U.chance(dt * 30)) FX.trail(this.x, this.y + 4, '#ff7a2a', 2);
        if (this.stateT > 0.55) this.state = 'idle';
      } else if (sees) {
        this.facing = Math.sign(p.x - this.x) || this.facing;
        this.vx = this.facing * this.def.speed;
        if (p.y < this.y - 12 && U.chance(dt * 1.4)) this.vy = -110;
      } else {
        this.vx = this.facing * this.def.speed * 0.45;
      }
      const hit = moveBody(this, w, dt);
      if (hit.x) this.facing = -this.facing;
      if (hit.ground) this.vy = 0;
      // shuffle up small ledges
      if (hit.x && !w.rectSolid(this.x - this.w / 2, this.y - this.h / 2 - TILE, this.w, this.h)) this.vy = -95;
    } else if (kind === 'float') {
      const targetX = sees ? p.x : this.x + Math.cos(this.bob + this.anim * 0.3) * 40;
      const targetY = sees ? p.y : this.y + Math.sin(this.bob + this.anim * 0.4) * 30;
      this.vx = U.damp(this.vx, Math.sign(targetX - this.x) * this.def.speed * (sees ? 2.2 : 1), 0.05, dt);
      this.vy = U.damp(this.vy, Math.sign(targetY - this.y) * this.def.speed * (sees ? 2.2 : 1), 0.05, dt);
      const hit = moveBody(this, w, dt);
      if (hit.x) this.vx *= -1;
      if (hit.y) this.vy *= -1;
      if (U.chance(dt * 5)) FX.trail(this.x, this.y + this.h / 2, '#8f6ad8', 1.6);
    } else if (kind === 'swarm') {
      // mites orbit and dart; annoying rather than deadly, and they come in clouds
      const a = this.bob + this.anim * 0.9;
      const tx = (sees ? p.x : this.x) + Math.cos(a) * 26, ty = (sees ? p.y : this.y) + Math.sin(a * 1.3) * 18;
      this.vx = U.damp(this.vx, U.clamp((tx - this.x) * 4, -this.def.speed * 2, this.def.speed * 2), 0.12, dt);
      this.vy = U.damp(this.vy, U.clamp((ty - this.y) * 4, -this.def.speed * 2, this.def.speed * 2), 0.12, dt);
      const hit = moveBody(this, w, dt);
      if (hit.x) this.vx *= -1;
      if (hit.y) this.vy *= -1;
      this.facing = this.vx < 0 ? -1 : 1;
    } else if (kind === 'spit') {
      this.vy += w.gravityAt(this.y) * 1.6 * dt;
      if (sees) {
        this.facing = Math.sign(p.x - this.x) || this.facing;
        this.vx = U.damp(this.vx, Math.sign(p.x - this.x) * this.def.speed * 0.6, 0.04, dt);
        if (this.cool <= 0 && this.state !== 'wind') {
          this.state = 'wind'; this.wind = this.def.tele || 0.4;
        }
        if (this.state === 'wind') {
          this.wind -= dt;
          if (U.chance(dt * 14)) FX.trail(this.x + this.facing * 9, this.y - 1, '#b6ff8a', 1.5);
          if (this.wind <= 0) {
            this.state = 'idle';
            this.shoot(g, 0);
            if (this.type === 'lurker') { this.shoot(g, 0.28); this.shoot(g, -0.28); }
            this.cool = this.type === 'lurker' ? 1.5 : 2.1;
          }
        }
      } else { this.vx *= 0.9; this.state = 'idle'; }
      moveBody(this, w, dt);
    } else if (kind === 'boss') {
      // hovers around the core chamber and punishes anyone who gets close
      const c = w.coreCenter;
      const orbit = this.stateT * 0.7 + this.bob;
      const tx = c.x + Math.cos(orbit) * (w.chamberR * 0.6);
      const ty = c.y + Math.sin(orbit) * (w.chamberR * 0.45);
      const goX = sees && toP < 150 ? p.x : tx;
      const goY = sees && toP < 150 ? p.y : ty;
      this.vx = U.damp(this.vx, U.clamp((goX - this.x) * 2.2, -90, 90), 0.06, dt);
      this.vy = U.damp(this.vy, U.clamp((goY - this.y) * 2.2, -90, 90), 0.06, dt);
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.facing = this.vx < 0 ? -1 : 1;
      if (this.cool <= 0 && sees && this.state !== 'wind') { this.state = 'wind'; this.wind = this.def.tele || 0.6; }
      if (this.state === 'wind') {
        this.wind -= dt;
        if (U.chance(dt * 20)) FX.trail(this.x + U.rand(-10, 10), this.y + U.rand(-8, 8), '#ffb03d', 2);
        if (this.wind <= 0) {
          this.state = 'idle';
          for (let i = -2; i <= 2; i++) this.shoot(g, i * 0.24);

    if (!p.dead && this.touchCool <= 0 && !this.submerged &&
        Math.abs(this.x - p.x) < (this.w + p.w) / 2 && Math.abs(this.y - p.y) < (this.h + p.h) / 2) {
      p.hurt(this.dmg, g, Math.sign(p.x - this.x));
      this.touchCool = 0.7;
      this.vx = -Math.sign(p.x - this.x) * 90;
    }
  };

  Mob.prototype.draw = function (ctx, cam) {
    const frame = Math.floor(this.anim) % this.spr.frames.length;
    if (this.submerged) {
      // just a pair of eyes in the magma
      ctx.fillStyle = '#ffe27a';
      ctx.fillRect(this.x - cam.x - 4 | 0, this.y - cam.y - 2 | 0, 2, 2);
      ctx.fillRect(this.x - cam.x + 2 | 0, this.y - cam.y - 2 | 0, 2, 2);
      return;
    }
    const winding = this.state === 'wind';
    const flash = this.hurtT > 0 || (winding && Math.sin(this.wind * 40) > 0);
    // BOUNCY: everything alive squashes and stretches, harder when it winds up
    const puff = winding ? 0.16 : (this.hurtT > 0 ? 0.22 : 0.055);
    const sq = 1 + Math.sin(this.anim * (winding ? 9 : 2.4) + this.bob) * puff;
    ctx.save();
    ctx.translate((this.x - cam.x) | 0, (this.y - cam.y) | 0);
    ctx.scale((this.facing < 0 ? -1 : 1) * sq, 1 / sq);
    drawSprite(ctx, this.spr, frame, 0, 0, false, flash);
    ctx.restore();
    if (winding) {
      PD.font.draw(ctx, '!', this.x - cam.x, this.y - cam.y - this.h / 2 - 14 + Math.sin(this.wind * 30) * 1.5,
        '#ff5a4d', { center: true, scale: 1 });
    }
    if (this.hp < this.maxHp && !this.dead) {
      const w = Math.max(10, this.w);
      const x = (this.x - cam.x - w / 2) | 0, y = (this.y - cam.y - this.h / 2 - 6) | 0;
      ctx.fillStyle = 'rgba(10,6,20,0.7)';
      ctx.fillRect(x, y, w, 3);
      ctx.fillStyle = this.def.kind === 'boss' ? '#ff9b3d' : '#ff5a4d';
      ctx.fillRect(x, y, Math.max(1, (w * this.hp / this.maxHp) | 0), 3);
    }
  };

  /* ------------------------------------------------------------------ pickup */
  function Pickup(x, y, mat, vx, vy) {
    this.x = x; this.y = y;
    this.vx = vx === undefined ? U.rand(-30, 30) : vx;

    if (!dx && !dy) { dx = Math.cos(this.aim); dy = Math.sin(this.aim); }
    const n = Math.hypot(dx, dy) || 1;
    this.vx = dx / n * 330;
    this.vy = dy / n * 330;
    this.dashCool = this.stat('dash');
    this.dashT = 0.26;
    this.invuln = Math.max(this.invuln, 0.3);
    A.sfx.tone(300, { type: 'sawtooth', to: 1200, dur: 0.16, vol: 0.12 });
    A.sfx.noise({ from: 900, to: 3000, dur: 0.14, vol: 0.1 });
    FX.ring(this.x, this.y, 3, 22, 0.3, '#7ef9ff', 2);
    for (let i = 0; i < 8; i++) FX.trail(this.x - dx / n * i * 3, this.y - dy / n * i * 3, '#7ef9ff', 2);
    FX.shake(1.5);
  };

  /* Sonar ping: paints nearby ore on to the minimap. */
  Player.prototype.scan = function (g) {
    if (this.scanCool > 0 || this.docked) { A.sfx.deny(); return; }
    this.scanCool = 4;
    g.scan(this.x, this.y, this.stat('scanner'));
  };

  Player.prototype.onGround = function (w) {
    return w.rectSolid(this.x - this.w / 2, this.y + this.h / 2, this.w, 2);
  };

  /* ------------------------------------------------------------------- drill */
  Player.prototype.drillTip = function () {
    const r = this.stat('reach');
    return { x: this.x + Math.cos(this.aim) * r, y: this.y + Math.sin(this.aim) * r };
  };

  /* The bit has real length, so bite the first solid tile anywhere along it.
     Without this the drill goes dead every time a tile pops and the player
     has to drift the last few pixels to the next one. */
  Player.prototype.findBite = function (w) {
    const reach = this.stat('reach') + PD.world.TILE * 1.2;
    const cos = Math.cos(this.aim), sin = Math.sin(this.aim);
    let lastCx = -1, lastCy = -1;
    for (let d = 5; d <= reach; d += 2.5) {
      const x = this.x + cos * d, y = this.y + sin * d;
      const cx = Math.floor(x / PD.world.TILE), cy = Math.floor(y / PD.world.TILE);
      if (cx === lastCx && cy === lastCy) continue;
      lastCx = cx; lastCy = cy;
      const mat = w.at(cx, cy);
      if (mat) return { cx, cy, mat, x, y, dist: d };
    }
    return null;
  };

  Player.prototype.doDrill = function (dt, g) {
    const IN = PD.input;
    const want = IN.mouse.left && !g.uiBlocking;
    this.drillSpin += dt * (want ? 26 : 4);
    const w = g.world;

    if (!want) {
      this.drilling = false; this.drillT = 0;
      A.drill(false);
      return;
    }

    const bite = this.findBite(w);
    this.drilling = !!bite;
    if (!bite) { this.drillT = 0; A.drill(false); return; }
    // the drill is heavy: it drags him to a crawl and rattles the camera
    this.drillT += dt;
    this.vx *= 1 - Math.min(1, dt * 4);
    this.vy *= 1 - Math.min(1, dt * 2.5);
    if (this.drillT > 0.05) FX.shake(0.7);

    // the spinning bit chews anything standing in it
    for (const m of g.mobs) {
      if (m.dead) continue;
      if (Math.hypot(m.x - bite.x, m.y - bite.y) < 14 + m.w / 2 && U.chance(dt * 6)) m.hurtBy(this.stat('drill') * 0.12, g, Math.sign(m.x - this.x), 'drill');
    }
    const power = this.stat('drill') * dt;
    const hardness = U.clamp(D.MAT[bite.mat].hp / 255, 0, 1);
    this.drillPitch = 1 - hardness;
    A.drill(true, this.drillPitch);

    const broke = w.damage(bite.cx, bite.cy, power);
    if (broke) {
      g.onTileBroken(bite.cx, bite.cy, broke, true);
      // the bite lands in his shoulders: the whole rig kicks back off it
      PD.rig.hit(this.rig, U.clamp(D.MAT[broke].hp / 160, 0.5, 1.4));
    }

    // The bore is always wider than the bit: a one-tile shaft is narrower
    // than the player, so a single-tile tunnel would wedge you in place.
    const px = Math.round(-Math.sin(this.aim)), py = Math.round(Math.cos(this.aim));
    const side = this.g.save.upg.reach >= 5 ? 2 : 1;
    for (let k = 1; k <= side; k++) {
      const falloff = power * (k === 1 ? 0.7 : 0.4);
      const b2 = w.damage(bite.cx + px * k, bite.cy + py * k, falloff);
      if (b2) g.onTileBroken(bite.cx + px * k, bite.cy + py * k, b2, true);
      const b3 = w.damage(bite.cx - px * k, bite.cy - py * k, falloff);
      if (b3) g.onTileBroken(bite.cx - px * k, bite.cy - py * k, b3, true);
    }

    if (U.chance(dt * 55)) FX.sparks(bite.x, bite.y, this.aim, D.MAT[bite.mat], 3);
    FX.shake(0.55);
  };

  /* --------------------------------------------------------------------- gun */
  /* One button. You aim the drill; the gun finds its own targets and fires
     itself at anything in range. Right mouse still fires manually. */
  Player.prototype.doGun = function (dt, g) {
    const IN = PD.input;
    let target = null, best = 118;
    for (const m of g.mobs) {
      if (m.dead || m.submerged) continue;
      const d = Math.hypot(m.x - this.x, m.y - this.y);
      if (d < best) { best = d; target = m; }
    }
    const manual = (IN.mouse.right || IN.down('space')) && !g.uiBlocking;
    const want = manual || (target && !g.uiBlocking && (this.drilling || this.weapon === 'pistol' || true));
    if (!want || this.gunCool > 0) return;
    const a0 = manual || !target ? this.aim : Math.atan2(target.y - this.y, target.x - this.x);
    this.gunAim = a0;
    const ox = Math.cos(a0) * 12, oy = Math.sin(a0) * 12;

    if (this.weapon === 'scatter') {
      this.gunCool = 0.72;
      this.gunFlash = 0.1;
      const dmg = this.stat('scatter');
      for (let i = 0; i < 5; i++) {
        const a = a0 + (i - 2) * 0.13 + U.rand(-0.04, 0.04);
        const sp = 300 + U.rand(-30, 30);
        g.bullets.push(new Bullet(this.x + ox, this.y + oy, Math.cos(a) * sp, Math.sin(a) * sp, dmg, true, '#ffb03d', { life: 0.34 }));
      }
      this.vx -= Math.cos(a0) * 110;
      this.vy -= Math.sin(a0) * 110;
      FX.burst(this.x + ox, this.y + oy, 9, ['#ffb03d', '#ffffff', '#ff7a2a'], 110, true);
      FX.shake(3.2);
      A.sfx.boom(0.35);
      A.sfx.shoot();
    } else if (this.weapon === 'lance') {
      this.gunCool = 1.05;
      this.gunFlash = 0.14;
      const dmg = this.stat('lance');
      g.bullets.push(new PD.ent.Beam(this.x + ox, this.y + oy, a0, 190, dmg, g));
      this.vx -= Math.cos(a0) * 60;
      this.vy -= Math.sin(a0) * 60;

      A.sfx.noise({ from: 6000, to: 400, dur: 0.2, vol: 0.1 });
    } else {

      this.gunFlash = 0.09;
      const dmg = this.stat('pistol');
      const a = a0 + U.rand(-0.035, 0.035);
      g.bullets.push(new Bullet(this.x + ox, this.y + oy, Math.cos(a) * 330, Math.sin(a) * 330, dmg, true));
      this.vx -= Math.cos(a) * 28;
      this.vy -= Math.sin(a) * 28;
      FX.burst(this.x + ox, this.y + oy, 4, ['#7ef9ff', '#ffffff'], 70, true);
      FX.shake(1.1);
      A.sfx.shoot();
    }
  };

  /* --------------------------------------------------------------------- air */
  Player.prototype.doAir = function (dt, g) {
    // the lamp reveals the map as you go
    g.world.reveal(this.x, this.y, this.stat('lamp') * 0.9);

    // magma burns; uranium in the hold cooks you slowly
    const hz = g.world.hazardIn(this.x - this.w / 2, this.y - this.h / 2, this.w, this.h);
    if (hz && !this.docked) {
      this.hull -= hz * dt;
      this.vy -= 90 * dt;
      if (this.burnCool <= 0) {
        this.burnCool = 0.4;
        FX.burst(this.x, this.y + 6, 6, ['#ff7a2a', '#ffd27a'], 60, true);
        A.sfx.tone(200, { type: 'sawtooth', to: 120, dur: 0.12, vol: 0.09 });
        FX.flash(0.15, '#ff5a2a');
        g.hint('lava', 'MAGMA! GET OUT OF IT');
      }
      if (this.hull <= 0) { this.hull = 0; g.onPlayerDown(); return; }
    }
    const uran = this.cargo[D.M.uran] || 0;
    if (uran > 0 && !this.docked) {
      this.hull -= 0.35 * uran * dt;
      if (U.chance(dt * 3)) FX.trail(this.x + U.rand(-5, 5), this.y + U.rand(-6, 6), '#a6ff3d', 1.4);
      g.hint('uran', 'URANIUM IN THE HOLD IS COOKING YOU. SELL IT FAST.');
      if (this.hull <= 0) { this.hull = 0; g.onPlayerDown(); return; }
    }

    if (this.docked) {
      this.o2 = Math.min(this.stat('oxygen'), this.o2 + 90 * dt);
      this.suffocating = 0;
      return;
    }
    const depth = U.clamp(g.world.depthMeters(this.y) / Math.max(20, g.world.maxDepthMeters()), 0, 1);
    let drain = 1.0 + depth * 0.9 + this.loadFactor() * 0.5;
    if (this.drilling) drain += 0.9;
    this.o2 -= drain * dt;

    if (this.o2 <= 0) {
      this.o2 = 0;
      this.suffocating += dt;
      this.hull -= 7 * dt;
      this.alarmT -= dt;
      if (this.alarmT <= 0) { A.sfx.alarm(); this.alarmT = 0.7; }
      FX.flash(0.06, '#3a0d1a');
      if (this.hull <= 0) { this.hull = 0; g.onPlayerDown(); }
    } else if (this.o2 < this.stat('oxygen') * 0.25) {
      this.alarmT -= dt;
      if (this.alarmT <= 0) { A.sfx.alarm(); this.alarmT = 1.4; }
    }
  };

  /* ------------------------------------------------------------------ recall
     Hold R for an emergency tractor-beam yank home; the ship charges for it. */
  Player.prototype.doRecall = function (dt, g) {
    if (PD.input.down('KeyR') && !this.docked) {
      this.recall += dt;
      if (this.recall > 0.06) {
        FX.trail(this.x + U.rand(-10, 10), this.y + U.rand(-12, 12), '#7ef9ff', 2);
      }
      if (this.recall >= 1.4) {
        this.recall = 0;
        g.emergencyRecall();
      }
    } else this.recall = Math.max(0, this.recall - dt * 2.4);
  };

  /* ------------------------------------------------------------------- cargo */
  Player.prototype.addOre = function (mat) {
    const m = D.MAT[mat];
    if (this.cargoKg + m.kg > this.capacity() + 0.0001) return false;
    this.cargo[mat] = (this.cargo[mat] || 0) + 1;
    this.cargoKg += m.kg;
    return true;
  };

  Player.prototype.clearCargo = function () { this.cargo = {}; this.cargoKg = 0; };

  /* ----------------------------------------------------------------- drawing */
  Player.prototype.draw = function (ctx, cam, t) {
    const skin = PD.art.skinFor(this.g.save.cos);
    const B = PD.art.BIZ;
    const moving = Math.hypot(this.vx, this.vy) > 20 || this.thrusting.x || this.thrusting.y;
    const drilling = this.drilling && this.drillT > 0.05;
    const ground = this.onGround(this.g.world);
    if (!this.rig) this.rig = PD.rig.make();
    const r = this.rig;
    // no idle flourishes out here: both hands are on the tool
    PD.rig.step(r, { dt: this.g.dt, vx: this.vx, vy: this.vy, ground, drilling, noEmote: true });
    if (ground && !this.wasGround && this.lastVy > 120) {
      PD.rig.land(r, U.clamp(this.lastVy / 320, 0.4, 1));
      FX.puff(this.x, this.y + 5, 4, '#c9bce8', U.clamp(this.lastVy / 260, 0.6, 1.4));
    }
    this.wasGround = ground;
    this.lastVy = this.vy;

    const drill = skin.drill;
    const gun = PD.art.sprites[this.weapon === 'pistol' ? 'gun' : this.weapon];
    const flip = Math.cos(this.aim) < 0;
    // the drill is heavy: it shakes him, kicks him back, and the camera feels it
    const kick = drilling ? 1.6 : 0;
    const jx = drilling ? Math.round(Math.sin(t * 90) * 1) : 0;
    const jy = drilling ? Math.round(Math.cos(t * 70) * 1) : 0;
    const px = this.x - cam.x - Math.cos(this.aim) * kick + jx, py = this.y - cam.y - Math.sin(this.aim) * kick * 0.5 + jy;

    // the body he is wearing this frame: bare torso, and the limbs live
    const spr = drilling ? skin.alienCoreDrill : skin.alienCore;
    this.anim += 1 / 60 * (moving ? 8 : 3);
    let frame;
    if (drilling) frame = this.hurtT > 0 ? 3 : Math.floor(t * 30) % 3;
    else frame = PD.rig.faceOf(r, t, this.blink < 0);

    // where the tool sits in his hands
    const hx = px + Math.cos(this.aim) * (drilling ? 11 : 8), hy = py + Math.sin(this.aim) * (drilling ? 11 : 8) + 1;
    // squash and stretch off the vertical: falling stretches him, landing squashes
    const airsq = ground ? 1 : U.clamp(1 + this.vy * 0.0007, 0.86, 1.13);
    const drawTool = (c) => {
      c.save();
      c.translate(hx | 0, hy | 0);
      c.rotate(this.aim);
      if (flip) c.scale(1, -1);
      if (drilling) c.translate(U.rand(-1.5, 1.5), U.rand(-1, 1));
      const df = drill.frames[Math.floor(this.drillSpin) % drill.frames.length];
      c.drawImage(df, -drill.ox, -drill.oy, drill.w, drill.h);
      c.restore();
    };
    const limp = this.rag > 0;
    if (limp) r.ragdoll = 1; else r.ragdoll = 0;
    const body = {
      x: px, y: py - 1, flip, spr, frame, drilling: drilling && !limp, twoHand: drilling && !limp,
      grip: limp ? null : { x: hx, y: hy }, aim: this.aim, ground, vx: this.vx, vy: this.vy,
      squash: limp ? 1 : airsq, tint: this.hurtT > 0.15,
      ragdoll: limp, ang: limp ? this.ragAng : 0,
      tool: limp ? null : drawTool
    };

    if (this.dashT > 0) {
      ctx.globalAlpha = 0.3;
      for (let k = 3; k >= 1; k--) {
        const gx = px - this.vx * k * 0.012, gy = py - this.vy * k * 0.012 - 1;
        PD.rig.draw(ctx, r, Object.assign({}, body, { x: gx, y: gy, tint: true }), skin.P, B);
      }
      ctx.globalAlpha = 1;
    } else if (this.invuln > 0 && Math.sin(this.invuln * 40) < -0.2) return;

    // holstered pistol on the far side when the drill is out
    if (!drilling) {
      ctx.save();
      ctx.translate(px | 0, py | 0);
      const ga = this.gunAim === undefined ? this.aim : this.gunAim;
      ctx.rotate(ga + (flip ? Math.PI : 0));
      ctx.scale(1, flip ? -1 : 1);
      const gf = gun.frames[this.gunCool > 0.05 ? 1 : 0];
      ctx.drawImage(gf, -2, -10);
      ctx.restore();
    }

    // the body, the tool in its grip and the hands over it, in one pass
    PD.rig.draw(ctx, r, body, skin.P, B);

    if (drilling) {
      // hot sparks and grit off the bit
      if (U.chance(0.45)) {
        const tx = hx + Math.cos(this.aim) * 24, ty = hy + Math.sin(this.aim) * 24;
        FX.spawn({ x: tx + cam.x, y: ty + cam.y, vx: -Math.cos(this.aim) * U.rand(30, 90) + U.rand(-40, 40), vy: -Math.sin(this.aim) * U.rand(30, 90) + U.rand(-60, 10),
          life: U.rand(0.15, 0.4), size: 1, color: U.chance(0.5) ? '#fff2b0' : '#ff9b3d', grav: 260, drag: 1 });
      }
    }

    if (this.gunFlash > 0) {
      const a = this.gunAim === undefined ? this.aim : this.gunAim;
      ctx.fillStyle = '#eafcff';
      ctx.globalAlpha = this.gunFlash / 0.09;
      const fx = px + Math.cos(a) * 15, fy = py + Math.sin(a) * 15;
      ctx.fillRect(fx - 3, fy - 3, 6, 6);
      ctx.globalAlpha = 1;
    }

    if (this.recall > 0.1) {
      ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 22);
      PD.pxd.ring(ctx, px, py, 8 + (1 - this.recall / 1.4) * 20, '#7ef9ff', 1);
      ctx.globalAlpha = 1;
    }
  };


  PD.Player = Player;
})(window.PD);

    X.rect(ctx, PW - 8, PH - 8, 4, 4, 'rgba(44,30,18,0.86)');
    X.rect(ctx, PW, 0, 1, PH - 8, '#6b4a2e');
    X.rect(ctx, 0, PH, PW - 8, 1, '#6b4a2e');
    X.rect(ctx, PW - 8, PH - 4, 4, 1, '#6b4a2e');
    X.rect(ctx, PW - 4, PH - 8, 1, 4, '#6b4a2e');
    X.rect(ctx, PW - 8, PH - 4, 1, 4, '#6b4a2e');
    X.rect(ctx, PW - 4, PH - 8, 4, 1, '#6b4a2e');
    // the grain of the cardboard, and the fibres coming off the cut edge
    for (let gy = 2; gy < PH - 10; gy += 3) {
      if (U.hash2(gy, 5) > 0.55) X.rect(ctx, 2, gy, PW - 6, 1, 'rgba(88,60,34,0.35)');
    }
    for (let gx = 4; gx < PW - 10; gx += 2) {
      if (U.hash2(gx, 9) > 0.7) X.rect(ctx, gx, PH - 9, 2, 1 + ((U.hash2(gx, 11) * 3) | 0), 'rgba(120,84,48,0.5)');
    }
    // masking tape, applied by someone with three fingers
    X.rect(ctx, PW - 22, -3, 22, 9, 'rgba(226,208,132,0.8)');
    X.rect(ctx, PW - 22, -3, 22, 1, 'rgba(246,232,168,0.8)');
    for (let i = 0; i < 4; i++) X.rect(ctx, PW - 20 + i * 6, -3, 2, 9, 'rgba(206,188,112,0.5)');
    X.rect(ctx, -4, 30, 8, 16, 'rgba(226,208,132,0.8)');
    X.rect(ctx, -4, 30, 8, 1, 'rgba(246,232,168,0.8)');

    // --- air: a glass tank that empties
    const tx = 5, ty = 4, tw = 14, th = 44;
    const low = o2f < 0.25;
    ctx.fillStyle = '#0d0720'; ctx.fillRect(tx - 1, ty - 1, tw + 2, th + 2);
    ctx.fillStyle = '#161033'; ctx.fillRect(tx, ty, tw, th);
    const fh = Math.round(th * o2f);
    ctx.fillStyle = low ? (Math.sin(t * 14) > 0 ? '#ff6b8a' : '#58e8ff') : '#58e8ff';
    ctx.fillRect(tx, ty + th - fh, tw, fh);
    if (fh > 2) {
      ctx.fillStyle = '#d6fbff';
      ctx.fillRect(tx, ty + th - fh + Math.sin(t * 4) * 1.2, tw, 1);
      for (let i = 0; i < 3; i++) {
        const by = ty + th - ((t * 14 + i * 17) % Math.max(4, fh));
        if (by > ty + th - fh) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(tx + 3 + i * 4, by, 1, 1); }
      }
    }
    ctx.strokeStyle = '#7ef9ff'; ctx.strokeRect(tx + 0.5, ty + 0.5, tw - 1, th - 1);
    ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(tx + 2, ty + 2, 3, th - 4);
    for (let i = 1; i < 4; i++) { ctx.fillStyle = '#0d0720'; ctx.fillRect(tx, ty + (th / 4) * i, 4, 1); }
    F.draw(ctx, 'AIR', tx + tw / 2, ty + th + 4, low ? '#ff6b8a' : '#e2d084', { center: true, shadow: '#2c1c10' });

    const CX = 26;                                  // right-hand column
    F.draw(ctx, String(Math.ceil(p.o2)), CX, 4, low ? '#ff6b8a' : '#7ef9ff', { scale: 2, shadow: false });
    F.draw(ctx, 'BREATHS', CX + 42, 10, '#a8845e', { shadow: false });

    // --- hull: hex chips that shatter
    const cf = U.clamp(p.hull / maxHull, 0, 1);
    F.draw(ctx, 'ME', CX, 24, '#e2d084', { shadow: false });
    for (let i = 0; i < 6; i++) {
      const x = CX + 34 + i * 15, y = 27;
      const f = U.clamp(cf * 6 - i, 0, 1);
      hexChip(ctx, x, y, 6.5, '#2c1c10', '#6b4a2e');
      if (f > 0) {
        ctx.save();
        ctx.beginPath(); ctx.rect(x - 7, y + 7 - 14 * f, 14, 14 * f); ctx.clip();
        hexChip(ctx, x, y, 6.5, f < 0.35 ? '#ff8a3d' : '#ff5a4d', null);
        ctx.restore();
        hexChip(ctx, x, y, 6.5, null, '#ffb0a0');
      } else {
        X.line(ctx, x - 4, y - 3, x + 3, y + 4, '#6b4a2e', 1);
      }
    }

    // --- hold: a filling tube
    const hx = CX + 28, hy = 42, hw = 66, hh = 9;
    const load = U.clamp(p.cargoKg / cap, 0, 1);
    F.draw(ctx, 'SACK', CX, 43, '#e2d084', { shadow: false });
    ctx.fillStyle = '#1a1108'; ctx.fillRect(hx - 1, hy - 1, hw + 2, hh + 2);
    ctx.fillStyle = '#33240f'; ctx.fillRect(hx, hy, hw, hh);
    const segs = 10, sw = hw / segs;
    for (let i = 0; i < segs; i++) {
      const f = U.clamp(load * segs - i, 0, 1);
      if (f <= 0) continue;
      ctx.fillStyle = p.cargoFull() ? (Math.sin(t * 12) > 0 ? '#ff6b8a' : '#ffb03d') : '#ffb03d';
      ctx.fillRect(hx + i * sw + 1, hy + 1, Math.max(1, (sw - 2) * f), hh - 2);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(hx + i * sw + 1, hy + 1, Math.max(1, (sw - 2) * f), 1);
    }
    F.draw(ctx, Math.round(p.cargoKg) + '/' + Math.round(cap), hx + hw + 4, hy + 2, p.cargoFull() ? '#ff6b8a' : '#ffb03d', { shadow: false });

    // --- manifest: top three ores, then the load's worth
    const entries = Object.keys(p.cargo).sort((a, b) => D.MAT[b].cr - D.MAT[a].cr).slice(0, 3);
    let my = PH + 6;
    for (const k of entries) {
      const m = D.MAT[k];
      X.rect(ctx, 0, my - 2, 106, 13, 'rgba(44,30,18,0.72)');
      PD.art.oreChip(ctx, +k, 2, my - 3, 14);
      F.draw(ctx, m.name.toUpperCase().slice(0, 10), 18, my + 1, COL.text, { shadow: false });
      F.draw(ctx, String(p.cargo[k]), 102, my + 1, COL.gold, { right: true, shadow: false });
      my += 13;
    }
    if (p.cargoValue() > 0) {
      X.rect(ctx, 0, my - 1, 106, 16, 'rgba(44,30,18,0.72)');
      Gd().draw(ctx, 'coin', 3, my, COL.gold, '#b8860b');
      F.draw(ctx, U.fmt(p.cargoValue()), 19, my + 1, COL.gold, { scale: 2, shadow: false });
    }

    // top right: credits + galaxy
    X.rect(ctx, VW - 130, 0, 130, 26, 'rgba(44,30,18,0.86)');
    X.rect(ctx, VW - 122, 26, 122, 8, 'rgba(44,30,18,0.86)');
    X.rect(ctx, VW - 126, 26, 4, 4, 'rgba(44,30,18,0.86)');
    X.rect(ctx, VW - 130, 0, 1, 26, '#6b4a2e');
    X.rect(ctx, VW - 122, 30, 122, 1, '#6b4a2e');
    X.rect(ctx, VW - 130, -3, 18, 8, 'rgba(226,208,132,0.8)');
    F.draw(ctx, '$' + U.fmt(g.save.credits), VW - 8, 4, COL.gold, { right: true, scale: 2 });
    F.draw(ctx, 'GALAXY ATE ' + g.save.dominion.toFixed(1) + '%', VW - 8, 22, '#d8b48a', { right: true });
    // and what the brain in the jar is owed, ticking up as you break rock
    X.rect(ctx, VW - 78, 34, 78, 13, 'rgba(20,42,32,0.86)');
    X.rect(ctx, VW - 78, 34, 78, 1, '#2fbf7a');
    X.rect(ctx, VW - 78, 46, 78, 1, '#0e3a2c');
    Gd().draw(ctx, 'star', VW - 76, 34, '#4cff9a', '#1e9e5c');
    F.draw(ctx, U.fmt(g.save.thots) + ' THOTS', VW - 6, 37, '#8affd0', { right: true, shadow: false });
  }
  const meters = vitals;

    const pip = (x, glyph, frac, col) => {

    pip(52, 'scan', 1 - p.scanCool / 4, COL.good);
    // the wire is the one that matters, so it gets a real bar
    const tf = U.clamp(p.tetherFrac || 0, 0, 1);
    const tcol = tf > 0.9 ? '#ff5a4d' : (tf > 0.7 ? COL.gold : COL.o2);
    Gd().draw(ctx, 'belt', 74, sy - 2, tcol, '#2a1c4a');

      Gd().draw(ctx, 'hole', VW / 2 - 48, VH - 40, COL.o2, '#2b9fc4');

    if (g.combo.n >= 3) {
      F.draw(ctx, 'x' + g.combo.mult.toFixed(1), VW / 2, 34, '#ff8ad8', { center: true, scale: 2 });
      Gd().stat(ctx, 'skull', g.combo.n, VW / 2 - 16, 52, '#ff8ad8', '#8a2a56', COL.text);
      bar(ctx, VW / 2 - 30, 68, 60, 3, g.combo.t / 2.6, '#ff8ad8', {});
    }

    minimap(ctx, g);

    // crossing into a new band: just its name, fading, no box
    if (g.banner) {
      const a = U.clamp(Math.min(g.banner.t * 2, (3.2 - g.banner.t) * 2), 0, 1);
      ctx.globalAlpha = a;

  /* ---------------------------------------------------------------- minimap
     Fog of war: only what the lamp has touched is drawn. Scanner pings paint
     ore you have not reached yet. */
  let mmCv = null, mmCtx = null, mmDirty = 0;
  function minimap(ctx, g) {
    const w = g.world;
    const MW = 92, MH = 92;
    // the touch keys own the right edge, so the map slides over for them
    const x0 = VW - MW - (PD.touch && PD.touch.enabled ? 56 : 8), y0 = 58;
    const sc = Math.min(MW / w.w, MH / w.h);
    const ox = x0 + (MW - w.w * sc) / 2, oy = y0 + (MH - w.h * sc) / 2;

    if (!mmCv) { mmCv = document.createElement('canvas'); mmCtx = mmCv.getContext('2d'); }
    if (mmCv.width !== w.w || mmCv.height !== w.h) { mmCv.width = w.w; mmCv.height = w.h; mmDirty = 0; }
    // rebuild the fog texture a few times a second, not every frame
    mmDirty -= 1;
    if (mmDirty <= 0) {
      mmDirty = 8;
      const img = mmCtx.createImageData(w.w, w.h);
      for (let i = 0; i < w.cells.length; i++) {
        if (!w.seen[i]) continue;
        const m = w.cells[i];
        const k = i * 4;
        if (!m) { if (w.inside[i]) { img.data[k] = 24; img.data[k + 1] = 18; img.data[k + 2] = 40; img.data[k + 3] = 255; } continue; }
        const c = D.MAT[m].c[1];
        img.data[k] = parseInt(c.slice(1, 3), 16); img.data[k + 1] = parseInt(c.slice(3, 5), 16); img.data[k + 2] = parseInt(c.slice(5, 7), 16);
        img.data[k + 3] = 255;
      }
      mmCtx.putImageData(img, 0, 0);
    }

    // the map is a scrap of paper he tapes to the inside of the glass
    ctx.fillStyle = 'rgba(44,30,18,0.86)';
    ctx.fillRect(x0 - 4, y0 - 4, MW + 8, MH + 8);
    ctx.strokeStyle = '#6b4a2e'; ctx.strokeRect(x0 - 3.5, y0 - 3.5, MW + 7, MH + 7);
    X.rect(ctx, x0 - 8, y0 - 7, 18, 7, 'rgba(226,208,132,0.8)');
    X.rect(ctx, x0 + MW - 10, y0 + MH, 18, 7, 'rgba(226,208,132,0.8)');
    // the caption clears the strip of tape at the bottom corner; at y0+MH+6 the
    // tape sat straight across the middle of the word
    F.draw(ctx, 'WHERE I DUG', x0 + MW / 2, y0 + MH + 10, '#a8845e', { center: true, shadow: false });
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(mmCv, 0, 0, w.w, w.h, ox, oy, w.w * sc, w.h * sc);

    // scanner pings
    for (const pg of g.pings) {
      ctx.globalAlpha = U.clamp(pg.life / 3, 0, 1) * (0.6 + 0.4 * Math.sin(g.time * 6 + pg.cx));
      ctx.fillStyle = D.MAT[pg.mat].c[0];
      ctx.fillRect(ox + pg.cx * sc - 1, oy + pg.cy * sc - 1, Math.max(2, sc * 2), Math.max(2, sc * 2));
    }
    ctx.globalAlpha = 1;
    // core, ship, you
    if (w.coreHp > 0) { ctx.fillStyle = '#ff8a3d'; ctx.fillRect(ox + w.cx * sc - 1, oy + w.cy * sc - 1, 3, 3); }
    ctx.fillStyle = '#7ef9ff'; ctx.fillRect(ox + g.ship.x / 10 * sc - 2, oy + g.ship.y / 10 * sc - 1, 4, 2);
    const px = ox + g.player.x / 10 * sc, py = oy + g.player.y / 10 * sc;
    ctx.fillStyle = Math.sin(g.time * 10) > 0 ? '#ffffff' : '#ff5fa8';
    ctx.fillRect(px - 1, py - 1, 3, 3);
