    this.def = def;
    this.spr = PD.art.sprites[SPRITE_FOR[type]];
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.w = def.w; this.h = def.h;
    this.maxHp = Math.round(def.hp * (scale || 1));
    this.hp = this.maxHp;
    this.dmg = def.dmg * (0.7 + (scale || 1) * 0.3);
    this.facing = U.chance(0.5) ? -1 : 1;
    this.hurtT = 0;
    this.cool = U.rand(0.4, 2.2);
    this.dead = false;
    this.anim = U.rand(0, 4);
    this.state = 'idle';
    this.stateT = 0;
    this.touchCool = 0;
    this.bob = U.rand(0, U.TAU);
    this.wind = 0;                 // telegraph timer before an attack
    this.submerged = false;        // wyrms hide in magma
  }

  Mob.prototype.hurtBy = function (dmg, g, dir, src) {
    if (this.submerged) { FX.text(this.x, this.y - 12, 'SUBMERGED', '#ff8a3d', 0); return; }
    // carapace: shots glance off, the drill and beams do not
    if (this.def.armor && src === 'bullet') {
      dmg *= 1 - this.def.armor;
      FX.sparks(this.x, this.y - 4, U.rand(0, U.TAU), D.MAT[2], 4);
      A.tone(1800, { type: 'square', to: 900, dur: 0.05, vol: 0.06 });
    }
    this.hp -= dmg;
    this.hurtT = 0.14;
    this.vx += (dir || 0) * 60;
    FX.text(this.x, this.y - this.h / 2 - 4, String(Math.round(dmg)), '#fff3a0', 0);
    FX.burst(this.x, this.y, 5, ['#ffffff', '#ffd0e0', this.def.kind === 'boss' ? '#ffb060' : '#c8ff8a'], 90);
    FX.shake(1.6);
    if (this.hp <= 0) {
      this.dead = true;
      g.onMobKilled(this);
    } else {
      PD.audio.sfx.hitMob();
    }
  };

  Mob.prototype.shoot = function (g, spread) {
    const p = g.player;
    const a = Math.atan2(p.y - this.y, p.x - this.x) + (spread || 0);
    const sp = 105;
    g.bullets.push(new Bullet(this.x + Math.cos(a) * 8, this.y + Math.sin(a) * 8,
      Math.cos(a) * sp, Math.sin(a) * sp, this.dmg, false, '#b6ff8a'));
    PD.audio.sfx.tone(320, { type: 'sawtooth', to: 140, dur: 0.14, vol: 0.09 });
  };

  Mob.prototype.update = function (dt, g) {
    const p = g.player;
    const w = g.world;
    this.anim += dt * 6;
    this.stateT += dt;
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.cool -= dt;
    this.touchCool = Math.max(0, this.touchCool - dt);
    const toP = U.dist(this.x, this.y, p.x, p.y);
    const kind = this.def.kind;
    const sees = toP < 190 && !p.dead && lineClear(w, this.x, this.y, p.x, p.y);

    // magma wyrms lurk under the lava until you come close
    if (this.def.fire) {
      const inLava = w.matAt(this.x, this.y + this.h / 2 + 2) === D.M.lava || w.matAt(this.x, this.y) === D.M.lava;
      this.submerged = inLava && (toP > 110 || !sees);
      if (U.chance(dt * 8)) FX.spawn({ x: this.x + U.rand(-8, 8), y: this.y, vx: U.rand(-8, 8), vy: U.rand(-40, -15), life: 0.6, size: 1.5, color: '#ffb03d', grav: -0.2, glow: 1 });
    }

    if (kind === 'crawl' || kind === 'charge') {
      this.vy += w.gravityAt(this.y) * 2.4 * dt;
      // wind-up: the tell before a charge, so it can be dodged
      if (kind === 'charge' && sees && this.state === 'idle' && this.cool <= 0 && !this.submerged) {
        this.state = 'wind'; this.stateT = 0; this.wind = this.def.tele || 0.4;
        this.facing = Math.sign(p.x - this.x) || 1;
        this.vx = 0;
        A.tone(140, { type: 'square', to: 90, dur: 0.25, vol: 0.09 });
      }
      if (this.state === 'wind') {
        this.wind -= dt;
        this.vx *= 0.8;
        if (this.wind <= 0) {
          this.state = 'dash'; this.stateT = 0; this.cool = U.rand(1.7, 2.8);
          this.facing = Math.sign(p.x - this.x) || this.facing;
          this.vy = -70;
          A.sfx.tone(180, { type: 'square', to: 420, dur: 0.18, vol: 0.1 });
          FX.ring(this.x, this.y, 2, 18, 0.25, '#ffffff', 2);
        }
      } else if (this.state === 'dash') {
        this.vx = this.facing * this.def.speed * 3.4;
        if (this.def.fire && U.chance(dt * 30)) FX.trail(this.x, this.y + 4, '#ff7a2a', 2);
        if (this.stateT > 0.55) this.state = 'idle';
      } else if (sees) {
        this.facing = Math.sign(p.x - this.x) || this.facing;
        this.vx = this.facing * this.def.speed;
        if (p.y < this.y - 12 && U.chance(dt * 1.4)) this.vy = -110;
      } else {
        this.vx = this.facing * this.def.speed * 0.45;
      }
      const hit = moveBody(this, w, dt);
      if (hit.x) this.facing = -this.facing;
      if (hit.ground) this.vy = 0;
      // shuffle up small ledges
      if (hit.x && !w.rectSolid(this.x - this.w / 2, this.y - this.h / 2 - TILE, this.w, this.h)) this.vy = -95;
    } else if (kind === 'float') {
      const targetX = sees ? p.x : this.x + Math.cos(this.bob + this.anim * 0.3) * 40;
      const targetY = sees ? p.y : this.y + Math.sin(this.bob + this.anim * 0.4) * 30;
      this.vx = U.damp(this.vx, Math.sign(targetX - this.x) * this.def.speed * (sees ? 2.2 : 1), 0.05, dt);
      this.vy = U.damp(this.vy, Math.sign(targetY - this.y) * this.def.speed * (sees ? 2.2 : 1), 0.05, dt);
      const hit = moveBody(this, w, dt);
      if (hit.x) this.vx *= -1;
      if (hit.y) this.vy *= -1;
      if (U.chance(dt * 5)) FX.trail(this.x, this.y + this.h / 2, '#8f6ad8', 1.6);
    } else if (kind === 'swarm') {
      // mites orbit and dart; annoying rather than deadly, and they come in clouds
      const a = this.bob + this.anim * 0.9;
      const tx = (sees ? p.x : this.x) + Math.cos(a) * 26, ty = (sees ? p.y : this.y) + Math.sin(a * 1.3) * 18;
      this.vx = U.damp(this.vx, U.clamp((tx - this.x) * 4, -this.def.speed * 2, this.def.speed * 2), 0.12, dt);
      this.vy = U.damp(this.vy, U.clamp((ty - this.y) * 4, -this.def.speed * 2, this.def.speed * 2), 0.12, dt);
      const hit = moveBody(this, w, dt);
      if (hit.x) this.vx *= -1;
      if (hit.y) this.vy *= -1;
      this.facing = this.vx < 0 ? -1 : 1;
    } else if (kind === 'spit') {
      this.vy += w.gravityAt(this.y) * 1.6 * dt;
      if (sees) {
        this.facing = Math.sign(p.x - this.x) || this.facing;
        this.vx = U.damp(this.vx, Math.sign(p.x - this.x) * this.def.speed * 0.6, 0.04, dt);
        if (this.cool <= 0 && this.state !== 'wind') {
          this.state = 'wind'; this.wind = this.def.tele || 0.4;
        }
        if (this.state === 'wind') {
          this.wind -= dt;
          if (U.chance(dt * 14)) FX.trail(this.x + this.facing * 9, this.y - 1, '#b6ff8a', 1.5);
          if (this.wind <= 0) {
            this.state = 'idle';
            this.shoot(g, 0);
            if (this.type === 'lurker') { this.shoot(g, 0.28); this.shoot(g, -0.28); }
            this.cool = this.type === 'lurker' ? 1.5 : 2.1;
          }
        }
      } else { this.vx *= 0.9; this.state = 'idle'; }
      moveBody(this, w, dt);
    } else if (kind === 'boss') {
      // hovers around the core chamber and punishes anyone who gets close
      const c = w.coreCenter;
      const orbit = this.stateT * 0.7 + this.bob;
      const tx = c.x + Math.cos(orbit) * (w.chamberR * 0.6);
      const ty = c.y + Math.sin(orbit) * (w.chamberR * 0.45);
      const goX = sees && toP < 150 ? p.x : tx;
      const goY = sees && toP < 150 ? p.y : ty;
      this.vx = U.damp(this.vx, U.clamp((goX - this.x) * 2.2, -90, 90), 0.06, dt);
      this.vy = U.damp(this.vy, U.clamp((goY - this.y) * 2.2, -90, 90), 0.06, dt);
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.facing = this.vx < 0 ? -1 : 1;
      if (this.cool <= 0 && sees && this.state !== 'wind') { this.state = 'wind'; this.wind = this.def.tele || 0.6; }
      if (this.state === 'wind') {
        this.wind -= dt;
        if (U.chance(dt * 20)) FX.trail(this.x + U.rand(-10, 10), this.y + U.rand(-8, 8), '#ffb03d', 2);
        if (this.wind <= 0) {
          this.state = 'idle';
          for (let i = -2; i <= 2; i++) this.shoot(g, i * 0.24);
          this.cool = 2.2;
          FX.shake(3);
        }
      }
    }

    // contact damage
    if (!p.dead && this.touchCool <= 0 && !this.submerged &&
        Math.abs(this.x - p.x) < (this.w + p.w) / 2 && Math.abs(this.y - p.y) < (this.h + p.h) / 2) {
      p.hurt(this.dmg, g, Math.sign(p.x - this.x));
      this.touchCool = 0.7;
      this.vx = -Math.sign(p.x - this.x) * 90;
    }
  };

  Mob.prototype.draw = function (ctx, cam) {
    const frame = Math.floor(this.anim) % this.spr.frames.length;
    if (this.submerged) {
      // just a pair of eyes in the magma
      ctx.fillStyle = '#ffe27a';
      ctx.fillRect(this.x - cam.x - 4 | 0, this.y - cam.y - 2 | 0, 2, 2);
      ctx.fillRect(this.x - cam.x + 2 | 0, this.y - cam.y - 2 | 0, 2, 2);
      return;
    }
    const winding = this.state === 'wind';
    const flash = this.hurtT > 0 || (winding && Math.sin(this.wind * 40) > 0);
    drawSprite(ctx, this.spr, frame, this.x - cam.x, this.y - cam.y, this.facing < 0, flash);
    if (winding) {
      PD.font.draw(ctx, '!', this.x - cam.x, this.y - cam.y - this.h / 2 - 14 + Math.sin(this.wind * 30) * 1.5,
        '#ff5a4d', { center: true, scale: 1 });
    }
    if (this.hp < this.maxHp && !this.dead) {
      const w = Math.max(10, this.w);
      const x = (this.x - cam.x - w / 2) | 0, y = (this.y - cam.y - this.h / 2 - 6) | 0;
      ctx.fillStyle = 'rgba(10,6,20,0.7)';
      ctx.fillRect(x, y, w, 3);
      ctx.fillStyle = this.def.kind === 'boss' ? '#ff9b3d' : '#ff5a4d';
      ctx.fillRect(x, y, Math.max(1, (w * this.hp / this.maxHp) | 0), 3);
    }
  };

  /* ------------------------------------------------------------------ pickup */
  function Pickup(x, y, mat, vx, vy) {
    this.x = x; this.y = y;
    this.vx = vx === undefined ? U.rand(-30, 30) : vx;
    this.vy = vy === undefined ? U.rand(-70, -20) : vy;
    this.mat = mat;
    this.spr = PD.art.gemFor(mat);
    this.life = 26;
    this.dead = false;
    this.bob = U.rand(0, U.TAU);
    this.w = 6; this.h = 6;
    this.rest = 0;
  }
  Pickup.prototype.update = function (dt, g) {
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    const p = g.player;
    const d = U.dist(this.x, this.y, p.x, p.y);
    const pull = p.stat('magnet');

    if (d < pull && !p.cargoFull()) {
      const a = Math.atan2(p.y - this.y, p.x - this.x);
      const force = 900 * (1 - d / pull) + 160;
      this.vx = U.damp(this.vx, Math.cos(a) * force, 0.22, dt);
      this.vy = U.damp(this.vy, Math.sin(a) * force, 0.22, dt);
      this.rest = 0;
      if (U.chance(dt * 10)) FX.trail(this.x, this.y, D.MAT[this.mat].c[0], 1.3);
    } else {
      this.vy += g.world.gravityAt(this.y) * 1.1 * dt;
      this.vx *= Math.pow(0.96, dt * 60);
    }

    if (d < 9) {
      if (g.collect(this.mat, this.x, this.y)) { this.dead = true; return; }
    }

    const hit = moveBody(this, g.world, dt);
    if (hit.ground) { this.vx *= 0.6; this.rest += dt; }
    if (hit.x) this.vx *= -0.4;
  };
  Pickup.prototype.draw = function (ctx, cam, t) {
    const y = this.y - cam.y + Math.sin(t * 3 + this.bob) * 1.4;
    if (this.life < 4) {
      ctx.globalAlpha = (Math.sin(this.life * 14) > 0) ? 0.35 : 1;
    }
    drawSprite(ctx, this.spr, 0, this.x - cam.x, y, false, false);
    ctx.globalAlpha = 1;
  };

  /* ----------------------------------------------------------------- boulder
     A dislodged block that falls and hurts. Cheap, readable cave-ins. */
  function Boulder(x, y, mat, cv) {
    this.x = x; this.y = y;
    this.vx = U.rand(-14, 14); this.vy = 10;
    this.mat = mat;
    this.cv = cv;
    this.w = cv ? cv.width * 0.7 : 8;
    this.h = cv ? cv.height * 0.7 : 8;
    this.rot = 0; this.spin = U.rand(-2, 2);
    this.dead = false;
    this.hitCool = 0;
    this.age = 0;
  }
  Boulder.prototype.update = function (dt, g) {
    this.age += dt;
    this.vy += Math.max(60, g.world.gravityAt(this.y)) * 2.2 * dt;
    this.rot += this.spin * dt;
    const p = g.player;
    if (this.vy > 60 && Math.abs(this.x - p.x) < (this.w + p.w) / 2 && Math.abs(this.y - p.y) < (this.h + p.h) / 2) {
      p.hurt(6 + this.vy * 0.05, g, Math.sign(p.x - this.x));
      this.smash(g);
      return;
    }
    for (const m of g.mobs) {
      if (m.dead) continue;
      if (this.vy > 100 && Math.abs(this.x - m.x) < (this.w + m.w) / 2 && Math.abs(this.y - m.y) < (this.h + m.h) / 2) {
        m.hurtBy(this.vy * 0.12, g, 0);
        this.smash(g);
        return;
      }
    }
    const hit = moveBody(this, g.world, dt);
    if (hit.ground || this.age > 7) this.smash(g);
    else if (hit.x) this.vx *= -0.3;
  };
  Boulder.prototype.smash = function (g) {
    this.dead = true;
    const m = D.MAT[this.mat];
    FX.dust(this.x, this.y, 8, m.c[2], 60);
    FX.shake(2);
    PD.audio.sfx.break_(0.4);
    if (U.chance(0.7)) g.pickups.push(new Pickup(this.x, this.y, this.mat));
  };
  Boulder.prototype.draw = function (ctx, cam) {
    if (!this.cv) return;
    ctx.save();
    ctx.translate(this.x - cam.x | 0, this.y - cam.y | 0);
    ctx.rotate(Math.round(this.rot / (Math.PI / 8)) * (Math.PI / 8));
    ctx.drawImage(this.cv, -this.cv.width / 2 | 0, -this.cv.height / 2 | 0);
    ctx.restore();
  };

  /* ------------------------------------------------------------------- crate
     Precursor supply case: bump it and it bursts into loot. */
  function Crate(x, y, loot) {
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.w = 14; this.h = 11;
    this.loot = loot;            // array of material ids
    this.dead = false; this.opened = false; this.t = 0;
  }
  Crate.prototype.update = function (dt, g) {
    this.t += dt;
    this.vy += g.world.gravityAt(this.y) * 1.5 * dt;
    moveBody(this, g.world, dt);
    const p = g.player;
    if (!this.opened && Math.abs(this.x - p.x) < 14 && Math.abs(this.y - p.y) < 14) {
      this.opened = true;
      this.t = 0;
      A.sfx.fanfare();
      FX.ring(this.x, this.y, 2, 40, 0.5, '#ffd34d', 2);
      FX.burst(this.x, this.y - 4, 24, ['#ffd34d', '#ffffff', '#fff3c0'], 150, true);
      for (const mat of this.loot) g.pickups.push(new Pickup(this.x, this.y - 6, mat, U.rand(-60, 60), U.rand(-140, -60)));
      const bonus = Math.round(200 * (1 + g.bodyIndex * 0.8) * g.valueMult());
      g.save.credits += bonus; g.save.totalEarned += bonus;
      FX.text(this.x, this.y - 16, 'PRECURSOR CACHE  +$' + U.fmt(bonus), '#ffd34d', 1);
      g.toast('PRECURSOR CACHE OPENED', '#ffd34d');
    }
    if (this.opened && this.t > 1.2) this.dead = true;
  };
  Crate.prototype.draw = function (ctx, cam, t) {
    const spr = PD.art.sprites.crate;
    if (!this.opened && Math.sin(t * 4) > 0.6) {
      ctx.globalAlpha = 0.5; ctx.fillStyle = '#ffd34d';
      ctx.fillRect(this.x - cam.x - 9 | 0, this.y - cam.y - 8 | 0, 18, 14);
      ctx.globalAlpha = 1;
    }
    drawSprite(ctx, spr, this.opened ? 1 : 0, this.x - cam.x, this.y - cam.y, false, false);
  };

  PD.ent = { Mob, Bullet, Beam, Pickup, Boulder, Crate, moveBody, lineClear, drawSprite, flashOf };
})(window.PD);

/* ===== src/player.js ===== */
/* The player: one small greedy alien with a drill, a pistol and a finite
   amount of air. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const FX = PD.fx;
  const A = PD.audio;
  const TILE = PD.world.TILE;
  const Bullet = PD.ent.Bullet;

  function Player(g) {
    this.g = g;
    this.w = 9; this.h = 13;
    this.x = 0; this.y = 0;
    this.vx = 0; this.vy = 0;
    this.facing = 1;
    this.aim = 0;
    this.drillSpin = 0;
    this.drilling = false;
    this.drillPitch = 0;
    this.gunCool = 0;
    this.gunFlash = 0;
    this.invuln = 0;
    this.hurtT = 0;
    this.blink = 0;
    this.thrusting = { x: 0, y: 0 };
    this.docked = false;
    this.dead = false;
    this.recall = 0;
    this.o2 = this.stat('oxygen');
    this.hull = this.stat('hull');
    this.cargo = {};
    this.cargoKg = 0;
    this.suffocating = 0;
    this.alarmT = 0;
    this.squish = 0;
    this.tetherT = 0;
    this.weapon = 'pistol';
    this.tetherFrac = 0; this.tetherSnap = 0; this.anim = 0;
    this.dashCool = 0; this.dashT = 0;
    this.lastTap = { key: '', t: -9 };
    this.scanCool = 0;
    this.burnCool = 0;
    this.lastStratum = -2;
  }

  /* Weapons you have actually fabricated. */
  Player.prototype.weapons = function () {
    const list = ['pistol'];
    if (this.g.save.upg.scatter > 0) list.push('scatter');
    if (this.g.save.upg.lance > 0) list.push('lance');
    return list;
  };
  Player.prototype.cycleWeapon = function (dir) {
    const list = this.weapons();
    if (list.length < 2) return;
    let i = list.indexOf(this.weapon);
    i = (i + (dir || 1) + list.length) % list.length;
    this.weapon = list[i];
    A.tone(700, { type: 'square', to: 1100, dur: 0.08, vol: 0.09 });
    FX.text(this.x, this.y - 16, this.weapon.toUpperCase(), '#7ef9ff', 0);
  };

  Player.prototype.stat = function (id) {
    const u = D.UPG[id];
    return u.value(this.g.save.upg[id] || 0);
  };

  Player.prototype.capacity = function () { return this.stat('cargo'); };
  Player.prototype.cargoFull = function () { return this.cargoKg >= this.capacity() - 0.001; };
  Player.prototype.loadFactor = function () { return U.clamp(this.cargoKg / this.capacity(), 0, 1); };

  Player.prototype.cargoValue = function () {
    let v = 0;
    for (const k in this.cargo) v += D.MAT[k].cr * this.cargo[k];
    return Math.round(v * this.g.valueMult());
  };

  Player.prototype.reset = function (x, y) {
    this.x = x; this.y = y;
    this.vx = this.vy = 0;
    this.o2 = this.stat('oxygen');
    this.hull = this.stat('hull');
    this.dead = false;
    this.invuln = 1.2;
    this.suffocating = 0;
  };

  /* ------------------------------------------------------------------ damage */
  Player.prototype.hurt = function (dmg, g, dir) {
    if (this.invuln > 0 || this.dead) return;
    this.hull -= dmg;
    this.invuln = 0.75;
    this.hurtT = 0.3;
    this.vx += (dir || 0) * 130;
    this.vy -= 40;
    FX.shake(5);
    FX.flash(0.35, '#ff5a4d');
    FX.hitStop(0.06);
    FX.burst(this.x, this.y, 10, ['#ff8ab0', '#ffffff', '#ff5a4d'], 130);
    A.sfx.hurt();
    if (this.hull <= 0) { this.hull = 0; g.onPlayerDown(); }
  };

  Player.prototype.heal = function (n) { this.hull = Math.min(this.stat('hull'), this.hull + n); };

  /* ------------------------------------------------------------------ update */
  Player.prototype.update = function (dt, g) {
    const IN = PD.input;
    const w = g.world;
    const frozen = g.cinematic;

    this.blink -= dt;
    if (this.blink < -0.2) this.blink = U.rand(2, 6);
    this.dashCool = Math.max(0, this.dashCool - dt);
    this.dashT = Math.max(0, this.dashT - dt);
    this.scanCool = Math.max(0, this.scanCool - dt);
    this.burnCool = Math.max(0, this.burnCool - dt);
    if (!frozen && !g.uiBlocking) {
      if (IN.hit('KeyQ') || IN.mouse.wheel) this.cycleWeapon(IN.mouse.wheel < 0 ? -1 : 1);
      if (IN.hit('Tab')) this.scan(g);
    }
    this.gunCool = Math.max(0, this.gunCool - dt);
    this.gunFlash = Math.max(0, this.gunFlash - dt);
    this.invuln = Math.max(0, this.invuln - dt);
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.squish = U.damp(this.squish, 0, 0.2, dt);

    // aim always follows the cursor
    const dxm = IN.mouse.wx - this.x, dym = IN.mouse.wy - this.y;
    if (dxm * dxm + dym * dym > 9) this.aim = Math.atan2(dym, dxm);

    let ix = 0, iy = 0;
    if (!frozen) {
      if (IN.down('left')) ix -= 1;
      if (IN.down('right')) ix += 1;
      if (IN.down('up')) iy -= 1;
      if (IN.down('down')) iy += 1;
    }
    if (ix) this.facing = ix;
    else if (Math.abs(dxm) > 6) this.facing = Math.sign(dxm);

    if (!frozen) {
      let wantDash = IN.hit('shift');
      for (const k of ['left', 'right', 'up', 'down']) {
        if (IN.hit(k)) {
          if (this.lastTap.key === k && g.time - this.lastTap.t < 0.26) wantDash = true;
          this.lastTap = { key: k, t: g.time };
        }
      }
      if (wantDash) this.dash(ix, iy, g);
    }

    const load = this.loadFactor();
    const thrust = this.stat('thruster') * (1 - load * 0.42);
    const grav = w.gravityAt(this.y);

    this.vx += ix * thrust * dt;
    this.vy += iy * thrust * dt;
    this.vy += grav * dt * (1 + load * 0.5);

    // drilling drags you into the rock, which feels like the bit biting in
    if (this.drilling) {
      this.vx += Math.cos(this.aim) * 150 * dt;
      this.vy += Math.sin(this.aim) * 150 * dt;
    }

    // a burst ignores friction and the speed cap while it lasts
    const dashing = this.dashT > 0;
    const drag = dashing ? 0.985 : (this.onGround(w) ? 0.82 : 0.94);
    this.vx *= Math.pow(drag, dt * 60);
    this.vy *= Math.pow(dashing ? 0.985 : 0.955, dt * 60);
    const maxSp = dashing ? 400 : 150 - load * 40;
    const sp = Math.hypot(this.vx, this.vy);
    if (sp > maxSp) { this.vx *= maxSp / sp; this.vy *= maxSp / sp; }

    this.thrusting.x = ix; this.thrusting.y = iy;
    if (!frozen) A.thrust((Math.abs(ix) + Math.abs(iy)) > 0 ? 0.7 : 0);

    // the wire to the pod: past its length it hauls you back, hard
    if (!this.docked && g.ship) {
      const L = this.stat('tether');
      const dx = this.x - g.ship.x, dy = this.y - (g.ship.y + 10);
      const d = Math.hypot(dx, dy);
      this.tetherFrac = d / L;
      if (d > L) {
        const over = d - L;
        const nx = dx / d, ny = dy / d;
        this.x -= nx * over; this.y -= ny * over;
        const vAlong = this.vx * nx + this.vy * ny;
        if (vAlong > 0) { this.vx -= nx * vAlong * 1.6; this.vy -= ny * vAlong * 1.6; }
        if (this.tetherSnap <= 0) { this.tetherSnap = 0.5; A.tone(180, { type: 'triangle', to: 90, dur: 0.14, vol: 0.1 }); FX.shake(1.2); g.hint('tether', ['belt', 'bang']); }
      }
      this.tetherSnap = Math.max(0, (this.tetherSnap || 0) - dt);
    }

    const before = { x: this.x, y: this.y };
    const hit = PD.ent.moveBody(this, w, dt);
    if (hit.ground && before.y < this.y) this.squish = Math.min(1, Math.abs(this.vy) / 200 + this.squish);

    if (ix || iy) {
      // jetpack exhaust
      if (U.chance(dt * 34)) {
        FX.spawn({
          x: this.x - ix * 7 + U.rand(-2, 2), y: this.y - iy * 8 + 5 + U.rand(-2, 2),
          vx: -ix * U.rand(30, 80) + this.vx * 0.3, vy: -iy * U.rand(30, 80) + this.vy * 0.3 + 20,
          life: U.rand(0.16, 0.4), size: U.rand(1.5, 3),
          color: U.pick(['#ffd34d', '#ff9b3d', '#fff3c0']), grav: -0.1, drag: 0.86, glow: 1
        });
      }
    }

    if (!frozen) {
      this.doDrill(dt, g);
      this.doGun(dt, g);
      this.doAir(dt, g);
      this.doRecall(dt, g);
    } else {
      this.drilling = false;
      A.drill(false);
      A.thrust(0);
    }
  };

  /* Burst jets: a short invulnerable lunge. Direction from the keys, or the
     aim if you are not steering. */
  Player.prototype.dash = function (ix, iy, g) {
    if (this.dashCool > 0 || this.docked) return;
    let dx = ix, dy = iy;
    if (!dx && !dy) { dx = Math.cos(this.aim); dy = Math.sin(this.aim); }
    const n = Math.hypot(dx, dy) || 1;
    this.vx = dx / n * 330;
    this.vy = dy / n * 330;
    this.dashCool = this.stat('dash');
    this.dashT = 0.26;
    this.invuln = Math.max(this.invuln, 0.3);
    A.sfx.tone(300, { type: 'sawtooth', to: 1200, dur: 0.16, vol: 0.12 });
    A.sfx.noise({ from: 900, to: 3000, dur: 0.14, vol: 0.1 });
    FX.ring(this.x, this.y, 3, 22, 0.3, '#7ef9ff', 2);
    for (let i = 0; i < 8; i++) FX.trail(this.x - dx / n * i * 3, this.y - dy / n * i * 3, '#7ef9ff', 2);
    FX.shake(1.5);
  };

  /* Sonar ping: paints nearby ore on to the minimap. */
  Player.prototype.scan = function (g) {
    if (this.scanCool > 0 || this.docked) { A.sfx.deny(); return; }
    this.scanCool = 4;
    g.scan(this.x, this.y, this.stat('scanner'));
  };

  Player.prototype.onGround = function (w) {
    return w.rectSolid(this.x - this.w / 2, this.y + this.h / 2, this.w, 2);
  };

  /* ------------------------------------------------------------------- drill */
  Player.prototype.drillTip = function () {
    const r = this.stat('reach');
    return { x: this.x + Math.cos(this.aim) * r, y: this.y + Math.sin(this.aim) * r };
  };

  /* The bit has real length, so bite the first solid tile anywhere along it.
     Without this the drill goes dead every time a tile pops and the player
     has to drift the last few pixels to the next one. */
  Player.prototype.findBite = function (w) {
    const reach = this.stat('reach') + PD.world.TILE * 1.2;
    const cos = Math.cos(this.aim), sin = Math.sin(this.aim);
    let lastCx = -1, lastCy = -1;
    for (let d = 5; d <= reach; d += 2.5) {
      const x = this.x + cos * d, y = this.y + sin * d;
      const cx = Math.floor(x / PD.world.TILE), cy = Math.floor(y / PD.world.TILE);
      if (cx === lastCx && cy === lastCy) continue;
      lastCx = cx; lastCy = cy;
      const mat = w.at(cx, cy);
      if (mat) return { cx, cy, mat, x, y, dist: d };
    }
    return null;
  };

  Player.prototype.doDrill = function (dt, g) {
    const IN = PD.input;
    const want = IN.mouse.left && !g.uiBlocking;
    this.drillSpin += dt * (want ? 26 : 4);
    const w = g.world;

    if (!want) {
      this.drilling = false;
      A.drill(false);
      return;
    }

    const bite = this.findBite(w);
    this.drilling = !!bite;
    if (!bite) { A.drill(false); return; }

    const power = this.stat('drill') * dt;
    const hardness = U.clamp(D.MAT[bite.mat].hp / 255, 0, 1);
    this.drillPitch = 1 - hardness;
    A.drill(true, this.drillPitch);

    const broke = w.damage(bite.cx, bite.cy, power);
    if (broke) g.onTileBroken(bite.cx, bite.cy, broke, true);

    // The bore is always wider than the bit: a one-tile shaft is narrower
    // than the player, so a single-tile tunnel would wedge you in place.
    const px = Math.round(-Math.sin(this.aim)), py = Math.round(Math.cos(this.aim));
    const side = this.g.save.upg.reach >= 5 ? 2 : 1;
    for (let k = 1; k <= side; k++) {
      const falloff = power * (k === 1 ? 0.7 : 0.4);
      const b2 = w.damage(bite.cx + px * k, bite.cy + py * k, falloff);
      if (b2) g.onTileBroken(bite.cx + px * k, bite.cy + py * k, b2, true);
      const b3 = w.damage(bite.cx - px * k, bite.cy - py * k, falloff);
      if (b3) g.onTileBroken(bite.cx - px * k, bite.cy - py * k, b3, true);
    }

    if (U.chance(dt * 55)) FX.sparks(bite.x, bite.y, this.aim, D.MAT[bite.mat], 3);
    FX.shake(0.55);
  };

  /* --------------------------------------------------------------------- gun */
  Player.prototype.doGun = function (dt, g) {
    const IN = PD.input;
    const want = (IN.mouse.right || IN.down('space')) && !g.uiBlocking;
    if (!want || this.gunCool > 0) return;
    const a0 = this.aim;
    const ox = Math.cos(a0) * 12, oy = Math.sin(a0) * 12;

    if (this.weapon === 'scatter') {
      this.gunCool = 0.72;
      this.gunFlash = 0.1;
      const dmg = this.stat('scatter');
      for (let i = 0; i < 5; i++) {
        const a = a0 + (i - 2) * 0.13 + U.rand(-0.04, 0.04);
        const sp = 300 + U.rand(-30, 30);
        g.bullets.push(new Bullet(this.x + ox, this.y + oy, Math.cos(a) * sp, Math.sin(a) * sp, dmg, true, '#ffb03d', { life: 0.34 }));
      }
      this.vx -= Math.cos(a0) * 110;
      this.vy -= Math.sin(a0) * 110;
      FX.burst(this.x + ox, this.y + oy, 9, ['#ffb03d', '#ffffff', '#ff7a2a'], 110, true);
      FX.shake(3.2);
      A.sfx.boom(0.35);
      A.sfx.shoot();
    } else if (this.weapon === 'lance') {
      this.gunCool = 1.05;
      this.gunFlash = 0.14;
      const dmg = this.stat('lance');
      g.bullets.push(new PD.ent.Beam(this.x + ox, this.y + oy, a0, 190, dmg, g));
      this.vx -= Math.cos(a0) * 60;
      this.vy -= Math.sin(a0) * 60;
      FX.shake(2.6);
      FX.hitStop(0.03);
      A.sfx.tone(1800, { type: 'sawtooth', to: 200, dur: 0.26, vol: 0.14, filter: 5000 });
      A.sfx.noise({ from: 6000, to: 400, dur: 0.2, vol: 0.1 });
    } else {
      this.gunCool = this.stat('trigger');
      this.gunFlash = 0.09;
      const dmg = this.stat('pistol');
      const a = a0 + U.rand(-0.035, 0.035);
      g.bullets.push(new Bullet(this.x + ox, this.y + oy, Math.cos(a) * 330, Math.sin(a) * 330, dmg, true));
      this.vx -= Math.cos(a) * 28;
      this.vy -= Math.sin(a) * 28;
      FX.burst(this.x + ox, this.y + oy, 4, ['#7ef9ff', '#ffffff'], 70, true);
      FX.shake(1.1);
      A.sfx.shoot();
    }
  };

  /* --------------------------------------------------------------------- air */
  Player.prototype.doAir = function (dt, g) {
    // the lamp reveals the map as you go
    g.world.reveal(this.x, this.y, this.stat('lamp') * 0.9);

    // magma burns; uranium in the hold cooks you slowly
    const hz = g.world.hazardIn(this.x - this.w / 2, this.y - this.h / 2, this.w, this.h);
    if (hz && !this.docked) {
      this.hull -= hz * dt;
      this.vy -= 90 * dt;
      if (this.burnCool <= 0) {
        this.burnCool = 0.4;
        FX.burst(this.x, this.y + 6, 6, ['#ff7a2a', '#ffd27a'], 60, true);
        A.sfx.tone(200, { type: 'sawtooth', to: 120, dur: 0.12, vol: 0.09 });
        FX.flash(0.15, '#ff5a2a');
        g.hint('lava', 'MAGMA! GET OUT OF IT');
      }
      if (this.hull <= 0) { this.hull = 0; g.onPlayerDown(); return; }
    }
    const uran = this.cargo[D.M.uran] || 0;
    if (uran > 0 && !this.docked) {
      this.hull -= 0.35 * uran * dt;
      if (U.chance(dt * 3)) FX.trail(this.x + U.rand(-5, 5), this.y + U.rand(-6, 6), '#a6ff3d', 1.4);
      g.hint('uran', 'URANIUM IN THE HOLD IS COOKING YOU. SELL IT FAST.');
      if (this.hull <= 0) { this.hull = 0; g.onPlayerDown(); return; }
    }

    if (this.docked) {
      this.o2 = Math.min(this.stat('oxygen'), this.o2 + 90 * dt);
      this.suffocating = 0;
      return;
    }
    const depth = U.clamp(g.world.depthMeters(this.y) / Math.max(20, g.world.maxDepthMeters()), 0, 1);
    let drain = 1.0 + depth * 0.9 + this.loadFactor() * 0.5;
    if (this.drilling) drain += 0.9;
    this.o2 -= drain * dt;

    if (this.o2 <= 0) {
      this.o2 = 0;
      this.suffocating += dt;
      this.hull -= 7 * dt;
      this.alarmT -= dt;
      if (this.alarmT <= 0) { A.sfx.alarm(); this.alarmT = 0.7; }
      FX.flash(0.06, '#3a0d1a');
      if (this.hull <= 0) { this.hull = 0; g.onPlayerDown(); }
    } else if (this.o2 < this.stat('oxygen') * 0.25) {
      this.alarmT -= dt;
      if (this.alarmT <= 0) { A.sfx.alarm(); this.alarmT = 1.4; }
    }
  };

  /* ------------------------------------------------------------------ recall
     Hold R for an emergency tractor-beam yank home; the ship charges for it. */
  Player.prototype.doRecall = function (dt, g) {
    if (PD.input.down('KeyR') && !this.docked) {
      this.recall += dt;
      if (this.recall > 0.06) {
        FX.trail(this.x + U.rand(-10, 10), this.y + U.rand(-12, 12), '#7ef9ff', 2);
      }
      if (this.recall >= 1.4) {
        this.recall = 0;
        g.emergencyRecall();
      }
    } else this.recall = Math.max(0, this.recall - dt * 2.4);
  };

  /* ------------------------------------------------------------------- cargo */
  Player.prototype.addOre = function (mat) {
    const m = D.MAT[mat];
    if (this.cargoKg + m.kg > this.capacity() + 0.0001) return false;
    this.cargo[mat] = (this.cargo[mat] || 0) + 1;
    this.cargoKg += m.kg;
    return true;
  };

  Player.prototype.clearCargo = function () { this.cargo = {}; this.cargoKg = 0; };

  /* ----------------------------------------------------------------- drawing */
  Player.prototype.draw = function (ctx, cam, t) {
    const skin = PD.art.skinFor(this.g.save.cos);
    const moving = Math.hypot(this.vx, this.vy) > 20 || this.thrusting.x || this.thrusting.y;
    const spr = moving || !this.onGround(this.g.world) ? skin.alienFly : skin.alien;
    this.anim += 1 / 60 * (moving ? 8 : 3);
    const drill = skin.drill;
    const gun = PD.art.sprites[this.weapon === 'pistol' ? 'gun' : this.weapon];
    const px = this.x - cam.x, py = this.y - cam.y;
    const flip = Math.cos(this.aim) < 0;

    if (this.dashT > 0) {
      // afterimages along the burst
      ctx.globalAlpha = 0.35;
      for (let k = 1; k <= 3; k++) {
        PD.ent.drawSprite(ctx, spr, 0, px - this.vx * k * 0.012, py - this.vy * k * 0.012 - 1, flip, true);
      }
      ctx.globalAlpha = 1;
    } else if (this.invuln > 0 && Math.sin(this.invuln * 40) < -0.2) return;

    // pistol on the far side, drill on the aiming side
    ctx.save();
    ctx.translate(px | 0, py | 0);
    ctx.rotate(this.aim + (flip ? Math.PI : 0));
    ctx.scale(1, flip ? -1 : 1);
    const g = gun.frames[this.gunCool > 0.05 ? 1 : 0];
    ctx.drawImage(g, -2, -10);
    ctx.restore();

    ctx.save();
    ctx.translate(px | 0, py | 0);
    ctx.rotate(this.aim);
    if (this.drilling) ctx.translate(U.rand(-1, 1), U.rand(-1, 1));
    const df = drill.frames[Math.floor(this.drillSpin) % drill.frames.length];
    ctx.drawImage(df, -drill.ox, -drill.oy);
    ctx.restore();

    const frame = spr === skin.alien ? (this.blink < 0 ? 2 : (this.squish > 0.25 ? 1 : 0)) : Math.floor(this.anim) % 2;
    PD.ent.drawSprite(ctx, spr, frame, px, py - 1, flip, this.hurtT > 0.15);
    // the arm that holds the tool, from the shoulder to the grip
    ctx.strokeStyle = skin.P.suit; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(px + (flip ? -4 : 4), py - 2); ctx.lineTo(px + Math.cos(this.aim) * 9, py + Math.sin(this.aim) * 9); ctx.stroke();
    ctx.fillStyle = skin.P.skin; ctx.fillRect(px + Math.cos(this.aim) * 9 - 2, py + Math.sin(this.aim) * 9 - 2, 4, 4);

    if (this.gunFlash > 0) {
      const a = this.aim;
      ctx.fillStyle = '#eafcff';
      ctx.globalAlpha = this.gunFlash / 0.09;
      const fx = px + Math.cos(a) * 15, fy = py + Math.sin(a) * 15;
      ctx.fillRect(fx - 3, fy - 3, 6, 6);
      ctx.globalAlpha = 1;
    }

    if (this.recall > 0.1) {
      ctx.strokeStyle = '#7ef9ff';
      ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 22);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(px | 0, py | 0, 8 + (1 - this.recall / 1.4) * 20, 0, U.TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  };

  PD.Player = Player;
})(window.PD);

/* ===== src/ui.js ===== */
/* HUD, shop, star map and all the overlay screens. Everything is drawn into
   the low-res canvas with immediate-mode widgets. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const F = PD.font;
  const A = PD.audio;

  const VW = 480, VH = 270;

  const COL = {
    ink: '#120a24', panel: '#1d1338', panelHi: '#2c1e52',
    line: '#5b3f96', lineHi: '#a67df0',
    text: '#f2e9ff', dim: '#9c8ec4', gold: '#ffd34d',
    o2: '#58e8ff', hull: '#ff5a4d', cargo: '#ffb03d',
    good: '#8affa0', bad: '#ff6b8a', core: '#ff8a3d'

  /* ------------------------------------------------------------- primitives */

    ctx.fillStyle = COL.panel;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = COL.panelHi;
    ctx.fillRect(x, y, w, 2);
    ctx.strokeStyle = COL.line;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

    ctx.fillStyle = COL.lineHi;
    ctx.fillRect(x + 2, y + 2, 2, 2); ctx.fillRect(x + w - 4, y + 2, 2, 2);
    ctx.fillRect(x + 2, y + h - 4, 2, 2); ctx.fillRect(x + w - 4, y + h - 4, 2, 2);
    if (title) {
      const tw = F.width(title, 1) + 10;
      ctx.fillStyle = COL.line;
      ctx.fillRect(x + 8, y - 5, tw, 11);
      ctx.fillStyle = COL.panelHi;
      ctx.fillRect(x + 8, y - 5, tw, 2);

  }

  let hoverId = null, lastHover = null;

  function button(ctx, x, y, w, h, label, opts) {

    if (hot) hoverId = (opts.id || label);

  function toasts(ctx, g) {

    for (let i = g.toasts.length - 1; i >= 0; i--) {

      const arr = Array.isArray(t.msg) ? t.msg : null;
      const w = arr ? arr.length * 16 + 12 + (t.num !== undefined ? F.width(String(t.num), 1) + 6 : 0) : F.width(t.msg, 1) + 12;
      ctx.globalAlpha = U.clamp(t.life, 0, 1);
      ctx.fillStyle = 'rgba(18,10,36,0.85)';
      ctx.fillRect(VW / 2 - w / 2, ty - 3, w, 18);
      ctx.strokeStyle = t.color || COL.line;
      ctx.strokeRect(VW / 2 - w / 2 + 0.5, ty - 2.5, w - 1, 17);
      if (arr) {
        let gx = VW / 2 - w / 2 + 6;
        for (const gname of arr) { Gd().draw(ctx, gname, gx, ty - 1, t.color || COL.text, COL.line); gx += 16; }
        if (t.num !== undefined) F.draw(ctx, t.num, gx + 2, ty + 3, t.color || COL.text);
      } else F.draw(ctx, t.msg, VW / 2, ty + 3, t.color || COL.text, { center: true });
      ctx.globalAlpha = 1;
      ty -= 21;
    }
  }

  function hintStrip(ctx, g, y) {
    if (g.hintT <= 0 || !g.hintGlyphs) return;
    const arr = g.hintGlyphs;
    const text = (g.hintText || '').toUpperCase();
    const w = Math.max(arr.length * 18 + 10, F.width(text, 1) + 16);
    ctx.globalAlpha = U.clamp(g.hintT, 0, 1);
    ctx.fillStyle = 'rgba(8,4,18,0.82)';
    ctx.fillRect(VW / 2 - w / 2, y - 14, w, text ? 32 : 20);
    ctx.fillStyle = '#ffd34d'; ctx.fillRect(VW / 2 - w / 2, y - 14, w, 1);
    for (let i = 0; i < arr.length; i++) Gd().draw(ctx, arr[i], VW / 2 - arr.length * 9 + i * 18, y - 11, '#ffffff', '#ffd34d');
    if (text) F.draw(ctx, text, VW / 2, y + 6, '#ffffff', { center: true });
    ctx.globalAlpha = 1;
  }

  /* The objective line: always on, always says what to do next. */
  function objective(ctx, g) {
    const o = g.objective && g.objective();
    if (!o) return;
    const text = o.t.toUpperCase();
    const w = F.width(text, 1) + o.g.length * 16 + 24;
    const x = VW / 2 - w / 2, y = 64;
    ctx.fillStyle = 'rgba(8,4,18,0.75)';
    ctx.fillRect(x, y, w, 18);
    ctx.fillStyle = COL.gold; ctx.fillRect(x, y + 17, w, 1);
    let gx = x + 6;
    for (const gname of o.g) { Gd().draw(ctx, gname, gx, y + 2, '#ffffff', COL.gold); gx += 16; }
    F.draw(ctx, text, gx + 6, y + 6, COL.text);
  }

  function meters(ctx, g) {
    const p = g.player;
    const maxO2 = p.stat('oxygen'), maxHull = p.stat('hull'), cap = p.capacity();
    const bx = 24, bw = 84;
    ctx.fillStyle = 'rgba(8,4,18,0.55)'; ctx.fillRect(0, 0, bx + bw + 40, 60);
    Gd().draw(ctx, 'o2', 4, 6, COL.o2, '#2b9fc4');
    bar(ctx, bx, 8, bw, 10, p.o2 / maxO2, p.o2 / maxO2 < 0.25 ? (Math.sin(g.time * 12) > 0 ? '#ff6b8a' : COL.o2) : COL.o2, { label: 'AIR' });
    F.draw(ctx, Math.ceil(p.o2), bx + bw + 4, 6, COL.o2, { scale: 2 });
    Gd().draw(ctx, 'hull', 4, 24, COL.hull, '#b32b2f');
    bar(ctx, bx, 26, bw, 10, p.hull / maxHull, COL.hull, { label: 'HULL' });
    F.draw(ctx, Math.ceil(p.hull), bx + bw + 4, 24, COL.hull, { scale: 2 });
    Gd().draw(ctx, 'cargo', 4, 42, COL.cargo, '#c25c14');
    bar(ctx, bx, 44, bw, 10, p.cargoKg / cap, p.cargoFull() ? '#ff6b8a' : COL.cargo, { label: 'HOLD' });
    F.draw(ctx, Math.round(p.cargoKg) + '/' + Math.round(cap), bx + bw + 4, 44, p.cargoFull() ? '#ff6b8a' : COL.cargo, { scale: 2 });

    // manifest: swatch + count
    const entries = Object.keys(p.cargo).sort((a, b) => D.MAT[b].cr - D.MAT[a].cr).slice(0, 6);
    let my = 64;
    for (const k of entries) {
      const m = D.MAT[k];
      ctx.fillStyle = m.c[1]; ctx.fillRect(8, my + 1, 6, 6);
      ctx.fillStyle = m.c[0]; ctx.fillRect(8, my + 1, 6, 2);
      F.draw(ctx, m.name.toUpperCase().slice(0, 11) + ' ' + p.cargo[k], 18, my, COL.text);
      my += 9;
    }
    if (p.cargoValue() > 0) { Gd().draw(ctx, 'coin', 6, my, COL.gold, '#b8860b'); F.draw(ctx, U.fmt(p.cargoValue()), 22, my + 1, COL.gold, { scale: 2 }); }

    // top right: credits, galaxy
    ctx.fillStyle = 'rgba(8,4,18,0.55)'; ctx.fillRect(VW - 130, 0, 130, 46);
    F.draw(ctx, '$' + U.fmt(g.save.credits), VW - 8, 6, COL.gold, { right: true, scale: 2 });
    F.draw(ctx, 'GALAXY ' + g.save.dominion.toFixed(1) + '%', VW - 8, 24, COL.lineHi, { right: true });
    const dps = g.droneIncome();
    if (dps > 0) F.draw(ctx, '+$' + U.fmt(dps) + '/S DRONES', VW - 8, 34, COL.good, { right: true });
  }

  function hud(ctx, g) {
    const p = g.player;
    meters(ctx, g);

    // world + depth
    F.draw(ctx, g.world.body.name, 6, VH - 26, COL.text);
    Gd().draw(ctx, 'depth', 6, VH - 16, COL.dim, '#2a1c4a');
    F.draw(ctx, g.world.depthMeters(p.y) + 'M', 22, VH - 16, COL.text, { scale: 2 });
    objective(ctx, g);

    // weapon, dash, scan
    const wg = { pistol: 'gun', scatter: 'scatter', lance: 'lance' }[p.weapon];
    Gd().draw(ctx, wg, 6, VH - 84, '#ffffff', '#7ef9ff');
    F.draw(ctx, p.weapon.toUpperCase() + (p.weapons().length > 1 ? '  Q' : ''), 22, VH - 81, COL.text);
    Gd().draw(ctx, 'dash', 6, VH - 68, p.dashCool > 0 ? COL.dim : COL.gold, '#2a1c4a');
    bar(ctx, 22, VH - 64, 40, 4, 1 - p.dashCool / Math.max(0.1, p.stat('dash')), p.dashCool > 0 ? '#9c8ec4' : COL.gold, {});
    F.draw(ctx, 'DASH', 66, VH - 66, COL.dim);
    Gd().draw(ctx, 'scan', 6, VH - 54, p.scanCool > 0 ? COL.dim : COL.good, '#2a1c4a');
    bar(ctx, 22, VH - 50, 40, 4, 1 - p.scanCool / 4, p.scanCool > 0 ? '#9c8ec4' : COL.good, {});
    F.draw(ctx, 'SCAN', 66, VH - 52, COL.dim);
    // tether reel
    Gd().draw(ctx, 'belt', 6, VH - 40, p.tetherFrac > 0.9 ? '#ff5a4d' : COL.o2, '#2a1c4a');
    bar(ctx, 22, VH - 36, 40, 4, p.tetherFrac || 0, p.tetherFrac > 0.9 ? '#ff5a4d' : COL.o2, {});
    F.draw(ctx, 'WIRE', 66, VH - 38, COL.dim);

    // core integrity
    if (g.world.coreHp < g.world.coreMax) {
      const cw = 140, cx = VW / 2 - cw / 2;
      F.draw(ctx, 'CORE', cx - 30, 28, COL.core);
      bar(ctx, cx, 26, cw, 9, g.world.coreHp / g.world.coreMax, COL.core, { right: Math.ceil(g.world.coreHp / g.world.coreMax * 100) + '%' });
    }
    if (p.recall > 0.1) {
      Gd().draw(ctx, 'hole', VW / 2 - 48, VH - 40, COL.o2, '#2b9fc4');
      bar(ctx, VW / 2 - 30, VH - 36, 60, 6, p.recall / 1.4, COL.o2, {});
    }
    if (g.combo.n >= 3) {
      F.draw(ctx, 'x' + g.combo.mult.toFixed(1), VW / 2, 34, '#ff8ad8', { center: true, scale: 2 });
      Gd().stat(ctx, 'skull', g.combo.n, VW / 2 - 16, 52, '#ff8ad8', '#8a2a56', COL.text);
      bar(ctx, VW / 2 - 30, 68, 60, 3, g.combo.t / 2.6, '#ff8ad8', {});
    }

    minimap(ctx, g);

    // stratum banner: band swatch + depth number
    if (g.banner) {
      const a = U.clamp(Math.min(g.banner.t * 2, (3.2 - g.banner.t) * 2), 0, 1);
      const si = g.world.stratumAt(p.x, p.y);
      const tint = si >= 0 ? g.world.strata[si].tint : '#2a1c4a';
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(8,4,18,0.6)'; ctx.fillRect(VW / 2 - 60, 86, 120, 22);
      ctx.fillStyle = COL.gold; ctx.fillRect(VW / 2 - 60, 86, 120, 1);
      for (let i = 0; i < 5; i++) { ctx.fillStyle = tint; ctx.globalAlpha = a * (0.5 + i * 0.1); ctx.fillRect(VW / 2 - 52 + i * 10, 91, 8, 12); }
      ctx.globalAlpha = a;
      ctx.globalAlpha = 1;
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(8,4,18,0.6)'; ctx.fillRect(VW / 2 - 100, 108, 200, 14);
      F.draw(ctx, g.banner.text + '  -  ' + g.world.depthMeters(p.y) + 'M', VW / 2, 111, COL.gold, { center: true });
      ctx.globalAlpha = 1;
    }

    hintStrip(ctx, g, VH - 44);
    toasts(ctx, g);
  }

  /* Scooter field HUD: the same meters, plus the field's own readouts. */
  function hudField(ctx, g) {
    meters(ctx, g);
    const p = g.player;
    F.draw(ctx, g.world.body.name + ' ORBIT', 6, VH - 26, COL.text);
    Gd().draw(ctx, 'speed', 6, VH - 16, COL.dim, '#2a1c4a');
    F.draw(ctx, Math.round(Math.hypot(p.vx, p.vy)), 22, VH - 16, COL.text, { scale: 2 });
    Gd().draw(ctx, 'hole', 6, VH - 68, PD.space.S.hole ? '#d8bcff' : COL.dim, '#6b3fb5');
    F.draw(ctx, PD.space.S.hole ? 'FLY IN' : 'E  TIME HOLE', 22, VH - 65, PD.space.S.hole ? '#d8bcff' : COL.text);
    Gd().draw(ctx, 'gun', 6, VH - 52, '#ffffff', '#7ef9ff');
    F.draw(ctx, 'SPACE  FIRE', 22, VH - 49, COL.text);
    objective(ctx, g);
    hintStrip(ctx, g, VH - 44);
    toasts(ctx, g);
  }

  /* ---------------------------------------------------------------- minimap
     Fog of war: only what the lamp has touched is drawn. Scanner pings paint
     ore you have not reached yet. */
  let mmCv = null, mmCtx = null, mmDirty = 0;
  function minimap(ctx, g) {
    const w = g.world;
    const MW = 92, MH = 92;
    const x0 = VW - MW - 8, y0 = 58;
    const sc = Math.min(MW / w.w, MH / w.h);
    const ox = x0 + (MW - w.w * sc) / 2, oy = y0 + (MH - w.h * sc) / 2;

    if (!mmCv) { mmCv = document.createElement('canvas'); mmCtx = mmCv.getContext('2d'); }
    if (mmCv.width !== w.w || mmCv.height !== w.h) { mmCv.width = w.w; mmCv.height = w.h; mmDirty = 0; }
    // rebuild the fog texture a few times a second, not every frame
    mmDirty -= 1;
    if (mmDirty <= 0) {
      mmDirty = 8;
      const img = mmCtx.createImageData(w.w, w.h);
      for (let i = 0; i < w.cells.length; i++) {
        if (!w.seen[i]) continue;
        const m = w.cells[i];
        const k = i * 4;
        if (!m) { if (w.inside[i]) { img.data[k] = 24; img.data[k + 1] = 18; img.data[k + 2] = 40; img.data[k + 3] = 255; } continue; }
        const c = D.MAT[m].c[1];
        img.data[k] = parseInt(c.slice(1, 3), 16); img.data[k + 1] = parseInt(c.slice(3, 5), 16); img.data[k + 2] = parseInt(c.slice(5, 7), 16);
        img.data[k + 3] = 255;
      }
      mmCtx.putImageData(img, 0, 0);
    }

    ctx.fillStyle = 'rgba(8,4,18,0.75)';
    ctx.fillRect(x0 - 2, y0 - 2, MW + 4, MH + 4);
    ctx.strokeStyle = COL.line; ctx.strokeRect(x0 - 1.5, y0 - 1.5, MW + 3, MH + 3);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(mmCv, 0, 0, w.w, w.h, ox, oy, w.w * sc, w.h * sc);

    // scanner pings
    for (const pg of g.pings) {
      ctx.globalAlpha = U.clamp(pg.life / 3, 0, 1) * (0.6 + 0.4 * Math.sin(g.time * 6 + pg.cx));
      ctx.fillStyle = D.MAT[pg.mat].c[0];
      ctx.fillRect(ox + pg.cx * sc - 1, oy + pg.cy * sc - 1, Math.max(2, sc * 2), Math.max(2, sc * 2));
    }
    ctx.globalAlpha = 1;
    // core, ship, you
    if (w.coreHp > 0) { ctx.fillStyle = '#ff8a3d'; ctx.fillRect(ox + w.cx * sc - 1, oy + w.cy * sc - 1, 3, 3); }
    ctx.fillStyle = '#7ef9ff'; ctx.fillRect(ox + g.ship.x / 10 * sc - 2, oy + g.ship.y / 10 * sc - 1, 4, 2);
    const px = ox + g.player.x / 10 * sc, py = oy + g.player.y / 10 * sc;
    ctx.fillStyle = Math.sin(g.time * 10) > 0 ? '#ffffff' : '#ff5fa8';
    ctx.fillRect(px - 1, py - 1, 3, 3);
    PD.glyph.draw(ctx, 'scan', x0 + MW / 2 - 7, y0 + MH + 3, COL.dim, COL.line);
  }

  /* ------------------------------------------------------------------- shop */
  const TABS = ['UPGRADES', 'STAR MAP', 'OPTIONS'];

  function shop(ctx, g) {
    ctx.fillStyle = 'rgba(8,4,18,0.72)';
    ctx.fillRect(0, 0, VW, VH);

    panel(ctx, 12, 16, VW - 24, VH - 32, 'THE RUSTMAW  -  DOCKED');

    F.draw(ctx, '$' + U.fmt(g.save.credits), VW - 24, 23, COL.gold, { right: true, scale: 2 });

    // tabs
    for (let i = 0; i < TABS.length; i++) {
      const tx = 22 + i * 84;
      if (button(ctx, tx, 22, 80, 13, TABS[i], { accent: g.shopTab === i ? COL.lineHi : '#2a1c4a', id: 'tab' + i })) {
        g.shopTab = i;
      }
    }

    if (g.shopTab === 0) shopUpgrades(ctx, g);
    else if (g.shopTab === 1) starMap(ctx, g);
    else options(ctx, g);

    if (button(ctx, VW / 2 - 52, VH - 30, 104, 15, 'LAUNCH  [E]', { accent: '#2f7a4a' })) g.undock();
  }

  function shopUpgrades(ctx, g) {
    const list = D.UPGRADES;
    for (let i = 0; i < list.length; i++) {
      const u = list[i];
      const col = i % 3, row = (i / 3) | 0;
      const x = 22 + col * 146, y = 44 + row * 45;
      const lvl = g.save.upg[u.id] || 0;
      const maxed = lvl >= u.max;
      const cost = D.upgradeCost(u, lvl);
      const afford = g.save.credits >= cost;

      const m = PD.input.mouse;
      const hot = m.inside && m.x >= x && m.x < x + 138 && m.y >= y && m.y < y + 41;

      ctx.fillStyle = hot ? '#2c1e52' : '#241844';
      ctx.fillRect(x, y, 138, 41);
      ctx.strokeStyle = maxed ? COL.gold : (hot ? COL.lineHi : COL.line);
      ctx.strokeRect(x + 0.5, y + 0.5, 137, 40);

      icon(ctx, u.icon, x + 3, y + 3);
      F.draw(ctx, u.name, x + 22, y + 4, maxed ? COL.gold : COL.text);
      F.draw(ctx, u.show(lvl), x + 4, y + 16, COL.dim);

      // level pips
      const pips = Math.min(u.max, 12);
      const step = u.max > 12 ? u.max / 12 : 1;
      for (let k = 0; k < pips; k++) {
        const on = lvl >= Math.ceil((k + 1) * step);
        ctx.fillStyle = on ? (maxed ? COL.gold : COL.lineHi) : '#3a2a5e';
        ctx.fillRect(x + 4 + k * 5, y + 30, 4, 4);
      }
      F.draw(ctx, 'LV' + lvl, x + 134, y + 4, maxed ? COL.gold : COL.dim, { right: true });

      if (maxed) {
        F.draw(ctx, 'MAXED', x + 108, y + 26, COL.gold, { center: true });
      } else if (button(ctx, x + 82, y + 22, 52, 15, '$' + U.fmt(cost), { enabled: afford, accent: afford ? '#3f6ea8' : undefined, id: 'buy' + u.id })) {
        g.buy(u.id);
      }
      if (hot) g.shopTip = u.blurb;
    }
    if (g.shopTip) F.draw(ctx, g.shopTip, VW / 2, VH - 44, COL.dim, { center: true });
  }

  function starMap(ctx, g) {
    F.draw(ctx, 'SELECT A WORLD TO RUIN', VW / 2, 44, COL.text, { center: true });
    const rows = D.BODIES.length;
    const top = 56, rh = 16;
    for (let i = 0; i < rows; i++) {
      const b = D.BODIES[i];
      const y = top + i * rh;
      const unlocked = i <= g.save.unlocked;
      const done = g.save.destroyed[i];
      const here = i === g.bodyIndex;

      const m = PD.input.mouse;
      const hot = unlocked && m.inside && m.x >= 22 && m.x < VW - 22 && m.y >= y && m.y < y + rh - 2;
      ctx.fillStyle = here ? '#33235e' : (hot ? '#2c1e52' : '#221740');
      ctx.fillRect(22, y, VW - 44, rh - 2);
      ctx.strokeStyle = here ? COL.lineHi : '#3a2a5e';
      ctx.strokeRect(22.5, y + 0.5, VW - 45, rh - 3);

      // little planet dot
      ctx.fillStyle = unlocked ? b.tint : '#3a3050';
      ctx.beginPath(); ctx.arc(32, y + 7, 4, 0, U.TAU); ctx.fill();
      if (done) { ctx.fillStyle = '#0d0720'; ctx.fillRect(29, y + 6, 6, 2); }

      const label = unlocked ? b.name : '?????? ??????';
      F.draw(ctx, label, 42, y + 4, unlocked ? (done ? COL.dim : COL.text) : '#4d4070');
      F.draw(ctx, unlocked ? b.kind : 'LOCKED', 178, y + 4, COL.dim);
      F.draw(ctx, unlocked ? 'GRAV ' + b.gravity : '', 250, y + 4, COL.dim);
      F.draw(ctx, done ? 'DESTROYED' : (unlocked ? 'BOUNTY $' + U.fmt(b.reward) : ''), 310, y + 4,
        done ? COL.good : COL.gold);

      if (unlocked && !here && button(ctx, VW - 74, y + 1, 48, rh - 4, 'FLY', { id: 'fly' + i })) {
        g.travelTo(i);
      }
      if (here) F.draw(ctx, 'HERE', VW - 50, y + 4, COL.lineHi, { center: true });
    }
    const nxt = g.save.unlocked + 1;
    if (nxt < D.BODIES.length) {
      F.draw(ctx, 'CRACK THIS WORLD OPEN TO UNLOCK THE NEXT', VW / 2, VH - 44, COL.dim, { center: true });
    } else {
      F.draw(ctx, 'THE WHOLE MAP IS YOURS TO GRIND', VW / 2, VH - 44, COL.gold, { center: true });
    }
  }

  function options(ctx, g) {
    const x = VW / 2 - 90;
    F.draw(ctx, 'CONTROLS', x, 48, COL.gold);
    const lines = [
      'WASD / ARROWS   THRUSTERS',
      'MOUSE           AIM',
      'LEFT MOUSE      DRILL',
      'RIGHT / SPACE   PLASMA PISTOL',
      'E               DOCK / LAUNCH',
      'HOLD R          TRACTOR BEAM HOME',
      'ESC             PAUSE'
    ];
    for (let i = 0; i < lines.length; i++) F.draw(ctx, lines[i], x, 60 + i * 10, COL.text);

    if (button(ctx, x, 140, 84, 14, 'SOUND ' + (A.state.sfx ? 'ON' : 'OFF'))) { A.toggleSfx(!A.state.sfx); }
    if (button(ctx, x + 96, 140, 84, 14, 'MUSIC ' + (A.state.music ? 'ON' : 'OFF'))) { A.toggleMusic(!A.state.music); }
    if (button(ctx, x, 160, 84, 14, 'SAVE NOW')) { g.saveGame(); g.toast('PROGRESS SAVED', COL.good); }
    if (button(ctx, x + 96, 160, 84, 14, 'WIPE SAVE', { accent: '#8a2f4a' })) { g.wipeSave(); }
    F.draw(ctx, 'TOTAL MINED ' + U.fmt(g.save.totalMined) + ' TILES', x, 186, COL.dim);
    F.draw(ctx, 'TOTAL EARNED $' + U.fmt(g.save.totalEarned), x, 196, COL.dim);
    F.draw(ctx, 'WORLDS DESTROYED ' + g.save.destroyed.filter(Boolean).length, x, 206, COL.dim);
  }

  /* ------------------------------------------------------------- sell splash */
  function sellSplash(ctx, g) {
    const s = g.sellReport;
    if (!s) return;
    const h = 30 + s.lines.length * 10;
    const w = 150;
    const x = VW / 2 - w / 2, y = 60;
    ctx.globalAlpha = U.clamp(s.life, 0, 1);
    panel(ctx, x, y, w, h, 'CARGO SOLD');
    let ly = y + 10;
    for (const l of s.lines) {
      F.draw(ctx, l.name + ' X' + l.n, x + 8, ly, COL.text);
      F.draw(ctx, '$' + U.fmt(l.cr), x + w - 8, ly, COL.gold, { right: true });
      ly += 10;
    }
    ctx.fillStyle = COL.line;
    ctx.fillRect(x + 6, ly + 1, w - 12, 1);

    ctx.globalAlpha = 1;
  }

  /* ------------------------------------------------------------------ title */
  /* A little mascot diorama: our alien caught mid-crime on a cracking world. */
  function titleArt(ctx, t) {
    const px = 386, py = 246, r = 58;

    // the doomed planet
    ctx.fillStyle = '#2b1c4a';
    ctx.beginPath(); ctx.arc(px, py, r + 3, 0, U.TAU); ctx.fill();
    ctx.fillStyle = '#4f7d6a';
    ctx.beginPath(); ctx.arc(px, py, r, 0, U.TAU); ctx.fill();
    ctx.fillStyle = '#3a5f55';
    ctx.beginPath(); ctx.arc(px + 10, py + 12, r - 8, 0, U.TAU); ctx.fill();
    ctx.fillStyle = '#6a9a80';
    [[-26, -18, 9], [12, -30, 6], [-8, 6, 5], [26, -6, 7]].forEach(c => {
      ctx.beginPath(); ctx.arc(px + c[0], py + c[1], c[2], 0, U.TAU); ctx.fill();
    });

    // glowing fissures, breathing in time with the drill
    const glow = 0.7 + 0.3 * Math.sin(t * 4);
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(200,50,10,' + (glow * 0.8).toFixed(2) + ')';
    const cracks = [
      [[-6, -56], [-2, -34], [-14, -18], [-4, 0]],
      [[-4, -34], [14, -26], [22, -8]],
      [[-14, -18], [-32, -12], [-44, -20]]
    ];
    for (const line of cracks) {
      ctx.beginPath();
      ctx.moveTo(px + line[0][0], py + line[0][1]);
      for (let i = 1; i < line.length; i++) ctx.lineTo(px + line[i][0], py + line[i][1]);
      ctx.stroke();
    }
    // hot inner line on top of the dark fissure
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,190,80,' + glow.toFixed(2) + ')';
    for (const line of cracks) {
      ctx.beginPath();
      ctx.moveTo(px + line[0][0], py + line[0][1]);
      for (let i = 1; i < line.length; i++) ctx.lineTo(px + line[i][0], py + line[i][1]);
      ctx.stroke();
    }
    const hg = ctx.createRadialGradient(px - 6, py - 56, 1, px - 6, py - 56, 22);
    hg.addColorStop(0, 'rgba(255,240,190,' + glow.toFixed(2) + ')');
    hg.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(px - 28, py - 78, 56, 56);

    // sparks off the bit
    for (let i = 0; i < 9; i++) {
      const a = -1.9 + (i * 0.21) + Math.sin(t * 3 + i) * 0.1;
      const d = 8 + ((i * 7 + Math.floor(t * 30)) % 22);
      ctx.fillStyle = i % 3 ? '#ffd34d' : '#fff6c8';
      ctx.fillRect(px - 6 + Math.cos(a) * d | 0, py - 58 + Math.sin(a) * d | 0, 2, 2);
    }

    // the culprit
    const bob = Math.sin(t * 2.2) * 3;
    const al = PD.art.sprites.alien, dr = PD.art.sprites.drill;
    const ax = px - 34, ay = py - 96 + bob;
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(0.85);
    ctx.drawImage(dr.frames[Math.floor(t * 12) % dr.frames.length], 0, 0,
      dr.w, dr.h, -dr.ox * 2, -dr.oy * 2, dr.w * 2, dr.h * 2);
    ctx.restore();
    ctx.drawImage(al.frames[0], 0, 0, al.w, al.h,
      ax - al.ox * 2 | 0, ay - al.oy * 2 | 0, al.w * 2, al.h * 2);
  }

  function title(ctx, g, t) {
    const cx = 168;
    const bob = Math.sin(t * 1.6) * 2;
    titleArt(ctx, t);
    F.draw(ctx, 'PLANET', cx, 30 + bob, '#ffd34d', { center: true, scale: 5, shadow: '#7a2a10' });
    F.draw(ctx, 'DESTROYER', cx, 70 + bob, '#ff5fa8', { center: true, scale: 4, shadow: '#3a0c30' });
    F.draw(ctx, 'A GREEDY LITTLE ALIEN MINING GAME', cx, 106, COL.dim, { center: true });

    const m = PD.input.mouse;
    const px = cx, py = 150;
    const hot = m.inside && Math.abs(m.x - px) < 70 && Math.abs(m.y - py) < 14;
    ctx.fillStyle = hot ? '#3f9a5a' : '#2f7a4a'; ctx.fillRect(px - 70, py - 14, 140, 28);
    ctx.strokeStyle = '#8affa0'; ctx.lineWidth = 2; ctx.strokeRect(px - 69, py - 13, 138, 26);
    ctx.save(); ctx.translate(px - 50, py); ctx.rotate(-Math.PI / 2); PD.glyph.draw(ctx, 'play', -7, -7, '#ffffff', '#8affa0'); ctx.restore();
    F.draw(ctx, g.save.totalEarned > 0 ? 'CONTINUE' : 'START', px + 6, py - 7, '#ffffff', { center: true, scale: 2 });
    const start = hot && m.leftPressed;
    if (start) PD.audio.sfx.click();

    let wipe = false;
    if (g.save.totalEarned > 0) {
      wipe = button(ctx, cx - 40, 174, 80, 14, 'NEW GAME', { accent: '#8a2f4a' });
      F.draw(ctx, '$' + U.fmt(g.save.credits) + '   GALAXY ' + g.save.dominion.toFixed(1) + '%', cx, 194, COL.gold, { center: true });
    }
    const legend = [['hand', 'FLY'], ['hand', 'DRILL'], ['gun', 'SHOOT'], ['hole', 'HOME']];
    for (let i = 0; i < legend.length; i++) {
      PD.glyph.draw(ctx, legend[i][0], 14 + i * 80, 240, COL.gold, '#b8860b');
      F.draw(ctx, legend[i][1], 30 + i * 80, 244, COL.text);
    }
    F.draw(ctx, 'HOLD MOUSE / TOUCH TO FLY     E DOCK     Q SWAP     TAB SCAN', VW / 2, 258, COL.dim, { center: true });
    return { start, wipe };
  }

  /* ------------------------------------------------------------------ pause */
  function pause(ctx, g) {
    ctx.fillStyle = 'rgba(8,4,18,0.7)';
    ctx.fillRect(0, 0, VW, VH);
    const m = PD.input.mouse;
    const keys = [
      { g: 'play', x: VW / 2 - 78, col: '#2f7a4a', id: 'resume' },
      { g: A.state.sfx ? 'check' : 'cross', x: VW / 2 - 26, col: '#3f6ea8', id: 'sfx' },
      { g: 'star', x: VW / 2 + 26, col: A.state.music ? '#6b3fb5' : '#2a1c4a', id: 'music' },
      { g: 'home', x: VW / 2 + 78, col: '#8a2f4a', id: 'ship' }
    ];
    const r = { resume: false, ship: false };
    for (const k of keys) {
      const hot = m.inside && U.dist(m.x, m.y, k.x, VH / 2) < 20;
      PD.glyph.hex(ctx, k.x, VH / 2, 20 + (hot ? 2 : 0), k.col, hot ? '#ffffff' : COL.lineHi, 1.5);
      if (k.g === 'play') { ctx.save(); ctx.translate(k.x + 2, VH / 2); ctx.rotate(-Math.PI / 2); PD.glyph.draw(ctx, 'play', -7, -7, '#ffffff', k.col); ctx.restore(); }
      else PD.glyph.draw(ctx, k.g, k.x - 7, VH / 2 - 7, '#ffffff', k.col);
      if (hot && m.leftPressed) {
        A.sfx.click();
        if (k.id === 'resume') r.resume = true;
        if (k.id === 'sfx') A.toggleSfx(!A.state.sfx);
        if (k.id === 'music') A.toggleMusic(!A.state.music);
        if (k.id === 'ship') r.ship = true;
      }
    }
    return r;
  }

  /* -------------------------------------------------------- destroyed banner */
  function victory(ctx, g) {
    const v = g.victory;
    if (!v) return null;
    const t = v.t;
    const slide = U.smoothstep(0, 0.5, t);
    const y = U.lerp(-60, 40, slide);

    ctx.fillStyle = 'rgba(8,4,18,' + (0.8 * slide).toFixed(2) + ')';
    ctx.fillRect(0, 0, VW, VH);

    F.draw(ctx, 'WORLD', VW / 2, y, '#ffd34d', { center: true, scale: 4, shadow: '#7a2a10' });
    F.draw(ctx, 'DESTROYED', VW / 2, y + 34, '#ff5a4d', { center: true, scale: 5, shadow: '#3a0c30' });

    if (t > 0.7) {
      const a = U.clamp((t - 0.7) / 0.4, 0, 1);
      ctx.globalAlpha = a;
      panel(ctx, VW / 2 - 100, 122, 200, 78);
      PD.glyph.stat(ctx, 'star', U.fmt(v.reward), VW / 2 - 40, 130, COL.gold, '#b8860b', COL.gold);
      PD.glyph.stat(ctx, 'galaxy', '+' + v.dominion.toFixed(1) + '%', VW / 2 - 40, 146, COL.good, '#3fb85a', COL.good);
      PD.glyph.stat(ctx, 'coin', '+' + v.bonus + '%', VW / 2 - 40, 162, COL.lineHi, '#3a2a5e', COL.lineHi);
      if (v.unlocked) { PD.glyph.draw(ctx, 'planet', VW / 2 - 16, 178, COL.gold, '#b8860b'); PD.glyph.draw(ctx, 'check', VW / 2 + 2, 178, COL.good, '#3fb85a'); }
      ctx.globalAlpha = 1;
      if (t > 1.0) {
        return { ok: button(ctx, VW / 2 - 20, 206, 40, 18, '', { accent: '#2f7a4a' }) && true, _g: PD.glyph.draw(ctx, 'home', VW / 2 - 7, 208, '#ffffff', '#8affa0') };
      }
    }
    return null;
  }

  /* ------------------------------------------------------------------- ending */
  function ending(ctx, g, t) {
    ctx.fillStyle = 'rgba(8,4,18,0.82)';
    ctx.fillRect(0, 0, VW, VH);
    F.draw(ctx, 'GALAXY', VW / 2, 40, '#ffd34d', { center: true, scale: 5, shadow: '#7a2a10' });
    F.draw(ctx, 'CONQUERED', VW / 2, 80, '#8affa0', { center: true, scale: 5, shadow: '#0d4a20' });
    F.draw(ctx, 'EVERY WORLD ON THE MAP IS RUBBLE.', VW / 2, 124, COL.text, { center: true });
    F.draw(ctx, 'YOU ARE OBSCENELY, HORRIBLY RICH.', VW / 2, 138, COL.text, { center: true });
    F.draw(ctx, 'TOTAL EARNED $' + U.fmt(g.save.totalEarned), VW / 2, 158, COL.gold, { center: true, scale: 2 });
    F.draw(ctx, 'THE SANDBOX STAYS OPEN - WORLDS REGROW.', VW / 2, 184, COL.dim, { center: true });
    return button(ctx, VW / 2 - 60, 204, 120, 16, 'KEEP DRILLING', { accent: '#2f7a4a' });
  }

  PD.ui = {
    VW, VH, COL, panel, bar, button, icon, hud, hudField, objective, shop, title, pause, victory,
    sellSplash, ending, endFrame
  };
})(window.PD);

/* Comms panel: the game's speech system. Portrait window, name plate, text
   that types itself in, and a prompt to advance. Used by the crew and the
   opening cutscene. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const F = PD.font;
  const A = PD.audio;

  const VW = 480, VH = 270;

  /* Who can talk, and what their comms channel looks like. */
  const CAST = {
    nix:   { name: 'NIX',      sub: 'SHIP INTELLIGENCE', spr: 'nix',   col: '#7ef9ff', bg: '#0a2430', voice: 900, glyph: 'eye' },
    bolt:  { name: 'BOLT',     sub: 'FABRICATION UNIT',  spr: 'bolt',  col: '#ffb03d', bg: '#2a1c08', voice: 340, glyph: 'build' },
    gloop: { name: 'GLOOP',    sub: 'SHIP PET',          spr: 'gloop', col: '#c8ff5a', bg: '#16280a', voice: 1400, glyph: 'star' },
    zaz:   { name: 'ZAZ',      sub: 'APPRAISER',         spr: 'zaz',   col: '#c9a8ff', bg: '#1e1230', voice: 1100, glyph: 'clock' },
    you:   { name: 'YOU',      sub: 'FUTURE TYRANT',     spr: 'you',   col: '#ff5fa8', bg: '#2a0a1e', voice: 700, glyph: 'skull' },
    sys:   { name: 'RUSTMAW',  sub: 'AUTOMATED',         spr: null,    col: '#39ffa6', bg: '#062018', voice: 1100, glyph: 'home' }
  };

  const q = [];          // pending lines
  let cur = null, chars = 0, blipT = 0, done = false;

  function push(who, text) { q.push({ who, text }); if (!cur) next(); }
  function next() {
    cur = q.shift() || null;
    chars = 0; done = false;
  }
  function clear() { q.length = 0; cur = null; }
  const active = () => !!cur;

  /* Advance: first press finishes the typing, second moves on. */
  function advance() {
    if (!cur) return false;
    if (!done) { chars = cur.text.length; done = true; return true; }
    next();
    return true;
  }

  function update(dt) {
    if (!cur) return;
    if (!done) {
      chars += dt * (Array.isArray(cur.text) ? 6 : 46);
      blipT -= dt;
      if (blipT <= 0) {
        blipT = 0.045;
        const c = CAST[cur.who] || CAST.sys;
        A.tone(c.voice + U.rand(-90, 90), { type: 'square', dur: 0.02, vol: 0.035 });
      }
      if (chars >= cur.text.length) { chars = cur.text.length; done = true; }
    }
  }

  function wrap(text, maxChars) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      if ((line + ' ' + w).trim().length > maxChars) { lines.push(line.trim()); line = w; }
      else line += ' ' + w;
    }
    if (line.trim()) lines.push(line.trim());
    return lines;
  }

  function draw(ctx, g, t, skinAlien) {
    if (!cur) return;
    const c = CAST[cur.who] || CAST.sys;
    const H = 66, Y = VH - H - 6, X = 10, W = VW - 20;

    // angled comms frame
    ctx.fillStyle = 'rgba(4,2,10,0.85)';
    ctx.fillRect(X, Y, W, H);
    ctx.strokeStyle = c.col;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(X + 6.5, Y + 0.5); ctx.lineTo(X + W - 0.5, Y + 0.5);
    ctx.lineTo(X + W - 0.5, Y + H - 6.5); ctx.lineTo(X + W - 6.5, Y + H - 0.5);
    ctx.lineTo(X + 0.5, Y + H - 0.5); ctx.lineTo(X + 0.5, Y + 6.5);
    ctx.closePath(); ctx.stroke();
    // corner ticks
    ctx.fillStyle = c.col;
    ctx.fillRect(X + W - 26, Y + 2, 22, 2);
    ctx.fillRect(X + 2, Y + H - 4, 22, 2);

    // portrait window
    const PX = X + 5, PY = Y + 5, PW = 46, PH = H - 10;
    ctx.fillStyle = c.bg; ctx.fillRect(PX, PY, PW, PH);
    ctx.strokeStyle = c.col; ctx.strokeRect(PX + 0.5, PY + 0.5, PW - 1, PH - 1);
    ctx.save();
    ctx.beginPath(); ctx.rect(PX, PY, PW, PH); ctx.clip();
    const bob = Math.sin(t * 2.4) * 1.5;
    if (c.spr === 'you') {
      const al = skinAlien || PD.art.sprites.alien;
      ctx.drawImage(al.frames[Math.sin(t * 1.3) > 0.93 ? 2 : 0], 0, 0, al.w, al.h,
        PX + PW / 2 - al.w | 0, PY + PH - al.h * 1.9 + bob | 0, al.w * 2, al.h * 2);
    } else if (c.spr) {
      const sp = PD.artint.S[c.spr];
      const sc = Math.min(2, (PH - 4) / sp.h);
      ctx.drawImage(sp.frames[Math.floor(t * 3) % sp.frames.length], 0, 0, sp.w, sp.h,
        PX + PW / 2 - sp.w * sc / 2 | 0, PY + PH - sp.h * sc + bob | 0, sp.w * sc, sp.h * sc);
    } else {
      F.draw(ctx, '///', PX + PW / 2, PY + PH / 2 - 4, c.col, { center: true, shadow: false });
    }
    // portrait scanlines
    ctx.globalAlpha = 0.2; ctx.fillStyle = '#000';
    for (let yy = PY; yy < PY + PH; yy += 2) ctx.fillRect(PX, yy, PW, 1);
    ctx.globalAlpha = 1;
    ctx.restore();

    // name plate: glyph + name + role
    ctx.fillStyle = c.col;
    ctx.fillRect(PX, Y - 7, PW + 96, 12);
    PD.glyph.draw(ctx, c.glyph || 'crew', PX + 2, Y - 8, '#0a0614', c.col);
    F.draw(ctx, c.name, PX + 18, Y - 5, '#0a0614', { shadow: false });
    F.draw(ctx, c.sub, PX + 20 + F.width(c.name, 1) + 6, Y - 5, 'rgba(10,6,20,0.7)', { shadow: false });

    if (Array.isArray(cur.text)) {
      // pictograph strip, one glyph per "character"
      const n = Math.min(cur.text.length, Math.floor(chars));
      for (let i = 0; i < n; i++) {
        PD.glyph.draw(ctx, cur.text[i], PX + PW + 10 + i * 22, Y + 18, '#f2e9ff', c.col, 1);
      }
      // hex frames behind the strip
      for (let i = 0; i < cur.text.length; i++) PD.glyph.hex(ctx, PX + PW + 17 + i * 22, Y + 25, 11, null, i < n ? c.col : 'rgba(255,255,255,0.15)', 1);
    } else {
      const shown = cur.text.slice(0, Math.floor(chars));
      const lines = wrap(shown, 60);
      for (let i = 0; i < Math.min(lines.length, 4); i++) {
        F.draw(ctx, lines[i], PX + PW + 8, Y + 12 + i * 12, '#f2e9ff', { shadow: false });
      }
    }
    if (done && Math.sin(t * 6) > 0) {
      F.draw(ctx, q.length ? '>>' : '>', X + W - 14, Y + H - 12, c.col, { shadow: false });
    }
  }

  PD.dialog = { CAST, push, next, clear, advance, update, draw, active, get queued() { return q.length; } };
})(window.PD);

/* RUSTMAW OS -- the in-fiction console.

   bezel, a phosphor tube, a boot sequence, scanlines and a cursor. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const F = PD.font;
  const A = PD.audio;

  const VW = 480, VH = 270;

  /* Each app gets its own phosphor colour so you know where you are. */
  const THEME = {

    fab:    { hi: '#ffb03d', mid: '#c07a20', lo: '#3d2a0d', bg: '#140f04', name: 'FABRICATOR', glyph: 'build' },
    skills: { hi: '#ffb03d', mid: '#c07a20', lo: '#3d2a0d', bg: '#140f04', name: 'SKILL LATTICE', glyph: 'hex' },
    bay:    { hi: '#58e8ff', mid: '#2b8fae', lo: '#0d2f3d', bg: '#041014', name: 'DRONE BAY', glyph: 'drone' },
    vanity: { hi: '#ff8ad8', mid: '#b0459a', lo: '#3d0d2f', bg: '#140418', name: 'IDENTITY SUITE', glyph: 'crew' },
    nav:    { hi: '#9ab4ff', mid: '#4f66c0', lo: '#161d3d', bg: '#060818', name: 'NAV COMPUTER', glyph: 'planet' },
    refinery: { hi: '#ffd34d', mid: '#b58a1e', lo: '#3a2c0a', bg: '#120e04', name: 'REFINERY DECK', glyph: 'machine' }

  const FOOT = {
    market: 'ZAZ APPRAISES ONE LOT AT A TIME. ONLY APPRAISED ORE SELLS.',
    skills: 'CLICK A HEX. NEIGHBOURS OF A BUILT NODE UNLOCK.',
    bay: 'DRONES EARN WHILE YOU FLY.',
    vanity: 'CLICK TO BUY, CLICK AGAIN TO WEAR.',
    nav: 'PICK A WORLD TO DIVE. THE AIRLOCK GOES BACK TO THE FIELD.',
    refinery: 'HOPPER -> BELT -> MACHINE -> DEPOT. GOODS SELL FOR MORE.'
  };

  const state = {
    app: null, t: 0, boot: 0, lines: [], scroll: 0,
    sel: 0, flash: 0, msg: '', msgT: 0, msgCol: null, cat: 0, tip: ''
  };

  const BOOT = {
    market: ['RUSTMAW OS 4.21', 'LINKING BLACK-MARKET RELAY...', 'RELAY OK  [ENCRYPTED]', 'NO QUESTIONS ASKED.'],
    fab: ['RUSTMAW OS 4.21', 'FABRICATOR ARM ONLINE', 'FEEDSTOCK BIN: READING...', 'BOLT SAYS HURRY UP.'],
    bay: ['RUSTMAW OS 4.21', 'DRONE SWARM HANDSHAKE...', 'ALL UNITS NOMINAL', 'THEY NEVER SLEEP.'],
    vanity: ['RUSTMAW OS 4.21', 'IDENTITY SUITE LOADED', 'GENE VAT: WARM', 'LOOK THE PART.'],
    nav: ['RUSTMAW OS 4.21', 'STELLAR CARTOGRAPHY ONLINE', 'PLOTTING VICTIMS...', 'SELECT A TARGET.'],
    refinery: ['RUSTMAW OS 4.21', 'REFINERY GRID POWER: ON', 'BELT MOTORS SPUN UP', 'ROCK IN. MONEY OUT.'],
    skills: ['RUSTMAW OS 4.21', 'LATTICE ONLINE', 'NODES INDEXED', 'GROW.']
  };

  function open(app) {
    state.app = app;
    state.t = 0; state.boot = 0; state.scroll = 0; state.msgT = 0;
    A.sfx.tone(180, { type: 'square', to: 900, dur: 0.18, vol: 0.1 });
    A.tone(1200, { type: 'square', dur: 0.03, vol: 0.05, delay: 0.2 });
  }
  function close() {
    if (!state.app) return;
    state.app = null;
    A.sfx.tone(700, { type: 'square', to: 140, dur: 0.16, vol: 0.09 });
  }
  function say(msg, col, num) { state.msg = msg; state.msgNum = num; state.msgT = 2.6; state.msgCol = col; A.sfx.click(); }

  /* --------------------------------------------------------------- chrome */
  const SX = 14, SY = 10, SW = VW - 28, SH = VH - 20;
  const IX = SX + 12, IY = SY + 26, IW = SW - 24, IH = SH - 58;

  function chrome(ctx, th, title, sub) {
    // bezel
    ctx.fillStyle = '#171325';
    ctx.fillRect(SX - 6, SY - 6, SW + 12, SH + 12);
    ctx.fillStyle = '#241f38';
    ctx.fillRect(SX - 4, SY - 4, SW + 8, SH + 8);
    ctx.fillStyle = '#3a3358';
    ctx.fillRect(SX - 4, SY - 4, SW + 8, 2);
    for (const [bx, by] of [[SX - 2, SY - 2], [SX + SW - 2, SY - 2], [SX - 2, SY + SH - 2], [SX + SW - 2, SY + SH - 2]]) {
      ctx.fillStyle = '#6f6798'; ctx.fillRect(bx, by, 3, 3);
      ctx.fillStyle = '#171325'; ctx.fillRect(bx + 1, by + 1, 1, 1);
    }

    // tube
    ctx.fillStyle = th.bg;
    ctx.fillRect(SX, SY, SW, SH);

    // header rail
    ctx.fillStyle = th.lo;
    ctx.fillRect(SX, SY, SW, 14);
    ctx.fillStyle = th.mid;
    ctx.fillRect(SX, SY + 14, SW, 1);
    PD.glyph.draw(ctx, th.glyph || 'hex', SX + 4, SY, th.hi, th.mid);
    F.draw(ctx, title, SX + 22, SY + 3, th.hi, { shadow: false });
    if (sub) F.draw(ctx, sub, SX + SW - 6, SY + 3, th.mid, { right: true, shadow: false });

    // footer rail
    ctx.fillStyle = th.lo;
    ctx.fillRect(SX, SY + SH - 14, SW, 14);
    ctx.fillStyle = th.mid;
    ctx.fillRect(SX, SY + SH - 15, SW, 1);
  }

  /* Phosphor bloom, scanlines and the occasional bad frame. */
  function glassOver(ctx, th, t) {
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#000000';
    for (let y = SY; y < SY + SH; y += 3) ctx.fillRect(SX, y, SW, 1);
    ctx.globalAlpha = 1;

    // rolling brightness band
    const band = (t * 42) % (SH + 60) - 30;
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = th.hi;
    ctx.fillRect(SX, SY + band, SW, 18);
    ctx.globalAlpha = 1;

    // rare glitch tear
    if (Math.sin(t * 1.7) > 0.995) {
      const gy = SY + ((t * 997) % SH | 0);
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = th.mid;
      ctx.fillRect(SX, gy, SW, 2);
      ctx.globalAlpha = 1;
    }

    // corner darkening
    const g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.3, VW / 2, VH / 2, VH * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = g;
    ctx.fillRect(SX, SY, SW, SH);
  }

  function cursor(ctx, x, y, th, t) {
    if (Math.sin(t * 8) > 0) ctx.fillStyle = th.hi, ctx.fillRect(x, y, 4, 7);
  }

  /* A selectable console row. Returns {hover, clicked}. */
  function row(ctx, x, y, w, h, th, opts) {
    opts = opts || {};
    const m = PD.input.mouse;
    const hover = m.inside && m.x >= x && m.x < x + w && m.y >= y && m.y < y + h && opts.enabled !== false;
    if (hover || opts.active) {
      ctx.fillStyle = opts.active ? th.lo : 'rgba(255,255,255,0.07)';
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = th.mid;
      ctx.fillRect(x, y, 1, h);
    }
    if (hover) F.draw(ctx, '>', x - 7, y + (h - 7) / 2 | 0, th.hi, { shadow: false });
    const clicked = hover && m.leftPressed;
    if (clicked) A.tone(900, { type: 'square', dur: 0.03, vol: 0.06 });
    return { hover, clicked };
  }

  /* A chunky console key/button. */
  function key(ctx, x, y, w, h, label, th, opts) {
    opts = opts || {};
    const m = PD.input.mouse;
    const on = opts.enabled !== false;
    const hover = on && m.inside && m.x >= x && m.x < x + w && m.y >= y && m.y < y + h;
    ctx.fillStyle = hover ? th.mid : (on ? th.lo : '#1a1a1a');
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = on ? (hover ? th.hi : th.mid) : '#333';
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    F.draw(ctx, label, x + w / 2, y + (h - 7) / 2 | 0, on ? (hover ? '#ffffff' : th.hi) : '#555', { center: true, shadow: false });
    const clicked = hover && m.leftPressed;
    if (clicked) A.sfx.click();
    return clicked;
  }

  function bar(ctx, x, y, w, h, frac, th) {
    ctx.fillStyle = th.lo; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = th.hi; ctx.fillRect(x, y, Math.round(w * U.clamp(frac, 0, 1)), h);
  }

  /* ---------------------------------------------------------------- market */
  function appMarket(ctx, g, th, t) {
    state.view = state.view || 'raw';
    const Gd = PD.glyph;
    // two tabs: raw ore / refined goods, as glyph keys
    const tabKey = (x, glyph, id) => {
      const on = state.view === id;
      const hot = PD.input.mouse.inside && PD.input.mouse.x >= x && PD.input.mouse.x < x + 30 && PD.input.mouse.y >= IY - 4 && PD.input.mouse.y < IY + 12;
      ctx.fillStyle = on ? th.mid : (hot ? th.lo : '#000'); ctx.fillRect(x, IY - 4, 30, 16);
      ctx.strokeStyle = on ? th.hi : th.mid; ctx.strokeRect(x + 0.5, IY - 3.5, 29, 15);
      Gd.draw(ctx, glyph, x + 8, IY - 3, '#ffffff', th.hi);
      if (hot && PD.input.mouse.leftPressed) { state.view = id; A.sfx.click(); }
    };
    tabKey(IX, 'ore', 'raw'); tabKey(IX + 34, 'machine', 'goods');
    const isRaw = state.view === 'raw';

    // fee and broker shown as glyph + number
    const fee = Math.round(D.appraiseFee(g.save.upg.appraise || 0) * 100);
    F.draw(ctx, 'FEE -' + fee + '%   BROKER +' + Math.round((D.UPG.crew.value(g.save.upg.crew || 0) - 1) * 100) + '%', IX + 80, IY + 1, th.mid, { shadow: false });

    const entry = k => {
      if (isRaw) { const m = D.MAT[k]; return { cr: m.cr, c: m.c }; }
      if (k.indexOf('raw:') === 0) { const m = D.MAT[+k.slice(4)]; return { cr: m.cr, c: m.c }; }
      const gd = D.goodFromKey(k); return gd ? { cr: gd.cr, c: gd.c } : null;
    };
    let keys;
    if (isRaw) {
      const set = {};
      for (const k in g.save.vault) if (g.save.vault[k] > 0) set[k] = 1;
      for (const k in g.save.appr) if (g.save.appr[k] > 0) set[k] = 1;
      keys = Object.keys(set).sort((a, b) => D.MAT[b].cr - D.MAT[a].cr);
    } else keys = Object.keys(g.save.goods || {}).filter(k => g.save.goods[k] > 0 && entry(k)).sort((a, b) => entry(b).cr - entry(a).cr);

    // column glyphs
    const hy = IY + 16;
    F.draw(ctx, isRaw ? 'ORE' : 'GOODS', IX, hy + 3, th.mid, { shadow: false });
    if (isRaw) { F.draw(ctx, 'WAITING', IX + 100, hy + 3, th.mid, { shadow: false }); F.draw(ctx, 'READY', IX + 170, hy + 3, th.mid, { shadow: false }); }
    else F.draw(ctx, 'READY', IX + 170, hy + 3, th.mid, { shadow: false });
    F.draw(ctx, 'EACH', IX + 226, hy + 3, th.mid, { shadow: false }); F.draw(ctx, 'TOTAL', IX + 282, hy + 3, th.mid, { shadow: false });
    ctx.fillStyle = th.lo; ctx.fillRect(IX, hy + 16, IW, 1);

    if (!keys.length) Gd.draw(ctx, isRaw ? 'ore' : 'machine', IX + IW / 2 - 7, IY + 70, th.lo, th.lo, 2);

    let total = 0;
    const maxRows = 8;
    const appMat = g.appraising();
    for (let i = 0; i < Math.min(keys.length, maxRows); i++) {
      const k = keys[i], e = entry(k);
      const ready = isRaw ? (g.save.appr[k] || 0) : g.save.goods[k];
      const raw = isRaw ? (g.save.vault[k] || 0) : 0;
      const unit = Math.round(e.cr * (isRaw ? g.saleMult() : g.valueMult()));
      const val = unit * ready;
      total += val;
      const y = IY + 36 + i * 15;
      const r = row(ctx, IX, y, IW, 14, th);
      ctx.fillStyle = e.c[1]; ctx.fillRect(IX + 3, y + 3, 8, 8); ctx.fillStyle = e.c[0]; ctx.fillRect(IX + 3, y + 3, 8, 3);
      if (!isRaw) { ctx.fillStyle = '#ffffff'; ctx.fillRect(IX + 6, y + 6, 2, 2); }
      F.draw(ctx, (isRaw ? D.MAT[k].name : (D.goodFromKey(k) || { name: D.MAT[+k.slice(4)].name }).name).toUpperCase().slice(0, 14), IX + 14, y + 4, th.hi, { shadow: false });
      if (isRaw) {
        // raw count + the appraisal bar for the lot being valued
        F.draw(ctx, String(raw), IX + 120, y + 4, raw ? '#ffb03d' : th.lo, { shadow: false });
        if (+k === appMat) { ctx.fillStyle = th.lo; ctx.fillRect(IX + 138, y + 5, 26, 4); ctx.fillStyle = '#ffb03d'; ctx.fillRect(IX + 138, y + 5, Math.round(26 * g.apprFrac()), 4); }
      }
      F.draw(ctx, String(ready), IX + 170, y + 4, ready ? th.hi : th.lo, { shadow: false });
      F.draw(ctx, U.fmt(unit), IX + 226, y + 4, th.mid, { shadow: false });
      F.draw(ctx, U.fmt(val), IX + 282, y + 4, ready ? th.hi : th.lo, { shadow: false });
      // sell keys: one / all, as glyphs
      const sx = IX + IW - 66;
      if (key(ctx, sx, y, 30, 14, '1', th, { enabled: ready > 0 })) (isRaw ? g.sellFromVault(+k, 1) : g.sellGood(k, 1));
      if (key(ctx, sx + 34, y, 30, 14, 'ALL', th, { enabled: ready > 0 })) (isRaw ? g.sellFromVault(+k, ready) : g.sellGood(k, ready));

    }
    for (let i = maxRows; i < keys.length; i++) total += Math.round(entry(keys[i]).cr * (isRaw ? g.saleMult() : g.valueMult())) * (isRaw ? (g.save.appr[keys[i]] || 0) : g.save.goods[keys[i]]);

    ctx.fillStyle = th.lo; ctx.fillRect(IX, IY + IH - 24, IW, 1);
    Gd.stat(ctx, 'coin', U.fmt(total), IX, IY + IH - 18, '#ffd34d', '#b8860b', th.hi);
    if (key(ctx, IX + IW - 72, IY + IH - 20, 70, 16, '', th, { enabled: total > 0 })) { if (isRaw) g.sellAll(); else g.sellAllGoods(); }
    F.draw(ctx, 'SELL ALL', IX + IW - 37, IY + IH - 16, total ? '#ffffff' : '#3a3030', { center: true, shadow: false });
  }

  /* ------------------------------------------------------------ fabricator */
  function appFab(ctx, g, th, t) {
    const list = D.UPGRADES;
    const perPage = 6;
    const page = U.clamp(state.scroll, 0, Math.max(0, Math.ceil(list.length / perPage) - 1));
    state.scroll = page;

    F.draw(ctx, 'MODULE                     STATE        COST', IX, IY, th.mid, { shadow: false });
    ctx.fillStyle = th.lo; ctx.fillRect(IX, IY + 9, IW, 1);

    for (let i = 0; i < perPage; i++) {
      const idx = page * perPage + i;
      if (idx >= list.length) break;
      const u = list[idx];
      const lvl = g.save.upg[u.id] || 0;
      const maxed = lvl >= u.max;
      const cost = D.upgradeCost(u, lvl);
      const rec = maxed ? [] : D.recipe(u, lvl);
      const haveAll = rec.every(r => (g.save.vault[r.mat] || 0) >= r.qty);
      const canAfford = g.save.credits >= cost && haveAll;
      const y = IY + 14 + i * 26;

      const r = row(ctx, IX, y, IW, 25, th, { active: state.sel === idx });
      if (r.clicked) state.sel = idx;

      ctx.drawImage(PD.art.ICON[u.icon], IX + 2, y + 4);
      F.draw(ctx, u.name, IX + 20, y + 3, maxed ? th.mid : th.hi, { shadow: false });
      F.draw(ctx, u.show(lvl), IX + 20, y + 14, th.mid, { shadow: false });
      F.draw(ctx, 'LV' + lvl + '/' + u.max, IX + 150, y + 3, th.mid, { shadow: false });
      bar(ctx, IX + 150, y + 14, 40, 4, lvl / u.max, th);

      if (maxed) {
        F.draw(ctx, 'MAXED', IX + 210, y + 8, th.hi, { shadow: false });
      } else {
        // requirement chips: credits then ore
