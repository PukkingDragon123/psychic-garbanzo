        F.draw(ctx, '$' + U.fmt(cost), IX + 206, y + 3,
          g.save.credits >= cost ? th.hi : '#ff5a4d', { shadow: false });
        let cxp = IX + 206;
        for (const req of rec) {
          const have = g.save.vault[req.mat] || 0;
          const ok = have >= req.qty;
          const m = D.MAT[req.mat];
          ctx.fillStyle = m.c[1]; ctx.fillRect(cxp, y + 15, 5, 5);
          F.draw(ctx, have + '/' + req.qty, cxp + 7, y + 14, ok ? th.hi : '#ff5a4d', { shadow: false });
          cxp += 8 + F.width(have + '/' + req.qty, 1) + 6;
        }
        if (key(ctx, IX + IW - 62, y + 5, 60, 15, 'FABRICATE', th, { enabled: canAfford })) g.fabricate(u.id);
      }
      if (r.hover) state.tip = u.blurb.toUpperCase();
    }

    const pages = Math.ceil(list.length / perPage);
    if (key(ctx, IX, IY + IH - 16, 46, 14, '< PREV', th, { enabled: page > 0 })) state.scroll--;
    if (key(ctx, IX + 50, IY + IH - 16, 46, 14, 'NEXT >', th, { enabled: page < pages - 1 })) state.scroll++;
    F.draw(ctx, 'PAGE ' + (page + 1) + '/' + pages, IX + 104, IY + IH - 13, th.mid, { shadow: false });
  }

  /* -------------------------------------------------------------- drone bay */
  function appBay(ctx, g, th, t) {
    const n = g.save.upg.drones || 0;
    const yieldLv = g.save.upg.droneyield || 0;
    F.draw(ctx, 'AUTONOMOUS SALVAGE SWARM', IX, IY, th.hi, { shadow: false });
    F.draw(ctx, 'THEY STRIP THE RUBBLE WHILE YOU FLY.', IX, IY + 11, th.mid, { shadow: false });

    // live swarm readout
    const spr = PD.art.sprites.drone;
    for (let i = 0; i < Math.min(n, 24); i++) {
      const col = i % 12, rw = (i / 12) | 0;
      const bob = Math.sin(t * 3 + i) * 2;
      ctx.drawImage(spr.frames[(Math.floor(t * 10) + i) % 2],
        IX + col * 17, IY + 26 + rw * 16 + bob | 0);
    }
    if (n === 0) F.draw(ctx, 'NO UNITS DEPLOYED.', IX, IY + 30, '#ff5a4d', { shadow: false });
    if (n > 24) F.draw(ctx, '+' + (n - 24) + ' MORE IN THE RACKS', IX, IY + 58, th.mid, { shadow: false });

    const boxY = IY + 74;
    ctx.fillStyle = th.lo; ctx.fillRect(IX, boxY, IW, 1);
    F.draw(ctx, 'UNITS', IX, boxY + 8, th.mid, { shadow: false });
    F.draw(ctx, String(n), IX + 60, boxY + 8, th.hi, { shadow: false });
    F.draw(ctx, 'YIELD', IX, boxY + 20, th.mid, { shadow: false });
    F.draw(ctx, 'X' + (1 + yieldLv * 0.55).toFixed(2), IX + 60, boxY + 20, th.hi, { shadow: false });
    F.draw(ctx, 'INCOME', IX, boxY + 32, th.mid, { shadow: false });
    F.draw(ctx, '$' + U.fmt(g.droneIncome()) + ' /SEC', IX + 60, boxY + 32, th.hi, { shadow: false });
    F.draw(ctx, '$' + U.fmt(g.droneIncome() * 60) + ' /MIN', IX + 150, boxY + 32, th.mid, { shadow: false });

    const mk = (id, label, y) => {
      const u = D.UPG[id];
      const lvl = g.save.upg[id] || 0;
      const cost = D.upgradeCost(u, lvl);
      const rec = D.recipe(u, lvl);
      const haveAll = rec.every(r => (g.save.vault[r.mat] || 0) >= r.qty);
      const ok = lvl < u.max && g.save.credits >= cost && haveAll;
      F.draw(ctx, label, IX + 200, y, th.mid, { shadow: false });
      let cxp = IX + 200;
      F.draw(ctx, '$' + U.fmt(cost), cxp, y + 10, g.save.credits >= cost ? th.hi : '#ff5a4d', { shadow: false });
      cxp += F.width('$' + U.fmt(cost), 1) + 8;
      for (const req of rec) {
        const have = g.save.vault[req.mat] || 0;
        ctx.fillStyle = D.MAT[req.mat].c[1]; ctx.fillRect(cxp, y + 11, 5, 5);
        F.draw(ctx, have + '/' + req.qty, cxp + 7, y + 10, have >= req.qty ? th.hi : '#ff5a4d', { shadow: false });
        cxp += 8 + F.width(have + '/' + req.qty, 1) + 5;
      }
      if (key(ctx, IX + IW - 62, y, 60, 15, lvl >= u.max ? 'MAXED' : 'BUILD', th, { enabled: ok })) g.fabricate(id);
    };
    mk('drones', 'ADD DRONE UNIT', boxY + 4);
    mk('droneyield', 'UPGRADE CLAWS', boxY + 30);
  }

  /* ---------------------------------------------------------------- vanity */
  function appVanity(ctx, g, th, t) {
    const cats = D.COSMETICS;
    state.cat = U.clamp(state.cat, 0, cats.length - 1);
    for (let i = 0; i < cats.length; i++) {
      if (key(ctx, IX + i * 86, IY, 82, 14, cats[i].name, th, { enabled: true })) { state.cat = i; A.sfx.click(); }
      if (state.cat === i) { ctx.fillStyle = th.hi; ctx.fillRect(IX + i * 86, IY + 14, 82, 1); }
    }
    const cat = cats[state.cat];
    F.draw(ctx, cat.blurb, IX, IY + 20, th.mid, { shadow: false });

    for (let i = 0; i < cat.options.length; i++) {
      const o = cat.options[i];
      const y = IY + 30 + i * 14;
      const owned = o.cost === 0 || (g.save.owned[cat.id] || {})[o.id];
      const worn = (g.save.cos[cat.id] || cat.options[0].id) === o.id;
      const r = row(ctx, IX, y, IW - 116, 13, th, { active: worn });
      for (let k = 0; k < 3; k++) { ctx.fillStyle = o.c[k]; ctx.fillRect(IX + 2 + k * 7, y + 3, 6, 7); }
      F.draw(ctx, o.name, IX + 26, y + 3, worn ? '#ffffff' : th.hi, { shadow: false });
      if (worn) F.draw(ctx, 'WORN', IX + 158, y + 3, th.hi, { shadow: false });
      else if (owned) F.draw(ctx, 'OWNED', IX + 158, y + 3, th.mid, { shadow: false });
      else F.draw(ctx, '$' + U.fmt(o.cost), IX + 158, y + 3, g.save.credits >= o.cost ? th.hi : '#ff5a4d', { shadow: false });
      if (r.clicked) {
        if (owned) g.equipCosmetic(cat.id, o.id);
        else g.buyCosmetic(cat.id, o.id);
      }
    }

    // live mannequin
    const skin = PD.art.skinFor(g.save.cos);
    const bx = IX + IW - 50, by = IY + 88;
    ctx.fillStyle = th.lo; ctx.fillRect(bx - 34, by - 68, 72, 104);
    ctx.strokeStyle = th.mid; ctx.strokeRect(bx - 33.5, by - 67.5, 71, 103);
    for (let i = 0; i < 6; i++) { ctx.fillStyle = th.mid; ctx.fillRect(bx - 32, by - 66 + i * 17, 68, 1); }
    const al = skin.alien, dr = skin.drill;
    ctx.save();
    ctx.translate(bx, by + Math.sin(t * 2) * 2);
    ctx.rotate(0.5);
    ctx.drawImage(dr.frames[Math.floor(t * 10) % dr.frames.length], -dr.ox * 1.4 | 0, -dr.oy * 1.4 | 0, dr.w * 1.4, dr.h * 1.4);
    ctx.restore();
    ctx.drawImage(al.frames[0], 0, 0, al.w, al.h,
      bx - al.ox * 1.6 | 0, by + Math.sin(t * 2) * 2 - al.oy * 1.6 | 0, al.w * 1.6, al.h * 1.6);
    F.draw(ctx, 'PREVIEW', bx, by + 40, th.mid, { center: true, shadow: false });

    // the dossier: who the galaxy thinks you are now
    const dy = IY + 126;
    ctx.fillStyle = th.lo; ctx.fillRect(IX, dy, IW - 108, 1);
    F.draw(ctx, 'GALACTIC DOSSIER', IX, dy + 6, th.hi, { shadow: false });
    F.draw(ctx, 'KNOWN AS', IX, dy + 20, th.mid, { shadow: false });
    F.draw(ctx, D.titleFor(g.save.dominion), IX + 78, dy + 20, '#ffffff', { shadow: false });
    F.draw(ctx, 'BOUNTY', IX, dy + 31, th.mid, { shadow: false });
    F.draw(ctx, '$' + U.fmt(D.bountyFor(g.save)), IX + 78, dy + 31, '#ff5a4d', { shadow: false });
    F.draw(ctx, 'WORLDS ENDED', IX, dy + 42, th.mid, { shadow: false });
    F.draw(ctx, String(g.save.destroyed.filter(Boolean).length), IX + 78, dy + 42, th.hi, { shadow: false });
    F.draw(ctx, 'GALAXY HELD', IX, dy + 53, th.mid, { shadow: false });
    F.draw(ctx, g.save.dominion.toFixed(1) + '%', IX + 78, dy + 53, th.hi, { shadow: false });
    bar(ctx, IX + 120, dy + 54, 96, 5, g.save.dominion / 100, th);
  }

  /* ------------------------------------------------------------------- nav */
  function appNav(ctx, g, th, t) {
    F.draw(ctx, 'WORLD', IX, IY, th.mid, { shadow: false }); F.draw(ctx, 'GRAV', IX + 222, IY, th.mid, { shadow: false }); F.draw(ctx, 'BOUNTY', IX + 254, IY, th.mid, { shadow: false }); F.draw(ctx, 'DIVE', IX + IW - 36, IY, th.mid, { shadow: false });
    ctx.fillStyle = th.lo; ctx.fillRect(IX, IY + 9, IW, 1);
    for (let i = 0; i < D.BODIES.length; i++) {
      const b = D.BODIES[i];
      const y = IY + 14 + i * 14;
      const unlocked = i <= g.save.unlocked;
      const done = g.save.destroyed[i];
      const here = i === g.bodyIndex;
      const r = row(ctx, IX, y, IW, 13, th, { active: here, enabled: unlocked });

      // a tiny live rendering of the target
      const moon = g.navIcon(i);
      if (unlocked && moon) ctx.drawImage(moon, 0, 0, moon.width, moon.height, IX + 2, y + 1, 11, 11);
      else { ctx.fillStyle = th.lo; ctx.fillRect(IX + 3, y + 3, 9, 9); }

      F.draw(ctx, unlocked ? b.name : '???', IX + 16, y + 4, unlocked ? (done ? th.mid : th.hi) : th.lo, { shadow: false });
      F.draw(ctx, unlocked ? String(b.gravity) : '--', IX + 226, y + 4, th.mid, { shadow: false });
      if (done) PD.glyph.draw(ctx, 'check', IX + 254, y - 1, th.mid, th.lo);
      else if (unlocked) F.draw(ctx, U.fmt(b.reward), IX + 254, y + 4, th.hi, { shadow: false });
      else PD.glyph.draw(ctx, 'lock', IX + 254, y - 1, th.lo, th.lo);
      if (here) F.draw(ctx, 'HERE', IX + IW - 24, y + 4, '#ffffff', { center: true, shadow: false });
      else if (unlocked) {
        if (key(ctx, IX + IW - 44, y, 42, 13, 'DIVE', th)) g.travelTo(i);
      }
      if (r.hover && unlocked) { state.tip = b.blurb.toUpperCase(); state.sel = i; }
    }

    // survey panel for whichever world is selected
    const sel = D.BODIES[U.clamp(state.sel, 0, g.save.unlocked)];
    const py = IY + 14 + D.BODIES.length * 14 + 4;
    ctx.fillStyle = th.lo; ctx.fillRect(IX, py, IW, 1);
    F.draw(ctx, sel.name, IX, py + 4, th.hi, { shadow: false });
    let sx2 = IX + 150;
    sx2 += PD.glyph.stat(ctx, 'planet', sel.radius, sx2, py, th.mid, th.lo) + 10;
    sx2 += PD.glyph.stat(ctx, 'weight', sel.gravity, sx2, py, th.mid, th.lo) + 10;
    sx2 += PD.glyph.stat(ctx, 'skull', Math.round(sel.enemyRate * 100) + '%', sx2, py, th.mid, th.lo) + 10;
    PD.glyph.stat(ctx, 'star', U.fmt(sel.reward), sx2, py, '#ffd34d', '#b8860b');
    // one stacked bar for the ore signature, with a legend underneath
    const tw = sel.ores.reduce((n, o) => n + o[1], 0);
    const sorted = sel.ores.slice().sort((a, b) => b[1] - a[1]);
    let ox2 = IX;
    for (const [mid, wt] of sorted) {
      const wpx = Math.max(2, Math.round(wt / tw * IW));
      ctx.fillStyle = D.MAT[mid].c[1];
      ctx.fillRect(ox2, py + 14, wpx, 7);
      ctx.fillStyle = D.MAT[mid].c[0];
      ctx.fillRect(ox2, py + 14, wpx, 2);
      ox2 += wpx;
    }
    for (let i = 0; i < Math.min(6, sorted.length); i++) {
      const m = D.MAT[sorted[i][0]];
      const lx = IX + i * 62;
      ctx.fillStyle = m.c[1];
      ctx.fillRect(lx, py + 25, 5, 5);
      F.draw(ctx, Math.round(sorted[i][1] / tw * 100) + '%', lx + 8, py + 24, th.mid, { shadow: false });
    }
  }

  const APPS = { market: appMarket, fab: appFab, bay: appBay, vanity: appVanity, nav: appNav,
    refinery: (ctx, g, th, t) => PD.factory.app(ctx, g, th, t),
    skills: (ctx, g, th, t) => PD.skilltree.app(ctx, g, th, t) };

  /* ------------------------------------------------------------------ draw */
  function draw(ctx, g, dt) {
    if (!state.app) return;
    state.t += dt;
    state.boot = Math.min(1, state.boot + dt * 2.4);
    state.msgT = Math.max(0, state.msgT - dt);
    const th = THEME[state.app];
    const t = state.t;
    state.tip = '';

    chrome(ctx, th, th.name, '$' + U.fmt(g.save.credits));

    if (state.boot < 1) {
      // boot sequence types itself in before the app appears
      const lines = BOOT[state.app];
      const shown = Math.floor(state.boot * lines.length * 1.4);
      for (let i = 0; i < Math.min(lines.length, shown + 1); i++) {
        const full = lines[i];
        const chars = i < shown ? full.length : Math.floor((state.boot * lines.length * 1.4 - shown) * 26);
        F.draw(ctx, '> ' + full.slice(0, chars), IX, IY + i * 11, th.hi, { shadow: false });
        if (i === Math.min(lines.length - 1, shown)) cursor(ctx, IX + F.width('> ' + full.slice(0, chars), 1) + 1, IY + i * 11, th, t);
      }
    } else {
      APPS[state.app](ctx, g, th, t);
    }

    // status line + disconnect
    if (state.tip) {
      if (Array.isArray(state.tip)) { let gx = SX + 6; for (const gname of state.tip) { PD.glyph.draw(ctx, gname, gx, SY + SH - 14, th.hi, th.mid); gx += 16; } }
      else F.draw(ctx, state.tip, SX + 6, SY + SH - 11, th.mid, { shadow: false });
    } else if (state.msgT > 0) {
      ctx.globalAlpha = U.clamp(state.msgT, 0, 1);
      if (Array.isArray(state.msg)) {
        let gx = SX + 6;
        for (const gname of state.msg) { PD.glyph.draw(ctx, gname, gx, SY + SH - 14, state.msgCol || th.hi, th.mid); gx += 16; }
        if (state.msgNum !== undefined) F.draw(ctx, state.msgNum, gx + 2, SY + SH - 11, state.msgCol || th.hi, { shadow: false });
      } else F.draw(ctx, state.msg, SX + 6, SY + SH - 11, state.msgCol || th.hi, { shadow: false });
      ctx.globalAlpha = 1;
    } else {
      F.draw(ctx, FOOT[state.app] || 'LINK STABLE', SX + 6, SY + SH - 11, th.mid, { shadow: false });
    }
    if (key(ctx, SX + SW - 74, SY + SH - 13, 70, 11, 'CLOSE  [ESC]', th)) close();

    glassOver(ctx, th, t);
  }

  PD.term = {
    open, close, draw, say, key, row, chrome, glassOver, THEME,
    rect: { SX, SY, SW, SH, IX, IY, IW, IH },
    get app() { return state.app; },
    get booting() { return state.boot < 1; },
    state
  };
})(window.PD);

/* ===== src/factory.js ===== */
/* The refinery deck: a Factorio-flavoured grid aboard the ship.
   Hoppers pull raw ore out of the bin, belts carry it, machines turn it into
   goods worth multiples of the raw price, depots bank the result. It ticks in
   real time whenever the game does, so it earns while you are down a hole. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const F = PD.font;
  const A = PD.audio;

  const COLS = 12, ROWS = 6, CELL = 26;
  const BELT_TIME = 0.5;
  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];      // right, down, left, up
  const ARROW = ['>', 'V', '<', '^'];

  const state = { tool: 'belt', hover: -1, acc: 0, produced: 0, msgT: 0 };

  function ensure(save) {
    if (!save.factory) save.factory = { cells: new Array(COLS * ROWS).fill(null), produced: 0 };
    if (!save.goods) save.goods = {};
    // runtime item state lives beside the saved layout
    if (!save.factory.rt) save.factory.rt = new Array(COLS * ROWS).fill(null).map(() => ({ item: null, prog: 0, buf: [], work: 0 }));
    return save.factory;
  }

  const idx = (cx, cy) => cy * COLS + cx;
  const inb = (cx, cy) => cx >= 0 && cy >= 0 && cx < COLS && cy < ROWS;

  /* --------------------------------------------------------------- recipes */
  function isMetal(mat) { return D.METALS.indexOf(D.MAT[mat].key) >= 0; }
  function isGem(mat) { return D.GEMS.indexOf(D.MAT[mat].key) >= 0; }
  function isJunk(mat) { return D.JUNK.indexOf(D.MAT[mat].key) >= 0; }

  /* Can this machine take the item? Items are numbers (raw) or good keys. */
  function accepts(cell, item) {
    const kind = D.MACHINES[cell.t].kind;
    if (kind === 'smelt') return typeof item === 'number' && isMetal(item);
    if (kind === 'crush') return typeof item === 'number' && isJunk(item);
    if (kind === 'cut') return typeof item === 'number' && isGem(item);
    if (kind === 'alloy') return typeof item === 'string' && item.indexOf('ingot:') === 0;
    return false;
  }

  function produce(cell, rt) {
    const kind = D.MACHINES[cell.t].kind;
    if (kind === 'smelt') return D.goodOf('ingot', rt.buf.shift()).key;
    if (kind === 'crush') return D.goodOf('conc', rt.buf.shift()).key;
    if (kind === 'cut') return D.goodOf('cut', rt.buf.shift()).key;
    if (kind === 'alloy') {
      const a = +rt.buf.shift().split(':')[1], b = +rt.buf.shift().split(':')[1];
      return D.goodOf('alloy', a, b).key;
    }
    return null;
  }

  /* An alloy forge needs two different ingots waiting. */
  function ready(cell, rt) {
    const kind = D.MACHINES[cell.t].kind;
    if (kind === 'alloy') return rt.buf.length >= 2 && rt.buf[0] !== rt.buf[1];
    return rt.buf.length >= 1;
  }

  /* -------------------------------------------------------------------- sim */
  function tryPush(f, save, from, item) {
    const cell = f.cells[from];
    const cx = from % COLS, cy = (from / COLS) | 0;
    const [dx, dy] = DIRS[cell.d || 0];
    const nx = cx + dx, ny = cy + dy;
    if (!inb(nx, ny)) return false;
    const to = idx(nx, ny);
    const tc = f.cells[to];
    if (!tc) return false;
    const trt = f.rt[to];
    if (tc.t === 'belt') {
      if (trt.item !== null) return false;
      trt.item = item; trt.prog = 0;
      return true;
    }
    if (tc.t === 'depot') {
      const key = typeof item === 'number' ? 'raw:' + item : item;
      save.goods[key] = (save.goods[key] || 0) + 1;
      f.produced = (f.produced || 0) + 1;
      state.produced++;
      return true;
    }
    if (tc.t === 'hopper') return false;
    if (accepts(tc, item) && trt.buf.length < 3) { trt.buf.push(item); return true; }
    return false;
  }

  function step(f, save, dt) {
    // machines first, then belts from the far end so items flow without gaps
    for (let i = 0; i < f.cells.length; i++) {
      const c = f.cells[i]; if (!c) continue;
      const rt = f.rt[i];
      const def = D.MACHINES[c.t];
      if (c.t === 'hopper') {
        rt.work += dt;
        if (rt.work >= 1.2 && c.filter !== undefined && (save.vault[c.filter] || 0) > 0) {
          if (tryPush(f, save, i, c.filter)) {
            save.vault[c.filter]--;
            if (save.vault[c.filter] <= 0) delete save.vault[c.filter];
            rt.work = 0;
          }
        }
      } else if (def.kind) {
        if (rt.item === null && ready(c, rt)) {
          rt.work += dt;
          if (rt.work >= def.time) { rt.item = produce(c, rt); rt.work = 0; }
        }
        if (rt.item !== null && tryPush(f, save, i, rt.item)) rt.item = null;
      }
    }
    const order = [];
    for (let i = 0; i < f.cells.length; i++) if (f.cells[i] && f.cells[i].t === 'belt' && f.rt[i].item !== null) order.push(i);
    // belts whose target is free move first: two passes is enough for short lines
    for (let pass = 0; pass < 2; pass++) {
      for (const i of order) {
        const rt = f.rt[i];
        if (rt.item === null) continue;
        rt.prog = Math.min(BELT_TIME, rt.prog + (pass === 0 ? dt : 0));
        if (rt.prog >= BELT_TIME && tryPush(f, save, i, rt.item)) { rt.item = null; rt.prog = 0; }
      }
    }
  }

  function tick(dt, g) {
    const f = ensure(g.save);
    state.acc += dt;
    while (state.acc >= 0.1) { step(f, g.save, 0.1); state.acc -= 0.1; }
    state.msgT = Math.max(0, state.msgT - dt);
  }

  /* --------------------------------------------------------------- editing */
  function place(g, cx, cy, tool) {
    const f = ensure(g.save);
    const i = idx(cx, cy);
    const cur = f.cells[i];
    if (tool === 'erase') {
      if (!cur) return;
      g.save.credits += Math.round(D.MACHINES[cur.t].cost * 0.5);
      f.cells[i] = null; f.rt[i] = { item: null, prog: 0, buf: [], work: 0 };
      A.sfx.click();
      return;
    }
    if (cur && cur.t === tool) {
      if (tool === 'belt') { cur.d = ((cur.d || 0) + 1) % 4; A.sfx.click(); return; }
      if (tool === 'hopper') { cycleFilter(g, cur); return; }
      if (D.MACHINES[tool].kind) { cur.d = ((cur.d || 0) + 1) % 4; A.sfx.click(); return; }
      return;
    }
    const cost = D.MACHINES[tool].cost;
    if (g.save.credits < cost) { A.sfx.deny(); PD.term.say('NEED $' + U.fmt(cost) + ' FOR ' + D.MACHINES[tool].name.toUpperCase(), '#ff5a4d'); return; }
    if (cur) g.save.credits += Math.round(D.MACHINES[cur.t].cost * 0.5);
    g.save.credits -= cost;
    f.cells[i] = { t: tool, d: 0 };
    f.rt[i] = { item: null, prog: 0, buf: [], work: 0 };
    if (tool === 'hopper') cycleFilter(g, f.cells[i], true);
    A.sfx.buy();
  }

  /* Hopper filter cycles through whatever is actually in the bin. */
  function cycleFilter(g, cell, silent) {
    const mats = Object.keys(g.save.vault).map(Number).filter(m => (g.save.vault[m] || 0) > 0).sort((a, b) => a - b);
    if (!mats.length) { cell.filter = undefined; if (!silent) PD.term.say('BIN IS EMPTY -- NOTHING TO FEED', '#ff5a4d'); return; }
    const i = mats.indexOf(cell.filter);
    cell.filter = mats[(i + 1) % mats.length];
    if (!silent) A.sfx.click();
  }

  /* ---------------------------------------------------------------- drawing */
  function itemColor(item) {
    if (typeof item === 'number') return D.MAT[item].c;
    const gd = D.goodFromKey(item);
    return gd ? gd.c : ['#fff', '#aaa', '#555'];
  }

  function drawItem(ctx, item, x, y) {
    const c = itemColor(item);
    const refined = typeof item === 'string';
    ctx.fillStyle = c[1]; ctx.fillRect(x - 3, y - 3, 6, 6);
    ctx.fillStyle = c[0]; ctx.fillRect(x - 3, y - 3, 6, 2);
    if (refined) { ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 1, y - 1, 2, 2); }
  }

  function app(ctx, g, th, t) {
    const R = PD.term.rect;
    const f = ensure(g.save);
    const gx = R.IX, gy = R.IY + 12;

    F.draw(ctx, 'REFINERY DECK  //  BIN -> BELTS -> MACHINES -> DEPOT', gx, R.IY, th.mid, { shadow: false });

    // grid
    ctx.fillStyle = '#0a0808';
    ctx.fillRect(gx - 1, gy - 1, COLS * CELL + 2, ROWS * CELL + 2);
    for (let cy = 0; cy < ROWS; cy++) for (let cx = 0; cx < COLS; cx++) {
      const x = gx + cx * CELL, y = gy + cy * CELL;
      ctx.fillStyle = (cx + cy) % 2 ? '#16110e' : '#1a1410';
      ctx.fillRect(x, y, CELL, CELL);
      ctx.fillStyle = th.lo; ctx.fillRect(x, y, CELL, 1); ctx.fillRect(x, y, 1, CELL);
    }

    const m = PD.input.mouse;
    const hx = Math.floor((m.x - gx) / CELL), hy = Math.floor((m.y - gy) / CELL);
    const hovering = m.inside && inb(hx, hy) && m.x >= gx && m.y >= gy;
    state.hover = hovering ? idx(hx, hy) : -1;

    // cells
    for (let i = 0; i < f.cells.length; i++) {
      const c = f.cells[i]; if (!c) continue;
      const cx = i % COLS, cy = (i / COLS) | 0;
      const x = gx + cx * CELL, y = gy + cy * CELL;
      const def = D.MACHINES[c.t];
      const rt = f.rt[i];
      if (c.t === 'belt') {
        ctx.fillStyle = '#2a2a36'; ctx.fillRect(x + 3, y + 3, CELL - 6, CELL - 6);
        // moving chevrons
        const [dx, dy] = DIRS[c.d || 0];
        for (let k = 0; k < 3; k++) {
          const ph = ((t * 2 + k / 3) % 1);
          const px = x + CELL / 2 + dx * (ph - 0.5) * (CELL - 10), py = y + CELL / 2 + dy * (ph - 0.5) * (CELL - 10);
          ctx.fillStyle = th.mid; ctx.globalAlpha = 0.7;
          ctx.fillRect(px - 1, py - 1, 3, 3);
        }
        ctx.globalAlpha = 1;
        if (rt.item !== null) {
          const p2 = rt.prog / BELT_TIME;
          drawItem(ctx, rt.item, x + CELL / 2 + dx * (p2 - 0.5) * (CELL - 8), y + CELL / 2 + dy * (p2 - 0.5) * (CELL - 8));
        }
      } else {
        ctx.fillStyle = def.col; ctx.globalAlpha = 0.28; ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4); ctx.globalAlpha = 1;
        ctx.strokeStyle = def.col; ctx.strokeRect(x + 2.5, y + 2.5, CELL - 5, CELL - 5);
        F.draw(ctx, def.name.slice(0, 3).toUpperCase(), x + CELL / 2, y + 5, def.col, { center: true, shadow: false });
        if (c.t === 'hopper') {
          if (c.filter !== undefined) drawItem(ctx, c.filter, x + CELL / 2, y + 16);
          else F.draw(ctx, '?', x + CELL / 2, y + 14, '#ff5a4d', { center: true, shadow: false });
        } else if (c.t === 'depot') {
          ctx.fillStyle = th.hi; ctx.globalAlpha = 0.4 + 0.3 * Math.sin(t * 4 + i);
          ctx.fillRect(x + 8, y + 15, CELL - 16, 4); ctx.globalAlpha = 1;
        } else {
          // progress + buffer dots
          const frac = ready(c, rt) || rt.item !== null ? Math.min(1, rt.work / def.time) : 0;
          ctx.fillStyle = '#000'; ctx.fillRect(x + 5, y + 19, CELL - 10, 3);
          ctx.fillStyle = def.col; ctx.fillRect(x + 5, y + 19, Math.round((CELL - 10) * frac), 3);
          for (let k = 0; k < rt.buf.length; k++) drawItem(ctx, rt.buf[k], x + 7 + k * 6, y + 14);
          if (rt.item !== null) drawItem(ctx, rt.item, x + CELL - 6, y + 14);
        }
        if (c.t !== 'depot' && c.t !== 'belt') {
          // output direction nub
          const [dx, dy] = DIRS[c.d || 0];
          ctx.fillStyle = def.col;
          ctx.fillRect(x + CELL / 2 + dx * (CELL / 2 - 3) - 1, y + CELL / 2 + dy * (CELL / 2 - 3) - 1, 3, 3);
        }
      }
    }

    // hover + click
    if (hovering) {
      const x = gx + hx * CELL, y = gy + hy * CELL;
      ctx.strokeStyle = state.tool === 'erase' ? '#ff5a4d' : '#ffffff';
      ctx.strokeRect(x + 0.5, y + 0.5, CELL - 1, CELL - 1);
      const cur = f.cells[idx(hx, hy)];
      if (cur) PD.term.state.tip = D.MACHINES[cur.t].name.toUpperCase() + ' -- ' + D.MACHINES[cur.t].blurb.toUpperCase();
      if (m.leftPressed) place(g, hx, hy, state.tool);
      if (m.rightPressed) place(g, hx, hy, 'erase');
    }

    // palette
    const px = gx + COLS * CELL + 10, tools = Object.keys(D.MACHINES).concat(['erase']);
    for (let k = 0; k < tools.length; k++) {
      const tname = tools[k];
      const y = gy + k * 19;
      const def = D.MACHINES[tname];
      const on = state.tool === tname;
      const r = PD.term.row(ctx, px, y, R.IX + R.IW - px, 18, th, { active: on });
      ctx.fillStyle = def ? def.col : '#ff5a4d'; ctx.fillRect(px + 3, y + 5, 8, 8);
      F.draw(ctx, def ? def.name : 'Eraser', px + 15, y + 2, on ? '#ffffff' : th.hi, { shadow: false });
      F.draw(ctx, def ? '$' + U.fmt(def.cost) : 'REFUND 50%', px + 15, y + 10, th.mid, { shadow: false });
      if (r.clicked) { state.tool = tname; A.sfx.click(); }
      if (r.hover && def) PD.term.state.tip = def.blurb.toUpperCase();
    }

    // stats strip
    const sy = gy + ROWS * CELL + 6;
    const machines = f.cells.filter(c => c && c.t !== 'belt').length;
    let goodsVal = 0, goodsN = 0;
    for (const k in g.save.goods) {
      const n = g.save.goods[k];
      const gd = k.indexOf('raw:') === 0 ? { cr: D.MAT[+k.slice(4)].cr } : D.goodFromKey(k);
      goodsVal += (gd ? gd.cr : 0) * n; goodsN += n;
    }
    F.draw(ctx, 'MACHINES ' + machines + '   PRODUCED ' + U.fmt(f.produced || 0) + '   GOODS IN VAULT ' + U.fmt(goodsN) +
      '  ($' + U.fmt(Math.round(goodsVal * g.valueMult())) + ')', gx, sy, th.mid, { shadow: false });
    F.draw(ctx, 'LEFT CLICK PLACE / ROTATE   RIGHT CLICK ERASE   HOPPER CLICK = NEXT ORE', gx, sy + 10, th.lo, { shadow: false });
  }

  PD.factory = { ensure, tick, app, place, COLS, ROWS, state };
})(window.PD);

/* ===== src/skilltree.js ===== */
/* The skill tree: a hex lattice of upgrades. Every node is one upgrade line
   with levels; a node opens once any neighbour has a level. Costs are shown
   as glyphs and numbers, never as sentences. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const F = PD.font;
  const A = PD.audio;
  const G = PD.glyph;

  const R = 20;                       // hex radius on screen
  const state = { sel: null, pan: 0 };

  /* axial -> pixel */
  function pos(q, r, cx, cy) {
    return { x: cx + R * 1.75 * (q + r / 2), y: cy + R * 1.52 * r };
  }
  function neighbours(n) {
    const dirs = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
    return D.NODES.filter(o => dirs.some(d => o.q === n.q + d[0] && o.r === n.r + d[1]));
  }
  function available(g, n) {
    if (n.root) return true;
    return neighbours(n).some(o => (g.save.upg[o.id] || 0) > 0);
  }

  function app(ctx, g, th, t) {
    const Rc = PD.term.rect;
    const cx = Rc.IX + 152, cy = Rc.IY + 92;
    const m = PD.input.mouse;

    // lattice edges first
    ctx.lineWidth = 1;
    for (const n of D.NODES) {
      const a = pos(n.q, n.r, cx, cy);
      for (const o of neighbours(n)) {
        if (o.q < n.q || (o.q === n.q && o.r < n.r)) continue;
        const b = pos(o.q, o.r, cx, cy);
        const lit = (g.save.upg[n.id] || 0) > 0 && (g.save.upg[o.id] || 0) > 0;
        ctx.strokeStyle = lit ? th.hi : th.lo;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }

    let hover = null;
    for (const n of D.NODES) {
      const p = pos(n.q, n.r, cx, cy);
      const u = D.UPG[n.id];
      const lvl = g.save.upg[n.id] || 0;
      const open = available(g, n);
      const maxed = lvl >= u.max;
      const isHover = m.inside && U.dist(m.x, m.y, p.x, p.y) < R;
      if (isHover) hover = n;
      const sel = state.sel === n.id;
      const fill = maxed ? th.mid : (lvl > 0 ? th.lo : (open ? '#1a1410' : '#0c0a08'));
      G.hex(ctx, p.x, p.y, R - 1, fill, sel ? '#ffffff' : (isHover ? th.hi : (open ? th.mid : '#2a2420')), sel ? 2 : 1);
      if (lvl > 0) G.hexProgress(ctx, p.x, p.y, R - 4, lvl / u.max, th.hi);
      G.draw(ctx, n.glyph, p.x - 7, p.y - 9, open ? '#f2e9ff' : '#4a4040', open ? th.hi : '#2a2420');
      if (!open) G.draw(ctx, 'lock', p.x - 3, p.y + 1, '#8a7a6a', '#5a4a3a');
      else F.draw(ctx, String(lvl), p.x, p.y + 5, maxed ? '#ffffff' : th.hi, { center: true, shadow: false });
      if (isHover && m.leftPressed) { state.sel = n.id; A.sfx.click(); }
    }

    // detail card for the selected node: glyphs, pips, costs, one build key
    const selNode = D.NODES.find(n => n.id === state.sel) || D.NODES[0];
    const u = D.UPG[selNode.id];
    const lvl = g.save.upg[selNode.id] || 0;
    const open = available(g, selNode);
    const maxed = lvl >= u.max;
    const px = Rc.IX + 306, py = Rc.IY + 4, pw = Rc.IW - 306;
    ctx.fillStyle = th.lo; ctx.fillRect(px, py, pw, Rc.IH - 8);
    ctx.strokeStyle = th.mid; ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, Rc.IH - 9);
    G.draw(ctx, selNode.glyph, px + 6, py + 6, '#ffffff', th.hi, 2);
    F.draw(ctx, u.show(lvl), px + 40, py + 10, th.hi, { shadow: false });
    // level pips as small hexes
    for (let k = 0; k < Math.min(u.max, 14); k++) {
      const on = lvl > Math.floor(k * u.max / Math.min(u.max, 14));
      G.hex(ctx, px + 10 + k * 8, py + 40, 3, on ? th.hi : '#000', th.mid, 1);
    }
    if (maxed) {
      G.draw(ctx, 'check', px + pw / 2 - 7, py + 60, th.hi, th.hi);
    } else if (!open) {
      G.draw(ctx, 'lock', px + pw / 2 - 7, py + 60, '#ff5a4d', '#8a2a2a');
    } else {
      const cost = D.upgradeCost(u, lvl);
      const rec = D.recipe(u, lvl);
      let yy = py + 52;
      const okC = g.save.credits >= cost;
      G.stat(ctx, 'coin', U.fmt(cost), px + 8, yy, '#ffd34d', '#b8860b', okC ? th.hi : '#ff5a4d');
      yy += 16;
      let all = okC;
      for (const r of rec) {
        const have = g.save.vault[r.mat] || 0;
        const ok = have >= r.qty;
        all = all && ok;
        const mc = D.MAT[r.mat].c;
        ctx.fillStyle = mc[1]; ctx.fillRect(px + 10, yy + 3, 8, 8); ctx.fillStyle = mc[0]; ctx.fillRect(px + 10, yy + 3, 8, 3);
        F.draw(ctx, have + '/' + r.qty, px + 25, yy + 4, ok ? th.hi : '#ff5a4d', { shadow: false });
        yy += 14;
      }
      // the build key: a big hex
      const bx = px + pw / 2, by = py + Rc.IH - 34;
      const hot = m.inside && U.dist(m.x, m.y, bx, by) < 16;
      G.hex(ctx, bx, by, 16, all ? (hot ? th.hi : th.mid) : '#1a1410', all ? '#ffffff' : '#3a3030', 1.5);
      G.draw(ctx, 'build', bx - 7, by - 7, all ? '#ffffff' : '#4a4040', all ? th.lo : '#2a2420');
      if (hot && m.leftPressed && all) g.fabricate(selNode.id);
    }
    if (hover) PD.term.state.tip = D.UPG[hover.id].blurb.toUpperCase();
  }

  PD.skilltree = { app, state, available };
})(window.PD);

/* ===== src/space.js ===== */
/* The scooter field. Where you start: an open reach of space littered with
   drifting ore and small rocks. Ride the scooter, hoover up what floats, shoot
   what does not, and when the hold is heavy open a time hole home. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const FX = PD.fx;
  const A = PD.audio;
  const G = PD.glyph;

  const VW = 480, VH = 270;
  const FIELD_W = 2400, FIELD_H = 1400;

  const S = {
    chunks: [], rocks: [], mites: [],
    cam: { x: 0, y: 0 },
    hole: null,                       // { x, y, t, open }
    tapTarget: null,
    scoot: { x: 0, y: 0, vx: 0, vy: 0, ang: 0, thrust: 0 },
    t: 0, seed: 1
  };

  function chunkFor(body) {
    // chunks carry the surface ores of whichever world you are orbiting
    const strata = D.STRATA[body.type] || D.STRATA.rock;
    const table = strata[0].ores.concat(strata[1] ? strata[1].ores : []);
    return D.M[U.weighted(table)];
  }

  function enter(g) {
    const body = g.world.body;
    S.seed = 400 + g.bodyIndex * 31;
    const rnd = U.mulberry32(S.seed + Math.floor(g.time));
    S.chunks.length = 0; S.rocks.length = 0; S.mites.length = 0;
    S.hole = null; S.tapTarget = null;
    S.scoot.x = FIELD_W / 2; S.scoot.y = FIELD_H / 2; S.scoot.vx = S.scoot.vy = 0;
    for (let i = 0; i < 70; i++) {
      S.chunks.push({ x: rnd() * FIELD_W, y: rnd() * FIELD_H, vx: (rnd() - 0.5) * 12, vy: (rnd() - 0.5) * 12,
        mat: chunkFor(body), rot: rnd() * 6.28, spin: (rnd() - 0.5) * 2 });
    }
    for (let i = 0; i < 26; i++) {
      const r = 8 + rnd() * 14;
      S.rocks.push({ x: rnd() * FIELD_W, y: rnd() * FIELD_H, vx: (rnd() - 0.5) * 6, vy: (rnd() - 0.5) * 6,
        r, hp: r * 3, rot: rnd() * 6.28, spin: (rnd() - 0.5) * 0.6, seed: rnd() * 1000, mat: chunkFor(body) });
    }
    for (let i = 0; i < 6 + g.bodyIndex * 2; i++) S.mites.push({ x: rnd() * FIELD_W, y: rnd() * FIELD_H, vx: 0, vy: 0, hp: 6, t: rnd() * 6 });
    S.cam.x = S.scoot.x - VW / 2; S.cam.y = S.scoot.y - VH / 2;
    g.player.x = S.scoot.x; g.player.y = S.scoot.y;
  }

  /* Player thrust: keys, or steer toward the held touch/tap point. */
  function update(dt, g) {
    const IN = PD.input;
    const p = g.player;
    const sc = S.scoot;
    S.t += dt;

    let ix = 0, iy = 0;
    if (IN.down('left')) ix -= 1; if (IN.down('right')) ix += 1;
    if (IN.down('up')) iy -= 1; if (IN.down('down')) iy += 1;
    if (IN.mouse.left && !g.uiBlocking) {
      // hold anywhere: fly toward the pointer
      const dx = IN.mouse.wx - sc.x, dy = IN.mouse.wy - sc.y;
      const d = Math.hypot(dx, dy);
      if (d > 14) { ix = dx / d; iy = dy / d; }
    }
    const thrust = p.stat('thruster') * 1.35 * p.stat('scooter') * (1 - p.loadFactor() * 0.4);
    sc.vx += ix * thrust * dt; sc.vy += iy * thrust * dt;
    sc.thrust = Math.hypot(ix, iy);
    if (sc.thrust > 0.1) sc.ang = U.lerp(sc.ang, Math.atan2(iy, ix), 0.2);
    sc.vx *= Math.pow(0.985, dt * 60); sc.vy *= Math.pow(0.985, dt * 60);
    const sp = Math.hypot(sc.vx, sc.vy), maxSp = 210 - p.loadFactor() * 60;
    if (sp > maxSp) { sc.vx *= maxSp / sp; sc.vy *= maxSp / sp; }
    sc.x = U.clamp(sc.x + sc.vx * dt, 20, FIELD_W - 20);
    sc.y = U.clamp(sc.y + sc.vy * dt, 20, FIELD_H - 20);
    p.x = sc.x; p.y = sc.y; p.vx = sc.vx; p.vy = sc.vy;
    p.aim = sc.ang;
    A.thrust(sc.thrust > 0.1 ? 0.6 : 0);
    if (sc.thrust > 0.1 && U.chance(dt * 40)) {
      FX.spawn({ x: sc.x - Math.cos(sc.ang) * 12, y: sc.y - Math.sin(sc.ang) * 12 + 4, vx: -Math.cos(sc.ang) * 90 + U.rand(-15, 15), vy: -Math.sin(sc.ang) * 90 + U.rand(-15, 15),
        life: U.rand(0.2, 0.5), size: U.rand(1.5, 3), color: U.pick(['#ffd34d', '#ff9b3d', '#fff3c0']), grav: 0, drag: 0.9, glow: 1 });
    }

    // air still matters out here
    p.o2 -= (0.35 + p.loadFactor() * 0.3) * dt;
    if (p.o2 <= 0) { p.o2 = 0; p.hull -= 5 * dt; if (p.hull <= 0) { p.hull = 0; g.onPlayerDown(); return; } }

    // shooting: space to fire toward the aim
    if ((IN.mouse.right || IN.down('space')) && p.gunCool <= 0 && !g.uiBlocking) {
      p.gunCool = 0.28;
      g.bullets.push(new PD.ent.Bullet(sc.x + Math.cos(sc.ang) * 12, sc.y + Math.sin(sc.ang) * 12, Math.cos(sc.ang) * 340, Math.sin(sc.ang) * 340, p.stat('pistol'), true));
      A.sfx.shoot();
    }
    p.gunCool = Math.max(0, p.gunCool - dt);
    for (let i = g.bullets.length - 1; i >= 0; i--) {
      const b = g.bullets[i];
      b.life -= dt; b.x += b.vx * dt; b.y += b.vy * dt;
      let hit = false;
      for (const r of S.rocks) {
        if (r.dead || U.dist(b.x, b.y, r.x, r.y) > r.r) continue;
        r.hp -= b.dmg; hit = true;
        FX.sparks(b.x, b.y, Math.atan2(b.vy, b.vx), D.MAT[r.mat], 4);
        A.sfx.hitMob();
        if (r.hp <= 0) breakRock(r, g);
        break;
      }
      for (const m of S.mites) {
        if (m.dead || hit || U.dist(b.x, b.y, m.x, m.y) > 6) continue;
        m.hp -= b.dmg; hit = true;
        if (m.hp <= 0) { m.dead = true; g.save.credits += 9; FX.burst(m.x, m.y, 8, ['#c8ff5a', '#fff'], 90); A.sfx.killMob(); }
      }
      if (hit || b.life <= 0) g.bullets.splice(i, 1);
    }

    // drifting things
    const pull = p.stat('magnet') + 14;
    for (let i = S.chunks.length - 1; i >= 0; i--) {
      const c = S.chunks[i];
      c.rot += c.spin * dt;
      const d = U.dist(c.x, c.y, sc.x, sc.y);
      if (d < pull && !p.cargoFull()) {
        const a = Math.atan2(sc.y - c.y, sc.x - c.x);
        c.vx = U.damp(c.vx, Math.cos(a) * 220, 0.2, dt); c.vy = U.damp(c.vy, Math.sin(a) * 220, 0.2, dt);
      }
      c.x += c.vx * dt; c.y += c.vy * dt;
      if (d < 10 && g.collect(c.mat, c.x, c.y)) { S.chunks.splice(i, 1); PD.touch.buzz(6); }
    }
    for (const r of S.rocks) { if (r.dead) continue; r.rot += r.spin * dt; r.x += r.vx * dt; r.y += r.vy * dt;
      if (U.dist(r.x, r.y, sc.x, sc.y) < r.r + 6) { sc.vx -= (r.x - sc.x) * 3; sc.vy -= (r.y - sc.y) * 3; p.hurt(4, g, Math.sign(sc.x - r.x)); } }
    for (const m of S.mites) {
      if (m.dead) continue;
      m.t += dt;
      const d = U.dist(m.x, m.y, sc.x, sc.y);
      const chase = d < 220;
      const tx = chase ? sc.x + Math.cos(m.t * 2) * 30 : m.x + Math.cos(m.t) * 20;
      const ty = chase ? sc.y + Math.sin(m.t * 2.6) * 24 : m.y + Math.sin(m.t * 0.7) * 20;
      m.vx = U.damp(m.vx, U.clamp((tx - m.x) * 3, -120, 120), 0.1, dt); m.vy = U.damp(m.vy, U.clamp((ty - m.y) * 3, -120, 120), 0.1, dt);
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (d < 9) p.hurt(4, g, Math.sign(sc.x - m.x));
    }
    // the field slowly replenishes
    if (S.chunks.length < 40 && U.chance(dt * 0.6)) {
      S.chunks.push({ x: sc.x + U.rand(-VW, VW) * 1.4, y: sc.y + U.rand(-VH, VH) * 1.4, vx: U.rand(-8, 8), vy: U.rand(-8, 8), mat: chunkFor(g.world.body), rot: 0, spin: U.rand(-1, 1) });
    }

    // time hole: E / tap the hole key; opens beside you, fly in
    if (IN.hit('KeyE') && !S.hole) openHole(g);
    if (S.hole) {
      S.hole.t += dt;
      S.hole.open = Math.min(1, S.hole.t / 1.2);
      if (S.hole.open >= 1 && U.dist(sc.x, sc.y, S.hole.x, S.hole.y) < 22) { g.throughHole(); return; }
      if (U.chance(dt * 30)) {
        const a = U.rand(0, U.TAU), r = 26 * S.hole.open;
        FX.spawn({ x: S.hole.x + Math.cos(a) * r, y: S.hole.y + Math.sin(a) * r, vx: -Math.cos(a) * 40, vy: -Math.sin(a) * 40, life: 0.5, size: 1.5, color: U.pick(['#7ef9ff', '#d8bcff', '#ffffff']), grav: 0, drag: 0.9, glow: 1 });
      }
    }

    S.cam.x = U.damp(S.cam.x, U.clamp(sc.x - VW / 2 + sc.vx * 0.25, 0, FIELD_W - VW), 0.12, dt);
    S.cam.y = U.damp(S.cam.y, U.clamp(sc.y - VH / 2 + sc.vy * 0.25, 0, FIELD_H - VH), 0.12, dt);
    FX.update(dt, null);
  }

  function openHole(g) {
    const sc = S.scoot;
    S.hole = { x: sc.x + Math.cos(sc.ang + Math.PI) * 70, y: sc.y + Math.sin(sc.ang + Math.PI) * 70, t: 0, open: 0 };
    A.sfx.warp();
    FX.ring(S.hole.x, S.hole.y, 2, 60, 0.9, '#7ef9ff', 2);
    FX.shake(3);
  }

  function breakRock(r, g) {
    r.dead = true;
    A.sfx.boom(0.5); FX.shake(3);
    FX.burst(r.x, r.y, 20, D.MAT[r.mat].c, 120);
    const n = 3 + Math.round(r.r / 5);
    for (let i = 0; i < n; i++) {
      const a = U.rand(0, U.TAU);
      S.chunks.push({ x: r.x, y: r.y, vx: Math.cos(a) * U.rand(30, 90), vy: Math.sin(a) * U.rand(30, 90), mat: U.chance(0.3) ? D.M.stone : r.mat, rot: 0, spin: U.rand(-3, 3) });
    }
    if (U.chance(0.15)) S.chunks.push({ x: r.x, y: r.y, vx: 0, vy: 0, mat: D.M.gold, rot: 0, spin: 1 });
  }

  /* ----------------------------------------------------------------- drawing */
  function drawRock(ctx, r, cam) {
    const x = r.x - cam.x, y = r.y - cam.y;
    ctx.save(); ctx.translate(x | 0, y | 0); ctx.rotate(Math.round(r.rot / (Math.PI / 8)) * (Math.PI / 8));
    ctx.fillStyle = '#4e4658';
    ctx.beginPath();
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * U.TAU, rr = r.r * (0.78 + U.hash2(r.seed + i, 3) * 0.4);
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#1a1030'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#6a6278'; ctx.fillRect(-r.r * 0.4, -r.r * 0.5, r.r * 0.5, r.r * 0.3);
    const mc = D.MAT[r.mat].c;
    ctx.fillStyle = mc[0]; ctx.fillRect(r.r * 0.1, r.r * 0.1, 3, 3); ctx.fillRect(-r.r * 0.5, r.r * 0.2, 2, 2);
    ctx.restore();
  }

  function draw(ctx, g, t) {
    const cam = { x: Math.round(S.cam.x), y: Math.round(S.cam.y) };
    PD.galaxy.draw(ctx, cam, t, S.seed, g.world.body.sky);
    // the world you are orbiting, huge and slow at the bottom
    const moon = g.world.moon && g.world.moon.cv;
    if (moon) {
      const mx = VW * 0.65 - cam.x * 0.05, my = VH * 0.75 - cam.y * 0.05;
      ctx.drawImage(moon, 0, 0, moon.width, moon.height, mx | 0, my | 0, moon.width * 2.2, moon.height * 2.2);
    }

    for (const r of S.rocks) if (!r.dead) drawRock(ctx, r, cam);
    for (const c of S.chunks) {
      const spr = PD.art.gemFor(c.mat);
      PD.ent.drawSprite(ctx, spr, 0, c.x - cam.x, c.y - cam.y + Math.sin(t * 2 + c.rot) * 1.5, false, false);
    }
    FX.drawWorld(ctx, cam);
    for (const m of S.mites) if (!m.dead) PD.ent.drawSprite(ctx, PD.art.sprites.mite, Math.floor(t * 8) % 2, m.x - cam.x, m.y - cam.y, m.vx < 0, false);
    for (const b of g.bullets) b.draw(ctx, cam);

    if (S.hole) {
      const hx = S.hole.x - cam.x, hy = S.hole.y - cam.y, o = S.hole.open;
      const rr = 24 * o;
      const grd = ctx.createRadialGradient(hx, hy, 1, hx, hy, rr + 10);
      grd.addColorStop(0, 'rgba(255,255,255,0.9)'); grd.addColorStop(0.4, 'rgba(126,249,255,0.7)'); grd.addColorStop(1, 'rgba(120,80,220,0)');
      ctx.fillStyle = grd; ctx.fillRect(hx - rr - 10, hy - rr - 10, rr * 2 + 20, rr * 2 + 20);
      for (let k = 0; k < 3; k++) {
        ctx.save(); ctx.translate(hx, hy); ctx.rotate(t * (1.5 + k) * (k % 2 ? -1 : 1));
        G.hex(ctx, 0, 0, rr * (1 - k * 0.22), null, k ? '#d8bcff' : '#ffffff', 1.5);
        ctx.restore();
      }
    }

    // your little fat pod, nose along its heading, alien visible in the dome
    const sc = S.scoot;
    const skin = PD.art.skinFor(g.save.cos);
    const pod = skin.pod;
    const flip = Math.cos(sc.ang) < 0;
    const bob = Math.sin(t * 3) * 1.2;
    const tilt = U.clamp(sc.vy * 0.0015, -0.35, 0.35) * (flip ? -1 : 1);
    ctx.save();
    ctx.translate((sc.x - cam.x) | 0, (sc.y - cam.y + bob) | 0);
    ctx.rotate(tilt);
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(pod.frames[Math.floor(t * 10) % 2], -pod.ox, -pod.oy);
    // the pilot peeking out of the dome
    const al = skin.alien;
    ctx.drawImage(al.frames[0], 4, 0, 16, 12, -8, -22, 16, 12);
    ctx.restore();
    if (g.player.hurtT > 0.15) { ctx.globalAlpha = 0.5; ctx.fillStyle = '#ff5a4d'; ctx.fillRect(sc.x - cam.x - 18, sc.y - cam.y - 14, 36, 28); ctx.globalAlpha = 1; }

    // where a held touch is steering to
    if (PD.input.mouse.left && !g.uiBlocking) {
      const mx = PD.input.mouse.wx - cam.x, my = PD.input.mouse.wy - cam.y;
      G.hex(ctx, mx, my, 6 + Math.sin(t * 8) * 1.5, null, '#ffd34d', 1);
    }
  }

  PD.space = { enter, update, draw, openHole, S, FIELD_W, FIELD_H };
})(window.PD);

/* ===== src/tutorial.js ===== */
/* Pictographic tutorial: a strip of glyph sentences that advance as you do
   the thing they show. No words. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const G = PD.glyph;
  const F = PD.font;

  const VW = 480, VH = 270;

  /* Each step: which scene it belongs to, the glyph sentence, and a predicate
     that marks it done. */
  const STEPS = [
    { scene: 'space', text: 'HOLD TO FLY', say: ['hand', 'arrowR', 'speed'],       done: g => Math.hypot(PD.space.S.scoot.vx, PD.space.S.scoot.vy) > 60 },
    { scene: 'space', text: 'FLY INTO ORE TO COLLECT IT', say: ['speed', 'arrowR', 'ore', 'cargo'], done: g => g.player.cargoKg > 3 },
    { scene: 'space', text: 'SHOOT A ROCK  (SPACE)', say: ['gun', 'arrowR', 'rock'],           done: g => PD.space.S.rocks.some(r => r.dead) },
    { scene: 'space', text: 'OPEN A TIME HOLE HOME  (E)', say: ['cargo', 'arrowR', 'hole', 'home'], done: g => !!PD.space.S.hole },
    { scene: 'interior', text: 'SELL APPRAISED ORE AT THE EXCHANGE', say: ['hand', 'arrowR', 'sell', 'coin'],   done: g => g.save.totalEarned > 0 },
    { scene: 'interior', text: 'BUILD A NODE ON THE SKILL LATTICE', say: ['coin', 'arrowR', 'hex', 'up'],      done: g => Object.keys(g.save.upg).some(k => g.save.upg[k] > 0) },
    { scene: 'interior', text: 'PICK A WORLD AT THE NAV COMPUTER', say: ['planet', 'arrowR', 'drill'],        done: g => g.state === 'play' },
    { scene: 'play', text: 'HOLD LEFT MOUSE TO DRILL', say: ['hand', 'arrowD', 'drill', 'ore'],       done: g => g.save.totalMined > 8 },
    { scene: 'play', text: 'AIR LOW? FLY UP TO THE POD (E)', say: ['o2', 'arrowD', 'bang', 'arrowU', 'hole'], done: g => g.player.docked }
  ];

  const st = { i: 0, flash: 0, doneT: 0 };

  function current(g) {
    if (!g.save.tut) g.save.tut = { i: 0 };
    return STEPS[g.save.tut.i] || null;
  }

  function update(dt, g, scene) {
    const s = current(g);
    if (!s) return;
    st.flash += dt;
    if (st.doneT > 0) {
      st.doneT -= dt;
      if (st.doneT <= 0) { g.save.tut.i++; g.saveGame(); }
      return;
    }
    if (s.scene === scene && s.done(g)) {
      st.doneT = 0.9;
      PD.audio.sfx.tone(900, { type: 'triangle', to: 1400, dur: 0.2, vol: 0.12 });
    }
  }

  function draw(ctx, g, scene) {
    const s = current(g);
    if (!s || s.scene !== scene) return;
    const w = Math.max(s.say.length * 20 + 16, F.width(s.text, 1) + 20);
    const x = VW / 2 - w / 2, y = scene === 'interior' ? 42 : 24;
    const done = st.doneT > 0;
    ctx.fillStyle = 'rgba(8,4,18,0.88)';
    ctx.fillRect(x, y, w, 40);
    ctx.strokeStyle = done ? '#8affa0' : '#ffd34d';
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 39);
    for (let i = 0; i < s.say.length; i++) {
      const bump = (!done && i === s.say.length - 1) ? Math.sin(st.flash * 6) * 1.5 : 0;
      G.draw(ctx, s.say[i], VW / 2 - s.say.length * 10 + i * 20 + 3, y + 4 + bump, done ? '#8affa0' : '#ffffff', done ? '#3fb85a' : '#ffd34d');
    }
    F.draw(ctx, s.text, VW / 2, y + 24, done ? '#8affa0' : '#ffd34d', { center: true });
    if (done) G.draw(ctx, 'check', x + w - 14, y - 6, '#8affa0', '#3fb85a');
    for (let i = 0; i < STEPS.length; i++) {
      G.hex(ctx, x + 6 + i * 6, y + 46, 2, i < g.save.tut.i ? '#8affa0' : (i === g.save.tut.i ? '#ffd34d' : '#2a1c4a'), null);
    }
  }

  PD.tutorial = { update, draw, STEPS, current, state: st };
})(window.PD);

/* ===== src/cutscene.js ===== */
/* Cold open. Establishes the ship, the crew, and the fact that you are the
   villain of this story. Skippable, and only shown on a fresh save. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const F = PD.font;
  const A = PD.audio;
  const AI = PD.artint;

  const VW = 480, VH = 270;

  let t = 0, beat = 0, done = true, moon = null, stars = null, letter = 0, shipX = -120, card = null;

  /* Cards carry glyph sentences; lines are glyph strips from the crew. */
  const BEATS = [
    { dur: 3.8, card: ['THE OUTER DARK', 'SOMEWHERE EXPENSIVE'], glyphs: ['galaxy', 'planet', 'planet'] },
    { dur: 0, say: ['nix', 'Good morning. Your balance is zero credits. Your debt is not zero credits.'] },
    { dur: 0, say: ['you', 'Then we take the money out of the rocks. Every rock. All of them.'] },
    { dur: 0, say: ['bolt', 'Pod is fuelled. Hold the stick to fly, grab the floating ore, then open a time hole home.'] },
    { dur: 0, say: ['zaz', 'Bring it to me. I appraise, you profit, the house takes a modest slice.'] },
    { dur: 3.2, card: ['OBJECTIVE', 'GET RICH.  BREAK WORLDS.  OWN THE GALAXY.'], glyphs: ['coin', 'arrowR', 'galaxy'] }
  ];

  function start() {
    t = 0; beat = 0; done = false; letter = 0; shipX = -120; card = null;
    moon = AI.buildMoon(190, '#9aa8c4', 991);
    const rnd = U.mulberry32(4242);
    stars = [];
    for (let i = 0; i < 150; i++) {
      stars.push({ x: rnd() * VW, y: rnd() * VH, s: rnd() > 0.85 ? 2 : 1, p: 0.2 + rnd() * 0.8, tw: rnd() * 6.28 });
    }
    PD.dialog.clear();
    enterBeat();
    A.music(true);
    A.setIntensity(0.15);
  }

  function enterBeat() {
    const b = BEATS[beat];
    if (!b) { finish(); return; }
    card = b.card || null;
    if (b.say) PD.dialog.push(b.say[0], b.say[1]);
  }

  function finish() { done = true; PD.dialog.clear(); }

  function update(dt, g) {
    if (done) return;
    t += dt;
    letter = Math.min(1, letter + dt * 2.5);
    shipX = U.damp(shipX, 190, 0.5, dt);

    const IN = PD.input;
    if (IN.hit('esc')) { finish(); return; }

    const b = BEATS[beat];
    if (!b) { finish(); return; }

    if (b.say) {
      PD.dialog.update(dt);
      if (IN.hit('KeyE') || IN.hit('space') || IN.hit('enter') || IN.mouse.leftPressed) {
        if (!PD.dialog.advance() || !PD.dialog.active()) { beat++; t = 0; enterBeat(); }
      }
      if (!PD.dialog.active()) { beat++; t = 0; enterBeat(); }
    } else {
      if (t > b.dur || IN.hit('KeyE') || IN.hit('space') || IN.hit('enter') || IN.mouse.leftPressed) {
        beat++; t = 0; enterBeat();
      }
    }
  }

  function draw(ctx, g, time) {
    // deep space
    const grd = ctx.createLinearGradient(0, 0, 0, VH);
    grd.addColorStop(0, '#0d0a24');
    grd.addColorStop(1, '#04030e');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, VW, VH);

    for (const s of stars) {
      ctx.globalAlpha = s.p * (0.5 + 0.5 * Math.sin(time * 2 + s.tw));
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(((s.x - time * s.p * 4) % VW + VW) % VW | 0, s.y | 0, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    // the moon we are about to ruin
    ctx.drawImage(moon, VW - 150, 40 + Math.sin(time * 0.3) * 3 | 0);

    // the barge, drifting in
    const ship = PD.art.skinFor(g.save.cos).ship;
    const sy = 150 + Math.sin(time * 0.9) * 4;
    ctx.drawImage(ship.frames[Math.sin(time * 3) > 0 ? 1 : 0], (shipX - ship.ox) | 0, (sy - ship.oy) | 0);
    const pod = PD.art.skinFor(g.save.cos).pod;
    ctx.drawImage(pod.frames[Math.floor(time * 8) % 2], (shipX + 70 - pod.ox) | 0, (sy + 30 + Math.sin(time * 2) * 3 - pod.oy) | 0);
    // engine plume
    for (let i = 0; i < 3; i++) {
      ctx.globalAlpha = 0.25 + 0.2 * Math.sin(time * 12 + i);
      ctx.fillStyle = i ? '#ff9b3d' : '#ffe08a';
      ctx.fillRect(shipX - 46 - i * 7 | 0, sy - 6 + i | 0, 8, 5 - i);
    }
    ctx.globalAlpha = 1;

    // letterbox
    const bar = Math.round(22 * letter);
    ctx.fillStyle = '#050310';
    ctx.fillRect(0, 0, VW, bar);
    ctx.fillRect(0, VH - bar, VW, bar);

    if (card) {
      const a = U.clamp(Math.min(t * 1.6, (BEATS[beat].dur - t) * 1.6), 0, 1);
      ctx.globalAlpha = a;
      const gl = BEATS[beat].glyphs || [];
      for (let i = 0; i < gl.length; i++) {
        const x = VW / 2 - gl.length * 17 + i * 34 + 17;
        PD.glyph.hex(ctx, x, 78, 15, 'rgba(8,4,18,0.7)', '#ffd34d', 1);
        PD.glyph.draw(ctx, gl[i], x - 7, 71, '#ffffff', '#ffd34d');
      }
      F.draw(ctx, card[0], VW / 2, 104, '#ffd34d', { center: true, scale: 3, shadow: '#7a2a10' });
      F.draw(ctx, card[1], VW / 2, 134, '#f2e9ff', { center: true, shadow: false });
      ctx.globalAlpha = 1;
    }

    PD.dialog.draw(ctx, g, time, PD.art.skinFor(g.save.cos).alien);

    F.draw(ctx, 'ESC  SKIP', VW - 6, VH - bar - 12, 'rgba(240,235,255,0.5)', { right: true, shadow: false });
  }

  PD.cutscene = { start, update, draw, get done() { return done; } };
})(window.PD);

/* ===== src/interior.js ===== */
/* Inside the Rustmaw. Instead of a shop popup you walk the deck and use the
   machines: market console, fabricator, drone bay, wardrobe, nav chart --
   with a crew that has opinions about what you are doing. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const F = PD.font;
  const A = PD.audio;
  const FX = PD.fx;
  const AI = PD.artint;
  const D = PD.data;

  const VW = 480, VH = 270;
  const ROOM_W = 840, ROOM_H = 270;
  const FLOOR = ROOM_H - 22;

  let bg = null;

  /* Everything you can walk up to. `app` opens a terminal; `act` runs code. */
  const STATIONS = [
    { id: 'airlock', x: 52,  spr: 'airlock',    label: 'AIRLOCK',        act: 'launch', glyph: 'speed' },
    { id: 'market',  x: 160, spr: 'console',    label: 'CARGO EXCHANGE', app: 'market', glyph: 'sell' },
    { id: 'fab',     x: 300, spr: 'fabricator', label: 'FABRICATOR',     app: 'skills', glyph: 'hex' },
    { id: 'bay',     x: 440, spr: 'dronebay',   label: 'DRONE BAY',      app: 'bay', glyph: 'drone' },
    { id: 'refinery', x: 580, spr: 'refinery',  label: 'REFINERY DECK',  app: 'refinery', glyph: 'machine' },
    { id: 'vanity',  x: 690, spr: 'wardrobe',   label: 'IDENTITY POD',   app: 'vanity', glyph: 'crew' },
    { id: 'nav',     x: 786, spr: 'navchart',   label: 'NAV COMPUTER',   app: 'nav', glyph: 'planet' }
  ];

  const CREW = [
    { id: 'zaz',   x: 118, spr: 'zaz',   label: 'ZAZ',   glyph: 'clock' },
    { id: 'nix',   x: 216, spr: 'nix',   label: 'NIX',   glyph: 'eye' },
    { id: 'bolt',  x: 356, spr: 'bolt',  label: 'BOLT',  glyph: 'build' },
    { id: 'gloop', x: 502, spr: 'gloop', label: 'GLOOP', glyph: 'star' }
  ];

  const DECOR = [
    { x: 100, spr: 'crate', f: 0 }, { x: 396, spr: 'crate', f: 1 },
    { x: 740, spr: 'plant', f: 0 }, { x: 640, spr: 'crate', f: 0 }, { x: 88, spr: 'plant', f: 0 },
    { x: 250, spr: 'poster', f: 0, y: 124 }, { x: 470, spr: 'poster', f: 1, y: 122 }, { x: 830, spr: 'poster', f: 0, y: 126 },
    { x: 160, spr: 'lights', f: 0, y: 108 }, { x: 420, spr: 'lights', f: 0, y: 108 }, { x: 690, spr: 'lights', f: 0, y: 108 }
  ];
  const PET = { x: 600, dir: 1, t: 0 };

  /* Crew barks. They rotate, and they are all enabling you. */
  const LINES = {
    nix: [
      'Balance updated. I rounded in our favour again.',
      'Three worlds filed complaints. I filed them in the reactor.',
      'The wire keeps you close to the pod. Longer reels are on the lattice.',
      'You look tired. Statistically, greed is a stimulant.'
    ],
    bolt: [
      'Rocks in, machines out. That is the whole religion, boss.',
      'Feed the hoppers and the refinery runs itself. Ingots sell triple.',
      'Every node you build on the lattice, I weld another seam. You are welcome.',
      'Want to dig deeper? Buy wire. Simple as that.'
    ],
    zaz: [
      'One lot at a time, darling. Quality cannot be rushed. Well. It can, for a fee.',
      'Your regolith is... regolith. Your diamond, however, has my full attention.',
      'The house takes twelve percent. Hire a broker and it takes less.',
      'Appraised lots are ready to sell. Unappraised ones are just heavy.'
    ],
    gloop: [
      'GLOOP chirps and headbutts the glass affectionately.',
      'GLOOP is eating a rock you were going to sell. GLOOP is unrepentant.',
      'GLOOP blinks all four eyes at slightly different times.'
    ]
  };
  const barkIdx = { nix: 0, bolt: 0, gloop: 0, zaz: 0 };

  const P = {
    x: 100, y: FLOOR, vx: 0, vy: 0, face: 1, walk: 0, near: null, hop: 0,
    target: null, autoUse: null
  };

  function enter(g, atStation) {
    if (!bg) bg = AI.room(ROOM_W, ROOM_H).toCanvas();
    const st = STATIONS.find(s => s.id === atStation);
    P.x = st ? st.x + 30 : 96;
    P.y = FLOOR; P.vx = 0; P.vy = 0; P.face = 1;
    g.intCam = U.clamp(P.x - VW / 2, 0, ROOM_W - VW);
  }

  /* Nearest interactable, compared as a fraction of each one's own reach so a
     crew member standing beside a console cannot steal its prompt. */
  function nearest() {
    let best = null, score = 1;
    const test = (o, reach) => {
      const f = Math.abs(o.x - P.x) / reach;
      if (f < score) { score = f; best = o; }
    };
    for (const s of STATIONS) test(s, 30);
    for (const c of CREW) test(c, 20);
    return best;
  }

  function talk(who) {
    const lines = LINES[who];
    if (!lines) return;
    PD.dialog.push(who, lines[barkIdx[who] % lines.length]);
    barkIdx[who]++;
  }

  function update(dt, g) {
    const IN = PD.input;
    const use = IN.hit('KeyE') || IN.hit('space');
    const esc = IN.hit('esc');

    // One owner of the input per frame, resolved top down. Without this a
    // single E press both opens a terminal and closes it again.
    if (PD.term.app) {
      if (esc) PD.term.close();
    } else if (PD.dialog.active()) {
      PD.dialog.update(dt);
      if (use || IN.mouse.leftPressed) PD.dialog.advance();
    } else {
      let ix = 0;
      if (IN.down('left')) ix -= 1;
      if (IN.down('right')) ix += 1;
      // tap anywhere on the deck: walk there; tap a machine: walk there and use it
      if (IN.mouse.leftPressed && IN.mouse.y > 20) {
        const wx = IN.mouse.x + g.intCam;
        let hitSt = null;
        for (const st of STATIONS.concat(CREW)) if (Math.abs(st.x - wx) < 34) hitSt = st;
        P.target = hitSt ? hitSt.x + (hitSt.x > P.x ? -18 : 18) : wx;
        P.autoUse = hitSt;
        A.sfx.click();
      }
      if (ix) { P.target = null; P.autoUse = null; }
      if (P.target !== null) {
        const d = P.target - P.x;
        if (Math.abs(d) > 4) ix = Math.sign(d);
        else {
          P.target = null;
          if (P.autoUse) {
            const st = P.autoUse; P.autoUse = null;
            if (st.app) PD.term.open(st.app);
            else if (st.act === 'launch') { g.undock(); return; }
            else talk(st.id);
          }
        }
      }
      if (ix) P.face = ix;
      P.vx = U.damp(P.vx, ix * 78, 0.3, dt);
      P.x = U.clamp(P.x + P.vx * dt, 28, ROOM_W - 28);
      P.walk += Math.abs(P.vx) * dt * 0.09;

      // a little hover-hop, since our alien does not really walk
      if (IN.hit('up') && P.y >= FLOOR) {
        P.vy = -120;
        A.sfx.tone(600, { type: 'triangle', dur: 0.08, vol: 0.06 });
      }
      P.vy += 400 * dt;
      P.y = Math.min(FLOOR, P.y + P.vy * dt);
      if (P.y >= FLOOR) { P.y = FLOOR; P.vy = 0; }

      P.near = nearest();

      if (use && P.near) {
        if (P.near.app) PD.term.open(P.near.app);
        else if (P.near.act === 'launch') { g.undock(); return; }
        else talk(P.near.id);
      } else if (esc) {
        g.undock();
        return;
      }
    }

    g.intCam = U.damp(g.intCam, U.clamp(P.x - VW / 2, 0, ROOM_W - VW), 0.16, dt);
  }

  function drawSpr(ctx, sp, frame, x, y) {
    ctx.drawImage(sp.frames[frame % sp.frames.length], (x - sp.ox) | 0, (y - sp.oy) | 0);
  }

  function draw(ctx, g, t) {
    const cam = Math.round(g.intCam);
    ctx.drawImage(bg, -cam, 0);

    for (const d of DECOR) {
      const f = d.spr === 'lights' ? Math.floor(t * 2) % 2 : d.f;
      drawSpr(ctx, AI.S[d.spr], f, d.x - cam, d.y !== undefined ? d.y : FLOOR + 2);
    }
    // Sprout the space-cat pads up and down the deck
    PET.t += 1 / 60;
    PET.x += PET.dir * 12 / 60;
    if (PET.x > 760 || PET.x < 560) PET.dir *= -1;
    ctx.save(); ctx.translate((PET.x - cam) | 0, FLOOR + 2); if (PET.dir < 0) ctx.scale(-1, 1);
    const ps = AI.S.sprout; ctx.drawImage(ps.frames[Math.floor(PET.t * 6) % 2], -ps.ox, -ps.oy); ctx.restore();

    const blink = Math.sin(t * 2.4) > 0 ? 1 : 0;
    for (const s of STATIONS) {
      const sp = AI.S[s.spr];
      const lit = s.app ? blink : (Math.sin(t * 3) > 0.4 ? 1 : 0);
      drawSpr(ctx, sp, Math.min(lit, sp.frames.length - 1), s.x - cam, FLOOR + 2);
    }

    // crew, bobbing on their own clocks
    for (const c of CREW) {
      const sp = AI.S[c.spr];
      const f = Math.floor(t * (c.id === 'nix' ? 4 : 2.4) + c.x) % sp.frames.length;
      drawSpr(ctx, sp, f, c.x - cam, FLOOR + 2);
      if (c.id === 'nix') {
        // holo flicker glow
        const gx = c.x - cam, gy = FLOOR - 22;
        const gr = ctx.createRadialGradient(gx, gy, 2, gx, gy, 30);
        gr.addColorStop(0, 'rgba(126,249,255,' + (0.22 + 0.08 * Math.sin(t * 9)).toFixed(2) + ')');
        gr.addColorStop(1, 'rgba(126,249,255,0)');
        ctx.fillStyle = gr;
        ctx.fillRect(gx - 30, gy - 30, 60, 60);
      }
    }

    // the player, hovering along on suit thrusters
    const skin = PD.art.skinFor(g.save.cos);
    const walking = Math.abs(P.vx) > 10;
    const inAir = P.y < FLOOR - 1;
    const set = inAir ? skin.alienFly : (walking ? skin.alienWalk : skin.alien);
    const frame = inAir ? Math.floor(t * 8) % 2 : (walking ? Math.floor(P.walk * 1.2) % 4 : (Math.sin(t * 0.9) > 0.95 ? 2 : Math.floor(t * 1.5) % 2));
    ctx.save();
    ctx.translate((P.x - cam) | 0, P.y | 0);
    if (P.face < 0) ctx.scale(-1, 1);
    ctx.drawImage(set.frames[frame], -set.ox, -set.oy - 10);
    ctx.restore();
    if (walking && U.chance(0.15)) FX.dust(P.x - P.face * 4, P.y - 1, 1, '#5a4d80', 10);

    // interaction prompt: a hand and the machine's glyph
    if (P.near && !PD.term.app && !PD.dialog.active()) {
      const x = P.near.x - cam;
      const y = FLOOR - (P.near.spr === 'gloop' ? 44 : 70) + Math.sin(t * 5) * 2;
      const w = F.width(P.near.label, 1) + 34;
      ctx.fillStyle = 'rgba(8,4,18,0.88)'; ctx.fillRect(x - w / 2, y, w, 16);
      ctx.strokeStyle = '#7ef9ff'; ctx.strokeRect(x - w / 2 + 0.5, y + 0.5, w - 1, 15);
      PD.glyph.draw(ctx, P.near.glyph || 'crew', x - w / 2 + 3, y + 1, '#ffffff', '#7ef9ff');
      F.draw(ctx, 'E', x - w / 2 + 19, y + 5, '#ffd34d', { shadow: false });
      F.draw(ctx, P.near.label, x - w / 2 + 28, y + 5, '#ffffff', { shadow: false });
    }
    // walk target marker
    if (P.target !== null) PD.glyph.hex(ctx, P.target - cam, FLOOR + 6, 4 + Math.sin(t * 8), null, '#ffd34d', 1);
  }

  /* Slim diegetic status strip -- the deck's own readout, not a game HUD. */
  function drawStatus(ctx, g, t) {
    ctx.fillStyle = 'rgba(8,4,18,0.85)';
    ctx.fillRect(0, 0, VW, 18);
    ctx.fillStyle = '#39ffa6';
    ctx.fillRect(0, 18, VW, 1);
    F.draw(ctx, 'THE RUSTMAW  -  DECK A', 6, 6, '#39ffa6', { shadow: false });
    F.draw(ctx, '$' + U.fmt(g.save.credits), 200, 3, '#ffd34d', { shadow: false, scale: 2 });
    const bin = Object.keys(g.save.vault).reduce((n, k) => n + g.save.vault[k], 0);
    const ok = Object.keys(g.save.appr).reduce((n, k) => n + g.save.appr[k], 0);
    F.draw(ctx, 'WAIT ' + bin + '   READY ' + ok, 292, 6, '#7ef9ff', { shadow: false });
    const mat = g.appraising();
    if (mat !== null) {
      const f = g.apprFrac();
      ctx.fillStyle = '#2a1c4a'; ctx.fillRect(292, 14, 96, 3);
      ctx.fillStyle = '#ffb03d'; ctx.fillRect(292, 14, Math.round(96 * f), 3);
    }
    F.draw(ctx, 'GALAXY ' + g.save.dominion.toFixed(1) + '%', VW - 6, 6, '#ff8ad8', { right: true, shadow: false });
    // objective line under the strip
    const o = g.objective && g.objective();
    if (o && !PD.term.app) {
      const text = o.t.toUpperCase();
      const w = F.width(text, 1) + o.g.length * 16 + 20;
      ctx.fillStyle = 'rgba(8,4,18,0.75)'; ctx.fillRect(VW / 2 - w / 2, 22, w, 16);
      let gx = VW / 2 - w / 2 + 4;
      for (const gname of o.g) { PD.glyph.draw(ctx, gname, gx, 23, '#ffffff', '#ffd34d'); gx += 16; }
      F.draw(ctx, text, gx + 4, 27, '#f2e9ff', { shadow: false });
    }
  }

  PD.interior = { enter, update, draw, drawStatus, talk, STATIONS, CREW, P, ROOM_W, FLOOR };
})(window.PD);

/* ===== src/game.js ===== */
/* Planet Destroyer -- main game module. Owns the loop, the camera, the ship,
   progression and the world-cracking finale. */
(function (PD) {
  'use strict';
  const U = PD.util;
  const D = PD.data;
  const FX = PD.fx;
  const A = PD.audio;
  const F = PD.font;
  const UI = PD.ui;
  const TILE = PD.world.TILE;

  const VW = UI.VW, VH = UI.VH;
  const SAVE_KEY = 'planet-destroyer-save-v1';

  const g = {
    state: 'title',
    time: 0,
    save: null,
    world: null,
    player: null,
    mobs: [], bullets: [], pickups: [], boulders: [],
    cam: { x: 0, y: 0 },
    bodyIndex: 0,
    ship: { x: 0, y: 0, w: 60, h: 34 },
    toasts: [],
    hint: '', hintT: 0, hintKey: '',
    shopTab: 0, shopTip: '',
    cinematic: false,
    destruction: null,
    victory: null,
    sellReport: null,
    droneAcc: 0,
    fps: 60,
    crates: [],
    combo: { n: 0, t: 0, mult: 1 },
    pings: [],                 // scanner hits for the minimap
    banner: null,              // stratum name card
    lastStratum: -2,
    ambT: 0
  };
  PD.game = g;

  /* ------------------------------------------------------------------- saves */
  function blankSave() {
    const upg = {};
    for (const u of D.UPGRADES) upg[u.id] = 0;
    return {
      credits: 0, upg, unlocked: 0, destroyed: [], dominion: 0, bonus: 0,
      totalMined: 0, totalEarned: 0, bodyIndex: 0, seen: {},
      vault: {},                                  // ore stockpile aboard the ship
      cos: { suit: 'rose', skin: 'green', glass: 'sky', drill: 'steel', trim: 'stock' },
      owned: {},                                  // purchased cosmetics
      seenIntro: 0,
      goods: {},                                  // refined output from the refinery deck
      factory: null,                              // machine layout
      appr: {},                                   // appraised ore, ready to sell
      apprT: 0,
      tut: { i: 0 }
    };
  }

  function loadGame() {
    let s = null;
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) s = JSON.parse(raw);
    } catch (e) { s = null; }
    const base = blankSave();
    if (s && typeof s === 'object') {
      base.credits = +s.credits || 0;
      base.unlocked = U.clamp(+s.unlocked || 0, 0, D.BODIES.length - 1);
      base.destroyed = Array.isArray(s.destroyed) ? s.destroyed : [];
      base.dominion = +s.dominion || 0;
      base.bonus = +s.bonus || 0;
      base.totalMined = +s.totalMined || 0;
      base.totalEarned = +s.totalEarned || 0;
      base.bodyIndex = U.clamp(+s.bodyIndex || 0, 0, D.BODIES.length - 1);
      base.seen = s.seen || {};
      base.seenIntro = s.seenIntro ? 1 : 0;
      if (s.vault) for (const k in s.vault) { const n = +s.vault[k]; if (n > 0 && D.MAT[k]) base.vault[k] = n; }
      if (s.owned) base.owned = s.owned;
      if (s.goods) for (const k in s.goods) { const n = +s.goods[k]; if (n > 0) base.goods[k] = n; }
      if (s.appr) for (const k in s.appr) { const n = +s.appr[k]; if (n > 0 && D.MAT[k]) base.appr[k] = n; }
      if (s.tut) base.tut = { i: U.clamp(+s.tut.i || 0, 0, 99) };
      if (s.factory && Array.isArray(s.factory.cells)) base.factory = { cells: s.factory.cells, produced: +s.factory.produced || 0 };
      if (s.cos) for (const k in base.cos) if (s.cos[k]) base.cos[k] = s.cos[k];
      if (s.upg) for (const k in base.upg) base.upg[k] = U.clamp(+s.upg[k] || 0, 0, D.UPG[k].max);
    }
    g.save = base;
  }

  function saveGame() {
    try {
      const f = g.save.factory;
      const slim = Object.assign({}, g.save, { factory: f ? { cells: f.cells, produced: f.produced || 0 } : null });
      localStorage.setItem(SAVE_KEY, JSON.stringify(slim));
    } catch (e) { /* private mode */ }
  }

  function wipeSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    g.save = blankSave();
    startBody(0, true);
    g.state = 'cutscene';
    PD.cutscene.start();
    toast(['cross'], UI.COL.bad);
  }

  g.saveGame = saveGame;
  g.wipeSave = wipeSave;

  g.valueMult = function () { return 1 + g.save.bonus / 100 + g.save.dominion * 0.004; };
  g.droneIncome = function () {
    const n = g.save.upg.drones || 0;
    if (!n) return 0;
    return n * 2.4 * D.UPG.droneyield.value(g.save.upg.droneyield || 0) * (1 + g.save.dominion / 100);
  };

  /* ------------------------------------------------------------------ toasts */
  /* Toasts and hints are glyph strips: arrays of glyph names, optionally with
     a number attached. Strings still work for the rare case that needs one. */
  function toast(msg, color, num) {
    g.toasts.push({ msg, color, life: 2.8, num });
    if (g.toasts.length > 4) g.toasts.shift();
  }
  g.toast = toast;
  g.hint = (k, m) => hint(k, m);

  const HINT_TEXT = {
    dive: 'Fly down to the rock. Hold left mouse to drill.',
    full: 'Hold is full! Fly back up to the pod.',
    dock: 'Press E to board the pod and go home.',
    core: 'Keep drilling the core to break the world!',
    air: 'Air is low. Get back to the pod, or hold R.',
    lava: 'Magma! Get out of it!',
    uran: 'Uranium in the hold is cooking you. Sell it fast.',
    tether: 'End of the wire. Upgrade the Tether Reel to go deeper.'
  };
  function hint(key, glyphs) {
    if (g.hintKey === key) { g.hintT = Math.max(g.hintT, 1); return; }
    g.hintKey = key;
    g.hintGlyphs = Array.isArray(glyphs) ? glyphs : [glyphs];
    g.hintText = HINT_TEXT[key] || '';
    g.hintT = 5;
  }

  /* One line that always says what to do next. */
  g.objective = function () {
    const p = g.player;
    const tut = PD.tutorial.current(g);
    if (g.state === 'space') {
      if (p.cargoKg < p.capacity() * 0.5) return { g: ['ore', 'arrowR', 'cargo'], t: 'Collect drifting ore  (' + Math.round(p.cargoKg) + '/' + Math.round(p.capacity()) + ' kg)' };
      return { g: ['hole', 'arrowR', 'home'], t: 'Hold is heavy. Press E to open a time hole home.' };
    }
    if (g.state === 'interior') {
      const raw = Object.values(g.save.vault).reduce((a, c) => a + c, 0);
      const ok = Object.values(g.save.appr).reduce((a, c) => a + c, 0);
      if (ok > 0) return { g: ['sell', 'arrowR', 'coin'], t: 'Sell appraised ore at the Cargo Exchange' };
      if (raw > 0) return { g: ['clock'], t: 'Zaz is appraising your ore (' + raw + ' left)' };
      if (!Object.keys(g.save.upg).some(k => g.save.upg[k] > 0)) return { g: ['coin', 'arrowR', 'hex'], t: 'Spend credits at the Skill Lattice' };
      return { g: ['planet', 'arrowR', 'drill'], t: 'Pick a world at the Nav Computer, or take the airlock' };
    }
    if (g.state === 'play') {
      if (g.world.coreHp < g.world.coreMax) return { g: ['drill', 'arrowR', 'star'], t: 'Break the core!' };
      if (p.cargoFull()) return { g: ['cargo', 'arrowR', 'home'], t: 'Hold full. Board the pod (E)' };
      return { g: ['drill', 'arrowD', 'ore'], t: 'Dig deeper for rarer ore. Watch the wire.' };
    }
    return null;
  };

  /* -------------------------------------------------------------- world setup */
  function startBody(index, freshPlayer) {
    g.bodyIndex = index;
    g.save.bodyIndex = index;
    const body = D.BODIES[index];
    g.world = new PD.world.World(body, index);
    g.mobs.length = 0; g.bullets.length = 0; g.pickups.length = 0; g.boulders.length = 0; g.crates.length = 0;
    g.pings.length = 0; g.banner = null; g.lastStratum = -2;
    g.combo = { n: 0, t: 0, mult: 1 };
    FX.reset();
    g.destruction = null;
    g.victory = null;
    g.cinematic = false;

    g.ship.x = g.world.cx * TILE;
    g.ship.y = Math.max(30, g.world.bodyTopPx - 70);

    if (!g.player || freshPlayer) g.player = new PD.Player(g);
    g.player.clearCargo();
    g.player.reset(g.ship.x, g.ship.y + 34);
    g.player.docked = false;

    spawnMobs();
    g.cam.x = g.player.x - VW / 2;
    g.cam.y = g.player.y - VH / 2;
    if (!g.save.seen[index]) {
      g.save.seen[index] = 1;
      toast(['planet'], UI.COL.gold);
    }
    hint('dive', ['hand', 'arrowD', 'drill']);
  }

  function spawnMobs() {
    const w = g.world;
    const body = w.body;
    const cap = Math.min(90, 14 + g.bodyIndex * 7);
    const scale = 1 + g.bodyIndex * 0.14;
    let tries = 0;
    while (g.mobs.length < cap && tries < 9000) {
      tries++;
      const cx = U.randInt(2, w.w - 3), cy = U.randInt(PD.world.SKY, w.h - 3);
      const i = w.idx(cx, cy);
      if (w.at(cx, cy) || !w.inside[i]) continue;
      if (U.dist(cx * TILE, cy * TILE, w.coreCenter.x, w.coreCenter.y) < w.chamberR + TILE) continue;
      if (!U.chance(body.enemyRate * 0.5)) continue;
      const L0 = w.strata[w.stratum[i]];
      const depth = w.stratum[i] / Math.max(1, w.strata.length - 1);
      let type = U.weighted(body.mobs);
      const x = cx * TILE + TILE / 2, y = cy * TILE + TILE / 2;
      // biome flavour: wyrms haunt the hot bands, shellbacks the deep ones, mites the caves
      if (L0.lava && U.chance(0.35)) type = 'wyrm';
      else if (depth > 0.5 && U.chance(0.2)) type = 'shellback';
      else if (U.chance(0.22)) {
        for (let k = 0; k < 4 + (g.bodyIndex >> 1); k++) g.mobs.push(new PD.ent.Mob('mite', x + U.rand(-10, 10), y + U.rand(-10, 10), scale));
        continue;
      }
      g.mobs.push(new PD.ent.Mob(type, x, y, scale));
    }
    // points of interest get guards and loot
    for (const poi of w.pois) {
      if (poi.kind !== 'ruin') continue;
      const fx = (poi.x0 + 1) * TILE + 5, fy = (poi.y0 + poi.h - 1) * TILE + 4;
      const loot = [];
      const gems = w.strata.flatMap(L0 => L0.ores).map(o => D.M[o[0]]).filter(m => D.MAT[m].shine);
      for (let k = 0; k < 4 + g.bodyIndex; k++) loot.push(U.pick(gems.length ? gems : [D.M.gold]));
      g.crates.push(new PD.ent.Crate(fx + 8, fy, loot));
      if (poi.w > 9) g.crates.push(new PD.ent.Crate((poi.x0 + poi.w - 2) * TILE + 5, fy, loot.slice(0, 3)));
      g.mobs.push(new PD.ent.Mob(g.bodyIndex >= 4 ? 'lurker' : 'gnasher', (poi.x0 + (poi.w >> 1)) * TILE, (poi.y0 + 1) * TILE + 6, scale * 1.2));
    }
    if (g.bodyIndex >= 1) {
      const c = w.coreCenter;
      g.mobs.push(new PD.ent.Mob('guardian', c.x + w.chamberR * 0.5, c.y - w.chamberR * 0.3, 0.5 + g.bodyIndex * 0.32));
    }
  }

  g.travelTo = function (index) {
    if (index > g.save.unlocked) return;
    startBody(index, false);
    g.dive(index);
    toast(['hole', 'arrowR', 'planet'], UI.COL.o2);
  };

  /* --------------------------------------------------------------- economy */
  g.buy = function (id) {
    const u = D.UPG[id];
    const lvl = g.save.upg[id] || 0;
    if (lvl >= u.max) return;
    const cost = D.upgradeCost(u, lvl);
    if (g.save.credits < cost) { A.sfx.deny(); return; }
    g.save.credits -= cost;
    g.save.upg[id] = lvl + 1;
    A.sfx.buy();
    FX.flash(0.16, '#ffd34d');
    if (id === 'oxygen') g.player.o2 = g.player.stat('oxygen');
    if (id === 'hull') g.player.hull = g.player.stat('hull');
    toast(u.name.toUpperCase() + ' LV' + (lvl + 1), UI.COL.good);
    saveGame();
  };

  /* --------------------------------------------------------------- the vault
     Docking no longer auto-sells: ore lands in the ship's bin, and you choose
     between cashing it out at the market or burning it in the fabricator. */
  function stow() {
    const p = g.player;
    let n = 0;
    for (const k in p.cargo) {
      g.save.vault[k] = (g.save.vault[k] || 0) + p.cargo[k];
      n += p.cargo[k];
    }
    p.clearCargo();
    return n;
  }

  g.vaultCount = function (mat) { return g.save.vault[mat] || 0; };

  /* Appraisal: the house values one unit at a time, priciest lot first. It
     runs in real time wherever you are, faster with appraiser staff. */
  g.appraising = function () {
    const keys = Object.keys(g.save.vault).filter(k => g.save.vault[k] > 0).sort((a, b) => D.MAT[b].cr - D.MAT[a].cr);
    return keys.length ? +keys[0] : null;
  };
  function appraiseTick(dt) {
    const mat = g.appraising();
    if (mat === null) { g.save.apprT = 0; return; }
    const need = D.appraiseSeconds(mat, g.save.upg.appraise || 0);
    g.save.apprT += dt;
    while (g.save.apprT >= need && (g.save.vault[mat] || 0) > 0) {
      g.save.apprT -= need;
      g.save.vault[mat]--;
      if (g.save.vault[mat] <= 0) delete g.save.vault[mat];
      g.save.appr[mat] = (g.save.appr[mat] || 0) + 1;
    }
  }
  g.apprFrac = function () {
    const mat = g.appraising();
    if (mat === null) return 0;
    return U.clamp(g.save.apprT / D.appraiseSeconds(mat, g.save.upg.appraise || 0), 0, 1);
  };
  g.saleMult = function () { return g.valueMult() * D.UPG.crew.value(g.save.upg.crew || 0) * (1 - D.appraiseFee(g.save.upg.appraise || 0)); };

  g.sellFromVault = function (mat, qty) {
    const have = g.save.appr[mat] || 0;
    qty = Math.min(qty, have);
    if (qty <= 0) { A.sfx.deny(); return; }
    const value = Math.round(D.MAT[mat].cr * qty * g.saleMult());
    g.save.appr[mat] = have - qty;
    if (g.save.appr[mat] <= 0) delete g.save.appr[mat];
    g.save.credits += value;
    g.save.totalEarned += value;
    A.sfx.coin(qty % 6);
    PD.term.say(['coin'], '#39ffa6', '+' + U.fmt(value));
    saveGame();
  };

  g.sellAll = function () {
    let total = 0, lots = 0;
    for (const k in g.save.appr) {
      total += Math.round(D.MAT[k].cr * g.save.appr[k] * g.saleMult());
      lots++;
    }
    if (!total) { A.sfx.deny(); return; }
    g.save.appr = {};
    g.save.credits += total;
    g.save.totalEarned += total;
    A.sfx.sell();
    for (let i = 0; i < 8; i++) setTimeout(() => A.sfx.coin(i), i * 55);
    PD.term.say(['coin', 'coin', 'coin'], '#39ffa6', '+' + U.fmt(total));
    saveGame();
  };

  g.sellGood = function (key, qty) {
    const have = (g.save.goods || {})[key] || 0;
    qty = Math.min(qty, have);
    if (qty <= 0) return;
    const gd = key.indexOf('raw:') === 0 ? { name: D.MAT[+key.slice(4)].name, cr: D.MAT[+key.slice(4)].cr } : D.goodFromKey(key);
    if (!gd) return;
    const value = Math.round(gd.cr * qty * g.valueMult());
    g.save.goods[key] = have - qty;
    if (g.save.goods[key] <= 0) delete g.save.goods[key];
    g.save.credits += value; g.save.totalEarned += value;
    A.sfx.coin(qty % 6);
    PD.term.say(['coin'], '#39ffa6', '+' + U.fmt(value));
    saveGame();
  };
  g.sellAllGoods = function () {
    let total = 0, lots = 0;
    for (const k in g.save.goods) {
      const gd = k.indexOf('raw:') === 0 ? { cr: D.MAT[+k.slice(4)].cr } : D.goodFromKey(k);
      if (!gd) continue;
      total += Math.round(gd.cr * g.save.goods[k] * g.valueMult()); lots++;
    }
    if (!total) { A.sfx.deny(); return; }
    g.save.goods = {};
    g.save.credits += total; g.save.totalEarned += total;
    A.sfx.sell();
    for (let i = 0; i < 8; i++) setTimeout(() => A.sfx.coin(i), i * 55);
    PD.term.say(['machine', 'arrowR', 'coin'], '#39ffa6', '+' + U.fmt(total));
    saveGame();
  };

  /* Sonar: paint every valuable tile in range on to the minimap for a while. */
  g.scan = function (x, y, r) {
    const w = g.world;
    const c0 = Math.max(0, Math.floor((x - r) / TILE)), c1 = Math.min(w.w - 1, Math.ceil((x + r) / TILE));
    const r0 = Math.max(0, Math.floor((y - r) / TILE)), r1 = Math.min(w.h - 1, Math.ceil((y + r) / TILE));
    let found = 0;
    for (let cy = r0; cy <= r1; cy++) for (let cx = c0; cx <= c1; cx++) {
      const m = w.cells[cy * w.w + cx];
      if (!m || D.MAT[m].cr < 60) continue;
      if (U.dist2(cx * TILE + 5, cy * TILE + 5, x, y) > r * r) continue;
      g.pings.push({ cx, cy, mat: m, life: 9 });
      found++;
    }
    FX.ring(x, y, 4, r, 0.8, '#8affa0', 2);
    FX.ring(x, y, 4, r * 0.6, 0.6, '#8affa0', 1);
    A.sfx.tone(600, { type: 'sine', to: 1400, dur: 0.5, vol: 0.12 });
    A.sfx.tone(1400, { type: 'sine', to: 700, dur: 0.4, vol: 0.06, delay: 0.3 });
    toast(['scan', 'arrowR', 'ore'], found ? '#8affa0' : UI.COL.dim, String(found));
  };

  g.fabricate = function (id) {
    const u = D.UPG[id];
    const lvl = g.save.upg[id] || 0;
    if (lvl >= u.max) { A.sfx.deny(); return; }
    const cost = D.upgradeCost(u, lvl);
    const rec = D.recipe(u, lvl);
    if (g.save.credits < cost) { A.sfx.deny(); PD.term.say(['coin', 'cross'], '#ff5a4d'); return; }
    for (const r of rec) {
      if ((g.save.vault[r.mat] || 0) < r.qty) {
        A.sfx.deny();
        PD.term.say(['ore', 'cross'], '#ff5a4d');
        return;
      }
    }
    g.save.credits -= cost;
    for (const r of rec) {
      g.save.vault[r.mat] -= r.qty;
      if (g.save.vault[r.mat] <= 0) delete g.save.vault[r.mat];
    }
    g.save.upg[id] = lvl + 1;
    if (id === 'oxygen') g.player.o2 = g.player.stat('oxygen');
