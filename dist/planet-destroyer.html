<title>Planet Destroyer</title>
<meta name="description" content="A 2D pixel-art mining sandbox: drill asteroids to the core, get obscenely rich, take over the galaxy.">
<style>
:root {
  --ink: #05030f;
  --grape: #1d1338;
  --edge: #5b3f96;
  --gold: #ffd34d;
  --pink: #ff5fa8;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--ink);
  color: #f2e9ff;
  font-family: "Courier New", ui-monospace, monospace;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}

#screen {
  display: block;
  width: 100vw;
  height: 100vh;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: crosshair;
  background: var(--ink);
}

/* Subtle scanline + vignette laid over the canvas for that CRT arcade feel. */
#crt {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.14) 0px,
      rgba(0, 0, 0, 0.14) 1px,
      rgba(0, 0, 0, 0) 1px,
      rgba(0, 0, 0, 0) 3px
    ),
    radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
  mix-blend-mode: multiply;
  opacity: 0.85;
  z-index: 5;
}

#boot {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: var(--ink);
  z-index: 10;
  text-align: center;
  padding: 24px;
}

#boot h1 {
  margin: 0;
  font-size: clamp(24px, 6vw, 54px);
  letter-spacing: 4px;
  color: var(--gold);
  text-shadow: 4px 4px 0 #7a2a10;
}

#boot h2 {
  margin: 0;
  font-size: clamp(18px, 4.5vw, 40px);
  letter-spacing: 3px;
  color: var(--pink);
  text-shadow: 4px 4px 0 #3a0c30;
}

#boot p { margin: 0; color: #9c8ec4; max-width: 34em; line-height: 1.5; }

#boot .err {
  color: #ff6b8a;
  border: 1px solid #8a2f4a;
  background: #200a18;
  padding: 10px 14px;
  max-width: 40em;
  text-align: left;
  white-space: pre-wrap;
}

.hidden { display: none !important; }

</style>

<canvas id="screen" width="960" height="540"></canvas>
<div id="crt"></div>
<div id="boot">
  <h1>PLANET</h1>
  <h2>DESTROYER</h2>
  <p>Loading the drill&hellip;</p>
</div>

<script>
/* ===== src/util.js ===== */
/* Planet Destroyer -- small math / helper library.
   Everything hangs off the single global PD namespace so the game can run
   straight off the filesystem (classic scripts, no module loader needed). */
window.PD = window.PD || {};

(function (PD) {
  'use strict';

  const TAU = Math.PI * 2;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function invLerp(a, b, v) { return b === a ? 0 : (v - a) / (b - a); }
  function smoothstep(a, b, v) { const t = clamp(invLerp(a, b, v), 0, 1); return t * t * (3 - 2 * t); }

  /* Frame-rate independent exponential approach: `t` is the fraction covered
     in one second. Used for camera and meter easing. */
  function damp(a, b, t, dt) { return lerp(a, b, 1 - Math.pow(1 - t, dt * 60)); }

  function rand(a, b) {
    if (a === undefined) return Math.random();
    if (b === undefined) return Math.random() * a;
    return a + Math.random() * (b - a);
  }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function chance(p) { return Math.random() < p; }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* table is [[value, weight], ...] */
  function weighted(table) {
    let total = 0;
    for (let i = 0; i < table.length; i++) total += table[i][1];
    let r = Math.random() * total;
    for (let i = 0; i < table.length; i++) {
      r -= table[i][1];
      if (r <= 0) return table[i][0];
    }
    return table[table.length - 1][0];
  }

  /* Deterministic hash noise -- keeps tile speckle stable between frames.
     Math.imul throughout: a plain float multiply here overflows 2^53 and
     silently throws away the low bits, which badly skews the distribution. */
  function hash2(x, y) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Cheap value noise built on hash2 -- plenty for ore veins and cave blobs. */
  function noise2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi), b = hash2(xi + 1, yi);
    const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }

  function fbm(x, y, octaves) {
    let sum = 0, amp = 0.5, norm = 0;
    for (let i = 0; i < (octaves || 3); i++) {
      sum += noise2(x, y) * amp;
      norm += amp;
      amp *= 0.5; x *= 2; y *= 2;
    }
    return sum / norm;
  }

  /* Turn "I want the top f fraction of tiles" into an fbm threshold.
     fbm() is roughly normal (mean ~0.52, sd ~0.15), so we go through a small
     inverse-normal table instead of guessing cutoffs. */
  const QZ = [
    [0.00, 3.2], [0.01, 2.33], [0.02, 2.05], [0.05, 1.645], [0.10, 1.282],
    [0.15, 1.036], [0.20, 0.842], [0.25, 0.674], [0.30, 0.524], [0.40, 0.253],
    [0.50, 0], [0.60, -0.253], [0.70, -0.524], [0.80, -0.842], [0.90, -1.282],
    [1.00, -3.2]
  ];
  function probitTop(f) {
    f = clamp(f, 0, 1);
    for (let i = 1; i < QZ.length; i++) {
      if (f <= QZ[i][0]) {
        const t = (f - QZ[i - 1][0]) / (QZ[i][0] - QZ[i - 1][0]);
        return lerp(QZ[i - 1][1], QZ[i][1], t);
      }
    }
    return -3.2;
  }
  function fbmThreshold(f, mean, sd) {
    return (mean === undefined ? 0.52 : mean) + (sd === undefined ? 0.15 : sd) * probitTop(f);
  }

  function dist(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return Math.sqrt(dx * dx + dy * dy); }
  function dist2(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; }

  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  /* Shortest signed angle from a to b. */
  function angleDelta(a, b) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }

  const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
  function fmt(n) {
    n = Math.floor(n);
    if (Math.abs(n) < 1000) return String(n);
    let tier = 0;
    let v = n;
    while (Math.abs(v) >= 1000 && tier < SUFFIX.length - 1) { v /= 1000; tier++; }
    const s = v < 10 ? v.toFixed(2) : (v < 100 ? v.toFixed(1) : v.toFixed(0));
    return s.replace(/\.0+$/, '') + SUFFIX[tier];
  }

  function fmtKg(kg) {
    return (kg < 10 ? kg.toFixed(1) : Math.round(kg).toString()) + 'kg';
  }

  function roman(n) {
    const map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
    let out = '';
    for (const [v, s] of map) { while (n >= v) { out += s; n -= v; } }
    return out || 'I';
  }

  PD.util = {
    TAU, clamp, lerp, invLerp, smoothstep, damp,
    rand, randInt, chance, pick, shuffle, weighted,
    hash2, mulberry32, noise2, fbm, probitTop, fbmThreshold,
    dist, dist2, aabb, angleDelta,
    fmt, fmtKg, roman
  };
})(window.PD);

/* ===== src/pix.js ===== */
/* A tiny pixel-pushing helper.
   Sprites are painted at their true pixel size with hard-edged primitives, then
   `outline()` traces a dark border around everything -- which is what gives the
   whole game its chunky cartoon look for free. */
(function (PD) {
  'use strict';

  function Pix(w, h) {
    this.w = w; this.h = h;
    this.d = new Array(w * h).fill(null);
  }

  Pix.prototype.idx = function (x, y) { return y * this.w + x; };

  Pix.prototype.set = function (x, y, c) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return this;
    this.d[y * this.w + x] = c;
    return this;
  };

  Pix.prototype.get = function (x, y) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null;
    return this.d[y * this.w + x];
  };

  Pix.prototype.rect = function (x, y, w, h, c) {
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c);
    return this;
  };

  Pix.prototype.ellipse = function (cx, cy, rx, ry, c) {
    const x0 = Math.floor(cx - rx - 1), x1 = Math.ceil(cx + rx + 1);
    const y0 = Math.floor(cy - ry - 1), y1 = Math.ceil(cy + ry + 1);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) this.set(x, y, c);
      }
    }
    return this;
  };

  Pix.prototype.disc = function (cx, cy, r, c) { return this.ellipse(cx, cy, r, r, c); };

  /* Rounded rectangle -- corners are simply clipped by a distance test. */
  Pix.prototype.round = function (x, y, w, h, r, c) {
    for (let j = 0; j < h; j++) {
      for (let i = 0; i < w; i++) {
        const px = i < r ? r - i - 0.5 : (i >= w - r ? i - (w - r) + 0.5 : 0);
        const py = j < r ? r - j - 0.5 : (j >= h - r ? j - (h - r) + 0.5 : 0);
        if (px * px + py * py > r * r) continue;
        this.set(x + i, y + j, c);
      }
    }
    return this;
  };

  Pix.prototype.line = function (x0, y0, x1, y1, c) {
    x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    for (;;) {
      this.set(x0, y0, c);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
    return this;
  };

  /* Isoceles triangle pointing up (dir -1) or down (dir 1). */
  Pix.prototype.spike = function (x, y, w, h, dir, c) {
    for (let j = 0; j < h; j++) {
      const t = j / h;
      const half = Math.max(0, (w / 2) * (1 - t));
      const yy = dir > 0 ? y + j : y + h - 1 - j;
      for (let i = -half; i <= half; i++) this.set(x + i, yy, c);
    }
    return this;
  };

  /* Mirror the left half onto the right half -- keeps faces symmetrical. */
  Pix.prototype.mirrorX = function () {
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w / 2; x++) {
        this.set(this.w - 1 - x, y, this.get(x, y));
      }
    }
    return this;
  };

  Pix.prototype.replace = function (from, to) {
    for (let i = 0; i < this.d.length; i++) if (this.d[i] === from) this.d[i] = to;
    return this;
  };

  /* Trace a border around every filled pixel. */
  Pix.prototype.outline = function (c) {
    const snap = this.d.slice();
    const at = (x, y) => (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : snap[y * this.w + x];
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        if (at(x, y)) continue;
        if (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1)) this.set(x, y, c);
      }
    }
    return this;
  };

  /* Darken the lower-right facing pixels of a colour to fake a light source. */
  Pix.prototype.shade = function (from, to, dx, dy) {
    const snap = this.d.slice();
    const at = (x, y) => (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : snap[y * this.w + x];
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        if (at(x, y) !== from) continue;
        const n = at(x + dx, y + dy);
        if (n === null || n !== from) this.set(x, y, to);
      }
    }
    return this;
  };

  Pix.prototype.toCanvas = function () {
    const cv = document.createElement('canvas');
    cv.width = this.w; cv.height = this.h;
    const ctx = cv.getContext('2d');
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        const c = this.d[y * this.w + x];
        if (!c) continue;
        ctx.fillStyle = c;
        ctx.fillRect(x, y, 1, 1);
      }
    }
    return cv;
  };

  PD.Pix = Pix;
  PD.pix = (w, h) => new Pix(w, h);
})(window.PD);

/* ===== src/glyph.js ===== */
/* The game's icon language. Every glyph is drawn procedurally at 12x12 and
   cached per colour, so the HUD, terminals and tutorial can speak without
   words: a bar plus a glyph plus a number is a sentence. */
(function (PD) {
  'use strict';
  const pix = PD.pix;
  const U = PD.util;

  const INK = '#1a1030';
  const builders = {};
  const cache = {};

  function def(name, fn) { builders[name] = fn; }

  /* Each builder draws in a single "paint" colour c, plus optional accent a. */
  def('coin', (p, c, a) => { p.disc(6, 6, 5, c); p.disc(6, 6, 3.2, a); p.rect(5, 3, 2, 6, c); p.rect(4, 4, 4, 1, c); p.rect(4, 7, 4, 1, c); });
  def('ore', (p, c, a) => { p.round(1, 4, 10, 7, 3, c); p.round(3, 1, 6, 5, 2, c); p.rect(3, 3, 3, 1, a); p.rect(2, 6, 2, 2, a); p.rect(7, 7, 2, 1, a); p.set(5, 2, '#ffffff'); });
  def('drill', (p, c, a) => { p.round(0, 4, 5, 4, 1, a); for (let x = 5; x < 12; x++) { const h = Math.max(0, 2.5 - (x - 5) * 0.4); for (let y = -h; y <= h; y++) p.set(x, Math.round(6 + y), (x + Math.round(y)) % 2 ? c : a); } });
  def('gun', (p, c, a) => { p.round(0, 4, 8, 4, 1, a); p.rect(2, 8, 2, 3, a); p.rect(8, 5, 4, 2, c); });
  def('scatter', (p, c, a) => { p.round(0, 4, 7, 4, 1, a); p.rect(2, 8, 2, 3, a); p.rect(7, 3, 5, 2, c); p.rect(7, 7, 5, 2, c); });
  def('lance', (p, c, a) => { p.round(0, 4, 6, 4, 1, a); p.rect(2, 8, 2, 3, a); p.rect(6, 5, 6, 2, c); p.rect(10, 3, 2, 6, c); });
  def('dash', (p, c, a) => { p.spike(8, 2, 8, 8, 1, c); p.rect(0, 4, 4, 1, a); p.rect(0, 6, 5, 1, a); p.rect(0, 8, 3, 1, a); });
  def('scan', (p, c, a) => { for (let t = 0; t < 6.3; t += 0.35) p.set(6 + Math.cos(t) * 5, 6 + Math.sin(t) * 5, a); p.disc(6, 6, 2, c); p.line(6, 6, 10, 2, c); });
  def('o2', (p, c, a) => { p.round(3, 2, 6, 10, 2, c); p.rect(4, 0, 4, 2, a); p.rect(5, 4, 2, 5, a); });
  def('hull', (p, c, a) => { p.round(2, 1, 8, 7, 2, c); p.spike(6, 6, 8, 5, 1, c); p.rect(5, 3, 2, 3, a); });
  def('cargo', (p, c, a) => { p.round(1, 3, 10, 8, 1, c); p.rect(1, 5, 10, 1, a); p.rect(5, 3, 2, 8, a); });
  def('weight', (p, c, a) => { p.spike(6, 4, 10, 7, 1, c); p.rect(2, 10, 8, 1, c); p.rect(5, 1, 2, 3, a); p.set(5, 1, c); p.set(6, 1, c); });
  def('planet', (p, c, a) => { p.disc(6, 6, 4.5, c); p.disc(4.5, 4.5, 1.5, a); p.disc(7.5, 7, 1, a); p.rect(0, 6, 12, 1, a); });
  def('hole', (p, c, a) => { p.disc(6, 6, 5.5, c); p.disc(6, 6, 3.6, a); p.disc(6, 6, 2, INK); p.set(9, 3, a); p.set(3, 9, a); });
  def('hand', (p, c, a) => { p.rect(5, 0, 3, 7, c); p.round(2, 5, 9, 7, 2, c); p.rect(1, 6, 2, 3, c); p.rect(9, 6, 2, 3, c); p.rect(6, 1, 1, 4, a); p.rect(4, 8, 5, 1, a); });
  def('arrowR', (p, c) => { p.rect(0, 5, 7, 2, c); p.spike(8, 2, 8, 4, 1, c); p.spike(8, 6, 8, 4, -1, c); p.rect(7, 4, 2, 4, c); });
  def('arrowD', (p, c) => { p.rect(5, 0, 2, 7, c); for (let i = 0; i < 4; i++) p.rect(2 + i, 6 + i, 8 - i * 2, 1, c); });
  def('arrowU', (p, c) => { p.rect(5, 5, 2, 7, c); for (let i = 0; i < 4; i++) p.rect(2 + i, 5 - i, 8 - i * 2, 1, c); });
  def('lock', (p, c, a) => { p.round(2, 5, 8, 7, 1, c); p.rect(3, 2, 6, 4, a); p.rect(4, 3, 4, 3, INK); p.rect(3, 2, 6, 1, a); p.rect(5, 7, 2, 3, INK); });
  def('check', (p, c) => { p.line(1, 6, 4, 10, c); p.line(2, 6, 5, 10, c); p.line(4, 10, 11, 2, c); p.line(5, 10, 11, 3, c); });
  def('cross', (p, c) => { p.line(1, 1, 10, 10, c); p.line(2, 1, 11, 10, c); p.line(10, 1, 1, 10, c); p.line(11, 1, 2, 10, c); });
  def('clock', (p, c, a) => { p.disc(6, 6, 5.5, c); p.disc(6, 6, 4.3, INK); p.rect(5, 2, 2, 5, a); p.rect(6, 6, 3, 2, a); });
  def('star', (p, c, a) => { p.spike(6, 0, 5, 6, 1, c); p.spike(6, 6, 5, 6, -1, c); p.rect(0, 5, 12, 2, c); p.disc(6, 6, 1.5, a); });
  def('skull', (p, c, a) => { p.round(2, 1, 8, 7, 3, c); p.rect(3, 3, 2, 2, INK); p.rect(7, 3, 2, 2, INK); p.rect(4, 7, 4, 2, c); p.rect(4, 8, 1, 2, c); p.rect(6, 8, 1, 2, c); p.set(5, 6, INK); p.set(6, 6, INK); });
  def('machine', (p, c, a) => { p.round(1, 4, 10, 7, 1, c); p.rect(2, 1, 3, 3, a); p.rect(7, 2, 2, 2, a); p.rect(3, 6, 6, 2, INK); p.rect(3, 6, 3, 2, a); });
  def('belt', (p, c, a) => { p.rect(0, 4, 12, 4, c); p.rect(1, 5, 2, 2, a); p.rect(5, 5, 2, 2, a); p.rect(9, 5, 2, 2, a); });
  def('crew', (p, c, a) => { p.disc(6, 3.5, 3, c); p.round(1, 7, 10, 5, 2, c); p.set(5, 3, INK); p.set(7, 3, INK); p.rect(3, 9, 6, 1, a); });
  def('home', (p, c, a) => { p.spike(6, 0, 12, 6, 1, c); p.rect(2, 6, 8, 6, c); p.rect(5, 8, 2, 4, INK); p.rect(3, 7, 2, 2, a); });
  def('bang', (p, c) => { p.rect(5, 0, 2, 7, c); p.rect(5, 9, 2, 2, c); });
  def('quest', (p, c) => { p.round(3, 0, 6, 5, 2, c); p.rect(4, 1, 4, 2, INK); p.rect(3, 1, 1, 2, INK); p.rect(6, 5, 2, 3, c); p.rect(6, 10, 2, 2, c); });
  def('play', (p, c) => { p.spike(6, 1, 10, 10, 1, c); }); // pointing down; rotated in draw
  def('rock', (p, c, a) => { p.round(1, 3, 10, 8, 3, c); p.round(3, 1, 6, 4, 2, c); p.set(4, 5, a); p.set(7, 6, a); p.set(5, 8, a); });
  def('depth', (p, c, a) => { p.rect(2, 0, 8, 2, c); p.rect(5, 2, 2, 7, c); p.spike(6, 8, 8, 4, 1, c); p.rect(0, 10, 12, 2, a); });

  def('hex', (p, c) => { for (let y = 0; y < 12; y++) { const w = y < 3 ? 2 + y * 1.7 : (y > 8 ? 2 + (11 - y) * 1.7 : 6); for (let x = -w; x <= w; x++) p.set(6 + x, y, c); } });

  function build(name, c, a) {
    const key = name + '|' + c + '|' + a;
    if (cache[key]) return cache[key];
    const p = pix(14, 14);
    const inner = pix(12, 12);
    (builders[name] || builders.quest)(inner, c, a || c);
    for (let y = 0; y < 12; y++) for (let x = 0; x < 12; x++) { const v = inner.get(x, y); if (v) p.set(x + 1, y + 1, v); }
    p.outline(INK);
    const cv = p.toCanvas();
    cache[key] = cv;
    return cv;
  }

  /* Draw a glyph with its top-left at x,y (14px box) at integer scale. */
  function draw(ctx, name, x, y, c, a, scale) {
    const cv = build(name, c || '#f2e9ff', a || '#9c8ec4');
    const s = scale || 1;
    ctx.drawImage(cv, 0, 0, 14, 14, x | 0, y | 0, 14 * s, 14 * s);
  }

  /* A glyph + a number, the game's basic HUD sentence. Returns the width. */
  function stat(ctx, name, value, x, y, c, a, numCol) {
    draw(ctx, name, x, y, c, a);
    PD.font.draw(ctx, value, x + 17, y + 4, numCol || '#f2e9ff');
    return 17 + PD.font.width(String(value), 1);
  }

  /* Hexagon outline/fill helpers -- the UI's only shape besides the rectangle. */
  function hexPath(ctx, x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ang = Math.PI / 6 + i * Math.PI / 3;
      const px = x + Math.cos(ang) * r, py = y + Math.sin(ang) * r;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
  }
  function hex(ctx, x, y, r, fill, stroke, lw) {
    hexPath(ctx, x, y, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
  }
  /* Six-segment progress ring drawn as hex arcs. */
  function hexProgress(ctx, x, y, r, frac, col) {
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    const segs = Math.round(U.clamp(frac, 0, 1) * 6);
    for (let i = 0; i < segs; i++) {
      const a0 = -Math.PI / 2 + i * Math.PI / 3, a1 = a0 + Math.PI / 3;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a0) * r, y + Math.sin(a0) * r);
      ctx.lineTo(x + Math.cos(a1) * r, y + Math.sin(a1) * r);
      ctx.stroke();
    }
  }

  PD.glyph = { draw, stat, hex, hexPath, hexProgress, names: Object.keys(builders), build };
})(window.PD);

      ox: ox === undefined ? frames[0].width / 2 : ox,
      oy: oy === undefined ? frames[0].height / 2 : oy
    };
    return sprites[name];
  }

  /* ------------------------------------------------------------------ player
     A round little alien in a bubble helmet. Drawn facing right; the renderer
     flips it for leftward travel. */
  /* pose: 'idle' | 'walk' | 'fly'; f: frame index. Head sits on a chubby
     torso with proper little arms and legs, so it can walk the deck and
     dangle from the tether. */
  function buildAlien(pose, f, P, blink) {
    P = P || C;
    const p = pix(24, 34);
    const walk = pose === 'walk';
    const fly = pose === 'fly';
    const bob = walk ? (f % 2 ? 1 : 0) : (pose === 'idle' && f ? 1 : 0);
    const cy = 10 + bob;           // helmet centre
    const ty = 18 + bob;           // torso top

    // legs
    if (fly) {
      // trailing behind in zero-g, slightly apart
      p.round(7, ty + 8, 4, 7, 2, P.suitD); p.round(13, ty + 9, 4, 6, 2, P.suitD);
      p.rect(7, ty + 14, 4, 2, C.metD); p.rect(13, ty + 14, 4, 2, C.metD);
    } else {
      const swing = walk ? [[-2, 2], [0, 0], [2, -2], [0, 0]][f % 4] : [0, 0];
      p.round(7 + swing[0], ty + 8, 4, 8 - Math.abs(swing[0]), 2, P.suitD);
      p.round(13 + swing[1], ty + 8, 4, 8 - Math.abs(swing[1]), 2, P.suitD);
      p.rect(6 + swing[0], ty + 15 - Math.abs(swing[0]), 6, 2, C.metD);
      p.rect(12 + swing[1], ty + 15 - Math.abs(swing[1]), 6, 2, C.metD);
    }

    // jetpack
    p.round(2, ty - 1, 5, 9, 2, C.metD);
    p.rect(3, ty, 2, 6, C.met);
    if (fly) { p.rect(3, ty + 8, 3, 3, C.orange); p.rect(4, ty + 11, 1, 2, C.gold); }

    // torso
    p.round(6, ty, 12, 10, 3, P.suit);
    p.rect(8, ty, 8, 2, P.suitL);
    p.rect(10, ty + 5, 4, 2, C.gold);

    // arms: the back arm swings with the walk, the front arm reaches forward
    const aswing = walk ? [2, 0, -2, 0][f % 4] : 0;
    p.round(4, ty + 1 + aswing, 3, 7, 1, P.suit);        // back arm
    p.round(5, ty + 7 + aswing, 3, 3, 1, P.skin);        // hand
    p.round(16, ty + 2 - aswing, 4, 6, 1, P.suit);       // front arm
    p.round(17, ty + 7 - aswing, 3, 3, 1, P.skin);

    // helmet + head
    p.disc(12, cy, 8, P.glass);
    p.disc(12, cy + 1, 5.6, P.skin);
    p.shade(P.skin, P.skinD, 1, 1);
    p.ellipse(12, cy - 2.5, 3.4, 1.6, P.skinL);
    if (blink) { p.rect(8, cy + 1, 3, 1, C.eye); p.rect(14, cy + 1, 3, 1, C.eye); }
    else {
      p.ellipse(9.4, cy + 1, 1.7, 2.4, C.eye); p.ellipse(15.2, cy + 1, 1.7, 2.4, C.eye);
      p.set(10, cy - 1, C.white); p.set(10, cy, C.white); p.set(16, cy - 1, C.white); p.set(16, cy, C.white);
    }
    p.rect(12, cy + 4, 3, 1, P.skinD); p.set(15, cy + 3, P.skinD);
    p.set(7, cy - 4, P.glassL); p.set(8, cy - 5, P.glassL); p.set(9, cy - 6, P.glassL); p.set(8, cy - 4, P.glassL);
    p.line(12, cy - 8, 12, cy - 10, C.metD);
    p.disc(12, cy - 11.5, 1.8, C.gold);

    p.outline(C.ink);
    return p;
  }

  function alienSet(P) {
    return {
      idle: [buildAlien('idle', 0, P), buildAlien('idle', 1, P), buildAlien('idle', 0, P, true)],
      walk: [0, 1, 2, 3].map(i => buildAlien('walk', i, P)),
      fly: [buildAlien('fly', 0, P), buildAlien('fly', 1, P)]
    };
  }

  const base = alienSet(C);
  reg('alien', base.idle, 12, 22);
  reg('alienWalk', base.walk, 12, 22);
  reg('alienFly', base.fly, 12, 22);

  /* ------------------------------------------------------------------- drill
     Horizontal, pointing right, anchored at the shoulder end. */
  function buildDrill(phase, P) {
    P = P || { met: C.met, metDD: C.metDD, accent: C.orange };
    const p = pix(26, 12);
    p.round(0, 3, 9, 6, 2, P.metDD);          // housing
    p.rect(2, 4, 5, 2, P.met);
    p.rect(8, 4, 3, 4, P.accent);             // collar
    for (let x = 10; x < 25; x++) {           // tapering bit
      const t = (x - 10) / 15;
      const half = Math.max(0.6, 4 * (1 - t * 0.92));
      for (let y = -half; y <= half; y++) {
        const yy = Math.round(6 + y);
        const stripe = ((x * 2 + yy + phase * 3) % 7) < 3;
        p.set(x, yy, stripe ? P.met : P.metDD);
      }
    }
    p.outline(C.ink);
    return p;
  }
  reg('drill', [0, 1, 2, 3].map(buildDrill), 3, 6);

  /* ------------------------------------------------------------------ pistol */
  function buildGun(charge) {
    const p = pix(18, 11);
    p.round(0, 3, 11, 6, 2, C.metDD);
    p.rect(2, 4, 5, 2, C.met);
    p.rect(3, 8, 3, 3, C.suitD);              // grip
    p.rect(11, 4, 4, 4, C.metD);
    p.rect(15, 4, 2, 4, charge ? C.cyan : C.cyanD);
    p.rect(6, 2, 4, 2, C.cyanD);              // energy cell
    p.outline(C.ink);
    return p;
  }
  reg('gun', [buildGun(false), buildGun(true)], 3, 6);

  /* -------------------------------------------------------------------- ship
     The Rustmaw: a fat little mining barge with landing legs and a bay door. */
  function buildShip(blink, P) {
    P = P || { met: C.met, metD: C.metD, metDD: C.metDD };
    const p = pix(84, 52);
    // landing legs first so the hull covers their tops
    p.line(16, 32, 10, 47, P.metDD); p.line(17, 32, 11, 47, P.metDD);
    p.line(67, 32, 73, 47, P.metDD); p.line(66, 32, 72, 47, P.metDD);
    p.round(5, 46, 12, 4, 2, P.metD);
    p.round(66, 46, 12, 4, 2, P.metD);

    // hull
    p.round(6, 12, 72, 24, 10, P.met);
    p.shade(P.met, P.metD, 0, 1);
    p.round(9, 14, 66, 5, 2, C.white);
    p.round(6, 30, 72, 7, 6, P.metD);

    // engine pods
    p.round(0, 17, 10, 12, 4, P.metDD);
    p.round(74, 17, 10, 12, 4, P.metDD);
    p.rect(2, 21, 3, 4, C.cyan);
    p.rect(79, 21, 3, 4, C.cyan);

    // cockpit dome
    p.disc(28, 12, 11, C.glass);
    p.disc(28, 13, 8, C.ink2);
    p.ellipse(25, 8, 3.2, 1.6, C.glassL);
    p.round(18, 12, 21, 3, 1, P.metD);

    // bay door + tractor emitter
    p.round(36, 33, 16, 5, 2, P.metDD);
    p.rect(40, 35, 8, 3, blink ? C.cyan : C.cyanD);

    // hull lights and decal
    p.disc(58, 24, 2.4, blink ? C.gold : C.goldD);
    p.disc(50, 24, 2.4, C.red);
    p.disc(66, 24, 2.4, C.lime);
    // tiny skull decal, because we are the villain
    p.round(13, 20, 8, 7, 2, C.gold);
    p.rect(15, 22, 2, 2, C.ink); p.rect(18, 22, 2, 2, C.ink);
    p.rect(16, 25, 3, 1, C.ink);

    // antenna
    p.line(45, 12, 45, 3, P.metD);
    p.disc(45, 2, 2, C.red);

    p.outline(C.ink);
    return p;
  }
  reg('ship', [buildShip(false), buildShip(true)], 42, 26);

  /* ------------------------------------------------------------------- drone */
  function buildDrone(phase) {
    const p = pix(14, 12);
    p.round(3, 4, 8, 6, 2, C.met);
    p.shade(C.met, C.metD, 0, 1);
    p.disc(7, 6.5, 2, C.cyan);
    const lift = phase ? 0 : 1;
    p.rect(0, 3 + lift, 4, 1, C.metD);
    p.rect(10, 3 + lift, 4, 1, C.metD);
    p.rect(5, 10, 4, 2, C.metDD);
    p.outline(C.ink);
    return p;
  }
  reg('drone', [buildDrone(0), buildDrone(1)], 7, 6);

  /* ----------------------------------------------------------------- enemies */
  function buildGrub(phase) {
    const p = pix(20, 14);
    const hump = phase === 1 ? 1 : 0;
    p.ellipse(10, 8 - hump, 8, 4.4, C.limeD);
    p.ellipse(10, 7 - hump, 7.4, 3.6, C.lime);
    for (let i = 0; i < 4; i++) p.rect(4 + i * 4, 4 - hump, 2, 3, C.limeD); // back ridges
    // legs
    for (let i = 0; i < 3; i++) {
      const lx = 5 + i * 5, d = ((i + phase) % 2) ? 1 : 0;
      p.line(lx, 11 - hump, lx - 1, 13 - d, C.ink2);
    }
    // face at the right end
    p.ellipse(15, 7 - hump, 1.5, 2, C.eye);
    p.set(16, 6 - hump, C.white);
    p.ellipse(12, 7 - hump, 1.5, 2, C.eye);
    p.set(13, 6 - hump, C.white);
    p.rect(17, 9 - hump, 2, 1, C.redD);
    p.outline(C.ink);
    return p;
  }
  reg('grub', [buildGrub(0), buildGrub(1)], 10, 8);

  function buildJelly(phase) {
    const p = pix(18, 22);
    const squash = phase === 1 ? 1 : 0;
    p.ellipse(9, 7 + squash, 7.5 - squash, 6 + squash, C.purple);
    p.shade(C.purple, C.purpleD, 0, 1);
    p.ellipse(6.5, 4 + squash, 2.4, 1.4, C.white);
    // tentacles
    for (let i = 0; i < 4; i++) {
      const tx = 3 + i * 4;
      const wob = ((i + phase) % 2) ? 1 : -1;
      p.line(tx, 12 + squash, tx + wob, 16 + squash, C.purpleD);
      p.line(tx + wob, 16 + squash, tx, 20, C.purpleD);
    }
    // one big cyclops eye
    p.disc(9, 8 + squash, 2.6, C.white);
    p.disc(9.5, 8 + squash, 1.5, C.eye);
    p.outline(C.ink);
    return p;
  }
  reg('jelly', [buildJelly(0), buildJelly(1)], 9, 8);

  function buildSpit(phase) {
    const p = pix(22, 16);
    p.ellipse(9, 9, 8, 6, C.slimeD);
    p.ellipse(9, 8, 7, 5, C.slime);
    p.ellipse(6, 5, 2.6, 1.4, C.white);
    // snout
    const open = phase === 1 ? 1 : 0;
    p.round(16, 6 - open, 5, 5 + open * 2, 1, C.slimeD);
    p.rect(20, 8 - open, 2, 2 + open, C.ink2);
    // eyes
    p.ellipse(9, 7, 1.6, 2.1, C.eye); p.set(10, 6, C.white);
    p.ellipse(13, 7, 1.6, 2.1, C.eye); p.set(14, 6, C.white);
    // spikes
    p.spike(5, 1, 4, 3, -1, C.slimeD);
    p.spike(10, 1, 4, 3, -1, C.slimeD);
    p.outline(C.ink);
    return p;
  }
  reg('spit', [buildSpit(0), buildSpit(1)], 9, 9);

  function buildGnasher(phase) {
    const p = pix(24, 17);
    p.ellipse(11, 9, 9.5, 6.5, C.orangeD);
    p.ellipse(11, 8, 8.6, 5.6, C.orange);
    p.ellipse(7, 4, 3, 1.6, C.white);
    // huge mouth on the right
    const gape = phase === 1 ? 2 : 0;
    p.round(15, 6 - gape, 8, 7 + gape * 2, 2, C.redD);
    for (let i = 0; i < 3; i++) {
      p.spike(17 + i * 2, 6 - gape, 3, 3, 1, C.white);
      p.spike(17 + i * 2, 10 + gape, 3, 3, -1, C.white);
    }
    // angry eyes
    p.ellipse(10, 7, 1.8, 2.2, C.eye); p.set(11, 6, C.white);
    p.ellipse(14, 7, 1.8, 2.2, C.eye); p.set(15, 6, C.white);
    p.line(8, 3, 12, 4, C.ink); p.line(13, 4, 16, 3, C.ink);
    // back spines
    p.spike(5, 0, 5, 4, -1, C.orangeD);
    p.spike(10, 0, 5, 4, -1, C.orangeD);
    p.outline(C.ink);
    return p;
  }
  reg('gnasher', [buildGnasher(0), buildGnasher(1)], 11, 9);

  function buildLurker(phase) {
    const p = pix(30, 26);
    const bob = phase === 1 ? 1 : 0;

    for (let i = 0; i < 5; i++) {
      const tx = 5 + i * 5;
      const wob = ((i + phase) % 2) ? 1 : -1;
      p.line(tx, 17, tx + wob, 21, C.purpleD);
      p.line(tx + wob, 21, tx, 25 - bob, C.purpleD);
      p.set(tx, 25 - bob, C.red);

    p.ellipse(14, 11 + bob, 12, 9, C.purpleD);
    p.ellipse(14, 10 + bob, 11, 8, C.purple);
    p.ellipse(9, 5 + bob, 4, 2, C.glassL);
    // single glowing eye
    p.disc(15, 11 + bob, 4.4, C.white);
    p.disc(16, 11 + bob, 2.8, C.red);
    p.disc(16.5, 11 + bob, 1.2, C.ink);

    p.spike(6, 1 + bob, 6, 5, -1, C.purpleD);
    p.spike(20, 1 + bob, 6, 5, -1, C.purpleD);
    p.outline(C.ink);

  reg('lurker', [buildLurker(0), buildLurker(1)], 14, 12);

  function buildWarden(phase) {
    const p = pix(40, 36);
    const bob = phase === 1 ? 1 : 0;
    // armoured legs
    for (let i = 0; i < 4; i++) {
      const lx = 6 + i * 9, d = ((i + phase) % 2) ? 1 : 0;
      p.line(lx, 26, lx - 2, 32 - d, C.metDD);
      p.line(lx - 2, 32 - d, lx - 3, 35, C.metDD);

    p.ellipse(20, 16 + bob, 15, 11, C.metD);
    p.ellipse(20, 14 + bob, 12, 7, C.met);
    p.shade(C.met, C.metD, 0, 1);
    // armour plates
    for (let i = 0; i < 4; i++) p.rect(8 + i * 8, 8 + bob, 5, 3, C.orangeD);
    // giant core eye
    p.disc(20, 18 + bob, 6.5, C.ink2);
    p.disc(20, 18 + bob, 5, C.orange);
    p.disc(20, 18 + bob, 2.6, C.gold);
    p.disc(19, 17 + bob, 1.2, C.white);
    // shoulder spikes
    p.spike(6, 2 + bob, 8, 7, -1, C.metDD);
    p.spike(34, 2 + bob, 8, 7, -1, C.metDD);
    p.outline(C.ink);
    return p;
  }
  reg('warden', [buildWarden(0), buildWarden(1)], 20, 18);

  /* CAVE MITE: tiny, fast, comes in clouds. */
  function buildMite(phase) {
    const p = pix(10, 9);
    p.ellipse(5, 4, 3.6, 2.6, C.limeD);
    p.ellipse(5, 3.6, 3, 2, C.lime);
    p.set(6, 3, C.eye); p.set(4, 3, C.eye);

    p.line(1, 4, 0, 2 + f, C.ink2); p.line(9, 4, 10, 2 - f, C.ink2);
    p.line(2, 6, 1, 8, C.ink2); p.line(8, 6, 9, 8, C.ink2);
    p.outline(C.ink);
    return p;

  reg('mite', [buildMite(0), buildMite(1)], 5, 4);

  /* SHELLBACK: armoured slab of a beast; shots glance off the carapace. */
  function buildShellback(phase) {
    const p = pix(28, 20);
    const lift = phase ? 1 : 0;
    for (let i = 0; i < 4; i++) {
      const lx = 5 + i * 6, d = ((i + phase) % 2) ? 1 : 0;
      p.line(lx, 15, lx - 1, 19 - d, C.ink2);
    }
    p.ellipse(13, 10, 12, 7, C.metDD);
    p.ellipse(13, 9 - lift, 11, 6, C.metD);
    for (let i = 0; i < 3; i++) p.round(4 + i * 7, 4 - lift, 5, 5, 2, C.met);   // plates
    p.rect(3, 9 - lift, 20, 1, C.metDD);
    // head at the right
    p.ellipse(24, 12, 3.4, 2.8, C.orangeD);
    p.ellipse(24.5, 11.5, 2.6, 2, C.orange);
    p.set(25, 11, C.eye); p.set(26, 11, C.eye);
    p.rect(26, 13, 2, 1, C.redD);
    p.outline(C.ink);
    return p;
  }
  reg('shellback', [buildShellback(0), buildShellback(1)], 14, 12);

  /* MAGMA WYRM: lives in the lava, bursts out to bite. */
  function buildWyrm(phase) {
    const p = pix(30, 20);
    const und = phase ? 1 : 0;
    // segmented body trailing left
    for (let i = 0; i < 4; i++) {
      const bx = 4 + i * 5, by = 12 + Math.sin(i * 1.4 + und) * 2;
      p.disc(bx, by, 3.4 - i * 0.3, C.redD);
      p.disc(bx, by - 1, 2.4 - i * 0.25, C.orange);
    }
    // head
    p.ellipse(22, 9 - und, 6.5, 5, C.redD);
    p.ellipse(22, 8 - und, 5.5, 4, C.orange);
    p.ellipse(21, 5 - und, 2.6, 1.2, C.gold);
    p.round(24, 8 - und, 6, 4 + und, 1, C.ink2);           // maw
    for (let i = 0; i < 3; i++) p.set(25 + i * 2, 8 - und, C.white);
    p.ellipse(21, 7 - und, 1.5, 1.7, C.eye); p.set(22, 6 - und, C.gold);
    p.spike(18, 1 - und, 4, 4, -1, C.redD);
    p.outline(C.ink);
    return p;
  }
  reg('wyrm', [buildWyrm(0), buildWyrm(1)], 15, 11);

  /* SCATTERGUN and LANCE: the other two things you point at problems. */

  reg('scooter', [buildScooter(0), buildScooter(1)], 15, 8);

  /* THE POD: your own little fat ship. Round, stubby-winged, a dome up top

  function buildPod(phase, P) {
    P = P || { met: C.met, metD: C.metD, metDD: C.metDD };

    p.disc(19, 10, 5, C.ink2);

  /* LOOT CRATE: precursor supply case. */

  /* --------------------------------------------------------- room backdrop

    }

    for (let x = 10; x < w; x += 60) {

        p.rect(x, y + 1, 46, 1, P.wallL);

    // --- ceiling: duct run, strip lights, valve wheels
    p.rect(0, 0, w, 16, P.wallD);
    p.rect(0, 16, w, 3, P.pipeD);

    for (let x = 0; x < w; x += 30) { p.rect(x, 2, 2, 12, P.steelDD); p.rect(x + 12, 5, 8, 2, P.pipe); }

    }

    // --- viewports on to the void

    p.rect(0, cw - 12, w, 2, P.steelD);
    for (let x = 0; x < w; x += 3) {

    for (let x = 12; x < w - 50; x += 60) {
      const kind = Math.floor(rnd() * 3);
      const y = 128;
      if (kind === 0) {                                  // locker bank
        p.round(x, y, 44, 56, 2, P.steelDD);
        for (let i = 0; i < 2; i++) {
          p.round(x + 2 + i * 21, y + 2, 19, 52, 1, P.steelD);
          p.rect(x + 4 + i * 21, y + 6, 15, 1, P.steelDD);
          p.rect(x + 16 + i * 21, y + 26, 3, 5, P.steel);
        }
      } else if (kind === 1) {                           // wall monitor + notices
        p.round(x + 2, y, 40, 26, 2, P.steelDD);
        p.rect(x + 5, y + 3, 34, 20, P.screenD);
        for (let i = 0; i < 5; i++) p.rect(x + 7, y + 5 + i * 4, 6 + ((i * 11) % 24), 2, i ? P.screenL : P.amber);
        p.round(x + 6, y + 32, 14, 18, 1, '#c8c2b0');
        for (let i = 0; i < 5; i++) p.rect(x + 8, y + 35 + i * 3, 10, 1, '#8a8478');
        p.round(x + 24, y + 34, 14, 16, 1, '#c8c2b0');

  /* ------------------------------------------------------- moon / planet art
     A big detailed body for the sky: maria, craters with rim light, a soft
     terminator and a thin lit limb. */
  function buildMoon(size, tint, seed) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const c = cv.getContext('2d');
    const r = size / 2 - 1;
    const cx = size / 2, cy = size / 2;
    const rnd = U.mulberry32(seed || 7);

    function shade(col, f) {
      const n = parseInt(col.slice(1), 16);
      const R = U.clamp(((n >> 16) & 255) * f, 0, 255) | 0;
      const G = U.clamp(((n >> 8) & 255) * f, 0, 255) | 0;
      const B = U.clamp((n & 255) * f, 0, 255) | 0;
      return 'rgb(' + R + ',' + G + ',' + B + ')';
    }

    c.fillStyle = shade(tint, 0.75);
    c.beginPath(); c.arc(cx, cy, r, 0, U.TAU); c.fill();

    c.save();
    c.beginPath(); c.arc(cx, cy, r, 0, U.TAU); c.clip();

    // maria: broad dark seas
    for (let i = 0; i < 6; i++) {
      const a = rnd() * U.TAU, d = rnd() * r * 0.7;
      c.fillStyle = shade(tint, 0.5 + rnd() * 0.12);
      c.beginPath();
      c.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r * (0.16 + rnd() * 0.24), 0, U.TAU);
      c.fill();
    }
    // craters, biggest first
    const craters = [];
    for (let i = 0; i < 46; i++) {
      const a = rnd() * U.TAU, d = Math.sqrt(rnd()) * r * 0.94;
      craters.push({ x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d, r: (0.5 + rnd() * rnd() * 5.5) * (size / 90) });
    }
    craters.sort((p1, p2) => p2.r - p1.r);
    for (const k of craters) {
      c.fillStyle = shade(tint, 0.98);          // sunlit upper rim
      c.beginPath(); c.arc(k.x, k.y - k.r * 0.16, k.r, 0, U.TAU); c.fill();
      c.fillStyle = shade(tint, 0.42);          // shadowed floor
      c.beginPath(); c.arc(k.x, k.y + k.r * 0.2, k.r * 0.78, 0, U.TAU); c.fill();
      c.fillStyle = shade(tint, 0.62);
      c.beginPath(); c.arc(k.x, k.y + k.r * 0.05, k.r * 0.5, 0, U.TAU); c.fill();
    }
    // dust speckle
    for (let i = 0; i < size * 3; i++) {
      c.fillStyle = shade(tint, rnd() > 0.5 ? 1.12 : 0.7);
      c.globalAlpha = 0.3;
      c.fillRect((rnd() * size) | 0, (rnd() * size) | 0, 1, 1);
    }
    c.globalAlpha = 1;

    // terminator: night creeping in from the lower left
    const term = c.createLinearGradient(0, size, size * 0.85, 0);
    term.addColorStop(0, 'rgba(4,2,12,0.94)');
    term.addColorStop(0.45, 'rgba(4,2,12,0.55)');
    term.addColorStop(0.8, 'rgba(4,2,12,0)');
    c.fillStyle = term;
    c.fillRect(0, 0, size, size);

    // lit limb
    c.strokeStyle = shade(tint, 1.5);
    c.lineWidth = Math.max(1, size / 90);
    c.beginPath(); c.arc(cx, cy, r - 0.5, -1.5, 0.7); c.stroke();
    c.restore();
    return cv;
  }

/* Deep-space backdrop: a spiral arm of stars and dust, coloured nebulae, a sun

  function shade(hex, f, alpha) {

    return alpha === undefined ? 'rgb(' + r + ',' + g + ',' + b + ')' : 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  /* The galactic band: thousands of tiny stars concentrated along a tilted

    grd.addColorStop(0.5, 'rgba(70,40,120,0.35)');
    grd.addColorStop(1, 'rgba(30,15,60,0)');
    c.fillStyle = grd;
    c.save(); c.translate(W / 2, H / 2); c.rotate(-0.42); c.fillRect(-W, -90, W * 2, 180); c.restore();
    for (let i = 0; i < 5200; i++) {
      const t = rnd();
      const along = (rnd() - 0.5) * W * 1.6;
      const spread = (rnd() + rnd() + rnd() - 1.5) * 70;
      const x = W / 2 + along * Math.cos(-0.42) - spread * Math.sin(-0.42);
      const y = H / 2 + along * Math.sin(-0.42) + spread * Math.cos(-0.42);
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const big = t > 0.985;

    for (let l = 0; l < 3; l++) {
      const arr = [];
      for (let i = 0; i < 110 - l * 25; i++) arr.push({ x: rnd() * 1.5, y: rnd() * 1.5, s: l === 2 && rnd() > 0.7 ? 2 : 1, tw: rnd() * 6.28, c: rnd() > 0.88 ? '#ffd9a0' : (rnd() > 0.72 ? '#a9d8ff' : '#ffffff') });
      layers.stars.push(arr);
    }
    return layers;
  }

  /* Draw the whole sky. `cam` in world px; `skyTint` is the world's own hue. */
  function draw(ctx, cam, time, seed, skyTint, opts) {
    opts = opts || {};
    const L = ensure(seed);
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, skyTint || '#0b0720');
    g.addColorStop(1, '#04030d');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

    // galactic band, slow parallax, tiled horizontally
    const bx = -((cam.x * 0.012) % 960), by = -60 - (cam.y * 0.008) % 40;
    ctx.globalAlpha = 0.9;
    ctx.drawImage(L.band, bx, by, 960, 540);
    ctx.drawImage(L.band, bx + 960, by, 960, 540);
    ctx.globalAlpha = 0.85;
    ctx.drawImage(L.nebulae, -((cam.x * 0.02) % VW) - 2, -((cam.y * 0.015) % 60) - 2, VW + 4, VH + 64);
    ctx.globalAlpha = 1;

    for (let l = 0; l < L.stars.length; l++) {
      const par = 0.03 + l * 0.05;
      for (const st of L.stars[l]) {
        const x = ((st.x * VW * 1.5 - cam.x * par) % (VW * 1.5) + VW * 1.5) % (VW * 1.5);
        const y = ((st.y * VH * 1.5 - cam.y * par * 0.7) % (VH * 1.5) + VH * 1.5) % (VH * 1.5);
        if (x > VW || y > VH) continue;
        ctx.globalAlpha = (0.55 + 0.45 * Math.sin(time * 2 + st.tw)) * (0.4 + l * 0.25);
        ctx.fillStyle = st.c;
        ctx.fillRect(x | 0, y | 0, st.s, st.s);
      }
    }
    ctx.globalAlpha = 1;

    const sun = L.sun;
    ctx.drawImage(sun.cv, (sun.x * VW - cam.x * sun.p - sun.cv.width / 2) | 0, (sun.y * VH - cam.y * sun.p * 0.7 - sun.cv.height / 2) | 0);

    for (const pl of L.planets) {
      const x = ((pl.x * VW * 1.3 - cam.x * pl.p) % (VW * 1.3) + VW * 1.3) % (VW * 1.3) - pl.cv.width / 2;
      const y = pl.y * VH - cam.y * pl.p * 0.6 - pl.cv.height / 2;
      ctx.drawImage(pl.cv, x | 0, y | 0);
    }

    // shooting stars, occasionally
    if (Math.random() < 0.004 && L.shooters.length < 2) L.shooters.push({ x: Math.random() * VW, y: Math.random() * VH * 0.5, vx: 260 + Math.random() * 200, vy: 90 + Math.random() * 80, life: 0.6 });
    for (let i = L.shooters.length - 1; i >= 0; i--) {
      const s = L.shooters[i];
      s.life -= 1 / 60; s.x += s.vx / 60; s.y += s.vy / 60;
      if (s.life <= 0) { L.shooters.splice(i, 1); continue; }
      ctx.strokeStyle = 'rgba(255,255,255,' + (s.life).toFixed(2) + ')'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 0.06, s.y - s.vy * 0.06); ctx.stroke();
    }
  }

  PD.galaxy = { draw, ensure, buildPlanet, buildSun };
})(window.PD);

    ']': ['.###.', '...#.', '...#.', '...#.', '...#.', '...#.', '.###.'],
    "'": ['..#..', '..#..', '.....', '.....', '.....', '.....', '.....'],
    '<': ['....#', '...#.', '..#..', '.#...', '..#..', '...#.', '....#'],
    '>': ['#....', '.#...', '..#..', '...#.', '..#..', '.#...', '#....'],
    '*': ['.....', '#.#.#', '.###.', '#####', '.###.', '#.#.#', '.....'],
    '#': ['.#.#.', '#####', '.#.#.', '#####', '.#.#.', '.....', '.....'],
    '_': ['.....', '.....', '.....', '.....', '.....', '.....', '#####'],
    '|': ['..#..', '..#..', '..#..', '..#..', '..#..', '..#..', '..#..']

  const GW = 5, GH = 7, GAP = 1;
  const cache = {};   // color -> { char: canvas }

  function glyph(ch, color) {
    let byColor = cache[color];
    if (!byColor) byColor = cache[color] = {};
    if (byColor[ch]) return byColor[ch];
    const rows = G[ch] || G['?'];
    const cv = document.createElement('canvas');
    cv.width = GW; cv.height = GH;
    const c = cv.getContext('2d');
    c.fillStyle = color;
    for (let y = 0; y < GH; y++) {
      const r = rows[y];
      for (let x = 0; x < GW; x++) if (r[x] === '#') c.fillRect(x, y, 1, 1);
    }
    byColor[ch] = cv;
    return cv;
  }

  function width(str, scale) {
    scale = scale || 1;
    return str.length * (GW + GAP) * scale - GAP * scale;
  }

  /* opts: { scale, center, right, shadow, alpha } */
  function draw(ctx, str, x, y, color, opts) {
    opts = opts || {};
    const s = opts.scale || 1;
    str = String(str).toUpperCase();
    let px = Math.round(x);
    if (opts.center) px = Math.round(x - width(str, s) / 2);
    else if (opts.right) px = Math.round(x - width(str, s));
    const py = Math.round(y);
    if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;

    if (opts.shadow !== false) {
      let sx = px;
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (ch !== ' ') ctx.drawImage(glyph(ch, opts.shadow || '#150c28'), 0, 0, GW, GH, sx, py + s, GW * s, GH * s);
        sx += (GW + GAP) * s;
      }
    }
    let cx = px;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (ch !== ' ') ctx.drawImage(glyph(ch, color), 0, 0, GW, GH, cx, py, GW * s, GH * s);
      cx += (GW + GAP) * s;
    }
    if (opts.alpha !== undefined) ctx.globalAlpha = 1;
    return px;
  }

  PD.font = { draw, width, GW, GH, GAP, lineHeight: s => (GH + 3) * (s || 1) };
})(window.PD);

/* ===== src/audio.js ===== */
/* Everything you hear is synthesised on the fly with WebAudio -- no asset
   files, and the drill can track its pitch to how hard the rock is. */
(function (PD) {
  'use strict';
  const U = PD.util;

  let ctx = null, master = null, sfxBus = null, musBus = null, noiseBuf = null;
  let ready = false;
  const state = { sfx: true, music: true };

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    musBus = ctx.createGain(); musBus.gain.value = 0.34; musBus.connect(master);

    const len = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    ready = true;
  }

  function resume() {
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }

  const now = () => ctx.currentTime;

  function env(node, t0, peak, attack, decay, hold) {
    const g = node.gain;
    g.setValueAtTime(0.0001, t0);
    g.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + attack);
    if (hold) g.setValueAtTime(Math.max(0.0002, peak), t0 + attack + hold);
    g.exponentialRampToValueAtTime(0.0001, t0 + attack + (hold || 0) + decay);
  }

  function tone(freq, opts) {
    if (!ready || !state.sfx) return;
    opts = opts || {};
    const t0 = now() + (opts.delay || 0);
    const o = ctx.createOscillator();
    o.type = opts.type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (opts.to) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.to), t0 + (opts.dur || 0.12));
    const g = ctx.createGain();
    env(g, t0, opts.vol === undefined ? 0.2 : opts.vol, opts.attack || 0.005, opts.dur || 0.12, opts.hold || 0);
    let out = g;
    if (opts.filter) {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = opts.filter;
      g.connect(f); out = f;
    }
    o.connect(g); out.connect(sfxBus);
    o.start(t0); o.stop(t0 + (opts.dur || 0.12) + (opts.hold || 0) + 0.06);
  }

    if (!ready || !state.sfx) return;
    opts = opts || {};

    src.buffer = noiseBuf;
    src.playbackRate.value = opts.rate || 1;
    const f = ctx.createBiquadFilter();
    f.type = opts.type || 'lowpass';
    f.frequency.setValueAtTime(opts.from || 1800, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, opts.to || 300), t0 + (opts.dur || 0.2));
    f.Q.value = opts.q || 1;
    const g = ctx.createGain();
    env(g, t0, opts.vol === undefined ? 0.25 : opts.vol, opts.attack || 0.004, opts.dur || 0.2, opts.hold || 0);
    src.connect(f); f.connect(g); g.connect(sfxBus);

  }

  let drillNodes = null;
  function drill(on, pitch) {
    if (!ready) return;
    if (on && state.sfx) {
      if (!drillNodes) {
        const src = ctx.createBufferSource();
        src.buffer = noiseBuf; src.loop = true;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 2.2;
        const lo = ctx.createOscillator(); lo.type = 'sawtooth'; lo.frequency.value = 62;
        const loG = ctx.createGain(); loG.gain.value = 0.05;
        const g = ctx.createGain(); g.gain.value = 0.0001;
        src.connect(bp); bp.connect(g); lo.connect(loG); loG.connect(g); g.connect(sfxBus);
        src.start(); lo.start();
        drillNodes = { src, bp, g, lo, loG };

      const p = pitch || 0;
      drillNodes.bp.frequency.setTargetAtTime(560 + p * 900, now(), 0.05);
      drillNodes.lo.frequency.setTargetAtTime(52 + p * 40, now(), 0.05);
      drillNodes.g.gain.setTargetAtTime(0.16, now(), 0.02);

        f.type = 'lowpass'; f.frequency.value = 420; f.Q.value = 0.8;

    coin(i) {
      tone(880 + (i % 6) * 110, { type: 'square', dur: 0.07, vol: 0.09 });
      tone(1320 + (i % 6) * 110, { type: 'sine', dur: 0.1, vol: 0.06, delay: 0.03 });

    sell() {

    killMob() {

    hurt() {
      tone(180, { type: 'sawtooth', to: 70, dur: 0.26, vol: 0.2 });

    boom(size) {

      tone(200 + i * 80, { type: 'square', to: 90, dur: 0.1, vol: 0.07 });
    },
    rumble() {
      noise({ from: 220, to: 40, dur: 1.6, vol: 0.3, rate: 0.4, attack: 0.6 });
    },
    dock() {
      [0, 5, 9].forEach((s, i) => tone(392 * Math.pow(2, s / 12), { type: 'triangle', dur: 0.34, vol: 0.12, delay: i * 0.05 }));
    },
    buy() {
      tone(660, { type: 'square', dur: 0.08, vol: 0.14 });
      tone(990, { type: 'square', dur: 0.14, vol: 0.12, delay: 0.07 });
    },
    deny() { tone(200, { type: 'square', to: 140, dur: 0.16, vol: 0.13 }); },
    click() { tone(1100, { type: 'square', dur: 0.04, vol: 0.07 }); },
    alarm() {
      tone(880, { type: 'square', dur: 0.11, vol: 0.11 });
      tone(880, { type: 'square', dur: 0.11, vol: 0.11, delay: 0.16 });
    },
    warp() {
      tone(180, { type: 'sawtooth', to: 2400, dur: 1.1, vol: 0.16, filter: 4000 });
      noise({ from: 200, to: 4000, dur: 1.1, vol: 0.12, attack: 0.5 });
    },
    fanfare() {
      [0, 4, 7, 12, 16, 19].forEach((s, i) =>
        tone(392 * Math.pow(2, s / 12), { type: 'triangle', dur: 0.4, vol: 0.15, delay: i * 0.11 }));

  };

  /* --------------------------------------------------------------- the music

  const SCALE = [0, 3, 5, 7, 10];          // minor pentatonic
  const BASS = [0, 0, 3, 0, -2, -2, 5, 3];
  let step = 0, nextTime = 0, musicOn = false, intensity = 0;

    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

/* Keyboard + mouse. Screen coordinates are converted to the low-res internal

(function (PD) {
  'use strict';

  const keys = {};        // held
  const pressed = {};     // edge-triggered, cleared each frame
  const released = {};

  const mouse = {
    sx: 0, sy: 0,          // css pixels inside the canvas element
    x: 0, y: 0,            // internal canvas pixels (filled by game)
    wx: 0, wy: 0,          // world pixels (filled by game)
    left: false, right: false,
    leftPressed: false, rightPressed: false,
    wheel: 0, inside: false

    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
    Space: 'space', ShiftLeft: 'shift', ShiftRight: 'shift',
    Escape: 'esc', Enter: 'enter'
  };

      keys[c] = true;

      if (firstTouch) firstTouch();
    });

      const c = code(e);
      keys[c] = false;
      released[c] = true;
    });

      for (const k in keys) keys[k] = false;
      mouse.left = mouse.right = false;
    });

      mouse.sy = e.clientY - r.top;

      if (e.button === 2) { mouse.right = true; mouse.rightPressed = true; }
      e.preventDefault();
      if (firstTouch) firstTouch();

      if (e.button === 0) mouse.left = false;
      if (e.button === 2) mouse.right = false;

    for (const k in released) released[k] = false;

      const sp = U.rand(30, 130);

        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
        life: U.rand(0.18, 0.5), size: U.rand(1, 2.2),
        color: U.chance(0.35) ? '#fff6c8' : U.pick(cols), grav: 1.1, drag: 0.86, glow: U.chance(0.3) ? 1 : 0

      const a = U.rand(0, U.TAU);
      const sp = U.rand(4, spread || 40);
      spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: U.rand(0.3, 0.9), size: U.rand(1.4, 3.4),
        color: color || '#a08c7a', grav: 0.1, drag: 0.88

      const sp = U.rand(0.2, 1) * (power || 120);
      spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: U.rand(0.3, 1.0), size: U.rand(1, 3),
        color: U.pick(colors), grav: 0.3, drag: 0.9, glow: glow ? 1 : (U.chance(0.4) ? 1 : 0)

        const cv = document.createElement('canvas');
        cv.width = TILE; cv.height = TILE;
        const c = cv.getContext('2d');
        c.fillStyle = m.c[1];
        c.fillRect(0, 0, TILE, TILE);
        // speckle the tile so large rock faces do not look flat
        for (let i = 0; i < 7; i++) {
          const h = U.hash2(v * 31 + i, m.id * 17 + i * 3);
          const x = Math.floor(h * TILE);
          const y = Math.floor(U.hash2(m.id + i * 7, v * 13 + 5) * TILE);
          const s = h > 0.72 ? 2 : 1;
          c.fillStyle = h > 0.5 ? m.c[0] : m.c[2];
          c.globalAlpha = 0.55;
          c.fillRect(x, y, s, s);
        }
        c.globalAlpha = 1;
        variants.push(cv);
      }
      atlas[m.id] = variants;

      const e = document.createElement('canvas');
      e.width = TILE; e.height = 3;
      const ec = e.getContext('2d');
      ec.fillStyle = m.c[0];
      ec.fillRect(0, 0, TILE, 2);
      ec.globalAlpha = 0.5;
      ec.fillRect(0, 2, TILE, 1);
      edgeCache[m.id] = e;
    }

    crackCv = [];
    for (let stage = 0; stage < 3; stage++) {
      const cv = document.createElement('canvas');
      cv.width = TILE; cv.height = TILE;
      const c = cv.getContext('2d');
      c.fillStyle = 'rgba(10,6,20,0.75)';
      const n = 4 + stage * 5;
      for (let i = 0; i < n; i++) {
        const x = Math.floor(U.hash2(i * 3 + stage * 41, 7) * TILE);
        const y = Math.floor(U.hash2(i * 11 + 3, stage * 17) * TILE);
        c.fillRect(x, y, 1 + (stage > 1 ? 1 : 0), 1);
      }
      crackCv.push(cv);
    }
  }

  /* ------------------------------------------------------------------- world */
  function World(body, index) {
    this.body = body;
    this.index = index;
    this.radius = body.radius;
    this.w = body.radius * 2 + MARGIN * 2;
    this.h = SKY + body.radius * 2 + 10;
    this.cx = this.w / 2;
    this.cy = SKY + body.radius;
    this.pxW = this.w * TILE;
    this.pxH = this.h * TILE;
    this.bodyTopPx = (this.cy - this.radius) * TILE;
    this.centerPx = { x: this.cx * TILE, y: this.cy * TILE };

    this.cells = new Uint8Array(this.w * this.h);
    this.dmg = new Float32Array(this.w * this.h);
    this.heat = new Float32Array(this.w * this.h);
    this.inside = new Uint8Array(this.w * this.h);    // silhouette mask: cave backdrop goes here
    this.stratum = new Uint8Array(this.w * this.h);   // which depth band a cell belongs to
    this.seen = new Uint8Array(this.w * this.h);      // fog of war for the minimap
    this.pois = [];                                    // ruins etc. the game spawns things at
    this.strata = D.STRATA[body.type] || D.STRATA.rock;

    this.coreCells = [];
    this.coreMax = body.coreHp;
    this.coreHp = body.coreHp;
    this.mined = 0;
    this.totalSolid = 0;

    this.hardness = 1 + index * 0.14;
    this.seed = 1000 + index * 977;
    this.generate();
    this.buildBackdrop();
    this.buildStars();
  }

  World.prototype.idx = function (cx, cy) { return cy * this.w + cx; };
  World.prototype.inBounds = function (cx, cy) { return cx >= 0 && cy >= 0 && cx < this.w && cy < this.h; };
  World.prototype.at = function (cx, cy) {
    if (!this.inBounds(cx, cy)) return 0;
    return this.cells[cy * this.w + cx];
  };

  /* Pick from a [[key, weight]...] table using a 0..1 value, so neighbouring
     cells sharing a noise value share a rock and the base fill clumps. */
  function pickTable(table, t) {
    let total = 0;
    for (const e of table) total += e[1];
    let acc = 0;
    for (const e of table) {
      acc += e[1] / total;
      if (t <= acc) return M[e[0]];
    }
    return M[table[table.length - 1][0]];
  }

  World.prototype.stratumFor = function (depth) {
    const st = this.strata;
    for (let i = 0; i < st.length; i++) if (depth >= st[i].a && depth < st[i].b) return i;
    return st.length - 1;
  };

  World.prototype.generate = function () {
    const b = this.body, s = this.seed;
    const r = this.radius;
    // Core and chamber scale with the body: a pebble must not be two thirds
    // hollow, and a superplanet needs room to fight the Warden in.
    const coreR = Math.max(2.6, r * 0.1 + 1.2);
    const chamberR = coreR + U.clamp(r * 0.14, 3.5, 11);
    const strata = this.strata;

    for (let cy = 0; cy < this.h; cy++) {
      for (let cx = 0; cx < this.w; cx++) {
        const dx = cx + 0.5 - this.cx, dy = cy + 0.5 - this.cy;
        const d = Math.sqrt(dx * dx + dy * dy);
        const ang = Math.atan2(dy, dx);
        // lumpy silhouette so bodies read as hand-drawn rocks
        const wobble = (U.fbm(Math.cos(ang) * 2 + s, Math.sin(ang) * 2 + s, 3) - 0.5) * r * 0.22
                     + (U.noise2(Math.cos(ang) * 6 + s, Math.sin(ang) * 6 + s) - 0.5) * r * 0.09;
        const rEff = r + wobble;
        if (d > rEff) continue;

        const i = this.idx(cx, cy);
        this.inside[i] = 1;
        const depth = 1 - d / Math.max(1, rEff);   // 0 at surface, 1 at core
        const si = this.stratumFor(depth);
        const L0 = strata[si];
        this.stratum[i] = si;
        let mat;

        if (d < coreR) { mat = M.core; }
        else if (d < chamberR) { mat = 0; }        // hollow core chamber
        else {
          // pocket biome: swap in the stratum's alternate table where the
          // slow biome noise runs hot
          const biome = U.fbm(cx * 0.05 + s * 2, cy * 0.05 - s * 2, 2);
          const pocket = L0.alt && biome > U.fbmThreshold(0.3, 0.52, 0.14);
          const fills = pocket ? L0.alt.fills : L0.fills;
          const ores = pocket ? L0.alt.ores : L0.ores;

          // caves: tight worm tunnels plus a few grand caverns
          const tunnel = U.fbm(cx * 0.12 + s, cy * 0.12 - s, 3);
          const cavern = U.fbm(cx * 0.045 - s, cy * 0.05 + s, 2);
          const caveWant = L0.caves * (0.22 + depth * 0.6);
          if (depth > 0.1 && (tunnel > U.fbmThreshold(caveWant, 0.52, 0.145) ||
              cavern > U.fbmThreshold(caveWant * 0.28, 0.52, 0.15))) {
            this.cells[i] = 0; continue;
          }

          if (depth < 0.07) {
            mat = pickTable(strata[0].fills, U.hash2(cx, cy));
          } else {
            const fillT = U.clamp((U.fbm(cx * 0.055 + s * 5, cy * 0.055 + s * 7, 2) - 0.22) / 0.6, 0, 0.999);
            mat = pickTable(fills, fillT);

            // veins, valuable first so the rarest ore wins a contested tile
            const totalW = ores.reduce((t, o) => t + o[1], 0);
            const sorted = ores.slice().sort((a, x) => D.MAT[M[x[0]]].cr - D.MAT[M[a[0]]].cr);
            for (const [okey, wt] of sorted) {
              const oid = M[okey];
              const om = D.MAT[oid];
              const share = wt / Math.max(1, totalW);
              const rarity = U.clamp(om.cr / 5000, 0, 1);
              // the good stuff only shows up once you have committed to the dig
              if (depth < rarity * 0.3) continue;
              // steep curve: a 2000-credit ore is a find, a 40000-credit one a legend
              const scarce = Math.max(0.03, Math.pow(1 - rarity, 1.7)) * (om.shine ? 0.6 : 1);
              const want = U.clamp(share * (0.3 + depth * 1.0) * scarce, 0, 0.6);
              if (want <= 0) continue;
              const vein = U.fbm(cx * 0.24 + oid * 21 + s, cy * 0.24 - oid * 13 - s, 2);
              if (vein > U.fbmThreshold(want, 0.52, 0.155)) { mat = oid; break; }
            }

            // magma pockets in the hot bands
            if (L0.lava) {
              const hot = U.fbm(cx * 0.16 + s * 3, cy * 0.16 + s * 9, 2);
              if (hot > U.fbmThreshold(L0.lava, 0.52, 0.15)) mat = M.lava;
            }
          }
        }
        this.cells[i] = mat;
        if (mat === M.core) this.coreCells.push(i);
        if (mat) this.totalSolid++;
      }
    }

    this.coreCenter = { x: this.cx * TILE, y: this.cy * TILE };
    this.coreR = coreR * TILE;
    this.chamberR = chamberR * TILE;

    this.carveCraters(r);
    this.lavaLakes();
    this.placePois();

    // a crust skin makes the silhouette crisp and gives a surface to land on
    for (let cy = 0; cy < this.h; cy++) {
      for (let cx = 0; cx < this.w; cx++) {
        const i = this.idx(cx, cy);
        const m = this.cells[i];
        if (!m || m === M.core || m === M.lava) continue;
        if (!this.at(cx, cy - 1) && this.stratum[i] === 0 && U.hash2(cx, cy) > 0.25) {
          if (D.MAT[m].cr < 40) this.cells[i] = pickTable(this.strata[0].fills, U.hash2(cy, cx));
        }
      }
    }
  };

  /* Molten pools settle on cavern floors in the hot strata. */
  World.prototype.lavaLakes = function () {
    const rnd = U.mulberry32(this.seed + 99);
    for (let cy = 1; cy < this.h - 1; cy++) {
      for (let cx = 1; cx < this.w - 1; cx++) {
        const i = this.idx(cx, cy);
        if (!this.inside[i] || this.cells[i]) continue;
        const L0 = this.strata[this.stratum[i]];
        if (!L0.lava) continue;
        if (!this.at(cx, cy + 1) || this.at(cx, cy + 1) === M.lava) continue;
        if (rnd() > L0.lava * 0.9) continue;
        // spread sideways along the floor
        for (let k = -4; k <= 4; k++) {
          const x2 = cx + k;
          if (!this.inBounds(x2, cy)) continue;
          const j = this.idx(x2, cy);
          if (this.cells[j] || !this.inside[j]) continue;
          if (!this.at(x2, cy + 1)) continue;
          this.cells[j] = M.lava;
          if (rnd() > 0.55 && !this.cells[j - this.w]) this.cells[j - this.w] = M.lava;
        }
      }
    }
  };

  /* Points of interest: geodes, fossil beds and precursor ruins. */
  World.prototype.placePois = function () {
    const rnd = U.mulberry32(this.seed + 4242);
    const r = this.radius;
    const poi = this.body.poi || {};
    const spot = (dmin, dmax) => {
      for (let t = 0; t < 60; t++) {
        const ang = rnd() * U.TAU, dd = r * (1 - (dmin + rnd() * (dmax - dmin)));
        const cx = Math.round(this.cx + Math.cos(ang) * dd), cy = Math.round(this.cy + Math.sin(ang) * dd);
        if (!this.inBounds(cx, cy) || !this.inside[this.idx(cx, cy)]) continue;
        if (U.dist(cx, cy, this.cx, this.cy) < this.chamberR / TILE + 6) continue;
        return { cx, cy };
      }
      return null;
    };
    const gemsFor = (cx, cy) => {
      const L0 = this.strata[this.stratum[this.idx(cx, cy)]];
      const shiny = L0.ores.filter(o => D.MAT[M[o[0]]].shine);
      return shiny.length ? shiny : [['crystal', 1]];
    };

    for (let n = 0; n < (poi.geode || 0); n++) {
      const at = spot(0.25, 0.85); if (!at) continue;
      const R = 2.5 + rnd() * 3.5;
      const gems = gemsFor(at.cx, at.cy);
      for (let cy = Math.floor(at.cy - R - 2); cy <= at.cy + R + 2; cy++) {
        for (let cx = Math.floor(at.cx - R - 2); cx <= at.cx + R + 2; cx++) {
          if (!this.inBounds(cx, cy)) continue;
          const i = this.idx(cx, cy);
          if (!this.inside[i] || this.cells[i] === M.core) continue;
          const d = U.dist(cx + 0.5, cy + 0.5, at.cx + 0.5, at.cy + 0.5);
          if (d < R) this.cells[i] = 0;
          else if (d < R + 1.6) this.cells[i] = rnd() > 0.45 ? M.crystal : M[pickTableKey(gems, rnd())];
        }
      }
      this.pois.push({ kind: 'geode', cx: at.cx, cy: at.cy });
    }

    for (let n = 0; n < (poi.fossil || 0); n++) {
      const at = spot(0.3, 0.8); if (!at) continue;
      for (let k = 0; k < 9; k++) {
        const cx = at.cx + Math.round((rnd() - 0.5) * 7), cy = at.cy + Math.round((rnd() - 0.5) * 3);
        if (!this.inBounds(cx, cy)) continue;
        const i = this.idx(cx, cy);
        if (this.inside[i] && this.cells[i] && this.cells[i] !== M.core) this.cells[i] = M.fossil;
      }
    }

    for (let n = 0; n < (poi.ruin || 0); n++) {
      const at = spot(0.35, 0.8); if (!at) continue;
      const W = 8 + Math.floor(rnd() * 6), H = 5 + Math.floor(rnd() * 2);
      const x0 = at.cx - (W >> 1), y0 = at.cy - (H >> 1);
      let ok = true;
      for (let cy = y0 - 1; cy <= y0 + H; cy++) for (let cx = x0 - 1; cx <= x0 + W; cx++) {
        if (!this.inBounds(cx, cy) || !this.inside[this.idx(cx, cy)]) ok = false;
      }
      if (!ok) continue;
      for (let cy = y0 - 1; cy <= y0 + H; cy++) {
        for (let cx = x0 - 1; cx <= x0 + W; cx++) {
          const i = this.idx(cx, cy);
          const wall = cy === y0 - 1 || cy === y0 + H || cx === x0 - 1 || cx === x0 + W;
          this.cells[i] = wall ? M.hull : 0;
        }
      }
      // a plinth with the relic on it, and room for the loot
      const px = x0 + (W >> 1);
      this.cells[this.idx(px, y0 + H - 1)] = M.hull;
      this.cells[this.idx(px, y0 + H - 2)] = M.relic;
      // one doorway so it can be found by tunnelling in
      this.cells[this.idx(x0 - 1, y0 + H - 1)] = 0;
      this.cells[this.idx(x0 + W, y0 + H - 1)] = 0;
      this.pois.push({ kind: 'ruin', cx: at.cx, cy: at.cy, x0, y0, w: W, h: H });
    }
    this.totalSolid = 0;
    for (let i = 0; i < this.cells.length; i++) if (this.cells[i]) this.totalSolid++;
  };

  function pickTableKey(table, t) {
    let total = 0;
    for (const e of table) total += e[1];
    let acc = 0;
    for (const e of table) { acc += e[1] / total; if (t <= acc) return e[0]; }
    return table[table.length - 1][0];
  }

  World.prototype.carveCraters = function (r) {
    const rnd = U.mulberry32(this.seed + 17);
    const n = Math.round(4 + r * 0.32);
    for (let i = 0; i < n; i++) {
      const ang = rnd() * U.TAU;
      const rad = 1.6 + rnd() * rnd() * (2.2 + r * 0.11);
      const depth = rad * (0.45 + rnd() * 0.5);
      const ox = this.cx + Math.cos(ang) * (r + rad - depth);
      const oy = this.cy + Math.sin(ang) * (r + rad - depth);
      const c0 = Math.floor(ox - rad - 1), c1 = Math.ceil(ox + rad + 1);
      const r0 = Math.floor(oy - rad - 1), r1 = Math.ceil(oy + rad + 1);
      for (let cy = r0; cy <= r1; cy++) {
        for (let cx = c0; cx <= c1; cx++) {
          if (!this.inBounds(cx, cy)) continue;
          const dx = cx + 0.5 - ox, dy = cy + 0.5 - oy;
          if (dx * dx + dy * dy > rad * rad) continue;
          const i2 = this.idx(cx, cy);
          if (this.cells[i2] === M.core) continue;
          if (this.cells[i2]) this.totalSolid--;
          this.cells[i2] = 0;
          this.inside[i2] = 0;
        }
      }
    }
  };

  /* Dark rock face drawn behind caves so tunnels no longer show stars. */
  World.prototype.buildBackdrop = function () {
    this.bgAtlas = this.strata.map((L0, si) => {
      const variants = [];
      for (let v = 0; v < 4; v++) {
        const cv = document.createElement('canvas');
        cv.width = TILE; cv.height = TILE;
        const c = cv.getContext('2d');
        c.fillStyle = L0.tint;
        c.fillRect(0, 0, TILE, TILE);
        c.globalAlpha = 0.35;
        for (let k = 0; k < 6; k++) {
          const h = U.hash2(v * 17 + k, si * 31 + k * 5);
          c.fillStyle = h > 0.5 ? '#000000' : '#ffffff';
          c.globalAlpha = h > 0.5 ? 0.35 : 0.08;
          c.fillRect(Math.floor(h * TILE), Math.floor(U.hash2(k, v + si) * TILE), 1 + (k % 2), 1);
        }
        c.globalAlpha = 1;
        variants.push(cv);
      }
      return variants;
    });
  };

  /* Stratum under a world point -- for banners, ambience and light colour. */
  World.prototype.stratumAt = function (x, y) {
    const d = U.dist(x, y, this.coreCenter.x, this.coreCenter.y) / (this.radius * TILE);
    if (d > 1.02) return -1;
    return this.stratumFor(U.clamp(1 - d, 0, 1));
  };

  /* Mark everything the lamp can reach as seen, for the minimap. */
  World.prototype.reveal = function (x, y, radius) {
    const c0 = Math.max(0, Math.floor((x - radius) / TILE)), c1 = Math.min(this.w - 1, Math.ceil((x + radius) / TILE));
    const r0 = Math.max(0, Math.floor((y - radius) / TILE)), r1 = Math.min(this.h - 1, Math.ceil((y + radius) / TILE));
    const rr = radius * radius;
    for (let cy = r0; cy <= r1; cy++) {
      for (let cx = c0; cx <= c1; cx++) {
        const dx = cx * TILE + 5 - x, dy = cy * TILE + 5 - y;
        if (dx * dx + dy * dy <= rr) this.seen[cy * this.w + cx] = 1;
      }
    }
  };

  World.prototype.buildStars = function () {
    const rnd = U.mulberry32(this.seed);
    this.stars = [];
    for (let layer = 0; layer < 3; layer++) {
      const n = 90 - layer * 20;
      const arr = [];
      for (let i = 0; i < n; i++) {
        arr.push({
          x: rnd() * 1.4, y: rnd(),
          s: layer === 0 ? 1 : (rnd() > 0.75 ? 2 : 1),
          tw: rnd() * 6.28,
          c: rnd() > 0.86 ? '#ffd9a0' : (rnd() > 0.7 ? '#a9d8ff' : '#ffffff')
        });
      }
      this.stars.push(arr);
    }
    // a couple of distant sibling planets for depth
    this.decor = [];
    for (let i = 0; i < 3; i++) {
      this.decor.push({
        x: rnd(), y: rnd() * 0.55, r: 6 + rnd() * 16,
        c: U.pick(['#3b2a5c', '#2a3a5c', '#5c3a3a', '#2f4a42']),
        p: 0.06 + i * 0.05
      });
    }

    // a big cratered companion moon hanging over the dig site
    const size = 96 + Math.round(rnd() * 80);
    this.moon = {
      cv: PD.artint.buildMoon(size, this.body.tint, this.seed * 3 + 11),
      x: 0.12 + rnd() * 0.5, y: 0.05 + rnd() * 0.2, p: 0.035
    };
    // and a soft nebula wash behind everything
    this.nebula = buildNebula(this.body.sky, this.body.tint, this.seed);
  };

  /* Low-res coloured clouds, blown up with smoothing off for a chunky wash. */
  function buildNebula(sky, tint, seed) {
    const w = 60, h = 34;
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const img = c.createImageData(w, h);
    const tr = parseInt(tint.slice(1, 3), 16), tg = parseInt(tint.slice(3, 5), 16), tb = parseInt(tint.slice(5, 7), 16);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const n = U.fbm(x * 0.09 + seed, y * 0.13 - seed, 3);
        const a = U.clamp((n - 0.5) * 2.6, 0, 1);
        const i = (y * w + x) * 4;
        img.data[i] = tr * 0.55 + 40;
        img.data[i + 1] = tg * 0.5 + 26;
        img.data[i + 2] = tb * 0.7 + 70;
        img.data[i + 3] = a * 70;
      }
    }
    c.putImageData(img, 0, 0);
    return cv;
  }

  /* ------------------------------------------------------------- queries */
  World.prototype.solidAt = function (x, y) {
    const cx = Math.floor(x / TILE), cy = Math.floor(y / TILE);
    if (!this.inBounds(cx, cy)) return false;
    return this.cells[cy * this.w + cx] !== 0;
  };

  World.prototype.matAt = function (x, y) {
    const cx = Math.floor(x / TILE), cy = Math.floor(y / TILE);
    if (!this.inBounds(cx, cy)) return 0;
    return this.cells[cy * this.w + cx];
  };

  World.prototype.rectSolid = function (x, y, w, h) {
    const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.001) / TILE);
    const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 0.001) / TILE);
    for (let cy = y0; cy <= y1; cy++) {
      for (let cx = x0; cx <= x1; cx++) {
        if (!this.inBounds(cx, cy)) continue;
        if (this.cells[cy * this.w + cx]) return true;
      }
    }
    return false;
  };

  /* Gravity fades in as you approach the rock -- pure float in open space. */
  World.prototype.gravityAt = function (y) {
    const top = this.bodyTopPx;
    return this.body.gravity * U.smoothstep(top - 90, top + 40, y);
  };

  World.prototype.depthMeters = function (y) {
    return Math.max(0, Math.round((y - this.bodyTopPx) / TILE));
  };

  World.prototype.maxDepthMeters = function () {
    return Math.round((this.radius * 2) * 1);
  };

  /* --------------------------------------------------------------- drilling */
  World.prototype.tileHp = function (mat, cx, cy) {
    let h = D.MAT[mat].hp * this.hardness;
    if (cx !== undefined) {
      const si = this.stratum[this.idx(cx, cy)];
      h *= 1 + si * 0.22;           // every band down is tougher rock
    }
    return h;
  };

  /* Returns the material id if the tile broke this call, else 0. */
  World.prototype.damage = function (cx, cy, amount) {
    if (!this.inBounds(cx, cy)) return 0;
    const i = cy * this.w + cx;
    const mat = this.cells[i];
    if (!mat) return 0;
    if (mat === M.core) {
      this.coreHp = Math.max(0, this.coreHp - amount);
      this.dmg[i] += amount;
      return this.coreHp <= 0 ? M.core : 0;
    }
    this.dmg[i] += amount;
    if (this.dmg[i] >= this.tileHp(mat, cx, cy)) {
      const mm = D.MAT[mat];
      this.dmg[i] = 0;
      if (mm.drop) {                 // magma quenches into basalt; nothing to collect
        this.cells[i] = mm.drop;
        return -mat;
      }
      this.cells[i] = 0;
      this.mined++;
